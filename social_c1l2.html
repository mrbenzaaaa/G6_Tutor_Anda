<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson 2: Exploring Economics — Touchscreen Tutor</title>
<style>
  :root{
    --bg1:#eef7ff;
    --bg2:#fff7e8;
    --ink:#17324d;
    --muted:#58728a;
    --card:#ffffff;
    --blue:#2477d4;
    --blue2:#1559a6;
    --green:#1f9d69;
    --yellow:#ffd95a;
    --orange:#ff9f43;
    --red:#dc4c64;
    --purple:#7758d6;
    --shadow:0 12px 34px rgba(35,78,112,.14);
    --radius:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:
    radial-gradient(circle at 12% 10%, rgba(36,119,212,.13), transparent 28%),
    radial-gradient(circle at 88% 18%, rgba(255,159,67,.14), transparent 26%),
    linear-gradient(135deg,var(--bg1),var(--bg2));}
  body{min-height:100vh;overflow-x:hidden}
  button{font:inherit}
  .app{max-width:1180px;margin:0 auto;padding:18px 18px 28px}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
    padding:12px 16px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .brand{font-weight:800;font-size:clamp(18px,2vw,26px)}
  .section-pill{padding:8px 14px;border-radius:999px;background:#e8f2ff;color:var(--blue2);font-weight:800}
  .progress-wrap{display:flex;align-items:center;gap:10px;min-width:280px;flex:1;justify-content:flex-end}
  .progress{width:min(420px,52vw);height:12px;border-radius:999px;background:#dce9f5;overflow:hidden}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .3s ease}
  .progress-text{font-size:14px;color:var(--muted);font-weight:800;white-space:nowrap}
  .stage{
    min-height:690px;background:rgba(255,255,255,.94);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:clamp(22px,3vw,40px);position:relative;overflow:hidden;
  }
  .stage:before{
    content:"";position:absolute;right:-80px;top:-80px;width:240px;height:240px;border-radius:50%;
    background:rgba(36,119,212,.08)
  }
  .stage:after{
    content:"";position:absolute;left:-100px;bottom:-120px;width:300px;height:300px;border-radius:50%;
    background:rgba(255,217,90,.12)
  }
  .slide{position:relative;z-index:1;animation:fade .34s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3{margin-top:0;line-height:1.15}
  h1{font-size:clamp(34px,5vw,62px);margin-bottom:12px}
  h2{font-size:clamp(28px,3.6vw,44px);margin-bottom:14px}
  h3{font-size:clamp(20px,2.4vw,28px);margin-bottom:8px}
  p,li{font-size:clamp(18px,2vw,24px);line-height:1.48}
  .lead{font-size:clamp(21px,2.5vw,30px);color:#284d6c}
  .eyebrow{display:inline-block;background:#e9f4ff;color:var(--blue2);padding:8px 12px;border-radius:999px;font-weight:800;margin-bottom:14px}
  .grid{display:grid;gap:16px}
  .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{
    background:#fff;border:2px solid #e5eef6;border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(40,86,120,.08)
  }
  .card strong{color:var(--blue2)}
  .accent-blue{border-top:7px solid var(--blue)}
  .accent-green{border-top:7px solid var(--green)}
  .accent-orange{border-top:7px solid var(--orange)}
  .accent-purple{border-top:7px solid var(--purple)}
  .big-word{font-size:clamp(28px,4vw,44px);font-weight:900;color:var(--blue2)}
  .arrowline{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
  .chip{padding:12px 16px;border-radius:16px;background:#eff6ff;font-size:clamp(18px,2vw,24px);font-weight:800}
  .arrow{font-size:30px;font-weight:900;color:var(--orange)}
  .remember{
    margin-top:22px;background:linear-gradient(90deg,#fff6c8,#fff0a6);border:2px solid #f2cb3b;
    border-radius:18px;padding:15px 18px;font-size:clamp(18px,2vw,23px);font-weight:800;
  }
  .note{background:#eef9f4;border-left:6px solid var(--green);padding:14px 16px;border-radius:14px;margin:12px 0;font-size:clamp(17px,1.9vw,22px)}
  .warn{background:#fff2f2;border-left:6px solid var(--red);padding:14px 16px;border-radius:14px;margin:12px 0;font-size:clamp(17px,1.9vw,22px)}
  .teacher-def{background:#f5f1ff;border-left:6px solid var(--purple);padding:12px 14px;border-radius:12px;margin:9px 0;font-size:clamp(16px,1.8vw,21px)}
  table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #d9e6f2;border-radius:16px;background:#fff}
  th,td{padding:12px 14px;border-bottom:1px solid #e4edf5;text-align:left;font-size:clamp(15px,1.7vw,20px);vertical-align:top}
  th{background:#eaf4ff;color:#194e80}
  tr:last-child td{border-bottom:none}
  .nav{
    display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;margin-top:16px
  }
  .btn{
    border:none;border-radius:18px;padding:17px 20px;min-height:62px;font-weight:900;font-size:clamp(18px,2vw,23px);
    cursor:pointer;transition:transform .08s ease,box-shadow .2s ease,opacity .2s ease;
    box-shadow:0 7px 16px rgba(26,75,115,.13)
  }
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn-back{background:#e8eef5;color:#25445e}
  .btn-next{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}
  .btn-restart{background:#fff0e4;color:#9a4d12}
  .quiz-shell{position:relative;z-index:1}
  .qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .difficulty{padding:8px 12px;border-radius:999px;background:#eef3f8;font-weight:800}
  .scorepill{padding:8px 12px;border-radius:999px;background:#eaf8f1;color:#156b49;font-weight:900}
  .question{font-size:clamp(26px,3.6vw,42px);line-height:1.25;margin:18px 0 22px}
  .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .choice{
    text-align:left;border:3px solid #dbe7f1;border-radius:18px;background:white;padding:17px 18px;
    min-height:78px;font-size:clamp(18px,2.2vw,25px);font-weight:800;cursor:pointer;
    transition:.15s ease;box-shadow:0 5px 13px rgba(45,79,103,.07)
  }
  .choice:hover{border-color:#a9cae8}
  .choice.correct{border-color:var(--green);background:#eaf8f1;color:#116b49}
  .choice.wrong{border-color:var(--red);background:#fff0f2;color:#9d2940}
  .feedback{margin-top:18px;min-height:88px}
  .feedback .ok,.feedback .bad{font-size:clamp(22px,2.5vw,30px);font-weight:900}
  .ok{color:var(--green)} .bad{color:var(--red)}
  .explain{font-size:clamp(17px,1.9vw,22px);margin-top:7px}
  .quiz-next{margin-top:12px;width:100%;background:linear-gradient(135deg,var(--green),#147c52);color:#fff}
  .final-score{font-size:clamp(54px,8vw,90px);font-weight:900;color:var(--blue2);margin:8px 0}
  .review-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .review-tag{padding:10px 13px;background:#fff0f2;border:1px solid #f0b4bf;border-radius:999px;font-weight:800;color:#9b2e43}
  .strong-tag{padding:10px 13px;background:#eaf8f1;border:1px solid #a9dfc8;border-radius:999px;font-weight:800;color:#146b49}
  .small{font-size:15px;color:var(--muted)}
  .footer-note{text-align:center;color:#5d758b;font-size:14px;margin-top:10px}
  @media(max-width:850px){
    .grid.two,.grid.three,.grid.four,.choices{grid-template-columns:1fr}
    .stage{min-height:760px;padding:20px}
    .nav{grid-template-columns:1fr 1fr}
    .btn-next{grid-column:1/-1;grid-row:1}
    .progress-wrap{justify-content:flex-start;min-width:100%}
    .progress{width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">📘 Lesson 2: Exploring Economics</div>
    <div id="sectionPill" class="section-pill">Teaching Slides</div>
    <div class="progress-wrap">
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" class="progress-text"></div>
    </div>
  </div>

  <main id="stage" class="stage"></main>

  <div id="slideNav" class="nav">
    <button id="backBtn" class="btn btn-back">← Back</button>
    <button id="nextBtn" class="btn btn-next">Next →</button>
    <button id="restartBtn" class="btn btn-restart">↻ Restart</button>
  </div>
  <div class="footer-note">Self-contained offline lesson • Built only from the provided study material</div>
</div>

<script>
const slides = [
{
 section:"Teaching Slides",
 title:"Lesson 2 — Exploring Economics",
 body:`<div class="eyebrow">ESSENTIAL QUESTION</div>
 <h1>Why do people trade?</h1>
 <p class="lead">Most people in our society buy or sell goods and services every day. Trade has also shaped the course of history in major ways.</p>
 <div class="note"><strong>Goal:</strong> Understand the lesson, remember the teacher's vocabulary, and prepare for direct and scenario questions.</div>`,
 remember:"Trade happens because people can gain something from an exchange."
},
{
 section:"Teaching Slides",
 title:"What You Must Know",
 body:`<div class="grid two">
 <div class="card accent-blue"><h3>1. Resources & Production</h3><p>Land, labor, capital, entrepreneurship, technology</p></div>
 <div class="card accent-green"><h3>2. Supply & Demand</h3><p>What producers sell and what consumers buy</p></div>
 <div class="card accent-orange"><h3>3. Scarcity & Opportunity Cost</h3><p>Lack of a resource and what you give up</p></div>
 <div class="card accent-purple"><h3>4. Economic Systems</h3><p>Traditional, command, market, mixed</p></div>
 <div class="card accent-blue"><h3>5. Business Cycle</h3><p>Expansion, peak, recession, trough, inflation</p></div>
 <div class="card accent-green"><h3>6. Trade</h3><p>Exports, imports, barter, barriers</p></div>
 <div class="card accent-orange"><h3>7. Globalization</h3><p>Countries and economies become connected through trade</p></div>
 </div>`,
 remember:"7 big ideas: Resources → Market → Choices → Systems → Cycle → Trade → Globalization."
},
{
 section:"Teaching Slides",
 title:"Teacher Vocabulary 1–8",
 body:`<div class="teacher-def"><strong>1. Capital</strong> — money and goods used to help people make or do things</div>
 <div class="teacher-def"><strong>2. Entrepreneurship</strong> — the act of running a business and taking on the risks of that business</div>
 <div class="teacher-def"><strong>3. Supply</strong> — the amount of a good or service that a producer wants to sell</div>
 <div class="teacher-def"><strong>4. Demand</strong> — the amount of something that a consumer wants to buy</div>
 <div class="teacher-def"><strong>5. Scarcity</strong> — the lack of a resource</div>
 <div class="teacher-def"><strong>6. Opportunity Cost</strong> — what is given up, such as time or money, to make or buy something</div>
 <div class="teacher-def"><strong>7. Traditional Economy</strong> — an economic system in which custom decides what people do, make, buy, and sell</div>
 <div class="teacher-def"><strong>8. Command Economy</strong> — an economic system in which a central government decides what goods will be made and who will receive them</div>`,
 remember:"Know the teacher's definitions exactly, especially Supply, Demand, Scarcity, and Opportunity Cost."
},
{
 section:"Teaching Slides",
 title:"Teacher Vocabulary 9–16",
 body:`<div class="teacher-def"><strong>9. Recession</strong> — a period of slow economic growth or decline</div>
 <div class="teacher-def"><strong>10. Inflation</strong> — a continued rise in prices or the supply of money</div>
 <div class="teacher-def"><strong>11. Exports</strong> — a good sent from one country to another in trade</div>
 <div class="teacher-def"><strong>12. Import</strong> — a good brought into a country from another country</div>
 <div class="teacher-def"><strong>13. Barter</strong> — to trade by exchanging one good or service for another</div>
 <div class="teacher-def"><strong>14. Globalization</strong> — the growth in free trade between countries</div>
 <div class="teacher-def"><strong>15. Individual</strong> — a single human being</div>
 <div class="teacher-def"><strong>16. Expert</strong> — a skilled person who has mastered a subject</div>`,
 remember:"EXport goes OUT; IMport comes IN; barter is good/service for another good/service."
},
{
 section:"Teaching Slides",
 title:"Three Basic Economic Questions",
 body:`<p class="lead">Every economy must think about three questions.</p>
 <div class="grid three">
   <div class="card accent-blue"><div class="big-word">WHAT?</div><p>What goods and services should we offer?</p></div>
   <div class="card accent-green"><div class="big-word">HOW?</div><p>How should we create and distribute these goods and services?</p></div>
   <div class="card accent-orange"><div class="big-word">WHO?</div><p>Who will use these goods and services?</p></div>
 </div>`,
 remember:"WHAT → HOW → WHO"
},
{
 section:"Teaching Slides",
 title:"Resources and Production",
 body:`<p>People need <strong>resources</strong> to make goods and offer services.</p>
 <div class="arrowline">
   <div class="chip">Land</div><span class="arrow">+</span>
   <div class="chip">Labor</div><span class="arrow">+</span>
   <div class="chip">Capital</div><span class="arrow">+</span>
   <div class="chip">Entrepreneurship</div>
 </div>
 <div class="note">The lesson also explains <strong>technology</strong> as another kind of resource.</div>`,
 remember:"Production needs resources: Land + Labor + Capital + Entrepreneurship."
},
{
 section:"Teaching Slides",
 title:"Land and Labor",
 body:`<div class="grid two">
 <div class="card accent-green"><h3>🌍 Land</h3><p>Land includes the surface of Earth and natural resources such as <strong>minerals</strong> and <strong>water</strong>.</p><p>Good land and freshwater were very important to early farmers.</p></div>
 <div class="card accent-blue"><h3>👷 Labor</h3><p><strong>Labor</strong> is the ability of people to do work.</p><p>You need labor to make goods and provide services. Early rulers needed many workers for large projects.</p></div>
 </div>
 <div class="teacher-def"><strong>Academic Vocabulary:</strong> resource — something that is useful</div>`,
 remember:"Land = natural resources. Labor = people doing work."
},
{
 section:"Teaching Slides",
 title:"Capital, Entrepreneurship, Technology",
 body:`<div class="grid three">
 <div class="card accent-blue"><h3>💰 Capital</h3><p>Money and goods used to help people make or do things.</p><p>Early rulers gathered capital by collecting taxes.</p></div>
 <div class="card accent-orange"><h3>🚀 Entrepreneurship</h3><p>Running a business and taking on its risks.</p><p>Merchants showed entrepreneurship by trading goods to earn a profit.</p></div>
 <div class="card accent-purple"><h3>⚙️ Technology</h3><p>Using knowledge in a practical way to accomplish a task.</p><p>It can make creating goods <strong>easier and cheaper</strong>.</p></div>
 </div>
 <div class="teacher-def"><strong>Profit</strong> — an increase in the value of what they owned.</div>`,
 remember:"Capital = money/goods. Entrepreneurship = business + risk. Technology = easier + cheaper."
},
{
 section:"Teaching Slides",
 title:"Early Civilizations Used Resources",
 body:`<div class="grid two">
 <div class="card"><h3>Farmers</h3><p>Needed good land and freshwater.</p></div>
 <div class="card"><h3>Rulers</h3><p>Needed many workers for large projects and gathered capital by collecting taxes.</p></div>
 <div class="card"><h3>Merchants</h3><p>Showed entrepreneurship by trading goods to earn a profit.</p></div>
 <div class="card"><h3>Resources</h3><p>Land, labor, capital, entrepreneurship, and technology help people make goods or offer services.</p></div>
 </div>`,
 remember:"Early civilizations used the same basic resources: land, workers, capital, and business risk."
},
{
 section:"Teaching Slides",
 title:"Supply",
 body:`<div class="big-word">Supply = SELL</div>
 <p><strong>Supply</strong> is the amount of a good or service that a producer wants to sell.</p>
 <div class="arrowline">
   <div class="chip">Price goes UP ↑</div><span class="arrow">→</span><div class="chip">Producer wants to sell MORE</div>
 </div>
 <p>A producer wants to sell more when the price is higher.</p>`,
 remember:"Supply → Producer → SELL. Higher price → more supply."
},
{
 section:"Teaching Slides",
 title:"Demand",
 body:`<div class="big-word">Demand = BUY</div>
 <p><strong>Demand</strong> is the amount of something that a consumer wants to buy.</p>
 <div class="arrowline">
   <div class="chip">Price goes DOWN ↓</div><span class="arrow">→</span><div class="chip">Consumer wants to buy MORE</div>
 </div>
 <div class="arrowline">
   <div class="chip">Price goes UP ↑</div><span class="arrow">→</span><div class="chip">Consumer wants to buy LESS</div>
 </div>`,
 remember:"Demand → Consumer → BUY. Lower price → more demand."
},
{
 section:"Teaching Slides",
 title:"Price Changes and Equilibrium",
 body:`<div class="grid two">
 <div class="card accent-blue"><h3>If Price Goes UP</h3><p>Producers want to sell <strong>more</strong>.</p><p>Consumers want to buy <strong>less</strong>.</p></div>
 <div class="card accent-green"><h3>If Price Goes DOWN</h3><p>Producers want to sell <strong>less</strong>.</p><p>Consumers want to buy <strong>more</strong>.</p></div>
 </div>
 <div class="note"><strong>Equilibrium:</strong> supply and demand balance. The seller and buyer agree on a price and amount that satisfies both.</div>`,
 remember:"Equilibrium = BALANCE between supply and demand."
},
{
 section:"Teaching Slides",
 title:"Scarcity",
 body:`<div class="big-word">Scarcity = LACK</div>
 <p><strong>Scarcity</strong> means a needed resource is not available in a large amount.</p>
 <div class="arrowline">
   <div class="chip">Resource is scarce</div><span class="arrow">→</span>
   <div class="chip">Demand grows</div><span class="arrow">→</span>
   <div class="chip">Price rises</div>
 </div>
 <p>The lesson says people may look for <strong>replacements</strong> for that resource.</p>`,
 remember:"Scarcity → less available → demand rises → price rises."
},
{
 section:"Teaching Slides",
 title:"Opportunity Cost",
 body:`<div class="big-word">Opportunity Cost = GIVE UP</div>
 <p>Opportunity cost is what you give up to make or buy something.</p>
 <div class="grid two">
   <div class="card accent-green"><h3>Farmer chooses</h3><p>Grow <strong>wheat</strong>.</p></div>
   <div class="card accent-orange"><h3>Farmer gives up</h3><p>The chance to grow <strong>beans</strong> on the same land.</p></div>
 </div>
 <p>The opportunity cost can include <strong>time, resources, and choices</strong>.</p>`,
 remember:"A choice has a cost: what you GIVE UP."
},
{
 section:"Teaching Slides",
 title:"Scarcity vs. Opportunity Cost",
 body:`<table>
 <tr><th>Concept</th><th>Meaning</th><th>Memory Word</th></tr>
 <tr><td><strong>Scarcity</strong></td><td>The lack of a resource</td><td><strong>LACK</strong></td></tr>
 <tr><td><strong>Opportunity Cost</strong></td><td>What is given up, such as time or money, to make or buy something</td><td><strong>GIVE UP</strong></td></tr>
 </table>
 <div class="note">Do not mix them up: scarcity is about availability; opportunity cost is about a choice.</div>`,
 remember:"Scarcity = LACK. Opportunity Cost = GIVE UP."
},
{
 section:"Teaching Slides",
 title:"Four Economic Systems",
 body:`<table>
 <tr><th>System</th><th>Who decides?</th><th>Main idea</th></tr>
 <tr><td><strong>Traditional</strong></td><td>Custom</td><td>People follow traditions</td></tr>
 <tr><td><strong>Command</strong></td><td>Central government</td><td>Government decides</td></tr>
 <tr><td><strong>Market</strong></td><td>Individuals</td><td>People make choices</td></tr>
 <tr><td><strong>Mixed</strong></td><td>Government + individuals</td><td>Both make choices</td></tr>
 </table>`,
 remember:"Traditional = Custom • Command = Government • Market = Individual • Mixed = Both."
},
{
 section:"Teaching Slides",
 title:"Traditional Economy",
 body:`<p>A <strong>traditional economy</strong> is based on <strong>custom</strong>.</p>
 <ul>
   <li>Children often do the same work as their parents.</li>
   <li>Members of a family or tribe make goods for the rest of their group.</li>
   <li>Many hunter-gatherer groups had traditional economies.</li>
 </ul>`,
 remember:"Traditional → TRADITION → CUSTOM."
},
{
 section:"Teaching Slides",
 title:"Command Economy",
 body:`<p>In a <strong>command economy</strong>, a central government decides:</p>
 <ul><li>what goods will be made</li><li>who will receive them</li></ul>
 <div class="grid two">
   <div class="card accent-orange"><h3>Ancient examples</h3><p><strong>Egypt</strong> and <strong>Mesopotamia</strong> began as command economies.</p></div>
   <div class="card accent-purple"><h3>Textbook examples today</h3><p><strong>Cuba</strong> and <strong>North Korea</strong>.</p></div>
 </div>`,
 remember:"Command → the central government COMMANDS what is made and who receives it."
},
{
 section:"Teaching Slides",
 title:"Market and Mixed Economies",
 body:`<div class="grid two">
 <div class="card accent-blue"><h3>Market Economy</h3><p>Each <strong>individual</strong> makes choices about what to make, sell, and buy.</p><p>Goods and services are bought and sold on an <strong>open market</strong>.</p><p>Textbook example: <strong>United States</strong>.</p></div>
 <div class="card accent-green"><h3>Mixed Economy</h3><p>The <strong>government has some control</strong>.</p><p>Individuals make the rest of the economic choices.</p><p>The textbook says some countries in <strong>Europe</strong> are mixed economies.</p></div>
 </div>`,
 remember:"Market = Individual chooses. Mixed = Government + Individual."
},
{
 section:"Teaching Slides",
 title:"Economic Systems — Quick Compare",
 body:`<div class="grid four">
 <div class="card accent-green"><h3>Traditional</h3><p><strong>CUSTOM</strong></p></div>
 <div class="card accent-orange"><h3>Command</h3><p><strong>GOVERNMENT</strong></p></div>
 <div class="card accent-blue"><h3>Market</h3><p><strong>INDIVIDUAL</strong></p></div>
 <div class="card accent-purple"><h3>Mixed</h3><p><strong>BOTH</strong></p></div>
 </div>
 <div class="teacher-def"><strong>Individual</strong> — a single human being</div>
 <div class="teacher-def"><strong>Expert</strong> — a skilled person who has mastered a subject</div>`,
 remember:"Custom • Government • Individual • Both."
},
{
 section:"Teaching Slides",
 title:"The Business Cycle",
 body:`<p>Economies <strong>grow and shrink over time</strong>. This pattern is called the <strong>business cycle</strong>.</p>
 <div class="arrowline">
   <div class="chip">Expansion</div><span class="arrow">→</span>
   <div class="chip">Peak</div><span class="arrow">→</span>
   <div class="chip">Contraction / Recession</div><span class="arrow">→</span>
   <div class="chip">Trough</div><span class="arrow">→</span>
   <div class="chip">Expansion again</div>
 </div>
 <div class="note"><strong>Boom:</strong> when the economy grows quickly.</div>`,
 remember:"Grow → Peak → Down → Trough → Grow again."
},
{
 section:"Teaching Slides",
 title:"Recession",
 body:`<div class="teacher-def"><strong>Recession</strong> — a period of slow economic growth or decline</div>
 <p>During a recession, the textbook says:</p>
 <ul><li>companies often close</li><li>people lose their jobs</li></ul>
 <div class="note">The United States entered a recession in <strong>December 2007</strong>.</div>`,
 remember:"Recession → the economy SLOWS or DECLINES."
},
{
 section:"Teaching Slides",
 title:"Inflation",
 body:`<div class="teacher-def"><strong>Inflation</strong> — a continued rise in prices or the supply of money</div>
 <p>High inflation means <strong>money buys less</strong>. This raises the <strong>cost of living</strong>.</p>
 <div class="grid two">
   <div class="card accent-blue"><h3>10% Example</h3><p>$10 last year → <strong>$11 this year</strong>.</p></div>
   <div class="card accent-orange"><h3>Argentina Example</h3><p>In the <strong>1980s</strong>, yearly inflation hit <strong>1,000%</strong>. The same goods and services cost <strong>10 times more</strong>.</p></div>
 </div>
 <div class="note"><strong>Teacher study summary:</strong> Inflation, or rising prices, can lead to a recession, or a slowing of the economy.</div>`,
 remember:"Inflation → PRICES RISE → money buys less."
},
{
 section:"Teaching Slides",
 title:"Great Depression",
 body:`<p>In <strong>1929</strong>, the United States and much of the world entered a long, painful economic depression called the <strong>Great Depression</strong>.</p>
 <ul>
   <li>Prices in the United States deflated by nearly <strong>one-third</strong>.</li>
   <li><strong>One in five Americans</strong> was unemployed.</li>
   <li>Historians still argue about the causes of this serious dip in the business cycle.</li>
 </ul>
 <p class="small">The lesson activity asks students to locate two primary sources dealing with the depression of the 1930s.</p>`,
 remember:"1929 → Great Depression."
},
{
 section:"Teaching Slides",
 title:"Why Do People Trade?",
 body:`<p class="lead">Two countries trade when <strong>both sides can gain something from the exchange</strong>.</p>
 <p>Countries trade to get goods they <strong>want or need but do not have</strong>.</p>
 <div class="grid two">
   <div class="card accent-blue"><h3>Export</h3><p>Goods a country has in a <strong>large supply</strong>.</p></div>
   <div class="card accent-green"><h3>Import</h3><p>Goods that are <strong>hard to find</strong> in its own lands.</p></div>
 </div>`,
 remember:"Trade happens when both sides can gain."
},
{
 section:"Teaching Slides",
 title:"Exports and Imports",
 body:`<div class="grid two">
 <div class="card accent-blue"><h3>📤 Exports</h3><p>A good sent from one country to another in trade.</p><p><strong>EXport → EXit → OUT</strong></p></div>
 <div class="card accent-green"><h3>📥 Import</h3><p>A good brought into a country from another country.</p><p><strong>IMport → IN</strong></p></div>
 </div>
 <div class="note">For hundreds of years, Europeans traded <strong>wool, gold, and silver</strong> with Asians for rare goods such as <strong>silk and spices</strong>.</div>`,
 remember:"Have a lot → EXPORT. Hard to find at home → IMPORT."
},
{
 section:"Teaching Slides",
 title:"Barter and Money",
 body:`<p><strong>Barter</strong> means trading one good or service for another.</p>
 <div class="arrowline"><div class="chip">Fish</div><span class="arrow">↔</span><div class="chip">Furs</div></div>
 <p>Later, some ancient peoples invented money. The textbook says money:</p>
 <ul>
   <li>had a <strong>set value</strong></li>
   <li>could be traded for <strong>anything</strong></li>
   <li>was <strong>easier to carry</strong></li>
 </ul>`,
 remember:"Barter = item/service for another item/service."
},
{
 section:"Teaching Slides",
 title:"Barriers to Trade",
 body:`<div class="grid two">
 <div class="card accent-orange"><h3>🗺️ Geography</h3><p>Can make travel between two places difficult.</p></div>
 <div class="card accent-red"><h3>⚔️ Conflict</h3><p>Can stop trade.</p></div>
 <div class="card accent-purple"><h3>🚧 Limiting Contact</h3><p>A country may cut off contact with other peoples.</p></div>
 <div class="card accent-blue"><h3>💰 Taxes / Limits</h3><p>Nations may limit or tax trade to protect producers in their own country.</p></div>
 </div>`,
 remember:"Trade barriers: Geography + Conflict + Limits + Taxes."
},
{
 section:"Teaching Slides",
 title:"Japan in the 1600s",
 body:`<p>In the <strong>1600s</strong>, Japan limited trade with <strong>European countries</strong>.</p>
 <div class="note"><strong>Why?</strong> The Japanese wanted to limit European influence on Japanese society.</div>
 <p>This is an example of a country choosing to limit contact with other peoples.</p>`,
 remember:"Japan → 1600s → limited European trade to limit European influence."
},
{
 section:"Teaching Slides",
 title:"Trade Taxes During the Great Depression",
 body:`<p>U.S. farmers worried that food imports from Europe might drive them out of business.</p>
 <div class="arrowline">
   <div class="chip">U.S. raised taxes on imported European crops</div>
   <span class="arrow">→</span>
   <div class="chip">Other countries taxed U.S. goods</div>
 </div>
 <p>Other countries did this to protect their own farmers and businesses.</p>`,
 remember:"One country's trade limits can lead other countries to limit trade too."
},
{
 section:"Teaching Slides",
 title:"Globalization",
 body:`<div class="teacher-def"><strong>Globalization</strong> — the growth in free trade between countries</div>
 <p>Today, most countries take part in some form of international trade.</p>
 <p>Many large companies have business branches in more than one country.</p>
 <div class="note">Globalization has increased the ties among the world's economies.</div>`,
 remember:"Globalization = countries and economies become CONNECTED through trade."
},
{
 section:"Teaching Slides",
 title:"Free Trade — Two Views",
 body:`<p>The goal of free trade is a world market where people are free to choose what to buy and sell.</p>
 <div class="grid two">
   <div class="card accent-green"><h3>Supporters Say</h3><ul><li>boosts trade</li><li>cuts prices of goods</li><li>helps economies grow</li></ul></div>
   <div class="card accent-orange"><h3>Opponents Say</h3><ul><li>imports may become too cheap</li><li>foreign labor costs may become too cheap</li><li>a country may lose companies and jobs</li></ul></div>
 </div>`,
 remember:"FOR: more trade, lower prices, growth. AGAINST: possible loss of companies and jobs."
},
{
 section:"Teaching Slides",
 title:"Global Economies Are Connected",
 body:`<p>The textbook gives an example from <strong>2015</strong>:</p>
 <ul>
   <li>The United States had the <strong>largest economy in the world</strong>.</li>
   <li>The U.S. economy was bigger than the next two leading countries, <strong>Japan and China</strong>, added together.</li>
   <li>Americans buy goods made in other countries and sell American goods and services around the world.</li>
 </ul>
 <div class="note">When the U.S. economy struggles, the textbook says it affects the entire world.</div>`,
 remember:"Globalization connects economies, so changes in one economy can affect others."
},
{
 section:"Teaching Slides",
 title:"Important Graphs and Infographics",
 body:`<div class="grid two">
 <div class="card accent-blue"><h3>Supply & Demand</h3><p>Labels: <strong>Supply, Demand, Price, Quantity, Equilibrium</strong>.</p><p>Equilibrium = balance.</p></div>
 <div class="card accent-green"><h3>Business Cycle</h3><p><strong>Expansion → Peak → Contraction/Recession → Trough</strong>.</p><p>Trough = lowest point.</p></div>
 <div class="card accent-orange"><h3>U.S. Imports & Exports, 2005–2014</h3><p>The graph shows U.S. imports and exports over a ten-year period.</p><p>U.S. exports are lowest in <strong>2005</strong>.</p></div>
 <div class="card accent-purple"><h3>Shipping Image</h3><p>International ports are an important method of transporting goods. Global trade may help different countries' economies grow.</p></div>
 </div>`,
 remember:"Graphs test patterns: equilibrium, business-cycle stages, and import/export trends."
},
{

 remember:"Dates are secondary, but connect each date to its event."
},

let slideIndex = 0;
let quizMode = false;
let qIndex = 0;
let score = 0;
let answered = false;
const misses = {};
const correctTopics = {};

const stage = document.getElementById("stage");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const sectionPill = document.getElementById("sectionPill");
const slideNav = document.getElementById("slideNav");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");

function renderSlide(){
  quizMode = false;
  const s = slides[slideIndex];
  sectionPill.textContent = s.section;
  const pct = ((slideIndex+1)/slides.length)*100;
  progressBar.style.width = pct+"%";
  progressText.textContent = `Slide ${slideIndex+1} of ${slides.length}`;
  stage.innerHTML = `<section class="slide">
    <div class="eyebrow">${s.section}</div>
    <h2>${s.title}</h2>
    ${s.body}
    <div class="remember">⭐ Remember: ${s.remember}</div>
  </section>`;
  slideNav.style.display = "grid";
  backBtn.disabled = slideIndex === 0;
  nextBtn.textContent = slideIndex === slides.length-1 ? "Start 40-Question Quiz →" : "Next →";
  window.scrollTo({top:0,behavior:"smooth"});
}

function startQuiz(){
  quizMode = true; qIndex = 0; score = 0; answered = false;
  for(const k in misses) delete misses[k];
  for(const k in correctTopics) delete correctTopics[k];
  slideNav.style.display = "none";
  renderQuestion();
}

function renderQuestion(){
  quizMode = true;
  answered = false;
  sectionPill.textContent = "40-Question Quiz";
  progressBar.style.width = `${((qIndex+1)/quiz.length)*100}%`;
  progressText.textContent = `Question ${qIndex+1} of ${quiz.length}`;
  const item = quiz[qIndex];
  stage.innerHTML = `<section class="quiz-shell">
    <div class="qmeta">
      <div class="difficulty">${item.d} • ${item.topic}</div>
      <div class="scorepill">Score: ${score}/${qIndex}</div>
    </div>
    <div class="question">${qIndex+1}. ${item.q}</div>
    <div class="choices">
      ${item.c.map((x,i)=>`<button class="choice" data-i="${i}"><strong>${String.fromCharCode(65+i)}.</strong> ${x}</button>`).join("")}
    </div>
    <div id="feedback" class="feedback"></div>
  </section>`;
  document.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",chooseAnswer));
  window.scrollTo({top:0,behavior:"smooth"});
}

function chooseAnswer(ev){
  if(answered) return;
  answered = true;
  const chosen = Number(ev.currentTarget.dataset.i);
  const item = quiz[qIndex];
  const choices = [...document.querySelectorAll(".choice")];
  choices.forEach((b,i)=>{
    b.disabled = true;
    if(i===item.a) b.classList.add("correct");
  });
  const fb = document.getElementById("feedback");
  if(chosen===item.a){
    score++;
    correctTopics[item.topic] = (correctTopics[item.topic]||0)+1;
    fb.innerHTML = `<div class="ok">✅ Correct!</div>
      <div class="explain"><strong>Correct answer: ${String.fromCharCode(65+item.a)}. ${item.c[item.a]}</strong><br>${item.e}</div>`;
  }else{
    ev.currentTarget.classList.add("wrong");
    misses[item.topic] = (misses[item.topic]||0)+1;
    fb.innerHTML = `<div class="bad">❌ Incorrect.</div>
      <div class="explain"><strong>Correct answer: ${String.fromCharCode(65+item.a)}. ${item.c[item.a]}</strong><br>${item.e}</div>
      <div class="remember">⭐ Remember: Review <strong>${item.topic}</strong> before the exam.</div>`;
  }
  const btn = document.createElement("button");
  btn.className = "btn quiz-next";
  btn.textContent = qIndex===quiz.length-1 ? "See Final Score →" : "Next Question →";
  btn.onclick = ()=>{
    if(qIndex===quiz.length-1) showResults();
    else { qIndex++; renderQuestion(); }
  };
  fb.appendChild(btn);
}

function showResults(){
  sectionPill.textContent = "Quiz Results";
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Complete";
  const pct = Math.round((score/quiz.length)*100);
  const review = Object.entries(misses).sort((a,b)=>b[1]-a[1]);
  const allTopics = [...new Set(quiz.map(x=>x.topic))];
  const strong = allTopics.filter(t=>!misses[t] && correctTopics[t]);
  stage.innerHTML = `<section class="slide">
    <div class="eyebrow">Quiz Complete</div>
    <h2>Your Final Score</h2>
    <div class="final-score">${score}/${quiz.length}</div>
    <p class="lead">${pct}%</p>
    <div class="grid two">
      <div class="card accent-orange">
        <h3>Topics to Review</h3>
        ${review.length ? `<div class="review-list">${review.map(([t,n])=>`<span class="review-tag">${t} (${n} missed)</span>`).join("")}</div>` :
        `<p>Excellent — no review topics were identified from missed questions.</p>`}
      </div>
      <div class="card accent-green">
        <h3>Strong Topics</h3>
        ${strong.length ? `<div class="review-list">${strong.map(t=>`<span class="strong-tag">${t}</span>`).join("")}</div>` :
        `<p>Keep reviewing the lesson and try the quiz again.</p>`}
      </div>
    </div>
    <div class="remember">⭐ Remember: Review only the topics you missed, then retake the quiz to improve your score.</div>
    <button id="retake" class="btn quiz-next">↻ Retake Quiz</button>
    <button id="lessonAgain" class="btn btn-back" style="width:100%;margin-top:12px">← Review Lesson Again</button>
  </section>`;
  document.getElementById("retake").onclick = startQuiz;
  document.getElementById("lessonAgain").onclick = ()=>{slideIndex=0;renderSlide();};
  window.scrollTo({top:0,behavior:"smooth"});
}

backBtn.addEventListener("click",()=>{
  if(slideIndex>0){slideIndex--;renderSlide();}
});
nextBtn.addEventListener("click",()=>{
  if(slideIndex<slides.length-1){slideIndex++;renderSlide();}
  else startQuiz();
});
restartBtn.addEventListener("click",()=>{
  slideIndex=0;renderSlide();
});

renderSlide();
</script>
</body>
</html>
