    .controls{display:flex;gap:12px;justify-content:space-between;align-items:center;padding-top:12px}.control-group{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:52px;border:0;border-radius:15px;padding:12px 20px;font-weight:900;cursor:pointer;box-shadow:0 5px 12px rgba(34,73,108,.14);transition:transform .12s ease,filter .12s ease}.btn:hover{filter:brightness(1.04)}.btn:active{transform:scale(.98)}.btn:focus-visible,.choice:focus-visible{outline:4px solid #ffcc45;outline-offset:3px}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#fff;color:var(--navy);border:2px solid #aac8df}.btn.restart{background:#fff3d0;color:#704800;border:2px solid #f0cf6b}.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.difficulty{padding:7px 12px;border-radius:999px;font-weight:900;background:#e8f7ef;color:#146b45}.difficulty.medium{background:#fff4cf;color:#815700}.difficulty.hard{background:#ffe7e7;color:#9b2830}.question{font-size:clamp(1.35rem,2.8vw,2rem);font-weight:900;color:var(--navy);line-height:1.25;margin:12px 0 22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}.choice{min-height:72px;text-align:left;border:2px solid #bfd7e9;background:#fff;border-radius:17px;padding:15px 16px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}.choice:hover{background:#f1f9ff;border-color:var(--blue)}.choice .letter{flex:0 0 37px;height:37px;display:grid;place-items:center;border-radius:11px;background:var(--navy);color:#fff;font-weight:900}.choice.correct{background:#e6f8ed;border-color:#27935d}.choice.wrong{background:#ffebeb;border-color:#c94b52}.choice:disabled{cursor:default;color:var(--ink);opacity:1}.feedback{display:none;margin-top:18px;border-radius:16px;padding:16px;font-size:1.08rem;font-weight:700}.feedback.show{display:block}.feedback.ok{background:#e6f8ed;border:2px solid #7dcc9e;color:#175b38}.feedback.no{background:#ffeded;border:2px solid #e0a1a5;color:#7f2128}.result-score{font-size:clamp(3.2rem,8vw,6rem);font-weight:900;color:var(--blue);line-height:1}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.result-card{text-align:center;background:var(--sky);border-radius:16px;padding:16px}.result-card strong{display:block;font-size:1.8rem;color:var(--navy)}.mistakes{display:grid;gap:10px}.mistake{border:1px solid var(--line);border-radius:14px;padding:13px;background:#f8fbfd}.error-box{margin:auto;background:#fff1f1;border:2px solid #d85b63;border-radius:18px;padding:22px;max-width:720px}.hidden{display:none!important}

    <main>
      <section class="panel" id="content" aria-live="polite">
        <div class="eyebrow">Grade 6 Health • Lesson 2</div>
        <h1>Practicing Communication Skills</h1>
        <div class="big-idea">Healthy relationships depend on good communication.</div>

  <noscript><div class="error-box"><strong>JavaScript is turned off.</strong> Please enable JavaScript to use the touchscreen lesson and quiz.</div></noscript>

  <script>
  "use strict";
  const slides = [
    {
      title:"Practicing Communication Skills",
      body:`<div class="eyebrow">Grade 6 Health • Lesson 2</div><h1>Practicing Communication Skills</h1><div class="big-idea">Healthy relationships depend on good communication.</div><p class="lead">Learn how words, body language, listening, and communication styles affect relationships.</p>`,
      remember:"Good communication helps build healthy relationships."
    },
    {
      title:"What You Must Know",
      body:`<h2>What You Must Know</h2><div class="grid"><div class="card"><h3>1. Messages</h3><p>Communication has a <strong>sender</strong>, a <strong>receiver</strong>, and a <strong>message</strong>.</p></div><div class="card green"><h3>2. Words + Actions</h3><p>Understand <strong>verbal</strong>, <strong>nonverbal</strong>, and <strong>mixed messages</strong>.</p></div><div class="card yellow"><h3>3. Good Skills</h3><p>Practice clear speaking, active listening, and careful writing.</p></div><div class="card"><h3>4. Styles</h3><p>Compare <strong>assertive</strong>, <strong>aggressive</strong>, and <strong>passive</strong> communication.</p></div></div>`,
      remember:"Sender → Message → Receiver."
    },
    {
      title:"What Is Communication?",
      body:`<h2>What Is Communication?</h2><p><span class="term">Communication</span> is the exchange of information through words or actions.</p><div class="arrow"><div class="step">👤 Sender</div><div class="arr">→</div><div class="step">💬 Message</div><div class="arr">→</div><div class="step">👤 Receiver</div></div><p>You communicate by phone, in writing, online, and through your actions. In person, people also see your facial expressions and body language.</p>`,
      remember:"Communication needs a sender, a message, and a receiver."
    },
    {
      title:"Verbal and Nonverbal Communication",
      body:`<h2>Verbal vs. Nonverbal</h2><div class="grid"><div class="card"><h3>🗣️ Verbal Communication</h3><p>Using <strong>spoken or written words</strong> to express feelings, thoughts, or experiences.</p></div><div class="card green"><h3>🙂 Nonverbal Communication</h3><p>Getting messages across <strong>without using words</strong>.</p></div></div><p class="quote"><strong>Body language</strong> uses postures, gestures, and facial expressions.</p>`,
      remember:"Verbal = words. Nonverbal = messages without words."
    },
    {
      title:"Reading Body Language",
      body:`<h2>Reading Body Language</h2><div class="grid three"><div class="card"><h3>Posture</h3><p>How a person sits or stands and the message the body sends.</p></div><div class="card green"><h3>Gestures</h3><p>Hand or head motions that express meaning. Nodding can show agreement or understanding.</p></div><div class="card yellow"><h3>Facial Expressions</h3><p>An open, friendly expression communicates interest.</p></div></div><p><strong>Tone of voice</strong>, or intonation, gives clues about how the speaker wants the listener to feel about the information.</p>`,
      remember:"Watch posture, gestures, facial expressions, and tone."
    },
    {
      title:"Mixed Messages",
      body:`<h2>Mixed Messages</h2><p>A <span class="term">mixed message</span> happens when your words say one thing but your body language says another.</p><div class="arrow"><div class="step">Words: “I'm fine.”</div><div class="arr">+</div><div class="step">Angry tone</div><div class="arr">→</div><div class="step">Confusing message</div></div><p>A good communicator looks directly at the other person and speaks in a caring voice.</p>`,
      remember:"Your words, tone, and body language should match."
    },
    {
      title:"Relationships Are Different",
      body:`<h2>Relationships Are Different</h2><p>A <strong>relationship</strong> occurs when two or more people have a connection or are associated for some reason.</p><div class="grid"><div class="card"><h3>Examples</h3><p>Siblings, friends, a manager and employee, and dating partners.</p></div><div class="card green"><h3>Why They Differ</h3><p>Each person is unique. Relationships may be based on different interests or include cultural differences.</p></div></div>`,
      remember:"Different people create different, unique relationships."
    },
    {
      title:"Power in Relationships",
      body:`<h2>Power in Relationships</h2><p><span class="term">Power</span> refers to who has the greatest amount of influence in a relationship.</p><div class="grid three"><div class="card"><h3>Family</h3><p>As teens make more decisions, relationships with parents change.</p></div><div class="card green"><h3>Friends</h3><p>The person making most decisions has power. Influence may change as interests change.</p></div><div class="card yellow"><h3>Dating</h3><p>One person may make more decisions; on group dates, the group decides.</p></div></div>`,
      remember:"Power means influence, and it can change."
    },
    {
      title:"When Power Is Abused",
      body:`<h2>When Power Is Abused</h2><p>Age, status, and position can affect power. Teachers, parents, police officers, and other authority figures have status that gives them power.</p><div class="card red"><h3>Abusive Relationship</h3><p>If someone uses age, status, or position to gain power and <strong>hurt or demean</strong> another person, the relationship is abusive.</p></div><p>Examples in the lesson include neglect, violence, child abuse, elder abuse, bullying, and forcing a dating partner to act against their values.</p>`,
      remember:"Power becomes abuse when it is used to hurt or demean."
    },
    {
      title:"Gender Stereotypes",
      body:`<h2>Gender Stereotypes</h2><p>A <span class="term">stereotype</span> is a belief about people who belong to a certain group. A gender stereotype assumes someone must act a certain way just because the person is male or female.</p><div class="grid"><div class="card red"><h3>Harm</h3><p>Stereotypes do not acknowledge each person as an individual with their own thoughts and feelings.</p></div><div class="card green"><h3>Key Point</h3><p>Your gender does not define how you behave or what goals you set for yourself.</p></div></div>`,
      remember:"A stereotype judges a group instead of seeing the individual."
    },
    {
      title:"Interpersonal Communication",
      body:`<h2>Good Communication Skills</h2><p><span class="term">Interpersonal communication</span> is sharing thoughts and feelings with other people.</p><p>It requires sending and receiving information that everyone involved understands.</p><div class="arrow"><div class="step">Speak clearly</div><div class="arr">↔</div><div class="step">Listen carefully</div><div class="arr">↔</div><div class="step">Write clearly</div></div><p>In person, eye contact shows attention and respect. Looking bored or looking away may suggest that you do not care.</p>`,
      remember:"A good communicator sends and receives understandable messages."
    },
    {
      title:"Boundaries and Refusal Skills",
      body:`<h2>Boundaries and Refusal Skills</h2><div class="grid"><div class="card"><h3>Personal Boundaries</h3><p>In-person conversation lets your tone, facial expression, and body language support your meaning.</p></div><div class="card green"><h3>Refusal Skills</h3><p>Show that you mean what you say with strong body language: eye contact, crossed arms, and a serious expression. You may need to walk away.</p></div></div><p class="quote">Clear words + matching body language = a stronger message</p>`,
      remember:"Strong refusal uses clear words and strong body language."
    },
    {
      title:"Speaking Skills",
      body:`<h2>Speaking Skills</h2><div class="review-list"><div class="review-item"><span class="check">✓</span><div><strong>Think before speaking.</strong><br><span class="mini">Plan what you will say.</span></div></div><div class="review-item"><span class="check">✓</span><div><strong>Make clear, simple statements.</strong><br><span class="mini">Be specific and stay on the subject.</span></div></div><div class="review-item"><span class="check">✓</span><div><strong>Use “I” messages.</strong><br><span class="mini">Present the situation from your viewpoint.</span></div></div><div class="review-item"><span class="check">✓</span><div><strong>Be honest and polite.</strong><br><span class="mini">Respect the listener's feelings.</span></div></div><div class="review-item"><span class="check">✓</span><div><strong>Use appropriate body language.</strong><br><span class="mini">Make eye contact and avoid mixed messages.</span></div></div></div>`,
      remember:"Think, speak clearly, be honest, and match your body language."
    },
    {
      title:"Using “I” Messages",
      body:`<h2>Using “I” Messages</h2><p><span class="term">“I” messages</span> are statements that present a situation from the speaker's personal viewpoint.</p><div class="grid"><div class="card red"><h3>Instead of</h3><p class="quote">“You're not making sense.”</p></div><div class="card green"><h3>Try</h3><p class="quote">“I'm not sure what you mean.”</p></div></div><p>Speaking about your own concern makes the listener less likely to become angry or defensive.</p>`,
      remember:"An “I” message explains your viewpoint without attacking."
    },
    {
      title:"Active Listening",
      body:`<h2>Active Listening</h2><p><span class="term">Active listening</span> means hearing, thinking about, and responding to another person's message.</p><div class="arrow"><div class="step">Hear</div><div class="arr">→</div><div class="step">Think</div><div class="arr">→</div><div class="step">Respond</div></div><div class="grid"><div class="card"><h3>Pay Attention</h3><p>Face and look at the speaker.</p></div><div class="card green"><h3>Wait Your Turn</h3><p>Let the speaker finish.</p></div><div class="card yellow"><h3>Ask Questions</h3><p>Clear up what you do not understand.</p></div><div class="card"><h3>Mirror</h3><p>Repeat the message in your own words.</p></div></div>`,
      remember:"Active listening = hear + think + respond."
    },
    {
      title:"Writing Skills",
      body:`<h2>Writing Skills</h2><p>Written communication includes e-mails, text messages, notes, and letters.</p><div class="card yellow"><h3>The Challenge</h3><p>The reader cannot see your body language or hear your tone. A direct message may sound angry even when the writer did not mean it that way.</p></div><ul class="bullets"><li>Write clear, simple statements.</li><li>State thoughts and feelings clearly.</li><li><strong>Reread</strong> before sending.</li></ul>`,
      remember:"When writing, clarity must replace missing tone and body language."
    },
    {
      title:"Three Communication Styles",
      body:`<h2>Three Communication Styles</h2><div class="table-wrap"><table class="compare"><thead><tr><th>Style</th><th>Meaning</th><th>Effect</th></tr></thead><tbody><tr><td><strong>Assertive</strong></td><td>Stand up for yourself in a firm but positive way.</td><td>Respects yourself and others.</td></tr><tr><td><strong>Aggressive</strong></td><td>Overly forceful, pushy, hostile, or attacking.</td><td>May hurt feelings or make others angry.</td></tr><tr><td><strong>Passive</strong></td><td>Give up, give in, or back down without standing up for rights and needs.</td><td>May show low confidence or self-respect.</td></tr></tbody></table></div>`,
      remember:"Assertive is friendly but firm."
    },
    {
      title:"Style Examples",
      body:`<h2>Which Style Is It?</h2><div class="grid three"><div class="card green"><h3>Assertive</h3><p>“I need to be home on time because I promised my parents.”</p></div><div class="card red"><h3>Aggressive</h3><p>“You'd better get me home on time.”</p></div><div class="card yellow"><h3>Passive</h3><p>“It doesn't matter when I get home.”</p></div></div><p>You can move from passive to assertive by remembering that your thoughts and opinions have value.</p>`,
      remember:"Firm + positive + respect = assertive."
    },
    {
      title:"Cultural Perspectives",
      body:`<h2>Body Language and Culture</h2><p>Body language can be used differently in different cultures.</p><ul class="bullets"><li>In many Southeast Asian cultures, people might smile to mask negative feelings or a negative statement.</li><li>In some cultures, eye contact with the opposite gender may be considered impolite.</li><li>Hand and arm gestures may have different meanings in different cultures.</li></ul>`,
      remember:"The same body language can have different meanings across cultures."
    },
    {
      title:"Vocabulary Review 1",
      body:`<h2>Vocabulary Review 1</h2><div class="table-wrap"><table class="compare"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>verbal communication</strong></td><td>Using spoken or written words to express feelings, thoughts, or experiences.</td><td>Verbal uses words.</td></tr><tr><td><strong>body language</strong></td><td>The use of postures, gestures, and facial expressions.</td><td>The body sends a message.</td></tr><tr><td><strong>nonverbal communication</strong></td><td>Getting messages across without using words.</td><td>Nonverbal = no words.</td></tr><tr><td><strong>mixed message</strong></td><td>Words say one thing, but body language says another.</td><td>Two messages do not match.</td></tr><tr><td><strong>stereotype</strong></td><td>A belief about people who belong to a certain group.</td><td>Group belief, not the individual.</td></tr><tr><td><strong>interpersonal communication</strong></td><td>Sharing thoughts and feelings with other people.</td><td>Information between people.</td></tr></tbody></table></div>`,
      remember:"Learn each term by connecting it to its key action."
    },
    {
      title:"Vocabulary Review 2",
      body:`<h2>Vocabulary Review 2</h2><div class="table-wrap"><table class="compare"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>“I” messages</strong></td><td>Statements that present a situation from the speaker's personal viewpoint.</td><td>Start with your own viewpoint.</td></tr><tr><td><strong>active listening</strong></td><td>Hearing, thinking about, and responding to another person's message.</td><td>Hear → Think → Respond.</td></tr><tr><td><strong>assertive</strong></td><td>Standing up for yourself in a firm but positive way.</td><td>Friendly but firm.</td></tr><tr><td><strong>aggressive</strong></td><td>Overly forceful, pushy, hostile, or attacking.</td><td>Forceful and attacking.</td></tr><tr><td><strong>passive</strong></td><td>Giving up, giving in, or backing down without standing up for rights and needs.</td><td>Backs down.</td></tr></tbody></table></div>`,
      remember:"Assertive respects; aggressive attacks; passive backs down."
    },
    {
      title:"Final 4-Minute Review",
      body:`<h2>Final 4-Minute Review</h2><div class="review-list"><div class="review-item"><span class="check">✓</span><div><strong>Communication</strong> = exchanging information through words or actions.</div></div><div class="review-item"><span class="check">✓</span><div><strong>Body language</strong> includes posture, gestures, and facial expressions.</div></div><div class="review-item"><span class="check">✓</span><div><strong>Mixed message</strong> = words and body language do not match.</div></div><div class="review-item"><span class="check">✓</span><div><strong>Active listening</strong> = hear, think, respond.</div></div><div class="review-item"><span class="check">✓</span><div>Good speakers think, speak clearly, use “I” messages, and use matching body language.</div></div><div class="review-item"><span class="check">✓</span><div>Good writers use clear statements and reread before sending.</div></div><div class="review-item"><span class="check">✓</span><div><strong>Assertive</strong> communication is friendly but firm.</div></div><div class="review-item"><span class="check">✓</span><div>Stereotypes ignore each person's individual thoughts and feelings.</div></div></div>`,
      remember:"Words, listening, writing, and body language work together."
    },
    {
      title:"Lesson 2 Review",
      body:`<h2>Lesson 2 Review — Answers</h2><div class="lesson-review"><div class="qa"><b>1. What does communication mean?</b><br>The exchange of information through words or actions.</div><div class="qa"><b>2. What is a mixed message?</b><br>Words say one thing while body language says another.</div><div class="qa"><b>3. Which style is most effective?</b><br>Assertive, because it is firm and positive and respects yourself and others.</div><div class="qa"><b>4. Respond with an “I” message.</b><br>“I feel upset when a negative message is posted because I said no.”</div><div class="qa"><b>5. Nonverbal ways to show consideration?</b><br>Face the speaker, make eye contact, and use an open, friendly expression.</div><div class="qa"><b>6. Example of a mixed message?</b><br>Saying “I'm fine” in an angry tone sends two different messages.</div></div>`,
      remember:"Review the six answers, then start the quiz."
    }
  ];

  const questions = [
    {q:"What is communication?",c:["Only speaking face to face","The exchange of information through words or actions","Writing without a receiver","A person's facial expression"],a:1,e:"Communication is the exchange of information through words or actions.",t:"Communication basics"},
    {q:"Which three parts are involved in communication?",c:["Writer, paper, and pen","Posture, gesture, and tone","Sender, receiver, and message","Speaker, room, and chair"],a:2,e:"Communication involves a sender, a receiver, and a message.",t:"Communication basics"},
    {q:"Which is verbal communication?",c:["Using spoken or written words","Crossing your arms","Nodding your head","Smiling at a speaker"],a:0,e:"Verbal communication uses words, either spoken or written.",t:"Verbal and nonverbal communication"},
    {q:"What is body language?",c:["Only the tone of a person's voice","A written message sent online","The meaning of difficult words","The use of postures, gestures, and facial expressions"],a:3,e:"Body language uses postures, gestures, and facial expressions.",t:"Body language"},
    {q:"What does nonverbal communication do?",c:["Uses only written words","Gets messages across without words","Always uses a phone","Explains every message aloud"],a:1,e:"Nonverbal communication sends messages without using words.",t:"Verbal and nonverbal communication"},
    {q:"Which action can show agreement or understanding?",c:["Nodding","Looking away","Interrupting","Writing an e-mail"],a:0,e:"Nodding is a gesture that can show agreement or understanding.",t:"Body language"},
    {q:"What is a mixed message?",c:["Two people send the same words","A message is written twice","Words say one thing while body language says another","A person listens and asks a question"],a:2,e:"A mixed message happens when words and body language do not match.",t:"Mixed messages"},
    {q:"Which example is a mixed message?",c:["Smiling while saying you are happy","Nodding to show agreement","Looking at a speaker while listening","Saying “I'm fine” in an angry tone"],a:3,e:"The calm words and angry tone send different messages.",t:"Mixed messages"},
    {q:"What does power mean in a relationship?",c:["Who has the greatest amount of influence","Who speaks the loudest","Who is the youngest","Who writes the most messages"],a:0,e:"Power refers to who has the greatest amount of influence.",t:"Relationships and power"},
    {q:"What is a stereotype?",c:["A belief about people who belong to a certain group","A clear written statement","A friendly but firm response","A message without words"],a:1,e:"A stereotype is a belief about people in a certain group.",t:"Stereotypes"},
    {q:"Why can gender stereotypes be harmful?",c:["They make every person a leader","They improve all communication","They ignore each person's individual thoughts and feelings","They help people choose their goals"],a:2,e:"Stereotypes do not acknowledge each person as an individual.",t:"Stereotypes"},
    {q:"What is interpersonal communication?",c:["Using only gestures","Sending a message without a receiver","Deciding who has power","Sharing thoughts and feelings with other people"],a:3,e:"Interpersonal communication is sharing thoughts and feelings with others.",t:"Interpersonal communication"},
    {q:"Which behavior shows attention and respect in person?",c:["Looking directly at the other person","Looking around the room","Folding your arms stiffly","Speaking without thinking"],a:0,e:"Looking directly at the other person shows attention and respect.",t:"Good communication skills"},
    {q:"Which body language is suggested when using refusal skills?",c:["Looking down and speaking softly","Eye contact, crossed arms, and a serious expression","Smiling and changing the subject","Turning away without speaking"],a:1,e:"The lesson suggests eye contact, crossed arms, and a serious expression.",t:"Boundaries and refusal skills"},
    {q:"Which is a good speaking skill?",c:["Say the first thing that comes to mind","Change the subject often","Think before speaking","Use mixed messages"],a:2,e:"Thinking first helps prevent misunderstanding.",t:"Speaking skills"},
    {q:"Which statement is an “I” message?",c:["You never make sense.","You are wrong again.","Stop confusing everyone.","I'm not sure what you mean."],a:3,e:"An “I” message presents the situation from the speaker's viewpoint.",t:"I messages"},
    {q:"What does active listening mean?",c:["Hearing, thinking about, and responding to a message","Only hearing a sound","Waiting without paying attention","Repeating every word exactly"],a:0,e:"Active listening includes hearing, thinking, and responding.",t:"Active listening"},
    {q:"Why should a listener ask questions?",c:["To interrupt the speaker","To clear up what is not understood","To change the message","To avoid eye contact"],a:1,e:"Questions help clear up confusion and prevent misunderstandings.",t:"Active listening"},
    {q:"What does it mean to mirror thoughts and feelings?",c:["Copy the speaker's gestures","Speak before the other person finishes","Repeat the message in your own words","Write the message without reading it"],a:2,e:"Mirroring means repeating in your own words what you believe the person said.",t:"Active listening"},
    {q:"Why should you reread a written message before sending it?",c:["To make it longer","To add body language","To change it into a spoken message","To make sure your thoughts will be understood"],a:3,e:"The reader cannot see your body language or hear your tone.",t:"Writing skills"},
    {q:"Mia says, “I need to leave now because I promised my parents.” Which style is she using?",c:["Assertive","Aggressive","Passive","Mixed"],a:0,e:"She states her position in a firm but positive way.",t:"Communication styles"},
    {q:"Which communicator is overly forceful, pushy, hostile, or attacking?",c:["Passive","Aggressive","Assertive","Active"],a:1,e:"Those traits describe aggressive communication.",t:"Communication styles"},
    {q:"A student says, “It doesn't matter,” and gives up without stating a need. Which style is this?",c:["Assertive","Aggressive","Passive","Interpersonal"],a:2,e:"A passive communicator gives up or backs down without standing up for needs.",t:"Communication styles"},
    {q:"Which statement best compares the three styles?",c:["All three are equally firm and positive.","Aggressive and assertive both attack others.","Passive communication always shows strong confidence.","Assertive respects self and others; aggressive attacks; passive backs down."],a:3,e:"That comparison matches the traits given for all three styles.",t:"Communication styles"},
    {q:"A friend is speaking. What sequence best shows active listening?",c:["Pay attention → let the friend finish → ask a question → mirror the message","Interrupt → look away → change the subject","Hear a sound → speak immediately → leave","Write a message → ignore the answer → repeat yourself"],a:0,e:"Active listeners pay attention, wait, ask questions, and mirror the message.",t:"Active listening"},
    {q:"A text sounds angry even though the writer did not mean anger. What best explains the problem?",c:["The text has too many receivers","The reader cannot see body language or hear tone","The writer used eye contact","The message was assertive"],a:1,e:"Written messages do not show body language or tone of voice.",t:"Writing skills"},
    {q:"A person uses status to hurt or demean someone. How does the lesson describe this relationship?",c:["Unique","Assertive","Abusive","Passive"],a:2,e:"Using age, status, or position to hurt or demean makes a relationship abusive.",t:"Relationships and power"},
    {q:"Why might the same gesture be misunderstood between people from different cultures?",c:["Gestures never carry meaning","Only spoken words can be misunderstood","Every culture uses identical body language","Gestures may have different meanings in different cultures"],a:3,e:"The lesson states that body language and gestures can differ across cultures.",t:"Cultural perspectives"},
    {q:"Which response best changes a passive message into an assertive one?",c:["State your need in a firm but positive way","Attack the other person's idea","Give in without explaining your need","Use an angry tone with friendly words"],a:0,e:"Assertive communication stands up for needs in a firm but positive way.",t:"Communication styles"},
    {q:"Which choice best prevents a mixed message during an important conversation?",c:["Use unclear words so the listener can guess","Make words, tone, facial expression, and gestures support the same meaning","Avoid looking at the other person","Use an angry tone with a positive statement"],a:1,e:"A clear message has words and body language that match.",t:"Mixed messages"}
  ];

  const state={mode:"lesson",slide:0,question:0,score:0,answered:false,answers:[]};
  const el={content:document.getElementById("content"),sectionLabel:document.getElementById("sectionLabel"),progressText:document.getElementById("progressText"),progressBar:document.getElementById("progressBar"),scorePill:document.getElementById("scorePill"),lessonControls:document.getElementById("lessonControls"),quizControls:document.getElementById("quizControls"),back:document.getElementById("backBtn"),next:document.getElementById("nextBtn"),restart:document.getElementById("restartBtn"),returnLesson:document.getElementById("returnLessonBtn"),nextQuestion:document.getElementById("nextQuestionBtn")};

  function renderSlide(){
    state.mode="lesson";
    const s=slides[state.slide];
    el.content.innerHTML=s.body+`<div class="tip"><strong>⭐ Remember:</strong> ${s.remember}</div>`;
    el.sectionLabel.textContent=state.slide===slides.length-1?"Lesson Review":"Teaching Slides";
    el.progressText.textContent=`Slide ${state.slide+1} of ${slides.length}`;
    el.progressBar.style.width=`${((state.slide+1)/slides.length)*100}%`;
    el.scorePill.classList.add("hidden");
    el.lessonControls.classList.remove("hidden");
    el.quizControls.classList.add("hidden");
    el.back.disabled=state.slide===0;
    el.next.textContent=state.slide===slides.length-1?"Start Quiz →":"Next →";
    window.scrollTo({top:0,behavior:"auto"});
  }

  function startQuiz(reset=true){
    state.mode="quiz";
    if(reset){state.question=0;state.score=0;state.answers=[];}
    state.answered=false;
    el.lessonControls.classList.add("hidden");
    el.quizControls.classList.remove("hidden");
    el.scorePill.classList.remove("hidden");
    renderQuestion();
  }

  function renderQuestion(){
    const item=questions[state.question];
    const level=state.question<10?"Easy":state.question<20?"Medium":"Hard";
    const levelClass=level.toLowerCase();
    el.sectionLabel.textContent="30-Question Quiz";
    el.progressText.textContent=`Question ${state.question+1} of ${questions.length}`;
    el.progressBar.style.width=`${((state.question+1)/questions.length)*100}%`;
    el.scorePill.textContent=`Score: ${state.score}`;
    el.nextQuestion.classList.add("hidden");
    el.content.innerHTML=`<div class="quiz-head"><span class="tag">Question ${state.question+1} of ${questions.length}</span><span class="difficulty ${levelClass}">${level}</span></div><div class="question">${item.q}</div><div class="choices">${item.c.map((choice,i)=>`<button class="choice" type="button" data-choice="${i}"><span class="letter">${"ABCD"[i]}</span><span>${choice}</span></button>`).join("")}</div><div class="feedback" id="feedback" aria-live="assertive"></div>`;
    el.content.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",chooseAnswer,{once:true}));
    window.scrollTo({top:0,behavior:"auto"});
  }

  function chooseAnswer(event){
    if(state.answered)return;
    state.answered=true;
    const selected=Number(event.currentTarget.dataset.choice);
    const item=questions[state.question];
    const correct=selected===item.a;
    if(correct)state.score++;
    state.answers[state.question]={selected,correct};
    const buttons=[...el.content.querySelectorAll(".choice")];
    buttons.forEach((btn,i)=>{btn.disabled=true;if(i===item.a)btn.classList.add("correct");if(i===selected&&!correct)btn.classList.add("wrong");});
    const feedback=document.getElementById("feedback");
    feedback.className=`feedback show ${correct?"ok":"no"}`;
    feedback.innerHTML=`<strong>${correct?"✅ Correct":"❌ Incorrect"}</strong><br>Correct answer: ${"ABCD"[item.a]}. ${item.c[item.a]}<br><span class="mini">${item.e}</span>`;
    el.scorePill.textContent=`Score: ${state.score}`;
    el.nextQuestion.textContent=state.question===questions.length-1?"See Results →":"Next Question →";
    el.nextQuestion.classList.remove("hidden");
  }

  function nextQuestion(){
    if(!state.answered)return;
    if(state.question<questions.length-1){state.question++;state.answered=false;renderQuestion();}else{renderResults();}
  }

  function renderResults(){
    state.mode="results";
    const percent=Math.round((state.score/questions.length)*100);
    const missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct);
    const topicCounts={};
    missed.forEach(x=>{topicCounts[x.q.t]=(topicCounts[x.q.t]||0)+1;});
    const topics=Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const message=percent>=90?"Excellent work!":percent>=75?"Good job! Review a few topics.":percent>=60?"Nice effort. Review your missed topics.":"Keep practicing. Review the lesson and try again.";
    el.sectionLabel.textContent="Quiz Results";
    el.progressText.textContent="Complete";
    el.progressBar.style.width="100%";
    el.scorePill.textContent=`Score: ${state.score}`;
    el.content.innerHTML=`<div class="eyebrow">Quiz Complete</div><h2>${message}</h2><div class="result-score">${state.score}/30</div><div class="result-grid"><div class="result-card"><strong>${percent}%</strong>Percentage</div><div class="result-card"><strong>${state.score}</strong>Correct</div><div class="result-card"><strong>${30-state.score}</strong>Incorrect</div></div><div class="card yellow"><h3>Topics to Review</h3><p>${topics.length?topics.map(t=>`<span class="tag">${t}</span>`).join(" "):"No topics — you answered every question correctly!"}</p></div><div class="control-group" style="margin-top:18px"><button class="btn primary" id="reviewMistakesBtn" type="button" ${missed.length?"":"disabled"}>Review Mistakes</button><button class="btn secondary" id="tryAgainBtn" type="button">Try Quiz Again</button><button class="btn secondary" id="resultLessonBtn" type="button">Return to Lesson</button><button class="btn restart" id="restartAllBtn" type="button">Restart Everything</button></div>`;
    el.quizControls.classList.add("hidden");
    document.getElementById("reviewMistakesBtn").addEventListener("click",renderMistakes,{once:true});
    document.getElementById("tryAgainBtn").addEventListener("click",()=>startQuiz(true),{once:true});
    document.getElementById("resultLessonBtn").addEventListener("click",()=>{state.slide=0;renderSlide();},{once:true});
    document.getElementById("restartAllBtn").addEventListener("click",restartEverything,{once:true});
    window.scrollTo({top:0,behavior:"auto"});
  }

  function renderMistakes(){
    const missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct);
    el.sectionLabel.textContent="Review Mistakes";
    el.content.innerHTML=`<h2>Review Mistakes</h2><p class="lead">Questions missed: ${missed.map(x=>x.i+1).join(", ")}</p><div class="mistakes">${missed.map(x=>`<div class="mistake"><strong>Question ${x.i+1}: ${x.q.q}</strong><br><span class="mini">Correct answer: ${"ABCD"[x.q.a]}. ${x.q.c[x.q.a]} — ${x.q.e}</span></div>`).join("")}</div><div class="control-group" style="margin-top:18px"><button class="btn primary" id="mistakeAgainBtn" type="button">Try Quiz Again</button><button class="btn secondary" id="mistakeLessonBtn" type="button">Return to Lesson</button></div>`;
    document.getElementById("mistakeAgainBtn").addEventListener("click",()=>startQuiz(true),{once:true});
    document.getElementById("mistakeLessonBtn").addEventListener("click",()=>{state.slide=0;renderSlide();},{once:true});
    window.scrollTo({top:0,behavior:"auto"});
  }

  function restartEverything(){state.slide=0;state.question=0;state.score=0;state.answered=false;state.answers=[];renderSlide();}
  function showError(error){el.content.innerHTML=`<div class="error-box"><h2>Something went wrong</h2><p>The lesson could not continue. Please use Restart.</p><p class="mini">${String(error&&error.message?error.message:error)}</p></div>`;console.error(error);}

  function initializeApp(){
    try{
      el.back.addEventListener("click",()=>{if(state.slide>0){state.slide--;renderSlide();}});
      el.next.addEventListener("click",()=>{if(state.slide<slides.length-1){state.slide++;renderSlide();}else{startQuiz(true);}});
      el.restart.addEventListener("click",restartEverything);
      el.returnLesson.addEventListener("click",()=>{state.slide=slides.length-1;renderSlide();});
      el.nextQuestion.addEventListener("click",nextQuestion);
      document.addEventListener("keydown",event=>{
        if(state.mode!=="lesson")return;
        if(event.key==="ArrowLeft"&&state.slide>0){state.slide--;renderSlide();}
        if(event.key==="ArrowRight"&&state.slide<slides.length-1){state.slide++;renderSlide();}
      });
      renderSlide();
    }catch(error){showError(error);}
  }
  document.addEventListener("DOMContentLoaded",initializeApp,{once:true});
  window.addEventListener("error",event=>showError(event.error||event.message),{once:true});
  </script>
</body>
</html>
