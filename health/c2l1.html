</style></head><body><div class="app"><header class="topbar"><div class="brand">🌟 Building Character</div><div class="progress-wrap"><div class="progress-label"><span id="sectionLabel">Teaching Slides</span><span id="progressText">Slide 1</span></div><div class="progress"><span id="progressBar"></span></div></div><div class="score hidden" id="scorePill">Score: 0</div></header><main><section class="panel" id="content" aria-live="polite"><div class="eyebrow">Grade 6 Health • Lesson 1</div><h1>Building Character</h1><div class="big">Character is the way a person thinks, feels, and acts.</div><p class="lead">Tap <strong>Next</strong> to begin.</p><div class="tip"><strong>⭐ Remember:</strong> Character appears in thoughts, feelings, words, choices, and actions.</div></section></main><nav class="controls" id="lessonControls"><div class="group"><button class="btn secondary" id="backBtn">← Back</button><button class="btn restart" id="restartBtn">↻ Restart</button></div><button class="btn primary" id="nextBtn">Next →</button></nav><nav class="controls hidden" id="quizControls"><button class="btn secondary" id="returnLessonBtn">← Return to Lesson</button><button class="btn primary hidden" id="nextQuestionBtn">Next Question →</button></nav></div><noscript><div class="error"><strong>JavaScript is turned off.</strong> Please enable it to use this lesson.</div></noscript>
<script>"use strict";
const slides=[
{body:`<div class="eyebrow">Grade 6 Health • Lesson 1</div><h1>Building Character</h1><div class="big">Character is the way a person thinks, feels, and acts.</div><p class="lead">Learn the six traits of good character, what shapes character, and how character appears at home, school, and in the community.</p>`,remember:"Character appears in thoughts, feelings, words, choices, and actions."},
{body:`<h2>What You Must Know</h2><div class="grid"><div class="card"><h3>Character</h3><p>Know its meaning and how it affects health and relationships.</p></div><div class="card lav"><h3>Six Traits</h3><p>Trustworthiness, respect, responsibility, fairness, caring, and citizenship.</p></div><div class="card green"><h3>Influences</h3><p>Family, stories, life experiences, and role models shape character.</p></div><div class="card yellow"><h3>Character in Action</h3><p>Apply good character at home, school, and in the community.</p></div></div>`,remember:"Meaning → traits → influences → action."},
{body:`<h2>Understanding Character</h2><p><span class="term">Character</span> is the way a person thinks, feels, and acts.</p><p><span class="term">Character traits</span> are qualities that demonstrate how a person thinks, feels, and acts.</p><div class="flow"><div class="step">Core values</div><div class="arr">→</div><div class="step">Choices and actions</div><div class="arr">→</div><div class="step">Character</div></div><p>Good character is part of a healthy identity and can support physical, mental/emotional, and social health.</p>`,remember:"Character is shown by repeated values, choices, and actions."},
{body:`<h2>Six Traits of Good Character</h2><div class="grid three"><div class="card"><h3>Trustworthiness</h3></div><div class="card lav"><h3>Respect</h3></div><div class="card green"><h3>Responsibility</h3></div><div class="card yellow"><h3>Fairness</h3></div><div class="card"><h3>Caring</h3></div><div class="card lav"><h3>Citizenship</h3></div></div><p><span class="term">Citizenship</span> is the way you conduct yourself as a member of a community.</p>`,remember:"Trust, respect, responsibility, fairness, caring, citizenship."},
{body:`<h2>Trustworthiness and Integrity</h2><p>Honest, truthful, and reliable people earn trust. They do what they say they will do.</p><p><span class="term">Integrity</span> is being true to your ethical values.</p><div class="grid"><div class="card green"><h3>Quiz Example</h3><p>Gabriel covers his answers instead of letting Tuan copy.</p></div><div class="card yellow"><h3>Wallet Example</h3><p>A person with integrity returns a wallet left on a lunch table.</p></div></div><p>Loyalty also supports trustworthiness.</p>`,remember:"Integrity means doing what matches your ethical values."},
{body:`<h2>Respect and Tolerance</h2><p>Respect begins with self-respect, including avoiding high-risk behaviors.</p><ul class="bullets"><li>Consider the feelings of others.</li><li>Use good manners.</li><li>Listen to a different point of view.</li></ul><p><span class="term">Tolerance</span> is the ability to accept other people as they are.</p>`,remember:"Respect yourself, consider others, and accept differences."},
{body:`<h2>Prejudice and Hate Crime</h2><p><span class="term">Prejudice</span> may cause someone to dislike another person because of gender, skin color, religion, cultural background, disability, sexual orientation, or body size.</p><p>A <span class="term">hate crime</span> is a crime committed against another person or group based on racial, religious, or sexual background.</p><div class="card red"><h3>Important Effect</h3><p>Prejudice creates a barrier to healthy relationships. Discriminating against others is against the law.</p></div>`,remember:"Prejudice blocks healthy relationships; violent prejudice may be a hate crime."},
{body:`<h2>Responsibility and Accountability</h2><p>Responsibility means being willing to take on duties and tasks and following through without reminders.</p><p><span class="term">Accountability</span> is a willingness to answer for your actions and decisions.</p><div class="flow"><div class="step">Make a choice</div><div class="arr">→</div><div class="step">Follow through</div><div class="arr">→</div><div class="step">Accept the result</div></div><p>Accountable people do not blame others for their mistakes.</p>`,remember:"Responsibility does the task; accountability answers for the result."},
{body:`<h2>Responsibility for Health</h2><p>Good decisions show responsibility for health.</p><div class="grid"><div class="card green"><h3>Healthful Choices</h3><p>Choosing healthful foods can maintain or improve physical health.</p></div><div class="card yellow"><h3>Abstinence</h3><p>Avoid behaviors that can harm health, including sexual activity and using alcohol, tobacco, and other drugs.</p></div></div>`,remember:"Responsible health choices support or protect health."},
{body:`<h2>Fairness</h2><p>Fairness means treating people equally and honestly.</p><ul class="bullets"><li>Give an award to the person who deserves it.</li><li>Take turns and share.</li><li>Be a good sport, whether you win or lose.</li></ul>`,remember:"Fairness = equal + honest."},
{body:`<h2>Caring and Empathy</h2><p>A caring person treats others with kindness and understanding.</p><ul class="bullets"><li>Considers feelings.</li><li>Shows gratitude.</li><li>Offers forgiveness.</li><li>Gives time, attention, and help.</li></ul><p><span class="term">Empathy</span> means identifying with and sharing another person's feelings.</p>`,remember:"Empathy shares feelings; caring responds with kindness and help."},
{body:`<h2>Citizenship</h2><p><span class="term">Citizenship</span> is how you act as a member of your neighborhood, school, city, or country.</p><div class="grid"><div class="card green"><h3>Follow</h3><p>Obey rules and laws.</p></div><div class="card"><h3>Protect</h3><p>Take a stand against violence and bullying.</p></div><div class="card yellow"><h3>Serve</h3><p>Volunteer for a community cause such as a beach or forest clean-up.</p></div><div class="card lav"><h3>Care</h3><p>Care for people, the community, and the environment.</p></div></div>`,remember:"A good citizen follows rules, helps, and takes a stand."},
{body:`<h2>What Shapes Character?</h2><p>Life experiences and role models shape character.</p><div class="table-wrap"><table class="table"><thead><tr><th>Influence</th><th>What the Lesson Says</th></tr></thead><tbody><tr><td>Parents or guardians</td><td>Early teachers of values and character.</td></tr><tr><td>Stories</td><td>Morals teach values or character traits.</td></tr><tr><td>Life experiences</td><td>Mistakes can teach lessons.</td></tr><tr><td>Other people</td><td>Teachers, adults, and friends can shape character.</td></tr></tbody></table></div>`,remember:"Character grows from early teaching, stories, experiences, and people."},
{body:`<h2>Role Models</h2><p>Modeling means learning how to act by watching and listening to others.</p><p>A <span class="term">role model</span> is a person who inspires you to think or act in a certain way. A role model may be older, the same age, or younger.</p><p>Role models teach skills, show how to act in different conditions, and help build positive relationships.</p>`,remember:"A role model inspires behavior through example."},
{body:`<h2>Developing Good Character</h2><p>Good character means making good choices.</p><div class="grid"><div class="card"><h3>Responsibility</h3><p>Complete family chores.</p></div><div class="card lav"><h3>Respect</h3><p>Listen to different points of view.</p></div><div class="card green"><h3>Caring</h3><p>Help a person in need.</p></div><div class="card yellow"><h3>Citizenship</h3><p>Obey rules and respect authority.</p></div></div><p>The more you practice valued traits, the more they become part of your character.</p>`,remember:"Choose a trait, practice it, and make it part of your character."},
{body:`<h2>Character in Action</h2><p>Good character is shown through actions and words.</p><div class="flow"><div class="step">Good words and actions</div><div class="arr">→</div><div class="step">Trust and respect</div><div class="arr">→</div><div class="step">Strong relationships</div></div><p>Communication that shows good character supports positive relationships.</p>`,remember:"Character becomes visible through actions and words."},
{body:`<h2>Making a Difference at Home</h2><ul class="bullets"><li>Treat family members with caring and respect.</li><li>Show thanks and help with chores without being asked.</li><li>Be patient and kind with siblings.</li></ul><p><span class="term">Constructive criticism</span> uses a positive message to make a suggestion.</p><p>Encourage a younger sibling and make difficult steps easier to remember.</p>`,remember:"Constructive criticism helps with a positive suggestion."},
{body:`<h2>Problems at Home</h2><p>Teens can maintain good character even when experiencing problems.</p><div class="grid"><div class="card"><h3>Problem with a Parent</h3><p>Talk to another trusted adult and ask for advice.</p></div><div class="card green"><h3>Problem with a Sibling</h3><p>Try talking to the sibling. If that does not work, ask a parent or guardian to help.</p></div></div>`,remember:"Use respectful communication and trusted help to solve problems."},
{body:`<h2>Cliques at School</h2><p>A <span class="term">clique</span> is a group of friends who hang out together and act in similar ways.</p><div class="grid"><div class="card green"><h3>Possible Benefit</h3><p>A clique may provide a sense of belonging.</p></div><div class="card red"><h3>Possible Harm</h3><p>It becomes negative when it leaves others out or shows prejudice toward people who are different.</p></div></div>`,remember:"A clique may give belonging, but exclusion and prejudice are harmful."},
{body:`<h2>Good Character at School</h2><ul class="bullets"><li>Accept others and show tolerance toward differences.</li><li>Finish assignments on time.</li><li>Obey school rules.</li><li>Treat teachers and students with respect.</li><li>Take a stand against violence, bullying, and conflict.</li></ul>`,remember:"At school: accept, finish, obey, respect, and take a stand."},
{body:`<h2>Making a Difference in the Community</h2><p>Good citizenship includes caring for people and the environment.</p><div class="grid"><div class="card green"><h3>Protect</h3><p>Throw away trash properly and recycle bottles, cans, and paper.</p></div><div class="card"><h3>Volunteer</h3><p>Serve food, collect clothes, or teach younger children.</p></div><div class="card yellow"><h3>Advocate</h3><p>Support fairness, equality, caring, giving, and a better community.</p></div><div class="card lav"><h3>Improve</h3><p>Help improve the lives of others in the same community.</p></div></div>`,remember:"Volunteering is citizenship in action."},
{body:`<h2>Vocabulary Review 1</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>character</strong></td><td>The way a person thinks, feels, and acts.</td><td>Think + feel + act.</td></tr><tr><td><strong>character traits</strong></td><td>Qualities showing how a person thinks, feels, and acts.</td><td>Traits show character.</td></tr><tr><td><strong>citizenship</strong></td><td>The way you conduct yourself as a community member.</td><td>How you act in a community.</td></tr><tr><td><strong>integrity</strong></td><td>Being true to your ethical values.</td><td>Values match actions.</td></tr><tr><td><strong>tolerance</strong></td><td>The ability to accept people as they are.</td><td>Accept differences.</td></tr><tr><td><strong>prejudice</strong></td><td>Disliking another person because of a personal or group difference named in the lesson.</td><td>Judging a difference.</td></tr></tbody></table></div>`,remember:"Match each word to the choice or behavior it describes."},
{body:`<h2>Vocabulary Review 2</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>hate crime</strong></td><td>A crime against a person or group based on racial, religious, or sexual background.</td><td>Crime caused by prejudice.</td></tr><tr><td><strong>accountability</strong></td><td>Willingness to answer for actions and decisions.</td><td>Answer for results.</td></tr><tr><td><strong>empathy</strong></td><td>Identifying with and sharing another person's feelings.</td><td>Share the feeling.</td></tr><tr><td><strong>role model</strong></td><td>A person who inspires you to think or act in a certain way.</td><td>Example that inspires.</td></tr><tr><td><strong>constructive criticism</strong></td><td>Using a positive message to make a suggestion.</td><td>Positive suggestion.</td></tr><tr><td><strong>clique</strong></td><td>A group of friends who hang out and act in similar ways.</td><td>Similar friend group.</td></tr></tbody></table></div>`,remember:"Harmful judgment, responsible action, feelings, examples, suggestions, and groups."},
{body:`<h2>Final 4-Minute Review</h2><div class="checks"><div class="check"><span class="tick">✓</span><div>Character is the way a person thinks, feels, and acts.</div></div><div class="check"><span class="tick">✓</span><div>Six traits: trustworthiness, respect, responsibility, fairness, caring, citizenship.</div></div><div class="check"><span class="tick">✓</span><div>Integrity matches ethical values; accountability answers for actions.</div></div><div class="check"><span class="tick">✓</span><div>Tolerance accepts people; prejudice creates barriers.</div></div><div class="check"><span class="tick">✓</span><div>Empathy identifies with and shares another person's feelings.</div></div><div class="check"><span class="tick">✓</span><div>Family, stories, experiences, and role models shape character.</div></div><div class="check"><span class="tick">✓</span><div>Good character is a choice strengthened by practice.</div></div><div class="check"><span class="tick">✓</span><div>Show character through respect, help, school behavior, advocacy, and volunteering.</div></div></div>`,remember:"Know the six traits, practice them, and show them through action."},
{body:`<h2>Lesson 1 Review — Answers</h2><div class="review-grid"><div class="qa"><b>1. Define character and use it.</b><br>Character is the way a person thinks, feels, and acts. “Her honest choice showed good character.”</div><div class="qa"><b>2. How does character support health?</b><br>Respecting the body supports physical health; honesty and reliability build relationships; kindness helps people get along.</div><div class="qa"><b>3. Three places to show character?</b><br>At home, at school, and in the community.</div><div class="qa"><b>4. Example of citizenship?</b><br>Volunteering for a beach or forest clean-up shows caring, responsibility, and help for the community.</div><div class="qa"><b>5. How can Gary show empathy for Jon?</b><br>Recognize and share Jon's frustration, listen, and give time, attention, and help.</div><div class="qa"><b>6. Respectful school-poster rules?</b><br>Listen to different views, accept differences, treat people equally and honestly, follow rules, and stand against bullying.</div><div class="qa"><b>7. Advocate against clique bullying?</b><br>Take a stand against bullying and seek adult help. This uses caring, respect, fairness, responsibility, and citizenship.</div></div>`,remember:"Review all seven answers, then begin the quiz."}
];

const state={mode:"lesson",slide:0,question:0,score:0,answered:false,answers:[]};const el={content:document.getElementById("content"),section:document.getElementById("sectionLabel"),progressText:document.getElementById("progressText"),bar:document.getElementById("progressBar"),score:document.getElementById("scorePill"),lessonControls:document.getElementById("lessonControls"),quizControls:document.getElementById("quizControls"),back:document.getElementById("backBtn"),next:document.getElementById("nextBtn"),restart:document.getElementById("restartBtn"),returnLesson:document.getElementById("returnLessonBtn"),nextQuestion:document.getElementById("nextQuestionBtn")};
function renderSlide(){state.mode="lesson";const s=slides[state.slide];el.content.innerHTML=s.body+`<div class="tip"><strong>⭐ Remember:</strong> ${s.remember}</div>`;el.section.textContent=state.slide===slides.length-1?"Lesson Review":"Teaching Slides";el.progressText.textContent=`Slide ${state.slide+1} of ${slides.length}`;el.bar.style.width=`${(state.slide+1)/slides.length*100}%`;el.score.classList.add("hidden");el.lessonControls.classList.remove("hidden");el.quizControls.classList.add("hidden");el.back.disabled=state.slide===0;el.next.textContent=state.slide===slides.length-1?"Start Quiz →":"Next →";window.scrollTo({top:0,behavior:"auto"})}function startQuiz(reset=true){state.mode="quiz";if(reset){state.question=0;state.score=0;state.answers=[]}state.answered=false;el.lessonControls.classList.add("hidden");el.quizControls.classList.remove("hidden");el.score.classList.remove("hidden");renderQuestion()}function renderQuestion(){const item=questions[state.question],level=state.question<10?"Easy":state.question<20?"Medium":"Hard";el.section.textContent="30-Question Quiz";el.progressText.textContent=`Question ${state.question+1} of ${questions.length}`;el.bar.style.width=`${(state.question+1)/questions.length*100}%`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.classList.add("hidden");el.content.innerHTML=`<div class="quiz-head"><span class="tag">Question ${state.question+1} of ${questions.length}</span><span class="difficulty ${level.toLowerCase()}">${level}</span></div><div class="question">${item.q}</div><div class="choices">${item.c.map((x,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${"ABCD"[i]}</span><span>${x}</span></button>`).join("")}</div><div class="feedback" id="feedback" aria-live="assertive"></div>`;el.content.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",chooseAnswer,{once:true}));window.scrollTo({top:0,behavior:"auto"})}function chooseAnswer(event){if(state.answered)return;state.answered=true;const selected=Number(event.currentTarget.dataset.choice),item=questions[state.question],correct=selected===item.a;if(correct)state.score++;state.answers[state.question]={selected,correct};[...el.content.querySelectorAll(".choice")].forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add("correct");if(i===selected&&!correct)b.classList.add("wrong")});const f=document.getElementById("feedback");f.className=`feedback show ${correct?"ok":"no"}`;f.innerHTML=`<strong>${correct?"✅ Correct":"❌ Incorrect"}</strong><br>Correct answer: ${"ABCD"[item.a]}. ${item.c[item.a]}<br><span class="mini">${item.e}</span>`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.textContent=state.question===questions.length-1?"See Results →":"Next Question →";el.nextQuestion.classList.remove("hidden")}function goNextQuestion(){if(!state.answered)return;if(state.question<questions.length-1){state.question++;state.answered=false;renderQuestion()}else renderResults()}function renderResults(){state.mode="results";const percent=Math.round(state.score/questions.length*100),missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct),counts={};missed.forEach(x=>counts[x.q.t]=(counts[x.q.t]||0)+1);const topics=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),message=percent>=90?"Excellent work!":percent>=75?"Good job! Review a few topics.":percent>=60?"Nice effort. Review your missed topics.":"Keep practicing. Review the lesson and try again.";el.section.textContent="Quiz Results";el.progressText.textContent="Complete";el.bar.style.width="100%";el.score.textContent=`Score: ${state.score}`;el.content.innerHTML=`<div class="eyebrow">Quiz Complete</div><h2>${message}</h2><div class="result-score">${state.score}/30</div><div class="result-grid"><div class="result-card"><strong>${percent}%</strong>Percentage</div><div class="result-card"><strong>${state.score}</strong>Correct</div><div class="result-card"><strong>${30-state.score}</strong>Incorrect</div></div><div class="card yellow"><h3>Topics to Review</h3><p>${topics.length?topics.map(t=>`<span class="tag">${t}</span>`).join(" "):"No topics — every answer was correct!"}</p></div><div class="group" style="margin-top:18px"><button class="btn primary" id="reviewMistakes" ${missed.length?"":"disabled"}>Review Mistakes</button><button class="btn secondary" id="tryAgain">Try Quiz Again</button><button class="btn secondary" id="resultLesson">Return to Lesson</button><button class="btn restart" id="restartAll">Restart Everything</button></div>`;el.quizControls.classList.add("hidden");document.getElementById("reviewMistakes").addEventListener("click",renderMistakes,{once:true});document.getElementById("tryAgain").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("resultLesson").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});document.getElementById("restartAll").addEventListener("click",restartAll,{once:true});window.scrollTo({top:0,behavior:"auto"})}function renderMistakes(){const missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct);el.section.textContent="Review Mistakes";el.content.innerHTML=`<h2>Review Mistakes</h2><p class="lead">Questions missed: ${missed.map(x=>x.i+1).join(", ")}</p><div class="mistakes">${missed.map(x=>`<div class="mistake"><strong>Question ${x.i+1}: ${x.q.q}</strong><br><span class="mini">Correct answer: ${"ABCD"[x.q.a]}. ${x.q.c[x.q.a]} — ${x.q.e}</span></div>`).join("")}</div><div class="group" style="margin-top:18px"><button class="btn primary" id="againFromMistakes">Try Quiz Again</button><button class="btn secondary" id="lessonFromMistakes">Return to Lesson</button></div>`;document.getElementById("againFromMistakes").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("lessonFromMistakes").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});window.scrollTo({top:0,behavior:"auto"})}function restartAll(){state.slide=0;state.question=0;state.score=0;state.answered=false;state.answers=[];renderSlide()}function showError(error){el.content.innerHTML=`<div class="error"><h2>Something went wrong</h2><p>Please use Restart.</p><p class="mini">${String(error&&error.message?error.message:error)}</p></div>`;console.error(error)}function init(){try{el.back.addEventListener("click",()=>{if(state.slide>0){state.slide--;renderSlide()}});el.next.addEventListener("click",()=>{if(state.slide<slides.length-1){state.slide++;renderSlide()}else startQuiz(true)});el.restart.addEventListener("click",restartAll);el.returnLesson.addEventListener("click",()=>{state.slide=slides.length-1;renderSlide()});el.nextQuestion.addEventListener("click",goNextQuestion);document.addEventListener("keydown",e=>{if(state.mode!=="lesson")return;if(e.key==="ArrowLeft"&&state.slide>0){state.slide--;renderSlide()}if(e.key==="ArrowRight"&&state.slide<slides.length-1){state.slide++;renderSlide()}});renderSlide()}catch(error){showError(error)}}document.addEventListener("DOMContentLoaded",init,{once:true});window.addEventListener("error",e=>showError(e.error||e.message),{once:true});
