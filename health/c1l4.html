  }

<script>
const slides = [
{
  type:'teach', title:'Making Decisions and Setting Goals', kicker:'Lesson 4 • Animated Touchscreen Tutor',
  body:`<p class="sub">Built only from the provided Lesson 4 study material and teacher vocabulary.</p>
  <div class="mainidea"><b>BIG IDEA:</b> Mental and emotional disorders can be treated.</div>
  <div class="card"><h3>Before You Read — Quick Write</h3><p>Describe a decision you made recently. List the steps you took when making that decision.</p></div>
  <div class="grid"><div class="card"><b>Teaching</b><p>Decisions, six steps, H.E.L.P., values, goals, and S.M.A.R.T.</p></div><div class="card"><b>Exam Practice</b><p>35 questions, one at a time, with instant feedback and score.</p></div></div>`,
  remember:'Lesson 4 = DECISIONS + GOALS.'
},
{
  type:'teach', title:'What You Must Know', kicker:'Study Map',
  body:`<div class="grid3">
    <div class="card"><b>1. Decisions & Health</b><p>Decisions → consequences → health.</p></div>
    <div class="card"><b>2. Six-Step Process</b><p>Know and understand all 6 steps.</p></div>
    <div class="card"><b>3. H.E.L.P.</b><p>Healthful, Ethical, Legal, Parent Approval.</p></div>
    <div class="card"><b>4. Values & Criteria</b><p>Values guide how a person lives; criteria are standards for decisions.</p></div>
    <div class="card"><b>5. Types of Goals</b><p>Short-term vs. long-term and how they connect.</p></div>
    <div class="card"><b>6. S.M.A.R.T.</b><p>Specific, Measurable, Attainable, Relevant, Timely.</p></div>
  </div>
  <p class="sub">Also know Tran's chess club/movie situation, trusted adults, consequences, respect, and healthful rewards.</p>`,
  remember:'Six big topics: Decisions, 6 Steps, H.E.L.P., Values, Goals, S.M.A.R.T.'
},
{
  type:'teach', title:'Teacher Vocabulary — Part 1', kicker:'Must Memorize Exactly',
  body:`<table class="vocab-table">
    <tr><td>Decision making</td><td>The process of making a choice or solving a problem.</td></tr>
    <tr><td>Ethical</td><td>Choosing to take the right action.</td></tr>
    <tr><td>Values</td><td>The beliefs that guide the way a person lives.</td></tr>
    <tr><td>Criteria</td><td>Standard on which to base decisions.</td></tr>
  </table>`,
  remember:'Decision making = choice/problem; Ethical = right action; Values = beliefs; Criteria = standard.'
},
{
  type:'teach', title:'Teacher Vocabulary — Part 2', kicker:'Must Memorize Exactly',
  body:`<table class="vocab-table">
    <tr><td>Goal setting</td><td>The process of working toward something you want to accomplish.</td></tr>
    <tr><td>Short-term goal</td><td>A goal that you can achieve in short length of time.</td></tr>
    <tr><td>Long-term goal</td><td>A goal that you plan to reach over an extended period of time.</td></tr>
  </table>
  <div class="quote">Teacher definitions are preserved exactly as provided.</div>`,
  remember:'Goal setting = work toward what you want to accomplish.'
},
{
  type:'teach', title:'Decisions and Your Health', kicker:'Topic 1',
  body:`<div class="mainidea"><b>MAIN IDEA:</b> All of your decisions have consequences that can positively or negatively affect your health.</div>
  <p>As you get older, you can make more decisions on your own. Making responsible decisions can allow you to gain more privileges.</p>
  <p>To make good decisions, think about two things: <b>Which choice is healthful?</b> and <b>Which choice fits my values?</b></p>`,
  remember:'Good decisions consider HEALTH + VALUES.'
},
{
  type:'teach', title:'Decision → Consequence → Health', kicker:'Important Connections',
  body:`<div class="grid3">
    <div class="card"><b>Not using tobacco</b><p>→ positive long-term effect on <b>physical health</b></p></div>
    <div class="card"><b>Reporting a bully</b><p>→ promotes <b>mental/emotional health</b></p></div>
    <div class="card"><b>Friendships with others who share your values</b><p>→ promotes <b>social health</b></p></div>
  </div>
  <p>Some decisions may help you avoid harmful behaviors. For some decisions, you may also want help from <b>parents, guardians, or other trusted adults</b>.</p>`,
  remember:'Every decision can have a positive or negative consequence.'
},
{
  type:'teach', title:'What Is Decision Making?', kicker:'Topic 2',
  body:`<div class="teacher-def"><b>Decision making</b> — The process of making a choice or solving a problem.</div>
  <p>You make decisions every day: what to eat for breakfast, what music to buy, or whether to join a sports team.</p>
  <p>Some decisions are easy. Others are more difficult. The process helps you make the best possible decisions and helps keep you from deciding without thinking things through.</p>`,
  remember:'Decision making = CHOICE or PROBLEM → think → decide.'
},
{
  type:'teach', title:'The 6 Decision-Making Steps', kicker:'Very Important for the Test',
  body:`<div class="grid">
    <div class="step-row"><div class="step-num">1</div><div><h3>State the situation</h3></div></div>
    <div class="step-row"><div class="step-num">2</div><div><h3>List the options</h3></div></div>
    <div class="step-row"><div class="step-num">3</div><div><h3>Weigh the possible outcomes</h3></div></div>
    <div class="step-row"><div class="step-num">4</div><div><h3>Consider your values</h3></div></div>
    <div class="step-row"><div class="step-num">5</div><div><h3>Make a decision and act</h3></div></div>
    <div class="step-row"><div class="step-num">6</div><div><h3>Evaluate the decision</h3></div></div>
  </div>`,
  remember:'STATE → LIST → WEIGH → VALUES → ACT → EVALUATE.'
},
{
  type:'teach', title:"Tran's Situation", kicker:'Book Example',
  body:`<p>Tran is a member of the school chess club. The club is preparing for a competition with another school.</p>
  <div class="bigline">Chess club meeting: <b>3:30 tomorrow</b></div>
  <p>His friends want him to go to a movie with them. Tran uses the decision-making process to decide what to do.</p>
  <div class="grid"><div class="card"><b>Choice 1</b><p>Go to chess club.</p></div><div class="card"><b>Choice 2</b><p>Go to a movie with friends.</p></div></div>`,
  remember:'Tran = CHESS CLUB vs. MOVIE.'
},
{
  type:'teach', title:'Step 1 — State the Situation', kicker:'Decision-Making Process',
  body:`<p>Identify the situation as you understand it.</p>
  <div class="grid3"><div class="card"><b>Ask:</b><p>What choice do you need to make?</p></div><div class="card"><b>Ask:</b><p>What are the facts?</p></div><div class="card"><b>Ask:</b><p>Who else is involved?</p></div></div>
  <p>Tran knows the chess club depends on him, he needs practice for the competition, and he also likes being with his friends. His choice involves himself, the chess club members, and his friends.</p>
  <div class="quote">When you understand the situation and your choices, you can make a sound decision.</div>`,
  remember:'Step 1 = Know the CHOICE, FACTS, and PEOPLE involved.'
},
{
  type:'teach', title:'Step 2 — List the Options', kicker:'Decision-Making Process',
  body:`<p>Think of your options and list all the possibilities you can think of.</p>
  <ul><li>Include only options that are <b>safe</b>.</li><li>It is never an option to risk your health or someone else's health.</li><li>Ask an adult you trust for advice when making an important decision.</li></ul>
  <p>Tran listed chess club and the movie. His mom suggested a third option: go to chess club for part of the meeting, then leave early to join his friends at the movie theatre.</p>`,
  remember:'Step 2 = List SAFE options; trusted adults can help.'
},
{
  type:'teach', title:'Step 3 — Weigh the Possible Outcomes', kicker:'Decision-Making Process',
  body:`<p>After listing options, evaluate the <b>consequences</b> of each option.</p>
  <div class="smart"><div class="s">H<br>Healthful</div><div class="s">E<br>Ethical</div><div class="s">L<br>Legal</div><div class="s">P<br>Parent Approval</div><div class="s">→<br>Outcome</div></div>
  <p>The word <b>H.E.L.P.</b> can help you work through this step.</p>`,
  remember:'H.E.L.P. is used in Step 3.'
},
{
  type:'teach', title:'H.E.L.P. — What Each Letter Means', kicker:'Step 3 Tool',
  body:`<div class="help-grid">
    <div class="help-card"><div class="letter">H</div><h3>Healthful</h3><p>What health risks will this option present to me or to others?</p></div>
    <div class="help-card"><div class="letter">E</div><h3>Ethical</h3><p>Does this choice reflect what you and your family believe to be right? Does it show respect?</p></div>
    <div class="help-card"><div class="letter">L</div><h3>Legal</h3><p>Will I be breaking the law? Is this legal for someone my age?</p></div>
    <div class="help-card"><div class="letter">P</div><h3>Parent Approval</h3><p>Would your parents approve of this choice?</p></div>
  </div>
  <div class="teacher-def"><b>Ethical</b> — Choosing to take the right action.</div>`,
  remember:'H = Healthful, E = Ethical, L = Legal, P = Parent Approval.'
},
{
  type:'teach', title:"How Tran Used H.E.L.P.", kicker:'Step 3 Example',
  body:`<ul>
    <li>None of the choices presented health risks to himself or others.</li>
    <li>He felt that all the choices were ethical.</li>
    <li>He worried the chess club members might feel disrespected if he skipped club for the movie.</li>
    <li>He determined that all choices were legal.</li>
    <li>He thought his parents would probably not be too upset with any choice.</li>
  </ul>`,
  remember:'H.E.L.P. = check each option before you choose.'
},
{
  type:'teach', title:'Step 4 — Consider Your Values', kicker:'Decision-Making Process',
  body:`<div class="teacher-def"><b>Values</b> — The beliefs that guide the way a person lives.</div>
  <p>Values reflect what is important to you and what you have learned is right and wrong.</p>
  <div class="review-list"><span class="pill">honesty</span><span class="pill">respect</span><span class="pill">consideration</span><span class="pill">good health</span></div>
  <p>Tran realized that <b>keeping commitments</b> and <b>friendship</b> were both very important to him.</p>`,
  remember:'Values = beliefs that GUIDE how you live.'
},
{
  type:'teach', title:'Criteria Help You Decide', kicker:'Values & Criteria',
  body:`<div class="teacher-def"><b>Criteria</b> — Standard on which to base decisions.</div>
  <p>Values provide criteria that help you evaluate the possible outcomes of your decision.</p>
  <div class="grid"><div class="card"><b>If you value good health…</b><p>You will exercise regularly and eat nutritious foods.</p></div><div class="card"><b>If you value honesty…</b><p>You will not make decisions that involve lying, cheating, or stealing.</p></div></div>`,
  remember:'VALUES guide you; CRITERIA are standards for the decision.'
},
{
  type:'teach', title:'Step 5 — Make a Decision and Act', kicker:'Decision-Making Process',
  body:`<p>Choose the option that seems best for you after weighing options, risks, and consequences.</p>
  <ul><li>Be comfortable with your decision.</li><li>Think about how it may affect others.</li><li>Make sure the option supports your values.</li><li>If you are unsure, ask a trusted adult.</li><li>This step is not complete until you <b>take action</b>.</li></ul>
  <p>Tran chose his mom's suggestion: attend chess club, tell the advisor he would leave early, practice, then join his friends at the movie theatre.</p>`,
  remember:'Step 5 = CHOOSE + ACT.'
},
{
  type:'teach', title:'Step 6 — Evaluate the Decision', kicker:'Decision-Making Process',
  body:`<p>After you take action, evaluate the results. This can help you make better decisions in the future.</p>
  <div class="grid"><div class="card"><b>Ask yourself:</b><ul><li>Was the outcome positive or negative?</li><li>Were there unexpected outcomes?</li><li>Could I have done anything differently?</li></ul></div><div class="card"><b>Also ask:</b><ul><li>How did my decision affect others?</li><li>Did I make the right decision?</li><li>What did I learn?</li></ul></div></div>
  <p>If the outcome was not what you expected, try again and use the decision-making process to find another way.</p>`,
  remember:'Step 6 = LOOK BACK → LEARN → make better decisions next time.'
},
{
  type:'teach', title:"Tran's Evaluation", kicker:'Step 6 Example',
  body:`<ul><li>He felt the outcome was positive.</li><li>There were no unexpected outcomes.</li><li>He would not have done anything differently.</li><li>His decision did not affect others negatively.</li><li>He felt he made the right decision.</li><li>He learned that using the process is worth the time.</li></ul>
  <p>Tran also knew that some decisions are harder than others, and more difficult decisions can take much more time.</p>`,
  remember:'Evaluate = What happened? What did I learn?'
},
{
  type:'teach', title:'Easy to Confuse', kicker:'Decision Vocabulary',
  body:`<div class="grid">
    <div class="card"><h3>Decision vs. Consequence</h3><p><b>Decision</b> → the choice you make</p><p><b>Consequence</b> → what happens because of the choice</p></div>
    <div class="card"><h3>Healthful vs. Values</h3><p><b>Healthful</b> → think about health risks</p><p><b>Values</b> → beliefs that guide the way a person lives</p></div>
    <div class="card"><h3>Values vs. Criteria</h3><p><b>Values</b> → beliefs</p><p><b>Criteria</b> → standard on which to base decisions</p></div>
    <div class="card"><h3>Step 5 vs. Step 6</h3><p><b>Step 5</b> → choose and act</p><p><b>Step 6</b> → evaluate the result</p></div>
  </div>`,
  remember:'CHOICE → RESULT; BELIEFS → STANDARDS; ACT → EVALUATE.'
},
{
  type:'teach', title:'Setting Realistic Goals', kicker:'Topic 5',
  body:`<div class="mainidea"><b>MAIN IDEA:</b> Goals can be short-term or long-term.</div>
  <p>A <b>goal</b> is something you want to accomplish.</p>
  <div class="teacher-def"><b>Goal setting</b> — The process of working toward something you want to accomplish.</div>
  <p>Setting a goal and planning to achieve it can help you focus on what you want to accomplish. Goals can help you make good decisions, give you a sense of purpose, and help you measure your progress.</p>`,
  remember:'GOAL = something you want to accomplish.'
},
{

let slideIndex = 0;
let quizMode = false;
let qIndex = 0;
let score = 0;
let answered = false;
let wrongTopics = {};

const screen = document.getElementById('screen');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');
const nav = document.getElementById('nav');

function renderSlide(){
  quizMode = false;
  const s = slides[slideIndex];
  const sectionName = s.type === 'review' ? 'Final Review' : 'Teaching Slides';
  screen.innerHTML = `
    <div class="section-label">${sectionName}</div>
    <div class="kicker">${s.kicker}</div>
    <h2>${s.title}</h2>
    ${s.body}
    <div class="remember"><b>⭐ Remember</b> — ${s.remember}</div>`;
  counter.textContent = `Slide ${slideIndex+1} of ${slides.length}`;
  progressBar.style.width = `${((slideIndex+1)/slides.length)*100}%`;
  backBtn.disabled = slideIndex===0;
  backBtn.classList.remove('hidden');
  restartBtn.classList.remove('hidden');
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = slideIndex===slides.length-1 ? 'Start 35-Question Quiz →' : 'Next →';
  window.scrollTo({top:0,behavior:'smooth'});
}

function startQuiz(){
  quizMode = true;
  qIndex = 0; score = 0; answered = false; wrongTopics = {};
  backBtn.classList.add('hidden');
  nextBtn.classList.add('hidden');
  restartBtn.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  if(qIndex >= questions.length){ renderFinal(); return; }
  quizMode = true;
  answered = false;
  const q = questions[qIndex];
  const difficulty = qIndex < 12 ? 'Easy' : qIndex < 23 ? 'Medium' : 'Hard';
  screen.innerHTML = `
    <div class="section-label">35-Question Touchscreen Quiz</div>
    <div class="kicker"><span class="modebadge">${difficulty}</span> <span class="scorechip">Score: ${score}/${qIndex}</span></div>
    <div class="question">${qIndex+1}. ${q.q}</div>
    <div class="answers">
      ${q.a.map((x,i)=>`<button class="answer" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="quizNext" class="btn btn-next quiz-next">Next Question →</button>
    <div class="remember"><b>⭐ Remember</b> — Answer first; the correct answer appears only after you tap a choice.</div>`;
  counter.textContent = `Question ${qIndex+1} of ${questions.length}`;
  progressBar.style.width = `${((qIndex+1)/questions.length)*100}%`;
  screen.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answerQuestion(Number(b.dataset.i))));
  document.getElementById('quizNext').addEventListener('click',()=>{qIndex++; renderQuestion();});
  window.scrollTo({top:0,behavior:'smooth'});
}

function answerQuestion(choice){
  if(answered) return;
  answered = true;
  const q = questions[qIndex];
  const buttons = [...screen.querySelectorAll('.answer')];
  buttons.forEach(b=>b.disabled=true);
  buttons[q.c].classList.add('correct');
  const feedback = document.getElementById('feedback');
  if(choice===q.c){
    score++;
    feedback.className='feedback good';
    feedback.innerHTML=`✅ <b>Correct!</b><br>Correct answer: <b>${String.fromCharCode(65+q.c)}. ${q.a[q.c]}</b><br>${q.ex}<br><b>Score: ${score}/${qIndex+1}</b>`;
  } else {
    buttons[choice].classList.add('wrong');
    wrongTopics[q.topic]=(wrongTopics[q.topic]||0)+1;
    feedback.className='feedback bad';
    feedback.innerHTML=`❌ <b>Incorrect.</b><br>Correct answer: <b>${String.fromCharCode(65+q.c)}. ${q.a[q.c]}</b><br>${q.ex}<br><b>⭐ Remember:</b> ${memoryFor(q.topic)}<br><b>Score: ${score}/${qIndex+1}</b>`;
  }
  document.getElementById('quizNext').style.display='inline-block';
}

function memoryFor(topic){
  const m={
    'Vocabulary':'Teacher definitions are the key.',
    'Values & Criteria':'VALUES = beliefs; CRITERIA = standards.',
    'Goals':'SHORT = short length of time; LONG = extended period.',
    'Decision Process':'STATE → LIST → WEIGH → VALUES → ACT → EVALUATE.',
    'Decisions & Health':'Decision → consequence → health.',
    'H.E.L.P.':'H = Healthful, E = Ethical, L = Legal, P = Parent Approval.',
    'S.M.A.R.T.':'Specific, Measurable, Attainable, Relevant, Timely.',
    'Respect':'Healthy decisions show respect for yourself and your health.'
  };
  return m[topic] || 'Review the matching ⭐ Remember box.';
}

function renderFinal(){
  const pct = Math.round((score/questions.length)*100);
  const wrongCount = questions.length-score;
  const weak = Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]);
  const weakHtml = weak.length ? weak.map(([t,n])=>`<span class="review-tag">${t} (${n} missed)</span>`).join('') : '<span class="review-tag">No topics flagged</span>';
  const strong = [...new Set(questions.map(q=>q.topic))].filter(t=>!wrongTopics[t]);
  const strongHtml = strong.length ? strong.map(t=>`<span class="pill">${t}</span>`).join('') : '<span class="pill">Keep reviewing all major topics</span>';
  screen.innerHTML=`
    <div class="section-label">Quiz Complete</div>
    <div class="kicker">Final Result</div>
    <h2>Great work — review what matters most.</h2>
    <div class="final-score">${pct}%</div>
    <div class="grid">
      <div class="card"><h3>My Score</h3><p><b>Correct:</b> ${score}<br><b>Incorrect:</b> ${wrongCount}<br><b>Percentage:</b> ${pct}%</p></div>
      <div class="card"><h3>My Strong Topics</h3><div class="review-list">${strongHtml}</div></div>
    </div>
    <div class="card"><h3>Topics I Need to Review</h3><div class="review-list">${weakHtml}</div></div>
    <div class="card"><h3>Mistakes I Made</h3><p>${weak.length ? weak.map(([t,n])=>`<b>${t}:</b> ${n} question${n>1?'s':''} missed.`).join('<br>') : 'No incorrect answers.'}</p></div>
    <div class="card"><h3>Last-Minute Review</h3><p>${weak.length ? weak.map(([t])=>`<b>${t}:</b> ${memoryFor(t)}`).join('<br>') : 'Review the final ⭐ Remember map once more before the exam.'}</p></div>
    <div class="remember"><b>⭐ Remember</b> — Decisions + H.E.L.P. + Values + Goals + S.M.A.R.T.</div>`;
  counter.textContent='Quiz Complete';
  progressBar.style.width='100%';
  backBtn.classList.add('hidden');
  nextBtn.classList.add('hidden');
  restartBtn.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

backBtn.addEventListener('click',()=>{ if(!quizMode && slideIndex>0){slideIndex--;renderSlide();} });
nextBtn.addEventListener('click',()=>{ if(!quizMode){ if(slideIndex<slides.length-1){slideIndex++;renderSlide();} else {startQuiz();} } });
restartBtn.addEventListener('click',()=>{ slideIndex=0; quizMode=false; qIndex=0; score=0; answered=false; wrongTopics={}; renderSlide(); });

document.addEventListener('keydown',(e)=>{
  if(quizMode) return;
  if(e.key==='ArrowRight' && !nextBtn.classList.contains('hidden')) nextBtn.click();
  if(e.key==='ArrowLeft' && !backBtn.classList.contains('hidden') && !backBtn.disabled) backBtn.click();
});

renderSlide();
</script>
</body>
</html>
