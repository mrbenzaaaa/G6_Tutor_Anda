const slides=[
{title:"Earth's Interior",body:`<div class="visual"><div><span class="eyebrow">Chapter 2 • Lesson 2</span><h1>What Is Inside Earth?</h1><p class="lead">A 15–20 minute review of evidence, layers, the core, Earth's magnetic field, and the magnetosphere.</p><p><span class="pill">25 teaching slides</span> <span class="pill">30 quiz questions</span></p></div><img src="${IMAGES.cave}" alt="Textbook photograph of a deep cave"></div>`,remember:"Deep caves, mines, and wells barely scratch Earth's surface."},
{title:"What You Must Know",body:`<ul class="check"><li>Scientists mainly use indirect evidence to study Earth's interior.</li><li>Temperature and pressure increase with depth.</li><li>Earthquake waves reveal density and composition.</li><li>Earth's main layers are crust, mantle, and core.</li><li>Lithosphere and asthenosphere differ in how rocks behave.</li><li>The outer core is liquid; the inner core is solid.</li><li>Movement in the outer core helps produce Earth's magnetic field.</li></ul>`,remember:"Evidence → layers → core movement → magnetic field."},
{title:"A Model of Earth's Layers",body:`<div class="visual"><img src="${IMAGES.egg}" alt="Hard-cooked egg model activity from the textbook"><div><p>The Launch Lab uses a hard-cooked egg as a model:</p><ul><li><b>Shell</b> → thin outer crust</li><li><b>Egg white</b> → thick mantle</li><li><b>Yolk</b> → central core</li></ul><p>A model helps show the arrangement of three main layers.</p></div></div>`,remember:"Egg: shell → crust, white → mantle, yolk → core."},
{title:"Clues to Earth's Interior",body:`<p>Scientists cannot see what is deep inside Earth. They use <b>indirect methods</b>, like learning about a closed gift by tapping or shaking it.</p><div class="grid"><div class="tile"><h3>Direct hints</h3><p>Mines and drilled wells provide observations and rock samples.</p></div><div class="tile orange"><h3>Indirect evidence</h3><p>Scientists analyze how earthquake waves move through Earth.</p></div></div>`,remember:"Most knowledge of Earth's deep interior comes from indirect evidence."},
{title:"Mines and Wells",body:`<table><tr><th>Location</th><th>Depth and clue</th></tr><tr><td>South African gold mine</td><td>Nearly <b>4 km</b> deep</td></tr><tr><td>Kola well, Russia</td><td>More than <b>12 km</b> deep; took more than <b>20 years</b> to drill</td></tr></table><p>The Kola well is less than <b>1%</b> of the distance to Earth's center. Only a small part of the geosphere has been sampled.</p>`,remember:"Even the deepest well samples less than 1% of the way to the center."},
{title:"Temperature and Pressure",body:`<div class="visual"><img src="${IMAGES.graphs}" alt="Textbook graphs of temperature and pressure versus depth"><div><p>Both <b>temperature</b> and <b>pressure</b> increase as depth increases.</p><ul><li>3.9 km deep: about <b>53°C</b></li><li>Bottom of Kola well: <b>190°C</b></li><li>Estimated center: about <b>6,000°C</b></li></ul><p>Pressure increases because of the weight of overlying rocks.</p></div></div>`,remember:"Deeper → hotter and greater pressure."},
{title:"What Pressure Does",body:`<div class="formula">More depth → more overlying rock → higher pressure</div><p>High pressure squeezes rocks and makes them much denser than surface rocks. High temperature and pressure also make drilling deep wells difficult.</p>`,remember:"Pressure rises with depth because rock above has weight."},
{title:"Using Earthquake Waves",body:`<p>Earthquakes release energy as <b>three types of waves</b>. Different materials affect the waves:</p><ul><li>Some waves <b>cannot travel</b> through certain materials.</li><li>Other waves <b>change direction</b> at certain materials.</li></ul><p>Scientists study this movement to infer the <b>density</b> and <b>composition</b> of materials inside Earth.</p>`,remember:"Wave behavior gives clues about material inside Earth."},
{title:"Earth's Main Layers",body:`<div class="visual"><img src="${IMAGES.layers}" alt="Textbook diagram of Earth's interior layers"><div><ol><li><b>Crust</b> → brittle rocky outside</li><li><b>Mantle</b> → thick middle layer</li><li><b>Core</b> → dense metallic center</li></ol><p>Layers are subdivided by chemical and physical characteristics.</p></div></div>`,remember:"Main layers from outside inward: crust → mantle → core."},
{title:"The Crust",body:`<p>The <b>crust</b> is Earth's brittle, rocky outer layer.</p><ul><li>Much thinner than other layers—like an egg shell</li><li>Least dense layer of the geosphere</li><li>Made mostly of low-mass elements such as silicon and oxygen</li></ul><p>There is a distinct boundary between the crust and mantle. Earthquake waves speed up when crossing it, showing the mantle is denser.</p>`,remember:"Crust = thin, brittle, rocky, least dense."},
{title:"Oceanic vs Continental Crust",body:`<div class="visual"><img src="${IMAGES.crust}" alt="Textbook comparison of oceanic and continental crust"><table><tr><th>Oceanic</th><th>Continental</th></tr><tr><td>Under oceans</td><td>On land</td></tr><tr><td>More dense</td><td>Less dense</td></tr><tr><td>Contains iron and magnesium</td><td>About four times thicker</td></tr><tr><td>Thin</td><td>Thickest under tall mountains</td></tr></table></div>`,remember:"Oceanic = thinner and denser; continental = thicker and less dense."},
{title:"The Mantle",body:`<p>The <b>mantle</b> is the thick middle layer in the solid part of Earth, immediately below the crust.</p><ul><li>Made of rock</li><li>Contains more iron and magnesium than oceanic crust</li><li>Denser than either type of crust</li></ul><p>Scientists group it by how rocks react when forces push or pull on them.</p>`,remember:"Mantle = thick, rocky middle layer."},
{title:"Lithosphere",body:`<div class="formula">Crust + uppermost mantle = lithosphere</div><p>The rocks in the uppermost mantle are brittle and rigid, like crustal rocks. Together they form the rigid <b>lithosphere</b>.</p>`,remember:"Lithosphere includes crust AND uppermost mantle."},
{title:"Asthenosphere",body:`<p>The <b>asthenosphere</b> is below the lithosphere, within the mantle.</p><ul><li>Rocks are very hot.</li><li>They are solid but no longer brittle.</li><li>They are <b>plastic</b>: soft enough to flow.</li><li>The flow is extremely slow—about as slowly as fingernails grow.</li></ul>`,remember:"Asthenosphere = hot, solid, plastic, slowly flowing."},
{title:"Upper and Lower Mantle",body:`<p>Below the asthenosphere, upper- and lower-mantle rock is hotter, but it does not flow.</p><div class="grid"><div class="tile orange"><h3>Temperature</h3><p>Tends to melt rock.</p></div><div class="tile"><h3>High pressure</h3><p>Prevents melting and squeezes rock into a solid.</p></div></div><p>This solid rock forms Earth's largest layer.</p>`,remember:"Deep mantle stays solid because pressure prevents melting."},
{title:"Read the Layer Diagram",body:`<div class="visual"><img src="${IMAGES.layers}" alt="Textbook labeled diagram with depths and densities"><div><table><tr><th>Boundary</th><th>Depth</th></tr><tr><td>Upper mantle marker</td><td>670 km</td></tr><tr><td>Lower mantle to core</td><td>2,900 km</td></tr><tr><td>Outer to inner core</td><td>5,150 km</td></tr><tr><td>Center</td><td>6,370 km</td></tr></table><p class="small">Diagram densities: upper mantle 3.9, lower mantle 5.0, outer core 11.1, inner core 13.0 g/cm³.</p></div></div>`,remember:"Density increases inward; inner core is most dense in the diagram."},
{title:"The Core",body:`<div class="visual"><img src="${IMAGES.core}" alt="Textbook core diagram"><div><p>The <b>core</b> is Earth's dense metallic center.</p><ul><li>Mostly iron</li><li>Small amounts of nickel and other elements</li><li>Formed when gravity pulled densest material toward the center</li></ul></div></div>`,remember:"Core = dense metallic center, mostly iron."},
{title:"Outer Core vs Inner Core",body:`<table><tr><th>Outer core</th><th>Inner core</th></tr><tr><td>Liquid</td><td>Solid iron crystals</td></tr><tr><td>Density 11.1 g/cm³</td><td>Density 13.0 g/cm³</td></tr><tr><td>Temperature effect outweighs pressure</td><td>Extreme pressure keeps iron solid near 6,000°C</td></tr><tr><td>Molten iron flows</td><td>Spins a little faster than the rest of Earth</td></tr></table>`,remember:"Outer = liquid; inner = solid because of extreme pressure."},
{title:"Evidence for a Liquid Outer Core",body:`<p>Scientists did not discover the liquid outer core by drilling. They used the indirect method of analyzing <b>earthquake waves</b>.</p><p>The wave evidence showed that Earth's outer core is liquid.</p>`,remember:"Liquid outer core evidence comes from earthquake waves."},
{title:"Earth's Magnetic Field",body:`<div class="visual"><img src="${IMAGES.field}" alt="Textbook diagram of Earth's magnetic field"><div><p>The inner core spins faster than the outer core. This produces streams of flowing molten iron in the outer core.</p><p>The flow of molten material helps produce Earth's <b>magnetic field</b>, which acts like a giant bar magnet with opposite poles.</p></div></div>`,remember:"Moving molten iron in the outer core helps make the magnetic field."},
{title:"Compasses and Change",body:`<p>A compass needle lines up with Earth's magnetic field, so people have used compasses to navigate for centuries.</p><p>The field is not completely stable. Over geologic time:</p><ul><li>Its strength varies.</li><li>Its direction varies.</li><li>Its direction has sometimes reversed.</li></ul>`,remember:"Earth's magnetic field can vary and reverse."},
{title:"Magnetosphere",body:`<div class="visual"><img src="${IMAGES.shield}" alt="Textbook diagram of the magnetosphere and charged particles from the Sun"><div><p>The <b>magnetosphere</b> is the outer part of Earth's magnetic field that interacts with charged particles.</p><p>It protects Earth from cosmic rays and charged particles from the Sun by pushing some away and trapping others.</p></div></div>`,remember:"Magnetosphere = magnetic shield around Earth."},
{title:"Original Review and Activities",body:`<div class="sourceq"><b>Review 1:</b> The metal layer is the <b>core</b>.</div><div class="sourceq"><b>Review 2:</b> Crust is only the rocky outer layer; lithosphere is crust plus uppermost mantle.</div><div class="sourceq"><b>Review 3 sample sentence:</b> The mantle surrounds Earth's core.</div><div class="sourceq"><b>Review 4:</b> The melted layer is the <b>outer core</b>.</div><div class="sourceq"><b>Egg model:</b> shell → crust, white → mantle, yolk → core.</div>`,remember:"Use the vocabulary precisely: crust is not the whole lithosphere."},
{title:"Original Review: 5–9",body:`<div class="sourceq"><b>5. Design a model:</b> Answers depend on the student's chosen materials.</div><div class="sourceq"><b>6. Physical groups:</b> rigid lithosphere; plastic asthenosphere; solid upper/lower mantle; liquid outer core; solid inner core.</div><div class="sourceq"><b>7. Crust:</b> Oceanic is thinner and denser; continental is thicker and less dense.</div><div class="sourceq"><b>8. Magnetic field:</b> Caused partly by molten outer-core movement; it has opposite poles and forms a protective shield.</div><div class="sourceq"><b>9. Earthquake waves:</b> They can cause damage, but they also provide evidence about Earth's interior.</div><p class="small">Results for the liquid-density labs require measurements or observations and are not provided clearly in the study material.</p>`,remember:"When an activity needs observations, do not invent its result."},
{title:"Final 2-Minute Review",body:`<table><tr><th>Big idea</th><th>Fast clue</th></tr><tr><td>Evidence</td><td>Mines/wells + earthquake waves</td></tr><tr><td>Depth</td><td>Temperature ↑ and pressure ↑</td></tr><tr><td>Main layers</td><td>Crust → mantle → core</td></tr><tr><td>Physical behavior</td><td>Lithosphere rigid; asthenosphere plastic</td></tr><tr><td>Core</td><td>Outer liquid; inner solid</td></tr><tr><td>Magnetic field</td><td>Moving molten iron in outer core</td></tr><tr><td>Magnetosphere</td><td>Shield from rays and charged particles</td></tr></table><p class="lead">Ready? Tap <b>Start Quiz</b>.</p>`,remember:"Connect the evidence to what scientists infer about each layer."}
];
const quiz=[
{q:"Which method provides most evidence about Earth's deep interior?",o:["Analyzing earthquake waves","Looking only at caves","Measuring ocean depth","Watching clouds"],a:0,why:"Scientists get most evidence by analyzing earthquake waves.",topic:"Evidence",slide:8},
{q:"About how deep is the South African gold mine mentioned in the lesson?",o:["More than 12 km","Nearly 4 km","670 km","6,370 km"],a:1,why:"The textbook says it is nearly 4 km deep.",topic:"Evidence",slide:5},
{q:"Where is the Kola well?",o:["South Africa","Under an ocean","Russia","At Earth's center"],a:2,why:"The deepest well in the lesson is on the Kola Peninsula in Russia.",topic:"Evidence",slide:5},
{q:"How much of the distance to Earth's center does the Kola well reach?",o:["About half","About 10%","Exactly 1%","Less than 1%"],a:3,why:"The Kola well is less than 1% of the distance to the center.",topic:"Evidence",slide:5},
{q:"What happens to temperature as depth increases?",o:["It increases","It decreases","It stays at 53°C","It becomes pressure"],a:0,why:"The graph and text show temperature increasing with depth.",topic:"Temperature and pressure",slide:6,img:"graphs"},
{q:"Why does pressure increase with depth?",o:["Because rocks become colder","Because of the weight of overlying rocks","Because earthquake waves stop","Because oceanic crust is thin"],a:1,why:"More overlying rock means more weight and greater pressure.",topic:"Temperature and pressure",slide:7},
{q:"What is the estimated temperature at Earth's center?",o:["53°C","190°C","About 6,000°C","About 670°C"],a:2,why:"The center is estimated to be about 6,000°C.",topic:"Temperature and pressure",slide:6},
{q:"What can scientists infer from earthquake-wave behavior?",o:["Only Earth's age","Only cave depth","The weather","Density and composition inside Earth"],a:3,why:"Wave speed, direction, and passage reveal density and composition.",topic:"Evidence",slide:8},
{q:"What is Earth's brittle, rocky outer layer?",o:["Crust","Mantle","Outer core","Asthenosphere"],a:0,why:"The crust is the brittle, rocky outer layer.",topic:"Crust",slide:10},
{q:"Which is the least dense geosphere layer?",o:["Core","Crust","Lower mantle","Outer core"],a:1,why:"The crust is the least dense layer of the geosphere.",topic:"Crust",slide:10},
{q:"Which type of crust is thinner and denser?",o:["Continental crust","Lithosphere","Oceanic crust","Uppermost mantle"],a:2,why:"Oceanic crust is thin and dense compared with continental crust.",topic:"Crust",slide:11,img:"crust"},
{q:"Continental crust is about how much thicker than oceanic crust?",o:["Two times","Three times","Ten times","Four times"],a:3,why:"The lesson says continental crust is about four times thicker.",topic:"Crust",slide:11},
{q:"What is the thick middle layer in the solid part of Earth?",o:["Mantle","Crust","Core","Magnetosphere"],a:0,why:"The mantle is the thick middle layer.",topic:"Mantle",slide:12},
{q:"What forms the lithosphere?",o:["Mantle and core","Crust and uppermost mantle","Asthenosphere and outer core","Oceanic and continental crust only"],a:1,why:"The rigid crust and uppermost mantle form the lithosphere.",topic:"Mantle",slide:13},
{q:"How do asthenosphere rocks behave?",o:["They are liquid metal.","They are cold and brittle.","They are solid and plastic enough to flow slowly.","They do not move at all."],a:2,why:"They are solid but plastic and flow extremely slowly.",topic:"Mantle",slide:14},
{q:"Why does deeper upper- and lower-mantle rock remain solid?",o:["It contains no iron.","It is cooler than crust.","Gravity disappears.","High pressure prevents melting."],a:3,why:"High pressure squeezes the rock and prevents melting.",topic:"Mantle",slide:15},
{q:"Which layer is Earth's dense metallic center?",o:["Core","Crust","Lithosphere","Asthenosphere"],a:0,why:"The core is the dense metallic center.",topic:"Core",slide:17},
{q:"What is the core made of mostly?",o:["Silicon","Iron","Oxygen","Liquid water"],a:1,why:"The core is mostly iron, with small amounts of nickel and other elements.",topic:"Core",slide:17},
{q:"Which part of the core is liquid?",o:["Inner core","Both parts","Outer core","Neither part"],a:2,why:"The outer core is liquid.",topic:"Core",slide:18,img:"core"},
{q:"Why is the inner core solid even near 6,000°C?",o:["It has no iron.","It is part of the crust.","It is cooler than the mantle.","Pressure at Earth's center is extremely high."],a:3,why:"The very high pressure keeps inner-core iron solid.",topic:"Core",slide:18},
{q:"Which part has the greatest density in the layer diagram?",o:["Inner core","Outer core","Lower mantle","Upper mantle"],a:0,why:"The diagram labels the inner core at 13.0 g/cm³, the greatest shown.",topic:"Layer diagram",slide:16,img:"layers"},
{q:"What evidence indicates that the outer core is liquid?",o:["Deep-well samples","Earthquake-wave analysis","Cave photographs","Compass shape"],a:1,why:"Scientists inferred a liquid outer core by analyzing earthquake waves.",topic:"Core",slide:19},
{q:"What produces streams of molten iron in the outer core?",o:["The crust breaking","The Kola well","The inner core spinning faster","The magnetosphere cooling"],a:2,why:"The faster-spinning inner core produces streams of flowing molten iron.",topic:"Magnetic field",slide:20},
{q:"Earth's magnetic field acts much like what?",o:["A deep well","A liquid beaker","A hard-cooked egg","A giant bar magnet"],a:3,why:"The lesson compares the field to a giant bar magnet with opposite poles.",topic:"Magnetic field",slide:20,img:"field"},
{q:"What does a compass needle line up with?",o:["Earth's magnetic field","The continental crust","Earthquake waves","The Kola well"],a:0,why:"A compass needle aligns with Earth's magnetic field.",topic:"Magnetic field",slide:21},
{q:"Which statement about Earth's magnetic field is true?",o:["It never changes.","Its strength and direction can vary.","It has no poles.","It comes from the crust."],a:1,why:"The strength and direction vary, and direction has sometimes reversed.",topic:"Magnetic field",slide:21},
{q:"What is the magnetosphere?",o:["The thick middle rocky layer","The liquid outer core","The outer part of the magnetic field interacting with charged particles","The boundary between crust and mantle"],a:2,why:"That is the textbook definition of magnetosphere.",topic:"Magnetosphere",slide:22},
{q:"How does the magnetosphere protect Earth?",o:["It cools the inner core.","It makes continental crust.","It stops all earthquakes.","It pushes away some charged particles and traps others."],a:3,why:"The magnetic shield pushes some particles away and traps others.",topic:"Magnetosphere",slide:22,img:"shield"},
{q:"In the egg model, what represents the crust?",o:["Shell","Egg white","Yolk","Paper towel"],a:0,why:"The thin shell models the thin outer crust.",topic:"Models",slide:3,img:"egg"},
{q:"How are crust and lithosphere different?",o:["They are exactly the same.","Lithosphere includes crust plus uppermost mantle.","Crust includes the whole mantle.","Lithosphere is liquid metal."],a:1,why:"Crust is one layer; lithosphere combines crust and uppermost mantle.",topic:"Mantle",slide:13}
];
let mode="lesson",index=0,quizIndex=0,score=0,answered=false,topicStats={};const el=id=>document.getElementById(id),content=el("content"),next=el("next"),back=el("back"),progress=el("progress"),fill=el("fill");
function renderLesson(){mode="lesson";const s=slides[index];content.innerHTML=`<span class="eyebrow">Teaching Slide ${index+1}</span><h2>${s.title}</h2>${s.body}<div class="remember">⭐ Remember: ${s.remember}</div>`;content.scrollTop=0;progress.textContent=`Slide ${index+1} of ${slides.length}`;fill.style.width=`${((index+1)/(slides.length+quiz.length))*100}%`;back.disabled=index===0;next.disabled=false;next.textContent=index===slides.length-1?"Start Quiz ➡":"Next ➡"}
function renderQuiz(){mode="quiz";answered=false;const x=quiz[quizIndex];const pic=x.img?`<img src="${IMAGES[x.img]}" alt="Textbook visual for this question" style="width:min(520px,100%);max-height:250px;object-fit:contain;border-radius:14px;display:block;margin:0 auto 14px">`:"";content.innerHTML=`<span class="eyebrow">Quiz ${quizIndex+1} of ${quiz.length}</span>${pic}<div class="question">${x.q}</div><div class="options">${x.o.map((v,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join("")}</div><div id="feedback"></div>`;content.scrollTop=0;content.querySelectorAll(".option").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));progress.textContent=`Quiz ${quizIndex+1} of ${quiz.length}`;fill.style.width=`${((slides.length+quizIndex+1)/(slides.length+quiz.length))*100}%`;back.disabled=false;next.disabled=true;next.textContent=quizIndex===quiz.length-1?"See Score ➡":"Next Question ➡"}
function choose(i){if(answered)return;answered=true;const x=quiz[quizIndex],buttons=[...content.querySelectorAll(".option")];buttons.forEach((b,n)=>{b.disabled=true;if(n===x.a)b.classList.add("correct");else if(n===i)b.classList.add("wrong")});const ok=i===x.a;if(ok)score++;if(!topicStats[x.topic])topicStats[x.topic]={right:0,total:0,slide:x.slide};topicStats[x.topic].total++;if(ok)topicStats[x.topic].right++;el("feedback").innerHTML=`<div class="feedback"><b>${ok?"✅ Correct":"❌ Incorrect"}</b><br>Correct answer: <b>${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br><b>Why:</b> ${x.why}</div>`;next.disabled=false}
function showScore(){mode="score";const pct=Math.round(score/quiz.length*100),entries=Object.entries(topicStats),strong=entries.filter(([,v])=>v.right/v.total>=.75),weak=entries.filter(([,v])=>v.right/v.total<.75);content.innerHTML=`<span class="eyebrow">Quiz Complete</span><h2>Final Score</h2><div class="scoreBig">${score} / ${quiz.length}</div><p class="lead">${pct}%</p><div class="grid"><div class="tile green"><h3>🌟 Strong Topics</h3>${strong.length?`<ul>${strong.map(([k,v])=>`<li>${k} (${v.right}/${v.total})</li>`).join("")}</ul>`:"<p>Keep practicing to build strong topics.</p>"}</div><div class="tile orange"><h3>⚠️ Topics to Review</h3>${weak.length?`<ul>${weak.map(([k,v])=>`<li>${k} — review Slide ${v.slide}</li>`).join("")}</ul>`:"<p>Excellent—no weak topics found.</p>"}</div></div><div class="remember">⭐ Review the suggested slides, then restart the quiz.</div>`;content.scrollTop=0;progress.textContent="Results";fill.style.width="100%";back.disabled=false;next.disabled=false;next.textContent="Restart Quiz ↻"}
next.onclick=()=>{if(mode==="lesson"){if(index<slides.length-1){index++;renderLesson()}else{quizIndex=0;score=0;topicStats={};renderQuiz()}}else if(mode==="quiz"){if(!answered)return;if(quizIndex<quiz.length-1){quizIndex++;renderQuiz()}else showScore()}else{quizIndex=0;score=0;topicStats={};renderQuiz()}};back.onclick=()=>{if(mode==="lesson"){if(index>0){index--;renderLesson()}}else if(mode==="quiz"){if(quizIndex===0){mode="lesson";index=slides.length-1;renderLesson()}else{quizIndex--;renderQuiz()}}else{mode="quiz";quizIndex=quiz.length-1;renderQuiz()}};el("restart").onclick=()=>{if(confirm("Restart the lesson and clear the quiz score?")){mode="lesson";index=0;quizIndex=0;score=0;answered=false;topicStats={};renderLesson()}};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&!next.disabled)next.click();if(e.key==="ArrowLeft"&&!back.disabled)back.click()});renderLesson();
</script>
</body>
</html>
