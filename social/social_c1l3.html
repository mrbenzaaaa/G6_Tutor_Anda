    @media(max-width:760px){
      header{gap:10px}.brand{font-size:.9rem}.mode-pill{display:none}.hero{grid-template-columns:1fr}.hero-mark{width:145px;order:-1}.grid,.grid.three,.choices{grid-template-columns:1fr}.screen{min-height:calc(100vh - 170px);border-radius:20px;padding:20px}.compare{display:block;overflow-x:auto}.compare th,.compare td{min-width:155px}footer{grid-template-columns:1fr 1fr}.nav-group{display:contents}.btn{padding:0 15px}.btn.restart{grid-column:1/-1;grid-row:2}.nav-group:last-child{justify-content:stretch}.nav-group:last-child .btn{width:100%}
    }

  <script>
    "use strict";
    const slides = [
      {section:"Lesson 3",title:"Researching History",body:`
        <div class="hero"><div><p class="lead"><strong>Essential Question:</strong> How do you research history?</p><div class="callout"><strong>Why it matters:</strong> Knowing where to find information makes research projects and other schoolwork easier.</div></div><div class="hero-mark" aria-hidden="true">🔎</div></div>`,remember:"Good research begins by knowing where and how to find information."},
      {section:"Lesson Map",title:"9 Topics You Need to Learn",body:`<div class="grid three">
        <div class="card blue"><b>1</b> Planning a research project</div><div class="card"><b>2</b> Choosing research materials</div><div class="card gold"><b>3</b> Finding main ideas and making notes</div><div class="card"><b>4</b> Distinguishing fact from opinion</div><div class="card green"><b>5</b> Checking Internet reliability</div><div class="card"><b>6</b> Understanding URL endings</div><div class="card purple"><b>7</b> Organizing an outline</div><div class="card"><b>8</b> Avoiding plagiarism</div><div class="card blue"><b>9</b> Interpreting history without modern bias</div></div>`,remember:"Learn the process, check sources, give credit, and use evidence."},
      {section:"What You Must Know",title:"Exam Priorities",body:`<div class="grid three">
        <div class="card gold"><span class="tag">⭐⭐⭐</span><h3>Research Process</h3><p>Topic → questions → sources → notes → categories → outline → report</p></div>
        <div class="card green"><span class="tag">⭐⭐⭐</span><h3>Reliable Websites</h3><p>Check author, credentials, responsible organization, update date, and bias.</p></div>
        <div class="card blue"><span class="tag">⭐⭐⭐</span><h3>Fact vs. Opinion</h3><p>Facts can be proven; opinions express attitudes or judgments.</p></div>
        <div class="card purple"><span class="tag">⭐⭐⭐</span><h3>Plagiarism</h3><p>Never use someone’s work without giving credit.</p></div>
        <div class="card gold"><span class="tag">⭐⭐⭐</span><h3>URL Endings</h3><p><strong>.gov</strong>, <strong>.edu</strong>, and <strong>.org</strong> have different meanings.</p></div>
        <div class="card"><span class="tag">⭐⭐</span><h3>Notes & History</h3><p>Use your own words. Judge history using evidence, not today’s ideas.</p></div></div>`,remember:"Highest priority: process, reliable sources, fact/opinion, plagiarism, and URLs."},
      {section:"Vocabulary",title:"Teacher Definitions 1–4",body:`<div class="grid">
        <div class="card blue"><h3>credentials</h3><p>Something that gives confidence that a person is qualified for a task.</p></div>
        <div class="card green"><h3>URL</h3><p>The abbreviation for uniform resource locator; the address of an online resource.</p></div>
        <div class="card gold"><h3>.gov</h3><p>The ending of an Internet URL of a government Website.</p></div>
        <div class="card purple"><h3>.edu</h3><p>The ending of a URL of a Website for an educational institution.</p></div></div>`,remember:"Credentials prove qualification; a URL is an online address."},
      {section:"Vocabulary",title:"Teacher Definitions 5–8",body:`<div class="grid">
        <div class="card gold"><h3>.org</h3><p>The ending of an Internet URL for an organization.</p></div>
        <div class="card purple"><h3>Plagiarize</h3><p>To present someone’s work as your own without giving that person credit.</p></div>
        <div class="card blue"><h3>Data</h3><p>Information usually facts and figures.</p></div>
        <div class="card green"><h3>Violate</h3><p>To disobey or break a rule or law.</p></div></div>`,remember:"No credit = plagiarize; violate = break a rule or law."},
      {section:"Examples",title:"Names, Places, and Dates",body:`<p class="lead">The material does not provide an important historical person or key date to memorize. These appear only as examples:</p><div class="grid">
        <div class="card"><h3>The Middle Ages</h3><p>An example of a topic that is <strong>too broad</strong>.</p></div>
        <div class="card"><h3>Middlebury, England, 1535</h3><p>An example of a topic that is <strong>too narrow</strong>.</p></div>
        <div class="card"><h3>American colonists</h3><p>Used when comparing two Internet articles.</p></div>
        <div class="card"><h3>Smith and Jones</h3><p>Example authors who receive credit for an opinion.</p></div></div>`,remember:"These are examples, not important people or key dates to memorize."},
      {section:"Topic 1",title:"Choose a Workable Topic",body:`<p class="lead">The first step is to choose your research <strong>topic</strong>. It must be workable—not too large and not too small.</p><table class="compare"><thead><tr><th>Encyclopedia Result</th><th>What It May Mean</th></tr></thead><tbody><tr><td>No entry</td><td>The topic may be too small.</td></tr><tr><td>Many entries or a very long entry</td><td>The topic may be too large.</td></tr><tr><td>A suitable amount of information</td><td>The topic may be workable.</td></tr></tbody></table><div class="callout">Selecting a workable topic is the most important part of the project.</div>`,remember:"No entry → too small. Many entries → too large."},
      {section:"Topic 1",title:"Build Six Question Cards",body:`<p>After choosing the topic, decide what you want to learn. Create six questions:</p><div class="flow"><span>Who?</span><b>→</b><span>What?</span><b>→</b><span>When?</span><b>→</b><span>Where?</span><b>→</b><span>Why?</span><b>→</b><span>How?</span></div><div class="grid"><div class="card blue"><h3>Topic</h3><p>The subject of the research project.</p></div><div class="card gold"><h3>Question cards</h3><p>Cards containing the questions you want to answer.</p></div></div><p>Write each question at the top of a note card. The cards become your research tools. You may add more cards while researching.</p>`,remember:"Topic → six questions → research."},
      {section:"Topic 2",title:"Choose Research Materials",body:`<p>After creating question cards, gather research materials.</p><div class="grid"><div class="card green"><h3>Begin with</h3><ul><li>Encyclopedias</li><li>Textbooks</li><li>Class notes</li></ul></div><div class="card blue"><h3>Next</h3><p>Find books about the subject at the library.</p></div><div class="card gold"><h3>Use</h3><p><strong>Nonfiction</strong> research materials.</p></div><div class="card purple"><h3>Do not use</h3><p>Fiction or persuasive writing as research material.</p></div></div>`,remember:"Research materials must be nonfiction, not fiction or persuasive writing."},
      {section:"Topic 2",title:"Find Main Ideas and Make Notes",body:`<p>While reading, find the <strong>main idea</strong> of each section and the details that support it.</p><div class="flow"><span>Read</span><b>→</b><span>Main idea</span><b>→</b><span>Details</span><b>→</b><span>Notes</span></div><div class="grid"><div class="card blue"><h3>Front of the card</h3><p>Write useful information in your own words and complete sentences.</p></div><div class="card gold"><h3>Back of the card</h3><p>Write information about the book where you found it.</p></div></div><p><strong>Main idea</strong> = the important point. <strong>Supporting details</strong> = information that supports it.</p>`,remember:"Front = information. Back = where you found it."},
      {section:"Topic 3",title:"Fact or Opinion?",body:`<p>Before using a source, scan it for opinion statements and possible bias.</p><table class="compare"><thead><tr><th>Fact</th><th>Opinion</th></tr></thead><tbody><tr><td>Can be proven by evidence</td><td>Cannot be proven true or false</td></tr><tr><td>Supported by evidence</td><td>Expresses an attitude, conclusion, or judgment</td></tr><tr><td>Should support historical research</td><td>May be a clue that the source is biased</td></tr></tbody></table><p><strong>Data</strong> means information, usually facts and figures.</p>`,remember:"FACT → Find evidence. OPINION → Attitude or judgment."},
      {section:"Topic 3",title:"Why the Difference Matters",body:`<div class="flow"><span>Many opinion statements</span><b>→</b><span>Possible bias</span><b>→</b><span>Research may not be reliable</span></div><p class="lead">Historical research should rely on <strong>facts and primary sources</strong>, rather than opinions.</p><div class="callout"><strong>Progress Check:</strong> It is important to distinguish fact from opinion because opinions may be a clue that a source is biased or untrustworthy.</div>`,remember:"Evidence builds trustworthy historical research."},
      {section:"Topic 4",title:"Research Safely on the Internet",body:`<p class="lead">Internet research is quick and rewarding, but it can be hard to know whether the information is true.</p><div class="grid"><div class="card blue"><h3>Authorship</h3><p>Is the author’s name clear? Is the article signed?</p></div><div class="card green"><h3>Credentials</h3><p>Is the author a well-known expert? Is there evidence that the author is qualified?</p></div><div class="card gold"><h3>Responsibility</h3><p>Can you find who is responsible for the website?</p></div><div class="card purple"><h3>Source</h3><p>Is it on a university, government office, or museum site?</p></div></div>`,remember:"Know who wrote it and why that person is qualified."},
      {section:"Topic 4",title:"The Internet Reliability Checklist",body:`<div class="grid"><div class="card green"><h3>A — Author</h3><p>Is the authorship clear?</p></div><div class="card blue"><h3>C — Credentials</h3><p>Is the author qualified?</p></div><div class="card gold"><h3>U — Updated</h3><p>Was the webpage updated recently?</p></div><div class="card purple"><h3>B — Balanced</h3><p>Does the writing avoid bias toward one point of view?</p></div></div><div class="callout">If you answer <strong>NO</strong> to any question in the checklist, the webpage is probably not reliable.</div>`,remember:"A-C-U-B: Author, Credentials, Updated, Balanced."},
      {section:"Topic 4",title:"Which Article Is Better?",body:`<p>Imagine two articles about foods eaten by American colonists:</p><div class="grid"><div class="card green"><span class="tag">BETTER SOURCE</span><h3>University Article</h3><p>Signed by an author and published by an academic journal at a university.</p></div><div class="card"><span class="tag">WEAKER SOURCE</span><h3>Cooking Blog</h3><p>An unsigned article about the same subject by a blogger on a cooking website.</p></div></div><p>The university article is better because it is <strong>signed</strong> and published by an academic journal at a university.</p>`,remember:"Signed expert article → stronger than an unsigned blog article."},
      {section:"Topic 5",title:"What Is a URL?",body:`<p class="lead">A <strong>URL</strong> is the address of an online resource. Its ending gives information about the website.</p><div class="grid three"><div class="card gold"><h3>.gov</h3><p>Government entity</p></div><div class="card blue"><h3>.edu</h3><p>Educational institution, such as a college or university</p></div><div class="card green"><h3>.org</h3><p>Organization</p></div></div>`,remember:"G-E-O: Government, Education, Organization."},
      {section:"Topic 5",title:"URL Endings: Important Warnings",body:`<table class="compare"><thead><tr><th>Ending</th><th>What the Material Says</th></tr></thead><tbody><tr><td><strong>.gov</strong></td><td>Probably contains accurate data that is usually as up to date as possible.</td></tr><tr><td><strong>.edu</strong></td><td>Most pride themselves on accuracy, but documents may contain opinions as well as facts.</td></tr><tr><td><strong>.org</strong></td><td>May be accurate, but organizations may support their cause and include bias or opinions.</td></tr></tbody></table><div class="callout">A URL ending is a useful clue, but you must still check the content.</div>`,remember:"Even .edu and .org pages may contain opinions or bias."},
      {section:"Topic 6",title:"Turn Research into a Report",body:`<div class="flow"><span>Choose topic</span><b>→</b><span>Question cards</span><b>→</b><span>Reliable sources</span><b>→</b><span>Notes</span><b>→</b><span>Answers</span><b>→</b><span>Categories</span><b>→</b><span>Outline</span><b>→</b><span>Report</span></div><p>After gathering information, answer the questions on your cards. Sort the cards into categories. The sorted cards can become an outline for the research paper.</p>`,remember:"Topic → Questions → Sources → Notes → Outline → Report."},
      {section:"Topic 6",title:"Cards, Categories, and Outline",body:`<div class="grid"><div class="card blue"><h3>Note cards</h3><p>Hold questions and information.</p></div><div class="card green"><h3>Categories</h3><p>Group related note cards.</p></div><div class="card gold"><h3>Outline</h3><p>Organizes the information for the report.</p></div><div class="card purple"><h3>Research report</h3><p>The final writing.</p></div></div><div class="flow"><span>Sort cards</span><b>→</b><span>Organized information</span><b>→</b><span>Outline</span></div>`,remember:"Cards → Categories → Outline → Report."},
      {section:"Topic 7",title:"What Is Plagiarism?",body:`<p class="lead">To <strong>plagiarize</strong> is to present another person’s ideas or words as your own without giving credit.</p><ul><li>It is similar to copying something that is not yours.</li><li>It violates copyright laws that prevent unauthorized use of a writer’s work.</li><li>Copying text exactly word-for-word without credit is plagiarism.</li><li>The lesson says plagiarism can ruin a scholar’s career and lead to serious consequences.</li></ul><p><strong>Violate</strong> means to disobey or break a rule or law.</p>`,remember:"Someone else’s work + no credit = plagiarism."},
      {section:"Topic 7",title:"Three Ways to Avoid Plagiarism",body:`<div class="grid three"><div class="card blue"><h3>1. Own Words</h3><p>Put information in your own words.</p></div><div class="card green"><h3>2. Author Credit</h3><p>When restating an opinion, name the author: “According to Smith and Jones, . . .”</p></div><div class="card gold"><h3>3. Footnote</h3><p>Always include a footnote when using a direct quotation.</p></div></div>`,remember:"Own words + Author credit + Footnote."},
      {section:"Topic 7",title:"The Cartoon’s Lesson",body:`<div class="callout"><strong>Cartoon text:</strong><br>“I didn’t write the book report. I downloaded and printed it directly from the Internet, but I did collate and staple it myself.”</div><p class="lead">Downloading, printing, collating, and stapling another person’s report does not make it your own work.</p><p>Cartoons can make plagiarism seem humorous, but it is illegal and can lead to serious consequences.</p>`,remember:"Printing someone else’s report does not make it your work."},
      {section:"Topic 8",title:"Ancient History and Modern Values",body:`<p class="lead">Do not use modern ideas to judge a historical event. Ideas have changed over time.</p><div class="grid"><div class="card green"><h3>Use</h3><p>Historical evidence to evaluate the past.</p></div><div class="card"><h3>Do Not Replace It With</h3><p>Today’s understanding of rights and society.</p></div></div><p>Using modern ideas to decide what women in the Middle Ages thought would be a mistake.</p><div class="flow"><span>Apply modern ideas</span><b>→</b><span>Misunderstand the setting</span><b>→</b><span>Mistaken conclusion</span></div>`,remember:"Past events → Past evidence."},
      {section:"Final Review",title:"Must Know: Research",body:`<ol><li>Choose a topic that is neither too broad nor too narrow.</li><li>Ask <strong>who, what, when, where, why, and how</strong>.</li><li>Use nonfiction research materials.</li><li>Find the main idea and supporting details.</li><li>Write notes in your own words and record the source.</li><li>Sort cards into categories to create an outline.</li></ol>`,remember:"Topic → Questions → Sources → Notes → Outline → Report."},
      {section:"Final Review",title:"Must Know: Trust and Responsibility",body:`<ol><li>Facts can be proven; opinions express attitudes or judgments.</li><li>Check Internet authorship, credentials, responsibility, updates, and bias.</li><li><strong>.gov</strong> = government, <strong>.edu</strong> = educational institution, <strong>.org</strong> = organization.</li><li>Never use another person’s work without giving credit.</li><li>Use historical evidence instead of modern ideas to evaluate history.</li></ol>`,remember:"Check the source, give credit, and use evidence."},
      {section:"Final Review",title:"Vocabulary Lightning Review",body:`<div class="grid"><div class="card"><b>credentials</b> — evidence that a person is qualified</div><div class="card"><b>URL</b> — address of an online resource</div><div class="card"><b>.gov</b> — government website ending</div><div class="card"><b>.edu</b> — educational institution website ending</div><div class="card"><b>.org</b> — organization website ending</div><div class="card"><b>plagiarize</b> — present someone’s work as your own without credit</div><div class="card"><b>data</b> — information, usually facts and figures</div><div class="card"><b>violate</b> — disobey or break a rule or law</div></div>`,remember:"Credentials, URL, .gov, .edu, .org, plagiarize, data, violate."},
      {section:"Final Review",title:"Compare Carefully",body:`<table class="compare"><thead><tr><th>Concept 1</th><th>Concept 2</th></tr></thead><tbody><tr><td><b>Too broad</b> → too much information</td><td><b>Too narrow</b> → not enough information</td></tr><tr><td><b>Fact</b> → can be proven</td><td><b>Opinion</b> → attitude or judgment</td></tr><tr><td><b>Signed article</b> → author known</td><td><b>Unsigned article</b> → author unknown</td></tr><tr><td><b>Note cards</b> → questions and notes</td><td><b>Outline</b> → organizes the report</td></tr><tr><td><b>Own words</b> → helps avoid plagiarism</td><td><b>Copied without credit</b> → plagiarism</td></tr><tr><td><b>Historical evidence</b> → correct basis</td><td><b>Modern ideas</b> → may cause mistakes</td></tr></tbody></table>`,remember:"Know the difference, not just the definition."},
      {section:"Final Review",title:"Cause → Effect",body:`<div class="grid"><div class="card blue">No encyclopedia entry<br><b>→ topic may be too small</b></div><div class="card gold">Many entries or one long entry<br><b>→ topic may be too large</b></div><div class="card purple">Opinion statements<br><b>→ possible bias</b></div><div class="card">Unknown author<br><b>→ expertise cannot be checked</b></div><div class="card green">Sort cards into categories<br><b>→ create an outline</b></div><div class="card">Copy without credit<br><b>→ plagiarism and serious consequences</b></div><div class="card gold">Apply modern values<br><b>→ mistaken conclusions</b></div></div>`,remember:"Ask what happened, then follow the arrow to the result."},
      {section:"Final Review",title:"Seven Memory Lines",body:`<div class="grid"><div class="card"><b>Research:</b> Topic → Questions → Sources → Notes → Outline → Report</div><div class="card"><b>Six questions:</b> Who, What, When, Where, Why, How</div><div class="card"><b>Fact:</b> Find evidence</div><div class="card"><b>Website:</b> Author, Credentials, Updated, Balanced</div><div class="card"><b>URL:</b> Government, Education, Organization</div><div class="card"><b>Plagiarism:</b> Own words + Credit + Footnote</div><div class="card"><b>History:</b> Past events → Past evidence</div></div>`,remember:"You are ready: research carefully, check sources, and give credit."},
      {section:"Quiz Ready",title:"30-Question Touchscreen Quiz",body:`<div class="hero"><div><p class="lead">One question at a time with four choices. You will get immediate feedback and one short explanation.</p><div class="grid"><div class="card green"><h3>Questions 1–10</h3><p>Easy</p></div><div class="card blue"><h3>Questions 11–20</h3><p>Medium</p></div><div class="card purple"><h3>Questions 21–30</h3><p>Hard</p></div><div class="card gold"><h3>Final Report</h3><p>Score, strong topics, and topics to review</p></div></div></div><div class="hero-mark" aria-hidden="true">🏁</div></div>`,remember:"Read every choice before you tap your answer.",startQuiz:true}
    ];

    const quizQuestions = [
      {q:"What are credentials?",o:["Information, usually facts and figures","Something that gives confidence that a person is qualified for a task","The address of an online resource","An attitude that cannot be proven"],a:1,e:"Credentials give confidence that a person is qualified.",t:"Vocabulary"},
      {q:"What is a URL?",o:["A government office","A category of note cards","The address of an online resource","A direct quotation"],a:2,e:"URL is the abbreviation for uniform resource locator, the address of an online resource.",t:"URL Endings"},
      {q:"Which ending identifies a government website?",o:[".gov",".org",".edu","URL"],a:0,e:".gov is the ending of a government website URL.",t:"URL Endings"},
      {q:"Which ending identifies a website for an educational institution?",o:[".org",".gov","URL",".edu"],a:3,e:".edu is the ending for an educational institution’s website.",t:"URL Endings"},
      {q:"Which URL ending identifies an organization?",o:[".edu",".org",".gov","data"],a:1,e:".org is the ending for an organization.",t:"URL Endings"},
      {q:"What does data mean?",o:["A person’s qualifications","A website address","Information, usually facts and figures","A modern value"],a:2,e:"Data means information, usually facts and figures.",t:"Vocabulary"},
      {q:"What does violate mean?",o:["To disobey or break a rule or law","To organize cards","To prove a fact","To update a webpage"],a:0,e:"Violate means to disobey or break a rule or law.",t:"Plagiarism"},
      {q:"What does plagiarize mean?",o:["To find a main idea","To check an author’s credentials","To organize an outline","To present someone’s work as your own without credit"],a:3,e:"Plagiarize means using someone’s work as your own without giving credit.",t:"Plagiarism"},
      {q:"What is the first step in a history research project?",o:["Write the final report","Identify your topic","Add a footnote","Sort cards into categories"],a:1,e:"The first step is to identify the research topic.",t:"Planning"},
      {q:"Which list contains the six research questions?",o:["Author, credentials, update, balance","Topic, sources, notes, outline","Who, what, when, where, why, and how","Fact, opinion, data, URL"],a:2,e:"The six questions are who, what, when, where, why, and how.",t:"Planning"},
      {q:"A topic has no entry in an encyclopedia. What may this mean?",o:["The topic may be too small","The topic may be too large","The article is balanced","The source is an organization"],a:0,e:"No encyclopedia entry may mean that the topic is too small.",t:"Planning"},
      {q:"A topic has many encyclopedia entries and one very long entry. What may this mean?",o:["The topic is nonfiction","The topic is an opinion","The topic is too narrow","The topic may be too large"],a:3,e:"Many entries or a very long entry may mean the topic is too large.",t:"Planning"},
      {q:"Which material should be used for the research project?",o:["Fiction only","Nonfiction","Persuasive writing only","An unsigned blog only"],a:1,e:"The research material must be nonfiction rather than fiction or persuasive writing.",t:"Research Materials"},
      {q:"What should be written on the front of a note card?",o:["Only the book’s cover","A modern opinion","Useful information in your own words","Only a URL ending"],a:2,e:"Useful information should be written in your own words and complete sentences.",t:"Note-Taking"},
      {q:"What belongs on the back of a note card?",o:["Information about the book where you found the information","A copied paragraph without credit","Only the final report","A modern judgment"],a:0,e:"The back records the book in which the information was found.",t:"Note-Taking"},
      {q:"Which statement correctly describes a fact?",o:["It always shows bias","It is an attitude","It cannot be proven true or false","It can be proven by evidence"],a:3,e:"A fact expresses something that can be proven by evidence.",t:"Fact vs. Opinion"},
      {q:"Which statement correctly describes an opinion?",o:["It is always accurate data","It expresses an attitude, conclusion, or judgment","It must be a primary source","It is a website address"],a:1,e:"An opinion expresses an attitude, conclusion, or judgment.",t:"Fact vs. Opinion"},
      {q:"Which clue suggests that a webpage is probably not reliable?",o:["The article is signed","The page was updated recently","You cannot find who is responsible for the website","The writing seems balanced"],a:2,e:"If responsibility for the website is unclear, the page is probably not reliable.",t:"Internet Reliability"},
      {q:"Which is the better source in the lesson’s American colonists example?",o:["A signed article in an academic journal at a university","An unsigned cooking blog article","Any article with many opinions","A page with no responsible organization"],a:0,e:"The signed university journal article is the better source.",t:"Internet Reliability"},
      {q:"What warning does the material give about .org websites?",o:["They never contain opinions","They are educational institutions","They cannot support a cause","They may contain biased information and opinions"],a:3,e:"Organizations may gather information for their cause, so .org sites may contain bias.",t:"URL Endings"},
      {q:"Which sequence correctly shows the research process?",o:["Report → topic → opinion → URL","Topic → questions → sources → notes → outline → report","Outline → fiction → topic → report","Modern values → notes → plagiarism → report"],a:1,e:"Research moves from a topic and questions to sources, notes, an outline, and a report.",t:"Research Process"},
      {q:"Why is an unsigned article harder to trust?",o:["It must be fiction","It always ends in .org","You cannot know who wrote it or whether the writer is an expert","It has too many question cards"],a:2,e:"Without authorship, you cannot check who wrote it or whether that person is an expert.",t:"Internet Reliability"},
      {q:"What may happen if a student uses a source with biased information?",o:["The topic automatically becomes workable","The article becomes a primary source","The URL changes to .gov","The research may present unreliable information"],a:3,e:"Biased information can make the research unreliable.",t:"Fact vs. Opinion"},
      {q:"A student has answered all question cards. What should happen next?",o:["Organize the cards into categories","Copy an article word-for-word","Judge the past using modern ideas","Replace facts with opinions"],a:0,e:"The cards should be organized into categories and used as an outline.",t:"Research Process"},
      {q:"A student uses an exact direct quotation. What should the student include?",o:["A new topic","A footnote","An unsigned article","A modern value"],a:1,e:"The lesson says to include a footnote for a direct quotation.",t:"Plagiarism"},
      {q:"Mia restates an author’s opinion in her report. What should she do?",o:["Present it as her own","Remove every fact","Include a reference to the author","Change the URL ending"],a:2,e:"When restating an opinion, she should give credit to the author.",t:"Plagiarism"},
      {q:"Leo copies a paragraph word-for-word and gives no credit. What has he done?",o:["Created an outline","Found a main idea","Used modern values","Plagiarized"],a:3,e:"Copying word-for-word without credit is plagiarism.",t:"Plagiarism"},
      {q:"How should a historian evaluate people’s attitudes in the Middle Ages?",o:["Use historical evidence rather than today’s ideas","Use only today’s understanding of society","Use an unsigned cooking blog","Use persuasive writing instead of evidence"],a:0,e:"Historical evaluations should be based on evidence, not today’s ideas.",t:"Modern Values"},
      {q:"Why is “Middlebury, England, 1535” used in the lesson?",o:["It is an important key date","It is an example of a topic that is too narrow","It identifies a government website","It is a category in an outline"],a:1,e:"It is the lesson’s example of a topic that may be too narrow.",t:"Planning"},
      {q:"A page ends in .edu, but its author is unknown and its writing favors one viewpoint. What should the student conclude?",o:["The page must be reliable because it ends in .edu","The opinions automatically become facts","The URL is one clue, but authorship and bias still need checking","The student should copy it word-for-word"],a:2,e:"A URL ending is only one clue; authorship and balanced writing must still be checked.",t:"Internet Reliability"}
    ];

    const main = document.getElementById("main");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const progressBar = document.getElementById("progressBar");
    const modePill = document.getElementById("modePill");
    let mode="slides", slideIndex=0, quizIndex=0, score=0, answered=false;
    let wrongTopics={}, correctTopics={}, mistakes=[];

    function renderSlide(){
      const s=slides[slideIndex];
      modePill.textContent=s.section==="Final Review"?"Final Review":"Teaching Slides";
      progressBar.style.width=((slideIndex+1)/slides.length*100)+"%";
      main.innerHTML=`<section class="screen"><div class="eyebrow">${s.section}</div><h2>${s.title}</h2><div class="slide-counter">Slide ${slideIndex+1} of ${slides.length}</div>${s.body}<div class="remember"><span>⭐ Remember</span>${s.remember}</div></section>`;
      backBtn.disabled=slideIndex===0;
      backBtn.classList.remove("hidden");
      nextBtn.classList.remove("hidden");
      nextBtn.textContent=s.startQuiz?"Start Quiz →":"Next →";
    }

    function startQuiz(){mode="quiz";quizIndex=0;score=0;answered=false;wrongTopics={};correctTopics={};mistakes=[];renderQuestion()}

    function difficulty(){return quizIndex<10?["Easy","easy"]:quizIndex<20?["Medium","medium"]:["Hard","hard"]}

    function renderQuestion(){
      const item=quizQuestions[quizIndex], d=difficulty();
      modePill.textContent="Interactive Quiz";
      progressBar.style.width=((quizIndex+1)/quizQuestions.length*100)+"%";
      main.innerHTML=`<section class="screen"><div class="quiz-head"><span class="difficulty ${d[1]}">${d[0]}</span><span class="score">Score: ${score}/${quizIndex}</span></div><div class="eyebrow">Question ${quizIndex+1} of ${quizQuestions.length}</div><div class="question">${item.q}</div><div class="choices">${item.o.map((x,i)=>`<button class="choice" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${x}</span></button>`).join("")}</div><div id="feedback" class="feedback"></div><button id="quizNext" class="btn primary next-question">${quizIndex===quizQuestions.length-1?"See My Results →":"Next Question →"}</button></section>`;
      document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.i))));
      document.getElementById("quizNext").addEventListener("click",nextQuestion);
      backBtn.classList.add("hidden"); nextBtn.classList.add("hidden"); answered=false;
    }

    function answerQuestion(selected){
      if(answered)return; answered=true;
      const item=quizQuestions[quizIndex], correct=selected===item.a;
      document.querySelectorAll(".choice").forEach((b,i)=>{b.classList.add("locked");b.disabled=true;if(i===item.a)b.classList.add("correct");if(i===selected&&!correct)b.classList.add("wrong")});
      if(correct){score++;correctTopics[item.t]=(correctTopics[item.t]||0)+1}else{wrongTopics[item.t]=(wrongTopics[item.t]||0)+1;mistakes.push({n:quizIndex+1,topic:item.t,correct:"ABCD"[item.a]+". "+item.o[item.a]})}
      const fb=document.getElementById("feedback");
      fb.className="feedback show "+(correct?"good":"bad");
      fb.innerHTML=`<div>${correct?"✅ Correct!":"❌ Incorrect."}</div><div>Correct answer: <strong>${"ABCD"[item.a]}. ${item.o[item.a]}</strong></div><div class="why">${item.e}</div><div>Score: ${score}/${quizIndex+1}</div>`;
      document.getElementById("quizNext").classList.add("show");
    }

    function nextQuestion(){if(!answered)return;if(quizIndex<quizQuestions.length-1){quizIndex++;renderQuestion()}else{renderResults()}}

    function renderResults(){
      mode="results";modePill.textContent="Final Results";progressBar.style.width="100%";
      const pct=Math.round(score/quizQuestions.length*100);
      const allTopics=[...new Set(quizQuestions.map(q=>q.t))];
      const review=Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
      const strong=allTopics.filter(t=>!wrongTopics[t]);
      main.innerHTML=`<section class="screen results"><div class="eyebrow">Quiz Complete</div><h2>Your Final Score</h2><div class="result-ring" style="--pct:${pct}%"><strong>${pct}%</strong></div><p class="lead" style="margin-inline:auto">Correct: <strong>${score}</strong> &nbsp; • &nbsp; Incorrect: <strong>${quizQuestions.length-score}</strong> &nbsp; • &nbsp; Total: <strong>${quizQuestions.length}</strong></p><div class="result-list grid">
        <div class="card green"><h3>My Strong Topics</h3><p>${strong.length?strong.join(", "):"Keep practicing all topics."}</p></div>
        <div class="card gold"><h3>Topics I Need to Review</h3><p>${review.length?review.join(", "):"Excellent—no weak topic was identified."}</p></div>
      </div>${mistakes.length?`<div class="result-list card"><h3>Mistakes I Made</h3><ul>${mistakes.map(m=>`<li>Question ${m.n} — <b>${m.topic}:</b> ${m.correct}</li>`).join("")}</ul></div>`:""}<div class="remember"><span>⭐ Last-Minute Review</span>${review.length?review.map(t=>memoryFor(t)).join(" • "):"Research carefully, check sources, use evidence, and give credit."}</div></section>`;
      backBtn.classList.add("hidden");nextBtn.classList.add("hidden");
    }

    function memoryFor(t){const m={"Vocabulary":"Credentials = qualified; data = facts and figures.","URL Endings":".gov = government; .edu = education; .org = organization.","Plagiarism":"Own words + author credit + footnote.","Planning":"No entry = too small; many entries = too large.","Research Materials":"Research materials must be nonfiction.","Note-Taking":"Front = information; back = source.","Fact vs. Opinion":"Fact = evidence; opinion = attitude or judgment.","Internet Reliability":"Check Author, Credentials, Updated, Balanced.","Research Process":"Topic → Questions → Sources → Notes → Outline → Report.","Modern Values":"Past events → past evidence."};return m[t]||t}

    backBtn.addEventListener("click",()=>{if(mode==="slides"&&slideIndex>0){slideIndex--;renderSlide()}});
    nextBtn.addEventListener("click",()=>{if(mode!=="slides")return;if(slides[slideIndex].startQuiz){startQuiz()}else if(slideIndex<slides.length-1){slideIndex++;renderSlide()}});
    restartBtn.addEventListener("click",()=>{mode="slides";slideIndex=0;quizIndex=0;score=0;answered=false;wrongTopics={};correctTopics={};mistakes=[];renderSlide()});
    document.addEventListener("keydown",e=>{
      if(mode==="quiz"&&!answered&&["a","b","c","d"].includes(e.key.toLowerCase())){answerQuestion("abcd".indexOf(e.key.toLowerCase()))}
      else if(mode==="slides"&&e.key==="ArrowRight")nextBtn.click();
      else if(mode==="slides"&&e.key==="ArrowLeft")backBtn.click();
      else if(mode==="quiz"&&answered&&e.key==="Enter")document.getElementById("quizNext").click();
    });
    renderSlide();
  </script>
</body>
</html>
