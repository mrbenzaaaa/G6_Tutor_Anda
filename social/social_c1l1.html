<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Is History? — Grade 6 Touchscreen Tutor</title>
<style>
:root {
  --bg:#f4f8ff; --panel:#fff; --ink:#17324d; --muted:#5d7186;
  --blue:#2f6fed; --purple:#7458d9; --green:#1f9d72; --red:#d94d4d;
  --shadow:0 12px 30px rgba(25,55,95,.12); --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#fbf4ff);color:var(--ink)}
body{display:flex;justify-content:center}
button{font:inherit}
.app{width:min(1180px,100%);min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:18px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
.brand{font-weight:800;font-size:clamp(16px,2vw,22px)}
.progress-wrap{flex:1;max-width:460px}
.progress-line{height:12px;background:#e5ebf5;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));width:0;transition:.25s}
.progress-text{font-size:13px;color:var(--muted);margin-top:4px;text-align:right}
.stage{flex:1;display:flex}
.slide,.quiz-card,.result-card{width:100%;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(22px,4vw,48px);min-height:calc(100vh - 170px);display:flex;flex-direction:column}
.tag{display:inline-block;align-self:flex-start;background:#edf3ff;color:var(--blue);padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;margin-bottom:10px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:6px 0 20px}
h2{font-size:clamp(24px,4vw,36px);margin:8px 0 16px}
h3{margin:0 0 8px}
p,li{font-size:clamp(17px,2.2vw,22px);line-height:1.5}
ul{padding-left:28px}
.content{flex:1}
.hero{background:linear-gradient(135deg,#edf5ff,#f7efff);padding:28px;border-radius:22px}
.big{font-size:clamp(36px,7vw,72px);font-weight:900;line-height:1}
.focus-grid,.number-grid,.compare-grid{display:grid;gap:14px}
.focus-grid{grid-template-columns:repeat(3,1fr);margin-top:20px}
.focus-grid>div,.number-grid>div,.compare-grid>div{background:#f6f9fe;border:2px solid #e6edf8;border-radius:18px;padding:18px;text-align:center;font-weight:800;font-size:clamp(16px,2vw,20px)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card,.definition-card,.cause-box,.vocab-box{background:#f7faff;border-left:7px solid var(--blue);padding:18px;border-radius:16px;margin:12px 0}
.definition-card h3{font-size:24px;color:var(--purple)}
.flow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:24px 0}
.flow span{background:#eef4ff;border:2px solid #d9e6ff;border-radius:16px;padding:14px 18px;font-weight:800}
.large-flow span{font-size:clamp(18px,3vw,28px)}
.stack-flow{flex-direction:column}
.question-cloud{display:flex;gap:12px;flex-wrap:wrap}
.question-cloud span{background:#fff8e7;border:2px solid #f8df99;padding:12px 15px;border-radius:999px;font-weight:700}
.number-grid{grid-template-columns:repeat(3,1fr)}
.number-grid b{font-size:30px;color:var(--blue)}
.timeline-simple{display:grid;gap:14px}
.timeline-simple>div{padding:18px;border-left:6px solid var(--purple);background:#f7f3ff;border-radius:14px;font-size:20px}
.mini-table{display:grid;gap:10px}
.mini-table>div{display:grid;grid-template-columns:220px 1fr;gap:16px;background:#f8fafc;padding:12px 16px;border-radius:12px}
.mini-table b{color:var(--blue)}
.compare-grid{grid-template-columns:repeat(3,1fr)}
.compare-grid h3{color:var(--purple)}
.fact-list li{margin:7px 0}
.vocab-grid{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.vocab-grid b,.vocab-grid span{background:#f8fafc;padding:10px 12px;border-radius:10px}
.review-list p,.compare-lines p{margin:10px 0;padding:12px;background:#f8fafc;border-radius:12px}
.remember{margin-top:24px;background:linear-gradient(135deg,#fff7cc,#fff1a8);border:2px solid #f0d56d;padding:16px 18px;border-radius:18px;font-size:clamp(17px,2vw,21px);font-weight:800}
.controls{display:flex;gap:12px;justify-content:space-between;margin-top:14px}
.btn{border:0;border-radius:16px;padding:16px 22px;font-weight:900;font-size:18px;cursor:pointer;min-width:120px;min-height:58px;box-shadow:0 6px 14px rgba(20,45,80,.12)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#eaf0f8;color:var(--ink)} .btn.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:white}
.btn.restart{background:#fff0f0;color:var(--red)} .btn:disabled{opacity:.45;cursor:not-allowed}
.quiz-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}
.score-pill{background:#edf8f4;color:var(--green);padding:9px 13px;border-radius:999px;font-weight:900}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.choice{text-align:left;border:3px solid #e5ebf5;background:#fbfdff;border-radius:18px;padding:18px;min-height:88px;font-size:clamp(17px,2vw,21px);font-weight:800;cursor:pointer}
.choice:hover{border-color:#b8c9f2} .choice.correct{background:#e9f8f1;border-color:#79c9aa} .choice.wrong{background:#fff0f0;border-color:#ef9a9a}
.feedback{margin-top:18px;padding:16px 18px;border-radius:16px;font-size:18px;display:none}
.feedback.good{display:block;background:#e9f8f1;color:#166a4f} .feedback.bad{display:block;background:#fff0f0;color:#9e2f2f}
.explain{margin-top:8px;font-weight:600} .quiz-next{margin-top:16px;align-self:flex-end;display:none}
.result-score{font-size:clamp(46px,8vw,90px);font-weight:900;color:var(--blue);text-align:center;margin:20px 0}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} .result-box{background:#f8fafc;border-radius:18px;padding:18px}
.small{font-size:14px;color:var(--muted)}
@media(max-width:760px){
 .app{padding:10px} .topbar{position:static;flex-wrap:wrap} .progress-wrap{order:3;max-width:none;width:100%}
 .slide,.quiz-card,.result-card{min-height:calc(100vh - 150px);padding:20px}
 .focus-grid,.number-grid,.compare-grid,.choices,.result-grid,.two-col{grid-template-columns:1fr}
 .mini-table>div,.vocab-grid{grid-template-columns:1fr}
 .controls{position:sticky;bottom:6px;background:rgba(255,255,255,.92);padding:8px;border-radius:18px}
 .btn{flex:1;min-width:0;padding:14px 10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">📘 Grade 6 Animated Tutor</div>
    <div class="progress-wrap">
      <div class="progress-line"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text"></div>
    </div>
    <button class="btn restart" id="restartTop">Restart</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="controls" id="slideControls">
    <button class="btn secondary" id="backBtn">← Back</button>
    <button class="btn restart" id="restartBtn">↻ Restart</button>
    <button class="btn primary" id="nextBtn">Next →</button>
  </div>
</div>

<script>
const slides = [{"title": "Welcome — What Is History?", "tag": "Chapter 1 • Lesson 1", "body": "<div class='hero'><div class='big'>What Is History?</div><p><b>Essential Question:</b> Why is history important?</p><p>Events of the past created the world we live in. Knowing history can help us make decisions about the future.</p></div><div class='focus-grid'><div>👤 Historians</div><div>⏳ Measuring Time</div><div>📅 Calendars</div><div>➡️ Time Lines</div><div>🏺 Evidence</div><div>🦴 Lucy</div></div>", "remember": "History helps us understand the past, the present, and the future."}, {"title": "What Is History?", "tag": "Why Study History?", "body": "<p><b>History</b> is the study of the <b>people and events of the past</b>.</p><div class='two-col'><div class='card'><b>CHANGE</b><br>How things become different over time.</div><div class='card'><b>STAY THE SAME</b><br>How some things continue over time.</div></div><p>History tells the story of the ways cultures change over time.</p>", "remember": "History = people + events of the past."}, {"title": "What Does a Historian Do?", "tag": "Cause and Effect", "body": "<p>People who study history are called <b>historians</b>.</p><p>A historian examines the <b>causes</b> and <b>effects</b> of events from the past.</p><div class='flow'><span>WHY did it happen?</span><b>→</b><span>EVENT</span><b>→</b><span>WHAT happened because of it?</span></div><ul><li><b>Cause</b> = the reason something happened.</li><li><b>Effect</b> = the result of what happened.</li></ul>", "remember": "Historian = Cause + Effect."}, {"title": "Questions Historians Ask", "tag": "Thinking Like a Historian", "body": "<div class='question-cloud'><span>What happened?</span><span>Why did it happen?</span><span>How did things change?</span><span>How has it influenced today?</span><span>What would have happened if...?</span></div><p>These questions help historians understand both the event and its results.</p>", "remember": "Ask WHAT, WHY, CHANGE, and EFFECT."}, {"title": "Past → Present → Future", "tag": "Why History Matters", "body": "<p>Learning about the past helps us understand the <b>present</b>. It also helps us make decisions about the <b>future</b>.</p><div class='flow large-flow'><span>PAST</span><b>→</b><span>PRESENT</span><b>→</b><span>FUTURE</span></div><p>Historical examples of <b>conflict</b> and <b>cooperation</b> are things we can learn from when we face similar choices.</p>", "remember": "Past explains Present and can guide Future decisions."}, {"title": "Example: How the Past Influences Today", "tag": "Cause → Effect", "body": "<div class='flow stack-flow'><span>Wheel in prehistoric times</span><b>→</b><span>Horse-drawn carts</span><b>→</b><span>Automobile in modern times</span></div><p>Today, cars are an <b>integral</b> part of our culture.</p><div class='vocab-box'><b>integral</b> — essential; necessary</div>", "remember": "Old ideas can lead to later inventions."}, {"title": "History Helps Explain Who We Are", "tag": "Human Story", "body": "<p>Studying history helps us understand how we fit into the <b>human story</b>.</p><ul><li>the languages we speak</li><li>the technologies we use</li><li>the pastimes we enjoy</li></ul><p>These are results of events that happened in the past.</p>", "remember": "History teaches us how the past shaped our lives today."}, {"title": "Measuring Time", "tag": "Historical Periods", "body": "<p>Historians need a way to identify and describe <b>when</b> things happened.</p><div class='number-grid'><div><b>10 years</b><br>decade</div><div><b>100 years</b><br>century</div><div><b>1,000 years</b><br>millennium</div></div>", "remember": "Decade 10 • Century 100 • Millennium 1,000."}, {"title": "Teacher Vocabulary: Era and Decade", "tag": "Exact Definitions", "body": "<div class='definition-card'><h3>era</h3><p><b>a large division of time</b></p></div><div class='definition-card'><h3>decade</h3><p><b>a group or set of 10 years</b></p></div><p>Your teacher summary also describes an era as a period of years grouped by similar characteristics from the time period.</p>", "remember": "Era = BIG time division. Decade = 10 years."}, {"title": "Prehistory", "tag": "Periods of History", "body": "<p><b>Prehistory</b> is the time <b>before people developed writing</b>.</p><p>Writing was invented about <b>5,500 years ago</b>.</p>", "remember": "Prehistory = BEFORE writing."}, {"title": "Ancient, Middle Ages, Modern", "tag": "Periods of History", "body": "<div class='timeline-simple'><div><b>Ancient History</b><br>ends about <b>A.D. 500</b></div><div><b>Middle Ages / medieval period</b><br>about <b>A.D. 500–1400</b></div><div><b>Modern History</b><br>begins about <b>A.D. 1400</b> and continues to the present day</div></div><p><b>c.</b> or <b>circa</b> means “about.”</p>", "remember": "Ancient ends ~500 • Middle Ages ~500–1400 • Modern ~1400–present."}, {"title": "Historical Eras in One Place", "tag": "Roman Forum Caption", "body": "<p>The ancient <b>Roman Forum</b> has been called the most important meeting place in all of history.</p><p>Today, it stands next to buildings of modern Rome. Ancient and modern buildings together show <b>different historical eras</b>.</p>", "remember": "Different eras can be seen side by side in the Roman Forum area."}, {"title": "What Is a Calendar?", "tag": "Calendars", "body": "<p>A <b>calendar</b> is a system for arranging days in order.</p><p>Different cultures developed about <b>40 different calendars</b>.</p><ul><li>Chinese and Jewish calendars base their months on the appearance of the new moon.</li><li>Ancient Egyptians also based one calendar on the moon.</li></ul>", "remember": "Calendar = system for arranging days in order."}, {"title": "The Julian Calendar", "tag": "Julius Caesar", "body": "<p>Developed by <b>Julius Caesar</b>, a Roman leader.</p><ul><li>Called the <b>Julian calendar</b>.</li><li>Counted years from the founding of Rome.</li><li>A year was <b>365¼ days</b>.</li><li>Added an extra day every <b>4 years</b>.</li><li>The extra-day year was a <b>leap year</b>.</li></ul>", "remember": "Julius Caesar → Julian calendar → extra day every 4 years."}, {"title": "Why the Julian Calendar Needed Change", "tag": "Precise", "body": "<div class='definition-card'><h3>precise</h3><p><b>exact</b></p></div><p>The Julian calendar lost several minutes each year, adding up to about <b>one lost day every 128 years</b>.</p><p>By <b>A.D. 1582</b>, it was about <b>10 days</b> off.</p>", "remember": "Julian was not precise → time error grew."}, {"title": "The Gregorian Calendar", "tag": "Pope Gregory XIII", "body": "<p>In <b>A.D. 1582</b>, <b>Pope Gregory XIII</b> created a new calendar.</p><ul><li>He started counting from the <b>birth of Jesus</b>.</li><li>Days between <b>October 4th and October 15th</b> were dropped that year.</li><li>It includes leap years.</li><li>A century year is a leap year only if divisible by <b>400</b>, such as 1600 or 2000.</li></ul>", "remember": "Gregory → Gregorian • A.D. 1582."}, {"title": "Gregorian Calendar Around the World", "tag": "Calendar Use", "body": "<p>It took more than <b>three centuries</b> for the Gregorian calendar to be recognized around the world.</p><p>Today, <b>most of the world uses this calendar</b>.</p><p>The calendar is named for <b>Pope Gregory XIII</b>.</p>", "remember": "Gregorian calendar = the calendar used by most of the world today."}, {"title": "Other Calendars in the Textbook", "tag": "Religious Importance", "body": "<ul><li>The <b>Jewish calendar</b> begins about <b>3,760 years before</b> the Gregorian calendar, according to Jewish tradition.</li><li>Muslims date their calendar from when <b>Muhammad</b> left <b>Makkah (Mecca)</b> for <b>Madinah (Medina)</b>.</li><li>This was <b>A.D. 622</b> in the Gregorian calendar.</li></ul><p>A stone calendar shown in the textbook was made by the <b>Minoans</b> of ancient <b>Crete</b>.</p>", "remember": "Calendars can be based on important cultural or religious events."}, {"title": "Teacher Vocabulary: Found", "tag": "Exact Definition", "body": "<div class='definition-card'><h3>found</h3><p><b>to create or set up something, such as a city</b></p></div>", "remember": "Found = create or set up."}, {"title": "Dating Events: B.C.", "tag": "Before Christ", "body": "<p><b>B.C.</b> means <b>“before Christ.”</b></p><p>Historians count <b>backward</b> from A.D. 1.</p><p>Example: <b>563 B.C.</b> means 563 years before the birth of Jesus.</p>", "remember": "B.C. = BEFORE → count backward."}, {"title": "Dating Events: A.D.", "tag": "Anno Domini", "body": "<p><b>A.D.</b> means <b>anno domini</b>.</p><p>The textbook says this Latin phrase means <b>“in the year of the Lord.”</b></p><p>Historians count <b>forward</b>, starting at <b>A.D. 1</b>.</p>", "remember": "A.D. → count forward from A.D. 1."}, {"title": "There Is No Year 0", "tag": "B.C. and A.D.", "body": "<div class='flow large-flow'><span>2 B.C.</span><b>→</b><span>1 B.C.</span><b>→</b><span>A.D. 1</span><b>→</b><span>A.D. 2</span></div><p><b>There is no year 0.</b></p><ul><li><b>A.D.</b> is written before the date.</li><li><b>B.C.</b> is written after the date.</li></ul>", "remember": "1 B.C. goes directly to A.D. 1."}, {"title": "B.C.E. and C.E.", "tag": "Alternative Initials", "body": "<ul><li><b>B.C.E.</b> = “before the common era”</li><li><b>C.E.</b> = “common era”</li></ul><p>These initials <b>do not change the numbering of the years</b>.</p>", "remember": "B.C.E./C.E. change the initials, not the year numbers."}, {"title": "What Is a Time Line?", "tag": "Using Time Lines", "body": "<p>A <b>time line</b> tracks the passage of time.</p><div class='two-col'><div class='card'><b>ORDER</b><br>Which events came first, next, and last.</div><div class='card'><b>TIME BETWEEN EVENTS</b><br>How much time passed.</div></div>", "remember": "Time line = event order + time between events."}, {"title": "Ancient India Time Line", "tag": "Textbook Infographic", "body": "<div class='mini-table'><div><b>c. 2600 B.C.</b><span>Mohenjo-Daro flourishes</span></div><div><b>c. 2500 B.C.</b><span>Harappa flourishes</span></div><div><b>c. 1500 B.C.</b><span>Aryans begin migrations to India</span></div><div><b>c. 1000 B.C.</b><span>Aryans control northern India</span></div><div><b>c. 563 B.C.</b><span>Birth of the Buddha</span></div><div><b>c. 265 B.C.</b><span>Mauryan Empire's Golden Age begins</span></div></div>", "remember": "Use the time line to compare event order."}, {"title": "Jagged Lines and Multilevel Time Lines", "tag": "Time-Line Details", "body": "<p>A <b>slanted or jagged line</b> shows that a period of time was <b>omitted</b>.</p><p>Two or more time lines stacked together are called <b>multilevel time lines</b>.</p>", "remember": "Jagged line = time omitted • stacked lines = multilevel."}, {"title": "Heinrich Schliemann", "tag": "Biography", "body": "<p><b>Heinrich Schliemann (A.D. 1822–1890)</b> dreamed of finding Troy.</p><ul><li>In <b>1871</b>, he began digging in <b>Hissarlik, Turkey</b>.</li><li>Two years later, he uncovered remains of a mysterious ancient city where Troy had stood.</li><li>Some archaeologists believe he found Troy; others are unsure.</li><li>His work led to many ancient Greek treasures.</li></ul><p>He is considered the founder of <b>prehistoric Greek archaeology</b>.</p>", "remember": "1871 → Schliemann → Hissarlik, Turkey → search for Troy."}, {"title": "Digging Up the Past", "tag": "Prehistory and Evidence", "body": "<p>Written records give historians a window to the past.</p><p>Students of <b>prehistory</b> study a time with <b>no writing</b>, so they use <b>physical evidence</b>.</p>", "remember": "No writing → use physical evidence."}, {"title": "Archaeology and Artifacts", "tag": "Teacher Definitions", "body": "<div class='definition-card'><h3>archaeology</h3><p><b>The study of objects to learn about past human life</b></p></div><div class='definition-card'><h3>artifact</h3><p><b>an object made by people</b></p></div><p>Examples: <b>tools, pottery, weapons, jewelry</b>.</p>", "remember": "Archaeology → ARTIFACTS → people."}, {"title": "Paleontology and Fossils", "tag": "Teacher Definitions", "body": "<div class='definition-card'><h3>paleontology</h3><p><b>the study of fossils</b></p></div><div class='definition-card'><h3>fossil</h3><p><b>plant or animal remains that have been preserved from an earlier time</b></p></div>", "remember": "Paleontology → FOSSILS → plants & animals."}, {"title": "Anthropology", "tag": "Teacher Definition", "body": "<div class='definition-card'><h3>anthropology</h3><p><b>The study of human culture and how it develops over time</b></p></div><p>Anthropologists study artifacts and fossils too. They look for clues about what people <b>valued and believed</b>.</p>", "remember": "Anthropology → HUMAN CULTURE."}, {"title": "Three Scientists — Big Comparison", "tag": "Very Testable", "body": "<div class='compare-grid'><div><h3>Archaeologist</h3><p>artifacts / things people left behind</p><b>PEOPLE'S OBJECTS</b></div><div><h3>Paleontologist</h3><p>fossils</p><b>FOSSILS</b></div><div><h3>Anthropologist</h3><p>human culture</p><b>CULTURE</b></div></div>", "remember": "A → Artifact • P → Fossil • Anthropology → Culture."}, {"title": "Word Parts: -ology and -ist", "tag": "Build Vocabulary", "body": "<p><b>-ology</b> means <b>“the study of.”</b></p><p><b>-ist</b> means <b>“a person who.”</b></p><ul><li><b>biology</b> = the study of life</li><li><b>biologist</b> = a person who studies life</li></ul>", "remember": "-ology = study of • -ist = person who."}, {"title": "Lucy — Human Discovery", "tag": "1974 • Ethiopia", "body": "<p>In <b>1974</b>, a team led by paleontologist <b>Donald Johanson</b> found a partial skeleton in <b>Ethiopia in Africa</b>.</p><p>The human ancestor lived more than <b>3.2 million years ago</b>.</p><p>She was called <b>Lucy</b>.</p>", "remember": "1974 → Donald Johanson → Ethiopia → Lucy."}, {"title": "What Lucy Was Like", "tag": "Physical Details", "body": "<ul class='fact-list'><li>about <b>3½ feet tall (1.07 m)</b></li><li>about <b>60 pounds (27.2 kg)</b></li><li><b>long arms</b></li><li><b>short legs</b></li><li>walked <b>upright</b></li></ul><p>Scientists pieced together about <b>40 percent</b> of Lucy's skeleton.</p>", "remember": "Lucy: long arms, short legs, walked upright."}, {"title": "Species and Lucy", "tag": "Teacher Definition", "body": "<div class='definition-card'><h3>species</h3><p><b>a class of individuals with similar physical characteristics</b></p></div><p>Lucy belonged to <b>Australopithicus afarensis</b>. She lived long before <b>Homo sapiens</b> evolved.</p>", "remember": "Species = individuals with similar physical characteristics."}, {"title": "Homo sapiens", "tag": "Human Discoveries", "body": "<p>All modern human beings belong to <b>Homo sapiens</b>.</p><p>The textbook says Homo sapiens is Latin for <b>“wise man.”</b></p><p>Scientists believe Homo sapiens probably developed about <b>150,000 to 195,000 years ago</b>.</p>", "remember": "Homo sapiens = modern humans in the textbook."}, {"title": "How Lucy Got Her Name", "tag": "Connections to Today", "body": "<p>The night Lucy was discovered, the team was listening to <b>“Lucy in the Sky with Diamonds”</b> by the <b>Beatles</b>.</p><p>They nicknamed the skeleton <b>“Lucy”</b>. Her official name was <b>AL 288-1</b>.</p>", "remember": "The team's song inspired the nickname “Lucy.”"}, {"title": "Final Review — MUST KNOW", "tag": "Final Review", "body": "<div class='review-list'><p><b>Historian</b> → examines causes and effects.</p><p><b>Past → Present → Future</b></p><p><b>Decade</b> → 10 years</p><p><b>Century</b> → 100 years</p><p><b>Era</b> → a large division of time</p><p><b>Gregorian calendar</b> → used by most of the world today</p><p><b>B.C.</b> → before Christ</p><p><b>A.D.</b> → anno domini</p><p><b>Time line</b> → event order + time between events</p></div>", "remember": "History = cause/effect + time + evidence."}, {"title": "Final Review — 11 Teacher Vocabulary Words", "tag": "Final Review", "body": "<div class='vocab-grid'><b>era</b><span>a large division of time</span><b>archaeology</b><span>The study of objects to learn about past human life</span><b>artifact</b><span>an object made by people</span><b>paleontology</b><span>the study of fossils</span><b>fossil</b><span>plant or animal remains that have been preserved from an earlier time</span><b>anthropology</b><span>The study of human culture and how it develops over time</span><b>species</b><span>a class of individuals with similar physical characteristics</span><b>integral</b><span>essential; necessary</span><b>decade</b><span>a group or set of 10 years</span><b>found</b><span>to create or set up something, such as a city</span><b>precise</b><span>exact</span></div>", "remember": "Know all 11 teacher definitions."}, {"title": "Final Review — Easy to Confuse", "tag": "Final Review", "body": "<div class='compare-lines'><p><b>Artifact</b> → made by people<br><b>Fossil</b> → preserved plant or animal remains</p><p><b>Archaeology</b> → artifacts<br><b>Paleontology</b> → fossils<br><b>Anthropology</b> → human culture</p><p><b>Calendar</b> → organizes days<br><b>Time line</b> → shows events in time order</p><p><b>B.C.</b> → before birth of Jesus<br><b>A.D.</b> → count forward from A.D. 1</p></div>", "remember": "Artifact ≠ Fossil • Calendar ≠ Time line • B.C. ≠ A.D."}, {"title": "Final Review — People, Places, Dates", "tag": "Final Review", "body": "<div class='mini-table'><div><b>Donald Johanson</b><span>led the team that discovered Lucy</span></div><div><b>Ethiopia, Africa</b><span>where Lucy was discovered</span></div><div><b>1974</b><span>Lucy discovered</span></div><div><b>3.2 million+ years ago</b><span>when Lucy lived</span></div><div><b>Pope Gregory XIII</b><span>created Gregorian calendar</span></div><div><b>A.D. 1582</b><span>Gregorian calendar created</span></div><div><b>Julius Caesar</b><span>developed Julian calendar</span></div><div><b>Heinrich Schliemann</b><span>worked to find Troy</span></div><div><b>Hissarlik, Turkey</b><span>where Schliemann dug</span></div><div><b>1871</b><span>Schliemann began digging</span></div></div>", "remember": "Lucy: 1974 • Johanson • Ethiopia."}, {"title": "Final Review — Cause → Effect", "tag": "Final Review", "body": "<div class='cause-box'><p><b>Past events</b> → produce effects → explain the present → help future decisions.</p></div><div class='cause-box'><p><b>Julian calendar not precise</b> → time error grew → about 10 days off by A.D. 1582 → Gregorian calendar created.</p></div><div class='cause-box'><p><b>No writing in prehistory</b> → no written records → scientists use physical evidence.</p></div>", "remember": "Look for WHY something happened and WHAT happened next."}];
const teachingCount = 38;
const quiz = [{"q": "What is history?", "choices": ["The study of only calendars", "The study of people and events of the past", "The study of fossils only", "The study of future events"], "a": 1, "exp": "History studies people and events of the past.", "topic": "Why Study History"}, {"q": "What does a historian mainly examine about past events?", "choices": ["Colors and shapes", "Causes and effects", "Only names", "Only places"], "a": 1, "exp": "Historians examine why events happened and what resulted from them.", "topic": "Why Study History"}, {"q": "Which word means “a group or set of 10 years”?", "choices": ["century", "era", "decade", "millennium"], "a": 2, "exp": "A decade is a group or set of 10 years.", "topic": "Measuring Time"}, {"q": "How many years are in a century?", "choices": ["10", "100", "1,000", "5,500"], "a": 1, "exp": "A century is 100 years.", "topic": "Measuring Time"}, {"q": "Which teacher vocabulary word means “a large division of time”?", "choices": ["era", "artifact", "species", "precise"], "a": 0, "exp": "Era means a large division of time.", "topic": "Vocabulary"}, {"q": "What is prehistory?", "choices": ["The time after A.D. 1400", "The time before people developed writing", "The time of the Gregorian calendar", "The time after A.D. 1"], "a": 1, "exp": "Prehistory is the time before people developed writing.", "topic": "Periods of History"}, {"q": "Which period begins about A.D. 1400 and continues to the present day?", "choices": ["Prehistory", "Ancient History", "Middle Ages", "Modern History"], "a": 3, "exp": "Modern History begins about A.D. 1400 and continues to the present day.", "topic": "Periods of History"}, {"q": "What is a calendar?", "choices": ["A system for arranging days in order", "A list of fossils", "A type of artifact", "A group of 100 years"], "a": 0, "exp": "A calendar is a system for arranging days in order.", "topic": "Calendars"}, {"q": "Who developed the Julian calendar?", "choices": ["Donald Johanson", "Pope Gregory XIII", "Julius Caesar", "Heinrich Schliemann"], "a": 2, "exp": "Julius Caesar developed the Julian calendar.", "topic": "Calendars"}, {"q": "What does “precise” mean?", "choices": ["old", "exact", "necessary", "similar"], "a": 1, "exp": "Precise means exact.", "topic": "Vocabulary"}, {"q": "Why was the Julian calendar changed?", "choices": ["It had no days", "It was not precise and lost time", "It had no leap years", "It counted only B.C. years"], "a": 1, "exp": "The Julian calendar lost several minutes each year, so its error grew.", "topic": "Calendars"}, {"q": "Who created the Gregorian calendar?", "choices": ["Julius Caesar", "Pope Gregory XIII", "Donald Johanson", "Muhammad"], "a": 1, "exp": "Pope Gregory XIII created the Gregorian calendar.", "topic": "Calendars"}, {"q": "In what year was the Gregorian calendar created?", "choices": ["A.D. 622", "A.D. 1400", "A.D. 1582", "A.D. 1871"], "a": 2, "exp": "The Gregorian calendar was created in A.D. 1582.", "topic": "Dates"}, {"q": "What does B.C. mean?", "choices": ["before calendar", "before Christ", "common era", "birth count"], "a": 1, "exp": "B.C. means “before Christ.”", "topic": "Dating Events"}, {"q": "What does A.D. stand for?", "choices": ["anno domini", "ancient date", "after decade", "annual division"], "a": 0, "exp": "A.D. stands for anno domini.", "topic": "Dating Events"}, {"q": "Which sequence is correct?", "choices": ["1 B.C. → year 0 → A.D. 1", "A.D. 1 → 1 B.C. → A.D. 2", "2 B.C. → 1 B.C. → A.D. 1", "1 B.C. → A.D. 0 → A.D. 1"], "a": 2, "exp": "There is no year 0; 1 B.C. is followed by A.D. 1.", "topic": "Dating Events"}, {"q": "What do B.C.E. and C.E. change?", "choices": ["The year numbers", "The length of a year", "Only the initials used for dating", "The order of months"], "a": 2, "exp": "B.C.E. and C.E. do not change the numbering of the years.", "topic": "Dating Events"}, {"q": "What does a time line show?", "choices": ["Only names of people", "The order of events and the amount of time between them", "Only days of the week", "Only objects made by people"], "a": 1, "exp": "A time line shows event order and time between events.", "topic": "Time Lines"}, {"q": "What does a jagged or slanted line on a time line mean?", "choices": ["An event is wrong", "A period of time is omitted", "The calendar changed", "The event happened twice"], "a": 1, "exp": "A jagged line shows that a period of time was omitted.", "topic": "Time Lines"}, {"q": "Two or more time lines stacked together are called what?", "choices": ["era lines", "calendar lines", "multilevel time lines", "artifact lines"], "a": 2, "exp": "Stacked time lines are called multilevel time lines.", "topic": "Time Lines"}, {"q": "Which scientist studies objects to learn about past human life?", "choices": ["archaeologist", "paleontologist", "anthropologist", "calendar maker"], "a": 0, "exp": "Archaeology studies objects to learn about past human life.", "topic": "Archaeology"}, {"q": "Which item is an artifact?", "choices": ["A preserved animal remain from long ago", "A pottery bowl made by people", "A calendar year", "A species name"], "a": 1, "exp": "An artifact is an object made by people.", "topic": "Archaeology"}, {"q": "Which scientist would most directly study a fossil?", "choices": ["archaeologist", "paleontologist", "calendar maker", "historian of time lines"], "a": 1, "exp": "Paleontologists study fossils.", "topic": "Paleontology"}, {"q": "Which best describes a fossil?", "choices": ["An object made by people", "A large division of time", "Plant or animal remains preserved from an earlier time", "A class of people with the same culture"], "a": 2, "exp": "A fossil is preserved plant or animal remains from an earlier time.", "topic": "Paleontology"}, {"q": "An expert studies what ancient people valued and believed. Which field best matches?", "choices": ["paleontology", "anthropology", "calendar study", "time-line study"], "a": 1, "exp": "Anthropology studies human culture and how it develops over time.", "topic": "Anthropology"}, {"q": "What is a species?", "choices": ["A large division of time", "An object made by people", "A class of individuals with similar physical characteristics", "A system for arranging days"], "a": 2, "exp": "A species is a class of individuals with similar physical characteristics.", "topic": "Vocabulary"}, {"q": "A researcher finds tools, pottery, weapons, and jewelry at an old settlement. Which field is most directly involved?", "choices": ["archaeology", "paleontology", "calendar study", "time-line study"], "a": 0, "exp": "Those are artifacts, so archaeology is the best match.", "topic": "Archaeology"}, {"q": "A student wants to know which event happened first and how much time passed before the next event. What should the student use?", "choices": ["a fossil", "a time line", "an artifact", "a species"], "a": 1, "exp": "A time line shows event order and time between events.", "topic": "Time Lines"}, {"q": "Who led the team that discovered Lucy in 1974?", "choices": ["Heinrich Schliemann", "Pope Gregory XIII", "Donald Johanson", "Julius Caesar"], "a": 2, "exp": "Donald Johanson led the team that discovered Lucy.", "topic": "Lucy"}, {"q": "Which statement about Lucy matches the study material?", "choices": ["She was found in Hissarlik, Turkey in 1871", "She lived more than 3.2 million years ago and was found in Ethiopia", "She created the Gregorian calendar", "She was a Roman leader"], "a": 1, "exp": "Lucy was found in Ethiopia and lived more than 3.2 million years ago.", "topic": "Lucy"}];
let mode="slides", slideIndex=0, quizIndex=0, score=0, answered=false, wrongTopics={}, wrongDetails=[];

const stage=document.getElementById("stage");
const progressFill=document.getElementById("progressFill");
const progressText=document.getElementById("progressText");
const slideControls=document.getElementById("slideControls");
const backBtn=document.getElementById("backBtn");
const nextBtn=document.getElementById("nextBtn");

function renderSlide(){
 mode="slides";
 const s=slides[slideIndex], isReview=slideIndex>=teachingCount;
 stage.innerHTML=`<section class="slide"><div class="tag">${isReview?"FINAL REVIEW":s.tag}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember<br>${s.remember}</div></section>`;
 progressFill.style.width=(((slideIndex+1)/(slides.length+quiz.length))*100)+"%";
 progressText.textContent=`${isReview?"Final Review":"Teaching"} • Slide ${slideIndex+1} of ${slides.length}`;
 backBtn.disabled=slideIndex===0;
 nextBtn.textContent=slideIndex===slides.length-1?"Start Quiz →":"Next →";
 slideControls.style.display="flex";
}

function renderQuiz(){
 mode="quiz"; slideControls.style.display="none"; answered=false;
 const item=quiz[quizIndex], letters=["A","B","C","D"];
 stage.innerHTML=`<section class="quiz-card">
  <div class="quiz-head"><div class="tag">TOUCHSCREEN QUIZ</div><div class="score-pill">Score: ${score}/${quizIndex}</div></div>
  <h2>Question ${quizIndex+1} of ${quiz.length}</h2><p><b>${item.q}</b></p>
  <div class="choices">${item.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${letters[i]}.</b> ${c}</button>`).join("")}</div>
  <div id="feedback" class="feedback"></div>
  <button id="quizNext" class="btn primary quiz-next">${quizIndex===quiz.length-1?"See Final Score →":"Next Question →"}</button>
 </section>`;
 progressFill.style.width=(((slides.length+quizIndex+1)/(slides.length+quiz.length))*100)+"%";
 progressText.textContent=`Quiz • Question ${quizIndex+1} of ${quiz.length}`;
 document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.i))));
 document.getElementById("quizNext").addEventListener("click",nextQuestion);
}

function answerQuestion(choiceIndex){
 if(answered)return; answered=true;
 const item=quiz[quizIndex], letters=["A","B","C","D"], buttons=[...document.querySelectorAll(".choice")];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add("correct");if(i===choiceIndex&&i!==item.a)b.classList.add("wrong");});
 const fb=document.getElementById("feedback");
 if(choiceIndex===item.a){
   score++; fb.className="feedback good";
   fb.innerHTML=`✅ <b>Correct!</b><br>Correct answer: <b>${letters[item.a]}. ${item.choices[item.a]}</b><div class="explain">${item.exp}</div><div class="small">Score: ${score}/${quizIndex+1}</div>`;
 } else {
   wrongTopics[item.topic]=(wrongTopics[item.topic]||0)+1;
   wrongDetails.push({num:quizIndex+1,topic:item.topic,correct:letters[item.a]+". "+item.choices[item.a]});
   fb.className="feedback bad";
   fb.innerHTML=`❌ <b>Incorrect.</b><br>Correct answer: <b>${letters[item.a]}. ${item.choices[item.a]}</b><div class="explain">${item.exp}</div><div class="small">Score: ${score}/${quizIndex+1}</div>`;
 }
 document.getElementById("quizNext").style.display="inline-block";
}

function nextQuestion(){if(quizIndex<quiz.length-1){quizIndex++;renderQuiz();}else renderResults();}

function renderResults(){
 mode="results"; slideControls.style.display="none"; progressFill.style.width="100%"; progressText.textContent="Complete";
 const incorrect=quiz.length-score, pct=Math.round(score/quiz.length*100);
 const reviewTopics=Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]);
 const allTopics=[...new Set(quiz.map(q=>q.topic))];
 const strong=allTopics.filter(t=>!wrongTopics[t]);
 const reviewHtml=reviewTopics.length?`<ul>${reviewTopics.map(([t,n])=>`<li><b>${t}</b> — ${n} missed</li>`).join("")}</ul>`:"<p>Excellent — no weak topic was detected.</p>";
 const mistakesHtml=wrongDetails.length?`<ul>${wrongDetails.map(m=>`<li><b>Q${m.num} • ${m.topic}</b>: ${m.correct}</li>`).join("")}</ul>`:"<p>No mistakes.</p>";
 stage.innerHTML=`<section class="result-card">
  <div class="tag">QUIZ COMPLETE</div><h1>Final Score</h1>
  <div class="result-score">${score} / ${quiz.length}</div><p style="text-align:center;font-size:28px"><b>${pct}%</b></p>
  <div class="result-grid"><div class="result-box"><h3>✅ Correct</h3><p>${score}</p></div><div class="result-box"><h3>❌ Incorrect</h3><p>${incorrect}</p></div></div>
  <div class="result-box" style="margin-top:14px"><h3>My Strong Topics</h3><p>${strong.length?strong.join(" • "):"Keep reviewing all topics."}</p></div>
  <div class="result-box" style="margin-top:14px"><h3>Topics I Need to Review</h3>${reviewHtml}</div>
  <div class="result-box" style="margin-top:14px"><h3>Mistakes I Made</h3>${mistakesHtml}</div>
  <div class="remember">⭐ Last-Minute Review<br>Historian = cause + effect • Decade = 10 • Era = large division of time • Artifact = made by people • Paleontology = fossils • Anthropology = human culture • 1974 → Donald Johanson → Ethiopia → Lucy</div>
  <div style="display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap">
   <button class="btn primary" onclick="restartQuiz()">Retry Quiz</button><button class="btn secondary" onclick="restartAll()">Back to Lesson</button>
  </div></section>`;
}

function restartQuiz(){quizIndex=0;score=0;answered=false;wrongTopics={};wrongDetails=[];renderQuiz();}
function restartAll(){slideIndex=0;quizIndex=0;score=0;answered=false;wrongTopics={};wrongDetails=[];renderSlide();}
backBtn.addEventListener("click",()=>{if(slideIndex>0){slideIndex--;renderSlide();}});
nextBtn.addEventListener("click",()=>{if(slideIndex<slides.length-1){slideIndex++;renderSlide();}else{quizIndex=0;score=0;wrongTopics={};wrongDetails=[];renderQuiz();}});
document.getElementById("restartBtn").addEventListener("click",restartAll);
document.getElementById("restartTop").addEventListener("click",restartAll);
renderSlide();
</script>
</body>
</html>
