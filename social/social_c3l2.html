<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grade 6 Social Studies - Lesson 2: The Agricultural Revolution</title>
<style>
:root {
  --ink:#17324d;
  --muted:#5c6f82;
  --paper:#ffffff;
  --bg1:#eef8ff;
  --bg2:#fff8e9;
  --accent:#1f7a8c;
  --accent2:#f2a93b;
  --accent3:#6c63ff;
  --good:#18794e;
  --bad:#b42318;
  --soft:#edf7f8;
  --line:#d9e4ec;
  --shadow:0 14px 36px rgba(31,58,85,.13);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));}
body{min-height:100vh;overflow:hidden}
button{font:inherit}
#app{height:100vh;display:flex;flex-direction:column;padding:14px;gap:10px}
.topbar{
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.7);border-radius:20px;
  box-shadow:0 6px 20px rgba(40,70,100,.08);padding:10px 14px;
  display:flex;align-items:center;gap:12px;min-height:64px
}
.brand{font-weight:900;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-weight:700;font-size:.73rem;margin-top:2px}
.progress-wrap{flex:1;min-width:120px}
.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:800;color:var(--muted);margin-bottom:6px}
.progress-track{height:10px;background:#e7eef4;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent3));border-radius:999px;transition:width .35s ease}
.restart-top{border:0;background:#f4f7fa;color:var(--ink);font-weight:800;border-radius:14px;padding:12px 15px;cursor:pointer;min-height:44px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
.card{
  width:min(1180px,100%);height:100%;background:var(--paper);border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid rgba(20,70,100,.08);
  display:flex;flex-direction:column;overflow:hidden;position:relative
}
.slide-head{padding:24px 28px 10px;border-bottom:1px solid #eef2f5}
.kicker{font-size:.84rem;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);font-weight:900;margin-bottom:5px}
h1{font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.05;margin:0 0 7px;font-weight:950}
.subtitle{font-size:clamp(1rem,1.7vw,1.25rem);color:var(--muted);font-weight:800}
.slide-body{flex:1;min-height:0;overflow:auto;padding:20px 28px 12px;scrollbar-width:thin}
.remember{
  margin:0 28px 14px;padding:14px 18px;border-radius:16px;background:#fff6d7;
  border:2px solid #f2d36f;font-weight:850;font-size:clamp(.98rem,1.5vw,1.15rem)
}
.remember b{color:#9a6400}
.controls{display:flex;gap:10px;padding:0 28px 22px}
.navbtn{
  flex:1;border:0;border-radius:16px;padding:15px 18px;min-height:54px;cursor:pointer;
  font-weight:900;font-size:1.03rem;transition:transform .12s ease,opacity .12s ease
}
.navbtn:active{transform:scale(.985)}
.navbtn.secondary{background:#edf2f6;color:var(--ink)}
.navbtn.primary{background:linear-gradient(135deg,var(--accent),#2a9d8f);color:white}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.slide-in{animation:slideIn .32s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero-grid,.fact-grid,.benefit-grid,.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hero-card,.fact,.benefit-grid>div,.exam-grid>div{
  background:#f8fbfd;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:125px
}
.hero-card b,.fact b,.benefit-grid b,.exam-grid b{font-size:1.08rem}
.hero-card span:not(.emoji),.fact span,.benefit-grid span,.exam-grid span{color:var(--muted);line-height:1.45}
.emoji{font-size:2rem}
.timeline,.flow,.cause-effect{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.time-node,.flow-box,.cause-effect span:not(:nth-child(even)){
  background:#f6fbfc;border:2px solid #d6edef;border-radius:18px;padding:18px;min-width:220px;flex:1;text-align:center
}
.time-node b,.flow-box b{display:block;font-size:1.15rem;margin-bottom:7px}
.time-node span,.flow-box span{color:var(--muted);line-height:1.4}
.arrow,.flow-arrow{font-size:2rem;font-weight:950;color:var(--accent)}
.callout,.spotlight,.definition-card{
  background:linear-gradient(135deg,#f1f7ff,#f9fbff);border-left:6px solid var(--accent3);
  padding:18px 20px;border-radius:16px;margin:14px 0;line-height:1.55
}
.definition-card b,.spotlight>b{font-size:1.35rem}
.big-line{font-size:1.25rem;line-height:1.5;text-align:center;margin:18px auto;max-width:900px}
.small-note{color:var(--muted);font-weight:700;line-height:1.5;margin-top:10px}
.compare.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare>div{background:#f8fbfd;border:1px solid var(--line);border-radius:18px;padding:18px}
.compare h3{margin:0 0 8px;color:var(--accent);font-size:1.2rem}
.compare p{line-height:1.5;margin:8px 0}
.example{background:#fff8e9;border-radius:12px;padding:10px;font-weight:700}
.mini-table{display:grid;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mini-table .row{display:grid;grid-template-columns:minmax(170px,.75fr) 1.6fr}
.mini-table .row span{padding:13px 15px;border-bottom:1px solid var(--line);line-height:1.4}
.mini-table .row span+span{border-left:1px solid var(--line)}
.mini-table .row:last-child span{border-bottom:0}
.mini-table .head{background:#eaf5f6;font-weight:900}
.location-card{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.location-card>div{background:#f8fbfd;border:1px solid var(--line);border-radius:16px;padding:18px}
.location-card b{display:block;color:var(--accent);margin-bottom:6px}
.location-card span{line-height:1.45}
.benefit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.benefit-grid>div{min-height:105px;font-size:1.12rem}
.benefit-grid span{font-size:.98rem}
.vertical{flex-direction:column;gap:4px}
.vertical span{min-width:min(650px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.chips span{background:#eef3ff;border:1px solid #d6dcff;color:#3e45a4;border-radius:999px;padding:9px 13px;font-weight:850}
.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tool-grid>div{background:#f8fbfd;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.tool-grid b{display:block;font-size:1.25rem;color:var(--accent);margin-bottom:6px}
.formula{font-size:clamp(1.8rem,4vw,3rem);font-weight:950;text-align:center;padding:20px;margin:8px auto 18px;background:#fff6d7;border:2px solid #f2d36f;border-radius:20px;max-width:700px}
.civilizations{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.civilizations div{padding:22px 10px;text-align:center;background:linear-gradient(135deg,#eaf5f6,#eef1ff);border-radius:18px;font-weight:950;font-size:1.15rem}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px auto;max-width:900px}
.tier{text-align:center;padding:14px 18px;border-radius:14px;display:flex;flex-direction:column;gap:4px}
.tier.top{width:58%;background:#feecc7}
.tier.middle{width:78%;background:#e6f3fb}
.tier.bottom{width:96%;background:#f1eefc}
.tier b{font-size:1.05rem}
.vocab-list{display:grid;gap:10px}
.vocab-list>div{display:grid;grid-template-columns:180px 1fr 210px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdff}
.vocab-list b{font-size:1.05rem;color:#174f63}
.vocab-list span{line-height:1.38}
.vocab-list em{font-style:normal;color:#7a5b00;background:#fff6d7;border-radius:10px;padding:8px 10px;font-weight:800;font-size:.9rem}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checklist label{background:#f7fbf8;border:1px solid #dbe9de;border-radius:14px;padding:13px 15px;font-weight:800;line-height:1.35}
.review-qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review-qa>div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdff}
.review-qa b{display:block;margin-bottom:5px;color:#174f63;font-size:.96rem}
.review-qa span{line-height:1.35;font-size:.93rem;color:#3e5367}

.quiz-wrap{height:100%;display:flex;flex-direction:column}
.quiz-head{padding:24px 28px 14px;border-bottom:1px solid #eef2f5}
.difficulty{display:inline-block;border-radius:999px;background:#eef3ff;color:#4149ad;font-weight:900;padding:6px 11px;font-size:.8rem;margin-bottom:9px}
.question{font-size:clamp(1.35rem,2.5vw,2rem);font-weight:950;line-height:1.25;margin:0}
.quiz-body{flex:1;min-height:0;overflow:auto;padding:18px 28px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  text-align:left;border:2px solid #dfe8ef;background:white;border-radius:18px;padding:16px 18px;
  min-height:76px;cursor:pointer;font-weight:800;color:var(--ink);display:flex;gap:12px;align-items:flex-start;
  transition:.15s ease
}
.choice:hover{border-color:#9cc8d0;transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice .letter{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#edf4f7;color:#145464;font-weight:950}
.choice.correct{border-color:#5cb98a;background:#eefaf4}
.choice.incorrect{border-color:#e79a94;background:#fff1f0}
.feedback{display:none;margin-top:15px;border-radius:16px;padding:14px 16px;font-weight:800;line-height:1.45}
.feedback.good{display:block;background:#eefaf4;border:1px solid #b7e1ca;color:#155d3c}
.feedback.bad{display:block;background:#fff1f0;border:1px solid #f0c2be;color:#8c241c}
.quiz-actions{display:flex;gap:10px;padding:0 28px 22px}
.quiz-actions button{flex:1}
.result-box{text-align:center;max-width:900px;margin:auto;padding:10px 0 24px}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:8px auto 18px;background:conic-gradient(var(--accent) var(--pct),#e9eef3 0);position:relative}
.score-ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:white}
.score-ring span{position:relative;z-index:1;font-size:1.45rem;font-weight:950}
.review-topics{text-align:left;display:grid;gap:8px;margin:18px 0}
.review-topic{background:#fff8e9;border:1px solid #f3dfb6;border-radius:12px;padding:10px 13px;font-weight:800}
.source-note{font-size:.8rem;color:#6d7b88;text-align:center;padding-top:4px}

@media(max-width:820px){
  #app{padding:8px}
  .topbar{padding:8px 10px;min-height:58px}
  .brand{font-size:.9rem}
  .brand small{display:none}
  .restart-top{padding:10px 11px}
  .slide-head,.quiz-head{padding:18px 18px 9px}
  .slide-body,.quiz-body{padding:14px 18px 10px}
  .remember{margin:0 18px 10px}
  .controls,.quiz-actions{padding:0 18px 16px}
  .hero-grid,.fact-grid,.exam-grid{grid-template-columns:1fr 1fr}
  .tool-grid,.civilizations{grid-template-columns:1fr 1fr}
  .vocab-list>div{grid-template-columns:1fr}
  .compare.two,.location-card,.checklist,.review-qa,.choices{grid-template-columns:1fr}
  .mini-table .row{grid-template-columns:1fr}
  .mini-table .row span+span{border-left:0;border-top:1px dashed var(--line)}
}
@media(max-width:520px){
  h1{font-size:1.65rem}
  .hero-grid,.fact-grid,.benefit-grid,.exam-grid{grid-template-columns:1fr}
  .slide-body{font-size:.96rem}
  .navbtn{padding:13px 12px}
  .progress-label span:first-child{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Grade 6 Social Studies<small>Lesson 2 • Agricultural Revolution</small></div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="sectionLabel">Teaching Slides</span><span id="progressText">Slide 1 of 28</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="restart-top" id="restartTop" type="button">↻ Restart</button>
  </div>
  <main class="stage">
    <section class="card" id="card"></section>
  </main>
</div>

<script>
const slides = [{"title": "Lesson 2: The Agricultural Revolution", "subtitle": "What You Must Know", "content": "\n        <div class=\"hero-grid\">\n          <div class=\"hero-card\"><span class=\"emoji\">🌾</span><b>Neolithic Age</b><span>About 8000 B.C. to 4000 B.C.</span></div>\n          <div class=\"hero-card\"><span class=\"emoji\">🏡</span><b>Agricultural Revolution</b><span>Farming replaced hunting and gathering as people settled.</span></div>\n          <div class=\"hero-card\"><span class=\"emoji\">🛠️</span><b>Specialization</b><span>More food allowed some people to do jobs other than farming.</span></div>\n          <div class=\"hero-card\"><span class=\"emoji\">🏺</span><b>Bronze Age</b><span>Bronze use spread between 3000 and 1200 B.C.</span></div>\n          <div class=\"hero-card\"><span class=\"emoji\">🏙️</span><b>Early Civilizations</b><span>Mesopotamia, Egypt, India, and China.</span></div>\n          <div class=\"hero-card\"><span class=\"emoji\">✍️</span><b>Big Changes</b><span>Cities, governments, religion, social classes, writing, and more complex art.</span></div>\n        </div>\n        ", "remember": "Farming changed where people lived, what jobs they did, and how societies developed."}, {"title": "The Neolithic Age", "subtitle": "A New Way of Life", "content": "\n        <div class=\"timeline\">\n          <div class=\"time-node\"><b>About 8000 B.C.</b><span>The Neolithic Age began at the end of the last Ice Age.</span></div>\n          <div class=\"arrow\">→</div>\n          <div class=\"time-node\"><b>About 4000 B.C.</b><span>The Neolithic Age ended after about 4,000 years.</span></div>\n        </div>\n        <div class=\"callout\">\n          <b>Neolithic</b> is Greek for “new stone.” The textbook says this name can be misleading because the biggest change was not only new stone tools—it was the shift to farming.\n        </div>\n        ", "remember": "Neolithic Age = about 8000 B.C. → 4000 B.C.; the key change was the shift to farming."}, {"title": "Before Farming", "subtitle": "Nomads → Settled Farmers", "content": "\n        <div class=\"flow\">\n          <div class=\"flow-box\"><b>Nomads</b><span>Moved from place to place to hunt animals and gather plants.</span></div>\n          <div class=\"flow-arrow\">→</div>\n          <div class=\"flow-box\"><b>Climate warmed</b><span>More people moved to areas with mild climate and fertile land.</span></div>\n          <div class=\"flow-arrow\">→</div>\n          <div class=\"flow-box\"><b>Farming grew</b><span>People began staying in one place to grow grains and vegetables.</span></div>\n        </div>\n        <p class=\"big-line\">Gradually, <strong>farming replaced hunting and gathering</strong> as the main source of food.</p>\n        ", "remember": "Nomads moved; farmers stayed."}, {"title": "The Agricultural Revolution", "subtitle": "The Big Change", "content": "\n        <div class=\"definition-card\">\n          <b>Agricultural Revolution</b>\n          <p>Historians use this name for the move to <strong>settled farming</strong> during the Neolithic Age.</p>\n        </div>\n        <div class=\"cause-effect\">\n          <span>Learn to grow crops + tame food-producing animals</span>\n          <span>→</span>\n          <span>More constant food supply</span>\n          <span>→</span>\n          <span>Population grows faster</span>\n          <span>→</span>\n          <span>Settled communities</span>\n        </div>\n        <div class=\"small-note\">The shift did not happen quickly. Some people still hunted and gathered while others began growing their own food.</div>\n        ", "remember": "Agricultural Revolution = the move from hunting and gathering toward settled farming."}, {"title": "Two Key Farming Ideas", "subtitle": "Systematic Agriculture + Domestication", "content": "\n        <div class=\"compare two\">\n          <div>\n            <h3>Systematic Agriculture</h3>\n            <p>The organized growing of food on a regular schedule.</p>\n            <p class=\"example\">Textbook idea: people saved grains and planted them.</p>\n          </div>\n          <div>\n            <h3>Domesticate</h3>\n            <p>To adapt an animal to living with humans for the advantage of humans.</p>\n            <p class=\"example\">Animals transported goods and provided meat, milk, and wool.</p>\n          </div>\n        </div>\n        ", "remember": "Systematic agriculture = regular growing; domesticate = adapt animals for human advantage."}, {"title": "Farming Spreads: Southwest Asia and Europe", "subtitle": "Widespread Farming", "content": "\n        <div class=\"fact-grid\">\n          <div class=\"fact\"><b>By 8000 B.C.</b><span>Southwest Asia: wheat and barley; pigs, cows, goats, and sheep were domesticated.</span></div>\n          <div class=\"fact\"><b>From Southwest Asia</b><span>Farming spread into southeastern Europe.</span></div>\n          <div class=\"fact\"><b>By 4000 B.C.</b><span>Farming was an established economic activity in Europe.</span></div>\n        </div>\n        ", "remember": "Southwest Asia → southeastern Europe; by 4000 B.C. farming was established in Europe."}, {"title": "Farming Spreads: Africa and Asia", "subtitle": "Dates, Crops, Places", "content": "\n        <div class=\"mini-table\">\n          <div class=\"row head\"><span>Place</span><span>What the lesson says</span></div>\n          <div class=\"row\"><span><b>Egypt / Nile Valley</b></span><span>Around 6000 B.C.: wheat and barley; farming spread along the Nile and into other parts of Africa.</span></div>\n          <div class=\"row\"><span><b>Central Africa</b></span><span>Different crops emerged, including tubers such as yams and tropical fruit crops such as bananas.</span></div>\n          <div class=\"row\"><span><b>India</b></span><span>Wheat and barley farming moved eastward between 8000 and 5000 B.C.</span></div>\n          <div class=\"row\"><span><b>Northern China</b></span><span>By 6000 B.C.: millet; dogs and pigs were domesticated.</span></div>\n          <div class=\"row\"><span><b>Southeast Asia</b></span><span>By 5000 B.C.: rice; rice farming then spread into southern China.</span></div>\n        </div>\n        ", "remember": "Match dates with places: Egypt ~6000 B.C.; northern China 6000 B.C.; Southeast Asia 5000 B.C."}, {"title": "Farming Spreads: Western Hemisphere", "subtitle": "Mexico and Central America", "content": "\n        <div class=\"spotlight\">\n          <b>Between 7000 and 5000 B.C.</b>\n          <p>People in <strong>Mexico and Central America</strong> were growing <strong>corn, squash, and potatoes</strong>.</p>\n          <p>They also domesticated <strong>chickens and dogs</strong>.</p>\n        </div>\n        ", "remember": "Western Hemisphere example: corn, squash, potatoes; chickens and dogs."}, {"title": "Life in Neolithic Villages", "subtitle": "Permanent Homes", "content": "\n        <div class=\"flow\">\n          <div class=\"flow-box\"><b>Farming</b><span>People needed to stay near fields.</span></div>\n          <div class=\"flow-arrow\">→</div>\n          <div class=\"flow-box\"><b>Permanent homes</b><span>People settled in villages.</span></div>\n          <div class=\"flow-arrow\">→</div>\n          <div class=\"flow-box\"><b>Water nearby</b><span>Villages were often near water sources, especially rivers.</span></div>\n        </div>\n        ", "remember": "Farm fields + water sources helped villages become permanent."}, {"title": "Neolithic Community: Jericho", "subtitle": "One of the Oldest Communities", "content": "\n        <div class=\"location-card\">\n          <div><b>Where?</b><span>Southwest Asia, in the area called the West Bank.</span></div>\n          <div><b>When?</b><span>Established by about 8000 B.C.</span></div>\n          <div><b>What?</b><span>A farming village spread across several acres.</span></div>\n          <div><b>Homes?</b><span>Sun-dried-brick houses surrounded by walls several feet thick.</span></div>\n        </div>\n        ", "remember": "Jericho: about 8000 B.C., farming village, sun-dried-brick houses, thick walls."}, {"title": "Neolithic Community: Çatalhöyük", "subtitle": "A Large Community in Present-Day Turkey", "content": "\n        <div class=\"fact-grid\">\n          <div class=\"fact\"><b>6700–5700 B.C.</b><span>The lesson dates the community to this period.</span></div>\n          <div class=\"fact\"><b>32 acres</b><span>About 6,000 people lived there.</span></div>\n          <div class=\"fact\"><b>Homes</b><span>Simple mud-brick houses built close together, with roof entrances instead of front doors.</span></div>\n          <div class=\"fact\"><b>Inside homes</b><span>People decorated walls with paintings.</span></div>\n        </div>\n        <div class=\"small-note\">People could walk from house to house across the roofs.</div>\n        ", "remember": "Çatalhöyük = close mud-brick houses + roof entrances + about 6,000 people."}, {"title": "Religion in Çatalhöyük", "subtitle": "Shrines and Growing Religious Importance", "content": "\n        <div class=\"definition-card\">\n          <b>Shrine</b>\n          <p>A place where people worship.</p>\n        </div>\n        <div class=\"cause-effect\">\n          <span>Special buildings called shrines</span>\n          <span>→</span>\n          <span>Images of gods and goddesses + statues</span>\n          <span>→</span>\n          <span>Shows religion was growing in importance</span>\n        </div>\n        ", "remember": "Shrine = a place where people worship."}, {"title": "Benefits of Settled Life", "subtitle": "Why Villages Could Grow", "content": "\n        <div class=\"benefit-grid\">\n          <div>🛡️ <b>Protection</b><span>From weather and wild animals.</span></div>\n          <div>🍞 <b>Steady food</b><span>Supported healthier, growing populations.</span></div>\n          <div>👥 <b>More workers</b><span>More workers could grow more crops.</span></div>\n          <div>📦 <b>Surplus</b><span>Villagers could trade extra food for supplies they did not produce.</span></div>\n        </div>\n        ", "remember": "Steady food → more people → more workers → more crops → trade."}, {"title": "Specialization and the Economy", "subtitle": "New Jobs Appear", "content": "\n        <div class=\"cause-effect vertical\">\n          <span>Abundant food</span><span>↓</span>\n          <span>Fewer people needed in fields</span><span>↓</span>\n          <span>People could do work other than farming</span><span>↓</span>\n          <span><strong>Specialization</strong></span>\n        </div>\n        <div class=\"chips\">\n          <span>Artisans</span><span>Weapons</span><span>Jewelry</span><span>Pottery</span><span>Baskets</span><span>Cloth</span><span>Trade</span>\n        </div>\n        <p class=\"small-note\">Craftspeople and farmers exchanged the goods they produced for things they did not have.</p>\n        ", "remember": "Food surplus freed some people to specialize in skilled jobs."}, {"title": "Changing Roles and Community Problems", "subtitle": "Not Every Change Was a Benefit", "content": "\n        <div class=\"compare two\">\n          <div>\n            <h3>Changing Roles</h3>\n            <p>Men worked in fields and herded animals, became more responsible for food and protection, and emerged as family and community leaders.</p>\n            <p>Women bore children, stayed in villages, wove cloth, made clothing, managed food supplies, and performed other tasks.</p>\n          </div>\n          <div>\n            <h3>Problems of Growth</h3>\n            <p>Rapid population growth could use resources such as wood quickly.</p>\n            <p>Loss of forests could cause desert-like conditions, and many settlements were abandoned.</p>\n          </div>\n        </div>\n        ", "remember": "Community growth brought both benefits and problems."}, {"title": "New Technology at the End of the Neolithic Age", "subtitle": "Tools Improve", "content": "\n        <div class=\"tool-grid\">\n          <div><b>Hoe</b><span>Digging soil</span></div>\n          <div><b>Sickle</b><span>Cutting grain</span></div>\n          <div><b>Millstone</b><span>Grinding flour</span></div>\n          <div><b>Copper</b><span>Workers heated rocks, found copper, and made tools and weapons.</span></div>\n        </div>\n        <div class=\"small-note\">The textbook says copper tools and weapons were easier to make and use than stone ones.</div>\n        ", "remember": "Hoe = soil; sickle = grain; millstone = flour."}, {"title": "The Bronze Age", "subtitle": "Copper + Tin → Bronze", "content": "\n        <div class=\"formula\">Copper + Tin → <strong>Bronze</strong></div>\n        <div class=\"fact-grid\">\n          <div class=\"fact\"><b>Why important?</b><span>Bronze was stronger than copper.</span></div>\n          <div class=\"fact\"><b>When?</b><span>Bronze became widely used between 3000 and 1200 B.C.</span></div>\n          <div class=\"fact\"><b>Name of period?</b><span>The Bronze Age.</span></div>\n          <div class=\"fact\"><b>Did everyone use bronze?</b><span>No. Few people could afford bronze, so many continued using stone tools and weapons.</span></div>\n        </div>\n        ", "remember": "Copper + tin = stronger bronze; 3000–1200 B.C. = Bronze Age."}, {"title": "Civilizations Emerge", "subtitle": "Four Great River Valley Civilizations", "content": "\n        <div class=\"civilizations\">\n          <div>Mesopotamia</div><div>Egypt</div><div>India</div><div>China</div>\n        </div>\n        <p class=\"big-line\">More complex cultures called <strong>civilizations</strong> emerged around <strong>3000 B.C.</strong></p>\n        <div class=\"callout\">The first civilizations developed in river valleys with fertile land, fish, water, and opportunities for trade and exchange of ideas.</div>\n        ", "remember": "Around 3000 B.C.: Mesopotamia, Egypt, India, and China."}, {"title": "Cities and Government", "subtitle": "Why Governments Formed", "content": "\n        <div class=\"cause-effect\">\n          <span>Large cities</span><span>→</span><span>Need protection and food supplies</span><span>→</span><span>Governments formed</span>\n        </div>\n        <div class=\"definition-card\">\n          <b>Monarchy</b>\n          <p>A government whose ruler, a king or queen, inherits the position from a parent.</p>\n        </div>\n        <div class=\"chips\"><span>Armies for defense</span><span>Laws</span><span>Officials</span><span>Food supplies</span><span>Building projects</span></div>\n        ", "remember": "Monarchy = king or queen inherits the position from a parent."}, {"title": "Religion in Early Civilizations", "subtitle": "A More Important Role in Society", "content": "\n        <div class=\"fact-grid\">\n          <div class=\"fact\"><b>Purpose</b><span>Religions helped people explain their lives, forces of nature, and the role of humans in the world.</span></div>\n          <div class=\"fact\"><b>Belief</b><span>Early people believed gods were responsible for a community’s survival.</span></div>\n          <div class=\"fact\"><b>Priests</b><span>Performed religious ceremonies to try to win the support of the gods.</span></div>\n          <div class=\"fact\"><b>Rulers</b><span>Claimed that their own power was based on the approval of the gods.</span></div>\n        </div>\n        ", "remember": "Religion explained life and nature and was linked to community survival and rulers."}, {"title": "Social Structure", "subtitle": "Society Divided into Classes", "content": "\n        <div class=\"pyramid\">\n          <div class=\"tier top\"><b>Highest</b><span>Kings, generals, rulers, government officials, warriors</span></div>\n          <div class=\"tier middle\"><b>Large group of free people</b><span>Farmers, artisans, craftspeople</span></div>\n          <div class=\"tier bottom\"><b>Bottom</b><span>Enslaved people; most were captured from enemies during war</span></div>\n        </div>\n        <div class=\"small-note\">Groups differed by work, lifestyle, and the power they had.</div>\n        ", "remember": "Largest free group = farmers, artisans, and craftspeople."}, {"title": "Writing and Art", "subtitle": "New Features of Civilization", "content": "\n        <div class=\"compare two\">\n          <div>\n            <h3>Writing</h3>\n            <p>Early systems used symbols in place of letters and words.</p>\n            <p>Writing was used to keep accurate records and preserve stories.</p>\n          </div>\n          <div>\n            <h3>Art</h3>\n            <p>Art grew more complex and served government and practical purposes.</p>\n            <p>Artists made paintings and sculptures of gods and forces of nature, and people built massive buildings for worship or burial tombs for kings.</p>\n          </div>\n        </div>\n        ", "remember": "Writing kept records and stories; art became more complex."}, {"title": "Teacher Vocabulary 1", "subtitle": "Definitions to Know Exactly", "content": "\n        <div class=\"vocab-list\">\n          <div><b>Domesticate</b><span>to adapt an animal to living with humans for the advantage of humans</span><em>Memory: animal + humans</em></div>\n          <div><b>Neolithic Age</b><span>relating to the latest period of the Stone Age</span><em>Memory: latest Stone Age period</em></div>\n          <div><b>Systematic Agriculture</b><span>the organized growing of food on a regular schedule</span><em>Memory: organized + regular</em></div>\n          <div><b>Shrine</b><span>a place where people worship</span><em>Memory: worship place</em></div>\n          <div><b>Specialization</b><span>the act of training for a particular job</span><em>Memory: one particular job</em></div>\n        </div>\n        ", "remember": "Learn the teacher definitions exactly."}, {"title": "Teacher Vocabulary 2", "subtitle": "Definitions to Know Exactly", "content": "\n        <div class=\"vocab-list\">\n          <div><b>Bronze Age</b><span>the period in ancient human culture when people began to make and use bronze</span><em>Memory: make + use bronze</em></div>\n          <div><b>Monarchy</b><span>a government whose ruler, a king or queen, inherits the position from a parent</span><em>Memory: ruler inherits</em></div>\n          <div><b>Economy</b><span>the system of economic life in an area or country; an economy deals with the making, buying, and selling of goods or services</span><em>Memory: make + buy + sell</em></div>\n          <div><b>Locate</b><span>to set up in a particular place</span><em>Memory: set up somewhere</em></div>\n        </div>\n        ", "remember": "Economy = making, buying, selling; locate = set up in a place."}, {"title": "Easy-to-Confuse Points", "subtitle": "Compare Before the Test", "content": "\n        <div class=\"mini-table\">\n          <div class=\"row head\"><span>Idea 1</span><span>Idea 2</span></div>\n          <div class=\"row\"><span><b>Neolithic Age</b><br>about 8000–4000 B.C.</span><span><b>Bronze Age</b><br>bronze widely used 3000–1200 B.C.</span></div>\n          <div class=\"row\"><span><b>Systematic agriculture</b><br>organized growing of food regularly</span><span><b>Domestication</b><br>adapting animals to living with humans</span></div>\n          <div class=\"row\"><span><b>Food surplus</b><br>extra food</span><span><b>Specialization</b><br>training for a particular job</span></div>\n          <div class=\"row\"><span><b>Shrine</b><br>place of worship</span><span><b>Monarchy</b><br>government with inherited king/queen</span></div>\n        </div>\n        ", "remember": "Do not mix the time periods, farming terms, or government/religion terms."}, {"title": "Exam Focus + Memory Tricks", "subtitle": "High-Value Facts", "content": "\n        <div class=\"exam-grid\">\n          <div><b>8 → 4</b><span>Neolithic Age: about 8000 to 4000 B.C.</span></div>\n          <div><b>3 → 1.2</b><span>Bronze widely used: 3000 to 1200 B.C.</span></div>\n          <div><b>Food Chain</b><span>Steady food → population → workers → surplus → trade → specialization</span></div>\n          <div><b>4 Rivers</b><span>Mesopotamia • Egypt • India • China</span></div>\n          <div><b>Bronze Formula</b><span>Copper + Tin → Bronze</span></div>\n          <div><b>Village Warning</b><span>Population growth → resources used quickly → loss of forests → desert-like conditions</span></div>\n        </div>\n        ", "remember": "Dates + cause/effect + definitions are the biggest memory targets."}, {"title": "Final 2-Minute Review", "subtitle": "Remember These Before the Test", "content": "\n        <div class=\"checklist\">\n          <label>✓ Neolithic Age: about 8000–4000 B.C.</label>\n          <label>✓ Agricultural Revolution: move to settled farming</label>\n          <label>✓ Farming + domestication created a more constant food supply</label>\n          <label>✓ Villages grew; surplus food supported trade and specialization</label>\n          <label>✓ Bronze = copper + tin; Bronze Age = 3000–1200 B.C.</label>\n          <label>✓ Four river valley civilizations: Mesopotamia, Egypt, India, China</label>\n          <label>✓ Early civilizations developed cities and governments</label>\n          <label>✓ Religion became more important; societies had social classes</label>\n          <label>✓ Writing systems were invented; art grew more complex</label>\n        </div>\n        ", "remember": "If you can explain the chain from farming → villages → specialization → civilization, you understand the lesson."}, {"title": "Lesson 2 Review", "subtitle": "Textbook Review Questions + Source-Based Answers", "content": "\n        <div class=\"review-qa\">\n          <div><b>1. What was systematic agriculture?</b><span>The organized growing of food on a regular schedule.</span></div>\n          <div><b>2. How did specialization affect the lives of Neolithic peoples?</b><span>People could take up specific jobs other than farming, such as making weapons, jewelry, pottery, baskets, and cloth.</span></div>\n          <div><b>3. What was the Agricultural Revolution?</b><span>The move to settled farming during the Neolithic Age, when farming began replacing hunting and gathering.</span></div>\n          <div><b>4. How did farming lead to new types of economic activities?</b><span>Food surpluses meant fewer people were needed in fields, so people specialized and traded goods.</span></div>\n          <div><b>5. What are advantages and disadvantages when a community grows?</b><span>Advantages: more workers, more crops, trade, and specialized jobs. Disadvantages: resources such as wood could be used up, and loss of forests could cause desert-like conditions.</span></div>\n          <div><b>6. Which groups made up the largest social class in early civilizations?</b><span>The large group of free people: farmers, artisans, and craftspeople.</span></div>\n          <div><b>7. Persuade hunter-gatherers to settle and farm.</b><span>Use lesson facts: settled farming can give a steady food supply, support larger communities, create food surplus, allow trade, and let some people take specialized jobs.</span></div>\n        </div>\n        ", "remember": "Review questions connect definitions, cause/effect, and the benefits and problems of settled life."}];

alley civilization in China"], "answer": 1, "explain": "Jericho was established by about 8000 B.C. and had sun-dried-brick houses.", "topic": "Neolithic Communities"}, {"q": "Which statement matches Çatalhöyük?", "choices": ["It was established by about 8000 B.C. in the West Bank", "It had no farming", "People entered homes through holes in the rooftops", "It was one of the four river valley civilizations"], "answer": 2, "explain": "Çatalhöyük houses had roof entrances instead of front doors.", "topic": "Neolithic Communities"}, {"q": "What could rapid population growth do to a settlement’s resources?", "choices": ["Create unlimited forests", "Stop all trade", "Make copper stronger", "Use resources such as wood quickly"], "answer": 3, "explain": "The lesson says rapid growth could use wood and other resources quickly.", "topic": "Community Growth"}, {"q": "Which tool was used for cutting grain?", "choices": ["Sickle", "Hoe", "Millstone", "Shrine"], "answer": 0, "explain": "Sickles were used for cutting grain.", "topic": "Technology"}, {"q": "Why did many people continue to use stone tools during the Bronze Age?", "choices": ["Bronze was weaker than stone", "Few people could afford bronze", "Copper did not exist", "Farming had ended"], "answer": 1, "explain": "The lesson says few people could afford bronze.", "topic": "Bronze Age"}, {"q": "Why did early civilizations form governments?", "choices": ["To end all farming", "To remove rivers", "To protect themselves and their food supplies", "To stop writing"], "answer": 2, "explain": "Governments helped protect inhabitants and food supplies.", "topic": "Government"}, {"q": "What is a monarchy?", "choices": ["A place where people worship", "A system of writing", "A farming schedule", "A government whose ruler, a king or queen, inherits the position from a parent"], "answer": 3, "explain": "That is the teacher’s definition of monarchy.", "topic": "Vocabulary"}, {"q": "By 8000 B.C., what crops were people in Southwest Asia growing?", "choices": ["Wheat and barley", "Rice and millet", "Corn and squash", "Yams and bananas only"], "answer": 0, "explain": "The lesson says people in Southwest Asia grew wheat and barley by 8000 B.C.", "topic": "Spread of Farming"}, {"q": "By 6000 B.C., what food grain was grown in northern China?", "choices": ["Rice", "Millet", "Corn", "Barley only"], "answer": 1, "explain": "The lesson says millet was grown in northern China by 6000 B.C.", "topic": "Spread of Farming"}, {"q": "By 5000 B.C., what were farmers in Southeast Asia growing?", "choices": ["Wheat only", "Corn only", "Rice", "Olives"], "answer": 2, "explain": "The lesson says farmers in Southeast Asia were growing rice by 5000 B.C.", "topic": "Spread of Farming"}, {"q": "A village has extra grain, and one person becomes a skilled jewelry maker. Which lesson idea best explains this?", "choices": ["Nomadic hunting", "Loss of forests", "Monarchy", "Specialization after food surplus"], "answer": 3, "explain": "Food surplus allowed some people to do specialized jobs such as making jewelry.", "topic": "Specialization"}, {"q": "Which group made up the large group of free people in the social structure?", "choices": ["Farmers, artisans, and craftspeople", "Only kings and generals", "Only priests", "Only enslaved people"], "answer": 0, "explain": "Farmers, artisans, and craftspeople formed the large group of free people.", "topic": "Social Structure"}, {"q": "What was one important use of writing in early civilizations?", "choices": ["Making bronze stronger", "Keeping accurate records and preserving stories", "Growing crops faster", "Building roof entrances"], "answer": 1, "explain": "Writing was used to keep records and preserve stories.", "topic": "Writing and Art"}, {"q": "Which cause-and-effect chain best matches the lesson?", "choices": ["Writing → no farming → nomads return", "Bronze → rivers disappear → cities shrink", "Steady food → population grows → more workers → more crops", "Shrines → fewer people → no trade"], "answer": 2, "explain": "The lesson links steady food to population growth, more workers, and more crops.", "topic": "Cause and Effect"}, {"q": "Which is an advantage AND a disadvantage of a growing settled community?", "choices": ["Less food, but more nomads", "No trade, but more hunting", "Fewer jobs, but more forests always", "More workers, but resources can be used up quickly"], "answer": 3, "explain": "Growth could bring more workers but also use resources quickly.", "topic": "Community Growth"}, {"q": "Which statement correctly compares the Neolithic Age and Bronze Age?", "choices": ["Neolithic: farming shift; Bronze Age: bronze widely used", "Neolithic: monarchy began; Bronze Age: hunting began", "Neolithic: 3000–1200 B.C.; Bronze Age: 8000–4000 B.C.", "They are the same period"], "answer": 0, "explain": "The Neolithic Age centers on the farming shift; the Bronze Age centers on widespread bronze use.", "topic": "Compare Time Periods"}, {"q": "You are persuading hunter-gatherers to settle and farm. Which reason is supported by the lesson?", "choices": ["Settled farming guarantees no problems with resources", "Settled farming can provide a steady food supply, support larger communities, and lead to trade and specialized jobs", "Farming ends the need for all work", "Farming makes every person a king or queen"], "answer": 1, "explain": "The lesson supports steady food, larger communities, trade, and specialization.", "topic": "Lesson Review"}];

let slideIndex = 0;
let qIndex = 0;
let score = 0;
let answered = false;
let misses = {};
const card = document.getElementById('card');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const sectionLabel = document.getElementById('sectionLabel');

function setProgress(text, pct, section) {
  progressText.textContent = text;
  progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  sectionLabel.textContent = section;
}

function renderSlide() {
  const s = slides[slideIndex];
  setProgress(`Slide ${slideIndex+1} of ${slides.length}`, ((slideIndex+1)/slides.length)*100, 'Teaching Slides');
  card.innerHTML = `
    <div class="slide-in" style="height:100%;display:flex;flex-direction:column">
      <div class="slide-head">
        <div class="kicker">Teaching Slide</div>
        <h1>${s.title}</h1>
        <div class="subtitle">${s.subtitle || ''}</div>
      </div>
      <div class="slide-body">${s.content}</div>
      <div class="remember"><b>⭐ Remember:</b> ${s.remember}</div>
      <div class="controls">
        <button class="navbtn secondary" id="backBtn" type="button" ${slideIndex===0?'disabled':''}>← Back</button>
        <button class="navbtn primary" id="nextBtn" type="button">${slideIndex===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button>
      </div>
    </div>`;
  document.getElementById('backBtn').onclick = () => { if(slideIndex>0){slideIndex--;renderSlide();} };
  document.getElementById('nextBtn').onclick = () => {
    if(slideIndex < slides.length-1){ slideIndex++; renderSlide(); }
    else startQuiz();
  };
}

function startQuiz() {
  qIndex = 0; score = 0; answered = false; misses = {};
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = quiz[qIndex];
  const level = qIndex < 10 ? 'Easy' : qIndex < 20 ? 'Medium' : 'Hard';
  setProgress(`Question ${qIndex+1} of ${quiz.length}`, ((qIndex+1)/quiz.length)*100, '30-Question Quiz');
  const letters = ['A','B','C','D'];
  card.innerHTML = `
    <div class="quiz-wrap slide-in">
      <div class="quiz-head">
        <span class="difficulty">${level}</span>
        <div class="question">${item.q}</div>
      </div>
      <div class="quiz-body">
        <div class="choices" id="choices">
          ${item.choices.map((c,i)=>`<button class="choice" type="button" data-i="${i}"><span class="letter">${letters[i]}</span><span>${c}</span></button>`).join('')}
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
      <div class="quiz-actions">
        <button class="navbtn secondary" type="button" id="lessonBtn">← Back to Lesson Review</button>
        <button class="navbtn primary" type="button" id="qNext" disabled>${qIndex===quiz.length-1?'See Results →':'Next Question →'}</button>
      </div>
    </div>`;
  document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', chooseAnswer));
  document.getElementById('qNext').onclick = nextQuestion;
  document.getElementById('lessonBtn').onclick = () => { slideIndex = slides.length-1; renderSlide(); };
}

function chooseAnswer(e) {
  if(answered) return;
  answered = true;
  const item = quiz[qIndex];
  const chosen = Number(e.currentTarget.dataset.i);
  const buttons = [...document.querySelectorAll('.choice')];
  buttons.forEach(b => b.disabled = true);
  buttons[item.answer].classList.add('correct');
  const fb = document.getElementById('feedback');
  const letters = ['A','B','C','D'];
  if(chosen === item.answer) {
    score++;
    fb.className = 'feedback good';
    fb.innerHTML = `✅ Correct! <br><span>${item.explain}</span>`;
  } else {
    e.currentTarget.classList.add('incorrect');
    misses[item.topic] = (misses[item.topic] || 0) + 1;
    fb.className = 'feedback bad';
    fb.innerHTML = `❌ Incorrect. Correct answer: <b>${letters[item.answer]}. ${item.choices[item.answer]}</b><br><span>${item.explain}</span>`;
  }
  document.getElementById('qNext').disabled = false;
}

function nextQuestion() {
  if(!answered) return;
  if(qIndex < quiz.length-1) {
    qIndex++;
    renderQuestion();
  } else {
    renderResults();
  }
}

function renderResults() {
  const pct = Math.round((score/quiz.length)*100);
  setProgress('Quiz Complete', 100, 'Results');
  const topics = Object.entries(misses).sort((a,b)=>b[1]-a[1]);
  let topicHtml = topics.length
    ? topics.map(([t,n]) => `<div class="review-topic">📌 ${t} — missed ${n} question${n>1?'s':''}</div>`).join('')
    : `<div class="review-topic">🌟 No major weak topic found. Review the Final 2-Minute Review once more before the test.</div>`;
  card.innerHTML = `
    <div class="slide-in" style="height:100%;display:flex;flex-direction:column">
      <div class="slide-head">
        <div class="kicker">Quiz Results</div>
        <h1>Great Work!</h1>
        <div class="subtitle">Use the review topics below to study smarter.</div>
      </div>
      <div class="slide-body">
        <div class="result-box">
          <div class="score-ring" style="--pct:${pct}%"><span>${score} / ${quiz.length}</span></div>
          <div class="big-line"><strong>${pct}%</strong></div>
          <h2>Topics to Review</h2>
          <div class="review-topics">${topicHtml}</div>
          <div class="source-note">This tutor uses only the supplied Lesson 2 study material and teacher-provided vocabulary/summary.</div>
        </div>
      </div>
      <div class="controls">
        <button class="navbtn secondary" id="reviewAgain" type="button">← Review Lesson</button>
        <button class="navbtn primary" id="retryQuiz" type="button">Retry Quiz ↻</button>
      </div>
    </div>`;
  document.getElementById('reviewAgain').onclick = () => { slideIndex = 0; renderSlide(); };
  document.getElementById('retryQuiz').onclick = startQuiz;
}

function restartTutor() {
  slideIndex = 0;
  qIndex = 0;
  score = 0;
  answered = false;
  misses = {};
  renderSlide();
}

document.getElementById('restartTop').addEventListener('click', restartTutor);
document.addEventListener('keydown', (e) => {
  if(sectionLabel.textContent === 'Teaching Slides') {
    if(e.key === 'ArrowRight') document.getElementById('nextBtn')?.click();
    if(e.key === 'ArrowLeft') document.getElementById('backBtn')?.click();
  }
});
renderSlide();
</script>
</body>
</html>
