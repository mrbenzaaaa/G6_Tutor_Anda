  <main><section class="panel" id="content" aria-live="polite"><div class="eyebrow">Grade 6 Health • Lesson 3</div><h1>Family Relationships</h1><div class="big">Family members support one another.</div><p class="lead">Tap <strong>Next</strong> to begin.</p><div class="tip"><strong>⭐ Remember:</strong> Strong families support and care for their members.</div></section></main>

const slides=[
{body:`<div class="eyebrow">Grade 6 Health • Lesson 3</div><h1>Family Relationships</h1><div class="big">Family members support one another.</div><p class="lead">Learn how families meet needs, share roles, handle change, build strong relationships, and get help with serious problems.</p>`,remember:"Strong families support and care for their members."},
{body:`<h2>What You Must Know</h2><div class="grid"><div class="card"><h3>Family</h3><p>Understand relationships, family types, and how families meet needs.</p></div><div class="card purple"><h3>Roles</h3><p>Know the responsibilities of adults and children.</p></div><div class="card green"><h3>Strong Relationships</h3><p>Learn seven guidelines that build trust, respect, and connection.</p></div><div class="card yellow"><h3>Change and Problems</h3><p>Know healthy ways to cope and when outside help may be needed.</p></div></div>`,remember:"Family needs + roles + strong relationships + help."},
{body:`<h2>Relationships and Family</h2><p><span class="term">Relationships</span> are the connections you have with other people and groups in your life.</p><p><span class="term">Family</span> is the basic unit of society. It includes two or more people joined by blood, marriage, adoption, or a desire to support each other.</p><div class="flow"><div class="step">Family relationships</div><div class="arr">→</div><div class="step">Values and beliefs</div><div class="arr">→</div><div class="step">How you relate to others</div></div>`,remember:"Family is an important relationship and a major influence."},
{body:`<h2>Extended Family</h2><div class="grid"><div class="card"><h3>Immediate Family</h3><p>The lesson uses this as the family at the center of the extended family.</p></div><div class="card purple"><h3>Extended Family</h3><p>A person's immediate family plus other relatives such as grandparents, aunts, uncles, and cousins.</p></div></div><p>In some cultures, it is common for many members of a family to live together.</p>`,remember:"Extended family = immediate family + other relatives."},
{body:`<h2>Families Meet Needs</h2><p>The main job of a family is to meet the needs of its members.</p><div class="grid three"><div class="card"><h3>Basic Needs</h3><p>Food, clothing, and shelter.</p></div><div class="card green"><h3>Support</h3><p>Support and comfort.</p></div><div class="card yellow"><h3>Life Skills</h3><p>Making connections, communicating, facing challenges, self-control, focus, and critical thinking.</p></div></div><p><span class="term">Nurture</span> means to fulfill physical, mental, emotional, and social needs.</p>`,remember:"Families provide needs, support, comfort, and life skills."},
{body:`<h2>Nurturing the Health Triangle</h2><div class="grid three"><div class="card"><h3>Physical Health</h3><p>Families provide food, clothing, and shelter.</p></div><div class="card purple"><h3>Mental/Emotional Health</h3><p>Family members give love, acceptance, and support and pass along traditions, values, and beliefs.</p></div><div class="card green"><h3>Social Health</h3><p>Families teach members how to get along with each other and people outside the family.</p></div></div>`,remember:"A healthy family nurtures every side of the health triangle."},
{body:`<h2>Character, Values, and Beliefs</h2><p>Family culture, traditions, and religious beliefs may influence your character, values, and beliefs.</p><div class="flow"><div class="step">Family influence</div><div class="arr">→</div><div class="step">Choices and treatment of others</div><div class="arr">→</div><div class="step">Health habits</div></div><p>Values and beliefs can help a person choose not to participate in risky behaviors such as using tobacco, alcohol, or drugs.</p>`,remember:"Family values and beliefs can guide lifelong decisions."},
{body:`<h2>Roles and Responsibilities</h2><p>A <span class="term">role</span> is a part you play when you interact with another person. Each role has responsibilities.</p><div class="grid"><div class="card"><h3>Parents and Other Adults</h3><p>Meet the family's basic needs and teach and model good health and communication skills.</p></div><div class="card purple"><h3>Children</h3><p>Follow family rules, learn good communication skills, and show respect and appreciation by accepting or sharing responsibility.</p></div></div>`,remember:"Every family member has a unique role and responsibilities."},
{body:`<h2>Responsibilities Can Change</h2><p>As children get older, they take on more responsibilities.</p><ul class="bullets"><li>Help older family members.</li><li>Watch younger siblings.</li><li>Finish household tasks.</li><li>Help more when parents are busy.</li></ul><p>Each new responsibility is an opportunity to learn a skill and show respect, love, and support.</p>`,remember:"Growing older often means accepting more responsibility."},
{body:`<h2>Building Strong Families — Part 1</h2><div class="checks"><div class="check"><span class="tick">✓</span><div><strong>Support others.</strong><br><span class="mini">Support adds meaning to success and helps during failure.</span></div></div><div class="check"><span class="tick">✓</span><div><strong>Show appreciation.</strong><br><span class="mini">Say thank you or help with tasks.</span></div></div><div class="check"><span class="tick">✓</span><div><strong>Follow family rules.</strong><br><span class="mini">This builds trust and respect.</span></div></div></div>`,remember:"Support + appreciation + rules help families grow stronger."},
{body:`<h2>Building Strong Families — Part 2</h2><div class="checks"><div class="check"><span class="tick">✓</span><div><strong>Spend quality time together.</strong></div></div><div class="check"><span class="tick">✓</span><div><strong>Use good communication skills.</strong></div></div><div class="check"><span class="tick">✓</span><div><strong>Show and share responsibility.</strong></div></div><div class="check"><span class="tick">✓</span><div><strong>Show respect.</strong></div></div></div><p>Open communication helps solve problems and disagreements and develops trust and respect.</p>`,remember:"Time + communication + responsibility + respect build connection."},
{body:`<h2>Changes in the Family</h2><p>Changes and challenges affect every family. Strong relationships make change easier to handle.</p><div class="grid"><div class="card"><h3>Changing Responsibilities</h3><p>As children grow, they may accept new family duties.</p></div><div class="card purple"><h3>Permanent Changes</h3><p>The birth of a baby, marital separation, joining a blended family, and divorce change family structure and require adjustment.</p></div></div>`,remember:"Family change often requires time and adjustment."},
{body:`<h2>Positive Ways to Cope</h2><div class="table-wrap"><table class="table"><thead><tr><th>Change</th><th>Positive Way to Cope</th></tr></thead><tbody><tr><td>Moving</td><td>Study the new neighborhood and try to meet other teens.</td></tr><tr><td>Separation, divorce, or remarriage</td><td>Talk to parents or another trusted adult; remember it is not your fault.</td></tr><tr><td>Job change or loss</td><td>Ask how you can help if spending must be limited.</td></tr><tr><td>New sibling</td><td>Spend time together and ask parents how to help.</td></tr><tr><td>Illness or injury</td><td>Spend time with the person and ask how to help.</td></tr><tr><td>Death, loss, and grief</td><td>Accept that family members may cope in different ways.</td></tr></tbody></table></div>`,remember:"Different changes need different positive coping actions."},
{body:`<h2>Talking Through Change</h2><p>Family change may cause worry, stress, or sadness. Communicate openly and truthfully about your feelings.</p><div class="flow"><div class="step">Share feelings</div><div class="arr">→</div><div class="step">Explore solutions</div><div class="arr">→</div><div class="step">Ask for help if needed</div></div><p>Possible outside helpers named in the lesson include family counselors, health care workers, religious leaders, lawyers, and law enforcement.</p>`,remember:"Open communication helps families explore solutions."},
{body:`<h2>Serious Family Problems</h2><p>Some problems require outside help. Drug or alcohol addiction is serious: even when one member is addicted, the whole family suffers.</p><div class="card red"><h3>Outside Help</h3><p>Serious family problems may need help from counselors, police, or other authorities.</p></div>`,remember:"A serious problem can affect the whole family and may need help."},
{body:`<h2>What Is Abuse?</h2><p><span class="term">Abuse</span> is the physical, emotional, or mental mistreatment of another person. It can affect children or adults.</p><div class="grid"><div class="card red"><h3>Physical Abuse</h3><p>The use of physical force, such as hitting or pushing.</p></div><div class="card yellow"><h3>Emotional Abuse</h3><p>Always yelling at or putting down another person. It can damage self-esteem.</p></div></div>`,remember:"Abuse is mistreatment and may be physical, emotional, or mental."},
{body:`<h2>Sexual Abuse and Neglect</h2><div class="grid"><div class="card red"><h3>Sexual Abuse</h3><p>Sexual contact forced upon another person. It includes unwanted forced sexual activity and showing sexual materials to a child.</p></div><div class="card yellow"><h3>Neglect</h3><p>Failure to provide for the basic physical and emotional needs of a dependent.</p></div></div><p><strong>Physical neglect</strong> can include not providing food, shelter, clothing, or medical care. <strong>Emotional neglect</strong> means not giving love and respect.</p>`,remember:"Neglect means failing to provide basic physical or emotional needs."},
{body:`<h2>Getting Help</h2><div class="big">All forms of abuse and neglect are against the law.</div><p>Anyone who feels abused or neglected must find someone who can help.</p><div class="grid three"><div class="card"><h3>Trusted Adult</h3><p>Start by talking to another trusted adult.</p></div><div class="card purple"><h3>At School</h3><p>Talk to a teacher or school counselor.</p></div><div class="card green"><h3>Medical Help</h3><p>Talk to a medical professional.</p></div></div>`,remember:"Abuse or neglect must not stay secret—find someone who can help."},
{body:`<h2>Vocabulary Review 1</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>relationships</strong></td><td>Connections with other people and groups in your life.</td><td>Connections with others.</td></tr><tr><td><strong>family</strong></td><td>Two or more people joined by blood, marriage, adoption, or a desire to support each other.</td><td>People joined by connection and support.</td></tr><tr><td><strong>extended family</strong></td><td>Immediate family plus relatives such as grandparents, aunts, uncles, and cousins.</td><td>Family extends to other relatives.</td></tr><tr><td><strong>nurture</strong></td><td>Fulfill physical, mental, emotional, and social needs.</td><td>Meet needs on every side.</td></tr><tr><td><strong>role</strong></td><td>A part you play when interacting with another person.</td><td>Your part in an interaction.</td></tr></tbody></table></div>`,remember:"Connect each word to the job it describes."},
{body:`<h2>Vocabulary Review 2</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>abuse</strong></td><td>Physical, emotional, or mental mistreatment of another person.</td><td>Abuse = mistreatment.</td></tr><tr><td><strong>physical abuse</strong></td><td>Use of physical force, such as hitting or pushing.</td><td>Physical force.</td></tr><tr><td><strong>sexual abuse</strong></td><td>Sexual contact forced upon another person.</td><td>Forced and unwanted.</td></tr><tr><td><strong>neglect</strong></td><td>Failure to provide basic physical and emotional needs of a dependent.</td><td>Needed care is not provided.</td></tr></tbody></table></div>`,remember:"Abuse mistreats; neglect fails to provide care."},
{body:`<h2>Final 4-Minute Review</h2><div class="checks"><div class="check"><span class="tick">✓</span><div>Family members support one another and meet needs.</div></div><div class="check"><span class="tick">✓</span><div>Nurture covers physical, mental/emotional, and social needs.</div></div><div class="check"><span class="tick">✓</span><div>Every role has responsibilities, and roles can change.</div></div><div class="check"><span class="tick">✓</span><div>Strong families use support, appreciation, rules, time, communication, responsibility, and respect.</div></div><div class="check"><span class="tick">✓</span><div>Family change may require adjustment and open communication.</div></div><div class="check"><span class="tick">✓</span><div>Addiction, abuse, and neglect may require outside help.</div></div><div class="check"><span class="tick">✓</span><div>Physical abuse uses force; emotional abuse damages through yelling or put-downs.</div></div><div class="check"><span class="tick">✓</span><div>A person experiencing abuse or neglect must find someone who can help.</div></div></div>`,remember:"Support, responsibility, communication, and help protect family health."},
{body:`<h2>Lesson 3 Review — Answers</h2><div class="review-grid"><div class="qa"><b>1. Define neglect.</b><br>Failure to provide the basic physical and emotional needs of a dependent.</div><div class="qa"><b>2. Three ways to build strong relationships?</b><br>Support family members, show appreciation, and follow family rules.</div><div class="qa"><b>3. Problems that may need outside help?</b><br>Drug or alcohol addiction, abuse, and neglect.</div><div class="qa"><b>4. Use good communication with family.</b><br>Talk openly, share feelings truthfully, use a respectful tone, and help solve disagreements.</div><div class="qa"><b>5. Nurture vs. neglect?</b><br>Nurture fulfills needs; neglect fails to provide basic physical and emotional needs.</div><div class="qa"><b>6. Show concern for a withdrawn friend.</b><br>Say you are concerned, listen, and help the friend talk to a trusted adult, teacher, counselor, or medical professional.</div></div>`,remember:"Review these six answers, then begin the quiz."}
];

const questions=[

{q:"Which is a responsibility of children named in the lesson?",c:["Provide every basic family need","Follow family rules and show respect","Make every family decision","Give professional counseling"],a:1,e:"Children follow rules, learn communication, and show respect and appreciation.",t:"Roles and responsibilities"},
{q:"What often happens as children get older?",c:["Their family roles never change","They need fewer life skills","They take on more responsibilities","They stop helping younger siblings"],a:2,e:"The lesson says older children take on more responsibilities.",t:"Roles and responsibilities"},
{q:"Why does following family rules help a family?",c:["It removes every challenge","It prevents all change","It gives one person all the power","It builds trust and respect"],a:3,e:"Following home rules builds trust and respect.",t:"Building strong families"},
{q:"Which is one guideline for building strong family relationships?",c:["Support other family members","Keep all problems secret","Ignore different opinions","Wait to be asked before every chore"],a:0,e:"Supporting family members is one of the lesson's guidelines.",t:"Building strong families"},
{q:"What can open communication help family members do?",c:["Avoid every responsibility","Solve problems and disagreements","Stop all permanent change","Remove family rules"],a:1,e:"Talking openly helps solve problems and disagreements.",t:"Building strong families"},
{q:"Which change affects family structure and needs adjustment?",c:["Finishing a household task","Having dinner together","The birth of a baby","Saying thank you"],a:2,e:"The birth of a baby is listed as a permanent family change.",t:"Family change"},
{q:"What is a positive way to cope with moving?",c:["Avoid learning about the new area","Keep feelings from the family","Refuse to meet anyone","Look at a map and try to meet other teens"],a:3,e:"The lesson suggests learning the neighborhood and meeting other teens.",t:"Coping with change"},
{q:"What should a child remember about a parent's separation or divorce?",c:["It is not the child's fault","The child must solve it alone","No trusted adult can help","Family feelings should not be discussed"],a:0,e:"The coping table clearly says the separation or divorce is not your fault.",t:"Coping with change"},
{q:"How should family members respond to different ways of grieving?",c:["Require everyone to cope the same way","Accept that people may express grief differently","Avoid younger family members","Stop communicating about loss"],a:1,e:"The lesson says not to expect everyone to cope in the same way.",t:"Coping with change"},
{q:"What should families do when change causes worry, stress, or sadness?",c:["Hide all feelings","Let one member decide everything","Communicate openly and truthfully","Ignore the family issue"],a:2,e:"Open and truthful communication helps families explore solutions.",t:"Family change"},
{q:"Which helper is named in the lesson for serious family change?",c:["A sports referee","A store manager","A class leader","A family counselor"],a:3,e:"Family counselors are specially trained to help families work through issues.",t:"Getting help"},
{q:"Why can one person's drug or alcohol addiction affect the whole family?",c:["The whole family suffers and may need outside help","It changes everyone into an extended family","It gives children fewer responsibilities","It always causes a move"],a:0,e:"The lesson states that the whole family suffers even when one member is addicted.",t:"Serious family problems"},
{q:"What is abuse?",c:["A change that needs adjustment","Physical, emotional, or mental mistreatment of another person","A family member's unique role","A way to share responsibility"],a:1,e:"That is the lesson's definition of abuse.",t:"Abuse and neglect"},
{q:"Which action is an example of physical abuse from the lesson?",c:["Spending quality time","Sharing a responsibility","Hitting or pushing","Speaking in a respectful tone"],a:2,e:"Physical abuse is the use of physical force, such as hitting or pushing.",t:"Abuse and neglect"},
{q:"What can emotional abuse damage?",c:["A family map","A person's role","An extended family","A person's self-esteem"],a:3,e:"The lesson says repeated yelling or put-downs can damage self-esteem.",t:"Abuse and neglect"},
{q:"What is sexual abuse?",c:["Sexual contact forced upon another person","A disagreement about family rules","Failure to finish a chore","A family structure change"],a:0,e:"The lesson defines sexual abuse as forced sexual contact.",t:"Abuse and neglect"},
{q:"What is neglect?",c:["Taking on a new responsibility","Failure to provide basic physical and emotional needs of a dependent","Using physical force","A family moving to a new home"],a:1,e:"Neglect means required physical and emotional care is not provided.",t:"Abuse and neglect"},
{q:"A parent does not provide needed food, shelter, clothing, or medical care. What is this?",c:["Emotional support","Nurture","Physical neglect","A family role"],a:2,e:"Those missing necessities are examples of physical neglect.",t:"Abuse and neglect"},
{q:"A family member always yells at and puts down another person. What does the lesson call this?",c:["Physical nurture","Shared responsibility","Positive coping","Emotional abuse"],a:3,e:"Repeated yelling and put-downs are described as emotional abuse.",t:"Abuse and neglect"},
{q:"Which comparison is correct?",c:["Nurture fulfills needs; neglect fails to provide basic needs","Nurture and neglect both meet needs","Neglect means spending quality time","Nurture means using physical force"],a:0,e:"Nurture meets needs, while neglect fails to provide needed care.",t:"Easy-to-confuse points"},
{q:"A friend seems unusually sad, quiet, and withdrawn because of a possible problem at home. What should you do based on the lesson?",c:["Promise to keep every problem secret","Show concern and help the friend talk to a trusted adult, teacher, counselor, or medical professional","Tell the friend to solve it alone","Ignore the change in behavior"],a:1,e:"The lesson says help can begin by talking to a trusted adult or trained helper.",t:"Getting help"}
];

const state={mode:"lesson",slide:0,question:0,score:0,answered:false,answers:[]};
const el={content:document.getElementById("content"),section:document.getElementById("sectionLabel"),progressText:document.getElementById("progressText"),bar:document.getElementById("progressBar"),score:document.getElementById("scorePill"),lessonControls:document.getElementById("lessonControls"),quizControls:document.getElementById("quizControls"),back:document.getElementById("backBtn"),next:document.getElementById("nextBtn"),restart:document.getElementById("restartBtn"),returnLesson:document.getElementById("returnLessonBtn"),nextQuestion:document.getElementById("nextQuestionBtn")};
function renderSlide(){state.mode="lesson";const s=slides[state.slide];el.content.innerHTML=s.body+`<div class="tip"><strong>⭐ Remember:</strong> ${s.remember}</div>`;el.section.textContent=state.slide===slides.length-1?"Lesson Review":"Teaching Slides";el.progressText.textContent=`Slide ${state.slide+1} of ${slides.length}`;el.bar.style.width=`${(state.slide+1)/slides.length*100}%`;el.score.classList.add("hidden");el.lessonControls.classList.remove("hidden");el.quizControls.classList.add("hidden");el.back.disabled=state.slide===0;el.next.textContent=state.slide===slides.length-1?"Start Quiz →":"Next →";window.scrollTo({top:0,behavior:"auto"})}
function startQuiz(reset=true){state.mode="quiz";if(reset){state.question=0;state.score=0;state.answers=[]}state.answered=false;el.lessonControls.classList.add("hidden");el.quizControls.classList.remove("hidden");el.score.classList.remove("hidden");renderQuestion()}
function renderQuestion(){const item=questions[state.question],level=state.question<10?"Easy":state.question<20?"Medium":"Hard";el.section.textContent="30-Question Quiz";el.progressText.textContent=`Question ${state.question+1} of ${questions.length}`;el.bar.style.width=`${(state.question+1)/questions.length*100}%`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.classList.add("hidden");el.content.innerHTML=`<div class="quiz-head"><span class="tag">Question ${state.question+1} of ${questions.length}</span><span class="difficulty ${level.toLowerCase()}">${level}</span></div><div class="question">${item.q}</div><div class="choices">${item.c.map((x,i)=>`<button class="choice" type="button" data-choice="${i}"><span class="letter">${"ABCD"[i]}</span><span>${x}</span></button>`).join("")}</div><div class="feedback" id="feedback" aria-live="assertive"></div>`;el.content.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",chooseAnswer,{once:true}));window.scrollTo({top:0,behavior:"auto"})}
function chooseAnswer(event){if(state.answered)return;state.answered=true;const selected=Number(event.currentTarget.dataset.choice),item=questions[state.question],correct=selected===item.a;if(correct)state.score++;state.answers[state.question]={selected,correct};[...el.content.querySelectorAll(".choice")].forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add("correct");if(i===selected&&!correct)b.classList.add("wrong")});const f=document.getElementById("feedback");f.className=`feedback show ${correct?"ok":"no"}`;f.innerHTML=`<strong>${correct?"✅ Correct":"❌ Incorrect"}</strong><br>Correct answer: ${"ABCD"[item.a]}. ${item.c[item.a]}<br><span class="mini">${item.e}</span>`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.textContent=state.question===questions.length-1?"See Results →":"Next Question →";el.nextQuestion.classList.remove("hidden")}
function goNextQuestion(){if(!state.answered)return;if(state.question<questions.length-1){state.question++;state.answered=false;renderQuestion()}else renderResults()}
function renderResults(){state.mode="results";const percent=Math.round(state.score/questions.length*100),missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct),counts={};missed.forEach(x=>counts[x.q.t]=(counts[x.q.t]||0)+1);const topics=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),message=percent>=90?"Excellent work!":percent>=75?"Good job! Review a few topics.":percent>=60?"Nice effort. Review your missed topics.":"Keep practicing. Review the lesson and try again.";el.section.textContent="Quiz Results";el.progressText.textContent="Complete";el.bar.style.width="100%";el.score.textContent=`Score: ${state.score}`;el.content.innerHTML=`<div class="eyebrow">Quiz Complete</div><h2>${message}</h2><div class="result-score">${state.score}/30</div><div class="result-grid"><div class="result-card"><strong>${percent}%</strong>Percentage</div><div class="result-card"><strong>${state.score}</strong>Correct</div><div class="result-card"><strong>${30-state.score}</strong>Incorrect</div></div><div class="card yellow"><h3>Topics to Review</h3><p>${topics.length?topics.map(t=>`<span class="tag">${t}</span>`).join(" "):"No topics — every answer was correct!"}</p></div><div class="group" style="margin-top:18px"><button class="btn primary" id="reviewMistakes" ${missed.length?"":"disabled"}>Review Mistakes</button><button class="btn secondary" id="tryAgain">Try Quiz Again</button><button class="btn secondary" id="resultLesson">Return to Lesson</button><button class="btn restart" id="restartAll">Restart Everything</button></div>`;el.quizControls.classList.add("hidden");document.getElementById("reviewMistakes").addEventListener("click",renderMistakes,{once:true});document.getElementById("tryAgain").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("resultLesson").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});document.getElementById("restartAll").addEventListener("click",restartAll,{once:true});window.scrollTo({top:0,behavior:"auto"})}
function renderMistakes(){const missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct);el.section.textContent="Review Mistakes";el.content.innerHTML=`<h2>Review Mistakes</h2><p class="lead">Questions missed: ${missed.map(x=>x.i+1).join(", ")}</p><div class="mistakes">${missed.map(x=>`<div class="mistake"><strong>Question ${x.i+1}: ${x.q.q}</strong><br><span class="mini">Correct answer: ${"ABCD"[x.q.a]}. ${x.q.c[x.q.a]} — ${x.q.e}</span></div>`).join("")}</div><div class="group" style="margin-top:18px"><button class="btn primary" id="againFromMistakes">Try Quiz Again</button><button class="btn secondary" id="lessonFromMistakes">Return to Lesson</button></div>`;document.getElementById("againFromMistakes").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("lessonFromMistakes").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});window.scrollTo({top:0,behavior:"auto"})}
function restartAll(){state.slide=0;state.question=0;state.score=0;state.answered=false;state.answers=[];renderSlide()}
function showError(error){el.content.innerHTML=`<div class="error"><h2>Something went wrong</h2><p>Please use Restart.</p><p class="mini">${String(error&&error.message?error.message:error)}</p></div>`;console.error(error)}
function init(){try{el.back.addEventListener("click",()=>{if(state.slide>0){state.slide--;renderSlide()}});el.next.addEventListener("click",()=>{if(state.slide<slides.length-1){state.slide++;renderSlide()}else startQuiz(true)});el.restart.addEventListener("click",restartAll);el.returnLesson.addEventListener("click",()=>{state.slide=slides.length-1;renderSlide()});el.nextQuestion.addEventListener("click",goNextQuestion);document.addEventListener("keydown",e=>{if(state.mode!=="lesson")return;if(e.key==="ArrowLeft"&&state.slide>0){state.slide--;renderSlide()}if(e.key==="ArrowRight"&&state.slide<slides.length-1){state.slide++;renderSlide()}});renderSlide()}catch(error){showError(error)}}
document.addEventListener("DOMContentLoaded",init,{once:true});window.addEventListener("error",e=>showError(e.error||e.message),{once:true});
</script>
