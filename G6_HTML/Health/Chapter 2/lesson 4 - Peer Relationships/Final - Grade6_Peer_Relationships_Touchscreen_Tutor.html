<body><div class="app"><header class="topbar"><div class="brand">🤝 Peer Relationships</div><div class="progress-wrap"><div class="progress-label"><span id="sectionLabel">Teaching Slides</span><span id="progressText">Slide 1</span></div><div class="progress"><span id="progressBar"></span></div></div><div class="score hidden" id="scorePill">Score: 0</div></header><main><section class="panel" id="content" aria-live="polite"><div class="eyebrow">Grade 6 Health • Lesson 4</div><h1>Peer Relationships</h1><div class="big">Strong relationships can positively affect physical, mental/emotional, and social health.</div><p class="lead">Tap <strong>Next</strong> to begin.</p><div class="tip"><strong>⭐ Remember:</strong> Healthy peer relationships can support every side of health.</div></section></main><nav class="controls" id="lessonControls"><div class="group"><button class="btn secondary" id="backBtn" type="button">← Back</button><button class="btn restart" id="restartBtn" type="button">↻ Restart</button></div><button class="btn primary" id="nextBtn" type="button">Next →</button></nav><nav class="controls hidden" id="quizControls"><button class="btn secondary" id="returnLessonBtn" type="button">← Return to Lesson</button><button class="btn primary hidden" id="nextQuestionBtn" type="button">Next Question →</button></nav></div><noscript><div class="error"><strong>JavaScript is turned off.</strong> Please enable it to use this lesson.</div></noscript>
<script>
"use strict";
const slides=[
{body:`<div class="eyebrow">Grade 6 Health • Lesson 4</div><h1>Peer Relationships</h1><div class="big">Strong relationships can positively affect physical, mental/emotional, and social health.</div><p class="lead">Learn about peers, friendship qualities, peer pressure, and ways to make safe choices.</p>`,remember:"Healthy peer relationships can support every side of health."},
{body:`<h2>What You Must Know</h2><div class="grid"><div class="card"><h3>Peers and Friends</h3><p>Know who peers and acquaintances are and how friendships are different.</p></div><div class="card green"><h3>Strong Friendships</h3><p>Learn the qualities and actions that build trust and respect.</p></div><div class="card yellow"><h3>Peer Pressure</h3><p>Compare direct, indirect, positive, and negative peer pressure.</p></div><div class="card red"><h3>Safe Responses</h3><p>Use H.E.L.P. and resistance skills when pressure is harmful.</p></div></div>`,remember:"Peers → friendships → pressure → choices."},
{body:`<h2>Who Are Your Peers?</h2><p><span class="term">Peers</span> are people close to you in age who are a lot like you.</p><p>Your peer group includes people close in age who have things in common with you.</p><div class="grid three"><div class="card"><h3>School</h3><p>Friends and classmates</p></div><div class="card green"><h3>Activities</h3><p>Teammates and other teens</p></div><div class="card yellow"><h3>Community</h3><p>Neighbors and teens with shared causes</p></div></div>`,remember:"Peers are close in age and share something with you."},
{body:`<h2>Acquaintances and Other Peers</h2><p>An <span class="term">acquaintance</span> is someone you see occasionally or know casually. An acquaintance may later become a friend.</p><p>A peer can even be someone you have never met if you share something in common, such as volunteering for the same national agency.</p><div class="flow"><div class="step">Acquaintance</div><div class="arr">→</div><div class="step">More time and trust</div><div class="arr">→</div><div class="step">Possible friendship</div></div>`,remember:"An acquaintance is known casually; a friend is a chosen relationship."},
{body:`<h2>Influences on Friendships</h2><p>Family is a major influence on health and relationships. Teens may learn how to behave in relationships by watching others.</p><ul class="bullets"><li>Family influences who you choose as friends.</li><li>Family influences how you behave with friends.</li><li>People who respect themselves will probably respect friends.</li><li>Self-respect can support good choices that avoid health and other risks.</li></ul>`,remember:"Family examples can shape friendship choices and behavior."},
{body:`<h2>Peers, Acquaintances, and Friends</h2><p><span class="term">Friendships</span> are relationships with people you know, trust, and regard with affection.</p><div class="table-wrap"><table class="table"><thead><tr><th>Term</th><th>Key Idea</th></tr></thead><tbody><tr><td><strong>Peers</strong></td><td>People close in age with things in common.</td></tr><tr><td><strong>Acquaintances</strong></td><td>People you see occasionally or know casually.</td></tr><tr><td><strong>Friends</strong></td><td>Relationships you choose; often based on shared interests or values.</td></tr></tbody></table></div><p>Friends are important to social health and growth.</p>`,remember:"Peers are around you; friendships are relationships you choose."},
{body:`<h2>What Makes a Good Friend?</h2><p>Strong friendships usually grow stronger with time.</p><div class="checks"><div class="check"><span class="tick">✓</span><div>Shared values</div></div><div class="check"><span class="tick">✓</span><div>Reliability</div></div><div class="check"><span class="tick">✓</span><div>Loyalty</div></div><div class="check"><span class="tick">✓</span><div>Sympathy and caring</div></div><div class="check"><span class="tick">✓</span><div>Trust and cooperation</div></div><div class="check"><span class="tick">✓</span><div>Respect</div></div></div>`,remember:"Good friendship qualities work both ways."},
{body:`<h2>Shared Values, Reliability, and Loyalty</h2><div class="grid three"><div class="card"><h3>Shared Values</h3><p>Friends may value the same qualities, interests, learning, or responsibilities.</p></div><div class="card green"><h3>Reliability</h3><p>Reliable friends do what they say they will do and do not talk negatively about each other.</p></div><div class="card yellow"><h3>Loyalty</h3><p><span class="term">Loyal</span> means faithful. Loyal friends honor each other's interests, values, beliefs, and differences.</p></div></div>`,remember:"Reliable friends keep their word; loyal friends are faithful."},
{body:`<h2>Sympathy, Caring, and Trust</h2><div class="grid three"><div class="card"><h3>Sympathy</h3><p>A <span class="term">sympathetic</span> friend is aware of how you may be feeling and respects your feelings.</p></div><div class="card green"><h3>Caring</h3><p>A caring friend listens and gives time and attention to you and your interests.</p></div><div class="card yellow"><h3>Trust</h3><p>Trust goes both ways and is proven through reliability and loyalty.</p></div></div>`,remember:"A good friend notices feelings, listens, and earns trust."},
{body:`<h2>Cooperation and Respect</h2><p><span class="term">Cooperation</span> means working together for the common good. Helping and offering support show that you care.</p><p>Good friends respect themselves, their families, school, friends, values, and differences.</p><div class="quote">Reliability + loyalty + sympathy + caring + trust → respect in action</div>`,remember:"Cooperation works together; respect values people and differences."},
{body:`<h2>Making New Friends</h2><div class="checks"><div class="check"><span class="tick">1</span><div><strong>Be yourself.</strong><br><span class="mini">Know your values, beliefs, and interests.</span></div></div><div class="check"><span class="tick">2</span><div><strong>Break the ice.</strong><br><span class="mini">Begin with a compliment or question.</span></div></div><div class="check"><span class="tick">3</span><div><strong>Find shared interests.</strong><br><span class="mini">Join a club, team, or community group.</span></div></div><div class="check"><span class="tick">4</span><div><strong>Support a cause.</strong><br><span class="mini">Meet people who share your values while helping the community.</span></div></div></div>`,remember:"Be yourself, start talking, and look for shared interests."},
{body:`<h2>Strengthening Friendships — Part 1</h2><div class="grid three"><div class="card"><h3>Spend Time Together</h3><p>Share homework, interests, sports, or projects.</p></div><div class="card green"><h3>Communicate Openly</h3><p>Open and honest communication builds trust and respect.</p></div><div class="card yellow"><h3>Help in Hard Times</h3><p>Give time, sympathy, care, and support when a friend has a problem.</p></div></div>`,remember:"Time + honest communication + support strengthen friendship."},
{body:`<h2>Strengthening Friendships — Part 2</h2><ul class="bullets"><li><strong>Respect differences:</strong> be accepting of customs and cultures different from your own.</li><li><strong>Encourage goals:</strong> give time, attention, and support.</li><li><strong>Identify problems:</strong> discuss them and show interest in finding a solution.</li><li><strong>Communicate well:</strong> think first, listen, and be honest about feelings and opinions.</li></ul>`,remember:"Respect differences and solve problems together."},
{body:`<h2>Equality and Power</h2><div class="grid"><div class="card green"><h3>Strong Friendship</h3><p>Friends are equal. One friend does not use age, economic status, or position to influence another against their values.</p></div><div class="card red"><h3>Unequal Friendship</h3><p>Power differences may come from age, life experience, economic or social status, or a higher position.</p></div></div>`,remember:"A strong friendship is equal and respects values."},
{body:`<h2>What Is Peer Pressure?</h2><p><span class="term">Peer pressure</span> is the influence that your peer group has on you.</p><div class="grid"><div class="card"><h3>Indirect</h3><p>No one tells you what to do, but you want something because you see peers doing or wearing it.</p></div><div class="card yellow"><h3>Direct</h3><p>A peer tells you what you should do to fit in or be accepted.</p></div></div><p>You always have a choice to say no when you believe an action will be harmful.</p>`,remember:"Indirect = you observe; direct = someone tells or urges you."},
{body:`<h2>Positive Peer Pressure</h2><p>Positive peer pressure helps you make healthful choices.</p><div class="grid"><div class="card green"><h3>Dance Team</h3><p>A peer's positive suggestion may strengthen physical health and lead to new friends with a shared interest.</p></div><div class="card green"><h3>Food Bank</h3><p>Seeing peers enjoy volunteering may influence you to help others and make new friends.</p></div></div>`,remember:"Positive influence supports a healthful choice."},
{body:`<h2>Negative Peer Pressure</h2><p><span class="term">Negative peer pressure</span> is pressure to go along with harmful behaviors or beliefs of others your age.</p><ul class="bullets"><li>It may urge you to do something you disagree with or do not want to do.</li><li>It can include harmful or illegal actions, dares, threats, teasing, or name-calling.</li><li>Think about your values and the consequences.</li><li>True friends will respect your decision.</li></ul>`,remember:"Negative peer pressure pushes harmful choices or beliefs."},
{body:`<h2>Use the H.E.L.P. Guidelines</h2><p>Use H.E.L.P. to recognize negative peer pressure.</p><div class="grid"><div class="card green"><h3>H — Healthful</h3></div><div class="card"><h3>E — Ethical</h3></div><div class="card yellow"><h3>L — Legal</h3></div><div class="card green"><h3>P — Parent-approved</h3></div></div><p>If a suggested action does not meet the H.E.L.P. guidelines, you can refuse.</p>`,remember:"H.E.L.P. = Healthful, Ethical, Legal, Parent-approved."},
{body:`<h2>Resisting Negative Peer Pressure</h2><div class="checks"><div class="check"><span class="tick">1</span><div><strong>Avoid the situation.</strong><br><span class="mini">Do not join unsafe, harmful, or rule-breaking situations.</span></div></div><div class="check"><span class="tick">2</span><div><strong>Use an assertive response.</strong><br><span class="mini">Say no strongly and confidently.</span></div></div><div class="check"><span class="tick">3</span><div><strong>Focus on the issue.</strong><br><span class="mini">Give reasons and do not trade insults.</span></div></div><div class="check"><span class="tick">4</span><div><strong>Walk away.</strong><br><span class="mini">Try to talk first; leave if someone becomes angry.</span></div></div></div>`,remember:"Avoid → Assert → Focus → Walk away."},
{body:`<h2>Vocabulary Review 1</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>peers</strong></td><td>People close to you in age who are a lot like you.</td><td>Close in age.</td></tr><tr><td><strong>acquaintance</strong></td><td>Someone you see occasionally or know casually.</td><td>Known casually.</td></tr><tr><td><strong>friendships</strong></td><td>Relationships with people you know, trust, and regard with affection.</td><td>Know + trust + affection.</td></tr><tr><td><strong>loyal</strong></td><td>Faithful to friends.</td><td>Loyal = faithful.</td></tr><tr><td><strong>sympathetic</strong></td><td>Aware of how another person may be feeling.</td><td>Notice and respect feelings.</td></tr></tbody></table></div>`,remember:"Connect each friendship word to its key action."},
{body:`<h2>Vocabulary Review 2</h2><div class="table-wrap"><table class="table"><thead><tr><th>Word</th><th>Meaning from the Lesson</th><th>Memory Tip</th></tr></thead><tbody><tr><td><strong>cooperation</strong></td><td>Working together for the common good.</td><td>Work together.</td></tr><tr><td><strong>peer pressure</strong></td><td>The influence that your peer group has on you.</td><td>Peer influence.</td></tr><tr><td><strong>negative peer pressure</strong></td><td>Pressure to go along with harmful behaviors or beliefs of others your age.</td><td>Pressure toward harm.</td></tr><tr><td><strong>assertive response</strong></td><td>A response that declares your position strongly and confidently.</td><td>Strong and confident.</td></tr></tbody></table></div>`,remember:"Influence becomes safer when your response is strong and confident."},
{body:`<h2>Final 4-Minute Review</h2><div class="checks"><div class="check"><span class="tick">✓</span><div>Peers are close in age; acquaintances are known casually; friends are chosen relationships.</div></div><div class="check"><span class="tick">✓</span><div>Strong friendships value reliability, loyalty, sympathy, caring, trust, cooperation, and respect.</div></div><div class="check"><span class="tick">✓</span><div>Spend time, communicate honestly, help in hard times, respect differences, support goals, and solve problems.</div></div><div class="check"><span class="tick">✓</span><div>Strong friendships are equal and do not use power against values.</div></div><div class="check"><span class="tick">✓</span><div>Peer pressure may be direct or indirect and positive or negative.</div></div><div class="check"><span class="tick">✓</span><div>Use H.E.L.P. to check a choice.</div></div><div class="check"><span class="tick">✓</span><div>Resist negative pressure by avoiding, responding assertively, focusing on the issue, or walking away.</div></div><div class="check"><span class="tick">✓</span><div>True friends respect your decision.</div></div></div>`,remember:"Choose friends wisely, protect your values, and make healthful choices."},
{body:`<h2>Lesson 4 Review — Answers</h2><div class="review-grid"><div class="qa"><b>1. Define friendship.</b><br>A relationship with a person you know, trust, and regard with affection.</div><div class="qa"><b>2. Three ways to strengthen friendships?</b><br>Spend time together, communicate openly and honestly, and help each other through hard times.</div><div class="qa"><b>3. Define negative peer pressure and give an example.</b><br>Pressure to follow harmful behaviors or beliefs; examples include a harmful dare, threat, teasing, or name-calling.</div><div class="qa"><b>4. Positive and negative peer influences?</b><br>Positive: joining a dance team or volunteering. Negative: harmful or illegal actions, dares, threats, teasing, or name-calling.</div><div class="qa"><b>5. Power differences in close relationships?</b><br>Equal friends respect values and support goals. Unequal power may influence someone to act against their values.</div><div class="qa"><b>6. Do adults experience as much peer pressure as teens?</b><br>This information is not provided clearly in the study material. The lesson explains peer pressure among teens.</div></div>`,remember:"Review the six answers, then begin the quiz."}
];
const questions=[
{q:"Who are peers?",c:["Only close friends","People close in age who are a lot like you","Adults with higher positions","Only teammates"],a:1,e:"Peers are people close to you in age who are a lot like you.",t:"Peers and acquaintances"},
{q:"What is an acquaintance?",c:["A loyal friend","A person who pressures you","Someone you see occasionally or know casually","A family member"],a:2,e:"An acquaintance is known casually or seen occasionally.",t:"Peers and acquaintances"},
{q:"What are friendships?",c:["Relationships with people you know, trust, and regard with affection","Groups made only by age","Direct peer pressure","Relationships chosen by families"],a:0,e:"That is the lesson's definition of friendships.",t:"Friendships"},
{q:"Which statement best compares peers and friends?",c:["All peers are automatically close friends","Friends never share interests","Peers must live nearby","Peers are around you; friendships are relationships you choose"],a:3,e:"Peers may be around you, while friends are chosen relationships.",t:"Peers and acquaintances"},
{q:"What does loyal mean?",c:["Casual","Faithful","Powerful","Popular"],a:1,e:"The lesson defines loyal as faithful to friends.",t:"Friendship qualities"},
{q:"What does cooperation mean?",c:["Working together for the common good","Agreeing with every idea","Influencing a friend against values","Knowing someone casually"],a:0,e:"Cooperation is working together for the common good.",t:"Friendship qualities"},

const state={mode:"lesson",slide:0,question:0,score:0,answered:false,answers:[]};const el={content:document.getElementById("content"),section:document.getElementById("sectionLabel"),progressText:document.getElementById("progressText"),bar:document.getElementById("progressBar"),score:document.getElementById("scorePill"),lessonControls:document.getElementById("lessonControls"),quizControls:document.getElementById("quizControls"),back:document.getElementById("backBtn"),next:document.getElementById("nextBtn"),restart:document.getElementById("restartBtn"),returnLesson:document.getElementById("returnLessonBtn"),nextQuestion:document.getElementById("nextQuestionBtn")};
function renderSlide(){state.mode="lesson";const s=slides[state.slide];el.content.innerHTML=s.body+`<div class="tip"><strong>⭐ Remember:</strong> ${s.remember}</div>`;el.section.textContent=state.slide===slides.length-1?"Lesson Review":"Teaching Slides";el.progressText.textContent=`Slide ${state.slide+1} of ${slides.length}`;el.bar.style.width=`${(state.slide+1)/slides.length*100}%`;el.score.classList.add("hidden");el.lessonControls.classList.remove("hidden");el.quizControls.classList.add("hidden");el.back.disabled=state.slide===0;el.next.textContent=state.slide===slides.length-1?"Start Quiz →":"Next →";window.scrollTo({top:0,behavior:"auto"})}
function startQuiz(reset=true){state.mode="quiz";if(reset){state.question=0;state.score=0;state.answers=[]}state.answered=false;el.lessonControls.classList.add("hidden");el.quizControls.classList.remove("hidden");el.score.classList.remove("hidden");renderQuestion()}
function renderQuestion(){const item=questions[state.question],level=state.question<10?"Easy":state.question<20?"Medium":"Hard";el.section.textContent="30-Question Quiz";el.progressText.textContent=`Question ${state.question+1} of ${questions.length}`;el.bar.style.width=`${(state.question+1)/questions.length*100}%`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.classList.add("hidden");el.content.innerHTML=`<div class="quiz-head"><span class="tag">Question ${state.question+1} of ${questions.length}</span><span class="difficulty ${level.toLowerCase()}">${level}</span></div><div class="question">${item.q}</div><div class="choices">${item.c.map((x,i)=>`<button class="choice" type="button" data-choice="${i}"><span class="letter">${"ABCD"[i]}</span><span>${x}</span></button>`).join("")}</div><div class="feedback" id="feedback" aria-live="assertive"></div>`;el.content.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",chooseAnswer,{once:true}));window.scrollTo({top:0,behavior:"auto"})}
function chooseAnswer(event){if(state.answered)return;state.answered=true;const selected=Number(event.currentTarget.dataset.choice),item=questions[state.question],correct=selected===item.a;if(correct)state.score++;state.answers[state.question]={selected,correct};[...el.content.querySelectorAll(".choice")].forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add("correct");if(i===selected&&!correct)b.classList.add("wrong")});const f=document.getElementById("feedback");f.className=`feedback show ${correct?"ok":"no"}`;f.innerHTML=`<strong>${correct?"✅ Correct":"❌ Incorrect"}</strong><br>Correct answer: ${"ABCD"[item.a]}. ${item.c[item.a]}<br><span class="mini">${item.e}</span>`;el.score.textContent=`Score: ${state.score}`;el.nextQuestion.textContent=state.question===questions.length-1?"See Results →":"Next Question →";el.nextQuestion.classList.remove("hidden")}
function goNextQuestion(){if(!state.answered)return;if(state.question<questions.length-1){state.question++;state.answered=false;renderQuestion()}else renderResults()}
function renderResults(){state.mode="results";const percent=Math.round(state.score/questions.length*100),missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct),counts={};missed.forEach(x=>counts[x.q.t]=(counts[x.q.t]||0)+1);const topics=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),message=percent>=90?"Excellent work!":percent>=75?"Good job! Review a few topics.":percent>=60?"Nice effort. Review your missed topics.":"Keep practicing. Review the lesson and try again.";el.section.textContent="Quiz Results";el.progressText.textContent="Complete";el.bar.style.width="100%";el.score.textContent=`Score: ${state.score}`;el.content.innerHTML=`<div class="eyebrow">Quiz Complete</div><h2>${message}</h2><div class="result-score">${state.score}/30</div><div class="result-grid"><div class="result-card"><strong>${percent}%</strong>Percentage</div><div class="result-card"><strong>${state.score}</strong>Correct</div><div class="result-card"><strong>${30-state.score}</strong>Incorrect</div></div><div class="card yellow"><h3>Topics to Review</h3><p>${topics.length?topics.map(t=>`<span class="tag">${t}</span>`).join(" "):"No topics — every answer was correct!"}</p></div><div class="group" style="margin-top:18px"><button class="btn primary" id="reviewMistakes" ${missed.length?"":"disabled"}>Review Mistakes</button><button class="btn secondary" id="tryAgain">Try Quiz Again</button><button class="btn secondary" id="resultLesson">Return to Lesson</button><button class="btn restart" id="restartAll">Restart Everything</button></div>`;el.quizControls.classList.add("hidden");document.getElementById("reviewMistakes").addEventListener("click",renderMistakes,{once:true});document.getElementById("tryAgain").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("resultLesson").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});document.getElementById("restartAll").addEventListener("click",restartAll,{once:true});window.scrollTo({top:0,behavior:"auto"})}
function renderMistakes(){const missed=questions.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>!x.a||!x.a.correct);el.section.textContent="Review Mistakes";el.content.innerHTML=`<h2>Review Mistakes</h2><p class="lead">Questions missed: ${missed.map(x=>x.i+1).join(", ")}</p><div class="mistakes">${missed.map(x=>`<div class="mistake"><strong>Question ${x.i+1}: ${x.q.q}</strong><br><span class="mini">Correct answer: ${"ABCD"[x.q.a]}. ${x.q.c[x.q.a]} — ${x.q.e}</span></div>`).join("")}</div><div class="group" style="margin-top:18px"><button class="btn primary" id="againFromMistakes">Try Quiz Again</button><button class="btn secondary" id="lessonFromMistakes">Return to Lesson</button></div>`;document.getElementById("againFromMistakes").addEventListener("click",()=>startQuiz(true),{once:true});document.getElementById("lessonFromMistakes").addEventListener("click",()=>{state.slide=0;renderSlide()},{once:true});window.scrollTo({top:0,behavior:"auto"})}
function restartAll(){state.slide=0;state.question=0;state.score=0;state.answered=false;state.answers=[];renderSlide()}function showError(error){el.content.innerHTML=`<div class="error"><h2>Something went wrong</h2><p>Please use Restart.</p><p class="mini">${String(error&&error.message?error.message:error)}</p></div>`;console.error(error)}function init(){try{el.back.addEventListener("click",()=>{if(state.slide>0){state.slide--;renderSlide()}});el.next.addEventListener("click",()=>{if(state.slide<slides.length-1){state.slide++;renderSlide()}else startQuiz(true)});el.restart.addEventListener("click",restartAll);el.returnLesson.addEventListener("click",()=>{state.slide=slides.length-1;renderSlide()});el.nextQuestion.addEventListener("click",goNextQuestion);document.addEventListener("keydown",e=>{if(state.mode!=="lesson")return;if(e.key==="ArrowLeft"&&state.slide>0){state.slide--;renderSlide()}if(e.key==="ArrowRight"&&state.slide<slides.length-1){state.slide++;renderSlide()}});renderSlide()}catch(error){showError(error)}}document.addEventListener("DOMContentLoaded",init,{once:true});window.addEventListener("error",e=>showError(e.error||e.message),{once:true});
</script></body></html>
