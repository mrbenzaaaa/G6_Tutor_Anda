`<div class="slide-content"><div class="eyebrow">Easy Lesson</div><h2>How Igneous Rock Forms</h2><div class="grid2"><div class="card orange"><h3>Magma</h3><p><b>Molten rock below Earth's surface.</b></p></div><div class="card gold"><h3>Lava</h3><p><b>Molten rock that has erupted onto Earth's surface.</b></p></div></div><div class="big-equation"><span class="pill hot">magma or lava</span><span class="arrow">→</span><span class="pill">cools</span><span class="arrow">→</span><span class="pill">crystallizes</span><span class="arrow">→</span><span class="pill dark">igneous rock</span></div><p>Lava can cool quickly after touching cooler air. Large volumes of magma can cool and crystallize beneath Earth's surface, where the process takes a long time.</p><p class="note">Over time, wind, rain, and other factors can wear away surface material and expose rock that formed underground. Stone Mountain in Georgia is the example shown in the material.</p><div class="remember">⭐ Remember: Igneous rock forms when molten rock cools and crystallizes.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Easy Lesson</div><h2>Location Changes the Result</h2><div class="mini-flow"><div class="flow-step"><b>Below Earth's surface</b><br>Magma is insulated by solid rock</div><div class="flow-arrow">→</div><div class="flow-step"><b>Slow cooling</b><br>Cooling takes a long time</div><div class="flow-arrow">→</div><div class="flow-step"><b>Large crystals</b><br>Visible, well-defined crystals</div></div><br><div class="mini-flow"><div class="flow-step"><b>On Earth's surface</b><br>Lava or ash has erupted</div><div class="flow-arrow">→</div><div class="flow-step"><b>Rapid cooling</b><br>Little time for crystals to grow</div><div class="flow-arrow">→</div><div class="flow-step"><b>Tiny or no crystals</b><br>Fine-grained or glassy texture</div></div><div class="remember">⭐ Remember: Slow cooling grows larger crystals; fast cooling makes tiny or no crystals.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Key Vocabulary</div><div class="grid2"><div><h2>Extrusive Rock</h2><p><b>Extrusive rock</b> forms when volcanic material erupts, then cools and crystallizes on Earth's surface.</p><ul><li>Materials can include <b>lava and ash</b>.</li><li>Rapid cooling gives little time for crystals to grow.</li><li>The texture is usually <b>fine-grained</b>.</li></ul><p class="note">Geologists study the texture and composition of extrusive rocks to determine how they formed.</p></div><figure class="figure"><img class="visual" src="data:image/webp;base64,UklGRiwHAQBXRUJQVlA4ICAHAQCQyQOdASqEA20CPpFAm0klo6KkKDQsaLASCWVu/Ad025ycaYYXm4je9z/ePSB5R7S/jH3D1mv7XjX2N5KnR/nP/1/qY/pn+j/8XuEfr9+ynuP/8vqz/vP/d9Rf9c/3v7n+7J/1v3d93P9v9Rn+vf83rUfQi83b/4+z1/bf+/+5vte///WZfh3+R/vf+I/Y/zNfr39y/uX+M/zn9+9H/xr5d+6f27/Gf7z+5/H38//4H+d8lHp/8T/uf8P/pfYT+R/cX83/dP8p/5/7z7c/7v/E/lZ6M/ln7D/vv7x/mP2a+Qj8m/nf+a/uv5FfDN9N+1f+n8Afaf9r/4v9f7BHtb9t/Zz0NfjP+9/kv9X7Pfon+H/7f+L/1nyCfzz+2/9X/D+5X/d8N/91/2vYH/wH/E9Vv/I/+f+y/3f73fCX64/+P+t/2nyMf0v/Cf9//Kf6c7j973ve973ve973ve3PYTBo3PYQxJRJM1KEpgDnOc5znOc5znOc5znPJrlerFWdWrlfqooVR+ujsAFTI/LD7KWjn5HLzeWpbQEDiq6TSeCziy2m0DXsp5zaaJR7Tf/JQ2O4DXD4+cl5cwRByG2x+zPw+u6xI7XRkXybJkn/8dP+f+JbkcATRYLgsb0JjOcdXBWr+p9VGgUQqIV56Bs7Qu29d4Tqm4BHSsxr+A7kfgiOIwWwl8fupVaUowruWKrRec+hal2SjGMmzNVMRuFhWCdu0J7r/mrCdjkv7bUTtU0H116jaOinNqhUP+9OTQB1wf5QAP8QmCNx3EE4rLb2FEaUg3E86waO0j3+tOTqyItvzGhJ6vMHvM9WcdFYzPOHFtn4lGWFvvX1B1HSCS8No7ItseDF532kOli3WHQh5ZCJ3qBB/hPf1QFkprzDfn9Z+m5K7+AkFsvVuDKtrwqmBF6PdaL3LPn/DHRdGUEeKcLDrw1/gUBGK2777yujwrGxq96NAnKRuSHwWLaz3bFtQMPFKjrQars5G/pl32fuJlAXkLAC1rXtaW+/Ilg3XUziLLhKeD0Tq9fzBofJM9hr7I6ygUXixYt/nx55NX8vW1cmRS6/w8mmFgKwLMGOvOVJrKWCExyB9JzcQAiihNwI8Z0UbQiy4ENmgk1mj0SE8KJKyUpiIt9romi2UmSJmtFFQx3FARi4ppqkIG9X9rpWc4XoDKa+Xxpww2EfziXtROFLYiSHynFE71H17Ok5TXQpZEWNh26JyDmb/llE9LUtBFT2ehFqVhpmZWaivCn1QEfHIJqUNyqLBJUDsbH9T4euSgHSYt39gBqwidJQL8AuoXsNB0qYrSW/BYrXYDclQKaNRakWyASMX06JPYu/PiFvdyRlSKve/bavvj4VCtHvjObKtRvDsD00T9R+VbL `<div class="slide-content"><div class="eyebrow">Key Vocabulary</div><h2>Volcanic Glass and Holes</h2><div class="grid2"><div class="card"><h3>Volcanic glass</h3><p>Rock that forms when lava cools <b>too quickly to form crystals</b>.</p><p><b>Obsidian</b> is the example shown in the study material.</p></div><div class="card orange"><h3>Why pumice has holes</h3><p>Magma underground can contain dissolved gases. As magma rises, pressure decreases and gases separate. When gas-rich lava erupts, gases escape.</p><p>The holes are left <b>after gas escapes</b>.</p></div></div><div class="big-equation"><span class="pill hot">lava cools too quickly</span><span class="arrow">→</span><span class="pill dark">no crystals</span><span class="arrow">→</span><span class="pill">volcanic glass</span></div><div class="remember">⭐ Remember: Obsidian forms without crystals; pumice holes are spaces left by escaping gas.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Key Vocabulary</div><h2>Intrusive Rock</h2><div class="grid2"><div><p><b>Intrusive rocks</b> are igneous rocks that form as magma cools underground.</p><ul><li>Solid rock insulates the magma.</li><li>Magma cools more slowly than lava on the surface.</li><li>Large, well-defined crystals form.</li><li>Crystals have a <b>random arrangement</b> and interlock like jigsaw pieces.</li></ul><p class="note">The source says the word intrusive comes from Latin <i>intrudere</i>, meaning “to push in.”</p></div><figure class="figure"><img class="visual" src="data:image/webp;base64,UklGRggHAQBXRUJQVlA4IPwGAQCQWgSdASroA0MCPpFCnEglpCYpqhSriTASCWNuH68oAoKg7q9Oe1e0nuqXXHmaW3iS9ntjPLKqIsCreWwHvqkl5f8lPsGmJ/k8TfjP+95kPtPfG/6/7ae9f9bewf+wvqV/+PsP/uP/l9Vf7ifuD7snqG/tHqQ/1r/i9dN6Lnl4+1B/V//H+63tgf//V5+1npw8yv1P+E/cTzX8cXvH92/zf/k/x/uQ5S/Yv7D/3/7T1I/nP43/of5X0k/9n+n8hfzv+I/8/+j9hT8z/qv/L/v/rO/qd3Xu/mR/FGRH+d/7/V/9U9R7+l8id/V9R7/I+iz/vf/n1BfpP/F9Iw2kVadH93OJTVlDe9i9iZewn/oDe9QIaG0An9L7qxuHFQ1uDmP4qaZfnHyVadHL3LgAw9szC9jyWV5vrVsv0thmhKFEcS4OOaSrMGXoHLSVRYrckH/UcKiCn/hEJ+2mx3H56AD3/rBzNHOBg9Axhh5piT2LGkpihUdAPNE4N5Y1Y8M/GPnGMq+zfN1D9He/vhEWnq3NyTce88RahcZbYlPBoEO2fbG+AOq/gRy2+g1+fOaZOmJ10iUuxlm7shtwMccFYu5ssqOSTxg9pNxIOl3HR4yPPRxiat2HxCRDeF5w0saXnH5GYVuwglGh+tqS+FbK4kcDjoXmRRXj376wf3LkQZK5HVvXjfPG2ZLRsxRxoK9c/q7nV36tZ1z7LjstljfB0BFSjrMbEyNVDSR7vX3ivCNFmAl11Vi+hVu27v9/5NjwhrSq57eSmiqazU4q4apuzdYs0xJSz0D3VHZ/CGajQahfg2u4nhZHeQotaoIi/l/YyBsWubyn6SKtfcFRZpzPsp7VSUxvun0aREaspLPY99ydqnCIjyxVylIo172mut/zl7Om80LPeVkylkPWcxilP1jSIy5dTjrAHM4xX7gwPP92pCsp8BZCzhmSOvlekjwZAbz+YH5+s1SIaeE4ZAQCSyG9Ua5igsx8yjvwk1xr8qfIYIPEa+FEZ5YOjdYq1rWur/uEbMFf21HL3HqfEckADC7cuAB7vmsKHmgly52W48P3sXt5fbaCTj1CFM8WYVhUx/9AEGrBxaFx1bKjrPeSVI2KVR6CgkY4PiyGiMk/KXsBELshCQdKWRFaXdGwqWIVTHfri0RzTZC831JSSFJcWkmPNUhJADSJwwjkhje0xyCklims9idCAOwE1WiLjhGPeSrefsCkkJsaa3UfIWd+V0yCh9hW4o4RE/3bbI8KMETJ4Qawo7nESmAwMRec/0iMHocnnBSILFwyJKkOklRwI1QtCP5NeDTE/AmQ89RyekvWjpHMNN/61hKpixKh5S9G8QhHUQds3 `<div class="slide-content"><div class="eyebrow">Easy to Compare</div><h2>Intrusive vs. Extrusive</h2><table class="compare"><thead><tr><th>Feature</th><th>Intrusive</th><th>Extrusive</th></tr></thead><tbody><tr><td><b>Molten material</b></td><td>Magma</td><td>Lava or ash</td></tr><tr><td><b>Location</b></td><td>Below Earth's surface</td><td>On Earth's surface</td></tr><tr><td><b>Cooling</b></td><td>Slow</td><td>Rapid</td></tr><tr><td><b>Crystals</b></td><td>Large and visible</td><td>Small, tiny, or absent</td></tr><tr><td><b>Texture</b></td><td>Large crystals with an interlocking texture</td><td>Fine-grained; volcanic glass if no crystals form</td></tr></tbody></table><div class="remember">⭐ Remember: Inside and slow = intrusive; erupted and fast = extrusive.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Rock Identification</div><h2>Two Clues Identify Igneous Rocks</h2><div class="grid2"><div class="card"><h3>1. Texture</h3><p>Geologists use the <b>arrangement and size of mineral crystals</b>.</p><p>Small or invisible without a magnifying lens → extrusive.</p><p>Large, visible, interlocking crystals → intrusive.</p></div><div class="card green"><h3>2. Composition</h3><p>Geologists study the rock's <b>mineral composition</b>.</p><p>Igneous rocks are classified in part by <b>silica content</b>.</p><p>Rock color can give a clue when minerals are hard to identify.</p></div></div><div class="remember">⭐ Remember: Texture tells about cooling; minerals and color give clues to composition.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Composition</div><h2>Silica and Color Clues</h2><div class="grid2"><div class="card gold"><h3>Light-colored minerals</h3><p><b>Quartz and feldspar</b> contain greater amounts of silica.</p><p>Lighter-colored rocks are similar to <b>granite</b> in mineral composition.</p></div><div class="card orange"><h3>Dark-colored minerals</h3><p><b>Olivine and pyroxene</b> contain less silica and greater amounts of elements like magnesium and iron.</p><p>Darker-colored rocks are similar to <b>basalt</b> in composition.</p></div></div><p class="note">The material says color can sometimes be used to estimate composition when minerals are difficult to identify.</p><div class="remember">⭐ Remember: Lighter suggests granite-like composition; darker suggests basalt-like composition.</div></div>`,

`<div class="slide-content"><div class="eyebrow">Common Igneous Rocks</div><h2>Learn the Three Rock Pairs</h2><table class="compare"><thead><tr><th>Minerals listed in the material</th><th>Intrusive</th><th>Extrusive</th></tr></thead><tbody><tr><td>quartz, feldspar, mica, amphibole</td><td><b>granite</b></td><td><b>rhyolite</b></td></tr><tr><td>pyroxene, feldspar, mica, amphibole, some quartz</td><td><b>diorite</b></td><td><b>andesite</b></td></tr><tr><td>olivine, pyroxene, feldspar, mica, amphibole, little or no quartz</td><td><b>gabbro</b></td><td><b>basalt</b></td></tr></tbody></table><p>An extrusive rock can have the same mineral composition as an intrusive rock, but their <b>textures differ</b>.</p><div class="remember">⭐ Remember: Same row = similar listed minerals; different column = different texture.</div></div>`,
`<div class="slide-content"><div class="eyebrow">What Determines the Rock?</div><h2>Three Factors Work Together</h2><div class="grid3"><div class="card"><h3>Composition</h3><p>Which minerals and how much silica are present.</p></div><div class="card orange"><h3>Location</h3><p>Where lava or magma cools and crystallizes.</p></div><div class="card green"><h3>Cooling rate</h3><p>How quickly or slowly the material cools.</p></div></div><div class="grid2" style="margin-top:16px"><div><h3>Granite example</h3><p>High in silica; cooled slowly beneath Earth's surface; <b>intrusive</b>.</p></div><div><h3>Basalt example</h3><p>Low silica content; formed as lava rapidly cooled on Earth's surface; <b>extrusive</b>.</p></div></div><div class="remember">⭐ Remember: Composition + location + cooling rate determine the type of igneous rock.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Launch Lab</div><h2>Modeling How Igneous Rock Forms</h2><p>The activity uses hot, melted sugar and cold water to model cooling and crystallization.</p><div class="mini-flow"><div class="flow-step">Complete a lab safety form</div><div class="flow-arrow">→</div><div class="flow-step">Teacher drips melted sugar slowly into cold water</div><div class="flow-arrow">→</div><div class="flow-step">Record what happens</div></div><br><div class="mini-flow"><div class="flow-step">Teacher quickly pours melted sugar into cold water</div><div class="flow-arrow">→</div><div class="flow-step">Record what happens</div><div class="flow-arrow">→</div><div class="flow-step">Compare the “candy rocks”</div></div><p><b>Think about:</b> How are the two candy rocks different, and how does the activity model igneous-rock formation?</p><div class="remember">⭐ Remember: The model compares how different cooling conditions affect the solid material that forms.</div></div>`,
`<div class="slide-content"><div class="eyebrow">MiniLab</div><h2>Cooling Rate and Crystal Size</h2><p>The lab models crystal formation under different temperature conditions.</p><div class="grid2"><div class="card"><h3>Set up</h3><ol><li>Mix <b>10 mL</b> of warm water with <b>10 mg</b> of Epsom salt (MgSO₄); dissolve completely.</li><li>Completely fill three beakers with hot, warm, and cold water; label them.</li><li>Place a watch glass on each beaker so its bottom touches the water.</li><li>Measure <b>3 mL</b> of solution and pour that amount into each watch glass.</li><li>Leave overnight and record observations.</li></ol></div><div class="card green"><h3>Analyze</h3><ul><li>Describe the crystals in each watch glass.</li><li>Infer where crystals formed first.</li><li>Connect cooling rate to crystal size.</li><li>Decide which watch glass models extrusive and intrusive crystals.</li></ul></div></div><p class="note">The lesson states that crystal size is directly related to crystallization rate.</p><div class="remember">⭐ Remember: Compare hot, warm, and cold conditions to connect crystallization rate with crystal size.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Skill Practice</div><h2>How Geologists Compare and Classify</h2><p>Geologists use a <b>magnifying lens</b> to compare texture and mineral composition and determine the processes that formed igneous rocks.</p><div class="grid2"><div class="card"><h3>Intrusive samples</h3><p><b>Granite and gabbro</b></p><p>Describe crystal size and color.</p></div><div class="card orange"><h3>Extrusive samples</h3><p><b>Pumice, basalt, rhyolite, and obsidian</b></p><p>Describe crystal size and color; explain how obsidian differs.</p></div></div><p><b>Apply the evidence:</b> Compare rocks, classify unknowns from their properties, consider why obsidian differs, and infer whether pumice is less dense than rhyolite from observations.</p><div class="remember">⭐ Remember: Classify from observed properties—especially crystal size, texture, minerals, and color.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Lesson Review Taught</div><h2>Vocabulary Questions 1–3</h2><div class="grid3"><div class="card"><h3>1. Use both terms</h3><p>An <b>intrusive rock</b> forms as magma cools underground, while an <b>extrusive rock</b> forms from erupted material cooling on the surface.</p></div><div class="card green"><h3>2. Largest crystals</h3><p><b>Intrusive igneous rock</b>, because underground magma cools slowly.</p></div><div class="card orange"><h3>3. Volcanic glass</h3><p>It forms when lava cools <b>too quickly for crystals to form</b>.</p></div></div><div class="remember">⭐ Remember: Vocabulary answers should include formation location and cooling result.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Lesson Review Taught</div><h2>Key Concepts Questions 4–7</h2><table class="compare"><thead><tr><th>Review question</th><th>Answer from the lesson</th></tr></thead><tbody><tr><td>4. What causes holes in some extrusive rocks?</td><td><b>Gases</b> escape and leave holes.</td></tr><tr><td>5. Compare textures deep inside Earth and at the surface.</td><td>Deep: large, visible, interlocking crystals. Surface: tiny or no visible crystals; fine-grained or glassy.</td></tr><tr><td>6. What process is required for minerals to crystallize from magma?</td><td><b>Cooling</b>.</td></tr><tr><td>7. Which listed rock contains the greatest amount of quartz?</td><td><b>Granite</b>.</td></tr></tbody></table><div class="remember">⭐ Remember: Gas makes holes; cooling makes crystals; granite is in the quartz-rich row.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Lesson Review Taught</div><h2>Graphics and Critical Thinking 8–10</h2><div class="grid2"><div class="card"><h3>8. Same composition as basalt</h3><p><b>Gabbro</b> is the intrusive rock in basalt's mineral-composition row.</p><h3>9. Common textures</h3><p>Organize textures as large visible interlocking crystals, fine-grained tiny crystals, and volcanic glass with no crystals.</p></div><div class="card orange"><h3>10. Explosive eruption</h3><p>The supported prediction is <b>extrusive texture</b>: rapid surface cooling gives tiny or no crystals. If gas escapes, holes may remain.</p><h3>Correct the statement</h3><p>Large crystals form when <b>magma cools slowly beneath Earth's surface</b>, not when lava cools quickly.</p></div></div><p class="note">For the broad lesson idea, igneous rock can form when magma below or lava at the surface cools and crystallizes.</p><div class="remember">⭐ Remember: Use the diagram, table, and cooling rule to answer review questions.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Easy-to-Confuse Points</div><h2>Do Not Mix These Up</h2><table class="compare"><thead><tr><th>Often confused</th><th>Correct distinction</th></tr></thead><tbody><tr><td>Magma vs. lava</td><td>Magma is below the surface; lava has erupted onto the surface.</td></tr><tr><td>Intrusive vs. extrusive</td><td>Intrusive forms underground; extrusive forms on the surface.</td></tr><tr><td>Large vs. tiny crystals</td><td>Slow cooling makes large crystals; rapid cooling makes tiny crystals.</td></tr><tr><td>Fine-grained vs. volcanic glass</td><td>Fine-grained has tiny crystals; volcanic glass forms when there is not enough time for crystals.</td></tr><tr><td>Texture vs. composition</td><td>Texture uses crystal size and arrangement; composition uses minerals and silica clues.</td></tr></tbody></table><div class="remember">⭐ Remember: First ask where it cooled, then how fast, then what texture formed.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Memory Tricks</div><h2>Fast Recall</h2><div class="grid2"><div class="card"><h3>INtrusive</h3><p><b>IN</b> Earth → insulated → slow → large interlocking crystals.</p></div><div class="card orange"><h3>EXtrusive</h3><p><b>EX</b>its to the surface → rapid cooling → tiny or no crystals.</p></div><div class="card gold"><h3>Glass</h3><p>Too fast for crystals → volcanic glass.</p></div><div class="card green"><h3>Rock pairs</h3><p>Granite–rhyolite; diorite–andesite; gabbro–basalt.</p></div></div><div class="remember">⭐ Remember: IN = inside; EX = erupted outside.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Exam Focus</div><h2>Memorize and Understand</h2><div class="grid2"><div><h3>Memorize</h3><ul class="checklist"><li>Definitions of magma, lava, intrusive rock, extrusive rock, volcanic glass</li><li>Rock pairs in Table 1</li><li>Gas escape causes holes</li><li>Cooling is required for crystallization</li></ul></div><div><h3>Understand</h3><ul class="checklist"><li>Location → cooling rate → crystal size</li><li>How texture identifies intrusive or extrusive rock</li><li>How minerals, silica, and color give composition clues</li><li>How to use a table or diagram to classify a rock</li></ul></div></div><div class="remember">⭐ Remember: Test questions can come from definitions, comparisons, diagrams, tables, labs, and review questions.</div></div>`,
`<div class="slide-content"><div class="eyebrow">Final 4-Minute Review</div><h2>Remember These Before the Test</h2><div class="grid2"><div class="card"><h3>Minute 1 • Formation</h3><p>Magma is below; lava is at the surface. Cooling + crystallization → igneous rock.</p><h3>Minute 2 • Texture</h3><p>Slow underground cooling → large interlocking crystals. Rapid surface cooling → tiny or no crystals.</p></div><div class="card orange"><h3>Minute 3 • Special rocks</h3><p>Obsidian = volcanic glass. Pumice holes = gas escaped.</p><h3>Minute 4 • Identification</h3><p>Use texture and composition. Remember the three pairs: granite–rhyolite, diorite–andesite, gabbro–basalt.</p></div></div><div class="remember">⭐ Remember: Where? How fast? What crystals? Which minerals? These four questions unlock the lesson.</div></div>`

const lessonScreen=document.getElementById('lessonScreen'),quizScreen=document.getElementById('quizScreen'),quizInner=document.getElementById('quizInner'),counter=document.getElementById('counter'),modeLabel=document.getElementById('modeLabel'),progressBar=document.getElementById('progressBar');
let slideIndex=0,qIndex=0,score=0,answered=false,missed=[];
function buildSlides(){lessonScreen.innerHTML=slides.map((s,i)=>`<article class="slide" id="slide-${i}">${s}<nav class="nav"><button class="btn secondary" onclick="moveSlide(-1)" ${i===0?'disabled':''}>← Back</button><button class="btn restart" onclick="restartLesson()">↻ Restart</button><button class="btn primary" onclick="${i===slides.length-1?'startQuiz()':'moveSlide(1)'}">${i===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button></nav></article>`).join('');showSlide(0)}
function showSlide(i){slideIndex=Math.max(0,Math.min(i,slides.length-1));document.querySelectorAll('.slide').forEach((el,n)=>el.classList.toggle('active',n===slideIndex));const current=document.getElementById(`slide-${slideIndex}`);if(current)current.scrollTop=0;counter.textContent=`Slide ${slideIndex+1} of ${slides.length}`;modeLabel.textContent=slideIndex===slides.length-1?'4-Min Review':'Lesson';progressBar.style.width=`${((slideIndex+1)/slides.length)*100}%`}
function moveSlide(d){showSlide(slideIndex+d)}
function restartLesson(){lessonScreen.style.display='block';quizScreen.style.display='none';showSlide(0)}
function startQuiz(){lessonScreen.style.display='none';quizScreen.style.display='block';modeLabel.textContent='Quiz';qIndex=0;score=0;answered=false;missed=[];renderQuestion()}
function renderQuestion(){const x=quiz[qIndex],letters=['A','B','C','D'];answered=false;counter.textContent=`Question ${qIndex+1} of ${quiz.length}`;progressBar.style.width=`${((qIndex+1)/quiz.length)*100}%`;quizInner.innerHTML=`<div class="qmeta"><span>${qIndex<10?'Easy':qIndex<20?'Medium':'Hard'}</span><span>Score: ${score}</span></div><div class="question">${qIndex+1}. ${x.q}</div><div class="choices">${x.c.map((c,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${c}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="quizNext" class="btn primary quiz-next" onclick="nextQuestion()">${qIndex===quiz.length-1?'See Results →':'Next Question →'}</button>`;quizScreen.scrollTop=0}
function answer(choice){if(answered)return;answered=true;const x=quiz[qIndex],buttons=[...document.querySelectorAll('.choice')],fb=document.getElementById('feedback');buttons.forEach((b,i)=>{b.disabled=true;if(i===x.a)b.classList.add('correct');if(i===choice&&i!==x.a)b.classList.add('wrong')});if(choice===x.a){score++;fb.className='feedback correct';fb.innerHTML=`<b>✅ Correct!</b><br>${x.e}`}else{missed.push(x.t);fb.className='feedback wrong';fb.innerHTML=`<b>❌ Incorrect.</b> Correct answer: <b>${'ABCD'[x.a]}. ${x.c[x.a]}</b><br>${x.e}`}document.getElementById('quizNext').style.display='block'}
function nextQuestion(){if(qIndex<quiz.length-1){qIndex++;renderQuestion()}else showResults()}
function showResults(){const pct=Math.round(score/quiz.length*100),topics=[...new Set(missed)],msg=pct>=90?'Excellent review!':pct>=70?'Good work—review the topics below once more.':'Keep going—return to the lesson and strengthen the topics below.';counter.textContent='Quiz Complete';progressBar.style.width='100%';quizInner.innerHTML=`<div class="result"><div class="eyebrow">Quiz Complete</div><h2>Your Result</h2><div class="score-ring" style="--pct:${pct}%"><div class="score-text">${score}/30<br><small>${pct}%</small></div></div><p class="lead">${msg}</p><div class="weak-list"><h3>Topics to Review</h3>${topics.length?`<ul class="checklist">${topics.map(t=>`<li>${t}</li>`).join('')}</ul>`:'<p>None — you answered every question correctly!</p>'}</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn primary" onclick="startQuiz()">Restart Quiz</button><button class="btn secondary" onclick="returnToLesson()">Return to Lesson</button></div></div>`;quizScreen.scrollTop=0}
function returnToLesson(){quizScreen.style.display='none';lessonScreen.style.display='block';showSlide(slides.length-1)}
document.addEventListener('keydown',e=>{if(lessonScreen.style.display!=='none'){if(e.key==='ArrowRight')moveSlide(1);if(e.key==='ArrowLeft')moveSlide(-1)}});
buildSlides();
</script>
</body>
</html>
