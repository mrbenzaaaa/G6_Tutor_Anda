RT 1 • WHAT YOU MUST KNOW","title":"Two Essential Questions","body":"<div class=\"question-cards\"><div class=\"big-card\"><b>1</b><p>How do sedimentary rocks form?</p></div><div class=\"big-card\"><b>2</b><p>What are the three types of sedimentary rocks?</p></div></div><p class=\"center-note\">The lesson answers both questions using formation steps, grain clues, mineral clues, and organism remains.</p>","remember":"Know both the formation process and the three rock types."},{"part":"PART 2 • EASY LESSON","title":"What Makes Sedimentary Rocks Different?","body":"<p>Sedimentary rocks are made from mixtures of:</p><div class=\"three\"><div class=\"concept\"><span>◇</span><b>Mineral grains</b></div><div class=\"concept\"><span>▦</span><b>Rock fragments</b></div><div class=\"concept\"><span>♧</span><b>Sometimes organic material</b></div></div><div class=\"callout\">In the Launch Lab, students compare grain sizes and examine sediment with a hand lens to determine different rock types.</div>","remember":"Look at the material and grain characteristics that make up each sample."},{"part":"PART 2 • EASY LESSON","title":"Rock Changes and Sediment Moves","body":"<div class=\"flow\"><div>Water + air</div><i>→</i><div>Rock can break apart, dissolve, or form new minerals</div></div><p>Water moving through rock can dissolve some elements and carry them to new locations.</p><h3>Mineral and rock fragments can be transported by:</h3><div class=\"four\"><div>💧 Water</div><div>❄ Glacial ice</div><div>⬇ Gravity</div><div>〰 Wind</div></div>","remember":"Water, glacial ice, gravity, and wind can transport sediment."},{"part":"PART 2 • EASY LESSON","title":"Deposition Builds Layers","body":"<div class=\"layers\"><div class=\"young\">Younger sediment</div><div>Older sediment</div><div class=\"old\">Oldest sediment</div></div><p>Sediments are eventually <b>deposited</b>, or laid down, where they accumulate in layers.</p><p>Younger sediment layers bury older layers. More deposits can bury both the old and young layers.</p>","remember":"Deposition lays sediment down; younger layers bury older layers."},{"part":"PART 2 • EASY LESSON","title":"Compaction vs. Cementation","body":"<div class=\"split\"><div class=\"definition\"><h3>Compaction</h3><p>The weight of sediment layers forces out fluids and decreases the space between grains.</p><div class=\"mini-grains tight\"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class=\"definition\"><h3>Cementation</h3><p>Minerals dissolved in water crystallize between sediment grains. Mineral cement holds the grains together.</p><div class=\"mini-grains cement\"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><p class=\"small\">Common minerals that cement sediment together include <b>quartz, calcite, and clay</b>.</p>","remember":"Compaction squeezes grains closer; cementation glues grains together with crystallized minerals."},{"part":"PART 2 • EASY LESSON","title":"Formation Seen in the Textbook","body":"<div class=\"visual-pair\"><figure><img class=\"source-img\" src=\"data:image/webp;base64,UklGRhDHAABXRUJQVlA4IATHAABQ9wKdASqkAQEDPo08l0elI6KjsFZMgKARiWZub9HUPlG6h8Lui5D9a/sf8n+RXun8i9l/uX73/nv+5/kPln/odgfuf/J8qn1z+j+bn5l/7f9pvdP/Sv9D7Bf9D/wH7Se5n/x+sn/Df+r1Ofup+7Xu4f+j95ffZ/bfUu/rv/T///ZF+iF5vP/2/d/4j/7D/5/3p9uDU5+0/pJ8T/0H+N/bDzb/Jfo/9P/f/85/1f837q+TP2P/M/bn1K/nH5D/lf5b96f8770/+X/Yfk76p/nf8V/3/Ug/Lv6N/sv8P+SXxlRYOuHer1KffL8t+0vo7fpf+f1r/Vv+H/4/WT+7PtR5Kv9f1Fv8b6Lv+5/9/+R68P0v/f//H/afA/+w6ToZyXuz7h0HszwHacZqSZCkZ4cQRf07PKkMOaE0B+oPgcXXrxs2anZRXO1S3EcDraJS/ZDwC4Y6qwtBgrIaGZRYCgmGiGo2SS/ayJkSIuTk8zLV6F7vU6tMnW8SWfqcTM0SYZ2jvLgK4SgsRdypkwKdXAIBniNYY8CuOZhkTLgRJBdAbzLW+O+RivMusamaIU9hSBhRcLKenpQd3PyOHrS6R1Ubze0HzdD7GogQW9tiivHue7bPOtoQhX/ayeHoXQRwMGkJoZYHDJDB1ipMAbBW7gQ+05V3bjo89iac6lGlJfMyqdRfeh8D1ZK9K2Obc9/4B3Rudy4P3SOAVsru5K9UT1TWRYfHqxTEGPAgjNO7rrIgAzJ0gqghXDlzkcCnLXYsn1acBmwdif93o2HGsK5jMlEoyGsGwxkg6Q3B9z2f1dSOuYn8NhRMabOeNsQ7ec4U8xNpFt+Pwj6LHGwNS9yvghzzSUV0Ekl1pBXGChlzJOXszPgOT4793QrGeVC1wLH compaction before cementation.</p>","remember":"Erode → transport → deposit → compact → cement."},{"part":"PART 2 • EASY LESSON","title":"Three Ways Sedimentary Rocks Form","body":"<div class=\"three\"><div class=\"type clastic\"><h3>Clastic</h3><p>Broken pieces of minerals and rock fragments are deposited, compacted, and cemented.</p></div><div class=\"type chemical\"><h3>Chemical</h3><p>Minerals crystallize directly from water.</p></div><div class=\"type bio\"><h3>Biochemical</h3><p>Formed by organisms or contains the remains of organisms.</p></div></div>","remember":"The three types are clastic, chemical, and biochemical."},{"part":"PART 2 • EASY LESSON","title":"Clastic Sedimentary Rocks","body":"<div class=\"term-card\"><b>Clastic rock</b><p>A sedimentary rock made of broken pieces of minerals and rock fragments.</p></div><p>The broken pieces and fragments are called <b>clasts</b>. Sandstone is a common clastic rock and has a gritty texture similar to sugar.</p><div class=\"word-origin\">WORD ORIGIN: Greek <i>klastos</i> means “broken.”</div>","remember":"Clastic = broken pieces; the pieces are clasts."},{"part":"PART 2 • EASY LESSON","title":"Clast Size and Shape Give Clues","body":"<p>Geologists identify clastic rocks according to <b>clast size and shape</b>.</p><div class=\"compare\"><div><h3>Large sediment</h3><p>A fast-flowing river and ocean waves tend to move large sediment.</p></div><div><h3>Small, gritty sediment</h3><p>Typically deposited in calm environments such as the seafloor or the bottom of a lake.</p></div></div>","remember":"Use both clast size and shape to study the environment where a rock formed."},{"part":"PART 2 • EASY LESSON","title":"Conglomerate vs. Breccia","body":"<figure class=\"wide-figure\"><img class=\"source-img\" src=\"data:image/webp;base64,UklGRrB8AABXRUJQVlA4IKR8AADwDAKdASr4As0BPpFEnUmlpCMiKTUKKLASCWdu/F+M3wvJKYwfyrii9tMlr/yjduv/95f2BP+kP8n2x/4n+3ftR/e/RX8p+c/yn92/0P/Q/wn7gfX39lf9v+p8UPrH89/5P9p6jfyz7/ft/756J/9f/OeMPx2/3PUO/ ossible environment."},{"part":"PART 2 • EASY LESSON","title":"Chemical Sedimentary Rocks","body":"<div class=\"flow\"><div>Water dissolves minerals</div><i>→</i><div>Water becomes saturated</div><i>→</i><div>Particles crystallize out</div></div><div class=\"term-card\"><b>Chemical rocks</b><p>Form when minerals crystallize directly from water.</p></div><p>Common examples: <b>rock salt, rock gypsum, and limestone</b>.</p>","remember":"Chemical sedimentary rocks form when minerals crystallize directly from water."},{"part":"PART 2 • EASY LESSON","title":"Rock Salt from Saturated Water","body":"<figure class=\"wide-figure\"><img class=\"source-img\" src=\"data:image/webp;base64,UklGRkzJAABXRUJQVlA4IEDJAACwVAKdASo0Ax0BPo06lkelI6IjsNadgKARiWduJjNrCrhulFZC841seiZWjX49/neVl8L3yPTdzTfWF/P+ig6I7qrKc/9Rf5T8d/dv4sfefx//Ib2R/G/mf7x/av8f/vv717a3/H/pPER01/3f8d6ify/7/fsf77+8P+Z9t/9v/hP9R+wnoz+Yfqv+1/uX+a/+H+X+Qv8h/lP+I/tX7t/3z4Ofov+n/wO/Y0z/H/9n/S+wX7AfTP+P/e/9N/8f9l8A/0n/Q/ynq5+x/6T/1f6X8qvsD/ov+B/533Me3P4U/73/xewN+r//D/uPdf/yP/l/tvza9+X1b/6v9N/tPkT/nn9+/7X+M/1HFaLO9zwsTfJY9tmIsKGEQCiHQt9kB/VeqJox5g5bhW7GUTM5am5WXTm+Ax7r5YrqTaqtkmKtAYPzFJ/dd8Pp3a1KQ5xif1zyGwyI5OdY3qcLIW7fliYRr6RuFpoAyPo9zPV6qBb01GqhQQg/l1dqMKAyeF21zZ9Newf/FJNWdXfdq274d69K7FwzL2J5feNBikJ0/a/q8Brl/s+zivG+pyJS9jlxivof+U87XYDMeh3U7oxrb5Qyidw35mgbG/sd3kXjLRu73QC93+E943gZINzspENvwmiZw/4bCKyQhfXDPLEgj+1sN6zNBfzux2hS/UDV+KGjzQIhGbuz9CC8ZEZ2GVAnJZ/JiRgUFkTnTFnWbK+aiYz3wNzdWyYIANedn7IFLJzGCe3bA90AqMgDxjaIEPCn/cX0seAme2s6Ho/EIDJFHGK1ZDXA+4hN5XNb2g3OtPtf8KJJCzoMhRfPUPA8rcJaKz/nFkGCwnVTBlPsfCaDimLJhFWtZP3k7LrWD9hQubrWqYoLHLnbz3kzXSU697tkYyhugLW9fbRnjogRIUI86hh7dEbqEF3rpnzRvL/r9WL7PKwV1Ofhu+at+ON4jYwoWBBNFoJIJU/LhTjrVK/PyuV5t5SWVHMZELx42QAnyOTMvksZwo2H+9HsY1/k+GL5f6e+gf51+S/yNyJSU3hQyanOMHZ5B/7JKZR4tczOR6VSzCR5Y9D3ctXbcX0mXokqHekyx7TJ72p+lqjaVL5Pb8gyL5dMtOz3G7Jnxhk4FBQnMwNi5c1fYTCT5AoCBLVHozUj3cWAAj7X1mOmgG94NXJPiphqWpKBzmJ0dgrrnq6LeKmasyojM6BHWCkTbPw1yWM6ecmGdtMHMH1mVEWl+Ez68hBr1Ue46J5ndv9gG9K0s1DYGSrqKK8X4W41zRx6NfrntZNNywx stalline texture</b>.</p><div class=\"compare\"><div><h3>Intrusive igneous rock</h3><p>Made of a variety of minerals and appears multicolored.</p><p><b>Granite:</b> quartz + feldspar + mica</p></div><div><h3>Chemical sedimentary rock</h3><p>Generally one dominant mineral and uniform in color.</p><p><b>Rock salt:</b> halite</p></div></div>","remember":"Igneous: many minerals, multicolored. Chemical sedimentary: one dominant mineral, uniform color."},{"part":"PART 2 • EASY LESSON","title":"Common Chemical and Biochemical Rocks","body":"<figure class=\"wide-figure\"><img class=\"source-img\" src=\"data:image/webp;base64,UklGRk6ZAABXRUJQVlA4IEKZAACQlwKdASqEA5MBPpE+mUiloyKmKpOtAMASCWVr1iBuTF5xUkbxn73ouen5PNDNndaBxTA8dqx5WnmVtLn1ts7A8ko8n4cfhn7n1D8y/t/Kz9s/mP+79yHzX/7fre/qfqL+Yz/yft58BfNJ+4vq0/+P11f1r1If6r/gOui9FXprv77bLnl39F/tPy289/yP6f/L/3v9zf8H7mefP3/+8/9H+n9Tf59+Gf1n97/JD35/7/+v8s/lH/r/5X8ofkL/Lf6P/qP73+TXxlRbui1A36B/ivAn/6f9V6//pf+k/8/uD/zr+//97lNvZPYJ/X/q0f6//5/4frb+uv/t/tfge/YT9ikEZPe94Ews629jEuX0EXGJQGUqcffU4rdIWFSDec0FvR+H6j7BL7a5SCt/+6U5jtCz2kopP52cmrEfU3FU0G1mmdWNUJqoRf5pbgk72YEEX1v1JCbMD/Iz0IiN4/CUWu1z5fN89HQXjDJsEdMGh/J3hfBoW7vKdNAj3RjV4mV2Vgy+Oj7ikmiCm32SUet93ko+R701Yr4lVVu3zR36dFUrCkbt6tHfAshsXpk+8z5iWIe3IpalF+sI4ElO3j3dUtW+vg1HmzXj6TDJqv9qqqCAnp5+6NYE/jC86aXmXk9fX7ASvNo5kinOrnl/wczkrIa+t8/0cHMj3uf2el9eMaN2O1rQR7INqIxRwx0LUQOerdSX5LiAj7GDgEM0Gl1HVt31LSepPs3ER/Vq8BlsvxWL09uwJ6LD9BBDKu0Gh2Bfz4v5gp2m3s6IG1005doj26z8gbDpJyqfeHMbzkWvZje0Rdz4QVbnqiXI4gu8fUOzybnT8XmobJGLTwmh+efpR6xdg367Cn/3++VP2VH0C7KGveSABU3b/nI5GyxwnsHMnrtXkLdxmY9/GNL0rcfql2k0g8QbnIQQf9sWEOpPvq+rS8RaHLWnKJH1VwBLcwYvaJYPdx994iqVPH2XZzaCdZSw1DVJBGmG2taDKEByIHnh9evEpNdphwO7LMSl482Y5SILdG+JrMCFY48qeZVppxvg2pQXgQUQTvy94wby6FqMxdLa/Q1yukWbXf88nf1LwTFnXS8iGFPiaLdBlbPbixvtFCg6KTlruNMADwDeZSU5y4g6mDm/wSJJtI4ibhKLdEkOD1B/zaoEolmkdWWCy7879S9x/os0BV7PsRyCDUFI0+FgXSAkoxYyMFKZczS1hEMIy5Bq5Z6DJSf1mYMgXNSwzOTEdp2JCt7E53xxHnRZKy2rEiw/QFyp4/LvFQcsz2Spn29uduHyrQ/CjChAAji0tr9jbwfLkj5yXKXw7rg3NMftBqGGjll4fI0jRb8giKO sms.</p></div><p>The most common biochemical sedimentary rock is <b>limestone</b>.</p><div class=\"process short\"><div>Marine organisms make shells</div><span>→</span><div>They die; shells settle</div><span>→</span><div>Compaction + cementation</div><span>→</span><div>Limestone</div></div>","remember":"Biochemical rocks come from organisms or their remains."},{"part":"PART 2 • EASY LESSON","title":"Fossiliferous Limestone and Carbonates","body":"<p>Remains or traces of organisms can be preserved as <b>fossils</b> in sedimentary rock.</p><ul class=\"focus-list\"><li>Limestone containing fossils is <b>fossiliferous limestone</b>.</li><li>Limestone is a <b>carbonate rock</b> because it contains carbon and oxygen.</li><li>Carbonate rocks fizz with hydrochloric acid.</li><li>Geologists use this chemical property to identify limestone varieties.</li></ul>","remember":"Fossiliferous limestone contains fossils; carbonate rocks fizz with acid."},{"part":"PART 2 • EASY LESSON","title":"Chert: A Different Biochemical Rock","body":"<div class=\"flow\"><div>Microscopic ocean organisms remove silicon + oxygen from seawater</div><i>→</i><div>They make shells</div><i>→</i><div>They die and settle</div><i>→</i><div>Compaction + cementation form chert</div></div><p class=\"small\">Table 2 lists chert as quartz and notes: <b>some chert is not biochemical</b>.</p>","remember":"Some microscopic ocean organisms help form biochemical chert; some chert is not biochemical."},{"part":"PART 2 • EASY LESSON","title":"Coal: Remains from Prehistoric Swamps","body":"<div class=\"process short\"><div>Plants + animals in prehistoric swamps</div><span>→</span><div>Organic remains buried</div><span>→</span><div>Compression over time</div><span>→</span><div>Coal</div></div><p>Coal is another type of <b>biochemical sedimentary rock</b>. The table lists carbon as its composition and notes that carbon in coal is not a mineral.</p>","remember":"Coal formed from buried plant and animal remains in prehistoric swamps."},{"part":"PART 3 • IMPORTANT VOCABULARY","title":"Vocabulary You Must Know","body":"<div class=\"scroll-table\"><table><tr><th>Vocabulary</th><th>Meaning from the Material</th><th>Memory Tip</th></tr><tr><td><b>Compaction</b></td><td>Weight forces out fluids and decreases space between grains.</td><td>Compact = squeeze close</td></tr><tr><td><b>Cementation</b></td><td>Dissolved minerals crystallize between grains and hold them together.</td><td>Cement = hold together</td></tr><tr><td><b>Clastic rock</b></td><td>Made of broken pieces of minerals and rock fragments.</td><td>Clasts = broken pieces</td></tr><tr><td><b>Clast</b></td><td>A broken piece or fragment.</td><td>A piece inside clastic rock</td></tr><tr><td><b>Chemical rock</b></td><td>Forms when minerals crystallize directly from water.</td><td>Crystals from water</td></tr><tr><td><b>Biochemical rock</b></td><td>Formed by organisms or contains their remains.</td><td>Bio = organisms</td></tr></table></div>","remember":"Formation words tell you how each rock type is made."},{"part":"PART 4 • EASY-TO-CONFUSE POINTS","title":"Do Not Mix These Up","body":"<div class=\"scroll-table\"><table><tr><th>Point</th><th>First idea</th><th>Second idea</th></tr><tr><td>Process</td><td><b>Compaction:</b> squeezes grains closer</td><td><b>Cementation:</b> crystals hold grains together</td></tr><tr><td>Clast shape</td><td><b>Conglomerate:</b> rounded</td><td><b>Breccia:</b> angular</td></tr><tr><td>Rock type</td><td><b>Chemical:</b> minerals crystallize from water</td><td><b>Biochemical:</b> organisms or their remains</td></tr><tr><td>Texture clue</td><td><b>Igneous:</b> variety of minerals, multicolored</td><td><b>Chemical sedimentary:</b> one dominant mineral, uniform color</td></tr></table></div>","remember":"Compare the process, shape, source material, and mineral pattern."},{"part":"PART 5 • MEMORY TRICKS","title":"Fast Memory Clues","body":"<div class=\"memory-grid\"><div><b>Compact</b><span>Squeeze close</span></div><div><b>Cement</b><span>Hold together</span></div><div><b>Clastic</b><span>Clasts = broken pieces</span></div><div><b>Chemical</b><span>Crystals from water</span></div><div><b>Biochemical</b><span>Organisms or remains</span></div><div><b>Conglomerate</b><span>Rounded by movement</span></div><div><b>Breccia</b><span>Angular; not transported far</span></div><div><b>Rock salt</b><span>Halite</span></div></div>","remember":"Use one short clue to recall each full idea."},{"part":"PART 6 • EXAM FOCUS + LESSON REVIEW","title":"Rock Identification Flowchart","body":"<div class=\"id-chart\"><div class=\"root\">Do you see grains or pebbles?</div><div class=\"branches\"><div><b>YES — What are the particles?</b><p>Small grains → <strong>sandstone</strong></p><p>Large, rounded grains → <strong>conglomerate</strong></p></div><div><b>NO — Rock is smooth</b><p>Does not fizz with vinegar → <strong>shale</strong></p><p>Fizzes with vinegar → <strong>limestone</strong></p></div></div></div><p class=\"small\">The Skill Practice uses observations of physical and chemical properties. Vinegar is used to test whether a smooth sample fizzes.</p>","remember":"Grains identify sandstone/conglomerate; a vinegar test separates shale from limestone."},{"part":"PART 6 • EXAM FOCUS + LESSON REVIEW","title":"Lesson Review — Answers to Know","body":"<div class=\"review-grid\"><div><b>Coal</b><span>Biochemical sedimentary rock</span></div><div><b>Clastic choice</b><span>Sandstone</span></div><div><b>Classify</b><span>Conglomerate—clastic; rock gypsum—chemical; fossiliferous limestone—biochemical; rock salt—chemical</span></div><div><b>NOT a formation factor</b><span>Magma</span></div><div><b>Review order</b><span>Erosion → transportation → deposition → cementation</span></div><div><b>Water can dissolve rock</b><span>Supported by the lesson</span></div></div>","remember":"Practice classification and put formation terms in the correct order."},{"part":"PART 6 • EXAM FOCUS + LESSON REVIEW","title":"Lesson Review — Think It Through","body":"<ul class=\"focus-list\"><li><b>Conglomerate vs. breccia:</b> both are clastic; conglomerate has rounded clasts, while breccia has angular fragments.</li><li><b>Limestone in buildings:</b> because limestone dissolves in acid rain, buildings and monuments made from it can be damaged over time.</li><li><b>Seawater saltiness:</b> water dissolves minerals; rivers carry them to the ocean.</li><li><b>Correct the false statement:</b> not all sedimentary rocks formed from organisms in oceans. Sedimentary rocks may be clastic, chemical, or biochemical.</li></ul>","remember":"Use the rock’s formation and properties to explain each review answer."},{"part":"PART 7 • FINAL 4-MINUTE REVIEW","title":"Remember These Before the Test","body":"<div class=\"final-grid\"><div><b>Formation</b><span>Erode → transport → deposit → compact → cement</span></div><div><b>Clastic</b><span>Broken clasts; identify by size and shape</span></div><div><b>Chemical</b><span>Minerals crystallize directly from water</span></div><div><b>Biochemical</b><span>Organisms or remains</span></div><div><b>Shapes</b><span>Conglomerate rounded; breccia angular</span></div><div><b>Examples</b><span>Sandstone—clastic; rock salt—chemical; coal—biochemical</span></div><div><b>Acid test</b><span>Limestone/carbonate fizzes</span></div><div><b>Identification</b><span>Observe grains, particle size/shape, smoothness, and fizzing</span></div></div><button class=\"start-quiz\" onclick=\"startQuiz()\">Start 30-Question Quiz →</button>","remember":"Formation + three types + identification clues = the whole lesson."}];
const quiz=[{"level":"Easy","topic":"Clastic rocks","q":"What is a clastic sedimentary rock made of?","choices":["Broken pieces of minerals and rock fragments","Only one dissolved mineral","Only shells from organisms","Magma"],"a":0,"e":"Clastic rocks are made of broken mineral pieces and rock fragments."},{"level":"Easy","topic":"Compaction","q":"Which process forces out fluids and decreases space between sediment grains?","choices":["Transportation","Compaction","Cementation","Crystallization from water"],"a":1,"e":"The weight of layers causes compaction."},{"level":"Easy","topic":"Cementation","q":"What happens during cementation?","choices":["Clasts become angular","Older layers cover younger layers","Dissolved minerals crystallize between grains and hold them together","Magma enters the sediment"],"a":2,"e":"Mineral cement crystallizes between grains and holds them together."},{"level":"Easy","topic":"Transportation","q":"Which is NOT listed as something that transports mineral and rock fragments?","choices":["Water","Glacial ice","Wind","Magma"],"a":3,"e":"The material lists water, glacial ice, gravity, and wind."},{"level":"Easy","topic":"Deposition","q":"What happens after sediments are deposited over time?","choices":["Older layers always move to the top","Younger sediment layers bury older layers","Every layer becomes coal","All clasts dissolve"],"a":1,"e":"Younger deposits build on and bury older layers."},{"level":"Easy","topic":"Formation sequence","q":"Which sequence matches the Lesson Review order?","choices":["Transportation → erosion → cementation → deposition","Cementation → erosion → deposition → transportation","Erosion → transportation → deposition → cementation","Deposition → cementation → erosion → transportation"],"a":2,"e":"The review order is erosion, transportation, deposition, cementation."},{"level":"Easy","topic":"Clastic rocks","q":"What are broken rock pieces and fragments called?","choices":["Clasts","Carbonates","Crystals","Fossils"],"a":0,"e":"The broken pieces in clastic rocks are called clasts."},{"level":"Easy","topic":"Clastic examples","q":"Which rock is a common clastic sedimentary rock with a gritty texture similar to sugar?","choices":["Coal","Rock salt","Rock gypsum","Sandstone"],"a":3,"e":"The material describes sandstone as a common gritty clastic rock."},{"level":"Easy","topic":"Conglomerate","q":"Which description matches conglomerate?","choices":["Smooth rock that does not fizz","Rock made only of halite","Rock with rounded clasts","Rock formed from prehistoric swamp remains"],"a":2,"e":"Conglomerate clasts were rounded as they moved in a fast-flowing river."},{"level":"Easy","topic":"Breccia","q":"Which description matches breccia?","choices":["Uniform-colored crystals","Angular fragments with sharp edges","Rounded pieces moved far","Shells compacted into limestone"],"a":1,"e":"Breccia has angular fragments whose sharp edges were not worn away."},{"level":"Medium","topic":"Clast clues","q":"Why can sediment size alone NOT identify the environment where a clastic rock formed?","choices":["All sediment has the same size","Only wind transports sediment","Clast shape never changes","A glacier can move both large and small clasts"],"a":3,"e":"Glacial ice can move sediment from car-sized pieces to flour-sized grains."},{"level":"Medium","topic":"Depositional environment","q":"Where is small, gritty sediment typically deposited?","choices":["Calm seafloor or lake bottom","Only in fast-flowing rivers","Only inside organisms","Only in multicolored rock"],"a":0,"e":"The material connects small, gritty sediment with calm environments."},{"level":"Medium","topic":"Chemical rocks","q":"How do chemical sedimentary rocks form?","choices":["From angular clasts only","When minerals crystallize directly from water","When magma cools","Only when fossils are preserved"],"a":1,"e":"Chemical rocks result when minerals crystallize directly from water."},{"level":"Medium","topic":"Chemical examples","q":"Which set contains only examples named as common chemical sedimentary rocks?","choices":["Coal, chert, breccia","Sandstone, shale, conglomerate","Rock salt, rock gypsum, limestone","Granite, coal, sandstone"],"a":2,"e":"The material names rock salt, rock gypsum, and limestone."},{"level":"Medium","topic":"Chemical properties","q":"What is generally true of chemical sedimentary rocks in the comparison with intrusive igneous rocks?","choices":["They have one dominant mineral and are uniform in color","They always contain fossils","They are always made of rounded clasts","They contain quartz, feldspar, and mica together"],"a":0,"e":"Chemical sedimentary rocks are generally uniform and dominated by one mineral."},{"level":"Medium","topic":"Rock composition","q":"According to Table 2, what is the mineral composition of rock salt?","choices":["Calcite","Gypsum","Quartz","Halite"],"a":3,"e":"Table 2 lists halite for rock salt."},{"level":"Medium","topic":"Rock comparison","q":"Which minerals are listed for granite in the lesson comparison?","choices":["Halite and gypsum","Quartz, feldspar, and mica","Carbon and oxygen","Aragonite and calcite only"],"a":1,"e":"Granite is described as quartz, feldspar, and mica."},{"level":"Medium","topic":"Biochemical rocks","q":"What is a biochemical sedimentary rock?","choices":["A rock formed only by wind","A rock made only of rounded clasts","A rock formed by organisms or containing their remains","A rock made from cooled magma"],"a":2,"e":"That is the definition given in the material."},{"level":"Medium","topic":"Limestone","q":"What is the most common biochemical sedimentary rock?","choices":["Breccia","Rock salt","Sandstone","Limestone"],"a":3,"e":"The material identifies limestone as the most common biochemical sedimentary rock."},{"level":"Medium","topic":"Limestone formation","q":"What happens after marine organisms die in the limestone formation description?","choices":["Their shells settle, then are compacted and cemented","Their shells become magma","Their shells form granite","Their shells are transported only by wind"],"a":0,"e":"Settled shells become limestone through compaction and cementation."},{"level":"Hard","topic":"Carbonate rocks","q":"Why is limestone classified as a carbonate rock?","choices":["It contains gypsum and halite","It always has rounded grains","It contains carbon and oxygen","It never reacts with acid"],"a":2,"e":"The material says carbonate rock contains the elements carbon and oxygen."},{"level":"Hard","topic":"Acid test","q":"Which property helps geologists identify different varieties of limestone?","choices":["They become angular in water","Carbonate rocks fizz with hydrochloric acid","They always look multicolored","They contain only gypsum"],"a":1,"e":"Fizzing with acid is the chemical property used for identification."},{"level":"Hard","topic":"Chert","q":"How can microscopic ocean organisms help form chert?","choices":["They polish large clasts in rivers","They dissolve every sediment layer","They make coal from plant remains","They remove silicon and oxygen from seawater to make shells"],"a":3,"e":"After these organisms die and settle, compaction and cementation can form chert."},{"level":"Hard","topic":"Coal","q":"Which story correctly describes coal formation in the material?","choices":["Buried plant and animal remains from prehistoric swamps are compressed over time","Halite crystallizes after a lake evaporates","Rounded clasts are cemented in a river channel","Microscopic shells made from silicon become coal"],"a":0,"e":"Coal is described as compressed organic remains from prehistoric swamps."},{"level":"Hard","topic":"Rock classification","q":"How is fossiliferous limestone classified in Table 2?","choices":["Clastic","Biochemical","Intrusive igneous","Not a rock"],"a":1,"e":"Table 2 classifies fossiliferous limestone as biochemical."},{"level":"Hard","topic":"Rock composition","q":"Which material is listed as the composition of chert in Table let slideIndex=0,qIndex=0,score=0,locked=false,wrongTopics=[];
const app=document.getElementById('app');
function shell(stage,progressLabel,pct,controls){app.innerHTML='<main class="shell"><header class="topbar"><div class="brand">SCIENCE • LESSON 3</div><div class="progress-wrap"><div class="progress-bar" style="width:'+pct+'%"></div></div><div class="counter">'+progressLabel+'</div></header><section class="stage">'+stage+'</section>'+controls+'</main>'}
function renderSlide(){const s=slides[slideIndex],pct=((slideIndex+1)/slides.length)*100;const stage='<div class="part">'+s.part+'</div><h1 class="title">'+s.title+'</h1><div class="content">'+s.body+'</div><div class="remember">⭐ Remember: '+s.remember+'</div>';const controls='<nav class="controls"><div class="control-group"><button class="btn secondary" onclick="goSlide(-1)" '+(slideIndex===0?'disabled':'')+'>← Back</button><button class="btn restart" onclick="restartLesson()">↻ Restart</button></div><button class="btn primary" onclick="'+(slideIndex===slides.length-1?'startQuiz()':'goSlide(1)')+'">'+(slideIndex===slides.length-1?'Start Quiz →':'Next →')+'</button></nav><div class="kbd-help">Keyboard: ← Back • → Next</div>';shell(stage,'Slide '+(slideIndex+1)+' of '+slides.length,pct,controls);window.scrollTo(0,0)}
function goSlide(n){slideIndex=Math.max(0,Math.min(slides.length-1,slideIndex+n));renderSlide()}

function startQuiz(){qIndex=0;score=0;locked=false;wrongTopics=[];renderQuiz()}
function renderQuiz(){const item=quiz[qIndex],letters=['A','B','C','D'],pct=((qIndex+1)/quiz.length)*100;const choices=item.choices.map((c,i)=>'<button class="choice" data-i="'+i+'" onclick="answer('+i+')"><b>'+letters[i]+'.</b> '+c+'</button>').join('');const stage='<div class="quiz-head"><div class="part">30-QUESTION TOUCHSCREEN QUIZ</div><span class="level">'+item.level+'</span></div><h1 class="quiz-question">'+item.q+'</h1><div class="choices">'+choices+'</div><div id="feedback"></div>';const controls='<nav class="controls"><button class="btn secondary" onclick="returnLesson()">← Return to Lesson</button><button class="btn restart" onclick="startQuiz()">↻ Restart Quiz</button></nav>';shell(stage,'Question '+(qIndex+1)+' of '+quiz.length,pct,controls);window.scrollTo(0,0)}
function answer(i){if(locked)return;locked=true;const item=quiz[qIndex],buttons=[...document.querySelectorAll('.choice')];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct')});const ok=i===item.a;if(ok){score++}else{buttons[i].classList.add('wrong');wrongTopics.push(item.topic)}const letters=['A','B','C','D'];document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'✅ Correct':'❌ Incorrect')+'</b><p>Correct answer: <b>'+letters[item.a]+'. '+item.choices[item.a]+'</b></p><p>'+item.e+'</p><button class="btn primary next-q" onclick="nextQuestion()">'+(qIndex===quiz.length-1?'See Results →':'Next Question →')+'</button></div>'}
function nextQuestion(){if(!locked)return;if(qIndex===quiz.length-1){renderResults()}else{qIndex++;locked=false;renderQuiz()}}
function renderResults(){const pct=Math.round(score/quiz.length*100),unique=[...new Set(wrongTopics)];let msg=pct>=90?'Excellent work!':pct>=75?'Great effort! Review a few topics and try again.':pct>=60?'Good start! Review your weak topics, then retry.':'Keep going! Return to the lesson and review the key ideas.';const topics=unique.length?'<div class="topics"><h3>Topics to Review</h3><ul>'+unique.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':'<div class="topics"><h3>Topics to Review</h3><p>None — you answered every question correctly!</p></div>';const stage='<div class="score-card"><div class="part">QUIZ COMPLETE</div><h1 class="title">Your Result</h1><div class="score-ring" style="--pct:'+pct+'%"><span>'+pct+'%</span></div><h2>'+score+' / '+quiz.length+'</h2><p>'+msg+'</p>'+topics+'<div class="result-actions"><button class="btn primary" onclick="startQuiz()">↻ Restart Quiz</button><button class="btn secondary" onclick="returnLesson()">← Return to Lesson</button></div></div>';shell(stage,'Final Score',100,'')}
function returnLesson(){slideIndex=0;renderSlide()}
function zoomImage(el){const z=document.getElementById('zoom');z.querySelector('img').src=el.src;z.classList.add('open')}
function closeZoom(){document.getElementById('zoom').classList.remove('open')}
