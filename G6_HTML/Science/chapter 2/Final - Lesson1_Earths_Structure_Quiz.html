<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 6 Science - Earth's Structure: Lesson 1</title>
<style>
:root{--navy:#17365d;--blue:#2474c6;--sky:#e9f6ff;--green:#238a68;--lime:#e8f8df;--gold:#ffd54f;--red:#c94747;--ink:#193047;--muted:#62758a;--card:#fff;--shadow:0 14px 36px #16324f22}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ff,#f8f5ff 55%,#effbea);overflow:hidden}
button{font:inherit}.app{height:100dvh;display:flex;flex-direction:column}.topbar{padding:12px clamp(14px,3vw,32px);background:linear-gradient(100deg,var(--navy),#24598c);color:white;display:flex;align-items:center;gap:14px;box-shadow:0 3px 12px #0002;z-index:2}.brand{font-weight:800;font-size:clamp(16px,2vw,22px);white-space:nowrap}.track{height:10px;background:#ffffff38;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#71e0c1,var(--gold));transition:width .3s}.progress{font-weight:700;font-size:14px;min-width:108px;text-align:right}
.stage{flex:1;min-height:0;padding:clamp(10px,2vw,22px);display:flex;justify-content:center}.panel{width:min(1120px,100%);height:100%;background:#ffffffee;border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.content{flex:1;min-height:0;overflow:auto;padding:clamp(18px,3.5vw,40px);scrollbar-gutter:stable}.content h1{margin:0 0 12px;color:var(--navy);font-size:clamp(30px,5vw,54px);line-height:1.05}.content h2{margin:0 0 18px;color:var(--navy);font-size:clamp(25px,4vw,40px)}.content h3{margin:16px 0 8px;color:var(--blue)}.content p,.content li,.content td,.content th{font-size:clamp(17px,2.1vw,22px);line-height:1.45}.content p{margin:8px 0}.content ul,.content ol{margin:8px 0;padding-left:28px}.content li{margin:6px 0}.lead{font-size:clamp(20px,2.6vw,28px)!important;color:#36546e}.eyebrow{display:inline-block;background:#dceeff;color:#165b9b;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{background:var(--sky);border-left:6px solid var(--blue);border-radius:16px;padding:14px}.tile.green{background:var(--lime);border-color:var(--green)}.tile.gold{background:#fff8d8;border-color:#e0a700}.arrow{font-weight:800;color:var(--blue)}.formula{font-size:clamp(26px,4vw,44px);text-align:center;background:#eef5ff;border-radius:18px;padding:16px;margin:14px 0;color:var(--navy);font-weight:800}.visual{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(280px,1.1fr);gap:20px;align-items:center}.visual img{width:100%;max-height:48vh;object-fit:contain;border-radius:16px;box-shadow:0 6px 20px #18365024;background:#fff}.caption{font-size:15px!important;color:var(--muted);text-align:center}.remember{margin-top:18px;background:linear-gradient(90deg,#fff8c8,#fff1a6);border:2px solid #f0c642;border-radius:15px;padding:12px 16px;font-weight:800;font-size:clamp(17px,2vw,21px)}table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #17365d15}th{background:var(--navy);color:white}th,td{padding:10px 12px;border-bottom:1px solid #d8e4ef;text-align:left}.check{list-style:none;padding-left:0!important}.check li:before{content:"✓";color:var(--green);font-weight:900;margin-right:10px}.question{font-size:clamp(22px,3vw,32px);font-weight:800;line-height:1.3;margin:8px 0 20px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{border:2px solid #bfd2e4;background:#f8fbff;border-radius:15px;padding:15px;text-align:left;min-height:64px;cursor:pointer;font-size:clamp(16px,2vw,21px);font-weight:700;color:var(--ink);transition:.15s}.option:hover{transform:translateY(-1px);border-color:var(--blue)}.option:disabled{cursor:default;transform:none}.option.correct{background:#dff7e9;border-color:#2a9b70}.option.wrong{background:#ffe2e2;border-color:#cf4b4b}.feedback{margin-top:16px;padding:14px 16px;border-radius:15px;background:#eef5ff;font-size:clamp(16px,1.9vw,20px);line-height:1.4}.scoreBig{font-size:clamp(44px,8vw,82px);font-weight:900;color:var(--green);margin:8px 0}.footer{display:flex;gap:10px;padding:12px clamp(14px,3vw,26px);border-top:1px solid #dbe6ef;background:#f9fcff}.footer button{border:0;border-radius:14px;padding:13px 20px;min-height:52px;font-weight:800;cursor:pointer}.back{background:#e6edf5;color:var(--navy)}.restart{background:#fff0c2;color:#674d00}.next{margin-left:auto;background:var(--blue);color:white;min-width:145px}.footer button:disabled{opacity:.4;cursor:not-allowed}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#e7f7f1;color:#17684f;font-weight:800;font-size:14px}.sourceq{border-left:5px solid #7b60c8;background:#f4f0ff;padding:12px 14px;border-radius:12px;margin:10px 0}.small{font-size:15px!important;color:var(--muted)}
@media(max-width:760px){.brand{display:none}.progress{min-width:90px}.visual,.grid,.options{grid-template-columns:1fr}.visual img{max-height:34vh}.footer{padding:9px}.footer button{padding:10px 12px}.next{min-width:110px}.content{padding:18px}.panel{border-radius:17px}}
</style>

const slides=[
{title:"Earth's Structure",body:`<div class="visual"><div><span class="eyebrow">Chapter 2 • Lesson 1</span><h1>Spherical Earth</h1><p class="lead">A short 15–20 minute review of Earth's systems, gravity, formation, density, and layers.</p><p>The chapter opener shows an <b>aurora</b>: charged particles from the Sun interact with Earth's atmosphere, while conditions inside Earth create a magnetic field that attracts the particles toward the poles.</p><p><span class="pill">23 teaching slides</span> <span class="pill">30 quiz questions</span></p></div><img src="${IMAGES.aurora}" alt="Aurora photograph from the textbook"></div>`,remember:"The aurora connects Earth's atmosphere, interior, and poles."},
{title:"What You Must Know",body:`<ul class="check"><li>Earth is shaped like a sphere, but it is not a perfect sphere.</li><li>Earth has five major systems that interact.</li><li>Gravity depends on mass and distance.</li><li>Gravity helped form the solar system and gave Earth a spherical shape.</li><li>Density is mass per unit volume: D = m/V.</li><li>Different densities helped form Earth's layers.</li></ul>`,remember:"Focus on systems → gravity → density → layers."},
{title:"Earth's Shape",body:`<div class="visual"><img src="${IMAGES.earth}" alt="Textbook figure comparing Earth with a perfect sphere"><div><h3>📖 Easy explanation</h3><p>A <b>sphere</b> is shaped like a ball, with all points on the surface an equal distance from the center.</p><p>Earth is <b>somewhat flattened at the poles</b> and has a <b>slight bulge around the equator</b>.</p><p>Its diameter is larger around the equator than at the poles.</p></div></div>`,remember:"Earth is spherical, but slightly flattened at the poles."},
{title:"Size and Clues",body:`<div class="grid"><div class="tile"><h3>Long ago</h3><p>Many people believed Earth was a flat disk with land in the center and water at the edges.</p></div><div class="tile green"><h3>Later clues</h3><p>People studied clues such as Earth's shadow on the Moon during an eclipse.</p></div></div><div class="tile gold"><p><b>Average diameter:</b> almost <b>13,000 km</b>. Earth is the largest of the four rocky planets closest to the Sun.</p></div>`,remember:"Earth's average diameter is almost 13,000 km."},
{title:"Five Earth Systems",body:`<div class="visual"><img src="${IMAGES.systems}" alt="Textbook visual of Earth's five systems"><div><ul><li><b>Atmosphere</b> → gases</li><li><b>Hydrosphere</b> → liquid water</li><li><b>Cryosphere</b> → frozen water</li><li><b>Geosphere</b> → solid Earth</li><li><b>Biosphere</b> → living things</li></ul><p>All five exchange matter and energy.</p></div></div>`,remember:"Air, liquid water, frozen water, solid Earth, life."},
{title:"Atmosphere, Hydrosphere, Cryosphere",body:`<table><tr><th>System</th><th>What the lesson says</th></tr><tr><td><b>Atmosphere</b></td><td>Earth's outermost system; a layer of gases hundreds of kilometers thick. It contains nitrogen, oxygen, carbon dioxide, and traces of other gases.</td></tr><tr><td><b>Hydrosphere</b></td><td>Water on Earth's surface, underground, and liquid water in the atmosphere.</td></tr><tr><td><b>Cryosphere</b></td><td>Frozen water, such as glaciers.</td></tr></table><p class="small">Most hydrosphere water is in salty oceans. Freshwater is in most rivers and lakes and is underground.</p>`,remember:"Hydro = liquid water; cryo = frozen water."},
{title:"Geosphere and Biosphere",body:`<div class="grid"><div class="tile gold"><h3>Geosphere</h3><p>Earth's entire solid body—from the thin layer of soil and sediments at the surface down to the rocky center.</p><p>It is the largest Earth system.</p></div><div class="tile green"><h3>Biosphere</h3><p>All living things on Earth.</p><p>Organisms live within and interact with the atmosphere, hydrosphere, and geosphere.</p></div></div>`,remember:"Geosphere = solid body; biosphere = all living organisms."},
{title:"Systems Interact",body:`<h3>One change can affect other systems</h3><div class="formula">Ocean water evaporates → atmosphere → precipitation on land → salts wash into the ocean</div><p>Water continually moves between the atmosphere and hydrosphere. Earth's systems exchange matter and energy, making Earth suitable for life.</p>`,remember:"Earth's systems do not work alone—they interact."},
{title:"What Is Gravity?",body:`<div class="visual"><img src="${IMAGES.gravity}" alt="Textbook gravity diagrams"><div><p><b>Gravity</b> is the force that every object exerts on all other objects because of their masses.</p><p>Gravity between two objects depends on:</p><ol><li>the objects' <b>masses</b></li><li>the <b>distance</b> between them</li></ol></div></div>`,remember:"Gravity depends on mass + distance."},
{title:"Mass and Distance",body:`<div class="grid"><div class="tile green"><h3>More mass</h3><p>More mass → <span class="arrow">stronger gravitational force</span></p></div><div class="tile"><h3>Closer together</h3><p>Less distance → <span class="arrow">stronger gravitational force</span></p></div></div><p>The textbook diagram uses thicker arrows to show greater force. Row B has the strongest force; row D has the weakest.</p>`,remember:"More mass or less distance makes gravity stronger."},
{title:"Gravity and Earth",body:`<p>All objects on or near Earth are pulled toward Earth's <b>center</b> by gravity.</p><div class="formula">Earth's large mass → greater gravitational force → holds us on the surface</div><p>We do not notice the gravitational force between less massive objects.</p>`,remember:"Earth's gravity pulls objects toward its center."},
{title:"How the Solar System Formed",body:`<div class="visual"><img src="${IMAGES.nebula}" alt="Textbook solar nebula sequence"><div><ol><li>A cloud of gas, ice, and dust was called a <b>nebula</b>.</li><li>Gravity pulled materials closer together.</li><li>The nebula shrank and flattened into a disk.</li><li>The disk began to rotate.</li><li>The dense center formed the Sun.</li><li>Planets formed from remaining material.</li></ol></div></div>`,remember:"Nebula → disk → Sun first → planets from remaining particles."},
{title:"Early Earth Became Spherical",body:`<p>Earth formed about <b>4.6 billion years ago (bya)</b>.</p><div class="formula">Small particles collide and stick → larger objects gain mass → attract more particles → Earth forms</div><p>The young Earth became massive and hot inside. Rocks softened and began to flow. Gravity pulled in irregular bumps, making a relatively even spherical surface.</p>`,remember:"Gravity pulled in bumps and helped make Earth spherical."},
{title:"Density",body:`<p><b>Density</b> is the amount of mass in a material per unit volume.</p><div class="formula">D = m ÷ V</div><p><b>D</b> = density, <b>m</b> = mass, <b>V</b> = volume.</p><p>If two materials have the same volume, the denser material has more mass.</p>`,remember:"Density tells how much mass is packed into each unit of volume."},
{title:"Density and Floating",body:`<div class="grid"><div class="tile green"><h3>Less dense than water</h3><p>A pinewood block floats on the surface.</p></div><div class="tile gold"><h3>More dense than water</h3><p>An iron block is pulled through the water to the bottom.</p></div></div><p>The lesson uses this comparison to explain how Earth's materials separated.</p>`,remember:"Less dense stays higher; more dense moves lower."},
{title:"Formation of Earth's Layers",body:`<div class="visual"><img src="${IMAGES.layers}" alt="Textbook diagram of layers arranged by density"><div><p>Thermal energy melted some of early Earth's solid material. As it flowed, different materials formed layers according to density.</p><ul><li><b>Densest</b> → innermost/bottom layer</li><li><b>Intermediate</b> → middle layer</li><li><b>Least dense</b> → surface/top layer</li></ul></div></div>`,remember:"Most dense sinks inward; least dense stays at the surface."},
{title:"Density Math",body:`<p>Use the same volume units and divide mass by volume.</p><div class="tile"><p><b>Textbook example:</b> 27 g ÷ 10 cm³ = <b>2.7 g/cm³</b></p></div><div class="tile green"><p><b>Practice:</b> Gold has mass 96.5 g and volume 5.00 cm³.</p><p>96.5 ÷ 5.00 = <b>19.3 g/cm³</b></p></div>`,remember:"Density = mass ÷ volume."},
{title:"Original Lesson Review: 1–3",body:`<div class="sourceq"><b>1. The Earth system made mainly of surface water is called the ____.</b><br>Answer: <b>hydrosphere</b>.<br><span class="small">Why: The hydrosphere is liquid water on Earth.</span></div><div class="sourceq"><b>2. Use the term density in a sentence.</b><br>Sample answer: <b>Density is the amount of mass in a material per unit volume.</b></div><div class="sourceq"><b>3. Which is part of the atmosphere? A rock, a tree, oxygen gas, or the ocean?</b><br>Answer: <b>oxygen gas</b>.<br><span class="small">Why: The atmosphere is a mixture of gases, including oxygen.</span></div>`,remember:"Hydrosphere = water; atmosphere includes oxygen gas."},
{title:"Original Lesson Review: 4–5",body:`<div class="sourceq"><b>4. Describe how gravity affected Earth's shape during Earth's formation.</b><br>Answer: Gravity pulled in irregular bumps, so Earth developed a relatively even spherical surface.</div><div class="sourceq"><b>5. Organize Earth's systems.</b><br>Answer: <b>atmosphere, hydrosphere, cryosphere, geosphere, biosphere</b>.</div>`,remember:"Gravity shaped Earth; five systems describe Earth."},
{title:"Original Lesson Review: 6–8",body:`<div class="sourceq"><b>6. Form a hypothesis about the formation of the Moon.</b><br>Answer: <b>This information is not provided clearly in the study material.</b></div><div class="sourceq"><b>7. As Earth became spherical, did it grow larger or become smaller?</b><br>Answer: <b>This size change is not provided clearly in the study material.</b></div><div class="sourceq"><b>8. 3.00 m³ of carbon dioxide has a mass of 5.94 kg. Find density.</b><br>Answer: 5.94 ÷ 3.00 = <b>1.98 kg/m³</b>.</div>`,remember:"If the source does not clearly give an answer, do not guess."},
{title:"Original Checks and Activities: 1",body:`<div class="sourceq"><b>Launch Lab: What happened to the materials?</b><br>Answer: <b>The result is not provided clearly; it must be observed during the activity.</b></div><div class="sourceq"><b>Which Earth system did each material represent?</b><br>Answer: Gravel can represent the geosphere and colored water can represent the hydrosphere. The system represented by corn syrup is not provided clearly.</div><div class="sourceq"><b>Why does Earth exert a greater gravitational force on you than other objects do?</b><br>Answer: Earth has more mass than nearby objects.</div>`,remember:"Use the source's stated result; do not invent an observation."},
{title:"Original Checks and Activities: 2",body:`<div class="sourceq"><b>What factors affect gravitational force?</b><br>Answer: The objects' masses and the distance between them.</div><div class="sourceq"><b>Our solar system formed from what type of cloud?</b><br>Answer: A cloud of gas, ice, and dust called a nebula.</div><div class="sourceq"><b>Can a small object have more mass than a larger object?</b><br>Answer: Yes. A denser material can have more mass for the same volume.</div><div class="sourceq"><b>Which MiniLab materials sank or floated?</b><br>Answer: <b>The observed results are not provided clearly in the study material.</b></div>`,remember:"Gravity: mass + distance. Solar system: nebula."},
{title:"Final 2-Minute Review",body:`<table><tr><th>Big idea</th><th>Fast memory clue</th></tr><tr><td>Earth's shape</td><td>Sphere; flattened poles; equator bulge</td></tr><tr><td>Five systems</td><td>air, liquid water, ice, solid body, life</td></tr><tr><td>Gravity</td><td>more mass + closer distance = stronger</td></tr><tr><td>Formation</td><td>nebula → disk → Sun → planets</td></tr><tr><td>Density</td><td>D = m/V</td></tr><tr><td>Layers</td><td>dense inward; less dense outward</td></tr></table><p class="lead">Ready? Tap <b>Start Quiz</b>.</p>`,remember:"Understand the connections, not only the words."}
];

{q:"What is Earth's average diameter according to the lesson?",o:["Almost 1,300 km","Almost 130,000 km","Almost 13,000 km","Exactly 13 km"],a:2,why:"The textbook says Earth's average diameter is almost 13,000 km.",topic:"Earth's shape",slide:4},

let mode="lesson",index=0,quizIndex=0,score=0,answered=false,topicStats={};
const el=id=>document.getElementById(id),content=el("content"),next=el("next"),back=el("back"),progress=el("progress"),fill=el("fill");
function renderLesson(){mode="lesson";const s=slides[index];content.innerHTML=`<span class="eyebrow">Teaching Slide ${index+1}</span><h2>${s.title}</h2>${s.body}<div class="remember">⭐ Remember: ${s.remember}</div>`;content.scrollTop=0;progress.textContent=`Slide ${index+1} of ${slides.length}`;fill.style.width=`${((index+1)/(slides.length+quiz.length))*100}%`;back.disabled=index===0;next.disabled=false;next.textContent=index===slides.length-1?"Start Quiz ➡":"Next ➡"}
function renderQuiz(){mode="quiz";answered=false;const x=quiz[quizIndex];const pic=x.img?`<img src="${IMAGES[x.img]}" alt="Textbook visual for this question" style="width:min(520px,100%);max-height:250px;object-fit:contain;border-radius:14px;display:block;margin:0 auto 14px">`:"";content.innerHTML=`<span class="eyebrow">Quiz ${quizIndex+1} of ${quiz.length}</span>${pic}<div class="question">${x.q}</div><div class="options">${x.o.map((v,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join("")}</div><div id="feedback"></div>`;content.scrollTop=0;content.querySelectorAll(".option").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));progress.textContent=`Quiz ${quizIndex+1} of ${quiz.length}`;fill.style.width=`${((slides.length+quizIndex+1)/(slides.length+quiz.length))*100}%`;back.disabled=false;next.disabled=true;next.textContent=quizIndex===quiz.length-1?"See Score ➡":"Next Question ➡"}
function choose(i){if(answered)return;answered=true;const x=quiz[quizIndex],buttons=[...content.querySelectorAll(".option")];buttons.forEach((b,n)=>{b.disabled=true;if(n===x.a)b.classList.add("correct");else if(n===i)b.classList.add("wrong")});const ok=i===x.a;if(ok)score++;if(!topicStats[x.topic])topicStats[x.topic]={right:0,total:0,slide:x.slide};topicStats[x.topic].total++;if(ok)topicStats[x.topic].right++;el("feedback").innerHTML=`<div class="feedback"><b>${ok?"✅ Correct":"❌ Incorrect"}</b><br>Correct answer: <b>${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br><b>Why:</b> ${x.why}</div>`;next.disabled=false}
function showScore(){mode="score";const pct=Math.round(score/quiz.length*100),entries=Object.entries(topicStats),strong=entries.filter(([,v])=>v.right/v.total>=.75),weak=entries.filter(([,v])=>v.right/v.total<.75);content.innerHTML=`<span class="eyebrow">Quiz Complete</span><h2>Final Score</h2><div class="scoreBig">${score} / ${quiz.length}</div><p class="lead">${pct}%</p><div class="grid"><div class="tile green"><h3>🌟 Strong Topics</h3>${strong.length?`<ul>${strong.map(([k,v])=>`<li>${k} (${v.right}/${v.total})</li>`).join("")}</ul>`:"<p>Keep practicing to build strong topics.</p>"}</div><div class="tile gold"><h3>⚠️ Topics to Review</h3>${weak.length?`<ul>${weak.map(([k,v])=>`<li>${k} — review Slide ${v.slide}</li>`).join("")}</ul>`:"<p>Excellent—no weak topics found.</p>"}</div></div><div class="remember">⭐ Review the suggested slides, then restart the quiz.</div>`;content.scrollTop=0;progress.textContent="Results";fill.style.width="100%";back.disabled=false;next.disabled=false;next.textContent="Restart Quiz ↻"}
next.onclick=()=>{if(mode==="lesson"){if(index<slides.length-1){index++;renderLesson()}else{quizIndex=0;score=0;topicStats={};renderQuiz()}}else if(mode==="quiz"){if(!answered)return;if(quizIndex<quiz.length-1){quizIndex++;renderQuiz()}else showScore()}else{quizIndex=0;score=0;topicStats={};renderQuiz()}};
back.onclick=()=>{if(mode==="lesson"){if(index>0){index--;renderLesson()}}else if(mode==="quiz"){if(quizIndex===0){mode="lesson";index=slides.length-1;renderLesson()}else{quizIndex--;renderQuiz()}}else{mode="quiz";quizIndex=quiz.length-1;renderQuiz()}};
el("restart").onclick=()=>{if(confirm("Restart the lesson and clear the quiz score?")){mode="lesson";index=0;quizIndex=0;score=0;answered=false;topicStats={};renderLesson()}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&!next.disabled)next.click();if(e.key==="ArrowLeft"&&!back.disabled)back.click()});
renderLesson();
</script>
</body>
</html>
