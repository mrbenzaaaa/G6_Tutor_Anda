<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sources and Uses of Minerals - Touchscreen Tutor</title>
<style>
:root{--navy:#152b52;--blue:#2067a8;--sky:#e9f5ff;--gold:#ffc857;--ink:#172033;--green:#168a67;--red:#c53d52;--paper:#fff;--muted:#60708a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Trebuchet MS",sans-serif;background:linear-gradient(135deg,#dff4ff,#f7ecff);color:var(--ink)}
button{font:inherit}.app{min-height:100vh;padding:16px}.shell{max-width:1120px;margin:auto;background:rgba(255,255,255,.94);border-radius:24px;box-shadow:0 18px 50px #18385b2b;overflow:hidden;border:1px solid #fff}
.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{font-weight:800}.progress{font-weight:700;white-space:nowrap}.track{height:8px;background:#dce7f3}.fill{height:100%;background:linear-gradient(90deg,#2fc49b,var(--gold));transition:width .25s}
.screen{display:none;min-height:640px;padding:clamp(18px,3vw,34px);animation:fade .2s ease}.screen.active{display:flex;flex-direction:column}@keyframes fade{from{opacity:.25;transform:translateY(5px)}}
.kicker{text-transform:uppercase;color:var(--blue);font-weight:900;letter-spacing:.08em;font-size:.82rem}.title{font-size:clamp(1.75rem,4vw,2.8rem);line-height:1.05;margin:7px 0 18px;color:var(--navy)}h2{color:var(--navy)}p,li,td,th{font-size:clamp(1rem,1.8vw,1.22rem);line-height:1.45}.lead{font-size:clamp(1.12rem,2.2vw,1.42rem)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--sky);border-radius:17px;padding:16px;border:2px solid #d1e9fb}.card h3{margin:0 0 8px;color:var(--blue)}.gold{background:#fff4ce;border-color:#ffe08a}.green{background:#e8fbf5;border-color:#b9ecd9}.pink{background:#fff0f4;border-color:#ffd0dc}
.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:9px 12px;border-radius:999px;background:#e5effb;font-weight:800;color:#24476d}.arrow{font-size:1.35rem;font-weight:900;color:var(--blue);text-align:center}.equation{background:#172b4d;color:#fff;border-radius:16px;padding:15px;text-align:center;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:800}.remember{margin-top:auto;background:#fff6cf;border:2px solid #ffd55f;border-left-width:9px;border-radius:14px;padding:12px 15px;font-weight:800;font-size:clamp(1rem,1.8vw,1.18rem)}
.source{display:grid;grid-template-columns:minmax(260px,.95fr) 1.2fr;gap:20px;align-items:center}.source img{width:100%;max-height:400px;object-fit:contain;border-radius:14px;background:#fff;box-shadow:0 6px 20px #1e38552b}.caption{text-align:center;color:var(--muted);font-size:.85rem;margin-top:5px}
table{width:100%;border-collapse:separate;border-spacing:0;border:2px solid #cbdced;border-radius:14px;overflow:hidden}th{background:var(--navy);color:#fff;text-align:left}th,td{padding:10px;border-bottom:1px solid #d9e5ef}tr:last-child td{border-bottom:0}.small td,.small th{font-size:.95rem;padding:7px}
.nav{display:flex;gap:12px;padding:14px 20px;background:#edf4fa;align-items:center}.nav button,.bigbtn{border:0;border-radius:14px;padding:13px 20px;min-height:50px;font-weight:900;cursor:pointer}.back{background:#d7e2ec;color:#243c55}.next,.bigbtn{background:var(--blue);color:#fff}.restart{background:#fff;color:#53657a;border:2px solid #cdd9e5!important;margin-left:auto}.nav button:disabled{opacity:.35;cursor:not-allowed}
.quizbox{max-width:850px;margin:auto;width:100%}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}.qtext{font-size:clamp(1.3rem,2.7vw,1.8rem);font-weight:800;margin:18px 0}.choices{display:grid;gap:11px}.choice{border:2px solid #cbdceb;background:#fff;text-align:left;border-radius:14px;padding:15px;font-size:1.08rem;cursor:pointer}.choice:hover{border-color:var(--blue);background:#eff8ff}.choice.correct{background:#dcf7ed;border-color:var(--green)}.choice.wrong{background:#ffe6eb;border-color:var(--red)}.choice:disabled{cursor:default;color:var(--ink)}.letter{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#e6eef7;font-weight:900;margin-right:9px}.feedback{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:700}.feedback.show{display:block}.feedback.ok{background:#dcf7ed;color:#08684c}.feedback.no{background:#ffe5ea;color:#96263b}.nextq{display:none;margin-top:14px}.result{text-align:center}.scorecircle{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;margin:15px auto;background:conic-gradient(var(--green) var(--pct),#dfe8ef 0);position:relative}.scorecircle:after{content:"";position:absolute;inset:13px;background:#fff;border-radius:50%}.scorecircle span{z-index:1;font-size:1.8rem;font-weight:900}.weak{text-align:left;max-width:650px;margin:18px auto;background:#fff4ce;border-radius:14px;padding:15px}
.only-mobile{display:none}@media(max-width:760px){.app{padding:0}.shell{border-radius:0;min-height:100vh}.screen{min-height:calc(100vh - 132px)}.grid2,.grid3,.source{grid-template-columns:1fr}.source img{max-height:300px}.nav{position:sticky;bottom:0}.nav button{padding:11px 13px}.restart{margin-left:0}.brand{font-size:.9rem}.only-mobile{display:inline}table{display:block;overflow-x:auto}.small td,.small th{font-size:.84rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</main></div>

const slides=[
{k:'Part 1 • What You Must Know',t:'Sources and Uses of Minerals',b:`<p class="lead">In this lesson, you will learn:</p><div class="grid2"><div class="card"><h3>⛏️ Resources</h3><p>Why minerals are valuable, what an <b>ore</b> is, and how metallic and nonmetallic resources are used.</p></div><div class="card gold"><h3>💎 Gemstones</h3><p>What makes a mineral a gemstone and why gemstones are useful in jewelry and industry.</p></div><div class="card green"><h3>🏠 Daily life</h3><p>Match mineral resources with products in homes, roads, transportation, food, and technology.</p></div><div class="card pink"><h3>🧮 Math skill</h3><p>Find the <b>percent yield</b> of metal obtained from ore.</p></div></div>`,r:'Mineral resources are valuable because people use them in many parts of daily life.'},
{k:'Start with the picture',t:'Is This Lava?',b:`<div class="source"><div><img src="${IMG.p1}" alt="Molten iron ore from the study material"><div class="caption">From the Study Material</div></div><div><p class="lead">The glowing material is <b>not lava</b>. It is <b>molten iron ore</b>.</p><div class="card gold"><p>Iron is mixed with <b>carbon</b> in large furnaces.</p><div class="arrow">iron ore + carbon → hot molten mixture → cleaner, stronger iron metal</div></div><p>This is one example of a metal resource used every day.</p></div></div>`,r:'The photo shows molten iron ore, not lava.'},
{k:'Chapter connection',t:'Mineral Basics — Quick Review',b:`<div class="source"><div><img src="${IMG.p7}" alt="Chapter 3 study guide"><div class="caption">From the Study Material</div></div><div><ul><li>A <b>mineral</b> is a naturally occurring, inorganic solid with a definite chemical composition and crystalline form.</li><li>Common rock-forming minerals come from the <b>silicate</b> and <b>non-silicate</b> families.</li><li>Minerals form by <b>crystallization</b> of hot and cool solutions and by cooling <b>magma</b> and <b>lava</b>.</li><li>Minerals are identified by color, <b>luster, streak, hardness, cleavage, fracture, density</b>, and other special properties.</li></ul></div></div>`,r:'A mineral has a definite composition and crystalline form; properties help identify it.'},
{k:'Part 2 • Easy Lesson',t:'Mineral Resources Are Everywhere',b:`<div class="source"><div><img src="${IMG.p2}" alt="Mineral resources and bauxite page"><div class="caption">From the Study Material</div></div><div><p>The average person uses <b>22,000 kg</b> of mineral resources each year.</p><div class="grid2"><div class="card"><b>Copper</b><br>electric wiring and plumbing fixtures</div><div class="card"><b>Quartz</b><br>glass and ceramics</div><div class="card"><b>Industries</b><br>automotive; agriculture and food production</div><div class="card"><b>Construction</b><br>roads, homes, and buildings</div></div><p>Mineral resources can be deep within Earth or at the surface, such as a salt lake deposit.</p></div></div>`,r:'Mineral resources are used in wiring, plumbing, glass, ceramics, industries, and construction.'},
{k:'Key vocabulary',t:'What Is an Ore?',b:`<div class="grid2"><div class="card gold"><h3>ORE</h3><p><b>Rock that contains high enough concentrations of a desired substance, such as a metal, so that it can be mined for a profit.</b></p></div><div class="card"><h3>Example: bauxite</h3><p><b>Bauxite</b> is an ore and a profitable source of aluminum. Its aluminum is used in electronics, transportation, and the food industry.</p></div></div><div class="equation">enough desired substance + can be mined for profit = ore</div><p>An ore is not limited to iron. The statement “an ore contains only iron” is false.</p>`,r:'Ore means enough of a desired substance to mine at a profit.'},
{k:'Metallic mineral resources',t:'Iron: From Minerals to Steel',b:`<div class="grid2"><div class="card"><h3>Sources of iron</h3><p><b>Hematite (Fe₂O₃)</b> and <b>magnetite (Fe₃O₄)</b> are important sources of iron.</p></div><div class="card green"><h3>Iron → steel</h3><p>Iron is the main ingredient in steel used for buildings, bridges, automobiles, and trains.</p></div></div><div class="chips"><span class="chip">nails</span><span class="chip">screws</span><span class="chip">fixtures</span></div><p>Iron is also a common ingredient in these home products.</p>`,r:'Hematite and magnetite supply iron; iron is the main ingredient in steel.'},
{k:'Metallic mineral resources',t:'Aluminum Comes from Bauxite',b:`<div class="grid2"><div><div class="card gold"><p>Aluminum is abundant in Earth’s crust, but it rarely occurs as a native element.</p></div><div class="arrow">bauxite is mined → aluminum is extracted → products are made</div></div><div><p><b>Bauxite</b> is a mixture of aluminum and other elements.</p><p>Uses include aluminum cans for food and beverages and products for electronics and transportation.</p><p>The mining industry processes more than <b>2.7 × 10¹⁰ kg</b> of aluminum each year.</p></div></div>`,r:'Aluminum is extracted from mined bauxite.'},
{k:'Visual interpretation',t:'A Home Full of Mineral Uses',b:`<div class="source"><div><img src="${IMG.p3}" alt="Labeled house showing mineral uses"><div class="caption">From the Study Material • Figure 15</div></div><div><table class="small"><tr><th>Resource</th><th>Use shown</th></tr><tr><td>Gypsum</td><td>concrete, drywall</td></tr><tr><td>Silica</td><td>glass, ceramics</td></tr><tr><td>Lithium / tungsten</td><td>batteries / lightbulbs</td></tr><tr><td>Copper</td><td>wires, brass fixtures, plumbing</td></tr><tr><td>Nickel / iron</td><td>stainless steel / nails and faucets</td></tr><tr><td>Sand and gravel</td><td>concrete</td></tr></table><p>The figure also labels zinc, beryllium, fluorite, boron, cobalt, clays, halite, titanium, sulfur, aluminum, molybdenum, lead, and micas.</p></div></div>`,r:'Many parts of a home and car come from mineral resources.'},
{k:'Rare metals',t:'Gold and Platinum',b:`<div class="grid2"><div class="card gold"><h3>Gold</h3><ul><li>1 part gold to <b>4 billion</b> parts rock in Earth’s crust</li><li>Lustrous yellow color and metallic properties</li><li>Used for jewelry</li><li>Conducts electricity and does not corrode</li><li>Scientific and industrial uses</li></ul></div><div class="card green"><h3>Platinum</h3><ul><li>Used in catalytic converters</li><li>Converters change harmful gases into <b>CO₂ and water</b></li><li>Being researched for fuel cells in electric cars</li></ul></div></div>`,r:'Gold is rare and useful; platinum is important to technology and cleaner vehicle systems.'},
{k:'Nonmetallic mineral resources',t:'Minerals That Are Not Ores',b:`<div class="source"><div><img src="${IMG.p4}" alt="Construction resources and percent yield page"><div class="caption">From the Study Material • Figure 16</div></div><div><p>Humans use minerals that are <b>not ores</b> every day.</p><div class="chips"><span class="chip">road materials</span><span class="chip">ceramic products</span><span class="chip">building stone</span><span class="chip">fertilizers</span></div><p>Building and parking-lot construction require several rock and mineral resources.</p><p><b>Sand</b> is a nonmetallic mineral resource. It is commonly made of particles of <b>quartz (SiO₂)</b>.</p></div></div>`,r:'Road materials, ceramics, building stone, fertilizers, and sand are nonmetallic resources.'},
{k:'Math skill',t:'How to Find Percent Yield',b:`<p>The amount of metal that can be obtained from an ore is called the <b>percent yield</b>.</p><div class="equation">percent yield = (metal obtained ÷ amount of ore) × 100%</div><div class="grid3"><div class="card"><b>1. Fraction</b><br>308 kg Fe ÷ 500 kg ore</div><div class="card"><b>2. Decimal</b><br>308 ÷ 500 = 0.616</div><div class="card green"><b>3. Percent</b><br>0.616 × 100 = <b>61.6%</b></div></div>`,r:'Divide metal obtained by ore processed, then multiply by 100%.'},
{k:'Gemstones',t:'Beauty and Useful Properties',b:`<div class="source"><div><img src="${IMG.p5}" alt="Gemstones table and mineral mini lab"><div class="caption">From the Study Material • Table 3</div></div><div><div class="card pink"><p>A <b>gemstone</b> is a rare and attractive mineral that can be worn as jewelry.</p></div><ul><li>Cutting and polishing give diamonds and rubies special characteristics.</li><li>A cut and polished diamond has brilliant luster.</li><li>Diamond hardness = <b>10</b>; corundum hardness = <b>9</b> on Mohs’ scale.</li><li>Their hardness makes them useful in abrasives and cutting tools.</li><li>Many industrial gemstones are synthetic stones made by humans.</li></ul></div></div>`,r:'Gemstones can be valued for beauty and used in industry because of physical properties such as hardness.'},
{k:'Gemstone table',t:'Gemstone → Mineral Name and Formula',b:`<table><tr><th>Gemstone</th><th>Mineral name</th><th>Chemical formula</th></tr><tr><td>Emerald</td><td>beryl</td><td>Be₃Al₂Si₆O₁₈</td></tr><tr><td>Sapphire</td><td>corundum</td><td>Al₂O₃</td></tr><tr><td>Ruby</td><td>corundum</td><td>Al₂O₃</td></tr><tr><td>Diamond</td><td>diamond</td><td>C</td></tr><tr><td>Peridot</td><td>olivine</td><td>(Mg,Fe)₂SiO₄</td></tr><tr><td>Amethyst</td><td>quartz</td><td>SiO₂</td></tr></table><p><b>Important:</b> Sapphire and ruby are both forms of corundum in this table.</p>`,r:'Match each gemstone with the mineral name shown in Table 3.'},
{k:'Activities from the lesson',t:'Properties Help Explain Uses',b:`<div class="grid2"><div class="card"><h3>Launch Lab: card sets</h3><p>Make a three-card set: <b>mineral name → properties → use</b>. The silver example uses “shiny and easily bent.”</p></div><div class="card green"><h3>MiniLab: talc and sand</h3><p>Observe and feel talc. Rub a nail with talc for 20 strokes. Repeat with sand. Compare how they feel and their effect on the nail.</p></div></div><p>The questions ask why <b>talc</b> is used in body powder, why <b>sand</b> is better than talc as an abrasive, and why minerals are valuable in daily life.</p><p class="card gold"><b>Source limit:</b> The observation results are not provided; the student must obtain them from the activity.</p>`,r:'Connect a mineral’s properties to how people use it.'},
{k:'Part 3 • Important Vocabulary',t:'Vocabulary You Must Know',b:`<table><tr><th>Vocabulary</th><th>Meaning from the material</th><th>Memory tip</th></tr><tr><td><b>ore</b></td><td>Rock with enough desired substance to be mined for a profit.</td><td>Enough + profit</td></tr><tr><td><b>gemstone</b></td><td>A rare and attractive mineral that can be worn as jewelry.</td><td>Rare + attractive</td></tr><tr><td><b>percent yield</b></td><td>The amount of metal that can be obtained from an ore.</td><td>metal ÷ ore × 100</td></tr><tr><td><b>metallic mineral resource</b></td><td>Resource such as ores of iron and aluminum used every day.</td><td>Iron, aluminum</td></tr><tr><td><b>nonmetallic mineral resource</b></td><td>Mineral resource that is not an ore; examples include road materials, ceramics, stone, fertilizers, and sand.</td><td>Not an ore</td></tr></table>`,r:'Know ore and gemstone exactly; use the material’s descriptions for the resource groups.'},
{k:'Part 4 • Easy-to-Confuse Points',t:'Compare the Main Groups',b:`<table><tr><th>Idea</th><th>What it means</th><th>Examples from the material</th></tr><tr><td>Ore</td><td>Enough desired substance to mine for profit</td><td>Bauxite</td></tr><tr><td>Metallic resources</td><td>Sources of metals</td><td>Hematite, magnetite, bauxite, gold, platinum</td></tr><tr><td>Nonmetallic resources</td><td>Resources that are not ores</td><td>Road materials, ceramics, building stone, fertilizers, sand</td></tr><tr><td>Gemstone</td><td>Rare and attractive mineral worn as jewelry</td><td>Emerald, sapphire, ruby, diamond, peridot, amethyst</td></tr></table><div class="card gold"><b>Do not mix up:</b> Not every mineral resource is an ore. Gemstone and ore deposits are not described as evenly distributed.</div>`,r:'Ore depends on concentration and profit; gemstone depends on rarity and attractiveness.'},
{k:'Lesson Review — taught before the quiz',t:'Review Questions and Answers',b:`<div class="source"><div><img src="${IMG.p6}" alt="Lesson 3 review page"><div class="caption">From the Study Material</div></div><div><ul><li>Aluminum is extracted from <b>bauxite ore</b>.</li><li>An important source of iron ore is <b>hematite</b>.</li><li>The common ingredient of steel is <b>iron</b>.</li><li>Five derived products: wiring, plumbing fixtures, glass, ceramics, and aluminum cans.</li><li>Nonmetallic products may include road materials, ceramic products, building stone, fertilizers, and concrete made with sand and gravel.</li><li>A laboratory-grown gem-quality diamond can be useful as a gemstone, but it is not a mineral because the chapter defines a mineral as <b>naturally occurring</b>.</li></ul></div></div>`,r:'Know bauxite → aluminum, hematite → iron, and iron → steel.'},
{k:'Review math',t:'Percent Yield Practice',b:`<div class="grid3"><div class="card"><h3>Ground ore</h3><p>410 ÷ 500 × 100 = <b>82%</b></p><p>Improvement: 82% − 61.6% = <b>20.4 percentage points</b></p></div><div class="card gold"><h3>Gold Rush</h3><p>2,700 ÷ 5,000 × 100 = <b>54%</b></p></div><div class="card green"><h3>Bauxite sample</h3><p>750 ÷ 3,000 × 100 = <b>25%</b></p></div></div><p>Always identify the <b>metal obtained</b> and the <b>ore processed</b> before calculating.</p>`,r:'All percent-yield problems use metal obtained ÷ ore processed × 100%.'},
{k:'Parts 5–6 • Memory Tricks and Exam Focus',t:'Fast Memory Clues',b:`<div class="grid2"><div class="card gold"><h3>ORE</h3><p><b>O</b>btain enough desired substance<br><b>R</b>esource in rock<br><b>E</b>arns a profit</p></div><div class="card pink"><h3>GEM</h3><p><b>G</b>ood-looking<br><b>E</b>xceptionally rare<br><b>M</b>ineral worn as jewelry</p></div><div class="card"><h3>Iron chain</h3><p>hematite / magnetite → iron → steel</p></div><div class="card green"><h3>Aluminum chain</h3><p>bauxite → aluminum → cans and other products</p></div></div><p><b>Exam focus:</b> definitions, resource examples, gemstone table, property-to-use links, and percent-yield calculations.</p>`,r:'Remember the two source chains: iron minerals → iron → steel; bauxite → aluminum.'},
{k:'Part 7 • Final 4-Minute Review',t:'Remember These Before the Test',b:`<div class="grid2"><div><h2>Memorize</h2><ul><li><b>Ore:</b> enough desired substance to mine for profit</li><li><b>Gemstone:</b> rare, attractive mineral worn as jewelry</li><li><b>Bauxite → aluminum</b></li><li><b>Hematite + magnetite → iron → steel</b></li><li><b>Sand commonly contains quartz (SiO₂)</b></li></ul></div><div><h2>Understand</h2><ul><li>Properties help explain mineral uses.</li><li>Metallic and nonmetallic resources have different examples.</li><li>Diamond and corundum hardness supports abrasive and cutting-tool uses.</li><li><b>Percent yield = metal ÷ ore × 100%</b></li><li>Mineral deposits are not evenly distributed.</li></ul></div></div><button class="bigbtn" onclick="startQuiz()">Start 30-Question Quiz →</button>`,r:'You are ready when you can explain ore, resource groups, gemstones, and percent yield.'}
];

let slide=0,mode='lesson',qi=0,score=0,answered=false,miss=[];
const lesson=document.getElementById('lesson'),nav=document.getElementById('lessonNav'),ptext=document.getElementById('progressText'),fill=document.getElementById('fill'),backBtn=document.getElementById('backBtn'),nextBtn=document.getElementById('nextBtn'),restartBtn=document.getElementById('restartBtn');
function renderSlide(){mode='lesson';nav.style.display='flex';const s=slides[slide];lesson.innerHTML=`<article class="screen active"><div class="kicker">${s.k}</div><h1 class="title">${s.t}</h1>${s.b}<div class="remember">⭐ Remember: ${s.r}</div></article>`;ptext.textContent=`Slide ${slide+1} of ${slides.length}`;fill.style.width=`${(slide+1)/slides.length*100}%`;backBtn.disabled=slide===0;nextBtn.textContent=slide===slides.length-1?'Start Quiz →':'Next →';window.scrollTo(0,0)}
function startQuiz(){mode='quiz';qi=0;score=0;miss=[];renderQuestion()}
function renderQuestion(){nav.style.display='none';answered=false;const x=quiz[qi];lesson.innerHTML=`<article class="screen active"><div class="quizbox"><div class="qmeta"><span>Question ${qi+1} of 30</span><span>Score: ${score}</span></div><div class="kicker">${qi<10?'Easy':qi<20?'Medium':'Hard'} • ${x.t}</div><div class="qtext">${x.q}</div><div class="choices">${x.o.map((v,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${'ABCD'[i]}</span>${v}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="nextQ" class="bigbtn nextq" onclick="nextQuestion()">${qi===29?'See My Results':'Next Question →'}</button></div></article>`;ptext.textContent=`Question ${qi+1} of 30`;fill.style.width=`${(qi+1)/30*100}%`;window.scrollTo(0,0)}
function answer(i){if(answered)return;answered=true;const x=quiz[qi],buttons=[...document.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);buttons[x.a].classList.add('correct');const ok=i===x.a;if(ok){score++}else{buttons[i].classList.add('wrong');miss.push(x.t)}const f=document.getElementById('feedback');f.className=`feedback show ${ok?'ok':'no'}`;f.innerHTML=`${ok?'✅ Correct!':'❌ Incorrect.'} Correct answer: <b>${'ABCD'[x.a]}. ${x.o[x.a]}</b><br>${x.e}`;document.getElementById('nextQ').style.display='inline-block'}
function nextQuestion(){if(qi<29){qi++;renderQuestion()}else renderResult()}
function renderResult(){const pct=Math.round(score/30*100),counts={};miss.forEach(x=>counts[x]=(counts[x]||0)+1);const weak=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([x,n])=>`<li>${x} (${n})</li>`).join('');lesson.innerHTML=`<article class="screen active result"><div class="kicker">Quiz Complete</div><h1 class="title">${pct>=80?'Excellent work!':pct>=60?'Good effort!':'Keep practicing — you can do it!'}</h1><div class="scorecircle" style="--pct:${pct}%"><span>${score}/30<br>${pct}%</span></div><div class="weak"><h2>Topics to Review</h2>${weak?`<ul>${weak}</ul>`:'<p>None — you answered every question correctly!</p>'}</div><div><button class="bigbtn" onclick="startQuiz()">↻ Restart Quiz</button> <button class="bigbtn" onclick="slide=0;renderSlide()">← Return to Lesson</button></div></article>`;ptext.textContent='Final Results';fill.style.width='100%';window.scrollTo(0,0)}
backBtn.onclick=()=>{if(slide>0){slide--;renderSlide()}};nextBtn.onclick=()=>{if(slide<slides.length-1){slide++;renderSlide()}else startQuiz()};restartBtn.onclick=()=>{slide=0;renderSlide()};
document.addEventListener('keydown',e=>{if(mode==='lesson'&&e.key==='ArrowRight')nextBtn.click();if(mode==='lesson'&&e.key==='ArrowLeft')backBtn.click()});renderSlide();
</script></body></html>
