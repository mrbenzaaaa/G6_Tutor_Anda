<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#225fa5">
  <title>Grade 6 Learning Library</title>
  <style>
    :root{--ink:#19304e;--muted:#61758f;--blue:#245cad;--blue2:#1678a7;--light:#e8f3ff;--card:#fff;--line:#e2eaf3;--focus:#f49b28}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100svh;color:var(--ink);background:radial-gradient(ellipse at 8% 0%,#deecff 0,transparent 38%),radial-gradient(ellipse at 98% 100%,#d9f6ed 0,transparent 40%),#f5f8fc;font:500 17px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
    button,input{font:inherit}
    button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
    [hidden]{display:none!important}
    .shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:28px 0 58px}
    .masthead{display:flex;align-items:center;gap:12px;padding:8px 0 18px;margin-bottom:27px;border-bottom:1px solid #dce5f2}
    .logo{height:43px;width:43px;display:grid;place-items:center;border-radius:14px;color:#fff;font-size:22px;font-weight:900;background:linear-gradient(135deg,#3b6acb,#16a9a2);box-shadow:0 7px 14px #266ac037}
    .brand{font-size:13px;color:#526c90;font-weight:900;text-transform:uppercase;letter-spacing:.15em}
    h1{font-size:clamp(30px,4vw,48px);line-height:1.13;letter-spacing:-.035em;margin:0 0 25px}
    .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:18px}
    .subject-card{position:relative;width:100%;min-height:124px;padding:28px 26px;border-radius:23px;border:1px solid #d9e5f8;box-shadow:0 10px 25px #2c53821a;text-align:left;font-size:clamp(21px,2.4vw,26px);font-weight:850;line-height:1.24;color:#214c92;background:#fff;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;overflow-wrap:anywhere}
    .subject-card::after{content:'›';position:absolute;right:22px;top:50%;transform:translateY(-51%);font-size:34px;line-height:1;opacity:.45}
    .subject-card:nth-child(4n+2){background:#f3fbff;color:#12658e;border-color:#d3eff9}
    .subject-card:nth-child(4n+3){background:#f6fff9;color:#226f5a;border-color:#d8f2e4}
    .subject-card:nth-child(4n+4){background:#fffaf0;color:#8a5c20;border-color:#f5e6ca}
    .subject-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px #2c53822c;border-color:#9fbfeb}
    .back{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-bottom:21px;padding:10px 19px;border-radius:14px;border:1px solid #c9d9ed;background:#fff;color:var(--blue);font-weight:850;cursor:pointer}
    .back:hover{background:#eaf3ff}
    .search-panel{display:flex;align-items:end;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px #27436b0d;border-radius:20px;padding:20px;margin-bottom:25px}
    .search-group{flex:1;min-width:min(100%,220px)}
    label{display:block;font-size:14px;color:#536987;font-weight:850;margin-bottom:7px}
    input[type=search]{display:block;width:100%;min-height:55px;padding:10px 16px;border:2px solid #cbd9ec;border-radius:13px;color:var(--ink);background:#fbfdff;font-size:17px}
    input[type=search]:focus{border-color:#337ac8}
    .clear{min-height:55px;padding:10px 22px;border:0;border-radius:13px;background:#ebf2fc;color:#26599c;font-weight:900;cursor:pointer}
    .clear:hover{background:#dceafd}
    .lesson-group{margin:22px 0 29px}
    .group-heading{font-size:21px;line-height:1.3;font-weight:850;overflow-wrap:anywhere;margin:0 0 13px;border-left:5px solid #49a6c3;padding:3px 0 3px 14px}
    .lesson-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
    .lesson-link{display:flex;align-items:center;gap:15px;min-height:69px;padding:15px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:#244e86;text-decoration:none;font-weight:750;line-height:1.36;box-shadow:0 5px 12px #30496c0c;overflow-wrap:anywhere}
    .lesson-link::before{content:'📘';font-size:21px;flex:none}
    .lesson-link::after{content:'↗';font-size:22px;margin-left:auto;flex:none;color:#6092b0}
    .lesson-link:hover{border-color:#8bc1e8;background:#f3f9ff;text-decoration:underline}
    .empty{padding:28px;border:1px dashed #b9cbe1;border-radius:18px;background:white;text-align:center;font-size:20px;font-weight:750;color:#677993}
    @media(max-width:600px){.shell{width:calc(100% - 24px);padding-top:16px}.masthead{margin-bottom:22px}.subject-grid{grid-template-columns:1fr;gap:12px}.subject-card{min-height:96px;padding:21px 23px}.lesson-link{padding:14px 15px;min-height:67px}.search-panel{padding:15px;gap:11px}.clear{width:100%}.group-heading{font-size:18px}h1{font-size:30px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>

  <script>
    'use strict';
    const LESSONS = JSON.parse(document.getElementById('lesson-data').textContent);
    const collator = new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
    const picker = document.getElementById('subject-picker');
    const browser = document.getElementById('lesson-browser');
    const subjectButtons = document.getElementById('subject-buttons');
    const heading = document.getElementById('subject-heading');
    const groupsHost = document.getElementById('lesson-groups');
    const search = document.getElementById('lesson-search');
    const clear = document.getElementById('clear-button');
    const back = document.getElementById('back-button');
    let activeSubject = null;

    function lessonHref(relativePath) {
      // Encode EACH path part, preserving slashes and handling spaces, &, #, and Thai.
      return relativePath.split('/').map(encodeURIComponent).join('/');
    }
    function make(tag,className,textContent) {
      const node = document.createElement(tag);
      if(className) node.className=className;
      if(textContent!==undefined) node.textContent=textContent;
      return node;
    }
    function showHome() {
      activeSubject=null;
      search.value='';
      groupsHost.replaceChildren();
      browser.hidden=true;
      picker.hidden=false;
      window.scrollTo(0,0);
      document.getElementById('home-heading').focus({preventScroll:true});
    }
    function openSubject(subject) {
      activeSubject=subject;
      search.value='';
      heading.textContent=subject;
      picker.hidden=true;
      browser.hidden=false;
      renderLessons();
      window.scrollTo(0,0);
      heading.focus({preventScroll:true});
    }
    function groupCompare(a,b) {
      const max=Math.max(a.length,b.length);
      for(let i=0;i<max;i++) {
        if(i===a.length)return -1;
        if(i===b.length)return 1;
        const c=collator.compare(a[i],b[i]);
        if(c)return c;
      }
      return 0;
    }
    function renderLessons() {
      const query=search.value.trim().toLocaleLowerCase();
      const matching=LESSONS.filter(lesson=>lesson.subject===activeSubject &&
        (!query || [lesson.title,...lesson.folders,lesson.path].join(' ').toLocaleLowerCase().includes(query)));
      groupsHost.replaceChildren();
      if(matching.length===0){groupsHost.append(make('p','empty','No lessons found'));return;}
      const grouped=new Map();
      for(const lesson of matching) {
        const key=JSON.stringify(lesson.folders);
        if(!grouped.has(key)) grouped.set(key,{folders:lesson.folders,lessons:[]});
        grouped.get(key).lessons.push(lesson);
      }
      const ordered=[...grouped.values()].sort((a,b)=>groupCompare(a.folders,b.folders));
      for(const group of ordered) {
        const section=make('section','lesson-group');
        section.setAttribute('aria-label',group.folders.length?group.folders.join(' / '):'Lessons');
        section.append(make('h2','group-heading',group.folders.length?group.folders.join(' › '):'Lessons'));
        const list=make('ul','lesson-list');
        group.lessons.sort((a,b)=>collator.compare(a.title,b.title)||collator.compare(a.path,b.path));
        for(const lesson of group.lessons) {
          const item=document.createElement('li');
          const link=make('a','lesson-link',lesson.title);
          link.setAttribute('href',lessonHref(lesson.path));
          link.setAttribute('target','_blank');
          link.setAttribute('rel','noopener');
          link.setAttribute('aria-label','Open '+lesson.title+' in a new tab');
          item.append(link);
          list.append(item);
        }
        section.append(list);
        groupsHost.append(section);
      }
    }
    const subjects=[...new Set(LESSONS.map(l=>l.subject))].sort(collator.compare);
    for(const subject of subjects) {
      const button=make('button','subject-card',subject);
      button.type='button';
      button.setAttribute('aria-label','Open '+subject+' lessons');
      button.addEventListener('click',()=>openSubject(subject));
      subjectButtons.append(button);
    }
    back.addEventListener('click',showHome);
    search.addEventListener('input',renderLessons);
    clear.addEventListener('click',()=>{search.value='';renderLessons();search.focus();});
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape' && activeSubject!==null && document.activeElement!==search)showHome();
    });
  </script>
