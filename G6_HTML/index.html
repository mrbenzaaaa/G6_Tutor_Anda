  <style>
    :root {
      color-scheme: light;
      --navy: #173a71;
      --blue: #2563eb;
      --ink: #15233b;
      --muted: #65758b;
      --line: #dce5f2;
      --surface: #ffffff;
      --soft: #f2f6fc;
      --science: #0f766e;
      --social: #b45309;
      --writing: #7c3aed;
      --shadow: 0 12px 32px rgba(23, 58, 113, 0.09);
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(37, 99, 235, 0.12), transparent 28rem),
        radial-gradient(circle at 94% 14%, rgba(15, 118, 110, 0.1), transparent 25rem),
        var(--soft);
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .topbar {
      height: 8px;
      background: linear-gradient(90deg, var(--blue), var(--science) 48%, var(--writing));
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 52px;
    }

    header { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 650px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .subject-menu {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 30px;
    }

    .subject-button {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 112px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .subject-button:hover {
      transform: translateY(-3px);
      border-color: #a9c4ee;
      box-shadow: 0 16px 30px rgba(23, 58, 113, 0.13);
    }

    .subject-icon {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 17px;
      color: #fff;
      font-size: 1.7rem;
    }

    .subject-button:nth-child(7n + 1) .subject-icon { background: #dc2626; }
    .subject-button:nth-child(7n + 2) .subject-icon { background: #2563eb; }
    .subject-button:nth-child(7n + 3) .subject-icon { background: var(--science); }
    .subject-button:nth-child(7n + 4) .subject-icon { background: var(--social); }
    .subject-button:nth-child(7n + 5) .subject-icon { background: #ca8a04; }
    .subject-button:nth-child(7n + 6) .subject-icon { background: var(--writing); }
    .subject-button:nth-child(7n + 7) .subject-icon { background: #db2777; }

    .subject-name {
      font-size: clamp(1.08rem, 2.2vw, 1.38rem);
      font-weight: 850;
      line-height: 1.25;
    }

    .subject-arrow {
      color: var(--blue);
      font-size: 1.8rem;
      font-weight: 850;
    }

    .detail-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .back-button {
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(23, 58, 113, 0.06);
    }

    .active-subject-title {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -0.025em;
    }

    .search-panel {
      position: sticky;
      z-index: 10;
      top: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 28px;
      padding: 10px;
      border: 1px solid rgba(220, 229, 242, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .search-wrap { position: relative; min-width: 0; }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 22px;
      height: 22px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px 12px 50px;
      border: 2px solid transparent;
      border-radius: 13px;
      outline: none;
      background: #f5f8fc;
      color: var(--ink);
      font-size: 1rem;
    }

    #search:focus { border-color: var(--blue); background: #fff; }

    #clear-search {
      min-width: 90px;
      min-height: 52px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      background: var(--navy);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    #clear-search:disabled { opacity: 0.42; cursor: default; }

    #result-status {
      grid-column: 1 / -1;
      min-height: 20px;
      padding: 0 8px 2px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 650;
    }

    .folder-group { margin-bottom: 24px; }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 11px;
      color: #465770;
      font-size: 0.98rem;
      font-weight: 850;
    }

    .folder-title::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.45;
    }

    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .lesson-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 5px 16px rgba(23, 58, 113, 0.045);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .lesson-card:hover {
      transform: translateY(-2px);
      border-color: #a9c4ee;
      box-shadow: 0 12px 24px rgba(23, 58, 113, 0.1);
    }

    .lesson-badge {
      display: grid;
      min-width: 48px;
      min-height: 42px;
      padding: 8px;
      place-items: center;
      border-radius: 13px;
      background: #edf3fc;
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .lesson-card[data-kind="Quiz"] .lesson-badge {
      background: #fff3d9;
      color: #9a5700;
    }

    .lesson-title {
      min-width: 0;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .open-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: #f5f8fc;
      color: var(--blue);
      font-size: 1.2rem;
      font-weight: 900;
    }

    .empty-state {
      display: none;
      margin: 34px 0;
      padding: 42px 20px;
      border: 1px dashed #b9c7da;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      text-align: center;
    }

    .empty-state.show { display: block; }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .subject-button:focus-visible,
    .back-button:focus-visible,
    .lesson-card:focus-visible,
    #clear-search:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 1120px); padding-top: 26px; }
      .subject-menu, .lesson-grid { grid-template-columns: 1fr; }
      .detail-toolbar { align-items: flex-start; flex-direction: column; }
      .search-panel { top: 5px; }
    }

    @media (max-width: 440px) {
      .search-panel { grid-template-columns: 1fr; }
      #clear-search { min-height: 48px; }
      .lesson-card { padding: 14px; gap: 11px; }
      .open-icon { width: 34px; height: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

    <header>

        </div>
        <button id="clear-search" type="button" disabled>Clear</button>
        <div id="result-status" role="status" aria-live="polite"></div>
      </div>

      <div id="lesson-list"></div>
      <div id="empty-state" class="empty-state" role="status">
        <strong>No lessons found</strong>
        Try another word or clear the search.
      </div>
    </section>

    <footer>Works offline · Lesson files remain in their original folders</footer>

      const subjectMenu = document.getElementById("subject-menu");
      const detailView = document.getElementById("detail-view");
      const backButton = document.getElementById("back-button");
      const activeSubjectTitle = document.getElementById("active-subject-title");
      const searchInput = document.getElementById("search");
      const clearButton = document.getElementById("clear-search");
      const resultStatus = document.getElementById("result-status");
      const lessonList = document.getElementById("lesson-list");
      const emptyState = document.getElementById("empty-state");
      let activeSubject = null;
      let lastSubjectButton = null;

      function normalize(value) {
        return value.toLocaleLowerCase().trim().replace(/\s+/g, " ");
      }

      function makeSubjectMenu() {
        catalog.forEach((subject) => {
          const button = document.createElement("button");
          button.className = "subject-button";
          button.type = "button";
          button.dataset.subject = subject.name;
          button.setAttribute("aria-label", `Open ${subject.name}`);
          button.innerHTML = `
            <span class="subject-icon" aria-hidden="true">${subject.icon}</span>
            <span class="subject-name">${subject.name}</span>
            <span class="subject-arrow" aria-hidden="true">›</span>`;
          button.addEventListener("click", () => openSubject(subject, button));
          subjectMenu.appendChild(button);
        });
      }

      function renderLessons() {
        const query = normalize(searchInput.value);
        let visibleCount = 0;
        const totalCount = activeSubject.groups.reduce((sum, group) => sum + group.items.length, 0);
        lessonList.replaceChildren();

        activeSubject.groups.forEach((group) => {
          const matches = group.items.filter((item) =>
            normalize(`${activeSubject.name} ${group.name} ${item.title}`).includes(query)
          );
          if (!matches.length) return;

          const section = document.createElement("section");
          section.className = "folder-group";
          const heading = document.createElement("h3");
          heading.className = "folder-title";
          heading.textContent = group.name;
          const grid = document.createElement("div");
          grid.className = "lesson-grid";

          matches.forEach((item) => {
            const link = document.createElement("a");
            link.className = "lesson-card";
            link.href = item.path;
            link.target = "_blank";
            link.rel = "noopener";
            link.dataset.kind = item.kind;
            link.innerHTML = `
              <span class="lesson-badge">${item.kind}</span>
              <span class="lesson-title">${item.title}</span>
              <span class="open-icon" aria-hidden="true">↗</span>`;
            grid.appendChild(link);
            visibleCount += 1;
          });

          section.append(heading, grid);
          lessonList.appendChild(section);
        });

        clearButton.disabled = !query;
        emptyState.classList.toggle("show", visibleCount === 0);
        resultStatus.textContent = query
          ? `${visibleCount} ${visibleCount === 1 ? "lesson" : "lessons"} found`
          : `Showing all ${totalCount} ${totalCount === 1 ? "lesson" : "lessons"}`;
      }

      function openSubject(subject, button) {
        activeSubject = subject;
        lastSubjectButton = button;
        searchInput.value = "";
        activeSubjectTitle.textContent = subject.name;
        subjectMenu.hidden = true;
        detailView.hidden = false;
        renderLessons();
        window.scrollTo({ top: 0, behavior: "smooth" });
        backButton.focus({ preventScroll: true });
      }

      function showSubjectMenu() {
        activeSubject = null;
        searchInput.value = "";
        lessonList.replaceChildren();
        emptyState.classList.remove("show");
        detailView.hidden = true;
        subjectMenu.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
        if (lastSubjectButton) lastSubjectButton.focus({ preventScroll: true });
      }

      searchInput.addEventListener("input", renderLessons);
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          searchInput.value = "";
          renderLessons();
        }
      });

      clearButton.addEventListener("click", () => {
        searchInput.value = "";
        renderLessons();
        searchInput.focus();
      });

      backButton.addEventListener("click", showSubjectMenu);
      makeSubjectMenu();
      showSubjectMenu();
    })();
  </script>
