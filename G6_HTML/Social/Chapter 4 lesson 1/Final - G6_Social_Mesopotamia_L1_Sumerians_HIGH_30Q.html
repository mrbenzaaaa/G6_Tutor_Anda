<script>
const slides=[{"title": "Chapter 4 • Lesson 1 — The Sumerians", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">MESOPOTAMIA • 3000 B.C. TO 500 B.C.</div>\n  <div class=\"big\">How does geography influence the way people live?</div>\n  <p>The Sumerians made important advances in <b>farming</b> and <b>writing</b> that laid the foundation for future civilizations.</p>\n  <div class=\"flow\"><span>Geography</span><b>→</b><span>Farming</span><b>→</b><span>Cities</span><b>→</b><span>Sumerian civilization</span></div>\n</div>\n", "remember": "Follow the big story: rivers helped farming, farming supported cities, and Sumerian ideas influenced later civilizations."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Geography</b><br>Tigris + Euphrates, Fertile Crescent, and why people settled there.</div>\n<div class=\"card\"><b>Farming</b><br>Floods, silt, dams, canals, irrigation, and surplus food.</div>\n<div class=\"card\"><b>Sumerian Society</b><br>City-states, religion, ziggurats, rulers, social groups, farmers, and traders.</div>\n<div class=\"card\"><b>Contributions</b><br>Cuneiform, scribes, epic stories, technology, mathematics, and astronomy.</div>\n</div>\n<div class=\"source-note\"><b>Source note:</b> The teacher-summary section in the prompt contains only “...”. No separate teacher-summary facts were provided, so this tutor uses only the textbook material shown in the uploaded pages.</div>\n", "remember": "For the test, understand geography → farming → society → contributions."}, {"title": "Why Did People Settle in Mesopotamia?", "section": "Geography", "body": "\n<p>Civilizations first developed about <b>3000 B.C.</b> in the river valleys of Mesopotamia, Egypt, India, and China.</p>\n<p>The need for <b>water for drinking and growing crops</b> influenced where people settled.</p>\n<div class=\"flow\"><span>Need water</span><b>→</b><span>Settle near rivers</span><b>→</b><span>Farm and build communities</span></div>\n<p>As civilizations grew, people formed social classes, specialized in work, improved technology, made goods, and set up governments.</p>\n", "remember": "Water for drinking and crops was a major reason people settled near river valleys."}, {"title": "The Two Rivers", "section": "Geography", "body": "\n<p>Mesopotamia, the earliest known civilization, developed in what is now <b>southern Iraq</b>.</p>\n<p><b>Mesopotamia</b> means <b>“the land between the rivers”</b> in Greek.</p>\n<div class=\"riverpair\"><div>🌊 <b>Tigris River</b></div><div>🌊 <b>Euphrates River</b></div></div>\n<p>The rivers are nearly parallel and flow more than <b>1,000 miles (1,600 km)</b> from the mountains of southeastern Asia to the Persian Gulf.</p>\n", "remember": "Mesopotamia = land between the Tigris and Euphrates Rivers."}, {"title": "The Fertile Crescent", "section": "Geography", "body": "\n<p>Mesopotamia was in the eastern part of the <b>Fertile Crescent</b>, a curving strip of good farmland.</p>\n<div class=\"flow\"><span>Mediterranean Sea</span><b>→</b><span>Fertile Crescent</span><b>→</b><span>Persian Gulf</span></div>\n<p>The textbook says the Fertile Crescent includes parts of the modern countries of <b>Turkey, Syria, Iraq, Lebanon, Israel, and Jordan</b>.</p>\n<p>On the textbook map, <b>Nineveh</b> is the city located in northern Mesopotamia.</p>\n", "remember": "Fertile Crescent = curving good farmland; Mesopotamia is in its eastern part."}, {"title": "Early Valley Dwellers", "section": "Geography", "body": "\n<div class=\"timeline\">\n<div><b>about 7000 B.C.</b><br>People first settled Mesopotamia. The first settlers were hunters and herders.</div>\n<div><b>about 4000 B.C.</b><br>Some groups moved to the Tigris-Euphrates plain and built farming villages along the rivers.</div>\n</div>\n<p>In the 1800s, archaeologists began digging up buildings and artifacts that revealed much about early Mesopotamia.</p>\n", "remember": "7000 B.C. → early settlers; 4000 B.C. → farming villages along the rivers."}, {"title": "Taming the Rivers: The Problem", "section": "Farming", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Summer</b><br>Little or no rain → rivers often low → not enough water for fall crops.</div>\n<div class=\"card\"><b>Spring</b><br>Rain + melting snow in northern mountains → rivers overflow → floods could sweep away crops, homes, and livestock.</div>\n</div>\n<p>Farmers needed a way to deal with both <b>too little water</b> and <b>too much water</b>.</p>\n", "remember": "The rivers were useful, but their water level was not always right for farming."}, {"title": "Floods Also Helped: Silt", "section": "Farming", "body": "\n<p>Flooded rivers carried <b>silt</b>.</p>\n<div class=\"term\"><b>silt</b><span>fine particles of fertile soil</span></div>\n<div class=\"flow\"><span>Floodwater</span><b>→</b><span>Silt left on banks and plains</span><b>→</b><span>Very good soil for farming</span></div>\n<p>So floods could be dangerous, but the silt they left behind could help farmers.</p>\n", "remember": "Silt = fine particles of fertile soil left by floodwater."}, {"title": "Irrigation: Controlling Water", "section": "Farming", "body": "\n<div class=\"term\"><b>irrigation</b><span>a system that supplies dry land with water through ditches, pipes, or streams</span></div>\n<p>People learned to build <b>dams</b> to control seasonal floods and dig <b>canals</b> that let water flow from a source to their fields.</p>\n<div class=\"flow\"><span>Dams</span><b>→</b><span>Control floods</span><b>→</b><span>Canals</span><b>→</b><span>Water reaches fields</span></div>\n", "remember": "Irrigation helped farmers bring water to dry fields when they needed it."}, {"title": "Irrigation → Surplus → Cities", "section": "Farming", "body": "\n<div class=\"term\"><b>surplus</b><span>an amount that is left over after a need has been met</span></div>\n<div class=\"flow multi\"><span>Irrigation</span><b>→</b><span>More food</span><b>→</b><span>Surplus</span><b>→</b><span>Not everyone farms</span><b>→</b><span>Artisans</span><b>→</b><span>Trade</span><b>→</b><span>Cities</span></div>\n<p>Artisans were <b>skilled workers</b>. They made cloth, pottery, tools, and weapons.</p>\n<p>By <b>3000 B.C.</b>, several cities had developed in <b>Sumer</b>, a region in southern Mesopotamia.</p>\n", "remember": "Irrigation helped create surplus food, which helped specialization and city growth."}, {"title": "Sumer’s First Cities", "section": "Sumer", "body": "\n<p>Sumer’s people were called <b>Sumerians</b>. They built the first cities in Southwest Asia.</p>\n<div class=\"three\"><div>🏛️ <b>Ur</b></div><div>🏛️ <b>Uruk</b></div><div>🏛️ <b>Eridu</b></div></div>\n<p>These cities became centers of civilization that controlled the lower part of the Tigris and Euphrates valleys.</p>\n", "remember": "Know the three Sumerian cities named in the lesson: Ur, Uruk, and Eridu."}, {"title": "Why City-States Arose", "section": "Sumer", "body": "\n<p>Sumer’s cities were surrounded by mudflats and patches of scorching desert. The harsh landscape made travel and communication difficult.</p>\n<div class=\"flow\"><span>Difficult travel and communication</span><b>→</b><span>Cities largely cut off</span><b>→</b><span>Cities became independent</span></div>\n<div class=\"term\"><b>city-state</b><span>a city that governs itself and its surrounding territory</span></div>\n<p>By about <b>2000 B.C.</b>, city-state populations ranged from about <b>5,000 to 20,000 people</b>.</p>\n", "remember": "A city-state was independent and controlled its surrounding territory."}, {"title": "City Walls, War, and Cooperation", "section": "Sumer", "body": "\n<p>Historians think each Sumerian city-state was protected by a large city wall.</p>\n<ul>\n<li>Stone and wood were in short supply, so Sumerians used <b>mud from the rivers</b> as a main building material.</li>\n<li>They mixed mud with crushed reeds, formed bricks, and dried them in the sun.</li>\n<li>Wall gates stayed open by day and closed at night for protection.</li>\n</ul>\n<p>City-states sometimes fought over <b>resources and political borders</b>. At other times, they traded and formed alliances to protect common interests.</p>\n", "remember": "Walls protected city-states; city-states could fight or cooperate."}, {"title": "Gods and Polytheism", "section": "Society", "body": "\n<p>Sumerians worshiped many gods.</p>\n<div class=\"term\"><b>polytheism</b><span>a belief in more than one god</span></div>\n<p>They believed gods had power over parts of nature, such as rain or wind, and could guide activities such as plowing or brick-making.</p>\n<p>Although Sumerians honored all the gods, each city-state claimed <b>one god as its own</b>.</p>\n", "remember": "Polytheism = belief in more than one god; each city-state claimed one god as its own."}, {"title": "Ziggurats, Priests, and Kings", "section": "Society", "body": "\n<div class=\"term\"><b>ziggurat</b><span>a pyramid-shaped structure with a temple at the top</span></div>\n<p>A city-state often built a ziggurat to honor its god. The very top was a holy place, believed to be the god’s home, and only special priests could enter.</p>\n<div class=\"flow\"><span>Early days</span><b>→</b><span>Ziggurat priests ruled</span><b>→</b><span>Important men helped govern</span><b>→</b><span>Later city-states became monarchies</span></div>\n<p>Sumerian kings claimed that they received their power to rule from the city’s god.</p>\n", "remember": "Ziggurat = temple structure; government later changed from priestly rule to kings."}, {"title": "Hereditary Rule", "section": "Society", "body": "\n<p>The first kings were most likely war heroes. Over time, their rule became <b>hereditary</b>.</p>\n<div class=\"flow\"><span>King dies</span><b>→</b><span>His son takes over</span></div>\n<p>In most cases, wives of kings did not have political power. However, some controlled their own lands.</p>\n", "remember": "Hereditary rule in the lesson means a king’s son took over after the king died."}, {"title": "Social Groups in Sumer", "section": "Society", "body": "\n<table><tr><th>Social class</th><th>Who belonged?</th></tr>\n<tr><td><b>Upper class</b></td><td>Kings, priests, warriors, and government officials</td></tr>\n<tr><td><b>Middle class</b></td><td>Merchants, farmers, fishers, and artisans — <b>Sumer’s largest social group</b></td></tr>\n<tr><td><b>Lowest class</b></td><td>Enslaved people</td></tr></table>\n<p>Most enslaved people had been captured in war. Criminals and people who could not pay debts were also sometimes enslaved.</p>\n", "remember": "Upper = rulers/officials; Middle = largest group; Lowest = enslaved people."}, {"title": "Family and the Role of Women", "section": "Society", "body": "\n<p>The <b>family</b> was the basic unit of society. Men were the head of the home.</p>\n<ul>\n<li>Boys went to school and trained for a specific job.</li>\n<li>Sumerian women <b>ran the home, taught their daughters, and cared for the children</b>.</li>\n<li>Women had a few civil rights; some owned businesses.</li>\n<li>Parents had to care for children, and adult children had to care for parents who needed help.</li>\n</ul>\n", "remember": "For Lesson Review: women commonly ran the home, taught daughters, and cared for children."}, {"title": "Farmers and Traders", "section": "Economy", "body": "\n<p>If you lived in Sumer, you were most likely a <b>farmer</b>.</p>\n<table><tr><th>Farming</th><th>Trade</th></tr>\n<tr><td>Major crops: wheat, barley, dates<br>Animals: sheep, goats, pigs</td><td>Sumerians traded because they did not have some goods they needed.</td></tr></table>\n<p>Trade routes linked Sumer to places as far away as <b>India and Egypt</b>. Merchants traded wheat, barley, and tools for timber, minerals, and metals.</p>\n", "remember": "Sumer traded surplus goods to get materials it did not have."}, {"title": "Trade Examples from the Lesson", "section": "Economy", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>India’s Indus Valley</b><br>Carnelian, a red stone valued for jewelry-making</div>\n<div class=\"card\"><b>Present-day Afghanistan</b><br>Lapis lazuli, a blue stone valued for jewelry-making</div>\n<div class=\"card\"><b>Present-day Turkey</b><br>Traders returned with iron and silver</div>\n<div class=\"card\"><b>Sumerian goods</b><br>Wheat, barley, tools, and other surplus goods were traded for needed materials</div>\n</div>\n", "remember": "Trade connected Sumer with distant places and supplied materials Sumerians needed."}, {"title": "Sumerian Contributions", "section": "Contributions", "body": "\n<p>The Sumerians created the first civilization that had a great influence on history.</p>\n<p>Later civilizations <b>copied and improved</b> many ideas and inventions that began in Sumer.</p>\n<div class=\"flow\"><span>Sumerian ideas</span><b>→</b><span>Copied and improved</span><b>→</b><span>Passed to later civilizations</span></div>\n<p>The lesson says Mesopotamia has been called the <b>“cradle of civilization.”</b></p>\n", "remember": "Sumer mattered because later civilizations copied and improved many Sumerian ideas and inventions."}, {"title": "Writing: Cuneiform", "section": "Contributions", "body": "\n<p>Writing helped Sumerians keep records of their lives and history, share information, and pass ideas to later generations.</p>\n<div class=\"term\"><b>cuneiform</b><span>a system of writing developed by the Sumerians that used wedge-shaped marks made in soft clay</span></div>\n<ul>\n<li>About <b>1,200 different characters</b></li>\n<li>Characters represented names, physical objects, and numbers.</li>\n<li>Wedge-shaped marks were cut into damp clay with a sharp reed.</li>\n<li>Sumerians wrote on clay because they did not have paper.</li>\n</ul>\n", "remember": "Cuneiform = wedge-shaped writing in soft clay."}, {"title": "Scribes: Why Were They Important?", "section": "Contributions", "body": "\n<p>Only a few people—mostly boys from wealthy families—learned to read and write cuneiform. After years of training, some became <b>scribes</b>.</p>\n<div class=\"term\"><b>scribe</b><span>a person who copies or writes out documents, often a record keeper</span></div>\n<p>Scribes recorded <b>court records, marriage contracts, business dealings, and important events</b>. Some scribes were judges and government officials.</p>\n", "remember": "Scribes were important because their records preserved information about everyday life and important events."}, {"title": "Epic of Gilgamesh", "section": "Contributions", "body": "\n<p>Sumerians told stories orally for centuries. Writing allowed them to record those stories.</p>\n<p>The world’s oldest known story in the lesson is from Sumer. Written more than <b>4,000 years ago</b> and still studied today, it is called the <i>Epic of Gilgamesh</i>.</p>\n<div class=\"term\"><b>epic</b><span>a long poem that records the deeds of a legendary or real hero</span></div>\n", "remember": "Epic of Gilgamesh = an epic from Sumer written more than 4,000 years ago."}, {"title": "Technology: What Did Sumerians Develop?", "section": "Contributions", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Wheel</b><br>First used to help shape pottery; a wheeled vehicle is shown from about 3500 B.C.</div>\n<div class=\"card\"><b>Transport</b><br>First carts pulled by donkeys, chariot, and sailboat for river travel</div>\n<div class=\"card\"><b>Farming & crafts</b><br>Wooden plow and potter’s wheel</div>\n<div class=\"card\"><b>Bronze</b><br>Made from copper and tin; used for stronger tools, weapons, and jewelry</div>\n</div>\n", "remember": "Think wheel, carts/chariot, sailboat, plow, potter’s wheel, and bronze."}, {"title": "Mathematics and Astronomy", "section": "Contributions", "body": "\n<ul>\n<li>Used <b>geometry</b> to measure fields and plan buildings.</li>\n<li>Created a place-value number system based on <b>60</b>.</li>\n<li>Made tables for calculating division and multiplication.</li>\n<li><b>60-minute hour</b>, <b>60-second minute</b>, and <b>360-degree circle</b> came from Sumerian ideas.</li>\n<li>Watched stars to find good times to plant crops and hold religious ceremonies.</li>\n<li>Made a <b>12-month calendar</b> based on cycles of the moon.</li>\n</ul>\n", "remember": "Memorize the number pattern: 60 → 60 → 360, plus a 12-month lunar-cycle calendar."}, {"title": "Keywords — Book Content Vocabulary", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Definition from the textbook</th><th>Memory tip</th></tr>\n<tr><td><b>silt</b></td><td>fine particles of fertile soil</td><td>fertile soil particles</td></tr>\n<tr><td><b>irrigation</b></td><td>a system that supplies dry land with water through ditches, pipes, or streams</td><td>water to dry land</td></tr>\n<tr><td><b>surplus</b></td><td>an amount that is left over after a need has been met</td><td>left over</td></tr>\n<tr><td><b>city-state</b></td><td>a city that governs itself and its surrounding territory</td><td>city + territory</td></tr>\n<tr><td><b>polytheism</b></td><td>a belief in more than one god</td><td>many gods</td></tr>\n</table>\n", "remember": "These are exact textbook vocabulary meanings—learn them carefully."}, {"title": "Keywords — Writing, Religion, and Academic Vocabulary", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Definition from the textbook</th><th>Memory tip</th></tr>\n<tr><td><b>ziggurat</b></td><td>a pyramid-shaped structure with a temple at the top</td><td>temple at the top</td></tr>\n<tr><td><b>cuneiform</b></td><td>a system of writing developed by the Sumerians that used wedge-shaped marks made in soft clay</td><td>wedge marks in clay</td></tr>\n<tr><td><b>scribe</b></td><td>a person who copies or writes out documents, often a record keeper</td><td>record keeper</td></tr>\n<tr><td><b>epic</b></td><td>a long poem that records the deeds of a legendary or real hero</td  content vocabulary words</div>\n<div><b>Cause → Effect</b><br>Irrigation → surplus → specialization → cities</div>\n<div><b>Geography</b><br>Tigris, Euphrates, Fertile Crescent, Nineveh</div>\n<div><b>Dates</b><br>7000 B.C., 4000 B.C., 3000 B.C., about 2000 B.C., about 3500 B.C.</div>\n<div><b>Society</b><br>City-states, polytheism, ziggurats, social classes, women</div>\n<div><b>Contributions</b><br>Cuneiform, scribes, epic, wheel, bronze, math, astronomy</div>\n</div>\n", "remember": "Expect definitions, comparisons, cause/effect, dates, places, social groups, and Sumerian contributions."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>WHERE?</b><br>Mesopotamia = between Tigris + Euphrates; eastern Fertile Crescent</div>\n<div><b>FARMING</b><br>Floods left silt; dams + canals created irrigation</div>\n<div><b>GROWTH</b><br>Irrigation → surplus → artisans/trade → cities</div>\n<div><b>SOCIETY</b><br>Independent city-states; polytheism; ziggurats; social classes</div>\n<div><b>WRITING</b><br>Cuneiform → scribes → records; Epic of Gilgamesh</div>\n<div><b>INVENTIONS</b><br>Wheel, carts, sailboat, plow, bronze, base-60 math, calendar</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ Two rivers ☐ Fertile Crescent ☐ Silt ☐ Irrigation ☐ Surplus ☐ City-state ☐ Polytheism ☐ Ziggurat ☐ Social groups ☐ Cuneiform ☐ Scribe ☐ Epic ☐ 60–60–360</p>\n", "remember": "If you can explain the six boxes above without looking, you are ready for the main ideas."}, {"title": "Complete Vocabulary Table", "section": "Final Review", "body": "\n<table class=\"small vocaball\"><tr><th>#</th><th>Vocabulary</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td>1</td><td><b>silt</b></td><td>fine particles of fertile soil</td><td>fertile soil particles</td></tr>\n<tr><td>2</td><td><b>irrigation</b></td><td>a system that supplies dry land with water through ditches, pipes, or streams</td> iew — Questions 4–6", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"4\">\n<li><b>What was the most common role for women in Sumerian society?</b><br>Women <b>ran the home, taught their daughters, and cared for the children</b>.</li>\n<li><b>Why were scribes important in Sumerian society?</b><br>They recorded everyday life and important information, including court records, marriage contracts, business dealings, and important events. Some also served as judges and government officials.</li>\n<li><b>Choose the Sumerian invention you think is most significant and explain why.</b><br><b>Sample source-based answer:</b> Cuneiform was significant because writing let Sumerians keep records, share information, and pass ideas to later generations. Other choices can also be supported with facts from the lesson.</li>\n</ol>\n", "remember": "For an argument question, choose one invention and support it with facts from the lesson."}];

ortant Sumerian cities?", ["Ur, Uruk, Eridu", "Nineveh, Egypt, Ur", "Babylon, Rome, Eridu", "Ur, Jerusalem, Giza"], 0, "The lesson names Ur, Uruk, and Eridu.", "Sumerian Cities"], ["Medium", "Why did Sumerian cities become independent city-states?", ["The harsh landscape made travel and communication difficult", "All cities shared one government", "They had no rivers", "They stopped growing food"], 0, "Difficult travel and communication helped cities become independent.", "City-states"], ["Medium", "Who belonged to Sumer’s middle class?", ["Kings, priests, warriors", "Only enslaved people", "Merchants, farmers, fishers, and artisans", "Only scribes"], 2, "Merchants, farmers, fishers, and artisans made up the middle class.", "Social Groups"], ["Medium", "What was the most common role for women described in the lesson?", ["Ruling every city-state", "Running the home, teaching daughters, and caring for children", "Serving as war heroes", "Building every ziggurat"], 1, "The lesson describes women running the home and caring for children.", "Sumerian Society"], ["Medium", "Why was trade important to Sumerians?", ["They did not have some goods they needed", "They had no surplus goods", "They had no farmers", "They were not allowed to make tools"], 0, "Trade helped Sumerians obtain materials they lacked.", "Trade"], ["Hard", "A farmer has more grain than the family needs and stores the extra for later. Which word best fits?", ["silt", "city-state", "surplus", "epic"], 2, "Extra food left after needs are met is a surplus.", "Scenario: Surplus"], ["Hard", "A city rules itself and the land around it. Which term from the lesson describes it?", ["city-state", "ziggurat", "scribe", "irrigation"], 0, "A city-state governs itself and its surrounding territory.", "Scenario: City-state"], ["Hard", "Which answer best explains why Sumerian city-states built walls?", ["To store floodwater only", "For protection, especially because city-states sometimes went to war", "To create surplus let mode='lesson', slide=0, q=0, score=0, answered=false, misses={};

function setBar(percent) {
  document.getElementById('bar').style.width = Math.max(0,Math.min(100,percent)) + '%';
}

function renderLesson() {
  mode='lesson';
  const s=slides[slide];
  document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;
  setBar(((slide+1)/slides.length)*100);
  document.getElementById('stage').innerHTML=
    `<div class="section">${s.section}</div>
     <h1>${s.title}</h1>
     <div class="content">${s.body}</div>
     <div class="remember">⭐ Remember: ${s.remember}</div>`;
  document.getElementById('nav').innerHTML=
    `<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button>
     <button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button>
     <button class="restart" onclick="restartAll()">↻ Restart</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextSlide(){
  if(slide<slides.length-1){slide++;renderLesson();}else{startQuiz();}
}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){
  if(confirm('Restart the whole tutor from Slide 1?')){
    slide=0;q=0;score=0;answered=false;misses={};renderLesson();
  }
}

function startQuiz(){
  mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();
}

function renderQuiz(){
  answered=false;
  const item=quiz[q], letters=['A','B','C','D'];
  document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
  setBar(((q+1)/quiz.length)*100);
  document.getElementById('stage').innerHTML=
    `<div class="quizmeta"><span class="difficulty">${item[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div>
     <div class="question">${item[1]}</div>
     <div class="choices">${item[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${letters[i]}.</b> ${c}</button>`).join('')}</div>
     <div id="feedback"></div>`;
  document.getElementById('nav').innerHTML=
    `<button onclick="backToLessonReview()">← Lesson Review</button>
     <button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(i){
  if(answered) return;
  answered=true;
  const item=quiz[q], correct=item[3], letters=['A','B','C','D'];
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('c'+correct).classList.add('correct');
  if(i===correct){
    score++;
    document.getElementById('feedback').innerHTML=
      `<div class="feedback good">✅ Correct!<span class="explain">${item[4]}</span></div>`;
  } else {
    document.getElementById('c'+i).classList.add('wrong');
    misses[item[5]]=(misses[item[5]]||0)+1;
    document.getElementById('feedback').innerHTML=
      `<div class="feedback bad">❌ Incorrect. Correct answer: <b>${letters[correct]}. ${item[2][correct]}</b><span class="explain">${item[4]}</span></div>`;
  }
  document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
  document.getElementById('nav').innerHTML=
    `<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button>
     <button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}

function nextQuestion(){
  if(!answered) return;
  if(q<quiz.length-1){q++;renderQuiz();}else{showResult();}
}

function restartQuiz(){
  if(confirm('Restart the quiz and reset the score?')){
    q=0;score=0;answered=false;misses={};renderQuiz();
  }
}

function backToLessonReview(){
  slide=slides.length-2;
  renderLesson();
}

function showResult(){
  const pct=Math.round((score/quiz.length)*100);
  const topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
  const review=topics.length
    ? topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]} question${x[1]>1?'s':''}</li>`).join('')
    : '<li><b>Excellent!</b> No missed topics.</li>';
  document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`;
  setBar(100);
  document.getElementById('stage').innerHTML=
    `<div class="result">
      <div class="section">Quiz Result</div>
      <h1>🎉 30-Question Quiz Complete</h1>
      <div class="scorebig">${score} / ${quiz.length}</div>
      <h2>${pct}%</h2>
      <div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div>
      <div class="remember">⭐ Remember: Review the missed topics in the teaching slides, then try the quiz again.</div>
     </div>`;
  document.getElementById('nav').innerHTML=
    `<button onclick="backToLessonReview()">← Lesson Review</button>
     <button class="next" onclick="restartQuiz()">Try Quiz Again</button>
     <button class="restart" onclick="restartAll()">↻ Restart All</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown',e=>{
  if(mode==='lesson' && e.key==='ArrowRight') nextSlide();
  if(mode==='lesson' && e.key==='ArrowLeft') prevSlide();
});
renderLesson();
</script>
