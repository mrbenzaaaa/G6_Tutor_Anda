    .bottom .spacer{flex:1;}
    .quizmeta {display:flex;gap:9px;flex-wrap:wrap;margin:16px 0;}.bubble{border-radius:999px;background:#eaf0ff;color:#3e4c86;font-weight:900;font-size:13px;padding:6px 12px;}.bubble.easy{background:#def5e7;color:#267649;}.bubble.medium{background:#fff1d6;color:#8a5b18;}.bubble.hard{background:#ffe4ec;color:#9c3254;}
    .question { font-size:clamp(22px,2.6vw,30px);line-height:1.28;font-weight:900;letter-spacing:-.017em;margin:10px 0 20px; }

    .feedback {padding:15px 17px;border-radius:17px;border:1px solid #c8ecd6;background:#effcf3;font-size:15px;}.feedback.bad{background:#fff1f3;border-color:#ffcbd5;}.feedback b{font-size:18px;display:block;color:#236d45;}.feedback.bad b{color:#ae3155;}.feedback p{margin:4px 0 0;}
    .final-score {text-align:center;padding:8px 0 18px;}.score-ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#5d4ed2 var(--score),#e9e9f5 0);display:grid;place-items:center;margin:16px auto;}.score-ring>div{width:125px;height:125px;border-radius:50%;background:white;display:grid;place-items:center;font-size:36px;font-weight:950;color:#4436ab;}.review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}.review-item{background:#fff6e8;border:1px solid #fbe3ba;border-radius:14px;padding:12px;font-size:15px;font-weight:800;}.review-item.ok{background:#eaf9ed;border-color:#cdeed7;}
    .checklist {list-style:none;padding:0;margin:12px 0;}.checklist li{padding:11px 13px;border-radius:12px;background:#f6f7fd;margin:8px 0;}.checklist li::before{content:'☐';color:#7769db;font-weight:900;margin-right:10px;}
    .small{font-size:14px;color:var(--muted);}.nowrap{white-space:nowrap;}
    @media (max-width:950px){.shell{grid-template-columns:1fr;max-width:840px;margin:10px auto;width:calc(100% - 20px);gap:10px;}.rail{min-height:auto;padding:14px 20px;border-radius:20px;display:block;}.brand{font-size:11px}.rail h1{font-size:23px;margin:5px 0 2px}.rail p,.time-pill,.section-steps,.tiny-note{display:none;}.main{height:calc(100svh - 112px);min-height:550px;border-radius:20px;}.canvas{padding:21px 24px 10px}.remember{margin:0 22px 12px}.bottom{padding:12px 20px 16px}.topbar{padding:15px 22px 11px}.track{margin:0 22px}}
    @media (max-width:600px){body{font-size:16px}.shell{width:calc(100% - 12px);margin:6px auto;gap:7px}.rail{padding:10px 16px;border-radius:16px}.rail h1{font-size:20px}.brand{font-size:10px}.main{height:calc(100svh - 82px);min-height:460px;border-radius:16px}.canvas{padding:17px 16px 7px}.topbar{padding:13px 15px 10px}.track{margin:0 15px}h2{font-size:26px}.lead{font-size:16px}.tile-grid,.tile-grid.three,.choices,.review-grid{grid-template-columns:1fr}.tile{padding:13px}.choices{gap:9px}.option{min-height:68px;padding:10px 12px}.remember{margin:0 12px 8px;padding:11px 13px;font-size:13px}.bottom{padding:10px 12px 12px;gap:7px}.nav{font-size:14px;min-height:49px;padding:9px 13px;border-radius:13px}.nav.primary{min-width:104px}.nav.minor{padding:7px 6px}table{font-size:12px}th,td{padding:8px 7px}.arrowline{gap:4px}.step{font-size:12px;padding:7px;min-height:65px}.arrow{font-size:17px}.question{font-size:22px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}

<body>
  <div class="shell">
    <aside class="rail" aria-label="Lesson overview">
      <div class="brand">Grade 6 • Touchscreen Tutor</div>
      <h1>Beginnings<br>Ancient Israelites</h1>
      <p>Beliefs, early leaders, the Exodus, and life in Canaan.</p>
      <div class="time-pill">⏱ Teaching: about 15–20 minutes</div>
      <div class="section-steps">
        <div class="phase active" id="phaseTeach"><span class="phase-number">1</span><span>Teaching slides</span></div>
        <div class="phase" id="phaseReview"><span class="phase-number">2</span><span>Final review</span></div>
        <div class="phase" id="phaseQuiz"><span class="phase-number">3</span><span>30-question quiz</span></div>
      </div>
      <div class="tiny-note">Based only on the supplied textbook pages.</div>
    </aside>

    <main class="main" aria-label="Interactive lesson">
      <header class="topbar"><div class="status"><span class="dot"></span><span id="modeLabel">Learning time</span></div><div class="count" id="counter">Slide 1 of 30</div></header>
      <div class="track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="progressFill"></div></div>
      <section class="canvas" id="canvas" tabindex="-1" aria-live="polite"></section>
      <div class="remember" id="remember"><b>⭐ Remember</b><span id="rememberText"></span></div>
      <footer class="bottom">
        <button class="nav secondary" id="backBtn" type="button">← Back</button>
        <button class="nav minor" id="restartBtn" type="button">↺ Restart</button>
        <span class="spacer"></span>
        <button class="nav primary" id="nextBtn" type="button">Next →</button>
      </footer>
    </main>
  </div>
  <script>
  'use strict';
  const slides = [
    {
      title:'What You Must Know', eyebrow:'Start here • Lesson map',
      body:`<p class="lead">Our big question: <strong>How do religions develop?</strong> This chapter begins with the beliefs and history of the ancient <strong>Israelites</strong>.</p><div class="tile-grid three"><div class="tile"><b>📖 Beliefs</b><span>Prophets, monotheism, the Hebrew Bible, and early leaders</span></div><div class="tile cyan"><b>🧭 Journey</b><span>Egypt, the Exodus, the covenant, and the Ten Commandments</span></div><div class="tile peach"><b>🏡 Canaan</b><span>Other peoples, the alphabet, battles, and daily life</span></div></div><div class="callout">Teacher's 8 keywords: <strong>prophet, monotheism, tribe, exodus, covenant, torah, commandment, alphabet</strong>.</div><p class="small">Study the slides first, then try 30 questions. The source text calls the Israelites' beliefs and early leaders the foundations of Judaism.</p>`,
      remember:'Beliefs → journey → life in Canaan. Learn the eight keywords.'
    },
    {
      title:'One God or Many Gods?', eyebrow:'Topic 1 • Ancient Israelite beliefs',
      body:`<p class="lead">Many ancient societies worshipped many gods. The ancient <strong>Israelites</strong>, a group in Southwest Asia, worshipped <strong>only one God</strong>.</p><table><thead><tr><th>Word</th><th>Meaning in the chapter</th></tr></thead><tbody><tr><td><strong>Polytheism</strong></td><td>Worship of more than one god</td></tr><tr><td><strong>Monotheism</strong></td><td>A belief in one God</td></tr></tbody></table><div class="arrowline"><div class="step">Other ancient societies</div><span class="arrow">→</span><div class="step">Many gods</div></div><div class="arrowline"><div class="step">Israelites</div><span class="arrow">→</span><div class="step">One God</div></div><p>The practice of monotheism made <strong>Judaism</strong> unique among ancient religions.</p>`,
      remember:'Mono = one God in this chapter; polytheism = many gods.'
    },
    {
      title:'Prophets and God’s Teachings', eyebrow:'Topic 1 • Vocabulary',
      body:`<div class="callout"><strong>Prophet:</strong> a messenger sent by God to share God's word with people.</div><p>The Israelites believed that God sent prophets to share his word. Prophets said God:</p><div class="tile-grid"><div class="tile"><b>Created and ruled</b><span>God created and ruled the world.</span></div><div class="tile cyan"><b>Was powerful and good</b><span>God was very powerful, just, and good.</span></div><div class="tile green"><b>Expected goodness</b><span>God expected people to do good and just acts.</span></div><div class="tile peach"><b>Could be known personally</b><span>People could connect to God through prayer, religious study, and good acts.</span></div></div>`,
      remember:'Prophet = God’s messenger. Prophets taught goodness and justice.'
    },
    {
      title:'The Hebrew Bible', eyebrow:'Topic 1 • Sacred writing and influence',
      body:`<p class="lead">The Israelites recorded their <strong>beliefs and history</strong> in writings that became the <strong>Hebrew Bible</strong>, or <strong>Tanakh</strong>.</p><div class="arrowline"><div class="step">Israelites record beliefs and history</div><span class="arrow">→</span><div class="step">Hebrew Bible / Tanakh</div><span class="arrow">→</span><div class="step">Foundation of Judaism</div></div><ul class="factlist"><li>Followers of Judaism are called <strong>Jews</strong>.</li><li>Judaism influenced <strong>Christianity</strong> and <strong>Islam</strong>, two other major monotheistic religions.</li><li>Christians call the Hebrew Bible the <strong>Old Testament</strong>; Christianity grew directly out of Judaism.</li><li>Islam also accepted many of Judaism's beliefs and practices.</li><li>Through the Hebrew Bible, Judaism influenced values, ethics, and principles in many societies.</li></ul><p class="small">Source vocabulary: <strong>culture</strong> = the beliefs and behaviors of a group of people.</p>`,
      remember:'Hebrew Bible = Tanakh; it records Israelite beliefs and history.'
    },
    {
      title:'Abraham and the Promised Land', eyebrow:'Topic 2 • Early leaders',
      body:`<p class="lead">Around <strong>1200 B.C.</strong>, big changes took place around the Mediterranean: <strong>Egypt's empire ended</strong>, and new peoples, including the Israelites, created kingdoms. The early Israelites lived by herding and trading.</p><div class="arrowline"><div class="step">Abraham and family in Mesopotamia</div><span class="arrow">→</span><div class="step">Journey to Canaan</div><span class="arrow">→</span><div class="step">Settled in Canaan</div></div><ul class="factlist"><li>According to the Hebrew Bible, God told <strong>Abraham</strong> to journey to <strong>Canaan</strong>.</li><li>Abraham, his wife <strong>Sarah</strong>, and their household accepted God's promise and settled there.</li><li>Canaan is often called the <strong>Promised Land</strong>.</li><li>The source locates ancient Canaan in lands now occupied by <strong>Lebanon, Israel, and Jordan</strong>.</li><li>In Jewish belief, Abraham and his family are ancestors of the ancient Israelites.</li></ul><p class="small">The textbook caption also says Abraham is an important figure in <strong>Christianity</strong> and <strong>Islam</strong>.</p>`,
      remember:'Abraham + Sarah → Canaan, called the Promised Land.'
    },
    {
      title:'Isaac, Jacob, and 12 Tribes', eyebrow:'Topic 2 • Names and families',
      body:`<div class="arrowline"><div class="step">Abraham</div><span class="arrow">→</span><div class="step">His son Isaac</div><span class="arrow">→</span><div class="step">His grandson Jacob</div></div><p>According to the Hebrew Bible, an angel gave <strong>Jacob</strong> the new name <strong>Israel</strong>, meaning “one who struggles with God.”</p><div class="callout"><strong>Tribe:</strong> a social group made up of families or clans.</div><div class="tile-grid"><div class="tile"><b>Jacob's 12 sons</b><span>They became leaders of twelve separate family groups.</span></div><div class="tile cyan"><b>Twelve Tribes of Israel</b><span>Jacob's sons were the ancestors of the Twelve Tribes of Israel.</span></div></div>`,
      remember:'Abraham → Isaac → Jacob (Israel) → Twelve Tribes.'
    },
    {
      title:'Why Did the Israelites Go to Egypt?', eyebrow:'Topic 2 • Cause and effect',
      body:`<div class="arrowline"><div class="step">Famine in Canaan</div><span class="arrow">→</span><div class="step">Jacob's family moved to Egypt</div><span class="arrow">→</span><div class="step">Lived there in peace for generations</div></div><p>The Israelite population grew. The Egyptian <strong>pharaoh</strong> became uneasy because he feared the Israelites might rebel.</p><div class="callout"><strong>Cause:</strong> the pharaoh feared rebellion.<br><strong>Effect:</strong> the Egyptians forced the Israelites into <strong>slavery</strong>.</div><p>They did hard labor and prayed to God to be free.</p>`,
      remember:'Famine → Egypt. Pharaoh’s fear → Israelite slavery.'
    },
    {
      title:'Moses and the Exodus', eyebrow:'Topic 3 • Leaving Egypt',
      body:`<p class="lead">The Israelites' deliverer was the prophet <strong>Moses</strong>, according to the Hebrew Bible.</p><div class="arrowline"><div class="step">Moses saw a burning bush</div><span class="arrow">→</span><div class="step">God called him</div><span class="arrow">→</span><div class="step">Moses asked Pharaoh to let the Israelites go</div></div><p>When the pharaoh refused, the Hebrew Bible says God sent <strong>10 plagues</strong> upon Egypt, including locusts devouring fields and outbreaks of disease.</p><div class="callout"><strong>Exodus:</strong> the departure of the Israelites out of slavery in Egypt.</div><p>The plagues convinced the pharaoh to free them. After they left, he sent his army after them.</p><p class="small">Source word: a <strong>locust</strong> is a grasshopper that often migrates in large numbers.</p>`,
      remember:'Moses → 10 plagues → the Exodus (departure from slavery in Egypt).'
    },
    {
      title:'The Red Sea and Passover', eyebrow:'Topic 3 • The Exodus story',
      body:`<p>When the Israelites reached the <strong>Red Sea</strong>, they had no way to cross. According to the Hebrew Bible:</p><div class="arrowline"><div class="step">God parted the waters</div><span class="arrow">→</span><div class="step">Israelites crossed</div><span class="arrow">→</span><div class="step">Waters flowed back and drowned the pursuing army</div></div><div class="tile-grid"><div class="tile green"><b>Exodus</b><span>The Israelites' departure from slavery in Egypt.</span></div><div class="tile peach"><b>Passover</b><span>A holy festival Jews celebrate to remember freedom from slavery.</span></div></div>`,
      remember:'Exodus = leaving slavery; Passover remembers that freedom.'
    },
    {
      title:'The Covenant at Mount Sinai', eyebrow:'Topic 3 • Promise and agreement',
      body:`<div class="callout"><strong>Covenant:</strong> an agreement with God.</div><p>On the way from Egypt, according to the Hebrew Bible, the Israelites made a covenant with God.</p><div class="tile-grid"><div class="tile"><b>God's promise</b><span>God promised to return the Israelites safely to <strong>Canaan</strong>.</span></div><div class="tile cyan"><b>People's promise</b><span>The Israelites promised to follow God's <strong>teachings</strong>.</span></div></div><p>Moses climbed <strong>Mount Sinai</strong> and received teachings from God.</p>`,
      remember:'Covenant = agreement: safe return to Canaan ↔ follow God’s teachings.'
    },
    {
      title:'Torah and Commandments', eyebrow:'Topic 3 • Teacher vocabulary',
      body:`<table><thead><tr><th>Word</th><th>Exact meaning from textbook</th></tr></thead><tbody><tr><td><strong>Torah</strong></td><td>Teachings that Moses received from God; later became the first part of the Hebrew Bible</td></tr><tr><td><strong>Commandment</strong></td><td>A rule that God wanted the Israelites to follow</td></tr></tbody></table><p>The <strong>Torah</strong> made clear what God considered <strong>right and wrong</strong>. An important part of it is the <strong>Ten Commandments</strong>.</p><div class="arrowline"><div class="step">Mount Sinai</div><span class="arrow">→</span><div class="step">Torah: teachings</div><span class="arrow">→</span><div class="step">Ten Commandments: rules</div></div>`,
      remember:'Torah = teachings; commandment = a rule to follow.'
    },
    {
      title:'The Ten Commandments: 1–5', eyebrow:'Topic 3 • Learn the first five',
      body:`<p class="lead">The textbook presents a paraphrased list from <strong>Exodus 20:3–17</strong>.</p><ol class="factlist"><li>Do not worship any god except me.</li><li>Do not … bow down and worship idols.</li><li>Do not misuse my name.</li><li>Remember the <strong>Sabbath Day</strong> and keep it holy.</li><li>Honor your father and your mother.</li></ol><div class="callout">Textbook graphic check: The main idea of <strong>Commandment 4</strong> is to remember the Sabbath Day and keep it holy.</div>`,
      remember:'1–4: worship and Sabbath. 5: honor father and mother.'
    },
    {
      title:'The Ten Commandments: 6–10', eyebrow:'Topic 3 • Learn the next five',
      body:`<p class="lead">Continue the textbook's paraphrased list.</p><ol class="factlist" start="6"><li>Do not murder.</li><li>Be faithful in marriage.</li><li>Do not steal.</li><li>Do not testify falsely [tell lies] about others.</li><li>Do not want anything that belongs to someone else.</li></ol><div class="tile-grid"><div class="tile green"><b>Family relationships</b><span>Commandments <strong>5</strong> and <strong>7</strong> mention parents and marriage.</span></div><div class="tile cyan"><b>Acting fairly</b><span>Rules <strong>6, 8, 9, 10</strong> include not killing, stealing, lying, or wanting others' belongings.</span></div></div>`,
      remember:'6–10: do not murder, be faithful, do not steal or lie, do not want others’ things.'
    },
    {
      title:'Why the Ten Commandments Mattered', eyebrow:'Topic 3 • Effects on society',
      body:`<p><strong>Loyalty to God</strong> is the central idea of the Ten Commandments. God's name was not to be misused; Israelites were not to worship other gods or images.</p><div class="arrowline"><div class="step">Ten Commandments</div><span class="arrow">→</span><div class="step">Moral principles of many nations</div><span class="arrow">→</span><div class="step">Laws, social justice, community</div></div><ul class="factlist"><li>Many laws against <strong>stealing</strong> or <strong>killing</strong> are based on principles from the Ten Commandments.</li><li>They promoted <strong>social justice</strong> and a feeling of community.</li><li>They contributed to the democratic belief that <strong>laws should apply equally to all</strong>.</li><li>The belief in <strong>one God</strong> became the basis for both Christianity and Islam.</li></ul>`,
      remember:'Ten Commandments → moral rules, community, and laws applying equally.'
    },
    {
      title:'Entering the Land of Canaan', eyebrow:'Topic 4 • New leader',
      body:`<p class="lead">The Hebrew Bible says <strong>Moses died</strong> before the Israelites reached the land God had promised.</p><div class="arrowline"><div class="step">Moses died</div><span class="arrow">→</span><div class="step">Joshua became leader</div><span class="arrow">→</span><div class="step">Israelites entered Canaan</div></div><p>Other peoples already lived there, including the <strong>Canaanites</strong> and, somewhat later, the <strong>Philistines</strong>.</p><table><thead><tr><th>Israelites</th><th>Other people in Canaan</th></tr></thead><tbody><tr><td>Worshipped one God</td><td>Worshipped many gods and goddesses</td></tr><tr><td>Joshua led them into Canaan</td><td>Had their own ways of life</td></tr></tbody></table>`,
      remember:'After Moses, Joshua led the Israelites into Canaan.'
    },
    {
      title:'The Canaanites', eyebrow:'Topic 4 • Early life in Canaan',
      body:`<p>Nomadic <strong>tribes</strong> probably settled in Canaan as early as <strong>3000 B.C.</strong></p><div class="arrowline"><div class="step">Herders traveled with sheep and animals</div><span class="arrow">→</span><div class="step">Settled in villages</div><span class="arrow">→</span><div class="step">Farmed and learned to trade</div></div><p>There were many different groups in Canaan. The <strong>Phoenicians</strong> were one Canaanite group; the <strong>Philistines</strong> were another group in Canaan.</p><div class="callout">Exam date: <strong>as early as 3000 B.C.</strong> refers to nomadic tribes settling in Canaan—not to the Exodus.</div>`,
      remember:'Canaanites: herders → villages → farming and trade.'
    },
    {
      title:'Phoenicians: Skilled Sailors', eyebrow:'Topic 4 • A Canaanite group',
      body:`<p class="lead">The <strong>Phoenicians</strong> lived in cities along the <strong>Mediterranean Sea</strong> in northern Canaan.</p><div class="tile-grid"><div class="tile cyan"><b>Where?</b><span>Near a major waterway—the Mediterranean Sea</span></div><div class="tile"><b>What skills?</b><span>Skilled sailors and talented traders</span></div><div class="tile peach"><b>How did they navigate?</b><span>They used the <strong>sun</strong> and the <strong>stars</strong> on long voyages.</span></div><div class="tile green"><b>How did they sail?</b><span>Ships with <strong>oars and sails</strong> carried trade goods.</span></div></div><p>They traveled to <strong>Greece, Spain, and western Africa</strong>; the textbook says they <em>may have</em> sailed as far as the <strong>British Isles</strong>.</p><p class="small">The ship caption says Phoenician ships influenced shipbuilding for centuries and their sailors advanced astronomy in navigation.</p>`,
      remember:'Phoenicians = northern Canaan, Mediterranean sailors and traders.'
    },
    {
      title:'Phoenician Trade and Settlements', eyebrow:'Topic 4 • Goods and ideas travel',
      body:`<p>Phoenicians controlled Mediterranean shipping and trade. At ports, they exchanged goods.</p><div class="tile-grid"><div class="tile"><b>They offered</b><span><strong>Cedar logs, glass, jewelry</strong>, and cloth colored with beautiful <strong>purple dye</strong>.</span></div><div class="tile cyan"><b>They traded for</b><span><strong>Tin</strong> and other precious metals.</span></div><div class="tile peach"><b>Where did purple dye come from?</b><span>From <strong>shellfish</strong> along the Phoenician coast.</span></div><div class="tile green"><b>Settlements</b><span>They founded settlements around the Mediterranean, spreading goods and ideas.</span></div></div><p><strong>Carthage</strong>, on the coast of <strong>North Africa</strong>, later became the most powerful city in the western Mediterranean.</p>`,
      remember:'Phoenician trade: cedar, glass, jewelry, purple dye ↔ tin and metals.'
    },
    {
      title:'The Phoenician Alphabet', eyebrow:'Topic 4 • Teacher vocabulary',
      body:`<div class="callout"><strong>Alphabet:</strong> a set of letters or other characters used to write a language.</div><p>The Phoenicians developed a group of <strong>letters standing for sounds</strong>. Letters could be used to spell out words.</p><div class="arrowline"><div class="step">Letters for sounds</div><span class="arrow">→</span><div class="step">Simpler writing</div><span class="arrow">→</span><div class="step">Better records</div></div><div class="tile-grid"><div class="tile cyan"><b>22 letters</b><span>The Phoenician alphabet had <strong>22 letters</strong>.</span></div><div class="tile peach"><b>Direction</b><span>Unlike the alphabet shown for modern English, it was written <strong>right to left</strong>.</span></div></div>`,
      remember:'Phoenician alphabet: 22 letters, right to left; simpler writing.'
    },

    {
      title:'The Philistines', eyebrow:'Topic 4 • Another group in Canaan',
      body:`<p>The <strong>Philistines</strong> migrated from near present-day <strong>Greece</strong>. They were one of the groups known as the <strong>“Sea People.”</strong></p><div class="tile-grid"><div class="tile"><b>About 1200 B.C.</b><span>The “Sea People” invaded the Mediterranean area.</span></div><div class="tile cyan"><b>Five walled towns</b><span>The Philistines set up five walled towns in southern Canaan along the Mediterranean coast.</span></div><div class="tile peach"><b>Iron</b><span>They made iron tools and weapons, helping them create the strongest army in Canaan.</span></div><div class="tile green"><b>Culture</b><span>They kept their own language and religion but accepted many ideas and practices from neighbors in Canaan.</span></div></div>`,
      remember:'Philistines: Greece area → five walled towns → iron tools and weapons.'
    },
    {
      title:'Joshua and the Battle of Jericho', eyebrow:'Topic 5 • Military conquest',
      body:`<p>Because other groups lived in Canaan, the Israelites faced a challenge establishing it as their homeland. <strong>Joshua</strong> led a series of battles.</p><div class="arrowline"><div class="step">March around Jericho for six days</div><span class="arrow">→</span><div class="step">Seventh day: trumpet and shout</div><span class="arrow">→</span><div class="step">Walls collapsed</div></div><p>According to the Hebrew Bible, the Israelites took control of <strong>Jericho</strong> after the city walls crumbled.</p><div class="callout">The Jericho account is from the <strong>Hebrew Bible, book of Joshua, 6:16–20</strong>.</div>`,
      remember:'Jericho: six days marching; seventh day, shout → walls fell.'
    },
    {
      title:'The Judges and Deborah', eyebrow:'Topic 5 • Leaders after Joshua',
      body:`<p>The Hebrew Bible says Joshua led other battles. The Israelites divided seized land among the <strong>12 tribes</strong>.</p><div class="arrowline"><div class="step">Joshua died</div><span class="arrow">→</span><div class="step">Judges ruled the tribes</div><span class="arrow">→</span><div class="step">Judges settled disputes and led troops</div></div><div class="tile-grid"><div class="tile green"><b>Deborah</b><span>A woman judge admired for <strong>wisdom and bravery</strong>.</span></div><div class="tile cyan"><b>Barak</b><span>Deborah told commander <strong>Barak</strong> to attack the army of Canaanite king <strong>Jabin</strong>.</span></div></div><p>Deborah went to the battlefield as an adviser. With her help, <strong>Barak and 10,000 Israelites</strong> destroyed the Canaanite forces.</p>`,
      remember:'After Joshua → judges. Deborah advised Barak and 10,000 Israelites.'
    },
    {
      title:'Farming in Canaan', eyebrow:'Topic 6 • Everyday life',
      body:`<p>After many battles, the Israelites settled in the <strong>hilly central part of Canaan</strong>. Most farmed and herded animals.</p><div class="tile-grid"><div class="tile peach"><b>Challenge</b><span>The land was <strong>rocky and dry</strong>, with little water.</span></div><div class="tile cyan"><b>Rainy season</b><span>Farmers collected rainwater and stored it in small caves or underground.</span></div></div><div class="arrowline"><div class="step">Collect rainwater</div><span class="arrow">→</span><div class="step">Store it</div><span class="arrow">→</span><div class="step">Irrigate crops</div></div><p>They used the water for <strong>olives, flax, barley, and grapes</strong>.</p>`,
      remember:'Rocky, dry land → store rainwater → irrigate olives, flax, barley, grapes.'
    },
    {
      title:'Israelite Homes in Canaan', eyebrow:'Topic 6 • Everyday life',
      body:`<p class="lead">Most Israelites lived in houses with <strong>two levels</strong>.</p><table><thead><tr><th>Part of home</th><th>What the textbook says</th></tr></thead><tbody><tr><td>Walls</td><td>Mud-brick or stone; plastered with mud and whitewashed</td></tr><tr><td>Floor and roof</td><td>Clay floors; wooden beams supported a flat, thatched roof covered with clay</td></tr><tr><td><strong>Lower level</strong></td><td>Daytime cooking and chores; at night, donkeys and goats stayed there</td></tr><tr><td><strong>Upper level</strong></td><td>The family slept here</td></tr></tbody></table>`,
      remember:'Two levels: chores and animals below; family slept above.'
    },
    {
      title:'The Tabernacle and the Ark', eyebrow:'Topic 6 • Worship in Canaan',
      body:`<div class="tile-grid"><div class="tile"><b>Tabernacle</b><span>Large <strong>tent-like structure</strong> for worship. Israelites believed it housed <strong>God's presence</strong>.</span></div><div class="tile cyan"><b>Shiloh</b><span>In Canaan, they erected the tabernacle at a religious center called <strong>Shiloh</strong>.</span></div><div class="tile peach"><b>Ark of the Covenant</b><span>A sacred, <strong>gold-covered wooden chest</strong> that held tablets, or stone slabs.</span></div><div class="tile green"><b>Belief</b><span>The Israelites believed the tablets carried the <strong>Ten Commandments</strong> and the ark was a sign of God's presence.</span></div></div><p>The tabernacle could be <strong>taken down and put away</strong> when people moved. Its image caption mentions <strong>tapestries decorated with angels</strong>, a <strong>courtyard</strong>, and <strong>two rooms</strong>; it says the measurements came directly from God according to the Hebrew Bible. Israelites believed the ark in battle would <strong>ensure victory</strong>.</p><p class="small">Source word: <strong>ensure</strong> means “to make certain or make sure of.”</p>`,
      remember:'Tabernacle = movable worship tent; Ark = gold-covered chest with tablets.'
    },
    {
      title:'All 8 Teacher Vocabulary Words', eyebrow:'Keywords • End-of-lesson summary table',
      body:`<p class="lead">Book meanings are kept as printed. Use the short clue to remember.</p><table><thead><tr><th>Word</th><th>Textbook definition</th><th>Memory tip</th></tr></thead><tbody><tr><td><strong>prophet</strong></td><td>A messenger sent by God to share God's word with people</td><td>Messenger</td></tr><tr><td><strong>monotheism</strong></td><td>A belief in one God</td><td>One God</td></tr><tr><td><strong>tribe</strong></td><td>A social group made up of families or clans</td><td>Family group</td></tr><tr><td><strong>Exodus</strong></td><td>The departure of the Israelites out of slavery in Egypt</td><td>Leaving Egypt</td></tr><tr><td><strong>covenant</strong></td><td>An agreement with God</td><td>Agreement</td></tr><tr><td><strong>Torah</strong></td><td>Teachings that Moses received from God; later became the first part of the Hebrew Bible</td><td>Teachings</td></tr><tr><td><strong>commandment</strong></td><td>A rule that God wanted the Israelites to follow</td><td>Rule</td></tr><tr><td><strong>alphabet</strong></td><td>A set of letters or other characters used to write a language</td><td>Letters</td></tr></tbody></table><p class="small">The teacher lists “exodus” and “torah”; the textbook uses <strong>Exodus</strong> and <strong>Torah</strong>.</p>`,
      remember:'Messenger • one God • families • departure • agreement • teachings • rule • letters.'
    },
    {
      title:'Easy-to-Confuse Points', eyebrow:'Exam focus • Compare',
      body:`<table><thead><tr><th>Pair</th><th>Remember the difference</th></tr></thead><tbody><tr><td><strong>Monotheism / polytheism</strong></td><td>One God / more than one god</td></tr><tr><td><strong>Torah / commandment</strong></td><td>Teachings received by Moses / a rule God wanted followed</td></tr><tr><td><strong>Exodus / Passover</strong></td><td>Departure from slavery / festival remembering that freedom</td></tr><tr><td><strong>Phoenicians / Philistines</strong></td><td>Mediterranean sailors, traders, alphabet / five walled towns, iron tools and weapons</td></tr><tr><td><strong>Tabernacle / Ark</strong></td><td>Worship structure / chest holding tablets</td></tr><tr><td><strong>Joshua / judges</strong></td><td>Led battles to claim Canaan / ruled tribes after he died</td></tr></tbody></table>`,
      remember:'Teachings vs. rules; sailors vs. iron; tent vs. chest.'
    },
    {
      title:'Exam Focus: Names, Dates, and Sequence', eyebrow:'Final review • About 4 minutes',
      body:`<div class="tile-grid"><div class="tile"><b>Dates</b><span><strong>3000 B.C.</strong>: nomadic tribes in Canaan as early as this date. <strong>1200 B.C.</strong>: big changes; “Sea People” invaded about then.</span></div><div class="tile cyan"><b>Names</b><span><strong>Abraham, Sarah, Isaac, Jacob / Israel, Moses, Joshua, Deborah, Barak, Jabin</strong>.</span></div></div><div class="arrowline"><div class="step">Abraham → Isaac → Jacob</div><span class="arrow">→</span><div class="step">Egypt → Moses → Exodus</div><span class="arrow">→</span><div class="step">Joshua → Canaan → judges</div></div><ul class="factlist"><li><strong>Numbers:</strong> 12 tribes, 10 plagues, 10 commandments, 22 Phoenician letters, 5 Philistine towns, 10,000 Israelites with Barak.</li><li><strong>Causes and effects:</strong> famine → Egypt; slavery → Exodus; Phoenician alphabet → simpler records; dry land → rainwater storage.</li><li><strong>Places:</strong> Canaan, Egypt, Red Sea, Mount Sinai, Jericho, Shiloh, Carthage.</li></ul>`,
      remember:'Remember 12 tribes • 10 plagues • 10 commandments • 22 letters.'
    },
    {
      title:'Remember These Before the Test', eyebrow:'Final 4-minute review • Last slide before quiz',
      body:`<p class="lead">Read this checklist. Say one fact about each line without looking back.</p><ul class="checklist"><li><strong>Beliefs:</strong> monotheism, prophets, the Hebrew Bible / Tanakh.</li><li><strong>Family:</strong> Abraham → Isaac → Jacob / Israel → 12 tribes.</li><li><strong>Journey:</strong> famine → Egypt → slavery → Moses → Exodus → covenant.</li><li><strong>Rules:</strong> Torah and all 10 commandments, including Sabbath and parents.</li><li><strong>Canaan:</strong> Joshua, Jericho, judges, Deborah, Barak.</li><li><strong>Neighbors:</strong> Phoenician trade and alphabet; Philistine iron and five towns.</li><li><strong>Life:</strong> rainwater, two-level houses, tabernacle, Ark of the Covenant.</li><li><strong>Eight words:</strong> know the exact meanings in the vocabulary summary table.</li></ul><p class="small">Tap <strong>Start Quiz</strong> when ready.</p>`,
      remember:'Beliefs → leaders → Exodus → commandments → Canaan. You are ready!'
    }
  ];
  
  const questions = [
    // EASY • 1–10
    {q:'What is a prophet?',a:['A ruler of Egypt','A messenger sent by God to share God’s word','A group of families','A letter in an alphabet'],c:1,why:'The textbook calls a prophet a messenger sent by God to share God’s word.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What does monotheism mean?',a:['Worship of many gods','Writing letters right to left','A belief in one God','A group of clans'],c:2,why:'Monotheism means belief in one God.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What is a tribe?',a:['A social group made up of families or clans','A wooden chest','An agreement with God','A festival'],c:0,why:'A tribe is a social group of families or clans.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What was the Exodus?',a:['The building of a city','The start of a new alphabet','The first five commandments','The departure of the Israelites out of slavery in Egypt'],c:3,why:'The Exodus was the Israelites’ departure from slavery in Egypt.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What is a covenant?',a:['A type of ship','An agreement with God','A family home','A group of soldiers'],c:1,why:'The textbook defines covenant as an agreement with God.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What is the Torah?',a:['The teachings Moses received from God that became the first part of the Hebrew Bible','A Canaanite trading port','The name of Jacob’s son','A walled town'],c:0,why:'The Torah contains teachings Moses received from God.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What is a commandment?',a:['An early alphabet','A Phoenician trade good','A rule God wanted the Israelites to follow','A Canaanite leader'],c:2,why:'A commandment is a rule God wanted the Israelites to follow.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What is an alphabet?',a:['A promise to return to Canaan','A battle around Jericho','A social group of clans','A set of letters or other characters used to write a language'],c:3,why:'That is the vocabulary meaning printed in the source.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What other name does the textbook give the Hebrew Bible?',a:['Tabernacle','Tanakh','Carthage','Passover'],c:1,why:'The writings were called the Hebrew Bible or Tanakh.',topic:'Israelite beliefs',level:'Easy'},
    {q:'How many sons of Jacob became ancestors of the Twelve Tribes?',a:['22','5','12','10'],c:2,why:'Jacob’s 12 sons became leaders of the 12 family groups.',topic:'Early leaders',level:'Easy'},
  
    // MEDIUM • 11–20
    {q:'Which sequence of early Israelite leaders is correct?',a:['Abraham → Isaac → Jacob','Moses → Abraham → Isaac','Joshua → Jacob → Sarah','Deborah → Isaac → Moses'],c:0,why:'Isaac was Abraham’s son; Jacob was Abraham’s grandson.',topic:'Early leaders',level:'Medium'},
    {q:'Why did Jacob’s family first move from Canaan to Egypt?',a:['To learn the alphabet','To build five walled towns','To fight at Jericho','Because of a famine'],c:3,why:'The textbook says the family left Canaan because of a famine.',topic:'Egypt and Exodus',level:'Medium'},
    {q:'Why did the pharaoh force the Israelites into slavery?',a:['He wanted their purple dye','He feared that they would rebel','They had written the Torah','They had set up Shiloh'],c:1,why:'He grew uneasy as their population increased and feared rebellion.',topic:'Egypt and Exodus',level:'Medium'},
    {q:'What did the Hebrew Bible say happened after the pharaoh refused Moses?',a:['The Israelites built Carthage','The judges ruled Egypt','God sent 10 plagues on Egypt','Jacob changed his name'],c:2,why:'The Hebrew Bible describes ten plagues, including locusts and disease.',topic:'Egypt and Exodus',level:'Medium'},
    {q:'Which festival remembers the Israelites’ freedom from slavery?',a:['Passover','Sabbath Day','Exodus 20','Mount Sinai'],c:0,why:'Jews celebrate Passover to remember freedom from slavery.',topic:'Egypt and Exodus',level:'Medium'},
    {q:'Which pair of promises belongs to the covenant?',a:['Cedar for tin / glass for metals','Twelve sons / twelve tribes','Five towns / iron weapons','God would return them to Canaan / Israelites would follow his teachings'],c:3,why:'The covenant joined God’s promise of safe return with the people’s promise to obey.',topic:'Torah and covenant',level:'Medium'},
    {q:'Which commandment says to remember the Sabbath Day and keep it holy?',a:['The eighth','The fourth','The tenth','The sixth'],c:1,why:'The textbook infographic shows that as Commandment 4.',topic:'Ten Commandments',level:'Medium'},
    {q:'Which group had an alphabet of 22 letters written right to left?',a:['The Philistines','The Egyptian pharaohs','The Phoenicians','The judges'],c:2,why:'The Early Alphabets infographic gives both details for the Phoenicians.',topic:'Phoenicians and alphabet',level:'Medium'},
    {q:'What was the beautiful purple dye of the Phoenicians extracted from?',a:['Shellfish along the coast','Barley in the hills','Clay house floors','Iron weapons'],c:0,why:'The textbook says the purple dye was extracted from shellfish.',topic:'Phoenician trade',level:'Medium'},
    {q:'What helped the Philistines build the strongest army in Canaan?',a:['The ark and tablets','Purple cloth','Rainwater storage','Iron tools and weapons'],c:3,why:'Their skill making iron tools and weapons helped them form a strong army.',topic:'Philistines',level:'Medium'},
  
    // HARD • 21–30
    {q:'Someone says polytheism and monotheism mean the same thing. What is correct?',a:['Both mean a family group','Polytheism means many gods; monotheism means one God','Both mean rules given at Mount Sinai','Polytheism means one God; monotheism means many'],c:1,why:'The textbook contrasts worshipping many gods with belief in one God.',topic:'Belief comparisons',level:'Hard'},
    {q:'A student reads about an event at Mount Sinai. Which statement matches the source?',a:['Abraham was given the alphabet','Barak built the tabernacle','Moses received teachings from God that became the Torah','Joshua became the Egyptian pharaoh'],c:2,why:'At Mount Sinai, Moses received teachings that became the Torah.',topic:'Torah and covenant',level:'Hard'},
    {q:'The textbook says settlers reached Canaan as early as 3000 B.C. Who were they?',a:['Nomadic tribes who later farmed and traded','The 10,000 Israelites with Barak','Roman alphabet teachers','The pharaoh’s army'],c:0,why:'Nomadic tribes likely settled Canaan as early as 3000 B.C.',topic:'Dates and Canaan',level:'Hard'},
    {q:'A sailor uses the sun and stars to cross the Mediterranean while trading. Which group fits?',a:['Judges','Egyptian pharaohs','Jacob’s sons','Phoenicians'],c:3,why:'Phoenician sailors used the sun and stars to plot long voyages.',topic:'Phoenicians and alphabet',level:'Hard'},
    {q:'Which pairing is correct according to the source?',a:['Carthage — battle where Joshua marched','Jericho — walls crumbled after a seventh-day shout','Shiloh — Egyptian slave city','Mount Sinai — Philistine port'],c:1,why:'The book of Joshua describes a seventh-day shout and Jericho’s falling walls.',topic:'Places and events',level:'Hard'},
    {q:'Who ruled the Israelite tribes after Joshua died?',a:['The Phoenician sailors','The pharaoh','Judges who settled disputes and led troops','The twelve sons of Abraham'],c:2,why:'After Joshua’s death, judges ruled and led the tribes.',topic:'Joshua and judges',level:'Hard'},
    {q:'What did Deborah tell Barak to do?',a:['Attack the army of Canaanite king Jabin','Build the first Phoenician alphabet','Lead the people out of Egypt','Move the tabernacle to Carthage'],c:0,why:'Deborah advised Barak to attack king Jabin’s army.',topic:'Joshua and judges',level:'Hard'},
    {q:'On dry, rocky land, what did Israelite farmers do to water crops?',a:['They used Phoenician purple dye','They waited for iron tools from Greece','They dug for the tablets of the covenant','They collected and stored rainwater for irrigation'],c:3,why:'The textbook describes stored rainwater used to irrigate crops.',topic:'Daily life in Canaan',level:'Hard'},
    {q:'A family slept upstairs while donkeys and goats stayed below at night. Which home fits?',a:['A Phoenician trading ship','An Israelite two-level house in Canaan','The Ark of the Covenant','A Philistine iron workshop'],c:1,why:'Families slept on the upper level; animals stayed on the lower level.',topic:'Daily life in Canaan',level:'Hard'},
    {q:'Which statement correctly compares the tabernacle and Ark of the Covenant?',a:['Both were alphabets','The tabernacle was a walled town and the ark a ship','The tabernacle was a worship tent; the ark was a gold-covered chest holding tablets','The tabernacle was the Exodus; the ark was Passover'],c:2,why:'The tabernacle was a movable worship structure; the ark held stone tablets.',topic:'Tabernacle and Ark',level:'Hard'}
  ];
  

  let state = {mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const score = () => state.answers.reduce((n,a,i)=>n+(a===questions[i].c?1:0),0);
  const isReview = () => state.mode==='slide' && state.index>=slides.length-2;
  function phaseUI(){
    const n = state.mode==='quiz'||state.mode==='result'?2:isReview()?1:0;
    ['phaseTeach','phaseReview','phaseQuiz'].forEach((id,i)=>{const e=$(id);e.classList.toggle('active',i===n);e.classList.toggle('done',i<n);});
  }
  function render(){
    phaseUI();
    if(state.mode==='slide') renderSlide();
    else if(state.mode==='quiz') renderQuiz();
    else renderResult();
    canvas.scrollTop=0;
    $('progress').setAttribute('aria-valuenow',Math.round(parseFloat($('progressFill').style.width)||0));
  }
  function chrome(mode,counter,percent,remember,nextLabel){
    $('modeLabel').textContent=mode;
    $('counter').textContent=counter;
    $('progressFill').style.width=percent+'%';
    $('rememberText').textContent=remember;
    $('nextBtn').textContent=nextLabel;
  }
  function renderSlide(){
    const s=slides[state.index];
    canvas.innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}`;
    chrome(isReview()?'Final review':'Learning time',`Slide ${state.index+1} of ${slides.length}`,100*(state.index+1)/slides.length,s.remember,state.index===slides.length-1?'Start Quiz →':'Next →');
    $('backBtn').disabled=state.index===0;
    $('nextBtn').disabled=false;
  }
  function renderQuiz(){
    const q=questions[state.qi],chosen=state.answers[state.qi],done=chosen!==null;
    const choices=q.a.map((option,i)=>{
      const cls=done?(i===q.c?' correct':i===chosen?' wrong':''):'';
      return `<button type="button" class="option${cls}" data-choice="${i}" ${done?'disabled':''} aria-label="Option ${'ABCD'[i]}: ${escapeHtml(option)}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(option)}</span></button>`;
    }).join('');
    const feedback=done?`<div class="feedback ${chosen===q.c?'':'bad'}" role="status"><b>${chosen===q.c?'✅ Correct!':'❌ Incorrect'}</b><p><strong>Correct answer: ${'ABCD'[q.c]}.</strong> ${escapeHtml(q.a[q.c])}</p><p>${escapeHtml(q.why)}</p></div>`:'';
    canvas.innerHTML=`<div class="eyebrow">Practice • ${escapeHtml(q.topic)}</div><h2>Check Your Understanding</h2><div class="quizmeta"><span class="bubble ${q.level.toLowerCase()}">${q.level}</span><span class="bubble">Score: ${score()} / ${questions.length}</span></div><div class="question">${escapeHtml(q.q)}</div><div class="choices">${choices}</div>${feedback}`;
    canvas.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>answerQuestion(Number(btn.dataset.choice))));
    chrome('Quiz time',`Question ${state.qi+1} of ${questions.length}`,100*(state.qi+1)/questions.length,done?'Learn from the explanation, then move on.':'Choose A, B, C, or D. Feedback appears after you answer.',state.qi===questions.length-1?'See Results →':'Next Question →');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=!done;
  }
  function answerQuestion(choice){
    if(state.mode!=='quiz'||state.answers[state.qi]!==null)return;
    state.answers[state.qi]=choice;
    render();
  }
  function renderResult(){
    const total=score(),pct=Math.round(total*100/questions.length);
    const missed={}; questions.forEach((q,i)=>{if(state.answers[i]!==q.c)missed[q.topic]=(missed[q.topic]||0)+1;});
    const areas=Object.entries(missed).sort((a,b)=>b[1]-a[1]);
    const review=areas.length?areas.map(([name,count])=>`<div class="review-item">📘 ${escapeHtml(name)} <span class="small">(${count} to review)</span></div>`).join(''):'<div class="review-item ok">🌟 Great work — no missed topics!</div>';
    canvas.innerHTML=`<div class="eyebrow">Quiz complete • Your result</div><div class="final-score"><h2>Nice Work!</h2><p class="lead">You finished all 30 questions.</p><div class="score-ring" style="--score:${pct}%"><div>${total}/30</div></div><p><strong>${pct}% correct</strong></p></div><h3>Topics to Review</h3><div class="review-grid">${review}</div><p class="small" style="margin-top:18px">Use Back to revisit your last answer, or Restart to study the whole lesson again.</p>`;
    chrome('Quiz complete','Final score',100,'Your results show what to review before the test.','Review Quiz ←');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=false;
  }
  function next(){
    if(state.mode==='slide'){
      if(state.index<slides.length-1)state.index++;
      else {state.mode='quiz';state.qi=0;}
    } else if(state.mode==='quiz'){
      if(state.answers[state.qi]===null)return;
      if(state.qi<questions.length-1)state.qi++;
      else state.mode='result';
    } else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function back(){
    if(state.mode==='slide')state.index=Math.max(0,state.index-1);
    else if(state.mode==='quiz'){
      if(state.qi===0){state.mode='slide';state.index=slides.length-1;}
      else state.qi--;
    }
    else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function restart(){
    if(state.mode==='slide'&&state.index===0)return;
    if(!window.confirm('Restart the lesson and clear your quiz answers?'))return;
    state={mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
    render();
  }
  $('nextBtn').addEventListener('click',next);
  $('backBtn').addEventListener('click',back);
  $('restartBtn').addEventListener('click',restart);
  window.addEventListener('keydown',e=>{
    if(e.target.closest('button'))return;
    if(e.key==='ArrowRight'&&!$('nextBtn').disabled)next();
    if(e.key==='ArrowLeft'&&!$('backBtn').disabled)back();
  });
  render();
  </script>
</body>
</html>
