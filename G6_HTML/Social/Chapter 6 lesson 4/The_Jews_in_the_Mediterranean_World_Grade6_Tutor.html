<body>
  <div class="shell">
    <aside class="rail" aria-label="Lesson overview">
      <div class="brand">Grade 6 • Touchscreen Tutor</div>
      <h1>Jews in the<br>Mediterranean World</h1>
      <p>Greek and Roman rule, Jewish groups, and rabbis.</p>
      <div class="time-pill">⏱ Teaching: about 15–20 minutes</div>
      <div class="section-steps">
        <div class="phase active" id="phaseTeach"><span class="phase-number">1</span><span>Teaching slides</span></div>
        <div class="phase" id="phaseReview"><span class="phase-number">2</span><span>Final review</span></div>
        <div class="phase" id="phaseQuiz"><span class="phase-number">3</span><span>30-question quiz</span></div>
      </div>
      <div class="tiny-note">Based only on the supplied textbook pages.</div>
    </aside>

    <main class="main" aria-label="Interactive lesson">
      <header class="topbar"><div class="status"><span class="dot"></span><span id="modeLabel">Learning time</span></div><div class="count" id="counter">Slide 1 of 31</div></header>
      <div class="track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="progressFill"></div></div>
      <section class="canvas" id="canvas" tabindex="-1" aria-live="polite"></section>
      <div class="remember" id="remember"><b>⭐ Remember</b><span id="rememberText"></span></div>
      <footer class="bottom">
        <button class="nav secondary" id="backBtn" type="button">← Back</button>
        <button class="nav minor" id="restartBtn" type="button">↺ Restart</button>
        <span class="spacer"></span>
        <button class="nav primary" id="nextBtn" type="button">Next →</button>
      </footer>
    </main>
  </div>
  <script>
  'use strict';
  const slides = [
    {title:'What You Must Know',eyebrow:'Start here • Lesson map',body:`<p class="lead">The essential question is <strong>“Why does conflict develop?”</strong> This chapter follows Jews under Greek and Roman rule.</p><div class="tile-grid three"><div class="tile"><b>🌍 Greek rule</b><span>Alexander, Diaspora, Seleucids, Maccabees</span></div><div class="tile cyan"><b>🏛️ Roman rule</b><span>Herod, Jewish groups, revolts, Jerusalem</span></div><div class="tile peach"><b>📜 Jewish learning</b><span>Rabbis, Torah schools, Mishnah, Talmud</span></div></div><div class="callout">Teacher's two vocabulary words: <strong>diaspora</strong> and <strong>rabbi</strong>.</div><p class="small">Watch for names, dates, reasons for conflict, and how Jewish ideas spread.</p>`,remember:'Greek rule → Roman rule → rabbis and Jewish teachings.'},
    {title:'Alexander and the Greeks',eyebrow:'Topic 1 • Arrival of Greek rule',body:`<p>The Jews of <strong>Judah</strong> remained under Persian rule for nearly <strong>200 years</strong>.</p><div class="arrowline"><div class="step">331 B.C.</div><span class="arrow">→</span><div class="step">Alexander the Great defeated Persians</div><span class="arrow">→</span><div class="step">Greek language and culture introduced</div></div><p><strong>Alexander the Great</strong> was a king from <strong>Macedonia</strong> who had conquered Greece. He admired Greek ways and wanted to spread them.</p><p>Alexander <strong>allowed Jews to stay in Judah</strong>.</p>`,remember:'331 B.C.: Alexander defeated the Persians and spread Greek culture.'},
    {title:'What Is the Diaspora?',eyebrow:'Topic 1 • Teacher vocabulary',body:`<div class="callout"><strong>Diaspora:</strong> the groups of Jews living outside of the Jewish homeland.</div><p><strong>Diaspora</strong> is a Greek word meaning <strong>“scattered.”</strong></p><div class="arrowline"><div class="step">Jews lived outside Judah</div><span class="arrow">→</span><div class="step">Settled in other lands</div><span class="arrow">→</span><div class="step">Practiced customs and spread Jewish ideas</div></div><p>Under Alexander, Judah remained the <strong>center of Judaism</strong>, even though many Jews lived elsewhere.</p>`,remember:'Diaspora = groups outside homeland; Greek meaning “scattered.”'},
    {title:'Why Did Jews Live Outside Judah?',eyebrow:'Topic 1 • Causes and places',body:`<p>Thousands had been exiled to <strong>Babylon in 586 B.C.</strong> When the Persians allowed return to Judah in <strong>538 B.C.</strong>, many stayed in Babylon or moved elsewhere.</p><div class="tile-grid"><div class="tile"><b>Babylon</b><span>Some Jews chose to remain there.</span></div><div class="tile cyan"><b>Other Mediterranean lands</b><span>Other Jews settled throughout this region.</span></div></div><div class="arrowline"><div class="step">Exile and later choices</div><span class="arrow">→</span><div class="step">Jews living abroad</div><span class="arrow">→</span><div class="step">Diaspora communities</div></div><p>As they practiced Jewish customs outside Judah, Jewish ideas spread.</p>`,remember:'586 B.C. exile → 538 B.C. permission to return → many lived abroad.'},
    {title:'Jewish Ideas Spread in Greek',eyebrow:'Topic 1 • The Septuagint',body:`<p>Jews of the Diaspora remained loyal to <strong>Judaism</strong>. Many learned the <strong>Greek language</strong> and adopted features of Greek culture.</p><div class="arrowline"><div class="step">Jewish scholars in Egypt</div><span class="arrow">→</span><div class="step">Copied Hebrew Bible into Greek</div><span class="arrow">→</span><div class="step">More people could read it</div></div><div class="callout">The Greek version of the Hebrew Bible is called the <strong>Septuagint</strong>.</div><p>It helped people who were <strong>not Jews</strong> read and understand the Hebrew Bible, spreading Jewish ideas through the Mediterranean.</p>`,remember:'Septuagint = Greek version of Hebrew Bible; it helped ideas spread.'},
    {title:'From Alexander to the Seleucids',eyebrow:'Topic 1 • New rulers',body:`<p>After Alexander died, <strong>four generals</strong> divided his empire into separate kingdoms.</p><div class="arrowline"><div class="step">Alexander died</div><span class="arrow">→</span><div class="step">Four generals divided empire</div><span class="arrow">→</span><div class="step">Seleucids ruled much of Southwest Asia</div></div><p>The <strong>Seleucids</strong> were a family ruling one kingdom. By <strong>200 B.C.</strong>, Judah was under the control of Seleucid kings.</p>`,remember:'After Alexander: four kingdoms; Seleucids controlled Judah by 200 B.C.'},
    {title:'Antiochus IV and Religious Conflict',eyebrow:'Topic 1 • Cause of revolt',body:`<p>In <strong>176 B.C.</strong>, <strong>Antiochus IV</strong> came to power as a Seleucid king.</p><div class="tile-grid"><div class="tile peach"><b>He ruled Judah</b><span>He was the ruler of the Seleucid kingdom.</span></div><div class="tile pink"><b>He required</b><span>Jews to worship the many <strong>Greek gods and goddesses</strong>.</span></div></div><div class="arrowline"><div class="step">Required Greek worship</div><span class="arrow">→</span><div class="step">Many Jews refused to leave their religion</div><span class="arrow">→</span><div class="step">Revolt</div></div>`,remember:'176 B.C.: Antiochus IV required worship of Greek gods.'},
    {title:'Judas Maccabeus Leads the Revolt',eyebrow:'Topic 1 • 167 B.C.',body:`<p>In <strong>167 B.C.</strong>, a Jewish priest named <strong>Judas Maccabeus</strong> led the fight against Seleucid rule. The biography gives his life as <strong>c. 190 B.C.–c. 160 B.C.</strong></p><div class="arrowline"><div class="step">Judas and followers fled to hills</div><span class="arrow">→</span><div class="step">Formed a rebel army</div><span class="arrow">→</span><div class="step">Fought many battles</div></div><p>They became known as the <strong>Maccabees</strong>. The biography says they used <strong>guerrilla warfare</strong>: irregular fighting by small groups of independent soldiers.</p><div class="callout">This strategy helped them defeat the Seleucids.</div>`,remember:'167 B.C.: priest Judas Maccabeus led the Maccabees.'},
    {title:'The Temple and Hanukkah',eyebrow:'Topic 1 • What the revolt achieved',body:`<p>After many battles, the Maccabees captured the <strong>Temple</strong>.</p><div class="arrowline"><div class="step">Captured Temple</div><span class="arrow">→</span><div class="step">Cleared statues of Greek gods and goddesses</div><span class="arrow">→</span><div class="step">Rededicated Temple to worship of God</div></div><p>Every year, Jews recall the cleansing of the Temple during the festival of <strong>Hanukkah</strong>.</p><p>The biography says Judas expanded Judah's lands and helped it remain free until the Roman conquest.</p>`,remember:'Maccabees cleaned and rededicated Temple → Hanukkah remembers.'},
    {title:'Roman Rule Begins',eyebrow:'Topic 2 • Dates and names',body:`<p>By <strong>100 B.C.</strong>, the Romans controlled much of the eastern Mediterranean lands.</p><div class="arrowline"><div class="step">Roman empire grew</div><span class="arrow">→</span><div class="step">63 B.C.: Romans conquered Judah</div><span class="arrow">→</span><div class="step">Renamed it Judaea</div></div><p>The name <strong>Roman</strong> came from <strong>Rome</strong>, their capital, in what is known today as <strong>Italy</strong>.</p><div class="callout">Exam pair: <strong>63 B.C. → Rome conquered Judah → Judaea</strong>.</div>`,remember:'100 B.C. Romans widespread; 63 B.C. Judah became Judaea.'},
    {title:'Herod and the Second Temple',eyebrow:'Topic 2 • A Roman-backed king',body:`<p>At first, the Romans chose <strong>Herod</strong>, a follower of the Jewish religion, to rule as king of Judaea.</p><div class="tile-grid"><div class="tile"><b>Building</b><span>Herod built many <strong>forts and cities</strong> in Judaea.</span></div><div class="tile cyan"><b>Second Temple</b><span>Rebuilt during Herod's reign, it served as the center of <strong>Jewish worship</strong>.</span></div><div class="tile peach"><b>Masada</b><span>The source caption says Herod developed the fortress at <strong>Masada</strong>.</span></div></div>`,remember:'Herod: forts and cities; Second Temple rebuilt during his reign.'},
    {title:'Why Jewish Groups Disagreed',eyebrow:'Topic 2 • Different practices',body:`<p>After Herod died, <strong>Roman officials</strong> ruled Judaea. Jews differed about how Judaism should be practiced and how to deal with Romans.</p><div class="tile-grid"><div class="tile"><b>Pharisees</b><span>Teachings for daily life; oral and written law</span></div><div class="tile cyan"><b>Sadducees</b><span>Temple roles; written law; cooperation</span></div><div class="tile peach"><b>Essenes</b><span>Qumran; prayer; written Torah</span></div><div class="tile pink"><b>Zealots</b><span>Wanted to fight Romans for freedom</span></div></div>`,remember:'Four groups: Pharisees • Sadducees • Essenes • Zealots.'},
    {title:'The Pharisees',eyebrow:'Topic 2 • Everyday practice',body:`<p>The <strong>Pharisees</strong> gained the support of common people.</p><ul class="factlist"><li>Taught in <strong>synagogues</strong> and applied the <strong>Torah</strong> to daily life.</li><li>Helped make Judaism a religion of the <strong>home and family</strong>.</li><li>Wanted Jews to obey the <strong>Ten Commandments</strong>.</li><li>Stressed both <strong>written law</strong> and <strong>oral law</strong>.</li></ul><div class="callout"><strong>Oral law</strong> = unwritten explanations passed by word of mouth.</div><p>They wanted Judaea free of Rome but urged people to resist by practicing Torah with greater <strong>devotion</strong>, not fighting.</p>`,remember:'Pharisees: synagogue, daily life, written + oral law, no fight.'},
    {title:'The Sadducees',eyebrow:'Topic 2 • Temple and written law',body:`<p>The <strong>Sadducees</strong> were made up of wealthy noble families. Many served as <strong>priests and scribes</strong> in the Temple.</p><div class="tile-grid"><div class="tile"><b>Accepted</b><span>The <strong>written laws of the Torah</strong>.</span></div><div class="tile peach"><b>Rejected</b><span>The <strong>oral law</strong> stressed by the Pharisees.</span></div><div class="tile cyan"><b>Main concern</b><span>Applying law to <strong>Temple ceremonies</strong>.</span></div><div class="tile green"><b>Roman relations</b><span>Favored <strong>cooperation</strong> with Romans for peace and order in Judaea.</span></div></div>`,remember:'Sadducees: wealthy Temple group; written law only; cooperate with Rome.'},
    {title:'The Essenes',eyebrow:'Topic 2 • Qumran near Dead Sea',body:`<p>The <strong>Essenes</strong> were priests who broke away from the Temple in Jerusalem.</p><div class="arrowline"><div class="step">Left Temple</div><span class="arrow">→</span><div class="step">Many lived at Qumran near the Dead Sea</div><span class="arrow">→</span><div class="step">Prayed and waited for God to deliver Jews</div></div><p>The Essenes followed only the <strong>written law of the Torah</strong>.</p><div class="callout">Place: <strong>Qumran</strong> was in the desert near the <strong>Dead Sea</strong>.</div>`,remember:'Essenes: Qumran, prayer, written Torah only.'},
    {title:'The Dead Sea Scrolls: 1947',eyebrow:'Topic 2 • Discovery',body:`<p>In <strong>A.D. 1947</strong>, ancient scrolls were found in caves at <strong>Qumran</strong>, near the <strong>Dead Sea</strong>.</p><div class="tile-grid"><div class="tile"><b>Name</b><span><strong>Dead Sea Scrolls</strong>, named after the nearby sea</span></div><div class="tile cyan"><b>Likely authors</b><span>The source says many were <strong>most likely written by Essenes</strong>.</span></div></div><p>They help historians learn details about a particular place and time.</p>`,remember:'1947: Dead Sea Scrolls found at Qumran, likely written by Essenes.'},
    {title:'What Do the Scrolls Tell Us?',eyebrow:'Topic 2 • Different Jewish beliefs',body:`<p>The scrolls showed that followers did not all practice Judaism the same way during Roman times.</p><ul class="factlist"><li>Some describe Jews in exile who felt alone and waited for someone to lead them.</li><li>Some record beliefs, holy days, and practices of other Jewish groups.</li><li>Some historians think the writings might have been a <strong>library's contents</strong>.</li></ul><div class="callout">Why the scrolls were hidden is <strong>unclear</strong>. The source says someone <em>may have</em> hidden them to protect them from destruction during Roman conflict.</div>`,remember:'Scrolls show different practices; the hiding reason is unclear.'},
    {title:'The Zealots',eyebrow:'Topic 2 • Fighting for freedom',body:`<p>A fourth Jewish group, the <strong>Zealots</strong>, lived in Judaea and wanted to <strong>fight the Romans</strong> for freedom.</p><div class="arrowline"><div class="step">Tensions rose in A.D. 60s</div><span class="arrow">→</span><div class="step">Hatred of Roman rule grew</div><span class="arrow">→</span><div class="step">Zealots prepared to act</div></div><p>Many Jews were waiting for God to send a deliverer. As tensions increased, the Zealots prepared for revolt.</p>`,remember:'Zealots wanted to fight Rome; tension grew in the A.D. 60s.'},
    {title:'The Jewish–Roman War',eyebrow:'Topic 3 • A.D. 66 to 70',body:`<div class="arrowline"><div class="step">A.D. 66: Zealots revolted</div><span class="arrow">→</span><div class="step">Overpowered a small Roman army in Jerusalem</div><span class="arrow">→</span><div class="step">Four years later, Romans retook city</div></div><p>Roman forces retook <strong>Jerusalem</strong>, killed thousands of Jews, and forced many others to leave.</p><p>The Romans also destroyed the <strong>Second Temple</strong> in Jerusalem.</p><div class="callout">Date pair: <strong>A.D. 66 → revolt; A.D. 70 → Roman capture and Temple destruction</strong>.</div>`,remember:'A.D. 66 revolt → A.D. 70 Romans retook Jerusalem, destroyed Temple.'},
    {title:'The Western Wall',eyebrow:'Topic 3 • A remnant in Jerusalem',body:`<p>The source says the <strong>Western Wall</strong> still stands in <strong>Jerusalem</strong>.</p><div class="tile-grid"><div class="tile"><b>What remained?</b><span>The Western Wall is all that remains of the <strong>Temple complex</strong>, according to the textbook.</span></div><div class="tile cyan"><b>What do Jews do?</b><span>Jewish people have a long-standing custom of visiting this wall to <strong>pray</strong>.</span></div></div><p>After the Temple was destroyed, Jews no longer had the Temple as the center of worship described earlier.</p>`,remember:'Western Wall remains in Jerusalem; many Jews go there to pray.'},
    {title:'Bar Kochba’s Revolt',eyebrow:'Topic 3 • A.D. 132',body:`<p>After some years, some Jews rebelled again against Roman rule.</p><div class="arrowline"><div class="step">A.D. 132</div><span class="arrow">→</span><div class="step">Simon ben Kosiba, called Bar Kochba, led Jews</div><span class="arrow">→</span><div class="step">They fought for freedom</div></div><p>Three years later, Roman forces crushed the revolt and killed <strong>Bar Kochba</strong> and many other Jewish leaders.</p>`,remember:'A.D. 132: Bar Kochba led revolt; three years later it was crushed.'},
    {title:'After Bar Kochba: Roman Controls',eyebrow:'Topic 3 • What changed?',body:`<p>After the revolt was put down, Romans imposed <strong>stricter controls</strong>.</p><div class="tile-grid"><div class="tile pink"><b>Jerusalem</b><span>Jews were not allowed to <strong>live in</strong> or even <strong>visit</strong> the city.</span></div><div class="tile peach"><b>Name</b><span>Romans renamed <strong>Judaea</strong> and called it <strong>Palestine</strong>.</span></div></div><p>The textbook explains that the name <strong>Palestine</strong> refers to the <strong>Philistines</strong>, whom the Israelites had conquered centuries before.</p>`,remember:'After revolt: no Jews living/visiting Jerusalem; Judaea renamed Palestine.'},
    {title:'What Is a Rabbi?',eyebrow:'Topic 4 • Teacher vocabulary',body:`<div class="callout"><strong>Rabbi:</strong> the official leader of a Jewish congregation.</div><p>After the Jews lost their fight for independence, they regrouped with help from <strong>rabbis</strong>, or religious leaders.</p><div class="arrowline"><div class="step">No temple or priests</div><span class="arrow">→</span><div class="step">Synagogues and rabbis gained importance</div><span class="arrow">→</span><div class="step">Torah teaching continued</div></div><p>Rabbis explained the <strong>Torah</strong> and gave <strong>moral guidance</strong> about right and wrong.</p>`,remember:'Rabbi = Jewish congregation leader; taught Torah and moral guidance.'},
    {title:'Yohanan ben Zaccai and Yavneh',eyebrow:'Topic 4 • A famous rabbi',body:`<p>One famous rabbi was <strong>Yohanan ben Zaccai</strong>. He lived in Judaea when Jerusalem fell in <strong>A.D. 70</strong>.</p><div class="arrowline"><div class="step">Persuaded Romans to spare Yavneh</div><span class="arrow">→</span><div class="step">Founded a school there</div><span class="arrow">→</span><div class="step">Continued teaching Torah</div></div><p>Ben Zaccai helped Judaism survive the destruction of the Temple and loss of Jerusalem.</p>`,remember:'Ben Zaccai saved Yavneh and founded a Torah school after A.D. 70.'},
    {title:'Learning and Kindness',eyebrow:'Topic 4 • Torah schools',body:`<div class="tile-grid"><div class="tile green"><b>What Ben Zaccai valued</b><span>Study of the <strong>Torah</strong>, acts of <strong>loving kindness</strong>, and <strong>community service</strong>.</span></div><div class="tile cyan"><b>What followed</b><span>The school at <strong>Yavneh</strong> became a center for Torah studies and a model for other schools.</span></div></div><p>Other rabbis founded Torah schools as far away as <strong>Babylon</strong> and <strong>Egypt</strong>. Ben Zaccai and other rabbis helped preserve the basic beliefs of Judaism.</p>`,remember:'Yavneh → Torah study + kindness; schools spread to Babylon and Egypt.'},
    {title:'The Mishnah',eyebrow:'Topic 4 • Jewish law recorded',body:`<p>Rabbis gathered their <strong>oral discussions</strong> about Jewish law.</p><div class="arrowline"><div class="step">Rabbis discussed Jewish law</div><span class="arrow">→</span><div class="step">Discussions recorded</div><span class="arrow">→</span><div class="step">Work called Mishnah</div></div><div class="callout"><strong>Mishnah:</strong> the work in which rabbis recorded oral discussions about Jewish law, according to the textbook.</div><p>This helped preserve teachings after the loss of the Temple.</p>`,remember:'Oral discussions about Jewish law → Mishnah.'},
    {title:'The Talmud',eyebrow:'Topic 4 • Continuing Jewish tradition',body:`<p>The <strong>Mishnah</strong> was later combined with other Jewish legal traditions into the <strong>Talmud</strong>.</p><div class="arrowline"><div class="step">Mishnah</div><span class="arrow">+</span><div class="step">Other Jewish legal traditions</div><span class="arrow">→</span><div class="step">Talmud</div></div><ul class="factlist"><li>The Hebrew word <strong>Talmud</strong> means <strong>“instruction.”</strong></li><li>It became the basis for Jewish teaching through the ages.</li><li>The text says it remains central today and is the ultimate authority on <strong>Jewish law</strong>.</li><li>A prayer quoted from the <strong>Babylon Talmud</strong> shows reverence for the Torah.</li></ul>`,remember:'Mishnah + legal traditions → Talmud (“instruction”).'},
    {title:'Teacher Vocabulary Summary',eyebrow:'Keywords • Exact book definitions',body:`<p class="lead">Two words from the teacher. Learn the book meaning and memory tip.</p><table><thead><tr><th>Word</th><th>Meaning from textbook</th><th>Memory tip</th></tr></thead><tbody><tr><td><strong>Diaspora</strong></td><td>The groups of Jews living outside of the Jewish homeland</td><td>Scattered abroad</td></tr><tr><td><strong>rabbi</strong></td><td>The official leader of a Jewish congregation</td><td>Community leader</td></tr></tbody></table><p class="small">Additional bold academic words from the source: <strong>version</strong> = a different form or edition; a translation of the Bible. <strong>expand</strong> = to enlarge. <strong>devotion</strong> = dedication, a strong commitment. <strong>cooperation</strong> = working together. <strong>document</strong> = an official paper used as proof or support of something.</p>`,remember:'Diaspora = outside homeland. Rabbi = congregation leader.'},
    {title:'Easy-to-Confuse Points',eyebrow:'Exam focus • Comparison table',body:`<table><thead><tr><th>Do not confuse</th><th>Key difference</th></tr></thead><tbody><tr><td><strong>Alexander / Antiochus IV</strong></td><td>Alexander spread Greek culture and let Jews stay / Antiochus required worship of Greek gods</td></tr><tr><td><strong>Pharisees / Sadducees</strong></td><td>Written + oral law and daily life / written law, Temple and Roman cooperation</td></tr><tr><td><strong>Essenes / Zealots</strong></td><td>Qumran, prayer, written Torah / wanted to fight Rome</td></tr><tr><td><strong>Maccabees / Zealots</strong></td><td>Revolted against Seleucids / revolted against Romans</td></tr><tr><td><strong>Mishnah / Talmud</strong></td><td>Recorded rabbinic oral discussions / Mishnah combined with other legal traditions</td></tr><tr><td><strong>A.D. 70 / A.D. 1947</strong></td><td>Second Temple destroyed / Dead Sea Scrolls discovered</td></tr></tbody></table>`,remember:'Greek conflict = Maccabees; Roman conflict = Zealots and Bar Kochba.'},
    {title:'Exam Focus: Dates and Cause → Effect',eyebrow:'Final review • Key timeline',body:`<div class="tile-grid"><div class="tile"><b>Greek rule</b><span><strong>331 B.C.</strong> Alexander; <strong>200 B.C.</strong> Seleucids; <strong>176 B.C.</strong> Antiochus IV; <strong>167 B.C.</strong> Maccabees.</span></div><div class="tile cyan"><b>Roman rule</b><span><strong>100 B.C.</strong> region; <strong>63 B.C.</strong> Judaea; <strong>A.D. 66</strong> revolt; <strong>A.D. 70</strong> Temple destroyed; <strong>A.D. 132</strong> Bar Kochba.</span></div></div><ul class="factlist"><li><strong>Other date:</strong> <strong>A.D. 1947</strong> Dead Sea Scrolls found near Qumran.</li><li><strong>Causes:</strong> Greek worship demanded → Maccabean revolt; Roman rule and tensions → Jewish–Roman wars.</li><li><strong>Effects:</strong> Temple lost → synagogues and rabbis gained importance; Torah schools and writings preserved beliefs.</li><li><strong>Names:</strong> Alexander, Antiochus IV, Judas Maccabeus, Herod, Bar Kochba, Yohanan ben Zaccai.</li></ul>`,remember:'331–200–176–167 B.C. → 63 B.C. → A.D. 66–70–132 → 1947.'},
    {title:'Remember These Before the Test',eyebrow:'Final 4-minute review • Last slide before quiz',body:`<p class="lead">Read this checklist once, then say the answers without looking.</p><ul class="checklist"><li><strong>Diaspora:</strong> Jews outside homeland; Greek meaning “scattered.”</li><li><strong>Alexander:</strong> 331 B.C.; spread Greek culture. <strong>Septuagint:</strong> Greek Hebrew Bible.</li><li><strong>Maccabees:</strong> Judas led revolt in 167 B.C.; Hanukkah remembers Temple cleansing.</li><li><strong>Romans:</strong> Judah conquered in 63 B.C., renamed Judaea; Herod and Second Temple.</li><li><strong>Groups:</strong> Pharisees, Sadducees, Essenes, Zealots—know differences.</li><li><strong>Wars:</strong> A.D. 66 revolt; A.D. 70 Temple destroyed; A.D. 132 Bar Kochba.</li><li><strong>Dead Sea Scrolls:</strong> found near Qumran in A.D. 1947.</li><li><strong>Rabbi:</strong> Jewish congregation leader. <strong>Ben Zaccai:</strong> Yavneh school.</li><li><strong>Writings:</strong> oral discussions → Mishnah; combined traditions → Talmud.</li></ul><p class="small">Ready? Tap <strong>Start Quiz</strong>. Feedback appears after each choice.</p>`,remember:'Spread • revolt • Roman rule • groups • rabbis • preserved teachings.'}
  ];
  
  const questions = [
    // EASY • 1–10

    {q:'What is a rabbi?',a:['A Greek ruler','A scroll from a cave','The official leader of a Jewish congregation','A Roman fortress'],c:2,why:'A rabbi is the official leader of a Jewish congregation.',topic:'Teacher vocabulary',level:'Easy'},
    {q:'What does the Greek word Diaspora mean?',a:['Scattered','Temple','Instruction','Revolt'],c:0,why:'The textbook says Diaspora is Greek for scattered.',topic:'Diaspora',level:'Easy'},
    {q:'Who defeated the Persians in 331 B.C.?',a:['Judas Maccabeus','Herod','Bar Kochba','Alexander the Great'],c:3,why:'Alexander defeated the Persians in 331 B.C.',topic:'Greek rule',level:'Easy'},

    {q:'Who led the revolt against the Seleucids in 167 B.C.?',a:['Judas Maccabeus','Herod','Yohanan ben Zaccai','Alexander'],c:0,why:'Judas Maccabeus led the Maccabees.',topic:'Maccabees',level:'Easy'},

    {q:'What did the Romans call Judah after conquering it?',a:['Babylon','Qumran','Yavneh','Judaea'],c:3,why:'In 63 B.C. the Romans renamed Judah Judaea.',topic:'Roman rule',level:'Easy'},
    {q:'Where were the Dead Sea Scrolls found?',a:['Rome','Caves near Qumran','Inside Masada','A school in Egypt'],c:1,why:'The scrolls were found in caves at Qumran near the Dead Sea.',topic:'Dead Sea Scrolls',level:'Easy'},
    {q:'What does the Hebrew word Talmud mean?',a:['Instruction','Scattered','Fortress','Revolt'],c:0,why:'The source states Talmud means instruction.',topic:'Mishnah and Talmud',level:'Easy'},
  
    // MEDIUM • 11–20
    {q:'What did Alexander allow Jews to do after introducing Greek culture?',a:['Build a Roman fortress','Rule all Macedonia','Stay in Judah','Move the capital to Yavneh'],c:2,why:'Alexander introduced Greek culture but allowed Jews to stay in Judah.',topic:'Greek rule',level:'Medium'},
    {q:'After Alexander died, who divided his empire?',a:['The Pharisees','The rabbis','The Romans','Four of his generals'],c:3,why:'Four generals divided Alexander’s empire into kingdoms.',topic:'Greek rule',level:'Medium'},
    {q:'Which king required Jews to worship Greek gods and goddesses?',a:['Antiochus IV','Herod','Cyrus II','Yohanan ben Zaccai'],c:0,why:'Antiochus IV imposed this demand in Judah.',topic:'Maccabees',level:'Medium'},
    {q:'What did the Maccabees do after capturing the Temple?',a:['Taught only oral law','Removed statues and rededicated it to God','Destroyed every Torah scroll','Gave it to Rome'],c:1,why:'They cleared Greek statues and restored worship of God.',topic:'Maccabees',level:'Medium'},
    {q:'Which group applied Torah to daily life and stressed written and oral law?',a:['Sadducees','Essenes','Pharisees','Zealots'],c:2,why:'Pharisees taught in synagogues and stressed both forms of law.',topic:'Jewish groups',level:'Medium'},
    {q:'Which group favored cooperation with the Romans?',a:['Zealots','Pharisees','Essenes','Sadducees'],c:3,why:'Sadducees wanted cooperation to keep peace and order.',topic:'Jewish groups',level:'Medium'},
    {q:'Which group lived at Qumran near the Dead Sea?',a:['Essenes','Maccabees','Zealots','Roman generals'],c:0,why:'Many Essenes lived and prayed at Qumran.',topic:'Jewish groups',level:'Medium'},
    {q:'In what year did the Zealots revolt?',a:['A.D. 1947','A.D. 66','331 B.C.','167 B.C.'],c:1,why:'The Zealots revolted in A.D. 66.',topic:'Jewish–Roman wars',level:'Medium'},
    {q:'What happened in Jerusalem in A.D. 70?',a:['Alexander defeated Persians','The Septuagint was written','Romans retook the city and destroyed the Second Temple','Cyrus II returned Jews'],c:2,why:'Romans retook Jerusalem four years after A.D. 66 and destroyed the Temple.',topic:'Jewish–Roman wars',level:'Medium'},
    {q:'Which school did Yohanan ben Zaccai establish to teach Torah?',a:['Masada','Qumran','Rome','Yavneh'],c:3,why:'Ben Zaccai persuaded Romans to spare Yavneh and founded a school there.',topic:'Rabbis',level:'Medium'},
  
    // HARD • 21–30
    {q:'A Jewish family lives outside Judah, speaks Greek, and keeps Jewish customs. Which idea fits?',a:['Diaspora','The Sadducees only','The Roman conquest','The Temple at Jerusalem'],c:0,why:'The Diaspora included Jews abroad who preserved customs and spread ideas.',topic:'Diaspora scenarios',level:'Hard'},
    {q:'Which comparison between the Pharisees and Sadducees matches the book?',a:['Both rejected the written Torah','Pharisees stressed written and oral law; Sadducees stressed written law and Temple ceremonies','Pharisees sought guerrilla war; Sadducees hid cave scrolls','Both lived only in Qumran'],c:1,why:'The source contrasts oral law and daily practice with Temple ceremonies.',topic:'Jewish groups',level:'Hard'},
    {q:'A group lives near the Dead Sea, follows written Torah, and waits for God to deliver Jews. Which group?',a:['Pharisees','Zealots','Essenes','Sadducees'],c:2,why:'These are textbook features of Essenes living at Qumran.',topic:'Jewish groups',level:'Hard'},
    {q:'What is the correct sequence?',a:['Roman conquest → Alexander → Maccabees','Bar Kochba → Maccabees → Alexander','Dead Sea Scrolls discovery → Roman war → Greek rule','Alexander → Seleucids → Maccabees → Roman rule'],c:3,why:'Greek expansion came before Seleucid and Maccabean events, then Rome.',topic:'Timeline',level:'Hard'},
    {q:'Which statement correctly compares the Maccabees and Zealots?',a:['Maccabees fought Seleucids; Zealots fought Romans','Both led revolts against Cyrus II','Maccabees created Talmud; Zealots translated Bible','Both lived at Yavneh after A.D. 70'],c:0,why:'The two rebel groups resisted different rulers.',topic:'Conflict comparisons',level:'Hard'},

    {q:'A teacher asks what helped Judaism continue after the Temple was destroyed. Which example is from the book?',a:['Stopping Torah study','Ben Zaccai’s Yavneh school, rabbis, and community service','Rejecting Jewish law','Only rebuilding Greek statues'],c:1,why:'Ben Zaccai founded a Torah school and taught kindness and community service.',topic:'Rabbis',level:'Hard'}
  ];
  

  let state = {mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const score = () => state.answers.reduce((n,a,i)=>n+(a===questions[i].c?1:0),0);
  const isReview = () => state.mode==='slide' && state.index>=slides.length-2;
  function phaseUI(){
    const n = state.mode==='quiz'||state.mode==='result'?2:isReview()?1:0;
    ['phaseTeach','phaseReview','phaseQuiz'].forEach((id,i)=>{const e=$(id);e.classList.toggle('active',i===n);e.classList.toggle('done',i<n);});
  }
  function render(){
    phaseUI();
    if(state.mode==='slide') renderSlide();
    else if(state.mode==='quiz') renderQuiz();
    else renderResult();
    canvas.scrollTop=0;
    $('progress').setAttribute('aria-valuenow',Math.round(parseFloat($('progressFill').style.width)||0));
  }
  function chrome(mode,counter,percent,remember,nextLabel){
    $('modeLabel').textContent=mode;
    $('counter').textContent=counter;
    $('progressFill').style.width=percent+'%';
    $('rememberText').textContent=remember;
    $('nextBtn').textContent=nextLabel;
  }
  function renderSlide(){
    const s=slides[state.index];
    canvas.innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}`;
    chrome(isReview()?'Final review':'Learning time',`Slide ${state.index+1} of ${slides.length}`,100*(state.index+1)/slides.length,s.remember,state.index===slides.length-1?'Start Quiz →':'Next →');
    $('backBtn').disabled=state.index===0;
    $('nextBtn').disabled=false;
  }
  function renderQuiz(){
    const q=questions[state.qi],chosen=state.answers[state.qi],done=chosen!==null;
    const choices=q.a.map((option,i)=>{
      const cls=done?(i===q.c?' correct':i===chosen?' wrong':''):'';
      return `<button type="button" class="option${cls}" data-choice="${i}" ${done?'disabled':''} aria-label="Option ${'ABCD'[i]}: ${escapeHtml(option)}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(option)}</span></button>`;
    }).join('');
    const feedback=done?`<div class="feedback ${chosen===q.c?'':'bad'}" role="status"><b>${chosen===q.c?'✅ Correct!':'❌ Incorrect'}</b><p><strong>Correct answer: ${'ABCD'[q.c]}.</strong> ${escapeHtml(q.a[q.c])}</p><p>${escapeHtml(q.why)}</p></div>`:'';
    canvas.innerHTML=`<div class="eyebrow">Practice • ${escapeHtml(q.topic)}</div><h2>Check Your Understanding</h2><div class="quizmeta"><span class="bubble ${q.level.toLowerCase()}">${q.level}</span><span class="bubble">Score: ${score()} / ${questions.length}</span></div><div class="question">${escapeHtml(q.q)}</div><div class="choices">${choices}</div>${feedback}`;
    canvas.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>answerQuestion(Number(btn.dataset.choice))));
    chrome('Quiz time',`Question ${state.qi+1} of ${questions.length}`,100*(state.qi+1)/questions.length,done?'Learn from the explanation, then move on.':'Choose A, B, C, or D. Feedback appears after you answer.',state.qi===questions.length-1?'See Results →':'Next Question →');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=!done;
  }
  function answerQuestion(choice){
    if(state.mode!=='quiz'||state.answers[state.qi]!==null)return;
    state.answers[state.qi]=choice;
    render();
  }
  function renderResult(){
    const total=score(),pct=Math.round(total*100/questions.length);
    const missed={}; questions.forEach((q,i)=>{if(state.answers[i]!==q.c)missed[q.topic]=(missed[q.topic]||0)+1;});
    const areas=Object.entries(missed).sort((a,b)=>b[1]-a[1]);
    const review=areas.length?areas.map(([name,count])=>`<div class="review-item">📘 ${escapeHtml(name)} <span class="small">(${count} to review)</span></div>`).join(''):'<div class="review-item ok">🌟 Great work — no missed topics!</div>';
    canvas.innerHTML=`<div class="eyebrow">Quiz complete • Your result</div><div class="final-score"><h2>Nice Work!</h2><p class="lead">You finished all 30 questions.</p><div class="score-ring" style="--score:${pct}%"><div>${total}/30</div></div><p><strong>${pct}% correct</strong></p></div><h3>Topics to Review</h3><div class="review-grid">${review}</div><p class="small" style="margin-top:18px">Use Back to revisit your last answer, or Restart to study the whole lesson again.</p>`;
    chrome('Quiz complete','Final score',100,'Your results show what to review before the test.','Review Quiz ←');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=false;
  }
  function next(){
    if(state.mode==='slide'){
      if(state.index<slides.length-1)state.index++;
      else {state.mode='quiz';state.qi=0;}
    } else if(state.mode==='quiz'){
      if(state.answers[state.qi]===null)return;
      if(state.qi<questions.length-1)state.qi++;
      else state.mode='result';
    } else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function back(){
    if(state.mode==='slide')state.index=Math.max(0,state.index-1);
    else if(state.mode==='quiz'){
      if(state.qi===0){state.mode='slide';state.index=slides.length-1;}
      else state.qi--;
    }
    else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function restart(){
    if(state.mode==='slide'&&state.index===0)return;
    if(!window.confirm('Restart the lesson and clear your quiz answers?'))return;
    state={mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
    render();
  }
  $('nextBtn').addEventListener('click',next);
  $('backBtn').addEventListener('click',back);
  $('restartBtn').addEventListener('click',restart);
  window.addEventListener('keydown',e=>{
    if(e.target.closest('button'))return;
    if(e.key==='ArrowRight'&&!$('nextBtn').disabled)next();
    if(e.key==='ArrowLeft'&&!$('backBtn').disabled)back();
  });
  render();
  </script>
</body>
</html>
