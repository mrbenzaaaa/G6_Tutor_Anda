<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>How Does a Historian Work? — Touchscreen Tutor</title>
  <style>
    :root{
      --ink:#17324d;--muted:#60758a;--navy:#153e64;--blue:#2f7ed8;--cyan:#34b9c7;
      --cream:#fffaf0;--card:#ffffff;--gold:#f6b73c;--green:#28a873;--red:#df5a64;
      --lav:#7a68d8;--line:#dbe7f0;--shadow:0 18px 50px rgba(28,68,105,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#edf7fb;color:var(--ink)}
    body{overflow-x:hidden}
    .bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(circle at 10% 15%,rgba(52,185,199,.20),transparent 24%),
      radial-gradient(circle at 90% 85%,rgba(122,104,216,.16),transparent 26%),
      linear-gradient(145deg,#effbff 0%,#fff9eb 52%,#f4f0ff 100%)}
    .orb{position:fixed;border-radius:50%;opacity:.22;z-index:-1;animation:drift 9s ease-in-out infinite}
    .orb.one{width:140px;height:140px;background:var(--gold);top:8%;right:4%}
    .orb.two{width:90px;height:90px;background:var(--cyan);bottom:7%;left:5%;animation-delay:-3s}
    @keyframes drift{50%{transform:translateY(18px) rotate(8deg)}}
    #app{min-height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,34px);background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy);white-space:nowrap}
    .brand-badge{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:white;font-size:22px;box-shadow:0 8px 18px rgba(47,126,216,.25)}
    .phase{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:900}
    .progress-area{flex:1;min-width:80px}
    .progress-text{text-align:right;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:5px}
    .track{height:9px;border-radius:99px;background:#e5eef5;overflow:hidden}
    .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--lav));transition:width .35s ease;border-radius:99px}
    main{flex:1;width:min(1120px,100%);margin:0 auto;padding:clamp(14px,3vw,32px);display:flex;align-items:center}
    .screen{width:100%;min-height:min(680px,calc(100vh - 164px));background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,4vw,50px);display:flex;flex-direction:column;animation:enter .35s ease}
    @keyframes enter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
    .eyebrow{display:inline-flex;align-items:center;align-self:flex-start;gap:8px;background:#eaf5ff;color:var(--blue);padding:8px 13px;border-radius:99px;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
    h1{font-size:clamp(35px,6vw,68px);line-height:1.02;margin:18px 0 14px;color:var(--navy);letter-spacing:-.035em}
    h2{font-size:clamp(29px,4vw,46px);line-height:1.08;margin:15px 0 20px;color:var(--navy);letter-spacing:-.025em}
    h3{font-size:clamp(19px,2.5vw,26px);color:var(--blue);margin:18px 0 8px}
    p,li{font-size:clamp(17px,2vw,22px);line-height:1.48}
    p{margin:8px 0}
    ul,ol{margin:8px 0;padding-left:1.35em}
    li{margin:7px 0}
    strong,.key{color:#0f5f99}
    em{color:#5b4bb1}
    .lead{font-size:clamp(20px,2.5vw,29px);color:var(--muted);max-width:850px}
    .hero-icon{font-size:clamp(64px,10vw,110px);line-height:1;margin-top:auto;align-self:flex-end;filter:drop-shadow(0 12px 14px rgba(21,62,100,.15));animation:bob 3.5s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-9px)}}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:12px 0}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .tile{background:#f5faff;border:2px solid #d9ebf7;border-radius:18px;padding:16px;min-height:90px}
    .tile.gold{background:#fff8e5;border-color:#f8dda1}.tile.green{background:#ebfbf4;border-color:#bcead5}.tile.lav{background:#f4f1ff;border-color:#dcd4ff}
    .tile-title{font-size:clamp(17px,2vw,21px);font-weight:900;color:var(--navy);margin-bottom:6px}
    .tile p,.tile li{font-size:clamp(15px,1.7vw,18px);line-height:1.38}
    .arrow-chain{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0}
    .step{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;font-weight:900;border-radius:15px;padding:14px 16px;font-size:clamp(15px,1.8vw,20px);box-shadow:0 8px 16px rgba(47,126,216,.2)}
    .arrow{font-size:24px;color:var(--gold);font-weight:900}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px 0}
    .compare-card{border-radius:20px;padding:20px;border:2px solid #d8e8f4;background:#f8fcff}
    .compare-card:nth-child(2){background:#fff8e8;border-color:#f4dba1}
    .compare-card h3{margin-top:0}
    .quote{font-size:clamp(20px,2.7vw,31px);font-weight:900;text-align:center;padding:20px;border-radius:20px;background:linear-gradient(135deg,#edf8ff,#f5f1ff);color:var(--navy);margin:15px 0}
    .timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
    .date{padding:18px;border-radius:18px;background:#f7fbfe;border:2px solid var(--line);text-align:center}
    .date b{display:block;font-size:clamp(23px,3vw,34px);color:var(--lav);margin-bottom:5px}
    .remember{margin-top:auto;background:linear-gradient(100deg,#fff4c9,#fff9e9);border:2px solid #f3cc70;border-left:10px solid var(--gold);border-radius:18px;padding:15px 18px;font-size:clamp(16px,2vw,21px);font-weight:900;color:#674b08}
    .controls{display:flex;gap:12px;width:min(1120px,100%);margin:0 auto;padding:0 clamp(14px,3vw,32px) clamp(14px,3vw,25px)}
    button{font:inherit;touch-action:manipulation}
    .nav{min-height:56px;border:0;border-radius:16px;padding:13px 22px;font-size:17px;font-weight:900;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
    .nav:active,.choice:active{transform:scale(.98)}
    .nav.back{background:white;color:var(--navy);border:2px solid var(--line)}
    .nav.restart{background:#fff1f1;color:#ad3d48;border:2px solid #ffd5d8;margin-left:auto}
    .nav.next{background:linear-gradient(135deg,var(--blue),var(--lav));color:white;box-shadow:0 9px 20px rgba(47,126,216,.25)}
    .nav:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
    .choice{min-height:74px;text-align:left;border:2px solid #d9e6ef;border-radius:18px;background:#f9fcfe;padding:15px 18px;font-size:clamp(16px,1.9vw,20px);font-weight:800;color:var(--ink);cursor:pointer;transition:.18s}
    .choice:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 18px rgba(47,126,216,.12)}
    .choice .letter{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#e5f2fb;color:var(--blue);margin-right:9px;font-weight:900}
    .choice.correct{background:#e9fbf3;border-color:var(--green);color:#176e50}.choice.correct .letter{background:var(--green);color:white}
    .choice.wrong{background:#fff0f1;border-color:var(--red);color:#9c3340}.choice.wrong .letter{background:var(--red);color:white}
    .choice.locked:not(.correct):not(.wrong){opacity:.58}
    .feedback{border-radius:18px;padding:16px 19px;margin-top:4px;font-size:clamp(17px,2vw,21px);font-weight:800;animation:pop .25s ease}
    .feedback.good{background:#e8faf2;border:2px solid #b8e9d3;color:#176e50}.feedback.bad{background:#fff0f1;border:2px solid #ffd0d4;color:#9c3340}
    @keyframes pop{from{transform:scale(.97);opacity:.3}to{transform:none;opacity:1}}
    .score-pill{margin-left:auto;background:#edf7ff;color:var(--blue);padding:9px 14px;border-radius:99px;font-weight:900}
    .results{text-align:center}.big-score{font-size:clamp(64px,12vw,120px);font-weight:900;color:var(--blue);line-height:1;margin:18px 0}.result-message{font-size:clamp(20px,3vw,30px);font-weight:900;color:var(--navy)}
    .review-list{text-align:left;max-width:760px;margin:18px auto;padding:20px;border-radius:20px;background:#fff8e8;border:2px solid #f4dba1}
    .tiny{font-size:14px;color:var(--muted)}
    @media(max-width:760px){
      header{gap:9px}.brand span:last-child{display:none}.phase{font-size:11px}.screen{min-height:calc(100vh - 170px);border-radius:22px;padding:21px}.grid,.grid.three,.compare,.timeline,.choices{grid-template-columns:1fr}.hero-icon{font-size:65px}.controls{gap:8px}.nav{padding:11px 14px;min-height:52px;font-size:15px}.nav.restart{margin-left:0}.tile{min-height:auto}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="bg"></div><div class="orb one"></div><div class="orb two"></div>
  <div id="app">
    <header>
      <div class="brand"><span class="brand-badge">🏺</span><span>History Tutor</span></div>
      <div><div class="phase" id="phaseLabel">Teaching</div></div>
      <div class="progress-area"><div class="progress-text" id="progressText">Slide 1</div><div class="track"><div class="fill" id="progressFill"></div></div></div>
      <div class="score-pill" id="scorePill" hidden>Score: 0/0</div>
    </header>
    <main id="main"></main>
    <div class="controls">
      <button class="nav back" id="backBtn">← Back</button>
      <button class="nav restart" id="restartBtn">↻ Restart</button>
      <button class="nav next" id="nextBtn">Next →</button>
    </div>
  </div>

  <script>
  "use strict";

  const teacherDefinitions = {
    "Evidence":"something that shows proof or an indication that something is true",
    "Primary Source":"firsthand evidence of an event in history",
    "Secondary Source":"a document or written work created after an event",
    "Point of View":"a personal attitude about people or life",
    "Bias":"an unreasoned, emotional judgment about people or events",
    "Conclusion":"a decision reached after examining evidence",
    "Scholarly":"concerned with academic learning or research",
    "Source":"document or reference work",
    "Finite":"limited; having boundaries"
  };

  const slides = [
    {phase:"Teaching",tag:"Lesson 2",title:"How Does a Historian Work?",body:`<p class="lead"><strong>Essential Question:</strong> How do we learn about the past?</p><p class="lead">Knowing how historians work helps us understand historical information.</p><div class="hero-icon">🕵️‍♀️📜</div>`,remember:"Historians use evidence to understand the past."},
    {phase:"Teaching",tag:"Learning Map",title:"What You Need to Learn",body:`<div class="grid three"><div class="tile"><div class="tile-title">⭐⭐⭐ Evidence</div><p>How historians find proof about the past.</p></div><div class="tile"><div class="tile-title">⭐⭐⭐ Sources</div><p>Primary vs. secondary sources.</p></div><div class="tile"><div class="tile-title">⭐⭐⭐ Viewpoints</div><p>Point of view and bias.</p></div><div class="tile gold"><div class="tile-title">⭐⭐⭐ Reasoning</div><p>Inferences and conclusions.</p></div><div class="tile lav"><div class="tile-title">⭐⭐ Research</div><p>Reliable, scholarly, finite, and broad research.</p></div><div class="tile green"><div class="tile-title">⭐ Debate</div><p>Historical interpretations and artifact repatriation.</p></div></div>`,remember:"Evidence, sources, viewpoints, and reasoning are the biggest exam ideas."},
    {phase:"Teaching",tag:"Big Picture",title:"The Historian’s Process",body:`<div class="arrow-chain"><span class="step">Ask questions</span><span class="arrow">→</span><span class="step">Find evidence</span><span class="arrow">→</span><span class="step">Evaluate sources</span><span class="arrow">→</span><span class="step">Compare</span><span class="arrow">→</span><span class="step">Infer</span><span class="arrow">→</span><span class="step">Conclude</span></div><p class="quote">Historians use evidence and reasoning to explain what happened in the past.</p>`,remember:"Ask → Find → Check → Compare → Infer → Conclude"},
    {phase:"Teaching",tag:"Teacher Vocabulary 1 of 3",title:"Evidence and Sources",body:`<div class="grid"><div class="tile green"><div class="tile-title">Evidence</div><p>${teacherDefinitions.Evidence}</p></div><div class="tile"><div class="tile-title">Primary Source</div><p>${teacherDefinitions["Primary Source"]}</p></div><div class="tile gold"><div class="tile-title">Secondary Source</div><p>${teacherDefinitions["Secondary Source"]}</p></div></div>`,remember:"Primary = firsthand; Secondary = created after."},
    {phase:"Teaching",tag:"Teacher Vocabulary 2 of 3",title:"Viewpoint and Reasoning",body:`<div class="grid"><div class="tile"><div class="tile-title">Point of View</div><p>${teacherDefinitions["Point of View"]}</p></div><div class="tile gold"><div class="tile-title">Bias</div><p>${teacherDefinitions.Bias}</p></div><div class="tile green"><div class="tile-title">Conclusion</div><p>${teacherDefinitions.Conclusion}</p></div></div>`,remember:"Point of View = attitude; Bias = emotional judgment; Conclusion = decision."},
    {phase:"Teaching",tag:"Teacher Vocabulary 3 of 3",title:"Research Words",body:`<div class="grid"><div class="tile lav"><div class="tile-title">Scholarly</div><p>${teacherDefinitions.Scholarly}</p></div><div class="tile"><div class="tile-title">Source</div><p>${teacherDefinitions.Source}</p></div><div class="tile gold"><div class="tile-title">Finite</div><p>${teacherDefinitions.Finite}</p></div></div>`,remember:"Scholarly = research; Source = reference; Finite = limited."},
    {phase:"Teaching",tag:"Topic 1",title:"What Is Evidence?",body:`<p>Historians ask questions about past events:</p><ul><li>Why did an event happen?</li><li>How were people affected?</li><li>How did the event change people’s lives?</li></ul><p>They search for <strong>evidence</strong> to answer these questions. Evidence may appear in material objects or written materials.</p>`,remember:"Question → Evidence → Explanation"},
    {phase:"Teaching",tag:"Topic 1",title:"What Can Be Evidence?",body:`<div class="grid three"><div class="tile">🎖️ Soldier’s uniform</div><div class="tile">🏺 Scraps of pottery</div><div class="tile">✉️ Letters and diaries</div><div class="tile gold">📋 Government records</div><div class="tile lav">🗺️ Maps and photographs</div><div class="tile green">🛠️ Tools and clothing</div></div><p>Literature, artwork, and spoken interviews can also provide evidence.</p>`,remember:"Evidence can come from objects, documents, pictures, or interviews."},
    {phase:"Teaching",tag:"Easy to Confuse",title:"Source, Evidence, Interpretation",body:`<div class="grid three"><div class="tile"><div class="tile-title">Source</div><p>Where information comes from; a document or reference work.</p></div><div class="tile gold"><div class="tile-title">Evidence</div><p>The proof or information historians find.</p></div><div class="tile lav"><div class="tile-title">Interpretation</div><p>An explanation of the meaning of something.</p></div></div>`,remember:"Source gives evidence; interpretation explains it."},
    {phase:"Teaching",tag:"Topic 2",title:"Primary Sources",body:`<p>A <strong>primary source</strong> is firsthand evidence. It was written or created by someone who saw or experienced the event.</p><p>Primary sources help historians learn what people were thinking while events took place. Historians use them to find new evidence.</p><p class="quote">Primary = PERSON WAS THERE</p>`,remember:"Primary sources connect directly to the event."},
    {phase:"Teaching",tag:"Primary Examples",title:"Examples of Primary Sources",body:`<div class="grid"><div class="tile"><div class="tile-title">Written</div><p>Letters, diaries, and government records</p></div><div class="tile gold"><div class="tile-title">Creative</div><p>Literature and artwork from the time and place</p></div><div class="tile lav"><div class="tile-title">Spoken</div><p>Interviews with people connected to the event</p></div><div class="tile green"><div class="tile-title">Objects and Images</div><p>Tools, clothing, old maps, and photographs</p></div></div>`,remember:"Firsthand people, writing, objects, and images can be primary."},
    {phase:"Teaching",tag:"Topic 2",title:"Secondary Sources",body:`<p>A <strong>secondary source</strong> is created after an event by someone who was not part of it. Its information is often based on primary sources.</p><div class="grid"><div class="tile">📖 Biographies</div><div class="tile">🔤 Encyclopedias</div><div class="tile gold">📚 History books</div><div class="tile lav">🎒 Textbooks</div></div><p>Secondary sources give background information and a broad view.</p>`,remember:"Secondary = SOMEONE STUDIED IT LATER"},
    {phase:"Teaching",tag:"Compare",title:"Primary vs. Secondary",body:`<div class="compare"><div class="compare-card"><h3>Primary Source</h3><ul><li>Firsthand evidence</li><li>Creator saw or experienced the event</li><li>Letter, diary, interview, old map</li></ul></div><div class="compare-card"><h3>Secondary Source</h3><ul><li>Created after the event</li><li>Creator was not part of the event</li><li>Biography, encyclopedia, history book, textbook</li></ul></div>`,remember:"Primary = direct; Secondary = later and broader."},
    {phase:"Teaching",tag:"Topic 3",title:"Is the Source Reliable?",body:`<p>Finding a source is not enough. Historians decide whether it is trustworthy.</p><div class="grid"><div class="tile"><div class="tile-title">Where?</div><p>Where was it created?</p></div><div class="tile gold"><div class="tile-title">When?</div><p>When was it created?</p></div><div class="tile lav"><div class="tile-title">Why?</div><p>Why was it created?</p></div><div class="tile green"><div class="tile-title">Viewpoint?</div><p>What is the author’s point of view?</p></div></div>`,remember:"Check where, when, why, and point of view."},
    {phase:"Teaching",tag:"Topic 3",title:"Point of View",body:`<p>A <strong>point of view</strong> is a personal attitude about people or life.</p><p>An author’s point of view affects what the author thinks is important and what information the author chooses to include.</p><p>Historians evaluate a primary source to find its point of view and decide whether its viewpoint is trustworthy.</p>`,remember:"Point of View = PERSONAL ATTITUDE"},
    {phase:"Teaching",tag:"Topic 3",title:"Bias",body:`<p><strong>Bias</strong> is an unreasoned, emotional judgment about people or events.</p><p>Sometimes a point of view is expressed as bias. Sources with bias cannot always be trusted.</p><div class="compare"><div class="compare-card"><h3>Point of View</h3><p>Personal attitude</p></div><div class="compare-card"><h3>Bias</h3><p>Unreasoned, emotional judgment</p></div></div>`,remember:"Bias = EMOTION without good reasoning."},
    {phase:"Teaching",tag:"Topic 4",title:"The Domesday Book",body:`<p>The <em>Domesday Book</em> is a primary source about England. It was created in <strong>A.D. 1086</strong> by administrators under <strong>William I</strong>.</p><p>It contains information about the people of England at the time it was written.</p><p>Historians examine where, when, and why it was created.</p>`,remember:"1086 → William I → Domesday Book → England"},
    {phase:"Teaching",tag:"Domesday Evidence",title:"What Did It Record?",body:`<div class="grid three"><div class="tile">Names of manors and owners</div><div class="tile">Numbers of workers</div><div class="tile">Fishponds</div><div class="tile gold">Mills</div><div class="tile lav">Animals</div><div class="tile green">Estimated property values</div></div><p>This information gives historians evidence about people, land, and property.</p>`,remember:"The Domesday Book recorded people, land, work, and property."},
    {phase:"Teaching",tag:"Connections to Today",title:"Census and Maps",body:`<p>The government collects U.S. Census information every <strong>10 years</strong>. It focuses on age, race, and living arrangements. Like the <em>Domesday Book</em>, it can be a primary source about people living at the time.</p><p>An old map created around <strong>A.D. 1500</strong> can also be a primary source. Comparing it with a modern map may provide evidence.</p>`,remember:"1086 = Domesday; around 1500 = old map; every 10 years = Census."},
    {phase:"Teaching",tag:"Picture Evidence",title:"Objects, Art, and Photos",body:`<div class="grid"><div class="tile"><div class="tile-title">Qin Dynasty</div><p>Warrior sculptures give evidence about China’s culture and its first emperor.</p></div><div class="tile gold"><div class="tile-title">Paleolithic era</div><p>A cave painting from this era is a primary source.</p></div><div class="tile lav"><div class="tile-title">World War I</div><p>A photograph of American soldiers can be used as evidence and may expand information.</p></div><div class="tile green"><div class="tile-title">Maps</div><p>Maps can be primary sources and can be compared.</p></div></div>`,remember:"Pictures and artifacts can carry evidence from their time."},
    {phase:"Teaching",tag:"Topic 5",title:"Making an Inference",body:`<p>An <strong>inference</strong> means choosing the most likely explanation for the facts at hand.</p><p class="quote">Raincoat + dripping umbrella + prior knowledge → It is probably raining</p><p>The raincoat and umbrella are evidence. Prior knowledge helps explain that evidence.</p>`,remember:"Inference = MOST LIKELY EXPLANATION"},
    {phase:"Teaching",tag:"Historical Inferences",title:"A Well-Rounded View",body:`<ol><li>Check evidence in primary sources.</li><li>Compare it with sources already known to be trustworthy.</li><li>Look at secondary sources with different points of view.</li><li>Build a clear, well-rounded explanation.</li></ol><p>Animals and grain recorded in sources could help historians infer what people ate in eleventh-century England.</p>`,remember:"Compare several sources before explaining the past."},
    {phase:"Teaching",tag:"Topic 5",title:"Drawing Conclusions",body:`<p>A <strong>conclusion</strong> is a decision reached after examining evidence.</p><p>The lesson’s example uses two clues: a friend wears concert T-shirts and has guitar lessons. Reasoning from both clues supports the conclusion that the friend is interested in music.</p><p>Historians also use facts, evidence, and reasoning to make a judgment.</p>`,remember:"Conclusion = FINAL DECISION after evidence."},
    {phase:"Teaching",tag:"Easy to Confuse",title:"Inference vs. Conclusion",body:`<div class="compare"><div class="compare-card"><h3>Inference</h3><p>The most likely explanation for the facts.</p><p>Built from evidence and prior knowledge.</p></div><div class="compare-card"><h3>Conclusion</h3><p>A final decision or judgment.</p><p>Reached after examining evidence and reasoning.</p></div></div>`,remember:"Infer an explanation; conclude with a decision."},
    {phase:"Teaching",tag:"Topic 6",title:"Scholarly Work",body:`<p>Professional historians become experts on their subjects. They gather artifacts and data, then write what they learn.</p><p>Their work may become an article in a <strong>scholarly</strong> journal or magazine, or a book about a specific subject.</p><p>Other scholars review historical books and articles for accuracy.</p>`,remember:"Scholarly = SERIOUS ACADEMIC STUDY"},
    {phase:"Teaching",tag:"Historical Study",title:"Historiography",body:`<p>Experts review sources and evaluate how a historian interpreted the facts.</p><p>The study of historical interpretations is called <strong>historiography</strong>.</p><p>Historians must keep accurate notes and make sure their inferences are reasonable.</p>`,remember:"Historiography = study of historical interpretations."},
    {phase:"Teaching",tag:"Topic 6",title:"Finite vs. Broad Research",body:`<div class="compare"><div class="compare-card"><h3>Finite Research</h3><p>Limited; having boundaries.</p><p>Example: the single day in <strong>A.D. 79</strong> when Mount Vesuvius erupted and destroyed Pompeii in the region now called Italy.</p></div><div class="compare-card"><h3>Broader Research</h3><p>Economic, political, military, medicine, or technology history over a period or place.</p></div></div>`,remember:"Finite = FIXED LIMITS; A.D. 79 → Vesuvius → Pompeii."},
    {phase:"Teaching",tag:"Topic 7",title:"Different Interpretations",body:`<p>Historians sometimes disagree because they interpret facts differently.</p><p>The lesson uses <strong>Genghis Khan</strong>. Some historians describe him as a fierce, bloodthirsty warrior whose soldiers caused tremendous destruction while conquering new lands.</p>`,remember:"One interpretation focuses on violent invasions."},
    {phase:"Teaching",tag:"Genghis Khan",title:"Another Interpretation",body:`<p>Other historians focus on how Genghis Khan ruled the Mongol Empire.</p><p>Sources describe peace, prosperity, stability, religious tolerance, higher learning, and consistent laws inside a huge portion of central and eastern Asia.</p><p>A historian must evaluate primary sources and explain why both interpretations can be argued.</p>`,remember:"Genghis Khan: Violence outside ↔ Peace inside"},
    {phase:"Teaching",tag:"Topic 8",title:"Should Artifacts Be Returned?",body:`<p>Many artifacts are displayed far from their countries of origin. The lesson asks who has the biggest claim to them.</p><p>To <strong>repatriate</strong> an artifact means “to restore an artifact or other object to its country of origin.”</p><p>The Cairo Museum holds artifacts from Egypt’s history, including the golden burial mask of Pharaoh Tutankhamen.</p>`,remember:"Repatriate = restore to the country of origin."},
    {phase:"Teaching",tag:"Primary Source Argument",title:"Malcolm Bell III: Yes",body:`<p>Bell says artifacts may have special cultural value. When removed from their original cultural setting, they lose context and the culture loses part of its history.</p><p>He says repatriation often has a legal basis when an artifact was illegally excavated or exported and is defined as stolen property.</p>`,remember:"Bell = BRING IT BACK: culture, context, and legal claims."},
    {phase:"Teaching",tag:"Primary Source Argument",title:"James Cuno: No",body:`<p>Cuno says history and ownership are not always clear because land belonged to different political groups in different periods.</p><p>Within the law, museums may acquire works through purchase, long-term loan, and cooperation with museums and nations. He says collections encourage an international view and show that culture constantly changes.</p>`,remember:"Cuno = COLLECTIONS ACROSS CULTURES."},
    {phase:"Teaching",tag:"Compare Arguments",title:"Bell vs. Cuno",body:`<div class="compare"><div class="compare-card"><h3>Malcolm Bell III</h3><ul><li>Return artifacts</li><li>Protect cultural context and history</li><li>Repatriation may have a legal basis</li></ul></div><div class="compare-card"><h3>James Cuno</h3><ul><li>Ownership may be unclear</li><li>Allow legal museum collections</li><li>Use purchases, loans, and cooperation</li></ul></div><p>The lesson asks students to describe a compromise that might solve a conflict over artifact ownership.</p>`,remember:"Bell: return and context. Cuno: legal collections and cooperation."},
    {phase:"Final Review",tag:"Final Review 1 of 5",title:"Must Know",body:`<ol><li>Historians ask questions and search for evidence.</li><li>Primary sources are firsthand; secondary sources are created later.</li><li>Historians evaluate where, when, and why sources were created.</li><li>Point of view affects what an author includes; bias is emotional and unreasoned.</li><li>Historians compare sources, make inferences, and draw conclusions.</li><li>Different interpretations can be supported by evidence.</li><li>Scholarly work is reviewed for accuracy.</li></ol>`,remember:"Evidence + evaluation + reasoning = historical understanding."},
    {phase:"Final Review",tag:"Final Review 2 of 5",title:"People, Places, and Dates",body:`<div class="timeline"><div class="date"><b>A.D. 79</b>Mount Vesuvius destroyed Pompeii</div><div class="date"><b>A.D. 1086</b>William I and the Domesday Book in England</div><div class="date"><b>Around A.D. 1500</b>Old map used as a primary source</div></div><div class="grid"><div class="tile">Qin Dynasty → warrior sculptures → China</div><div class="tile gold">Paleolithic era → cave painting</div><div class="tile lav">Genghis Khan → different interpretations</div><div class="tile green">Bell and Cuno → artifact debate</div></div>`,remember:"79 = Pompeii; 1086 = Domesday; 1500 = old map."},
    {phase:"Final Review",tag:"Final Review 3 of 5",title:"Fast Comparisons",body:`<div class="grid"><div class="tile"><div class="tile-title">Primary vs. Secondary</div><p>Firsthand vs. created later</p></div><div class="tile gold"><div class="tile-title">Point of View vs. Bias</div><p>Attitude vs. emotional judgment</p></div><div class="tile lav"><div class="tile-title">Inference vs. Conclusion</div><p>Likely explanation vs. final decision</p></div><div class="tile green"><div class="tile-title">Finite vs. Broad</div><p>Limited boundaries vs. larger subject</p></div></div>`,remember:"Know who, when, attitude, reasoning, and boundaries."},
    {phase:"Final Review",tag:"Final Review 4 of 5",title:"Cause → Effect",body:`<ul><li>Historians ask questions → they search for evidence.</li><li>An author has a point of view → the author chooses what to include.</li><li>A source contains bias → it cannot always be trusted.</li><li>Historians compare several sources → they get a well-rounded view.</li><li>Historians examine evidence and reason → they draw conclusions.</li><li>Historians interpret evidence differently → they may reach different conclusions.</li><li>Artifacts are removed → Bell says they lose context and culture loses history.</li></ul>`,remember:"Always connect the evidence to the result."},
    {phase:"Final Review",tag:"Final Review 5 of 5",title:"Memory Wall",body:`<div class="grid"><div class="tile">Primary = <strong>PERSON WAS THERE</strong></div><div class="tile gold">Secondary = <strong>STUDIED LATER</strong></div><div class="tile lav">Point of View = <strong>ATTITUDE</strong></div><div class="tile green">Bias = <strong>EMOTIONAL JUDGMENT</strong></div><div class="tile">Inference = <strong>LIKELY EXPLANATION</strong></div><div class="tile gold">Conclusion = <strong>FINAL DECISION</strong></div><div class="tile lav">Scholarly = <strong>SERIOUS STUDY</strong></div><div class="tile green">Finite = <strong>FIXED LIMITS</strong></div></div>`,remember:"Bell = bring it back; Cuno = collections across cultures."},
    {phase:"Quiz",tag:"Practice Exam",title:"Ready for 30 Questions?",body:`<p class="lead">Questions begin easy, then become medium and hard. They cover vocabulary, comparisons, facts, dates, captions, and scenarios.</p><div class="grid"><div class="tile green"><div class="tile-title">✓ Instant feedback</div><p>See whether each answer is correct.</p></div><div class="tile gold"><div class="tile-title">🎯 Review report</div><p>Your weak topics appear at the end.</p></div></div><p class="tiny">Answers are not shown until you tap a choice.</p><div class="hero-icon">🏁</div>`,remember:"Read every choice before you tap."}
  ];

  const questions = [
    {level:"Easy",topic:"Evidence",q:"Which word means ‘something that shows proof or an indication that something is true’?",choices:["Bias","Evidence","Conclusion","Finite"],a:1,e:"Evidence is proof or an indication that something is true."},
    {level:"Easy",topic:"Vocabulary",q:"What is a source?",choices:["A final decision","An emotional judgment","A document or reference work","A limited research topic"],a:2,e:"The teacher’s definition of source is ‘document or reference work.’"},
    {level:"Easy",topic:"Sources",q:"What is a primary source?",choices:["Firsthand evidence of an event in history","A book created long after every event","An emotional opinion","A broad research subject"],a:0,e:"A primary source is firsthand evidence connected to an event."},
    {level:"Easy",topic:"Sources",q:"Which is a secondary source?",choices:["A diary written during an event","An interview with someone who saw an event","A government record from the event","A history textbook created after the event"],a:3,e:"A textbook is created later by someone who was not part of the event."},
    {level:"Easy",topic:"Point of View and Bias",q:"What is point of view?",choices:["A final decision","A personal attitude about people or life","A document created after an event","A limited research subject"],a:1,e:"Point of view is a person’s attitude about people or life."},
    {level:"Easy",topic:"Point of View and Bias",q:"Which definition matches bias?",choices:["Firsthand evidence","A trustworthy document","An unreasoned, emotional judgment","A decision based on evidence"],a:2,e:"Bias is an unreasoned, emotional judgment about people or events."},
    {level:"Easy",topic:"Inference and Conclusion",q:"What is a conclusion?",choices:["A personal attitude","A reference work","A broad view","A decision reached after examining evidence"],a:3,e:"A conclusion is reached after evidence has been examined."},
    {level:"Easy",topic:"Scholarly Research",q:"What does scholarly mean?",choices:["Concerned with academic learning or research","Created during an event","Unreasoned and emotional","Without boundaries"],a:0,e:"Scholarly work is concerned with academic learning or research."},
    {level:"Easy",topic:"Finite Research",q:"What does finite mean?",choices:["Firsthand","Emotional","Limited; having boundaries","Created later"],a:2,e:"Finite means limited and having boundaries."},
    {level:"Easy",topic:"Sources",q:"Which item is most clearly a primary source in the lesson?",choices:["An encyclopedia","A diary written by someone who experienced the event","A modern history textbook","A later biography"],a:1,e:"A diary by a person who experienced the event is firsthand evidence."},
    {level:"Medium",topic:"Sources",q:"Why are primary sources especially useful to historians?",choices:["They always have no point of view","They are all textbooks","They are always written later","They can show what people were thinking during events"],a:3,e:"Primary sources can reveal what people thought while events took place."},
    {level:"Medium",topic:"Sources",q:"What do secondary sources often provide?",choices:["Background information and a broad view","Only firsthand interviews","Proof that cannot be questioned","Objects from an archaeological dig"],a:0,e:"Secondary sources often give background information and a broad view."},
    {level:"Medium",topic:"Reliable Sources",q:"Which set of questions best helps a historian evaluate a source?",choices:["How long and how colorful?","How expensive and how famous?","Where, when, why, and what point of view?","How easy and how short?"],a:2,e:"Historians examine where, when, why, and the source’s point of view."},
    {level:"Medium",topic:"Point of View and Bias",q:"How can an author’s point of view affect a source?",choices:["It changes the date of the event","It affects what information the author includes","It turns every source into a textbook","It removes all evidence"],a:1,e:"An author’s attitude helps determine what seems important enough to include."},
    {level:"Medium",topic:"Point of View and Bias",q:"Why can a source with bias be difficult to trust?",choices:["It is always a primary source","It has clear boundaries","It contains only dates","It may contain an unreasoned, emotional judgment"],a:3,e:"Biased information may be shaped by emotion instead of sound reasoning."},
    {level:"Medium",topic:"People, Places, and Dates",q:"When was the Domesday Book created?",choices:["A.D. 1086","A.D. 79","Around A.D. 1500","Every 10 years"],a:0,e:"The Domesday Book was created in A.D. 1086."},
    {level:"Medium",topic:"People, Places, and Dates",q:"Who ordered information about England’s land and people to be collected?",choices:["Genghis Khan","William I","Malcolm Bell III","James Cuno"],a:1,e:"The lesson connects William I with the collection recorded in the Domesday Book."},
    {level:"Medium",topic:"People, Places, and Dates",q:"How often does the U.S. government collect Census information?",choices:["Every year","Every 79 years","Every 10 years","Only once"],a:2,e:"The lesson states that Census data is collected every 10 years."},
    {level:"Medium",topic:"People, Places, and Dates",q:"Which date is connected with the old map in the lesson?",choices:["A.D. 79","A.D. 1086","Every 10 years","Around A.D. 1500"],a:3,e:"The old map was created around A.D. 1500."},
    {level:"Medium",topic:"Inference and Conclusion",q:"A person enters with a raincoat and a dripping umbrella. What is the inference?",choices:["It is probably raining outside","The person wrote a textbook","The umbrella is a secondary source","The person has a biased point of view"],a:0,e:"The evidence and prior knowledge support the inference that it is raining."},
    {level:"Medium",topic:"Inference and Conclusion",q:"Why does a conclusion come at the end of research?",choices:["It must be written before evidence is found","It is only a personal attitude","It is reached after evidence is examined and reasoning is used","It must be created during the event"],a:2,e:"A conclusion is the decision made after studying the evidence."},
    {level:"Medium",topic:"Scholarly Research",q:"What is historiography?",choices:["A list of property values","The study of historical interpretations","A firsthand interview","A census collected every ten years"],a:1,e:"Historiography is the study of historical interpretations."},
    {level:"Hard",topic:"Finite Research",q:"Which is the best example of a finite research topic from the lesson?",choices:["All political history","The entire history of technology","Every economic period","The day Mount Vesuvius destroyed Pompeii in A.D. 79"],a:3,e:"That single day is limited in both place and time."},
    {level:"Hard",topic:"Historical Interpretations",q:"Why can historians argue two different interpretations of Genghis Khan?",choices:["No sources exist about him","Every source gives exactly the same view","Evidence can support both violent invasions and peaceful rule inside the empire","Historians never evaluate primary sources"],a:2,e:"Different evidence emphasizes destruction during invasions or stability inside the empire."},
    {level:"Hard",topic:"Picture Evidence",q:"What do the Qin Dynasty warrior sculptures provide?",choices:["Evidence about China’s culture and its first emperor","A secondary textbook about Pompeii","A conclusion about the U.S. Census","A biography of William I"],a:0,e:"The sculptures give evidence about Qin Dynasty culture and its first emperor."},
    {level:"Hard",topic:"Picture Evidence",q:"Why is the Paleolithic cave painting a primary source?",choices:["It was written as a modern encyclopedia","It was created during the period being studied","It gives only a broad modern view","It was reviewed by later scholars"],a:1,e:"The cave painting comes from the Paleolithic era being studied."},
    {level:"Hard",topic:"Artifact Repatriation",q:"Why does Malcolm Bell III support repatriation?",choices:["Museums should never cooperate","Ownership is always perfectly clear","Culture never changes","Removed artifacts lose context, and legal claims may support their return"],a:3,e:"Bell emphasizes cultural context, lost history, and possible legal ownership."},
    {level:"Hard",topic:"Artifact Repatriation",q:"Which action fits James Cuno’s argument?",choices:["Ignore all laws about artifacts","Return every object without discussion","Use legal purchase, long-term loans, and international cooperation","Study only artifacts from one culture"],a:2,e:"Cuno supports legal acquisition, loans, and cooperation among museums and nations."},
    {level:"Hard",topic:"Artifact Repatriation",q:"According to Bell, what may happen when an artifact is removed from its original cultural setting?",choices:["It loses context, and the culture loses part of its history","It automatically becomes a secondary source","Its date changes to A.D. 1086","It proves ownership is always unclear"],a:0,e:"Bell says removal can separate an artifact from its context and history."},
    {level:"Hard",topic:"Historical Reasoning",q:"A historian compares a diary, a government record, and a later history book before explaining an event. Which process is shown?",choices:["Using only a biased source","Comparing primary and secondary sources for a well-rounded view","Choosing a conclusion before finding evidence","Studying a topic without boundaries"],a:1,e:"Comparing different kinds of sources helps create a well-rounded explanation."}
  ];

  const main=document.getElementById("main"),phaseLabel=document.getElementById("phaseLabel"),progressText=document.getElementById("progressText"),progressFill=document.getElementById("progressFill"),scorePill=document.getElementById("scorePill"),backBtn=document.getElementById("backBtn"),nextBtn=document.getElementById("nextBtn"),restartBtn=document.getElementById("restartBtn");
  let mode="slides",slideIndex=0,qIndex=0,score=0,answers=Array(questions.length).fill(null),mistakes={};

  function renderSlide(){
    mode="slides";const s=slides[slideIndex];
    phaseLabel.textContent=s.phase;progressText.textContent=`Slide ${slideIndex+1} of ${slides.length}`;progressFill.style.width=`${((slideIndex+1)/slides.length)*100}%`;scorePill.hidden=true;
    main.innerHTML=`<section class="screen"><span class="eyebrow">${s.tag}</span><h2>${s.title}</h2>${s.body}<div class="remember">⭐ Remember<br>${s.remember}</div></section>`;
    backBtn.disabled=slideIndex===0;nextBtn.disabled=false;nextBtn.textContent=slideIndex===slides.length-1?"Start Quiz →":"Next →";backBtn.hidden=false;
  }

  function startQuiz(){mode="quiz";qIndex=0;score=0;answers=Array(questions.length).fill(null);mistakes={};renderQuestion()}

  function renderQuestion(){
    mode="quiz";const q=questions[qIndex],selected=answers[qIndex];phaseLabel.textContent=`Quiz • ${q.level}`;progressText.textContent=`Question ${qIndex+1} of ${questions.length}`;progressFill.style.width=`${((qIndex+1)/questions.length)*100}%`;scorePill.hidden=false;scorePill.textContent=`Score: ${score}/${answers.filter(v=>v!==null).length}`;
    const choices=q.choices.map((c,i)=>`<button class="choice ${selected!==null?(i===q.a?"correct":i===selected?"wrong":"locked"):""}" data-i="${i}" ${selected!==null?"disabled":""}><span class="letter">${"ABCD"[i]}</span>${c}</button>`).join("");
    const feedback=selected===null?"":`<div class="feedback ${selected===q.a?"good":"bad"}">${selected===q.a?"✅ Correct!":"❌ Incorrect."}<br>Correct answer: <strong>${"ABCD"[q.a]}. ${q.choices[q.a]}</strong><br>${q.e}</div>`;
    main.innerHTML=`<section class="screen"><span class="eyebrow">${q.level} • ${q.topic}</span><h2>${qIndex+1}. ${q.q}</h2><div class="choices">${choices}</div>${feedback}<div class="remember">⭐ Remember<br>${questionRemember(q.topic)}</div></section>`;
    main.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answerQuestion(Number(b.dataset.i))));
    backBtn.disabled=qIndex===0;nextBtn.disabled=selected===null;nextBtn.textContent=qIndex===questions.length-1?"See Results →":"Next Question →";backBtn.hidden=false;
  }

  function questionRemember(topic){const m={"Evidence":"Evidence = proof or an indication.","Vocabulary":"Source = document or reference work.","Sources":"Primary = firsthand; Secondary = created later.","Point of View and Bias":"Point of View = attitude; Bias = emotional judgment.","Inference and Conclusion":"Inference explains; conclusion decides.","Scholarly Research":"Scholarly = academic learning or research.","Finite Research":"Finite = limited; having boundaries.","Reliable Sources":"Check where, when, why, and point of view.","People, Places, and Dates":"79 = Pompeii; 1086 = Domesday; 1500 = old map.","Historical Interpretations":"The same evidence may support different interpretations.","Picture Evidence":"Objects, art, maps, and photos can provide evidence.","Artifact Repatriation":"Bell = return; Cuno = legal collections and cooperation.","Historical Reasoning":"Compare sources for a well-rounded view."};return m[topic]||"Use evidence before making a conclusion."}

  function answerQuestion(i){if(answers[qIndex]!==null)return;answers[qIndex]=i;const q=questions[qIndex];if(i===q.a)score++;else mistakes[q.topic]=(mistakes[q.topic]||0)+1;renderQuestion()}

  function showResults(){
    mode="results";phaseLabel.textContent="Quiz Complete";progressText.textContent=`30 of 30 answered`;progressFill.style.width="100%";scorePill.hidden=false;scorePill.textContent=`Score: ${score}/30`;
    const pct=Math.round(score/questions.length*100),topics=Object.entries(mistakes).sort((a,b)=>b[1]-a[1]);
    const review=topics.length?topics.map(([t,n])=>`<li><strong>${t}</strong> — ${n} mistake${n>1?"s":""}</li>`).join(""):"<li>No weak topics found. Excellent work!</li>";
    const message=pct>=90?"Excellent historical thinking!":pct>=75?"Strong work — review the topics below.":pct>=60?"Good effort — one more review will help.":"Review the key ideas, then try again.";
    main.innerHTML=`<section class="screen results"><span class="eyebrow">Final Result</span><div class="big-score">${pct}%</div><div class="result-message">${score} correct • ${30-score} incorrect</div><p>${message}</p><div class="review-list"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Last-Minute Remember<br>Primary = firsthand • Bias = emotional judgment • Inference = likely explanation • Conclusion = final decision</div></section>`;
    backBtn.hidden=false;backBtn.disabled=false;nextBtn.disabled=false;nextBtn.textContent="Try Quiz Again →";
  }

  function next(){if(mode==="slides"){if(slideIndex<slides.length-1){slideIndex++;renderSlide()}else startQuiz()}else if(mode==="quiz"){if(answers[qIndex]===null)return;if(qIndex<questions.length-1){qIndex++;renderQuestion()}else showResults()}else startQuiz()}
  function back(){if(mode==="slides"&&slideIndex>0){slideIndex--;renderSlide()}else if(mode==="quiz"){if(qIndex>0){qIndex--;renderQuestion()}else{mode="slides";slideIndex=slides.length-1;renderSlide()}}else if(mode==="results"){mode="quiz";qIndex=questions.length-1;renderQuestion()}}
  function restart(){if(!confirm("Restart the lesson and clear the quiz score?"))return;mode="slides";slideIndex=0;qIndex=0;score=0;answers=Array(questions.length).fill(null);mistakes={};renderSlide()}
  nextBtn.addEventListener("click",next);backBtn.addEventListener("click",back);restartBtn.addEventListener("click",restart);
  document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&!nextBtn.disabled)next();if(e.key==="ArrowLeft"&&!backBtn.disabled)back();if(mode==="quiz"&&answers[qIndex]===null&&/^[1-4a-d]$/i.test(e.key)){const i=/^[1-4]$/.test(e.key)?Number(e.key)-1:"abcd".indexOf(e.key.toLowerCase());answerQuestion(i)}});
  renderSlide();
  </script>
</body>
</html>
