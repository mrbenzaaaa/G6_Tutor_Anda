<body>
  <div class="shell">
    <aside class="rail" aria-label="Lesson overview">
      <div class="brand">Grade 6 • Touchscreen Tutor</div>
      <h1>The Development<br>of Judaism</h1>
      <p>Worship, Hebrew Bible, Jewish family, and dietary laws.</p>
      <div class="time-pill">⏱ Teaching: about 15–20 minutes</div>
      <div class="section-steps">
        <div class="phase active" id="phaseTeach"><span class="phase-number">1</span><span>Teaching slides</span></div>
        <div class="phase" id="phaseReview"><span class="phase-number">2</span><span>Final review</span></div>
        <div class="phase" id="phaseQuiz"><span class="phase-number">3</span><span>30-question quiz</span></div>
      </div>
      <div class="tiny-note">Based only on the supplied textbook pages.</div>
    </aside>

    <main class="main" aria-label="Interactive lesson">
      <header class="topbar"><div class="status"><span class="dot"></span><span id="modeLabel">Learning time</span></div><div class="count" id="counter">Slide 1 of 29</div></header>
      <div class="track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="progressFill"></div></div>
      <section class="canvas" id="canvas" tabindex="-1" aria-live="polite"></section>
      <div class="remember" id="remember"><b>⭐ Remember</b><span id="rememberText"></span></div>
      <footer class="bottom">
        <button class="nav secondary" id="backBtn" type="button">← Back</button>
        <button class="nav minor" id="restartBtn" type="button">↺ Restart</button>
        <span class="spacer"></span>
        <button class="nav primary" id="nextBtn" type="button">Next →</button>
      </footer>
    </main>
  </div>
  <script>
  'use strict';
  const slides = [
    {title:'What You Must Know',eyebrow:'Start here • Lesson map',body:`<p class="lead">Essential question: <strong>How does religion shape society?</strong> This lesson explains how Jewish beliefs shaped daily life.</p><div class="tile-grid three"><div class="tile"><b>🕯️ Worship</b><span>Exile, synagogues, Sabbath, return to Judah</span></div><div class="tile cyan"><b>📜 Scripture</b><span>Scribes, scrolls, and the Hebrew Bible's stories</span></div><div class="tile peach"><b>🏠 Daily life</b><span>Family, food rules, and Passover traditions</span></div></div><div class="callout">Teacher's words: <strong>synagogue</strong>, <strong>sabbath</strong>, <strong>scroll</strong>, <strong>kosher</strong>.</div><p class="small">Learn the short slides, then answer the 30-question practice quiz.</p>`,remember:'Worship → Scriptures → family and food customs.'},
    {title:'The Jews During the Exile',eyebrow:'Topic 1 • Return to Judah',body:`<p>Families of Judeans forced to live in <strong>Babylon</strong> spent <strong>70 years</strong> away from <strong>Judah</strong>.</p><div class="arrowline"><div class="step">Judeans exiled to Babylon</div><span class="arrow">→</span><div class="step">Lived away for 70 years</div><span class="arrow">→</span><div class="step">Became known as Jews</div></div><p>During their exile, they became known as the <strong>Jews</strong>. Their religion is called <strong>Judaism</strong>.</p><div class="callout">Religion served as the basis for the ancient Israelites' daily activities. Many practices continue today.</div>`,remember:'Babylonian exile: 70 years away; Judeans became known as Jews.'},
    {title:'What Is a Synagogue?',eyebrow:'Topic 1 • Teacher vocabulary',body:`<div class="callout"><strong>Synagogue:</strong> a Jewish house of worship.</div><p>While in Babylon, the Jews no longer had a <strong>temple</strong> in which to worship God. Small groups began meeting at <strong>synagogues</strong>.</p><div class="arrowline"><div class="step">No temple in Babylon</div><span class="arrow">→</span><div class="step">Small groups met together</div><span class="arrow">→</span><div class="step">Worship at synagogues</div></div><p>The source says these were Jewish houses of worship.</p>`,remember:'Synagogue = Jewish house of worship; small groups met in Babylon.'},
    {title:'What Is the Sabbath?',eyebrow:'Topic 1 • Teacher vocabulary',body:`<div class="callout"><strong>Sabbath:</strong> a weekly day of worship and rest.</div><p>Jews worshipped on the <strong>Sabbath</strong>. According to tradition, it lasts from <strong>sundown Friday</strong> to <strong>nightfall Saturday</strong>.</p><div class="arrowline"><div class="step">Friday at sundown</div><span class="arrow">→</span><div class="step">Worship and rest</div><span class="arrow">→</span><div class="step">Saturday at nightfall</div></div><p>During this weekly day, Jews <strong>prayed</strong> and talked about their religion and history. Jews still observe the Sabbath today.</p>`,remember:'Sabbath = rest and worship; Friday sundown → Saturday nightfall.'},
    {title:'Returning to Judah in 538 B.C.',eyebrow:'Topic 1 • A turning point',body:`<p>Some Jews accepted <strong>Babylon</strong> as their permanent home. Others hoped to return to <strong>Judah</strong>.</p><div class="arrowline"><div class="step">Persians swept across Southwest Asia</div><span class="arrow">→</span><div class="step">Defeated Chaldeans; took Babylon</div><span class="arrow">→</span><div class="step">Cyrus II allowed Jews to return</div></div><p>In <strong>538 B.C.</strong>, the Persian king <strong>Cyrus II</strong> let Jews return to Judah.</p><div class="callout">Remember the pair: <strong>Cyrus II → 538 B.C. → return to Judah</strong>.</div>`,remember:'538 B.C.: Persian king Cyrus II let Jews return.'},
    {title:'The Second Temple and Persian Rule',eyebrow:'Topic 1 • Rebuilding Judah',body:`<div class="tile-grid"><div class="tile green"><b>Jerusalem rebuilt</b><span>Many Jews returned, rebuilt <strong>Jerusalem</strong>, and constructed the <strong>Second Temple</strong> to replace the one destroyed by the Chaldeans.</span></div><div class="tile peach"><b>Some stayed</b><span>Other Jews remained in <strong>Babylon</strong>.</span></div><div class="tile cyan"><b>Persian rulers</b><span>Persians chose officials to rule and collect <strong>taxes</strong>.</span></div><div class="tile"><b>Jewish community</b><span>Jews had no king or government of their own, so they relied on religious leaders.</span></div></div>`,remember:'Return → Jerusalem rebuilt → Second Temple; Persian officials ruled.'},
    {title:'Priests and Scribes',eyebrow:'Topic 1 • Community leaders',body:`<p>Jews depended on <strong>temple priests</strong> and <strong>scribes</strong> to guide society.</p><table><thead><tr><th>Role</th><th>What the textbook says</th></tr></thead><tbody><tr><td><strong>Priests</strong></td><td>Many were religious scholars with deep understanding of the Jewish faith.</td></tr><tr><td><strong>Scribes</strong></td><td>Lectured in synagogues and taught in schools.</td></tr></tbody></table><div class="arrowline"><div class="step">Temple priests + scribes</div><span class="arrow">→</span><div class="step">Guided the people</div><span class="arrow">→</span><div class="step">Taught religious life</div></div>`,remember:'Priests = scholars; scribes = teachers and synagogue lecturers.'},
    {title:'What Is a Scroll?',eyebrow:'Topic 1 • Teacher vocabulary',body:`<div class="callout"><strong>Scroll:</strong> a long document made from pieces of parchment sewn together.</div><p>A scribe named <strong>Ezra</strong> led the Jews in writing the <strong>five books of the Torah</strong> on pieces of <strong>parchment</strong>.</p><div class="arrowline"><div class="step">Write on parchment pieces</div><span class="arrow">→</span><div class="step">Sew pieces together</div><span class="arrow">→</span><div class="step">Make long scrolls</div></div><p>The <strong>Torah</strong> and later writings became part of the <strong>Hebrew Bible</strong>.</p>`,remember:'Ezra → five Torah books → parchment sewn into long scrolls.'},
    {title:'How Is the Hebrew Bible Organized?',eyebrow:'Topic 2 • Three parts',body:`<p>The Hebrew Bible includes <strong>three parts</strong> and a collection of <strong>24 books</strong> written and collected over many centuries.</p><div class="tile-grid three"><div class="tile"><b>1. Torah</b><span>First part</span></div><div class="tile cyan"><b>2. Prophets</b><span>Second part</span></div><div class="tile peach"><b>3. Writings</b><span>Third part</span></div></div><ul class="factlist"><li>It presents laws and rules of the Israelites.</li><li>It reflects their <strong>culture</strong>: history, art, literature, poetry, and proverbs.</li><li>The source calls it a guide to the people's rules and beliefs.</li></ul>`,remember:'Hebrew Bible: Torah + Prophets + Writings = 24 books.'},
    {title:'Genesis: Creation and Rest',eyebrow:'Topic 2 • The first Torah book',body:`<p><strong>Genesis</strong>, the first book of the <strong>Torah</strong>, presents the Israelite view of human beginnings.</p><div class="arrowline"><div class="step">God created Earth in six days</div><span class="arrow">→</span><div class="step">God rested on the seventh day</div></div><p>These are statements from the Genesis account presented in the textbook.</p><div class="callout">Study connection: <strong>six days</strong> of creation followed by <strong>rest on the seventh day</strong>.</div>`,remember:'Genesis: created in six days; rested on day seven.'},
    {title:'Genesis: Noah and the Flood',eyebrow:'Topic 2 • A textbook story',body:`<p>Genesis says God punished the world for wicked behavior. God warned <strong>Noah</strong> that a flood was coming and commanded him to build an <strong>ark</strong>, or large boat.</p><div class="arrowline"><div class="step">Noah built an ark</div><span class="arrow">→</span><div class="step">Noah, family, and two of every animal boarded</div><span class="arrow">→</span><div class="step">Flood rose; only those on the ark escaped drowning</div></div><p>After the rain stopped, God placed a <strong>rainbow</strong> in the sky as a sign the world would never again be destroyed by a flood, according to Genesis.</p>`,remember:'Noah → ark → flood → rainbow promise.'},
    {title:'Genesis: The Tower of Babel',eyebrow:'Topic 2 • Why different languages?',body:`<p>Genesis also explains why people speak many different languages.</p><div class="arrowline"><div class="step">People of Babel tried a tower to heaven</div><span class="arrow">→</span><div class="step">God made them speak different languages</div><span class="arrow">→</span><div class="step">They could not work together</div><span class="arrow">→</span><div class="step">God scattered them across Earth</div></div><p>The source says God <strong>disapproved</strong> of the tower.</p>`,remember:'Babel: different languages → cannot communicate → people scattered.'},
    {title:'Isaiah: Hope for Peace',eyebrow:'Topic 2 • Jewish hopes for the future',body:`<p>Later parts of the Hebrew Bible describe Jewish hopes for the future.</p><div class="tile-grid"><div class="tile green"><b>Book of Isaiah</b><span>Describes what Jews believed was God's plan for a <strong>peaceful world</strong>.</span></div><div class="tile cyan"><b>Isaiah 2:4</b><span>Pictures weapons being made into <strong>farm tools</strong>, with nations no longer training for war.</span></div></div><div class="arrowline"><div class="step">Swords → plowshares</div><span class="arrow">→</span><div class="step">Spears → pruning hooks</div><span class="arrow">→</span><div class="step">Nations no longer train for war</div></div>`,remember:'Isaiah’s hope: weapons become farm tools; no more war.'},
    {title:'Daniel and the Lions’ Den',eyebrow:'Topic 2 • Good over evil',body:`<p>The book of <strong>Daniel</strong> says the Jews believed <strong>evil and suffering</strong> would eventually be replaced by <strong>goodness</strong>.</p><div class="arrowline"><div class="step">Daniel advised a Babylonian king</div><span class="arrow">→</span><div class="step">He refused to worship Babylonian gods</div><span class="arrow">→</span><div class="step">Chaldeans threw him into lions' den</div><span class="arrow">→</span><div class="step">God protected Daniel</div></div><p>The textbook says this story reminds Jews that God will rescue them. <strong>Christians and Muslims</strong> share hope for a better world where good triumphs over evil.</p>`,remember:'Daniel refused to worship Babylonian gods; God protected him from lions.'},
    {title:'Judaism Shaped Daily Life',eyebrow:'Topic 3 • Religion and behavior',body:`<p>The <strong>Torah</strong> gave teachings for daily living and family life. It included rules about food and clothing.</p><div class="tile-grid"><div class="tile green"><b>Help others</b><span>Help the <strong>poor</strong>.</span></div><div class="tile cyan"><b>Be honest</b><span>Deal honestly with <strong>neighbors</strong>.</span></div><div class="tile peach"><b>Be fair</b><span>Apply <strong>laws fairly</strong>.</span></div><div class="tile pink"><b>Be responsible</b><span>Show individual worth, responsibility, self-discipline, and loyalty to God.</span></div></div>`,remember:'Torah shaped food, clothes, fairness, honesty, and responsibility.'},
    {title:'The Jewish Family',eyebrow:'Topic 3 • Roles in the home',body:`<p>Ancient Israelites stressed the importance of <strong>family life</strong>. The Torah identified roles for the father and mother.</p><div class="tile-grid"><div class="tile"><b>Father</b><span>Led the family. If a father died, his <strong>sons</strong> took his place.</span></div><div class="tile cyan"><b>Mother</b><span>Educated daughters at home, teaching family roles and Jewish ways of life.</span></div></div><div class="callout">Education, especially for young <strong>men</strong>, was an important part of Jewish family life in the textbook.</div>`,remember:'The Torah gave family roles; sons took the father’s place when he died.'},
    {title:'How Boys Learned',eyebrow:'Topic 3 • Education',body:`<div class="arrowline"><div class="step">Fathers taught worship and a trade</div><span class="arrow">→</span><div class="step">Religious teachers taught boys to read Torah</div><span class="arrow">→</span><div class="step">They learned from alphabet to Jewish history</div></div><p>Because reading the <strong>Torah</strong> was central to Jewish life, religious teachers became important <strong>community leaders</strong>.</p><div class="callout"><strong>Community</strong> (academic vocabulary): a group of people with common interests living in an area.</div>`,remember:'Fathers taught worship and trade; teachers taught Torah reading and history.'},
    {title:'How Daughters Learned',eyebrow:'Topic 3 • Education at home',body:`<p>Daughters were educated at home by their <strong>mothers</strong>.</p><div class="tile-grid"><div class="tile pink"><b>Family roles</b><span>They learned to be <strong>wives, mothers, and housekeepers</strong>.</span></div><div class="tile green"><b>Jewish teachings</b><span>They learned about food, the <strong>Sabbath</strong>, and holidays.</span></div></div><p>The textbook then gives the story of two women from ancient Israel: <strong>Ruth</strong> and her mother-in-law <strong>Naomi</strong>.</p>`,remember:'Daughters learned family roles, food teachings, Sabbath, and holidays.'},
    {title:'Ruth and Naomi',eyebrow:'Topic 3 • Family devotion',body:`<p>According to the Hebrew Bible, <strong>Naomi's husband and two sons died</strong>. One son had been married to <strong>Ruth</strong>.</p><div class="arrowline"><div class="step">Naomi planned to leave Moab</div><span class="arrow">→</span><div class="step">Ruth chose to go with Naomi</div><span class="arrow">→</span><div class="step">They went to Bethlehem</div></div><p>Ruth was <strong>not a Jew</strong> herself, and leaving her homeland of <strong>Moab</strong> was difficult. Naomi had urged Ruth to stay with her own people, but Ruth chose to help.</p>`,remember:'Ruth left Moab to stay with Naomi in Bethlehem.'},
    {title:'Ruth’s Example',eyebrow:'Topic 3 • A source quotation',body:`<p>Ruth's answer in <strong>Ruth 1:16–17</strong> promised to go where Naomi went and stay where Naomi stayed.</p><div class="tile-grid"><div class="tile green"><b>Courage</b><span>Ruth left her homeland to help Naomi.</span></div><div class="tile cyan"><b>Devotion</b><span>Ruth was loyal to her family.</span></div></div><p>The textbook says Ruth's <strong>courage and devotion</strong> provided an example for Jewish girls to follow.</p>`,remember:'Ruth = courage + devotion to family.'},
    {title:'Dietary Laws: What Jews Could Eat',eyebrow:'Topic 4 • Food rules',body:`<p>Jewish law told Jews what foods they could eat. Ancient Jews could eat meat from only <strong>certain animals</strong>.</p><div class="tile-grid"><div class="tile green"><b>Allowed examples in the book</b><span><strong>Beef</strong> and <strong>lamb</strong></span></div><div class="tile peach"><b>Reason for following laws</b><span>Jews believed following food rules showed <strong>obedience to God</strong>.</span></div></div><p>The rules about food were called <strong>kashrut</strong>, which the source says means <strong>“that which is proper.”</strong></p>`,remember:'Allowed meat examples: beef and lamb. Food rules = kashrut.'},
    {title:'What Does Kosher Mean?',eyebrow:'Topic 4 • Teacher vocabulary',body:`<div class="callout"><strong>Kosher:</strong> prepared according to Jewish dietary law.</div><p>Many grocery items have a <strong>symbol for kosher</strong> on the label.</p><div class="arrowline"><div class="step">Animal killed in a certain way</div><span class="arrow">→</span><div class="step">Meat inspected</div><span class="arrow">→</span><div class="step">Salted</div><span class="arrow">→</span><div class="step">Soaked in water</div></div><p>The textbook describes this preparation for animals used as <strong>kosher meat</strong>.</p>`,remember:'Kosher = prepared by Jewish food law; meat killed, checked, salted, soaked.'},
    {title:'What Is Not Kosher?',eyebrow:'Topic 4 • Compare the food rules',body:`<p>The textbook says foods that are not kosher are considered <strong>unclean</strong>.</p><table><thead><tr><th>Allowed example</th><th>Not allowed by dietary law</th></tr></thead><tbody><tr><td>Beef or lamb, when prepared by the rules</td><td><strong>Meat and dairy products together</strong></td></tr><tr><td>Foods prepared according to the law</td><td><strong>Shellfish</strong>, such as crab or shrimp</td></tr></tbody></table><div class="callout">Do not confuse <strong>an allowed animal</strong> with <strong>correct kosher preparation</strong>. The source gives both ideas.</div>`,remember:'No meat with dairy; no shellfish such as crab or shrimp.'},
    {title:'What Is the Passover Seder?',eyebrow:'Topic 4 • Special meal',body:`<p><strong>Passover</strong> celebrates the <strong>Exodus</strong> of Jewish people from <strong>Egypt</strong>. During this festival, a special meal is eaten called the <strong>seder</strong>.</p><div class="tile-grid"><div class="tile"><b>Foods named in the source</b><span><strong>Lamb, hardboiled eggs, vinegar, salt water, herbs</strong>, and flat bread called <strong>matzoh</strong>.</span></div><div class="tile cyan"><b>Why it matters</b><span>Eating special foods and thinking about history is <strong>sacred</strong> to Jewish people.</span></div></div><p>Each food can carry <strong>religious significance</strong>.</p>`,remember:'Seder = Passover meal; Passover remembers Exodus from Egypt.'},
    {title:'Seder Symbols and Family Questions',eyebrow:'Topic 4 • Food meanings',body:`<div class="tile-grid"><div class="tile peach"><b>Hardboiled egg</b><span>The caption calls it a symbol of <strong>God's kindness</strong>.</span></div><div class="tile green"><b>Bitter herbs</b><span>Represent the <strong>bitter experience of Jews in exile</strong>.</span></div><div class="tile cyan"><b>Fruit juice or honey</b><span>Herbs dipped in these show the <strong>sweetness and bitterness of life</strong>.</span></div><div class="tile pink"><b>Youngest child</b><span>Asks questions about <strong>the food and Passover</strong>; adults and older children recite answers together.</span></div></div>`,remember:'Egg = kindness; bitter herbs = exile; child asks, older family members answer.'},
    {title:'Teacher Vocabulary Summary',eyebrow:'Keywords • Book definitions and memory tips',body:`<p class="lead">All four teacher words in one table.</p><table><thead><tr><th>Word</th><th>Textbook meaning</th><th>Memory tip</th></tr></thead><tbody><tr><td><strong>synagogue</strong></td><td>A Jewish house of worship</td><td>Worship house</td></tr><tr><td><strong>Sabbath</strong></td><td>A weekly day of worship and rest</td><td>Rest weekly</td></tr><tr><td><strong>scroll</strong></td><td>A long document made from pieces of parchment sewn together</td><td>Pieces joined</td></tr><tr><td><strong>kosher</strong></td><td>Prepared according to Jewish dietary law</td><td>Food rules</td></tr></tbody></table><p class="small">Other academic words in the source: <strong>tradition</strong> = a custom, or way of life, passed down from generation to generation; <strong>community</strong> = a group of people with common interests living in an area.</p>`,remember:'Synagogue = house • Sabbath = day • scroll = document • kosher = food.'},
    {title:'Easy-to-Confuse Points',eyebrow:'Exam focus • Compare',body:`<table><thead><tr><th>Pair</th><th>What is different?</th></tr></thead><tbody><tr><td><strong>Synagogue / Temple</strong></td><td>Small groups worshipped in synagogues during exile / Jews later built the <strong>Second Temple</strong> in Jerusalem.</td></tr><tr><td><strong>Sabbath / seder</strong></td><td>Weekly rest and worship / special Passover meal</td></tr><tr><td><strong>Scroll / Torah</strong></td><td>Long parchment document / the first part of the Hebrew Bible, with five books copied by Ezra</td></tr><tr><td><strong>Kashrut / kosher</strong></td><td>The food laws (“that which is proper”) / food prepared according to those laws</td></tr><tr><td><strong>Persians / Chaldeans</strong></td><td>Persians defeated Chaldeans and allowed return / Chaldeans had destroyed the first temple</td></tr><tr><td><strong>Ruth / Naomi</strong></td><td>Ruth chose to help / Naomi was her mother-in-law</td></tr></tbody></table>`,remember:'Sabbath = weekly rest; seder = Passover meal; scroll = document.'},
    {title:'Exam Focus: Facts and Sequences',eyebrow:'Final 4-minute review • Names and examples',body:`<div class="tile-grid"><div class="tile"><b>Time and numbers</b><span><strong>70 years</strong> in Babylon, <strong>538 B.C.</strong> return, <strong>3 parts</strong> and <strong>24 books</strong> in Hebrew Bible.</span></div><div class="tile cyan"><b>People</b><span><strong>Cyrus II, Ezra, Noah, Isaiah, Daniel, Ruth, Naomi</strong>.</span></div></div><ul class="factlist"><li><strong>Sequences:</strong> exile → worship in synagogues → Cyrus II allowed return → Second Temple.</li><li><strong>Texts:</strong> Genesis (creation, Noah, Babel), Isaiah (peace), Daniel (lions' den), Ruth (family devotion).</li><li><strong>Family:</strong> fathers and mothers, sons and daughters, learning the Torah.</li><li><strong>Food:</strong> beef/lamb, kosher preparation, no meat with dairy, no shellfish.</li><li><strong>Passover:</strong> seder foods, meanings, and youngest child's questions.</li></ul>`,remember:'70 years • 538 B.C. • three Hebrew Bible parts • 24 books.'},
    {title:'Remember These Before the Test',eyebrow:'Final 4-minute review • Last slide before quiz',body:`<p class="lead">Read each line once, then say it back in your own words.</p><ul class="checklist"><li><strong>Exile:</strong> Jews lived 70 years away from Judah in Babylon.</li><li><strong>Synagogue:</strong> Jewish house of worship.</li><li><strong>Sabbath:</strong> Friday sundown to Saturday nightfall; worship and rest.</li><li><strong>Cyrus II:</strong> allowed Jews to return in 538 B.C.; Second Temple rebuilt.</li><li><strong>Scroll:</strong> parchment pieces sewn together; Ezra wrote Torah books.</li><li><strong>Hebrew Bible:</strong> Torah + Prophets + Writings = 24 books.</li><li><strong>Stories:</strong> Noah, Babel, Isaiah's peace, Daniel, Ruth and Naomi.</li><li><strong>Kosher:</strong> Jewish dietary laws; know allowed and forbidden examples.</li><li><strong>Passover seder:</strong> foods, meanings, and family questions.</li></ul><p class="small">Ready? Tap <strong>Start Quiz</strong> for 30 questions. The answer stays hidden until you tap.</p>`,remember:'Know the four words, key stories, 70 years, 538 B.C., and daily-life rules.'}
  ];

  let state = {mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const score = () => state.answers.reduce((n,a,i)=>n+(a===questions[i].c?1:0),0);
  const isReview = () => state.mode==='slide' && state.index>=slides.length-2;
  function phaseUI(){
    const n = state.mode==='quiz'||state.mode==='result'?2:isReview()?1:0;
    ['phaseTeach','phaseReview','phaseQuiz'].forEach((id,i)=>{const e=$(id);e.classList.toggle('active',i===n);e.classList.toggle('done',i<n);});
  }
  function render(){
    phaseUI();
    if(state.mode==='slide') renderSlide();
    else if(state.mode==='quiz') renderQuiz();
    else renderResult();
    canvas.scrollTop=0;
    $('progress').setAttribute('aria-valuenow',Math.round(parseFloat($('progressFill').style.width)||0));
  }
  function chrome(mode,counter,percent,remember,nextLabel){
    $('modeLabel').textContent=mode;
    $('counter').textContent=counter;
    $('progressFill').style.width=percent+'%';
    $('rememberText').textContent=remember;
    $('nextBtn').textContent=nextLabel;
  }
  function renderSlide(){
    const s=slides[state.index];
    canvas.innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h2>${s.title}</h2>${s.body}`;
    chrome(isReview()?'Final review':'Learning time',`Slide ${state.index+1} of ${slides.length}`,100*(state.index+1)/slides.length,s.remember,state.index===slides.length-1?'Start Quiz →':'Next →');
    $('backBtn').disabled=state.index===0;
    $('nextBtn').disabled=false;
  }
  function renderQuiz(){
    const q=questions[state.qi],chosen=state.answers[state.qi],done=chosen!==null;
    const choices=q.a.map((option,i)=>{
      const cls=done?(i===q.c?' correct':i===chosen?' wrong':''):'';
      return `<button type="button" class="option${cls}" data-choice="${i}" ${done?'disabled':''} aria-label="Option ${'ABCD'[i]}: ${escapeHtml(option)}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(option)}</span></button>`;
    }).join('');
    const feedback=done?`<div class="feedback ${chosen===q.c?'':'bad'}" role="status"><b>${chosen===q.c?'✅ Correct!':'❌ Incorrect'}</b><p><strong>Correct answer: ${'ABCD'[q.c]}.</strong> ${escapeHtml(q.a[q.c])}</p><p>${escapeHtml(q.why)}</p></div>`:'';
    canvas.innerHTML=`<div class="eyebrow">Practice • ${escapeHtml(q.topic)}</div><h2>Check Your Understanding</h2><div class="quizmeta"><span class="bubble ${q.level.toLowerCase()}">${q.level}</span><span class="bubble">Score: ${score()} / ${questions.length}</span></div><div class="question">${escapeHtml(q.q)}</div><div class="choices">${choices}</div>${feedback}`;
    canvas.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>answerQuestion(Number(btn.dataset.choice))));
    chrome('Quiz time',`Question ${state.qi+1} of ${questions.length}`,100*(state.qi+1)/questions.length,done?'Learn from the explanation, then move on.':'Choose A, B, C, or D. Feedback appears after you answer.',state.qi===questions.length-1?'See Results →':'Next Question →');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=!done;
  }
  function answerQuestion(choice){
    if(state.mode!=='quiz'||state.answers[state.qi]!==null)return;
    state.answers[state.qi]=choice;
    render();
  }
  function renderResult(){
    const total=score(),pct=Math.round(total*100/questions.length);
    const missed={}; questions.forEach((q,i)=>{if(state.answers[i]!==q.c)missed[q.topic]=(missed[q.topic]||0)+1;});
    const areas=Object.entries(missed).sort((a,b)=>b[1]-a[1]);
    const review=areas.length?areas.map(([name,count])=>`<div class="review-item">📘 ${escapeHtml(name)} <span class="small">(${count} to review)</span></div>`).join(''):'<div class="review-item ok">🌟 Great work — no missed topics!</div>';
    canvas.innerHTML=`<div class="eyebrow">Quiz complete • Your result</div><div class="final-score"><h2>Nice Work!</h2><p class="lead">You finished all 30 questions.</p><div class="score-ring" style="--score:${pct}%"><div>${total}/30</div></div><p><strong>${pct}% correct</strong></p></div><h3>Topics to Review</h3><div class="review-grid">${review}</div><p class="small" style="margin-top:18px">Use Back to revisit your last answer, or Restart to study the whole lesson again.</p>`;
    chrome('Quiz complete','Final score',100,'Your results show what to review before the test.','Review Quiz ←');
    $('backBtn').disabled=false;
    $('nextBtn').disabled=false;
  }
  function next(){
    if(state.mode==='slide'){
      if(state.index<slides.length-1)state.index++;
      else {state.mode='quiz';state.qi=0;}
    } else if(state.mode==='quiz'){
      if(state.answers[state.qi]===null)return;
      if(state.qi<questions.length-1)state.qi++;
      else state.mode='result';
    } else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function back(){
    if(state.mode==='slide')state.index=Math.max(0,state.index-1);
    else if(state.mode==='quiz'){
      if(state.qi===0){state.mode='slide';state.index=slides.length-1;}
      else state.qi--;
    }
    else {state.mode='quiz';state.qi=questions.length-1;}
    render();
  }
  function restart(){
    if(state.mode==='slide'&&state.index===0)return;
    if(!window.confirm('Restart the lesson and clear your quiz answers?'))return;
    state={mode:'slide',index:0,qi:0,answers:Array(questions.length).fill(null)};
    render();
  }
  $('nextBtn').addEventListener('click',next);
  $('backBtn').addEventListener('click',back);
  $('restartBtn').addEventListener('click',restart);
  window.addEventListener('keydown',e=>{
    if(e.target.closest('button'))return;
    if(e.key==='ArrowRight'&&!$('nextBtn').disabled)next();
    if(e.key==='ArrowLeft'&&!$('backBtn').disabled)back();
  });
  render();
  </script>
</body>
</html>
