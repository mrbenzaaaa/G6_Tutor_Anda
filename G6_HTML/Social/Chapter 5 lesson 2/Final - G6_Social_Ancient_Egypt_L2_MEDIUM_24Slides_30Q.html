<script>
const slides=[{"title": "Lesson 2 — Life in Ancient Egypt", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">ANCIENT EGYPT AND KUSH • LESSON 2</div>\n  <div class=\"big\">What makes a culture unique?</div>\n  <p>Ancient Egyptian culture included strong government, religion, beliefs about the afterlife, pyramids, medical skills, social classes, and family life.</p>\n  <div class=\"flow\"><span>Government</span><b>→</b><span>Religion</span><b>→</b><span>Afterlife</span><b>→</b><span>Pyramids</span><b>→</b><span>Daily Life</span></div>\n</div>\n", "remember": "Follow the big story instead of memorizing isolated facts."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Government</b><br>Old Kingdom, theocracy, pharaoh, bureaucrats, taxes, granaries.</div>\n<div class=\"card\"><b>Religion & Afterlife</b><br>Many gods, Osiris, Book of the Dead, embalming, mummies.</div>\n<div class=\"card\"><b>Pyramids & Achievements</b><br>Why pyramids were built, construction, medicine, astronomy, math.</div>\n<div class=\"card\"><b>Daily Life</b><br>Social groups, homes, jobs, women, families, children.</div>\n</div>\n", "remember": "These four areas cover the main exam content."}, {"title": "Old Kingdom + Theocracy + Pharaoh", "section": "Government", "body": "\n<p>Around <b>2600 B.C.</b>, Egypt entered the <b>Old Kingdom</b>, which lasted until about <b>2200 B.C.</b>.</p>\n<p>Egypt formed a unified government under an all-powerful ruler.</p>\n<table>\n<tr><th>Word</th><th>Meaning from the textbook</th></tr>\n<tr><td><b>theocracy</b></td><td>government by religious leaders</td></tr>\n<tr><td><b>pharaoh</b></td><td>ruler of ancient Egypt</td></tr>\n</table>\n<p>The pharaoh was both a <b>political leader</b> and a <b>religious leader</b> and held total power.</p>\n", "remember": "Theocracy = government + religion; pharaoh = Egypt’s ruler."}, {"title": "Bureaucrats, Taxes, and Granaries", "section": "Government", "body": "\n<div class=\"term\"><b>bureaucrat</b><span>a government official</span></div>\n<p>Bureaucrats carried out the pharaoh’s orders and supervised dams, irrigation canals, and granaries.</p>\n<div class=\"flow\"><span>Good harvest</span><b>→</b><span>Grain stored in granaries</span><b>→</b><span>Food available during poor harvests</span></div>\n<p>Officials collected grain taxes from farmers. The pharaoh also distributed land to officials, priests, and wealthy Egyptians he favored.</p>\n", "remember": "Bureaucrats helped the pharaoh manage Egypt."}, {"title": "Pharaoh as a Religious Leader", "section": "Government & Religion", "body": "\n<p>Egyptians believed the pharaoh was the <b>son of Re</b>, the sun god, and a god on earth who protected Egypt.</p>\n<p>He performed ceremonies to help the kingdom thrive, including riding a bull around Memphis and cutting the first ripened grain at harvest.</p>\n", "remember": "The pharaoh ruled the country and also performed religious duties."}, {"title": "Religion in Egypt", "section": "Religion", "body": "\n<p>Egyptians worshiped <b>many gods and goddesses</b>. They believed these deities controlled natural forces and human activities.</p>\n<table>\n<tr><th>God / Goddess</th><th>Role in the lesson</th></tr>\n<tr><td><b>Re</b></td><td>Sun god</td></tr>\n<tr><td><b>Hapi</b></td><td>River god</td></tr>\n<tr><td><b>Osiris</b></td><td>Important god connected with the world of the dead</td></tr>\n<tr><td><b>Isis</b></td><td>Wife of Osiris; faithful wife and mother</td></tr>\n<tr><td><b>Thoth</b></td><td>God of learning</td></tr>\n</table>\n", "remember": "Sun + Nile were crucial to farming, so religion was closely tied to agriculture."}, {"title": "Afterlife + Book of the Dead", "section": "Afterlife", "body": "\n<p>Egyptians had a <b>positive view of the afterlife</b> and believed life after death could be better than present life.</p>\n<p>The <b>Book of the Dead</b> contained prayers and magic spells to prepare for the afterlife.</p>\n<p>Egyptians believed Osiris greeted the dead at the gate to the next world.</p>\n<div class=\"flow\"><span>Good life</span><b>+</b><span>Knowledge of spells</span><b>→</b><span>Hope for eternal life</span></div>\n", "remember": "Book of the Dead = preparation for the afterlife."}, {"title": "Embalming and Mummies", "section": "Afterlife", "body": "\n<div class=\"term\"><b>embalming</b><span>the process of treating a body to keep it from decaying</span></div>\n<div class=\"steps\">\n<div><b>1</b><span>Remove organs and place them in special jars.</span></div>\n<div><b>2</b><span>Cover body with <b>natron</b> to dry it.</span></div>\n<div><b>3</b><span>Fill with burial spices and wrap in linen.</span></div>\n<div><b>4</b><span>Place mummy in a coffin and decorated tomb.</span></div>\n</div>\n", "remember": "Embalming = process; mummy = preserved wrapped body."}, {"title": "Embalming → Medical Skills", "section": "Science", "body": "\n<p>Egyptians learned about the human body from embalming.</p>\n<ul>\n<li>Doctors sewed cuts and set broken bones.</li>\n<li>They used splints, bandages, and compresses.</li>\n<li>They wrote medical information on papyrus scrolls.</li>\n<li>The lesson calls these records the world’s first medical books.</li>\n</ul>\n", "remember": "Studying bodies during embalming helped improve medical knowledge."}, {"title": "Pyramids: Purpose", "section": "Pyramids", "body": "\n<div class=\"term\"><b>pyramid</b><span>great stone tomb built for an Egyptian pharaoh</span></div>\n<p>Pyramids protected the bodies of dead pharaohs from <b>floods, wild animals, and robbers</b>.</p>\n<p>Egyptians also placed the pharaoh’s clothing, weapons, furniture, jewelry, and other belongings inside because they believed these were needed for the afterlife.</p>\n", "remember": "Pyramids protected the pharaoh’s body and belongings for the afterlife."}, {"title": "How Pyramids Were Built", "section": "Pyramids", "body": "\n<p>Thousands of workers spent years building pyramids.</p>\n<div class=\"flow\"><span>Cut stone with copper tools</span><b>→</b><span>Wooden sleds</span><b>→</b><span>Logs to Nile</span><b>→</b><span>Boats</span><b>→</b><span>Ramps</span></div>\n<p>Farmers did much of the work during summer floods when they could not farm. Surveyors, engineers, carpenters, and stonecutters also helped.</p>\n<p><b>Imhotep</b> was the first great engineer who built pyramids and also served as an official for the pharaoh.</p>\n", "remember": "Pyramid building required planning, many workers, and several transport steps."}, {"title": "Astronomy + Mathematics", "section": "Pyramids", "body": "\n<p>To face pyramid entrances north, Egyptians studied the skies and developed knowledge of <b>astronomy</b>.</p>\n<p>They created a <b>365-day calendar</b> with <b>12 months</b> divided into <b>three seasons</b>.</p>\n<p>Pyramid builders also used mathematics to calculate stone needs and measure angles.</p>\n<ul>\n<li>Written numbers based on <b>10</b></li>\n<li><b>Fractions</b></li>\n<li>Add, subtract, and divide</li>\n</ul>\n", "remember": "Pyramids pushed Egyptians to use astronomy and mathematics."}, {"title": "The Great Pyramid", "section": "Pyramids", "body": "\n<ul>\n<li>Built for <b>King Khufu</b></li>\n<li>At <b>Giza</b>, on the Nile’s west bank</li>\n<li>Nearly <b>500 feet (153 m)</b> tall</li>\n<li>More than <b>2 million stone blocks</b></li>\n<li>Average block weight: <b>2.5 tons</b></li>\n<li>For more than <b>4,000 years</b>, it stood as the tallest structure in the world</li>\n</ul>\n", "remember": "Great Pyramid = Khufu + Giza + over 2 million blocks."}, {"title": "Social Groups in Ancient Egypt", "section": "Daily Life", "body": "\n<div class=\"pyramidgrid\">\n<div><b>Top</b><span>Pharaoh and family</span></div>\n<div><b>Upper class</b><span>Army commanders, nobles, priests</span></div>\n<div><b>Middle class</b><span>Traders, artisans, shopkeepers, scribes</span></div>\n<div><b>Largest lower groups</b><span>Farmers, unskilled workers, enslaved people</span></div>\n</div>\n<p>The lesson says ambitious people in lower classes could improve their social position.</p>\n", "remember": "Know the social ladder from pharaoh down to farmers, workers, and enslaved people."}, {"title": "How People Lived", "section": "Daily Life", "body": "\n<table>\n<tr><th>Group</th><th>Life in the lesson</th></tr>\n<tr><td><b>Upper class</b></td><td>Elegant homes, gardens, servants, white linen, jewelry</td></tr>\n<tr><td><b>Middle class</b></td><td>Skilled jobs and businesses; smaller homes; simpler clothing</td></tr>\n<tr><td><b>Farmers</b></td><td>Worked land owned by wealthy nobles; paid rent with crops; simple mud-brick homes</td></tr>\n<tr><td><b>Unskilled workers</b></td><td>Manual labor; crowded neighborhoods; small mud-brick homes</td></tr>\n</table>\n", "remember": "Home, clothing, and work changed with social status."}, {"title": "Women and Families", "section": "Daily Life", "body": "\n<p>The <b>family</b> was the most important group in ancient Egyptian society.</p>\n<p>Women had a legal status similar to men and could:</p>\n<ul>\n<li>Own property</li>\n<li>Buy and sell goods</li>\n<li>Obtain divorces</li>\n</ul>\n<p>Wealthy women could serve as priests. Farmers’ wives often worked in the fields with their husbands.</p>\n", "remember": "Egyptian women had important legal rights."}, {"title": "Children and Family Types", "section": "Daily Life", "body": "\n<p>Few Egyptian children attended school. They played with board games, dolls, spinning tops, and stuffed leather balls.</p>\n<p>Mothers taught daughters household skills; boys learned farming or trades from fathers.</p>\n<table>\n<tr><th>Family type</th><th>Meaning in the lesson</th></tr>\n<tr><td><b>Nuclear family</b></td><td>Two parents and their children</td></tr>\n<tr><td><b>Extended family</b></td><td>Older adults, married children, and their families living together</td></tr>\n</table>\n", "remember": "Children learned family roles and trades mainly from parents."}, {"title": "Teacher Vocabulary — Quick Table", "section": "Vocabulary", "body": "\n<table class=\"small\">\n<tr><th>Word</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>theocracy</b></td><td>government by religious leaders</td><td>religion + government</td></tr>\n<tr><td><b>pharaoh</b></td><td>ruler of ancient Egypt</td><td>Egypt’s ruler</td></tr>\n<tr><td><b>bureaucrat</b></td><td>a government official</td><td>official helper</td></tr>\n<tr><td><b>embalming</b></td><td>the process of treating a body to keep it from decaying</td><td>preserve body</td></tr>\n<tr><td><b>pyramid</b></td><td>great stone tomb built for an Egyptian pharaoh</td><td>pharaoh’s tomb</td></tr>\n</table>\n", "remember": "These five definitions should be memorized exactly."}, {"title": "Easy-to-Confuse Points", "section": "Review", "body": "\n<table>\n<tr><th>Do not mix up</th><th>Difference</th></tr>\n<tr><td><b>Theocracy vs. Pharaoh</b></td><td>Theocracy = government system; Pharaoh = ruler.</td></tr>\n<tr><td><b>Pharaoh vs. Bureaucrat</b></td><td>Pharaoh gave orders; bureaucrats carried them out.</td></tr>\n<tr><td><b>Embalming vs. Mummy</b></td><td>Embalming = process; mummy = preserved body.</td></tr>\n<tr><td><b>Pyramid vs. Coffin</b></td><td>Pyramid = great stone tomb; coffin held the mummy.</td></tr>\n</table>\n", "remember": "First identify whether the term is a system, person, process, body, or building."}, {"title": "Memory Tricks + Exam Focus", "section": "Review", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Government</b><br>Theocracy → Pharaoh → Bureaucrats</div>\n<div class=\"card\"><b>Afterlife</b><br>Book of the Dead → Osiris → Embalming → Mummy</div>\n<div class=\"card\"><b>Pyramid</b><br>Protect body + belongings → astronomy + math + engineering</div>\n<div class=\"card\"><b>Society</b><br>Pharaoh → Upper → Middle → Farmers / Workers / Enslaved</div>\n</div>\n<p><b>Exam Focus:</b> definitions, ruler roles, gods, embalming sequence, pyramid purpose and building, Great Pyramid facts, social classes, women, and children.</p>\n", "remember": "Use four chains: government, afterlife, pyramids, society."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>GOVERNMENT</b><br>Pharaoh ruled politically + religiously; bureaucrats helped.</div>\n<div><b>RELIGION</b><br>Many gods; Re, Hapi, Osiris, Isis, Thoth.</div>\n<div><b>AFTERLIFE</b><br>Book of the Dead + embalming + mummies.</div>\n<div><b>PYRAMIDS</b><br>Protected pharaoh’s body + belongings.</div>\n<div><b>ACHIEVEMENTS</b><br>Medicine + astronomy + calendar + math.</div>\n<div><b>SOCIETY</b><br>Social classes + women’s rights + family life.</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ theocracy ☐ pharaoh ☐ bureaucrat ☐ Re/Hapi/Osiris ☐ embalming ☐ pyramid ☐ Imhotep ☐ Khufu/Great Pyramid ☐ social classes ☐ women’s rights ☐ children/families</p>\n", "remember": "If you can explain these six boxes, you know the whole lesson."}, {"title": "Lesson Review — Questions 1–4", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\">\n<li><b>Explain the role a pharaoh played in a theocracy.</b><br>The pharaoh was both the political and religious leader. He held total power, gave orders, appointed officials, and performed religious ceremonies.</li>\n<li><b>What was the social status of a bureaucrat in ancient Egypt?</b><br>A bureaucrat was a government official who carried out the pharaoh’s orders.</li>\n<li><b>What kind of religion did ancient Egyptians practice? How was religion tied to agriculture?</b><br>They worshiped many gods and goddesses. The sun helped crops grow and the Nile made soil fertile, so Re and Hapi were important.</li>\n<li><b>What was the most important purpose of the pyramids?</b><br><b>Sample source-based answer:</b> To protect the pharaoh’s body and belongings for the afterlife.</li>\n</ol>\n", "remember": "Review 1–4 = ruler, government official, religion + farming, pyramid purpose."}, {"title": "Lesson Review — Questions 5–7", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"5\">\n<li><b>How was life for Egyptian children similar to or different from children today?</b><br>The source explains ancient Egyptian children, but <b>information about children today is not provided in the study material</b>, so a complete source-only comparison cannot be made.</li>\n<li><b>Why did Egyptians spend years and many resources building enormous tombs?</b><br>They believed the pharaoh needed a protected body and personal belongings for the afterlife.</li>\n<li><b>If you could be anyone except the pharaoh, who would you choose?</b><br><b>Sample source-based answer:</b> An artisan in the middle class, because artisans had skilled jobs. A disadvantage is that middle-class people lived more simply than the upper class.</li>\n</ol>\n", "remember": "For opinion questions, support your answer with facts from the lesson."}]; const quiz=[["Easy", "What is a theocracy?", ["A great stone tomb", "Government by religious leaders", "A medical treatment", "A social class"], 1, "Theocracy means government by religious leaders.", "Vocabulary: Theocracy"], ["Easy", "What is a pharaoh?", ["A government official", "A ruler of ancient Egypt", "A stoneworker", "A priest only"], 1, "A pharaoh was the ruler of ancient Egypt.", "Vocabulary: Pharaoh"], ["Easy", "What is a bureaucrat?", ["A government official", "A mummy", "A pyramid worker only", "A god"], 0, "A bureaucrat is a government official.", "Vocabulary: Bureaucrat"], ["Easy", "What is embalming?", ["Treating a body to keep it from decaying", "Building a pyramid", "Collecting taxes", "Writing on papyrus"], 0, "Embalming preserved a body from decay.", "Vocabulary: Embalming"], ["Easy", "What is a pyramid?", ["A granary", "A palace", "A great stone tomb built for an Egyptian pharaoh", "A canal"], 2, "A pyramid is a great let mode='lesson',slide=0,q=0,score=0,answered=false,misses={};
function setBar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function renderLesson(){
 mode='lesson';const s=slides[slide];
 document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;setBar((slide+1)/slides.length*100);
 document.getElementById('stage').innerHTML=`<div class="section">${s.section}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember: ${s.remember}</div>`;
 document.getElementById('nav').innerHTML=`<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button><button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button><button class="restart" onclick="restartAll()">↻ Restart</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function nextSlide(){if(slide<slides.length-1){slide++;renderLesson();}else startQuiz();}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){if(confirm('Restart from Slide 1?')){slide=0;q=0;score=0;answered=false;misses={};renderLesson();}}
function startQuiz(){mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();}
function renderQuiz(){
 answered=false;const x=quiz[q],L=['A','B','C','D'];
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;setBar((q+1)/quiz.length*100);
 document.getElementById('stage').innerHTML=`<div class="quizmeta"><span class="difficulty">${x[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div><div class="question">${x[1]}</div><div class="choices">${x[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${L[i]}.</b> ${c}</button>`).join('')}</div><div id="feedback"></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function answer(i){
 if(answered)return;answered=true;const x=quiz[q],c=x[3],L=['A','B','C','D'];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('c'+c).classList.add('correct');
 if(i===c){score++;document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Correct!<span class="explain">${x[4]}</span></div>`;}
 else{document.getElementById('c'+i).classList.add('wrong');misses[x[5]]=(misses[x[5]]||0)+1;document.getElementById('feedback').innerHTML=`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${L[c]}. ${x[2][c]}</b><span class="explain">${x[4]}</span></div>`;}
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 document.getElementById('nav').innerHTML=`<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function nextQuestion(){if(!answered)return;if(q<quiz.length-1){q++;renderQuiz();}else showResult();}
function restartQuiz(){if(confirm('Restart quiz?')){q=0;score=0;answered=false;misses={};renderQuiz();}}
function backToReview(){slide=slides.length-2;renderLesson();}
function showResult(){
 const pct=Math.round(score/quiz.length*100),topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
 const review=topics.length?topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]}</li>`).join(''):'<li><b>Excellent!</b> No missed topics.</li>';
 document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`;setBar(100);
 document.getElementById('stage').innerHTML=`<div class="result"><div class="section">Quiz Result</div><h1>🎉 Quiz Complete</h1><div class="scorebig">${score} / ${quiz.length}</div><h2>${pct}%</h2><div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Remember: Review missed topics, then try again.</div></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="next" onclick="restartQuiz()">Try Quiz Again</button><button class="restart" onclick="restartAll()">↻ Restart All</button>`;
}
renderLesson();
</script></body></html>
