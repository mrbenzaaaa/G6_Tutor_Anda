<script>
const slides=[{"title": "Lesson 2 — Mesopotamian Empires", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">MESOPOTAMIA • LESSON 2</div>\n  <div class=\"big\">Why does conflict develop?</div>\n  <p>Mesopotamia’s empires greatly influenced other civilizations. The lesson follows the rise and fall of the <b>Akkadian, Babylonian, Assyrian, and Chaldean</b> empires.</p>\n  <div class=\"flow\"><span>Sumer weakens</span><b>→</b><span>New kingdoms rise</span><b>→</b><span>Empires expand</span></div>\n</div>\n", "remember": "Watch how conquest, strong armies, laws, trade, and leadership helped empires rise—and how conflict and weak leadership helped them fall."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>The First Empires</b><br>Sargon, Akkad, Hammurabi, Babylon, and Hammurabi’s Code.</div>\n<div class=\"card\"><b>The Assyrian Empire</b><br>Army, iron weapons, tribute, provinces, roads, government, and daily life.</div>\n<div class=\"card\"><b>The Chaldean Empire</b><br>Nabopolassar, Nebuchadnezzar, Babylon, trade, caravans, and astronomy.</div>\n<div class=\"card\"><b>Rise & Fall</b><br>Conflict, conquest, strong leadership, rebellion, weak kings, poor harvests, and slow trade.</div>\n</div>\n", "remember": "Study the empires in order and connect each ruler to what he did."}, {"title": "The First Empires", "section": "First Empires", "body": "\n<p>By <b>2400 B.C.</b>, Sumer’s city-states were weakened by conflict. As Sumer weakened, powerful kingdoms arose in northern Mesopotamia and nearby Syria.</p>\n<div class=\"term\"><b>empire</b><span>a large territory or group of many territories governed by one ruler</span></div>\n<p>Through <b>conquest and trade</b>, these empires spread their cultures over a wide region.</p>\n", "remember": "Sumer weakened by conflict → powerful kingdoms rose → empires formed."}, {"title": "Sargon and the Akkadian Empire", "section": "First Empires", "body": "\n<p>The kingdom of <b>Akkad</b> developed in northern Mesopotamia. Its ruler, <b>Sargon</b>, was an ambitious leader.</p>\n<div class=\"timeline\">\n<div><b>about 2340 B.C.</b><br>Sargon moved his well-trained armies south.</div>\n<div><b>Next</b><br>He conquered the remaining Sumerian city-states one by one.</div>\n<div><b>Then</b><br>He united Sumer with Akkad and became king of Sumer and Akkad.</div>\n<div><b>Result</b><br>He formed the world’s first empire.</div>\n</div>\n<p>Sargon’s Mesopotamian empire lasted for <b>more than 200 years</b> before invaders conquered it.</p>\n", "remember": "Sargon + Akkad + conquest of Sumer = the world’s first empire."}, {"title": "Sargon: Culture and Trade", "section": "First Empires", "body": "\n<p>Under Sargon’s rule, the cultures of Akkad and Sumer joined.</p>\n<ul>\n<li>The people of Mesopotamia spoke the <b>Akkadian language</b>.</li>\n<li>They wrote in <b>Sumerian cuneiform</b>.</li>\n<li>They also worshiped Sumerian gods.</li>\n<li>Sargon’s empire grew wealthy through its many <b>trade routes</b>.</li>\n</ul>\n", "remember": "Sargon united territory, but Sumerian writing and gods remained important."}, {"title": "The Amorites and Babylon", "section": "Babylon", "body": "\n<p>The <b>Amorites</b> lived west of Mesopotamia. In the <b>1800s B.C.</b>, they conquered Mesopotamia and built their own cities.</p>\n<p><b>Babylon</b> was the greatest of these cities. It was located on the eastern bank of the Euphrates River in what is now Iraq.</p>\n<p>Around <b>1792 B.C.</b>, the Babylonian king <b>Hammurabi</b> began conquering cities to the north and south. He created the <b>Babylonian Empire</b>.</p>\n", "remember": "Amorites → Babylon → Hammurabi → Babylonian Empire."}, {"title": "Hammurabi’s Code", "section": "Babylon", "body": "\n<p>Hammurabi was thought to be a just ruler. He is best known for creating a set of laws for his empire and posting the law code for all to read.</p>\n<div class=\"term\"><b>code</b><span>a set of official laws</span></div>\n<p>The code dealt with <b>crimes, farming, business, marriage, and family</b>. Almost every area of life was covered, and the code listed a punishment for each crime.</p>\n", "remember": "Hammurabi’s Code was a written set of laws covering many parts of life."}, {"title": "“An Eye for an Eye”", "section": "Babylon", "body": "\n<p>The Code of Hammurabi was stricter than the old Sumerian laws.</p>\n<div class=\"flow\"><span>Crime</span><b>→</b><span>Punishment should match the seriousness of the crime</span></div>\n<p>This became known as <b>“an eye for an eye, and a tooth for a tooth.”</b> It was meant to limit punishment and do away with blood feuds.</p>\n<p>The code also protected the less powerful. For example, it protected wives from abuse by their husbands.</p>\n", "remember": "The punishment was meant to match the seriousness of the crime."}, {"title": "Why Hammurabi’s Code Mattered", "section": "Babylon", "body": "\n<p>Hammurabi’s Code influenced later law codes, such as those of <b>Greece and Rome</b>.</p>\n<div class=\"flow\"><span>Written laws</span><b>→</b><span>Rules and punishments made clear</span><b>→</b><span>Influenced later law codes</span></div>\n", "remember": "Hammurabi’s Code mattered because it shaped later law codes."}, {"title": "The Assyrian Empire", "section": "Assyria", "body": "\n<p>The Assyrian Empire arose about <b>1,000 years after</b> Hammurabi’s empire.</p>\n<p>Assyria grew into a large empire extending into four present-day countries: <b>Turkey, Syria, Iran, and Iraq</b>.</p>\n<p>The Assyrians built a large and powerful military to defend their hills and fertile valleys. Around <b>900 B.C.</b>, their army began taking over the rest of Mesopotamia.</p>\n", "remember": "Around 900 B.C., Assyria began expanding across Mesopotamia."}, {"title": "The Assyrian Army", "section": "Assyria", "body": "\n<p>The Assyrian army was well trained and disciplined. In battle, the troops numbered around <b>50,000 soldiers</b>.</p>\n<p>The army included <b>infantry, foot soldiers, cavalry, horse soldiers, and charioteers</b>.</p>\n<p>They fought with <b>slingshots, bows and arrows, swords, and spears</b>.</p>\n<div class=\"term\"><b>slingshot</b><span>a weapon that is used to throw stones or other objects</span></div>\n", "remember": "Assyria’s strength came from a large, trained army with many kinds of soldiers and weapons."}, {"title": "Tribute and Fear", "section": "Assyria", "body": "\n<p>The Assyrians robbed people, set crops on fire, and destroyed towns and dams.</p>\n<div class=\"term\"><b>tribute</b><span>a payment made to a ruler or state as a sign of surrender</span></div>\n<p>They also drove people from their homes. Stories of Assyrian brutality spread, and sometimes people surrendered without a fight because they were afraid.</p>\n", "remember": "Tribute = payment to a ruler or state as a sign of surrender."}, {"title": "Iron Weapons", "section": "Assyria", "body": "\n<p>One key factor in Assyrian success was <b>iron weapons</b>.</p>\n<div class=\"flow\"><span>Hittites mastered iron production</span><b>→</b><span>Assyrians learned from Hittite technology</span><b>→</b><span>Iron was stronger than tin or copper</span></div>\n", "remember": "Assyrians learned iron technology from the Hittites."}, {"title": "Assyrian Kings and Government", "section": "Assyria", "body": "\n<p>Assyria extended from the <b>Persian Gulf</b> in the east to the <b>Nile River</b> in the west. Its capital was <b>Nineveh</b>, along the Tigris River.</p>\n<div class=\"term\"><b>province</b><span>a territory governed as a political district of a country or empire</span></div>\n<p>Assyrian kings divided the empire into provinces and chose officials to govern, collect taxes, and carry out laws.</p>\n", "remember": "Large Assyrian empire → divided into provinces → officials helped the king govern."}, {"title": "Roads and Messengers", "section": "Assyria", "body": "\n<p>The Assyrian government built <b>roads</b> that connected the provinces.</p>\n<ul>\n<li>Soldiers guarded stations along the roads to protect traders from bandits.</li>\n<li>Government messengers used the stations to rest and change chariot horses.</li>\n</ul>\n<div class=\"flow\"><span>Roads</span><b>→</b><span>Connected provinces</span><b>→</b><span>Helped government and trade</span></div>\n", "remember": "Roads helped connect and control the Assyrian Empire."}, {"title": "Life in Assyria", "section": "Assyria", "body": "\n<p>Assyrian life was built on what they learned from other Mesopotamian peoples.</p>\n<ul>\n<li>They had law codes, but punishments were <b>harsher</b>.</li>\n<li>They based their writing on <b>Babylonian writing</b>.</li>\n<li>They worshiped many of the same gods.</li>\n<li>They built temples and palaces with wall carvings and statues.</li>\n</ul>\n", "remember": "Assyrians borrowed from earlier Mesopotamian cultures but often used harsher punishments."}, {"title": "Ashurbanipal’s Library", "section": "Assyria", "body": "\n<p>An Assyrian king named <b>Ashurbanipal</b> built one of the world’s first libraries in <b>Nineveh</b>.</p>\n<p>It held <b>25,000 tablets</b> of stories and songs to the gods.</p>\n<p>Historians have learned much about ancient civilizations from this library.</p>\n", "remember": "Ashurbanipal → Nineveh → library with 25,000 tablets."}, {"title": "Assyrian Farming and Trade", "section": "Assyria", "body": "\n<p><b>Farming and trade</b> were both important to the Assyrians.</p>\n<p>They brought in <b>wood and metal</b> from far away to supply their empire with material for building and for making tools and weapons.</p>\n", "remember": "Assyria used trade to get important building materials and metals."}, {"title": "The Chaldeans Take Power", "section": "Chaldeans", "body": "\n<p>For <b>300 years</b>, Assyria ruled the area from the Persian Gulf to Egypt. Because Assyrian rulers were harsh, people often rebelled.</p>\n<p>In about <b>650 B.C.</b>, fighting broke out over who would be the next Assyrian ruler. With Assyria in turmoil, the <b>Chaldeans</b> took power.</p>\n", "remember": "Harsh rule + rebellion + fighting over leadership weakened Assyria."}, {"title": "Nabopolassar’s Revolt", "section": "Chaldeans", "body": "\n<p>Centuries earlier, about <b>1000 B.C.</b>, the Chaldeans had moved into southern Mesopotamia, but the Assyrians quickly conquered them.</p>\n<div class=\"timeline\">\n<div><b>627 B.C.</b><br>Chaldean king <b>Nabopolassar</b> led a revolt against Assyria.</div>\n<div><b>Within a year</b><br>He forced Assyrians out of Uruk and was crowned king of Babylonia.</div>\n<div><b>Medes join</b><br>The Medes joined the Chaldeans.</div>\n<div><b>612 B.C.</b><br>They captured Nineveh and burned it. The Assyrian Empire quickly crumbled.</div>\n</div>\n", "remember": "627 B.C. revolt → 612 B.C. Nineveh captured → Assyrian Empire fell."}, {"title": "The New Babylonian Empire", "section": "Chaldeans", "body": "\n<p><b>Nabopolassar</b> and his son <b>Nebuchadnezzar</b> created a new empire.</p>\n<p>Most Chaldeans were descendants of the Babylonians who had made Hammurabi’s empire about <b>1,200 years earlier</b>.</p>\n<p>The Chaldeans gained control of almost all lands the Assyrians had ruled. <b>Babylon</b> became the capital.</p>\n<p>For this reason, the Chaldean Empire is sometimes called the <b>New Babylonian Empire</b>.</p>\n", "remember": "Chaldean Empire = New Babylonian Empire, with Babylon as its capital."}, {"title": "The Greatness of Babylon", "section": "Babylon Rebuilt", "body": "\n<p>King <b>Nebuchadnezzar</b> rebuilt Babylon, making it the <b>largest and richest city in the world</b> according to the lesson.</p>\n<ul>\n<li>Huge brick walls surrounded the city.</li>\n<li>Soldiers watched from towers built into the walls.</li>\n<li>Grand palaces and temples stood in the center.</li>\n<li>A huge ziggurat stood more than <b>300 feet (92 m)</b> tall.</li>\n<li>Its gold roof could be seen for miles.</li>\n</ul>\n", "remember": "Nebuchadnezzar rebuilt Babylon into a huge, wealthy, heavily defended city."}, {"title": "The Hanging Gardens", "section": "Babylon Rebuilt", "body": "\n<p>Babylon’s <b>Hanging Gardens</b> were considered one of the <b>Seven Wonders of the Ancient World</b>.</p>\n<p>The terraced gardens were built like huge steps and included large trees, masses of flowering vines, and other plants.</p>\n<p>A <b>complex irrigation system</b> brought water from the Euphrates River to the gardens.</p>\n<p>It is believed Nebuchadnezzar built the gardens to please his wife, who missed the mountains and plants of her homeland.</p>\n", "remember": "Hanging Gardens → terraced steps + plants + irrigation from the Euphrates."}, {"title": "Babylon: Religion, Canals, and Taxes", "section": "Babylon Rebuilt", "body": "\n<p>Each spring, thousands crowded into Babylon to watch a gold statue of the god <b>Marduk</b> wheeled along the street. Chaldeans believed the ceremony would bring peace and bigger crops.</p>\n<p>The Babylonians built many new <b>canals</b>, making the land more fertile.</p>\n<p>To pay for building projects and maintain his army, Nebuchadnezzar collected very high <b>taxes and tributes</b>.</p>\n", "remember": "Nebuchadnezzar used taxes and tributes to pay for projects and the army."}, {"title": "Babylon: Trade and Caravans", "section": "Babylon Rebuilt", "body": "\n<p>A major trade route between the <b>Persian Gulf</b> and the <b>Mediterranean Sea</b> passed through Babylon.</p>\n<div class=\"term\"><b>caravan</b><span>a group of merchants traveling together for safety, usually with a large number of camels</span></div>\n<p>Merchants came in caravans and bought Babylonian goods—<b>pottery, cloth, baskets, and jewelry</b>. Babylon grew wealthy from this trade.</p>\n", "remember": "Caravans brought merchants through Babylon, helping the city grow wealthy from trade."}, {"title": "Chaldean Science and Astronomy", "section": "Babylon Rebuilt", "body": "\n<p>The people of Babylon made many scientific advancements. Chaldeans believed the gods showed their plans through changes in the sky.</p>\n<div class=\"term\"><b>astronomer</b><span>a person who studies planets and stars</span></div>\n<p>Chaldean astronomers mapped the <b>stars, planets, and phases of the moon</b> as they changed.</p>\n<p>They invented one of the first <b>sundials</b> to measure time and were the first to follow a <b>seven-day week</b>.</p>\n", "remember": "Astronomer = a person who studies planets and stars."}, {"title": "The Fall of the Chaldean Empire", "section": "Fall", "body": "\n<p>After Nebuchadnezzar died, a series of <b>weak kings</b> ruled the Chaldean Empire.</p>\n<div class=\"flow\"><span>Poor harvests</span><b>+</b><span>Slow trade</span><b>+</b><span>Weak leadership</span><b>→</b><span>Empire weakened</span></div>\n<p>In <b>539 B.C.</b>, the Persians took Babylon and made Mesopotamia part of their empire.</p>\n<p>The Persians allowed the people they conquered to keep their distinct culture.</p>\n", "remember": "539 B.C. → Persians took Babylon after the Chaldean Empire weakened."}, {"title": "Keywords — Teacher Vocabulary", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>empire</b></td><td>a large territory or group of many territories governed by one ruler</td><td>many lands, one ruler</td></tr>\n<tr><td><b>tribute</b></td><td>a payment made to a ruler or state as a sign of surrender</td><td>payment after surrender</td></tr>\n<tr><td><b>province</b></td><td>a territory governed as a political district of a country or empire</td><td>one district of an empire</td></tr>\n<tr><td><b>caravan</b></td><td>a group of merchants traveling together for safety, usually with a large number of camels</td><td>merchants travel together</td></tr>\n<tr><td><b>astronomer</b></td><td>a person who studies planets and stars</td><td>studies the sky</td></tr>\n</table>\n", "remember": "Learn these 5 teacher vocabulary definitions exactly from the textbook."}, {"title": "Other Bold Vocabulary in the Lesson", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>code</b></td><td>a set of official laws</td><td>official laws</td></tr>\n<tr><td><b>military</b></td><td>having to do with soldiers, weapons, or war</td><td>soldiers and war</td></tr>\n<tr><td><b>slingshot</b></td><td>a weapon that is used to throw stones or other objects</td><td>throws stones</td></tr>\n<tr><td><b>region</b></td><td>a geographic area</td><td>an area</td></tr>\n<tr><td><b>complex</b></td><td>having many parts, details, or ideas</td><td>many parts</td></tr>\n</table>\n", "remember": "These bold lesson words can also appear in questions, so know their simple meanings."}, {"title": "Easy-to-Confuse Points", "section": "Review", "body": "\n<table><tr><th>Do not mix up</th><th>Difference</th></tr>\n<tr><td><b>Empire vs. Province</b></td><td>An empire contains many territories under one ruler; a province is one political district inside a country or empire.</td></tr>\n<tr><td><b>Tribute vs. Tax</b></td><td>Tribute is defined as payment made as a sign of surrender. The lesson also says Nebuchadnezzar collected taxes and tributes to pay for projects and the army.</td></tr>\n<tr><td><b>Sargon vs. Hammurabi</b></td><td>Sargon formed the world’s first empire. Hammurabi is best known for his law code.</td></tr>\n<tr><td><b>Nabopolassar vs. Nebuchadnezzar</b></td><td>Nabopolassar led the revolt against Assyria. Nebuchadnezzar rebuilt Babylon.</td></tr>\n<tr><td><b>Astronomer vs. Caravan</b></td><td>Astronomer studies planets and stars; caravan is a group of merchants traveling together.</td></tr>\n</table>\n", "remember": "Match each term to its job: ruler/empire, district/province, payment/tribute, merchants/caravan, sky/astronomer."}, {"title": "Memory Tricks", "section": "Review", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Sargon</b><br>S = Sumer + Akkad joined → first empire</div>\n<div class=\"card\"><b>Hammurabi</b><br>H = His laws → Hammurabi’s Code</div>\n<div class=\"card\"><b>Assyria</b><br>Army → iron weapons → provinces → roads</div>\n<div class=\"card\"><b>Chaldeans</b><br>Nabopolassar revolts → Nebuchadnezzar rebuilds Babylon</div>\n</div>\n", "remember": "Use the ruler chain: Sargon → Hammurabi → Assyrian kings → Nabopolassar → Nebuchadnezzar."}, {"title": "Exam Focus", "section": "Review", "body": "\n<div class=\"examgrid\">\n<div><b>Definitions</b><br>empire, tribute, province, caravan, astronomer</div>\n<div><b>People</b><br>Sargon, Hammurabi, Ashurbanipal, Nabopolassar, Nebuchadnezzar</div>\n<div><b>Dates</b><br>2400, 2340, 1792, 900, 650, 627, 612, 539 B.C.</div>\n<div><b>Cause → Effect</b><br>conflict → weak empires; strong army → conquest; weak kings + poor harvests + slow trade → fall</div>\n<div><b>Government</b><br>laws, provinces, officials, roads, taxes, tribute</div>\n<div><b>Achievements</b><br>Hammurabi’s Code, Assyrian library, rebuilt Babylon, Hanging Gardens, astronomy</div>\n</div>\n", "remember": "Tests often ask definitions, rulers, dates, causes/effects, comparisons, and major achievements."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>SARGON</b><br>Akkad + Sumer → first empire</div>\n<div><b>HAMMURABI</b><br>Babylonian Empire + written law code</div>\n<div><b>ASSYRIA</b><br>50,000 soldiers, iron weapons, tribute, provinces, roads</div>\n<div><b>NABOPOLASSAR</b><br>627 B.C. revolt; Nineveh fell in 612 B.C.</div>\n<div><b>NEBUCHADNEZZAR</b><br>Rebuilt Babylon; gardens, canals, trade, taxes</div>\n<div><b>CHALDEAN FALL</b><br>Weak kings + poor harvests + slow trade → Persians in 539 B.C.</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ empire ☐ tribute ☐ province ☐ caravan ☐ astronomer ☐ Sargon ☐ Hammurabi ☐ Assyrian army ☐ Ashurbanipal’s library ☐ Nabopolassar ☐ Nebuchadnezzar ☐ Hanging Gardens ☐ 539 B.C.</p>\n", "remember": "If you can explain the six boxes above, you know the main story of Mesopotamian Empires."}, {"title": "Complete Teacher Vocabulary Table", "section": "Final Review", "body": "\n<table class=\"small vocaball\"><tr><th>#</th><th>Vocabulary</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td>1</td><td><b>empire</b></td><td>a large territory or group of many territories governed by one ruler</td><td>many lands, one ruler</td></tr>\n<tr><td>2</td><td><b>tribute</b></td><td>a payment made to a ruler or state as a sign of surrender</td><td>surrender payment</td></tr>\n<tr><td>3</td><td><b>province</b></td><td>a territory governed as a political district of a country or empire</td><td>district of an empire</td></tr>\n<tr><td>4</td><td><b>caravan</b></td><td>a group of merchants traveling together for safety, usually with a large number of camels</td><td>merchants together</td></tr>\n<tr><td>5</td><td><b>astronomer</b></td><td>a person who studies planets and stars</td><td>studies planets and stars</td></tr>\n</table>\n", "remember": "The 5 teacher vocabulary words above use the textbook definitions."}, {"title": "Lesson Review — Questions 1–3", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\">\n<li><b>How could caravans passing through Babylon be helped by astronomers?</b><br>Chaldean astronomers mapped stars, planets, and phases of the moon. A source-based answer is that knowledge of the sky could help travelers using the trade route through Babylon. The textbook does not explain this connection in more detail.</li>\n<li><b>How might conquered people feel about paying tribute to the Assyrians?</b><br><b>Sample source-based answer:</b> They might feel afraid or unhappy because tribute was a payment made as a sign of surrender, and stories of Assyrian brutality spread.</li>\n<li><b>How did Hammurabi’s Code differ from earlier Sumerian laws?</b><br>Hammurabi’s Code was <b>stricter</b>. It demanded that punishment match the seriousness of the crime and was meant to limit punishment and end blood feuds.</li>\n</ol>\n", "remember": "Lesson Review 1–3 asks you to connect trade with astronomy, explain tribute, and compare Hammurabi’s laws with earlier Sumerian laws."}, {"title": "Lesson Review — Questions 4–6", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"4\">\n<li><b>How did the Assyrians rule their empire?</b><br>They divided the empire into <b>provinces</b>, built roads to connect them, chose officials to govern, collect taxes, and enforce laws, and stationed soldiers along roads.</li>\n<li><b>Why did the Chaldeans overthrow the Assyrians?</b><br>Assyrian rulers were harsh, people often rebelled, and fighting over who would rule weakened Assyria. Nabopolassar led a revolt, and the Medes joined the Chaldeans.</li>\n<li><b>The Assyrian army is trying to conquer your area. Give a speech to persuade your neighbors either to defend themselves or to surrender without a fight.</b><br><b>Sample source-based answer:</b> “We should surrender without a fight. The Assyrians have a large, disciplined army, iron weapons, cavalry, chariots, and a reputation for harsh attacks. The lesson says some people were so afraid that they surrendered without a fight.”</li>\n</ol>\n", "remember": "For an argument question, choose one side and support it with facts from the lesson."}];
const quiz=[["Easy", "What is an empire?", ["A payment made as a sign of surrender", "A large territory or group of many territories governed by one ruler", "A group of merchants traveling together", "A political district only"], 1, "An empire is many territories governed by one ruler.", "Vocabulary: Empire"], ["Easy", "What is tribute?", ["A payment made to a ruler or state as a sign of surrender", "A group of traders", "A law code", "A road between provinces"], 0, "Tribute is a payment made as a sign of surrender.", "Vocabulary: Tribute"], ["Easy", "What is a province?", ["A weapon", "A territory governed as a political district of a country or empire", "A group of stars", "A trade good"], 1, "A province is a political district in a country or empire.", "Vocabulary: Province"], ["Easy", "What is a caravan?", ["A group of merchants traveling together for safety", "A group of soldiers", "A code of laws", "A government district"], 0, "A caravan is a group of merchants traveling together for safety.", "Vocabulary: Caravan"], ["Easy", "Who is an astronomer?", ["A person who studies planets and stars", "A ruler of a province", "A soldier with a slingshot", "A trader who collects taxes"], 0, "An astronomer studies planets and stars.", "Vocabulary: Astronomer"], ["Easy", "Who formed the world’s first empire in the lesson?", ["Hammurabi", "Nebuchadnezzar", "Sargon", "Ashurbanipal"], 2, "Sargon united Sumer and Akkad and formed the world’s first empire.", "Sargon"], ["Easy", "Who is best known for a famous law code?", ["Nabopolassar", "Hammurabi", "Sargon", "Ashurbanipal"], 1, "Hammurabi is best known for his law code.", "Hammurabi"], ["Easy", "What was the capital of the Assyrian Empire?", ["Babylon", "Uruk", "Nineveh", "Akkad"], 2, "The Assyrian capital was Nineveh.", "Assyria"], ["Easy", "Who rebuilt Babylon and made it a great city?", ["Nebuchadnezzar", "Sargon", "Ashurbanipal", "Hammurabi"], 0, "Nebuchadnezzar rebuilt Babylon.", "Nebuchadnezzar"], ["Easy", "What happened in 539 B.C.?", ["Sargon formed an empire", "Persians took Babylon", "Hammurabi began conquering", "Nineveh was burned"], 1, "In 539 B.C., the Persians took Babylon.", "Chaldean Fall"], ["Medium", "Why were Sumer’s city-states easier for new kingdoms to conquer by 2400 B.C.?", ["They were weakened by conflict", "They had no cities", "They stopped trading", "They had no rulers"], 0, "Conflict weakened Sumer’s city-states.", "Cause & Effect"], ["Medium", "Which statement best describes Sargon’s achievement?", ["He invented the seven-day week", "He united conquered Sumer with Akkad", "He wrote Hammurabi’s Code", "He rebuilt Babylon"], 1, "Sargon united Sumer and Akkad into an empire.", "Sargon"], ["Medium", "What did Hammurabi’s Code try to do with punishments?", ["Make every punishment identical", "Make punishment match the seriousness of the crime", "End all laws", "Use only money as punishment"], 1, "The code demanded punishment that matched the seriousness of the crime.", "Hammurabi’s Code"], ["Medium", "Which helped make the Assyrian army especially strong?", ["Paper weapons", "Iron weapons learned from Hittite technology", "No cavalry", "Only defensive walls"], 1, "Iron weapons were a key factor in Assyrian success.", "Assyrian Army"], ["Medium", "Why did Assyrian kings divide their empire into provinces?", ["To help govern a very large area", "To stop all trade", "To remove officials", "To make the army smaller"], 0, "Provinces helped rulers govern the large empire.", "Assyrian Government"], ["Medium", "What was important about Ashurbanipal’s library?", ["It held 25,000 tablets and helped historians learn about ancient civilizations", "It was a military camp", "It stored iron weapons", "It collected tribute only"], 0, "The library preserved 25,000 tablets of stories and songs.", "Ashurbanipal"], ["Medium", "Why did the Chaldeans get a chance to take power around 650 B.C.?", ["Assyria was in turmoil because of fighting over the next ruler", "Babylon had no trade", "Sargon returned", "The Persians had already conquered Assyria"], 0, "Fighting over leadership weakened Assyria.", "Chaldean Rise"], ["Medium", "What happened in 612 B.C.?", ["Hammurabi created his code", "Nineveh was captured and burned", "The Persians took Babylon", "Sargon conquered Sumer"], 1, "The Chaldeans and Medes captured and burned Nineveh in 612 B.C.", "Dates"], ["Medium", "Why did Babylon become wealthy under the Chaldeans?", ["A major trade route passed through the city", "It stopped all trade", "It had no merchants", "It collected no taxes"], 0, "A major trade route brought merchants and goods through Babylon.", "Babylon Trade"], ["Medium", "What did Chaldean astronomers do?", ["Mapped stars, planets, and phases of the moon", "Built Assyrian roads", "Collected tribute", "Wrote Hammurabi’s Code"], 0, "Chaldean astronomers mapped heavenly bodies and moon phases.", "Astronomy"], ["Hard", "A conquered city pays money to its new ruler as a sign that it has surrendered. What is this payment called?", ["province", "tribute", "caravan", "empire"], 1, "A surrender payment to a ruler or state is tribute.", "Scenario: Tribute"], ["Hard", "A king divides a huge empire into political districts and appoints officials to govern each one. What are the districts called?", ["caravans", "codes", "provinces", "empires"], 2, "The Assyrians called these political districts provinces.", "Scenario: Province"], ["Hard", "Which sequence correctly shows the rise of the Chaldean Empire?", ["Nabopolassar revolts → Medes join → Nineveh falls → New Babylonian Empire grows", "Persians take Babylon → Sargon conquers Sumer → Nineveh falls", "Hammurabi dies → Sargon forms Akkad → Chaldeans disappear", "Ashurbanipal rebuilds Babylon → Persians form Assyria"], 0, "Nabopolassar’s revolt and the fall of Nineveh led to Chaldean power.", "Chaldean Sequence"], ["Hard", "Which answer best explains why some people surrendered to the Assyrians without fighting?", ["They feared Assyrian brutality and military power", "They wanted to become astronomers", "They were required to join caravans", "They wanted Hammurabi’s Code"], 0, "Stories of Assyrian brutality caused some people to surrender without a fight.", "Assyrian Fear"], ["Hard", "Which comparison is correct?", ["Sargon is linked to the first empire; Hammurabi is linked to a major law code", "Sargon rebuilt Babylon; Hammurabi built Nineveh", "Both men were Chaldean astronomers", "Hammurabi led the revolt against Assyria"], 0, "Sargon formed the first empire; Hammurabi is known for his code.", "Compare Rulers"], ["Hard", "Why were roads important to Assyrian government?", ["They connected provinces and supported officials, soldiers, messengers, and traders", "They replaced provinces", "They ended taxation", "They stopped all military travel"], 0, "Roads connected the empire and helped government and trade function.", "Assyrian Government"], ["Hard", "Which detail best shows Nebuchadnezzar needed a strong government to run his empire?", ["He collected high taxes and tributes to pay for projects and the army", "He ended all trade routes", "He removed city walls", "He stopped building canals"], 0, "Taxes and tributes financed major projects and the army.", "Nebuchadnezzar"], ["Hard", "Which statement best explains the fall of the Chaldean Empire?", ["Weak kings, poor harvests, and slow trade weakened it before the Persians took Babylon", "Its army became stronger every year", "Trade increased and harvests improved", "Nebuchadnezzar returned after 539 B.C."], 0, "Weak leadership, poor harvests, and slow trade weakened the empire.", "Cause & Effect"], ["Hard", "A group of merchants crosses a long trade route together for safety. Which vocabulary word fits best?", ["astronomer", "tribute", "caravan", "province"], 2, "A caravan is a group of merchants traveling together for safety.", "Scenario: Caravan"], ["Hard", "Which source-based argument best supports surrendering to an approaching Assyrian army?", ["The Assyrians had about 50,000 trained soldiers, iron weapons, cavalry and chariots, and a feared reputation", "The Assyrians had no weapons", "Assyrian armies avoided conquest", "The Assyrians did not collect tribute"], 0, "The lesson describes a large, disciplined, well-armed and feared Assyrian army.", "Argument from Evidence"]];
let mode='lesson', slide=0, q=0, score=0, answered=false, misses={};

function setBar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function renderLesson(){
 mode='lesson'; const s=slides[slide];
 document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;
 setBar(((slide+1)/slides.length)*100);
 document.getElementById('stage').innerHTML=`<div class="section">${s.section}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember: ${s.remember}</div>`;
 document.getElementById('nav').innerHTML=`<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button><button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button><button class="restart" onclick="restartAll()">↻ Restart</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function nextSlide(){if(slide<slides.length-1){slide++;renderLesson();}else startQuiz();}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){if(confirm('Restart the whole tutor from Slide 1?')){slide=0;q=0;score=0;answered=false;misses={};renderLesson();}}
function startQuiz(){mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();}
function renderQuiz(){
 answered=false; const x=quiz[q], letters=['A','B','C','D'];
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 setBar(((q+1)/quiz.length)*100);
 document.getElementById('stage').innerHTML=`<div class="quizmeta"><span class="difficulty">${x[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div><div class="question">${x[1]}</div><div class="choices">${x[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${letters[i]}.</b> ${c}</button>`).join('')}</div><div id="feedback"></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function answer(i){
 if(answered)return; answered=true; const x=quiz[q], correct=x[3], letters=['A','B','C','D'];
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 document.getElementById('c'+correct).classList.add('correct');
 if(i===correct){score++;document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Correct!<span class="explain">${x[4]}</span></div>`;}
 else{document.getElementById('c'+i).classList.add('wrong');misses[x[5]]=(misses[x[5]]||0)+1;document.getElementById('feedback').innerHTML=`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${letters[correct]}. ${x[2][correct]}</b><span class="explain">${x[4]}</span></div>`;}
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 document.getElementById('nav').innerHTML=`<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function nextQuestion(){if(!answered)return;if(q<quiz.length-1){q++;renderQuiz();}else showResult();}
function restartQuiz(){if(confirm('Restart the quiz and reset the score?')){q=0;score=0;answered=false;misses={};renderQuiz();}}
function backToReview(){slide=slides.length-2;renderLesson();}
function showResult(){
 const pct=Math.round(score/quiz.length*100); const topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
 const review=topics.length?topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]} question${x[1]>1?'s':''}</li>`).join(''):'<li><b>Excellent!</b> No missed topics.</li>';
 document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`; setBar(100);
 document.getElementById('stage').innerHTML=`<div class="result"><div class="section">Quiz Result</div><h1>🎉 30-Question Quiz Complete</h1><div class="scorebig">${score} / ${quiz.length}</div><h2>${pct}%</h2><div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Remember: Review missed topics, then try the quiz again.</div></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="next" onclick="restartQuiz()">Try Quiz Again</button><button class="restart" onclick="restartAll()">↻ Restart All</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{if(mode==='lesson'&&e.key==='ArrowRight')nextSlide();if(mode==='lesson'&&e.key==='ArrowLeft')prevSlide();});
renderLesson();
</script>
