<script>
const slides=[{"title": "Lesson 4 — The Kingdom of Kush", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">ANCIENT EGYPT AND KUSH • LESSON 4</div>\n  <div class=\"big\">Why do civilizations rise and fall?</div>\n  <p>Nubia, later known as <b>Kush</b>, developed south of Egypt along the Nile River. Kush grew through farming, gold, trade, iron production, and contact with Egypt.</p>\n  <div class=\"flow\"><span>Nubia</span><b>→</b><span>Kerma</span><b>→</b><span>Kush</span><b>→</b><span>Meroë</span><b>→</b><span>Trade & Iron</span></div>\n</div>\n", "remember": "Follow the story: Nubia grew into Kerma, then Kush, then Meroë became a major iron and trade center."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Nubians & Kerma</b><br>Settlement, savannas, farming, gold, trade, and Egyptian influence.</div>\n<div class=\"card\"><b>Rise of Kush</b><br>Napata, trade caravans, Kush conquers Egypt, and Egyptian cultural influence.</div>\n<div class=\"card\"><b>Iron & Meroë</b><br>Iron tools and weapons, new capital, natural resources, and city design.</div>\n<div class=\"card\"><b>Trade & Decline</b><br>Long-distance trade, textiles, Axum, and the destruction of Meroë.</div>\n</div>\n<div class=\"source-note\"><b>Source note:</b> The teacher-summary section contains only “...”, so no extra summary facts were added.</div>\n", "remember": "For the test, connect geography + resources + trade + culture + military power."}, {"title": "Where Was Nubia?", "section": "The Nubians", "body": "\n<p>Nubia was located <b>south of Egypt</b> along the Nile River in present-day Sudan.</p>\n<p>Cattle herders were the first people to settle there, arriving about <b>2000 B.C.</b></p>\n<div class=\"term\"><b>savanna</b><span>a flat grassland, sometimes with scattered trees, in a tropical or subtropical region</span></div>\n", "remember": "Nubia was south of Egypt; early settlers herded cattle on savannas."}, {"title": "Nubian Farming", "section": "The Nubians", "body": "\n<p>Nubians did not depend on Nile floods to create fertile soil.</p>\n<p>Their land had fertile soil and received rainfall all year long.</p>\n<p>Nubian villages grew:</p>\n<ul>\n<li>Beans</li>\n<li>Yams</li>\n<li>Rice</li>\n<li>Grains</li>\n</ul>\n<p>They also hunted for food, and Nubian hunters and warriors were skilled with the <b>bow and arrow</b>.</p>\n", "remember": "Unlike Egypt, Nubia could farm with fertile soil and year-round rainfall."}, {"title": "The Rise of Kerma", "section": "Kerma", "body": "\n<p>Stronger Nubian villages gradually took over weaker ones and formed the kingdom of <b>Kerma</b>.</p>\n<p>Kerma became wealthy from:</p>\n<div class=\"flow\"><span>Agriculture</span><b>+</b><span>Gold mining</span><b>+</b><span>Trade</span><b>→</b><span>Wealth</span></div>\n<p>Kerma developed a close relationship with Egypt.</p>\n", "remember": "Kerma grew wealthy from farming, gold, and trade."}, {"title": "Kerma as a Trade Link", "section": "Kerma", "body": "\n<p>Kerma’s central location in the Nile Valley made it an important trade link between <b>Egypt</b> and the tropical areas of <b>southern Africa</b>.</p>\n<p>From Kerma, Egyptians acquired:</p>\n<ul>\n<li>Cattle, gold, incense, ivory</li>\n<li>Giraffes and leopards</li>\n<li>Enslaved people</li>\n</ul>\n<p>Egypt also hired Nubians to serve in its armies because of their warfare skills.</p>\n", "remember": "Kerma connected Egypt with southern Africa and supplied valuable goods."}, {"title": "Kerma’s Crafts and Tombs", "section": "Kerma", "body": "\n<p>Kerma’s artisans produced fine <b>pottery, jewelry, and metal goods</b>.</p>\n<p>Workers built tombs for Kerma’s kings. Kings were buried with personal belongings, including gems, gold, jewelry, and pottery.</p>\n<p>The lesson says some Kerma artifacts were as magnificent as those found in Egyptian royal tombs of the same time.</p>\n", "remember": "Kerma showed wealth through skilled crafts and royal tombs."}, {"title": "Egyptian Rule in Nubia", "section": "Egyptian Influence", "body": "\n<p>Egyptian armies invaded Nubia in the <b>1400s B.C.</b></p>\n<p>After a <b>50-year war</b>, Egypt conquered Kerma and ruled it for about <b>700 years</b>.</p>\n<p>Under Egyptian rule, Nubians adopted many Egyptian beliefs and customs.</p>\n", "remember": "Egypt ruled Nubia for about 700 years after conquering Kerma."}, {"title": "How Egypt Influenced Nubia", "section": "Egyptian Influence", "body": "\n<p>Nubians adopted many parts of Egyptian culture:</p>\n<ul>\n<li>Worshiped Egyptian gods and goddesses along with their own deities</li>\n<li>Learned to use copper and bronze tools</li>\n<li>Adapted Egyptian hieroglyphs to fit their own language</li>\n<li>Created an alphabet</li>\n</ul>\n", "remember": "Egypt influenced Nubian religion, tools, and writing."}, {"title": "The Rise of Kush", "section": "Kush", "body": "\n<p>By the end of the Middle Kingdom, Egypt had become weak and could no longer control its conquered peoples effectively.</p>\n<p>By <b>850 B.C.</b>, Nubians formed an independent kingdom called <b>Kush</b>.</p>\n<p>Powerful kings ruled from the capital at <b>Napata</b>.</p>\n", "remember": "850 B.C. → independent Kush → capital at Napata."}, {"title": "Napata and Trade", "section": "Kush", "body": "\n<p>Napata was located where trade caravans crossed the upper Nile River.</p>\n<p>Caravans came from central Africa carrying <b>ivory and other goods</b>.</p>\n<p>They stopped at Napata for Kushite products and continued to Egypt.</p>\n<div class=\"flow\"><span>Central Africa</span><b>→</b><span>Napata</span><b>→</b><span>Egypt</span></div>\n", "remember": "Napata prospered because it sat on an important trade route."}, {"title": "Kush Conquers Egypt", "section": "Kush", "body": "\n<p>About <b>750 B.C.</b>, Kushite king <b>Kashta</b> invaded Egypt and reached Thebes.</p>\n<p>After Kashta died, his son <b>Piye</b> became king and completed the conquest of Egypt in <b>728 B.C.</b></p>\n<p>Piye founded the <b>Twenty-fifth Dynasty</b>, which governed Egypt and Kush from Napata.</p>\n", "remember": "Kashta began the conquest; Piye completed it in 728 B.C."}, {"title": "Kushite Culture Under Egyptian Influence", "section": "Kush", "body": "\n<p>Kushite kings and wealthy people continued to admire Egyptian culture.</p>\n<ul>\n<li>Built white sandstone temples and monuments similar to Egypt’s</li>\n<li>Believed rulers and deities had a close relationship</li>\n<li>Built small, steeply sloped pyramids as royal tombs</li>\n</ul>\n<p>Many Kushite rulers and wealthy people had Egyptian-style customs.</p>\n", "remember": "Kush copied many Egyptian religious and architectural ideas."}, {"title": "Kush Also Kept Its Own Style", "section": "Kush", "body": "\n<p>Kush was influenced by Egypt, but it also had its own traditions.</p>\n<ul>\n<li>Some people wore ankle and ear jewelry like southern Africans.</li>\n<li>Kush developed its own style of painted pottery.</li>\n<li>The <b>elephant</b>, a sacred animal in Kush, appeared in sculpture and other arts.</li>\n</ul>\n", "remember": "Kush blended Egyptian influence with its own African traditions."}, {"title": "Assyrians Defeat Kush", "section": "Iron", "body": "\n<p>Kush ruled Egypt for about <b>60 years</b>.</p>\n<p>In <b>671 B.C.</b>, the Assyrians invaded Egypt.</p>\n<p>The Assyrians used <b>iron weapons</b>; Kushites had bronze weapons, which were not as strong.</p>\n<p>Kushites fled Egypt and returned south.</p>\n", "remember": "671 B.C. → Assyrians’ iron weapons helped defeat Kush."}, {"title": "Kush Learns to Use Iron", "section": "Iron", "body": "\n<p>Despite defeat, Kushites learned how to make iron from the Assyrians.</p>\n<div class=\"cards\">\n<div class=\"card\"><b>Farmers</b><br>Used iron for hoes and plows instead of copper or stone → grew more grain and crops.</div>\n<div class=\"card\"><b>Warriors</b><br>Made iron weapons → stronger military.</div>\n</div>\n", "remember": "Iron improved both farming and military strength."}, {"title": "Meroë Becomes the Capital", "section": "Meroë", "body": "\n<p>About <b>540 B.C.</b>, Kush’s rulers moved the capital to <b>Meroë</b>, near one of the Nile’s cataracts.</p>\n<p>This made them safer from Assyrian attacks.</p>\n<p>The Nile still supported trade and transportation.</p>\n<p>Nearby <b>iron ore</b> and <b>trees</b> supplied materials and fuel for making iron.</p>\n", "remember": "Meroë was safer and had the resources needed for iron production."}, {"title": "Meroë — Iron City", "section": "Meroë", "body": "\n<p>Meroë became a major center of <b>iron production</b> and a busy trading city.</p>\n<p>It contained:</p>\n<ul>\n<li>Iron furnaces</li>\n<li>Heaps of black slag, or waste from iron making</li>\n<li>A temple to Amon-Re</li>\n<li>Palaces and homes decorated with paintings</li>\n<li>Small pyramids in the royal graveyard</li>\n</ul>\n", "remember": "Meroë looked partly Egyptian but was different because of its many iron furnaces."}, {"title": "Meroë — A Trading Center", "section": "Trade", "body": "\n<p>Meroë stood at the center of a large trade network running north to Egypt’s border and east to the Red Sea.</p>\n<p>Kush’s merchants received <b>leopard skins and valuable woods</b> from Africa’s tropical interior.</p>\n<p>They traded these, along with iron products, to places as far away as <b>Arabia, India, China, and Rome</b>.</p>\n", "remember": "Meroë connected Kush to a very large trade network."}, {"title": "Textiles and Wealth", "section": "Trade", "body": "\n<div class=\"term\"><b>textile</b><span>woven cloth</span></div>\n<p>In return for trade goods, enslaved people and others brought back <b>cotton, textiles, and other goods</b>.</p>\n<p>Kush’s merchants used their wealth to build fine houses and public baths like ones seen in Rome.</p>\n", "remember": "Textile = woven cloth; trade made Kushite merchants wealthy."}, {"title": "Axum and the End of Meroë", "section": "Decline", "body": "\n<p>Kush remained a great trading kingdom for nearly <b>600 years</b>.</p>\n<p>Then <b>Axum</b>, near the Red Sea in eastern Africa, became another trading kingdom.</p>\n<p>Axum gained strength from its Red Sea location and became a trade center.</p>\n<p>Around <b>A.D. 350</b>, armies of Axum invaded Kush and destroyed Meroë.</p>\n", "remember": "A.D. 350 → Axum invaded Kush and destroyed Meroë."}, {"title": "Vocabulary + Easy-to-Confuse", "section": "Vocabulary", "body": "\n<table class=\"small\">\n<tr><th>Word</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>savanna</b></td><td>a flat grassland, sometimes with scattered trees, in a tropical or subtropical region</td><td>flat tropical grassland</td></tr>\n<tr><td><b>textile</b></td><td>woven cloth</td><td>cloth that is woven</td></tr>\n<tr><td><b>rely</b></td><td>to depend on someone or something</td><td>depend on</td></tr>\n<tr><td><b>challenge</b></td><td>to invite the start of a competition</td><td>compete</td></tr>\n</table>\n", "remember": "Teacher words: savanna = grassland; textile = woven cloth."}, {"title": "Memory Tricks + Exam Focus", "section": "Review", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Kerma</b><br>Gold + farming + trade</div>\n<div class=\"card\"><b>Kush</b><br>Napata + trade + conquers Egypt</div>\n<div class=\"card\"><b>Iron</b><br>Better tools + stronger weapons</div>\n<div class=\"card\"><b>Meroë</b><br>Iron furnaces + trade network</div>\n</div>\n<p><b>Exam Focus:</b> savanna, textile, Kerma, Egyptian influence, Kush/Napata, Kashta & Piye, iron technology, Meroë, trade, and Axum.</p>\n", "remember": "Match each stage with one key idea: Kerma–trade, Kush–power, Meroë–iron."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>NUBIA</b><br>South of Egypt; savannas; farming; bow and arrow.</div>\n<div><b>KERMA</b><br>Gold + agriculture + trade; close ties with Egypt.</div>\n<div><b>EGYPTIAN RULE</b><br>About 700 years; religion, tools, writing influenced Nubia.</div>\n<div><b>KUSH</b><br>850 B.C.; Napata; Kashta + Piye conquered Egypt.</div>\n<div><b>MEROË</b><br>540 B.C.; iron production + trade network.</div>\n<div><b>DECLINE</b><br>Axum rose; A.D. 350 Axum destroyed Meroë.</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ savanna ☐ textile ☐ Kerma ☐ Napata ☐ Kashta ☐ Piye ☐ Egyptian influence ☐ iron ☐ Meroë ☐ trade ☐ Axum</p>\n", "remember": "If you can explain these six boxes, you know the whole lesson."}, {"title": "Lesson Review — Questions 1–3", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\">\n<li><b>What are the characteristics of a savanna?</b><br>A savanna is a <b>flat grassland</b>, sometimes with scattered trees, in a tropical or subtropical region.</li>\n<li><b>What are textiles used to make?</b><br>The textbook defines <b>textile</b> as woven cloth. The study material does not clearly give a separate list of things textiles are used to make.</li>\n<li><b>Discuss two ways Nubia and Egypt influenced each other.</b><br><b>Sample answer:</b> Egypt influenced Nubia through religion, copper and bronze tools, and hieroglyphic writing. Nubia supplied Egypt with goods such as cattle, gold, incense, ivory, and other products through trade.</li>\n</ol>\n", "remember": "Review 1–3 = vocabulary + two-way influence between Nubia and Egypt."}, {"title": "Lesson Review — Questions 4–6", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"4\">\n<li><b>How were the cities of Kush similar to and different from those of Egypt?</b><br>They were similar because Kushite cities used Egyptian-style temples, monuments, paintings, and pyramids. Meroë was different because it contained <b>iron furnaces</b>.</li>\n<li><b>How did natural resources help make Meroë a great trading city?</b><br>Nearby <b>iron ore</b> and <b>trees</b> supported iron production, while the Nile supported trade and transportation. Meroë then traded iron products across a wide network.</li>\n<li><b>Create an advertisement encouraging people in ancient Egypt and Kush to use iron.</b><br><b>Sample source-based answer:</b> “Use iron! Iron hoes and plows help farmers grow more crops, and iron weapons make warriors stronger than bronze weapons.”</li>\n</ol>\n", "remember": "For argument questions, use benefits directly stated in the lesson."}]; const quiz=[["Easy", "What is a savanna?", ["A woven cloth", "A type of iron furnace", "A royal tomb", "A flat grassland, sometimes with scattered trees, in a tropical or subtropical region"], 3, "Savanna means a flat grassland, sometimes with scattered trees.", "Vocabulary: Savanna"], ["Easy", "What is a textile?", ["Woven cloth", "A grassland", "A royal city", "A weapon"], 0, "Textile means woven cloth.", "Vocabulary: Textile"], ["Easy", "Where was Nubia located?", ["North of Egypt", "South of Egypt along the Nile River", "West of Rome", "In Mesopotamia"], 1, "Nubia was south of Egypt along the Nile.", "Geography"], ["Easy", "About when did the first cattle herders settle Nubia?", ["850 B.C.", "540 B.C.", "A.D. 350", "2000 B.C."], 3, "The lesson says they arrived about 2000 B.C.", "Dates"], ["Easy", "What kingdom grew from stronger Nubian villages?", ["Kerma", "Babylon", "Assyria", "Axum"], 0, "Stronger Nubian villages formed Kerma.", "Kerma"], ["Easy", "What was Kush’s capital by 850 B.C.?", ["Napata", "Thebes", "Memphis", "Meroë"], 0, "Kush was ruled from Napata.", "Kush"], ["Easy", "Who completed the conquest of Egypt in 728 B.C.?", ["Kashta", "Ahmose", "Piye", "Ramses II"], 2, "Piye completed the conquest of Egypt.", "Piye"], ["Easy", "What weapon material helped Assyrians defeat Kush?", ["Copper", "Iron", "Stone", "Wood"], 1, "Assyrians had stronger iron weapons.", "Iron"], ["Easy", "About when was the capital moved to Meroë?", ["540 B.C.", "850 B.C.", "671 B.C.", "A.D. 350"], 0, "Kush moved the capital to Meroë about 540 B.C.", "Meroë"], ["Easy", "Who destroyed Meroë around A.D. 350?", ["Egypt", "Assyria", "Rome", "Axum"], 3, "Axum invaded Kush and destroyed Meroë.", "Axum"], ["Medium", "Why did Nubians not depend on Nile floods the way Egyptians did?", ["They had no farms", "They used only desert land", "Their land had fertile soil and year-round rainfall", "They lived far from water"], 2, "Nubian land received enough rainfall and had fertile soil.", "Nubian Farming"], ["Medium", "Why did Kerma become wealthy?", ["Only war", "Only pottery", "Agriculture, gold mining, and trade", "Only religion"], 2, "Kerma grew rich from farming, gold, and trade.", "Kerma"], ["Medium", "Why was Kerma important to Egypt?", ["It replaced the Nile", "It ended trade", "It was Egypt’s capital", "It linked Egypt with tropical southern Africa"], 3, "Kerma was an important trade link.", "Trade"], ["Medium", "What did Nubians adopt during Egyptian rule?", ["Egyptian gods, copper/bronze tools, and adapted hieroglyphs", "Roman law", "Cuneiform only", "No foreign ideas"], 0, "The lesson lists those Egyptian influences.", "Egyptian Influence"], ["Medium", "Why did Kush become independent by 850 B.C.?", ["Kush moved to Rome", "Assyria gave Kush independence", "Egypt had become weak and could no longer govern conquered peoples effectively", "Napata disappeared"], 2, "Egypt’s weakness allowed Nubia to break away.", "Rise of Kush"], ["Medium", "Why did Napata prosper?", ["It had no trade", "It was isolated from Africa", "It had no river", "It was on an important trade route where caravans crossed the Nile"], 3, "Napata’s location helped trade.", "Napata"], ["Medium", "How did Kushite culture remain connected to Egypt?", ["They rejected all Egyptian customs", "Kushites built Egyptian-style temples, monuments, and pyramids", "They stopped using religion", "They moved to Egypt permanently"], 1, "Kushites continued to admire Egyptian culture.", "Culture"], ["Medium", "How did iron help Kushite farmers?", ["Iron made less food", "Iron stopped farming", "Iron replaced rainfall", "Iron hoes and plows helped them grow more crops"], 3, "Better iron tools improved farming.", "Iron"], ["Medium", "Why was Meroë a good place for iron production?", ["Iron ore and trees were nearby", "It had no natural resources", "It had only gold", "It was far from trade"], 0, "Nearby iron ore and fuel from trees supported furnaces.", "Meroë"], ["Medium", "What made Meroë wealthy?", ["Only farming", "Iron production and long-distance trade", "Only temples", "Only pyramids"], 1, "Meroë prospered from iron and trade.", "Meroë Trade"], ["Hard", "A traveler sees flat tropical grassland with scattered trees in Nubia. Which term fits best?", ["textile", "savanna", "pyramid", "furnace"], 1, "A savanna is flat grassland with scattered trees.", "Scenario: Savanna"], ["Hard", "Which sequence correctly shows Kush’s political development?", ["Meroë → Kerma → Egypt → Napata", "Axum → Kerma → Napata → Egypt", "Napata → Mesopotamia → Kerma", "Kerma → Egyptian rule → independent Kush at Napata → Meroë"], 3, "That sequence matches the lesson.", "Sequence"], ["Hard", "Which statement best shows two-way influence between Egypt and Nubia?", ["Only Egypt received influence", "Only Nubia traded", "Egypt influenced Nubian religion and writing, while Nubia supplied valuable goods and soldiers", "The two never interacted"], 2, "The lesson shows influence moving both ways.", "Compare Cultures"], ["Hard", "Why did Assyrian iron weapons matter in 671 B.C.?", ["They were lighter than cloth", "They were stronger than the Kushites’ bronze weapons", "They were used only for farming", "They were made in Meroë"], 1, "Iron weapons helped Assyria defeat Kush.", "Military Technology"], ["Hard", "Which ruler pair is correctly matched?", ["Piye began Kerma; Kashta founded Axum", "Kashta destroyed Meroë; Piye moved to Rome", "Kashta began the invasion of Egypt; Piye completed the conquest", "Both ruled Assyria"], 2, "Kashta began the invasion and Piye finishe let mode='lesson',slide=0,q=0,score=0,answered=false,misses={};
function setBar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function renderLesson(){
 mode='lesson';const s=slides[slide];
 document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;setBar((slide+1)/slides.length*100);
 document.getElementById('stage').innerHTML=`<div class="section">${s.section}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember: ${s.remember}</div>`;
 document.getElementById('nav').innerHTML=`<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button><button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button><button class="restart" onclick="restartAll()">↻ Restart</button>`;
}
function nextSlide(){if(slide<slides.length-1){slide++;renderLesson();}else startQuiz();}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){if(confirm('Restart from Slide 1?')){slide=0;q=0;score=0;answered=false;misses={};renderLesson();}}
function startQuiz(){mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();}
function renderQuiz(){
 answered=false;const x=quiz[q],L=['A','B','C','D'];
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;setBar((q+1)/quiz.length*100);
 document.getElementById('stage').innerHTML=`<div class="quizmeta"><span class="difficulty">${x[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div><div class="question">${x[1]}</div><div class="choices">${x[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${L[i]}.</b> ${c}</button>`).join('')}</div><div id="feedback"></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function answer(i){
 if(answered)return;answered=true;const x=quiz[q],c=x[3],L=['A','B','C','D'];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('c'+c).classList.add('correct');
 if(i===c){score++;document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Correct!<span class="explain">${x[4]}</span></div>`;}
 else{document.getElementById('c'+i).classList.add('wrong');misses[x[5]]=(misses[x[5]]||0)+1;document.getElementById('feedback').innerHTML=`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${L[c]}. ${x[2][c]}</b><span class="explain">${x[4]}</span></div>`;}
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 document.getElementById('nav').innerHTML=`<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function nextQuestion(){if(!answered)return;if(q<quiz.length-1){q++;renderQuiz();}else showResult();}
function restartQuiz(){if(confirm('Restart quiz?')){q=0;score=0;answered=false;misses={};renderQuiz();}}
function backToReview(){slide=slides.length-2;renderLesson();}
function showResult(){
 const pct=Math.round(score/quiz.length*100),topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
 const review=topics.length?topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]}</li>`).join(''):'<li><b>Excellent!</b> No missed topics.</li>';
 document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`;setBar(100);
 document.getElementById('stage').innerHTML=`<div class="result"><div class="section">Quiz Result</div><h1>🎉 Quiz Complete</h1><div class="scorebig">${score} / ${quiz.length}</div><h2>${pct}%</h2><div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Remember: Review missed topics, then try again.</div></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="next" onclick="restartQuiz()">Try Quiz Again</button><button class="restart" onclick="restartAll()">↻ Restart All</button>`;
}
