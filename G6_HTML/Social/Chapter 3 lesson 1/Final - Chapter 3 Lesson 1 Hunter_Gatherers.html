<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c35">
  <title>Hunter-Gatherers Touchscreen Tutor</title>
  <style>
    :root {
      --forest: #123c35;
      --forest-2: #1e6657;
      --ink: #18332e;
      --cream: #fffaf0;
      --paper: #ffffff;
      --gold: #f4b942;
      --orange: #e77732;
      --sky: #dff4f5;
      --line: #d5e3de;
      --correct: #147a50;
      --wrong: #b83a3a;
      --shadow: 0 16px 44px rgba(18, 60, 53, .16);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(244,185,66,.22), transparent 24rem),
        radial-gradient(circle at 92% 90%, rgba(30,102,87,.18), transparent 28rem),
        var(--cream);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.45;
      overflow-x: hidden;
    }

    button { font: inherit; }
    button:focus-visible { outline: 4px solid rgba(244,185,66,.75); outline-offset: 3px; }

    .app {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 24px);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    .course-title {
      font-weight: 800;
      color: var(--forest);
      letter-spacing: .01em;
      font-size: clamp(1rem, 2vw, 1.25rem);
    }

    .mode-badge {
      padding: 8px 14px;
      border-radius: 999px;
      color: white;
      background: var(--forest-2);
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-track {
      height: 12px;
      background: #e4ece8;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--orange));
      transition: width .35s ease;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: stretch;
      min-height: 0;
    }

    .card {
      width: 100%;
      min-height: clamp(510px, 72vh, 720px);
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(18,60,53,.12);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: enter .28s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    .eyebrow {
      color: var(--orange);
      font-size: .92rem;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1, h2, h3 { margin: 0; line-height: 1.12; color: var(--forest); }
    h1 { font-size: clamp(2rem, 5.5vw, 4.4rem); max-width: 900px; }
    h2 { font-size: clamp(1.75rem, 4vw, 3rem); margin-bottom: 22px; }
    h3 { font-size: clamp(1.12rem, 2vw, 1.35rem); margin-bottom: 8px; }

    .lead {
      font-size: clamp(1.12rem, 2.2vw, 1.45rem);
      max-width: 850px;
      margin: 20px 0;
    }

    p { font-size: clamp(1rem, 1.8vw, 1.22rem); margin: 7px 0 13px; }
    strong, .vocab { color: #9d491a; font-weight: 900; }
    .big-equation {
      margin: 20px 0;
      padding: 20px;
      border-radius: 18px;
      background: var(--sky);
      text-align: center;
      font-size: clamp(1.1rem, 2.4vw, 1.55rem);
      font-weight: 900;
      color: var(--forest);
    }

    .grid { display: grid; gap: 14px; margin: 8px 0 18px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mini-card {
      background: #f6faf8;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      font-size: clamp(.98rem, 1.6vw, 1.12rem);
    }
    .mini-card.gold { background: #fff5d8; border-color: #f2d790; }
    .mini-card.blue { background: #e9f7f8; border-color: #b7dedf; }
    .mini-card.orange { background: #fff0e5; border-color: #efc5aa; }
    .mini-card p:last-child { margin-bottom: 0; }

    ul, ol { margin: 5px 0 12px; padding-left: 1.35em; font-size: clamp(1rem, 1.7vw, 1.18rem); }
    li { margin: 6px 0; }

    .timeline { display: grid; gap: 12px; margin: 8px 0 18px; }
    .time-row {
      display: grid;
      grid-template-columns: minmax(145px, .8fr) 2fr;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .time-row b { background: var(--forest); color: white; padding: 13px 15px; }
    .time-row span { padding: 13px 15px; background: #f8fbfa; }

    .vocab-list { display: grid; gap: 10px; margin-bottom: 14px; }
    .vocab-row {
      display: grid;
      grid-template-columns: minmax(130px, .7fr) 2fr minmax(150px, 1fr);
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fbfdfc;
      font-size: clamp(.94rem, 1.5vw, 1.07rem);
    }
    .vocab-row .tip { color: var(--forest-2); font-weight: 800; }

    .remember {
      margin-top: auto;
      padding: 15px 18px;
      border-radius: 18px;
      background: linear-gradient(110deg, #fff0b8, #fff8dc);
      border: 2px solid #f2cf67;
      color: #5d4500;
      font-size: clamp(1rem, 1.7vw, 1.18rem);
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding-top: 14px;
    }

    .btn {
      min-height: 58px;
      border: 0;
      border-radius: 17px;
      padding: 13px 22px;
      font-weight: 900;
      font-size: clamp(1rem, 1.8vw, 1.18rem);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.secondary { background: #e3ece8; color: var(--forest); }
    .btn.restart { background: white; color: var(--forest); border: 2px solid var(--line); }
    .btn.primary { background: var(--forest); color: white; }
    .btn.primary:hover, .choice:hover:not(:disabled) { filter: brightness(1.08); }

    .quiz-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .difficulty, .score-pill {
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      background: #eef5f2;
      color: var(--forest);
    }
    .question { font-size: clamp(1.35rem, 3.3vw, 2.15rem); margin: 6px 0 20px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .choice {
      min-height: 76px;
      padding: 15px 18px;
      border-radius: 18px;
      border: 2px solid var(--line);
      background: #f9fbfa;
      color: var(--ink);
      text-align: left;
      font-size: clamp(1rem, 1.8vw, 1.17rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      gap: 13px;
      align-items: center;
      touch-action: manipulation;
    }
    .letter {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--forest-2);
      font-weight: 900;
    }
    .choice.correct { border-color: var(--correct); background: #e4f6ec; }
    .choice.correct .letter { background: var(--correct); }
    .choice.wrong { border-color: var(--wrong); background: #fdeaea; }
    .choice.wrong .letter { background: var(--wrong); }

    .feedback {
      display: none;
      margin-top: 17px;
      padding: 15px 18px;
      border-radius: 16px;
      font-size: clamp(1rem, 1.7vw, 1.15rem);
      font-weight: 700;
    }
    .feedback.show { display: block; animation: enter .2s ease both; }
    .feedback.good { background: #e4f6ec; color: #0e6040; }
    .feedback.bad { background: #fdeaea; color: #8e2d2d; }
    .quiz-next { display: none; margin: 16px 0 0 auto; }
    .quiz-next.show { display: block; }

    .result-score {
      width: 170px;
      height: 170px;
      display: grid;
      place-items: center;
      margin: 12px auto 22px;
      border-radius: 50%;
      background: var(--forest);
      color: white;
      font-size: 2.4rem;
      font-weight: 900;
      box-shadow: 0 0 0 12px #e7f2ee;
    }
    .review-topics {
      max-width: 760px;
      margin: 0 auto;
      background: #f7faf8;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 22px;
    }
    .center { text-align: center; }

    @media (max-width: 720px) {
      .app { padding: 10px; }
      .topbar { grid-template-columns: 1fr; gap: 8px; }
      .mode-badge { justify-self: start; }
      .card { min-height: 620px; border-radius: 22px; padding: 22px 18px; }
      .grid.two, .grid.three, .choices { grid-template-columns: 1fr; }
      .vocab-row { grid-template-columns: 1fr; gap: 5px; }
      .time-row { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
      .controls .restart { grid-column: 1 / -1; grid-row: 2; }
    }

    @media (max-height: 720px) and (min-width: 721px) {
      .card { min-height: 540px; padding-top: 24px; padding-bottom: 24px; }
      h2 { margin-bottom: 14px; }
      .mini-card { padding: 12px; }
      .remember { padding: 12px 16px; }
    }
  </style>
</head>

  <script>
    "use strict";

    const slides = [
      {

            <div class="mini-card orange"><h3>Main Idea</h3><p>People changed their lives to survive.</p></div>
          </div>`,

      {

          <div class="mini-card"><h3>New Skills</h3><p>Tools, fire, spoken language, and art</p></div>
          <div class="mini-card"><h3>Environment</h3><p>Climate, shelters, clothing, and the Ice Age</p></div>
          <div class="mini-card"><h3>Important Facts</h3><p>Dates, definitions, causes, effects, and examples</p></div>
        </div>`,

      {
        section: "The Paleolithic Age",
        title: "The Old Stone Age",
        body: `<p>The early period of human history is called the <strong>Stone Age</strong> because people used stone to make tools and weapons.</p>
          <div class="big-equation"><span class="vocab">Paleolithic Age</span> = Old Stone Age</div>
          <p>In Greek, <strong>Paleolithic</strong> means “old stone.” It was the earliest part of the Stone Age.</p>`,
        remember: "Paleo = old → Paleolithic = Old Stone Age."
      },
      {
        section: "The Paleolithic Age",
        title: "Important Timeline",
        body: `<div class="timeline">
          <div class="time-row"><b>About 2.5 million years ago</b><span>The Paleolithic Age began.</span></div>
          <div class="time-row"><b>About 100,000 years ago</b><span>The most recent Ice Age began.</span></div>

      },
      {
        section: "Daily Life",

        body: `<p>Paleolithic people lived before there were roads, farms, or villages.</p>
          <div class="grid two">
            <div class="mini-card gold"><h3><span class="vocab">Nomads</span></h3><p>They regularly moved from place to place to survive.</p></div>
            <div class="mini-card blue"><h3>Bands</h3><p>They traveled in groups of about <strong>20 or 30 members</strong>.</p></div>
          </div>
          <div class="big-equation">Move from place to place → Find food → Survive</div>`,
        remember: "Nomads moved for food, usually in bands of 20 or 30."
      },
      {
        section: "Daily Life",
        title: "Hunting and Gathering",
        body: `<div class="grid two">
          <div class="mini-card orange"><h3>Hunting</h3><p>Buffalo, bison, wild goats, reindeer, other animals, and fish in coastal areas</p></div>

        <div class="big-equation">Hunting + Gathering → Food → Group Survival</div>
        <p>The search for food was their main activity, and it was often difficult.</p>`,
        remember: "Hunter-gatherers hunted animals and gathered wild plants."
      },
      {
        section: "Daily Life",
        title: "Work in the Group",
        body: `<div class="grid two">
          <div class="mini-card"><h3>Men</h3><ul><li>Hunted large animals</li><li>Traveled far from camp</li><li>Learned animal behavior</li><li>Developed tracking methods</li></ul></div>

      {

          <div class="big-equation">Man + Woman + Children → First Families</div>`,

      {

      {
        section: "The Ice Ages",
        title: "Adapting to the Ice Age",
        body: `<div class="grid two">
          <div class="mini-card"><strong>Diet</strong><br>Added more fat to meals</div>
          <div class="mini-card"><strong>Shelter</strong><br>Built sturdier shelters</div>
          <div class="mini-card"><strong>Clothing</strong><br>Made warm clothing from animal furs</div>
          <div class="mini-card"><strong>Fire</strong><br>Used it to stay warm</div>
        </div>
        <p>The last Ice Age lasted about <strong>90,000 years</strong> and ended between about <strong>9000 and 8000 B.C.</strong></p>`,
        remember: "Diet + shelter + clothing + fire helped people survive."
      },
      {
        section: "Teacher Vocabulary",
        title: "Vocabulary 1–5",
        body: `<div class="vocab-list">
          <div class="vocab-row"><strong>Paleolithic</strong><span>relating to the earliest period of the Stone Age</span><span class="tip">Paleo = old stone</span></div>
          <div class="vocab-row"><strong>Nomads</strong><span>people who move from place to place as a group to find food for themselves</span><span class="tip">Move for food</span></div>
          <div class="vocab-row"><strong>Technology</strong><span>an ability gained by the practical use of knowledge</span><span class="tip">Use knowledge</span></div>
          <div class="vocab-row"><strong>Ice Age</strong><span>a time when glaciers covered much of the land</span><span class="tip">Glaciers cover land</span></div>
          <div class="vocab-row"><strong>Method</strong><span>a way of doing something</span><span class="tip">Method = way</span></div>
        </div>`,
        remember: "Paleolithic · Nomads · Technology · Ice Age · Method."
      },
      {
        section: "Teacher Vocabulary",
        title: "Vocabulary 6–10",
        body: `<div class="vocab-list">
          <div class="vocab-row"><strong>Available</strong><span>ready to be used</span><span class="tip">Available = ready</span></div>
          <div class="vocab-row"><strong>Construct</strong><span>to build by putting parts together</span><span class="tip">Parts → build</span></div>
          <div class="vocab-row"><strong>Woolly Mammoth</strong><span>a large, hairy, extinct animal related to modern-day elephants</span><span class="tip">Large and hairy</span></div>
          <div class="vocab-row"><strong>Communicate</strong><span>to share information with someone</span><span class="tip">Share information</span></div>
          <div class="vocab-row"><strong>Constant</strong><span>always happening</span><span class="tip">Always happening</span></div>
        </div>`,
        remember: "Available · Construct · Woolly Mammoth · Communicate · Constant."
      },
      {
        section: "Final Review",
        title: "Do Not Mix These Up",
        body: `<div class="grid two">
          <div class="mini-card"><strong>Stone Age vs. Paleolithic Age</strong><p>The Paleolithic Age was the earliest part of the Stone Age.</p></div>
          <div class="mini-card"><strong>Paleolithic vs. Old Stone Age</strong><p>Two names for the same period.</p></div>
          <div class="mini-card"><strong>Hunting vs. Gathering</strong><p>Animals vs. wild plants and grains.</p></div>
          <div class="mini-card"><strong>Glaciers vs. Land Bridge</strong><p>Thick ice sheets vs. exposed dry land.</p></div>
          <div class="mini-card"><strong>Cold vs. Warm Climate</strong><p>More protection vs. less clothing and shelter.</p></div>
          <div class="mini-card"><strong>Gestures vs. Language</strong><p>Gestures came first; spoken language came later.</p></div>
        </div>`,
        remember: "Compare the meaning, purpose, or time of each idea."
      },
      {
        section: "Final Review",
        title: "Remember These Before the Test",
        body: `<div class="grid two">
          <div class="mini-card gold">✓ Paleolithic = Old Stone Age</div>
          <div class="mini-card gold">✓ About 2.5 million years ago → 8000 B.C.</div>
          <div class="mini-card gold">✓ Nomads moved in bands of 20 or 30</div>
          <div class="mini-card gold">✓ Hunting + gathering = food</div>
          <div class="mini-card gold">✓ Tools, fire, language, and art developed</div>
          <div class="mini-card gold">✓ Fire helped with warmth, light, safety, cooking, and storage</div>
          <div class="mini-card gold">✓ Glaciers lowered ocean levels</div>
          <div class="mini-card gold">✓ Land bridge linked Asia and North America</div>
          <div class="mini-card gold">✓ Altamira 1879 · Lascaux 1940</div>
          <div class="mini-card gold">✓ Diet + shelter + clothing + fire = Ice Age survival</div>
        </div>`,
        remember: "Move → Find food → Make tools → Use fire → Adapt → Survive."
      }
    ];

    const quiz = [
      {d:"Easy", topic:"Paleolithic Age", q:"What is another name for the Paleolithic Age?", o:["New Stone Age","Old Stone Age","Ice Bridge Age","Recorded Age"], a:1, e:"Paleolithic means “old stone,” so it is the Old Stone Age."},
      {d:"Easy", topic:"Dates", q:"About when did the Paleolithic Age begin?", o:["About 100,000 years ago","About 5,500 years ago","About 2.5 million years ago","Around 8000 B.C."], a:2, e:"The Paleolithic Age began about 2.5 million years ago."},
      {d:"Easy", topic:"Dates", q:"Around when did the Paleolithic Age end?", o:["8000 B.C.","1940","1879","100,000 years ago"], a:0, e:"The Paleolithic Age lasted until around 8000 B.C."},
      {d:"Easy", topic:"Vocabulary", q:"Which teacher definition matches “nomads”?", o:["People who make stone tools","People who live only in caves","People who paint animals","People who move from place to place as a group to find food for themselves"], a:3, e:"Nomads moved from place to place as a group to find food."},
      {d:"Easy", topic:"Daily Life", q:"About how many members were usually in a Paleolithic band?", o:["2 or 3","20 or 30","90 or 100","4,500"], a:1, e:"Paleolithic bands usually had about 20 or 30 members."},
      {d:"Easy", topic:"Daily Life", q:"How did Paleolithic people mainly get food?", o:["By hunting and gathering","By using a land bridge","By painting caves","By making shelters"], a:0, e:"Their main food activities were hunting animals and gathering wild plants."},
      {d:"Easy", topic:"Vocabulary", q:"What is “technology” in the teacher’s definition?", o:["A way of life with shared customs","A time when glaciers covered land","A sharp piece of flint","An ability gained by the practical use of knowledge"], a:3, e:"Technology is an ability gained by the practical use of knowledge."},
      {d:"Easy", topic:"Vocabulary", q:"What does “method” mean?", o:["Always happening","Ready to be used","A way of doing something","To share information"], a:2, e:"A method is a way of doing something."},
      {d:"Easy", topic:"Vocabulary", q:"What does “available” mean?", o:["Ready to be used","Covered by glaciers","Made from animal hair","Moving from place to place"], a:0, e:"Available means ready to be used."},
      {d:"Easy", topic:"Vocabulary", q:"What does “construct” mean?", o:["To catch more fish","To build by putting parts together","To pass on knowledge","To add fat to meals"], a:1, e:"Construct means to build by putting parts together."},
      {d:"Easy", topic:"Vocabulary", q:"Which description matches a woolly mammoth?", o:["A sharp stone tool","A group of 20 or 30 people","A thick sheet of ice","A large, hairy, extinct animal related to modern-day elephants"], a:3, e:"That is the teacher’s definition of a woolly mammoth."},
      {d:"Easy", topic:"Vocabulary", q:"What does “communicate” mean?", o:["To build a shelter","To share information with someone","To hunt a large animal","To move southward"], a:1, e:"Communicate means to share information with someone."},
      {d:"Medium", topic:"Vocabulary", q:"The spoken language was constantly growing. What does “constant” mean?", o:["Ready to be used","A way of doing something","Always happening","Relating to the Stone Age"], a:2, e:"Constant means always happening."},
      {d:"Medium", topic:"Group Work", q:"Which task did Paleolithic men perform in the material?", o:["Hunted large animals","Stayed close to camp to gather berries","Looked after children near camp","Made ocean levels fall"], a:0, e:"Men hunted large animals and often traveled far from camp."},
      {d:"Medium", topic:"Group Work", q:"Which task did Paleolithic women perform in the material?", o:["Moved glaciers","Struck iron pyrite","Drove every animal off a cliff","Gathered berries, nuts, and grains near camp"], a:3, e:"Women gathered berries, nuts, and grains near the camp."},
      {d:"Medium", topic:"Tools", q:"What was a Paleolithic hand axe?", o:["A bone needle used to sew hides","A shallow hole with blackened stones","A fishhook with an animal-hair brush","A large piece of flint tied to a wooden pole"], a:3, e:"A hand axe was a large piece of flint tied to a wooden pole."},
      {d:"Medium", topic:"Tools", q:"Which tool helped Paleolithic people catch more fish?", o:["Harpoon","Scraping tool","Bone needle","Hand axe"], a:0, e:"Harpoons and fishhooks increased the number of fish caught."},
      {d:"Medium", topic:"Tools", q:"What did people use bone needles to do?", o:["Lower ocean levels","Make nets and baskets and sew hides","Create sparks from iron pyrite","Move across the land bridge"], a:1, e:"Bone needles were used for nets, baskets, and sewing hides."},
      {d:"Medium", topic:"Fire", q:"Which was NOT listed as a use of fire?", o:["Providing light","Scaring wild animals","Making the ocean level rise","Cooking food"], a:2, e:"The material does not list raising ocean levels as a use of fire."},
      {d:"Medium", topic:"Fire", q:"Why could smoked meat be useful?", o:["It became a sharp tool","It could be stored and did not need to be eaten immediately","It turned into animal hide","It made a land bridge"], a:1, e:"Meat smoked by fire could be stored for later."},
      {d:"Medium", topic:"Fire", q:"Which action could produce fire by friction?", o:["Crushing colored rocks","Moving southward","Tying flint to a pole","Rubbing two pieces of wood together"], a:3, e:"Rubbing wood heated and charred it until it caught fire."},
      {d:"Medium", topic:"Language and Art", q:"Who found famous cave paintings near Altamira, Spain, in 1879?", o:["Maria de Sautuola","Paleolithic hunters","Scientists at Lascaux","A group of nomads"], a:0, e:"Maria de Sautuola discovered the Altamira cave paintings in 1879."},
      {d:"Hard", topic:"Language and Art", q:"Which event happened in 1940?", o:["The Paleolithic Age ended","The most recent Ice Age began","A cave with paintings was discovered near Lascaux","Maria found the Altamira paintings"], a:2, e:"A cave with similar paintings was found near Lascaux in 1940."},
      {d:"Hard", topic:"Language and Art", q:"Which sequence correctly shows how early artists made paint?", o:["Animal hides → flint → sparks","Crush colored rocks → mix with animal fat → apply to rock walls","Glaciers → lower water → dry land","Wood → brush → fishhook"], a:1, e:"Artists mixed crushed colored rocks with animal fat and applied the paint."},
      {d:"Hard", topic:"Ice Age", q:"About when did the most recent Ice Age begin?", o:["About 100,000 years ago","Around 8000 B.C.","About 5,500 years ago","In 1879"], a:0, e:"The most recent Ice Age began about 100,000 years ago."},
      {d:"Hard", topic:"Land Bridge", q:"What happened as glaciers grew larger?", o:["Spoken language stopped changing","People needed no shelter","Ocean water levels became lower","The Paleolithic Age began"], a:2, e:"As glaciers grew, the water level of the oceans was lowered."},
      {d:"Hard", topic:"Land Bridge", q:"A group travels from Asia into North America during the Ice Age. What did they use?", o:["A cave painting","A land bridge","A bone needle","A rock overhang"], a:1, e:"The land bridge acted as a natural highway between Asia and North America."},
      {d:"Hard", topic:"Ice Age Survival", q:"Which plan best matches how humans adapted to the Ice Age?", o:["Use less clothing and avoid fire","Paint only human figures","Build weaker shelters and eat less fat","Add fat to meals, build sturdier shelters, wear warm furs, and use fire"], a:3, e:"Those four changes helped humans survive the cold conditions."},
      {d:"Hard", topic:"Ice Age", q:"Which comparison is correct?", o:["Glaciers were thick ice sheets; the land bridge was exposed dry land","Glaciers were stone tools; the land bridge was a cave","Glaciers were animal hides; the land bridge was a fire method","Glaciers were bands; the land bridge was spoken language"], a:0, e:"Glaciers were ice sheets, while the land bridge was exposed dry land."},
      {d:"Hard", topic:"Cause and Effect", q:"Which cause-and-effect sequence is correct?", o:["Fire → glaciers grew → caves disappeared","Spoken language → ocean levels fell → mammoths built shelters","Glaciers grew → ocean levels fell → dry land connected Asia and North America","Bone needles → Ice Age began → people stopped moving"], a:2, e:"Growing glaciers lowered ocean levels and exposed the land bridge."}
    ];

    let slideIndex = 0;
    let quizIndex = 0;
    let score = 0;
    let answered = false;
    const missedTopics = {};

    const stage = document.getElementById("stage");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const lessonControls = document.getElementById("lessonControls");
    const progressFill = document.getElementById("progressFill");
    const modeBadge = document.getElementById("modeBadge");

    function renderSlide() {
      const slide = slides[slideIndex];
      modeBadge.textContent = slide.section === "Final Review" ? "Final Review" : "Teaching Slides";
      progressFill.style.width = `${((slideIndex + 1) / slides.length) * 100}%`;
      stage.innerHTML = `<article class="card">
        <div class="eyebrow">${slide.section} · Slide ${slideIndex + 1} of ${slides.length}</div>
        <h2>${slide.title}</h2>
        ${slide.body}
        <div class="remember">⭐ Remember<br>${slide.remember}</div>
      </article>`;
      lessonControls.style.display = "grid";
      backBtn.disabled = slideIndex === 0;
      nextBtn.textContent = slideIndex === slides.length - 1 ? "Start Quiz →" : "Next →";
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function startQuiz() {
      lessonControls.style.display = "none";
      quizIndex = 0;
      score = 0;
      answered = false;
      Object.keys(missedTopics).forEach(key => delete missedTopics[key]);
      renderQuestion();
    }

    function renderQuestion() {
      const item = quiz[quizIndex];
      modeBadge.textContent = "30-Question Quiz";
      progressFill.style.width = `${((quizIndex + 1) / quiz.length) * 100}%`;
      const labels = ["A", "B", "C", "D"];
      stage.innerHTML = `<article class="card">
        <div class="quiz-head">
          <div class="difficulty">${item.d}</div>
          <div class="score-pill">Score: ${score}</div>
        </div>
        <div class="eyebrow">Question ${quizIndex + 1} of ${quiz.length}</div>
        <h2 class="question">${item.q}</h2>
        <div class="choices">
          ${item.o.map((option, i) => `<button class="choice" type="button" data-index="${i}"><span class="letter">${labels[i]}</span><span>${option}</span></button>`).join("")}
        </div>
        <div class="feedback" id="feedback" role="status"></div>
        <button class="btn primary quiz-next" id="quizNext" type="button">${quizIndex === quiz.length - 1 ? "See Results →" : "Next Question →"}</button>
      </article>`;

      answered = false;
      stage.querySelectorAll(".choice").forEach(button => {
        button.addEventListener("click", () => answerQuestion(Number(button.dataset.index)));
      });
      document.getElementById("quizNext").addEventListener("click", nextQuestion);
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function answerQuestion(selected) {
      if (answered) return;
      answered = true;
      const item = quiz[quizIndex];
      const buttons = [...stage.querySelectorAll(".choice")];
      const feedback = document.getElementById("feedback");
      buttons.forEach(button => { button.disabled = true; });
      buttons[item.a].classList.add("correct");

      if (selected === item.a) {
        score++;
        feedback.className = "feedback show good";
        feedback.innerHTML = `✅ Correct! <strong>${item.e}</strong>`;
      } else {
        buttons[selected].classList.add("wrong");
        missedTopics[item.topic] = (missedTopics[item.topic] || 0) + 1;
        feedback.className = "feedback show bad";
        const correctLetter = ["A", "B", "C", "D"][item.a];
        feedback.innerHTML = `❌ Incorrect. Correct answer: <strong>${correctLetter}. ${item.o[item.a]}</strong><br>${item.e}`;
      }
      stage.querySelector(".score-pill").textContent = `Score: ${score}`;
      document.getElementById("quizNext").classList.add("show");
    }

    function nextQuestion() {
      if (!answered) return;
      if (quizIndex < quiz.length - 1) {
        quizIndex++;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      modeBadge.textContent = "Quiz Complete";
      progressFill.style.width = "100%";
      const topics = Object.entries(missedTopics)
        .sort((a, b) => b[1] - a[1])
        .map(([topic]) => `<li>${topic}</li>`)
        .join("");
      const review = topics || "<li>Excellent work! Review the Final Review slides to keep the facts fresh.</li>";
      stage.innerHTML = `<article class="card center">
        <div class="eyebrow">Final Score</div>
        <h2>Lesson Complete</h2>
        <div class="result-score">${score}/30</div>
        <div class="review-topics" style="text-align:left">
          <h3>Topics to Review</h3>
          <ul>${review}</ul>
        </div>
        <div class="grid two" style="max-width:760px;margin:22px auto 0;width:100%">
          <button class="btn secondary" id="reviewLesson" type="button">Review Lesson</button>
          <button class="btn primary" id="retryQuiz" type="button">Try Quiz Again</button>
        </div>
        <div class="remember" style="text-align:left">⭐ Remember<br>Move → Find food → Make tools → Use fire → Adapt → Survive.</div>
      </article>`;
      document.getElementById("reviewLesson").addEventListener("click", () => {
        slideIndex = 0;
        renderSlide();
      });
      document.getElementById("retryQuiz").addEventListener("click", startQuiz);
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    backBtn.addEventListener("click", () => {
      if (slideIndex > 0) {
        slideIndex--;
        renderSlide();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (slideIndex < slides.length - 1) {
        slideIndex++;
        renderSlide();
      } else {
        startQuiz();
      }
    });

    restartBtn.addEventListener("click", () => {
      slideIndex = 0;
      renderSlide();
    });

    document.addEventListener("keydown", event => {
      if (lessonControls.style.display === "none") return;
      if (event.key === "ArrowRight") nextBtn.click();
      if (event.key === "ArrowLeft") backBtn.click();
    });

    renderSlide();
  </script>
</body>
</html>
