<script>
const slides=[{"title": "Chapter 5 • Lesson 1 — The Nile River", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">ANCIENT EGYPT AND KUSH • 5000 B.C. TO A.D. 350</div>\n  <div class=\"big\">How does geography influence the way people live?</div>\n  <p>The Nile River was the most important factor in the development of ancient Egypt.</p>\n  <div class=\"flow\"><span>Nile River</span><b>→</b><span>Fertile land</span><b>→</b><span>Farming</span><b>→</b><span>Settlements</span><b>→</b><span>Kingdoms</span></div>\n</div>\n", "remember": "The Nile shaped where people lived, how they farmed, how they traveled, and how Egypt developed."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>The Nile River Valley</b><br>Why people settled there and why the river mattered.</div>\n<div class=\"card\"><b>Protected Land</b><br>Cataracts, deserts, delta marshes, and trade routes.</div>\n<div class=\"card\"><b>People of the River</b><br>Predictable floods, farming, irrigation, shadoof, and papyrus.</div>\n<div class=\"card\"><b>Writing & Uniting Egypt</b><br>Hieroglyphics, kingdoms, Narmer, Memphis, and dynasties.</div>\n</div>\n<div class=\"source-note\"><b>Source note:</b> The teacher-summary section in the prompt contains only “...”. No extra teacher-summary facts were provided, so this tutor uses only the uploaded textbook material.</div>\n", "remember": "Think in four parts: Nile → Protection → Farming → Writing and Government."}, {"title": "Egypt and Kush Along the Nile", "section": "Nile Valley", "body": "\n<p>Two civilizations developed along the Nile River in northeastern Africa:</p>\n<div class=\"cards\">\n<div class=\"card\"><b>Egypt</b><br>Developed in the northern part of the Nile River valley.</div>\n<div class=\"card\"><b>Kush</b><br>Developed in the far southern part of the Nile River valley.</div>\n</div>\n<p>Although Egypt and Kush were unique civilizations, they influenced each other through their long histories.</p>\n", "remember": "Egypt was in the north; Kush was farther south along the Nile."}, {"title": "Why People Settled in the Nile Valley", "section": "Nile Valley", "body": "\n<p>The Nile River valley was ideal for human settlement because of its <b>fertile land</b>.</p>\n<p>As early as <b>5000 B.C.</b>, hunters and gatherers from drier areas of Africa and Southwest Asia began moving into the valley.</p>\n<div class=\"flow\"><span>Fertile land</span><b>→</b><span>People settle</span><b>→</b><span>Farm land</span><b>→</b><span>Build villages</span></div>\n<p>These people became the earliest Egyptians and Kushites.</p>\n", "remember": "Fertile land attracted settlers to the Nile River valley."}, {"title": "Kemet — “Black Land”", "section": "Nile Valley", "body": "\n<p>Early Egyptians lived in the northern region of the Nile River valley.</p>\n<p>They called their land <b>Kemet</b>, which means <b>“black land,”</b> after the dark, rich soil.</p>\n<p>Later, this northern Nile area would be called Egypt.</p>\n", "remember": "Kemet = “black land,” named for the dark, rich soil."}, {"title": "The Gift of the River", "section": "Nile Valley", "body": "\n<p>Egypt has a <b>hot, dry climate</b> and receives little rainfall. Ancient Egyptians depended on the Nile for:</p>\n<div class=\"cards\">\n<div class=\"card\"><b>Daily life</b><br>Drinking and bathing</div>\n<div class=\"card\"><b>Farming</b><br>Water to grow crops</div>\n</div>\n<p>To the Egyptians, the Nile was the <b>“creator of all good.”</b></p>\n", "remember": "Little rainfall made the Nile essential for water and crops."}, {"title": "The Nile — Egypt’s “Lifeblood”", "section": "Nile Valley", "body": "\n<p>The Nile flows north about <b>4,000 miles (6,437 km)</b> from central Africa to the Mediterranean Sea.</p>\n<p>The lesson says it has been called the <b>“lifeblood” of Egypt</b>.</p>\n<div class=\"flow\"><span>Water</span><b>+</b><span>Fertile soil</span><b>+</b><span>Farming</span><b>+</b><span>Travel & trade</span><b>→</b><span>Egyptian civilization</span></div>\n", "remember": "“Lifeblood” means the Nile was essential to Egyptian life and development."}, {"title": "Blue Nile + White Nile", "section": "Nile Valley", "body": "\n<p>At its source, the Nile is two separate rivers:</p>\n<table><tr><th>River</th><th>Source area in the lesson</th></tr>\n<tr><td><b>Blue Nile</b></td><td>Begins in the snowy mountains of eastern Africa</td></tr>\n<tr><td><b>White Nile</b></td><td>Starts in the tropics of central Africa</td></tr></table>\n<p>The two rivers join just south of Egypt to form the Nile River.</p>\n", "remember": "Blue Nile + White Nile → join south of Egypt → Nile River."}, {"title": "Cataracts", "section": "Protected Land", "body": "\n<p>Just south of Egypt, steep cliffs and large boulders form dangerous, fast-moving waters.</p>\n<div class=\"term\"><b>cataract</b><span>a waterfall or rapids in a river</span></div>\n<p>Cataracts made traveling by ship along the Nile difficult.</p>\n", "remember": "Cataract = waterfall or rapids; cataracts made river travel difficult."}, {"title": "The Nile Delta", "section": "Protected Land", "body": "\n<p>Shortly before the Nile reaches the Mediterranean Sea, it splits into many branches that resemble a plant’s bloom.</p>\n<div class=\"term\"><b>delta</b><span>a fan-shaped area of silt near where a river flows into the sea</span></div>\n<p>The waterways form a fan-shaped area of fertile marshland.</p>\n", "remember": "Delta = fan-shaped fertile area near where the river enters the sea."}, {"title": "Deserts Protected Egypt", "section": "Protected Land", "body": "\n<p>The Nile borders some of the world’s largest deserts:</p>\n<ul>\n<li>To the west: the <b>Libyan Desert</b>, part of the Sahara.</li>\n<li>To the east: the <b>Eastern Desert</b>, extending to the Red Sea.</li>\n</ul>\n<p>Ancient Egyptians called these deserts the <b>“Red Land”</b> because of their scorching heat.</p>\n<p>The deserts were not favorable to humans or animals, but they helped keep Egypt isolated from outside invaders.</p>\n", "remember": "The deserts were harsh, but they acted as natural barriers."}, {"title": "How Geography Protected Egypt", "section": "Protected Land", "body": "\n<table><tr><th>Physical feature</th><th>How it helped</th></tr>\n<tr><td><b>Deserts east and west</b></td><td>Helped isolate Egypt from invaders</td></tr>\n<tr><td><b>Cataracts in the south</b></td><td>Prevented enemy ships from attacking</td></tr>\n<tr><td><b>Delta marshes in the north</b></td><td>Helped stop invaders sailing from the Mediterranean Sea</td></tr></table>\n<p>As a result, Egyptian civilization developed peacefully and rarely faced invasion.</p>\n", "remember": "Deserts + cataracts + delta marshes = natural protection."}, {"title": "Trade Was Still Possible", "section": "Protected Land", "body": "\n<p>Egypt was isolated, but not completely cut off from other peoples.</p>\n<ul>\n<li>The <b>Mediterranean Sea</b> to the north provided trade routes.</li>\n<li>The <b>Red Sea</b> to the east also provided trade routes.</li>\n</ul>\n<p>Egyptians used the region’s wind patterns:</p>\n<div class=\"flow\"><span>Nile currents</span><b>→</b><span>boats north</span><b>•</b><span>north winds</span><b>→</b><span>sailboats south</span></div>\n", "remember": "Natural barriers protected Egypt, but seas and winds still allowed travel and trade."}, {"title": "Predictable Floods", "section": "People of the River", "body": "\n<p>Unlike the unpredictable floods of the Tigris and Euphrates, the Nile’s flooding was <b>seasonal and consistent from year to year</b>.</p>\n<p>So Egyptians did not face the same challenge as the Mesopotamians.</p>\n", "remember": "Nile floods were predictable; Mesopotamian floods were less predictable."}, {"title": "The Nile Flood Cycle", "section": "People of the River", "body": "\n<div class=\"timeline\">\n<div><b>Late spring</b><br>Heavy tropical rains in central Africa and melting mountain snow in eastern Africa add water to the Nile.</div>\n<div><b>Middle of summer</b><br>The Nile overflows its banks and floods the land.</div>\n<div><b>Late fall</b><br>Water returns to normal level.</div>\n<div><b>Afterward</b><br>Thick deposits of fertile soil remain.</div>\n</div>\n", "remember": "Flood → water returns → fertile soil remains."}, {"title": "How Did Egyptians Farm?", "section": "People of the River", "body": "\n<p>Farmers planted <b>wheat, barley, and flax seeds</b> while the soil was still wet.</p>\n<p>Over time, they grew enough food to feed themselves and the animals they raised.</p>\n<p>During the dry season, farmers irrigated their crops.</p>\n", "remember": "Wet soil helped planting; irrigation helped crops during the dry season."}, {"title": "Basins and Canals", "section": "People of the River", "body": "\n<p>Egyptian farmers scooped out <b>basins</b>, or bowl-shaped holes in the earth, to store river water.</p>\n<p>They dug <b>canals</b> from the basins to the fields so water could flow to crops.</p>\n<p>Raised areas of soil supported the basin walls.</p>\n<div class=\"flow\"><span>Nile water</span><b>→</b><span>Basins</span><b>→</b><span>Canals</span><b>→</b><span>Fields</span></div>\n", "remember": "Basins stored water; canals carried it to fields."}, {"title": "The Shadoof", "section": "People of the River", "body": "\n<p>Egyptian farmers developed tools to make farming easier.</p>\n<div class=\"term\"><b>shadoof</b><span>a bucket attached to a long pole used to transfer river water to storage basins</span></div>\n<p>The lesson says many Egyptian farmers still use this method today.</p>\n", "remember": "Shadoof = bucket + long pole → lifts river water into storage basins."}, {"title": "Geometry and Farm Boundaries", "section": "People of the River", "body": "\n<p>Floods sometimes washed away boundary markers between fields.</p>\n<p>Farmers used <b>geometry</b> to recalculate where one field began and another ended.</p>\n<div class=\"flow\"><span>Flood removes markers</span><b>→</b><span>Farmers measure again</span><b>→</b><span>Field boundaries restored</span></div>\n", "remember": "Geometry helped Egyptians restore field boundaries after floods."}, {"title": "Papyrus — A Useful Nile Plant", "section": "People of the River", "body": "\n<div class=\"term\"><b>papyrus</b><span>a reed plant that grew wild along the Nile</span></div>\n<p>Egyptians used the long, thin reeds to make:</p>\n<div class=\"cards\">\n<div class=\"card\"><b>Everyday goods</b><br>Rope, sandals, baskets</div>\n<div class=\"card\"><b>Transport & writing</b><br>River rafts and later paper</div>\n</div>\n", "remember": "Papyrus grew along the Nile and was used for many products, including paper."}, {"title": "How Egyptians Made Papyrus Paper", "section": "People of the River", "body": "\n<div class=\"timeline\">\n<div><b>Step 1</b><br>Cut strips from papyrus stalks and soak them in water.</div>\n<div><b>Step 2</b><br>Lay strips side by side and pound them together.</div>\n<div><b>Step 3</b><br>Set them out to dry.</div>\n<div><b>Result</b><br>A large sheet of papyrus for writing.</div>\n</div>\n", "remember": "Cut → soak → lay → pound → dry → writing sheet."}, {"title": "Hieroglyphics", "section": "Writing", "body": "\n<p>Like the Mesopotamians, Egyptians developed their own writing system.</p>\n<div class=\"term\"><b>hieroglyphics</b><span>a writing system made up of a combination of pictures and sound symbols</span></div>\n<p>At first, Egyptian writing used thousands of picture symbols for objects and ideas. Later, Egyptians added symbols that represented sounds.</p>\n", "remember": "Hieroglyphics combined picture symbols and sound symbols."}, {"title": "Who Could Read and Write?", "section": "Writing", "body": "\n<p>Very few ancient Egyptians could read and write hieroglyphics.</p>\n<p>Some Egyptian men attended special schools to prepare for careers as <b>scribes</b> in government or business.</p>\n<p>For daily tasks, scribes developed a simpler script that they wrote or painted on papyrus.</p>\n<p>Hieroglyphics were carved onto stone walls and monuments.</p>\n", "remember": "Scribes used a simpler script for daily work; hieroglyphics also appeared on stone walls and monuments."}, {"title": "Surplus Food Changed Society", "section": "Uniting Egypt", "body": "\n<p>Protected by desert barriers, Egyptian farmers were able to grow <b>surpluses</b>—extra amounts—of food.</p>\n<div class=\"flow\"><span>Food surplus</span><b>→</b><span>Not everyone farms</span><b>→</b><span>Artisans, merchants, traders</span></div>\n<p>As more goods became available, villages along the Nile traded with one another.</p>\n", "remember": "Food surpluses allowed people to specialize in other jobs."}, {"title": "Trade and New Ideas", "section": "Uniting Egypt", "body": "\n<p>Before long, Egyptian caravans carried goods:</p>\n<ul>\n<li>To <b>Nubia</b> to the south</li>\n<li>To <b>Mesopotamia</b> to the northeast</li>\n<li>To other places outside Egypt’s borders</li>\n</ul>\n<p>Along with goods, Egyptian traders learned about the ways of life and governments of other societies.</p>\n", "remember": "Trade moved both goods and ideas."}, {"title": "Why Government Became Necessary", "section": "Uniting Egypt", "body": "\n<p>As farming and trade increased, organized government became more important.</p>\n<p>Government was needed to:</p>\n<ul>\n<li>Oversee construction and repair of <b>irrigation ditches and dams</b></li>\n<li>Develop a process for <b>storing and distributing grain during famines</b></li>\n<li>Settle conflicts over <b>land ownership</b></li>\n</ul>\n", "remember": "Government helped manage water, food, and conflicts."}, {"title": "From Villages to Kingdoms", "section": "Uniting Egypt", "body": "\n<p>Over time, groups of villages merged to form small kingdoms. Each kingdom was ruled by a king.</p>\n<p>Weaker kingdoms eventually fell under the control of stronger ones.</p>\n<p>By <b>4000 B.C.</b>, Egypt was made up of two large kingdoms.</p>\n", "remember": "Villages → small kingdoms → two large kingdoms by 4000 B.C."}, {"title": "Upper Egypt and Lower Egypt", "section": "Uniting Egypt", "body": "\n<table><tr><th>Kingdom</th><th>Location</th></tr>\n<tr><td><b>Upper Egypt</b></td><td>South-central part of the Nile River valley</td></tr>\n<tr><td><b>Lower Egypt</b></td><td>Along the Nile River’s north delta</td></tr></table>\n", "remember": "Upper Egypt was south-central; Lower Egypt was in the north delta."}, {"title": "Narmer Unites Egypt", "section": "Uniting Egypt", "body": "\n<p><b>Narmer</b> was a king of Upper Egypt.</p>\n<div class=\"timeline\">\n<div><b>about 3100 B.C.</b><br>Narmer led his armies north into the delta.</div>\n<div><b>Conquest</b><br>He conquered Lower Egypt.</div>\n<div><b>Marriage</b><br>He married one of Lower Egypt’s princesses.</div>\n<div><b>Result</b><br>He unified the kingdoms. For the first time, all of Egypt was ruled by one king.</div>\n</div>\n", "remember": "Narmer united Upper and Lower Egypt around 3100 B.C."}, {"title": "Memphis — A New Capital", "section": "Uniting Egypt", "body": "\n<p>Narmer established a new capital at <b>Memphis</b>, a city on the border between Upper Egypt and Lower Egypt.</p>\n<p>He governed both parts of Egypt from Memphis.</p>\n<p>Memphis began to flourish as a center of <b>government and culture</b> along the Nile.</p>\n", "remember": "Memphis sat between Upper and Lower Egypt and became Narmer’s capital."}, {"title": "Dynasties", "section": "Uniting Egypt", "body": "\n<p>Narmer’s kingdom lasted long after his death. The right to rule passed from <b>father to son to grandson</b>.</p>\n<div class=\"term\"><b>dynasty</b><span>a line of rulers from one family</span></div>\n<p>When one dynasty died out, another took its place.</p>\n", "remember": "Dynasty = rulers from one family; rule passed through generations."}, {"title": "30 Dynasties and Three Time Periods", "section": "Uniting Egypt", "body": "\n<p>From about <b>3100 B.C. to 332 B.C.</b>, a series of <b>30 dynasties</b> ruled Egypt.</p>\n<p>These dynasties are organized into three time periods:</p>\n<div class=\"three\"><div><b>Old Kingdom</b></div><div><b>Middle Kingdom</b></div><div><b>New Kingdom</b></div></div>\n<p>Throughout these periods, Egypt was usually united under a single ruler and enjoyed stable government.</p>\n", "remember": "30 dynasties → Old Kingdom, Middle Kingdom, New Kingdom."}, {"title": "Keywords — Teacher Vocabulary", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>cataract</b></td><td>a waterfall or rapids in a river</td><td>dangerous fast water</td></tr>\n<tr><td><b>delta</b></td><td>a fan-shaped area of silt near where a river flows into the sea</td><td>fan shape at river mouth</td></tr>\n<tr><td><b>shadoof</b></td><td>a bucket attached to a long pole used to transfer river water to storage basins</td><td>bucket lifts water</td></tr>\n<tr><td><b>papyrus</b></td><td>a reed plant that grew wild along the Nile</td><td>Nile reed plant</td></tr>\n<tr><td><b>hieroglyphics</b></td><td>a writing system made up of a combination of pictures and sound symbols</td><td>pictures + sounds</td></tr>\n<tr><td><b>dynasty</b></td><td>a line of rulers from one family</td><td>family line of rulers</td></tr>\n</table>\n", "remember": "Memorize these 6 teacher vocabulary definitions exactly from the textbook."}, {"title": "Other Bold / Academic Vocabulary", "section": "Vocabulary", "body": "\n<table class=\"small\"><tr><th>Word</th><th>Textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>isolate</b></td><td>to separate from others</td><td>kept apart</td></tr>\n<tr><td><b>unify</b></td><td>to unite; to bring together into one unit</td><td>join into one</td></tr>\n</table>\n", "remember": "Isolate = separate; unify = bring together."}, {"title": "Easy-to-Confuse Points", "section": "Review", "body": "\n<table><tr><th>Do not mix up</th><th>Key difference</th></tr>\n<tr><td><b>Cataract vs. Delta</b></td><td>Cataract = rapids/waterfall in a river. Delta = fan-shaped silt area near the sea.</td></tr>\n<tr><td><b>Shadoof vs. Canal</b></td><td>Shadoof lifts water; canals carry water from basins to fields.</td></tr>\n<tr><td><b>Papyrus vs. Hieroglyphics</b></td><td>Papyrus = plant/material; hieroglyphics = writing system.</td></tr>\n<tr><td><b>Upper vs. Lower Egypt</b></td><td>Upper Egypt = south-central Nile valley; Lower Egypt = north delta.</td></tr>\n<tr><td><b>Isolate vs. Unify</b></td><td>Isolate = separate; unify = bring together.</td></tr>\n</table>\n", "remember": "Always ask: Is it water, land, tool, plant, writing, place, or government?"}, {"title": "Memory Tricks", "section": "Review", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Nile Protection</b><br>Deserts + cataracts + delta marshes</div>\n<div class=\"card\"><b>Flood Cycle</b><br>Late spring water rises → summer flood → late fall normal → fertile soil</div>\n<div class=\"card\"><b>Farm Tools</b><br>Basins store → canals carry → shadoof lifts</div>\n<div class=\"card\"><b>Egypt Unites</b><br>Upper Egypt + Lower Egypt → Narmer → Memphis → dynasty</div>\n</div>\n", "remember": "Use four chains: protection, flood cycle, farming tools, and unification."}, {"title": "Exam Focus", "section": "Review", "body": "\n<div class=\"examgrid\">\n<div><b>Definitions</b><br>cataract, delta, shadoof, papyrus, hieroglyphics, dynasty</div>\n<div><b>Geography</b><br>Nile, deserts, cataracts, delta, Mediterranean Sea, Red Sea</div>\n<div><b>Cause → Effect</b><br>Nile → fertile land → farming → surplus → jobs/trade → government</div>\n<div><b>Comparisons</b><br>Nile floods vs. Mesopotamian floods; Upper vs. Lower Egypt</div>\n<div><b>Dates & Names</b><br>5000, 4000, 3100, 332 B.C.; Narmer; Memphis</div>\n<div><b>Processes</b><br>Flood cycle, papyrus paper, irrigation, unification</div>\n</div>\n", "remember": "Definitions, geography, causes/effects, comparisons, dates, and Narmer are strong test targets."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>NILE</b><br>Water + fertile soil + travel + trade</div>\n<div><b>PROTECTION</b><br>Deserts + cataracts + delta marshes</div>\n<div><b>FLOODS</b><br>Predictable; leave fertile soil</div>\n<div><b>FARMING</b><br>Basins + canals + shadoof</div>\n<div><b>WRITING</b><br>Papyrus + hieroglyphics + scribes</div>\n<div><b>UNITY</b><br>Narmer → Memphis → dynasties</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ Nile “lifeblood” ☐ cataract ☐ delta ☐ predictable floods ☐ shadoof ☐ papyrus ☐ hieroglyphics ☐ Upper vs. Lower Egypt ☐ Narmer ☐ Memphis ☐ dynasty</p>\n", "remember": "If you can explain the six boxes above, you understand the whole lesson."}, {"title": "Complete Teacher Vocabulary Table", "section": "Final Review", "body": "\n<table class=\"small vocaball\"><tr><th>#</th><th>Vocabulary</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td>1</td><td><b>cataract</b></td><td>a waterfall or rapids in a river</td><td>fast rough water</td></tr>\n<tr><td>2</td><td><b>delta</b></td><td>a fan-shaped area of silt near where a river flows into the sea</td><td>fan at the sea</td></tr>\n<tr><td>3</td><td><b>shadoof</b></td><td>a bucket attached to a long pole used to transfer river water to storage basins</td><td>bucket lifts water</td></tr>\n<tr><td>4</td><td><b>papyrus</b></td><td>a reed plant that grew wild along the Nile</td><td>Nile reed</td></tr>\n<tr><td>5</td><td><b>hieroglyphics</b></td><td>a writing system made up of a combination of pictures and sound symbols</td><td>pictures + sounds</td></tr>\n<tr><td>6</td><td><b>dynasty</b></td><td>a line of rulers from one family</td><td>family rulers</td></tr>\n</table>\n", "remember": "These 6 teacher vocabulary words use the textbook definitions exactly."}, {"title": "Lesson Review — Questions 1–4", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\">\n<li><b>Why did the Egyptians need hieroglyphics?</b><br>Hieroglyphics gave Egyptians a writing system. The lesson shows that writing was used by scribes in government and business and was carved on stone walls and monuments.</li>\n<li><b>How does a dynasty work?</b><br>The right to rule passed from <b>father to son to grandson</b>. A dynasty is a line of rulers from one family.</li>\n<li><b>What physical feature is to the east and west of the Nile River? How did this feature help Egyptians?</b><br>Large <b>deserts</b> were on both sides of the Nile. They helped isolate and protect Egypt from outside invaders.</li>\n<li><b>How did the flooding of major rivers affect both the Mesopotamians and the Egyptians?</b><br>Both depended on river flooding for farming, but Mesopotamian floods were unpredictable. Nile floods were seasonal, consistent, and less destructive, leaving fertile soil behind.</li>\n</ol>\n", "remember": "Review 1–4: writing, dynasty, desert protection, and Nile-vs.-Mesopotamia flooding."}, {"title": "Lesson Review — Questions 5–7", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"5\">\n<li><b>What was significant about the joining of the two kingdoms under Narmer?</b><br>For the first time, <b>all of Egypt was ruled by one king</b>. Narmer made Memphis the capital and governed both Upper and Lower Egypt from there.</li>\n<li><b>How did the Nile River help the ancient Egyptians develop as a well-governed civilization?</b><br>The Nile supported farming and food surpluses. As farming and trade grew, government was needed to manage irrigation ditches and dams, store and distribute grain during famines, and settle land conflicts.</li>\n<li><b>Why has the Nile River been described as the “lifeblood” of Egypt? Why was the river essential to the Egyptians?</b><br><b>Short source-based answer:</b> The Nile supplied water for drinking, bathing, and crops. Its floods left fertile soil, and the river also supported travel and trade. Because Egypt had little rainfall, the Nile was essential to daily life and farming.</li>\n</ol>\n", "remember": "For the final review questions, always support your answer with details directly from the lesson."}];

s?", ["Making paper for writing", "Making cataracts", "Creating deserts", "Uniting kingdoms"], 0, "Egyptians used papyrus to make writing material.", "Papyrus"], ["Medium", "Why did organized government become more important?", ["To manage irrigation, grain storage, and land conflicts", "To stop farming", "To remove villages", "To end trade"], 0, "Growing farming and trade required organized government.", "Government"], ["Medium", "What was important about Narmer’s unification?", ["All Egypt was ruled by one king for the first time", "Egypt split into more kingdoms", "Memphis disappeared", "The Nile stopped flooding"], 0, "Narmer brought Upper and Lower Egypt under one king.", "Unification"], ["Hard", "A sailor reaches fast-moving water with steep cliffs and boulders south of Egypt. Which term fits best?", ["delta", "cataract", "papyrus", "dynasty"], 1, "Dangerous rapids or waterfalls are cataracts.", "Scenario: Cataract"], ["Hard", "A farmer needs to lift Nile water into a storage basin. Which tool should be used?", ["hieroglyphics", "shadoof", "delta", "dynasty"], 1, "A shadoof transfers river water into storage basins.", "Scenario: Shadoof"], ["Hard", "Which sequence best matches the Nile flood cycle?", ["Late spring rains/snowmelt → summer overflow → late fall normal level → fertile soil remains", "Summer drought → winter delta → spring dynasty", "Papyrus → cataract → desert → flood", "Lower Egypt → Upper Egypt → no flood"], 0, "The lesson describes that seasonal sequence.", "Flood Cycle"], ["Hard", "Which comparison is correct?", ["Papyrus is a plant/material; hieroglyphics are a writing system", "Papyrus is a writing system; hieroglyphics are a plant", "Both words mean river rapids", "Both words mean family rulers"], 0, "Papyrus and hieroglyphics are different: material vs. writing system.", "Easy-to-Confuse"], ["Hard", "Why did deserts help Egyptian civilization develop peacefully?", ["They helped isolate Egypt from outside invaders", "They supplied most drinking water", "They created papyrus", "They made the Nile flood"], 0, "The deserts acted as protective barriers.", "Protection"], ["Hard", "How did food surpluses change Egyptian society?", ["They allowed some people to work as artisans, merchants, and traders", "They forced everyone to farm", "They ended trade", "They removed the need for government"], 0, "Extra food allowed job specialization.", "Cause & Effect"], ["Hard", "Which sequence best shows how Egypt became more organized?", ["Villages → small kingdoms → two large kingdoms → Narmer unites them", "Dynasty → desert → cataract → papyrus", "Lower Egypt → Mesopotamia → Babylon", "Flood → no farming → no government"], 0, "The lesson shows villages merging into kingdoms before unification.", "Political Development"], ["Hard", "Which statement best explains why the Nile was called Egypt’s “lifeblood”?", ["It supplied water, fertile soil, farming support, travel, and trade", "It was the only writing system", "It was a dynasty", "It was a desert"], 0, "The Nile supported many essential parts of Egyptian life.", "Nile Importance"], ["Hard", "Which statement correctly explains a dynasty?", ["Rule remains in one family, such as father to son to grandson", "Every ruler comes from a different family", "A dynasty is a river tool", "A dynasty is a trade route"], 0, "The lesson shows rule passing through one family.", "Dynasty"], ["Hard", "Which source-based answer best explains how the Nile helped Egypt become well governed?", ["It supported farming and surplus food, while government managed irrigation, grain storage, and land conflicts", "It removed the need for laws and organization", "It stopped all trade", "It made every village independent forever"], 0, "The lesson directly connects farming growth with the need for organized government.", "Government & Nile"]];
let mode='lesson',slide=0,q=0,score=0,answered=false,misses={};
function setBar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function renderLesson(){
 mode='lesson';const s=slides[slide];
 document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;setBar(((slide+1)/slides.length)*100);
 document.getElementById('stage').innerHTML=`<div class="section">${s.section}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember: ${s.remember}</div>`;
 document.getElementById('nav').innerHTML=`<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button><button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button><button class="restart" onclick="restartAll()">↻ Restart</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function nextSlide(){if(slide<slides.length-1){slide++;renderLesson();}else startQuiz();}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){if(confirm('Restart the whole tutor from Slide 1?')){slide=0;q=0;score=0;answered=false;misses={};renderLesson();}}
function startQuiz(){mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();}
function renderQuiz(){
 answered=false;const x=quiz[q],letters=['A','B','C','D'];
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;setBar(((q+1)/quiz.length)*100);
 document.getElementById('stage').innerHTML=`<div class="quizmeta"><span class="difficulty">${x[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div><div class="question">${x[1]}</div><div class="choices">${x[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${letters[i]}.</b> ${c}</button>`).join('')}</div><div id="feedback"></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;window.scrollTo({top:0,behavior:'smooth'});
}
function answer(i){
 if(answered)return;answered=true;const x=quiz[q],correct=x[3],letters=['A','B','C','D'];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('c'+correct).classList.add('correct');
 if(i===correct){score++;document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Correct!<span class="explain">${x[4]}</span></div>`;}
 else{document.getElementById('c'+i).classList.add('wrong');misses[x[5]]=(misses[x[5]]||0)+1;document.getElementById('feedback').innerHTML=`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${letters[correct]}. ${x[2][correct]}</b><span class="explain">${x[4]}</span></div>`;}
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 document.getElementById('nav').innerHTML=`<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function nextQuestion(){if(!answered)return;if(q<quiz.length-1){q++;renderQuiz();}else showResult();}
function restartQuiz(){if(confirm('Restart the quiz and reset the score?')){q=0;score=0;answered=false;misses={};renderQuiz();}}
function backToReview(){slide=slides.length-2;renderLesson();}
function showResult(){
 const pct=Math.round(score/quiz.length*100),topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
 const review=topics.length?topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]} question${x[1]>1?'s':''}</li>`).join(''):'<li><b>Excellent!</b> No missed topics.</li>';
 document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`;setBar(100);
 document.getElementById('stage').innerHTML=`<div class="result"><div class="section">Quiz Result</div><h1>🎉 30-Question Quiz Complete</h1><div class="scorebig">${score} / ${quiz.length}</div><h2>${pct}%</h2><div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Remember: Review missed topics, then try the quiz again.</div></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="next" onclick="restartQuiz()">Try Quiz Again</button><button class="restart" onclick="restartAll()">↻ Restart All</button>`;window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{if(mode==='lesson'&&e.key==='ArrowRight')nextSlide();if(mode==='lesson'&&e.key==='ArrowLeft')prevSlide();});
renderLesson();
</script>
