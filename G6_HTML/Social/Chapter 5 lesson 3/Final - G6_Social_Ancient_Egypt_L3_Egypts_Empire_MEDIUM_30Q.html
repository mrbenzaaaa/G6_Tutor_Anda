<script>
const slides=[{"title": "Lesson 3 — Egypt’s Empire", "section": "Start", "body": "\n<div class=\"hero\">\n  <div class=\"kicker\">ANCIENT EGYPT AND KUSH • LESSON 3</div>\n  <div class=\"big\">Why do civilizations rise and fall?</div>\n  <p>Egypt grew powerful during the Middle and New Kingdoms through conquest, trade, strong rulers, and new ideas. Later, conflict and invasions weakened the empire.</p>\n  <div class=\"flow\"><span>Middle Kingdom</span><b>→</b><span>Hyksos</span><b>→</b><span>New Kingdom</span><b>→</b><span>Expansion</span><b>→</b><span>Decline</span></div>\n</div>\n", "remember": "Follow the rise–fall pattern: strong rulers and trade helped Egypt grow; conflict and invasion weakened it."}, {"title": "What You Must Know", "section": "Start", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Middle Kingdom</b><br>Golden age, conquests, irrigation, trade, arts, Valley of the Kings.</div>\n<div class=\"card\"><b>Hyksos</b><br>Foreign rule, chariots, bronze weapons, Ahmose’s victory.</div>\n<div class=\"card\"><b>New Kingdom</b><br>Hatshepsut, Thutmose III, trade, envoys, empire building.</div>\n<div class=\"card\"><b>Unusual Pharaohs & Decline</b><br>Akhenaton, Tutankhamen, Ramses II, temples, final decline.</div>\n</div>\n<div class=\"source-note\"><b>Source note:</b> The teacher-summary section contains only “...”, so no extra summary facts were added.</div>\n", "remember": "These four areas cover the main exam content."}, {"title": "Middle Kingdom — A Golden Age", "section": "Middle Kingdom", "body": "\n<p>Around <b>2200 B.C.</b>, the rulers in Memphis weakened. Nobles fought for control, and disorder lasted for more than <b>200 years</b>.</p>\n<p>A new dynasty then moved the capital south to <b>Thebes</b> and began the <b>Middle Kingdom</b>, lasting about <b>2055 B.C. to 1650 B.C.</b>.</p>\n", "remember": "Middle Kingdom = about 2055 B.C. to 1650 B.C., with Thebes as the capital."}, {"title": "Why Was the Middle Kingdom a Golden Age?", "section": "Middle Kingdom", "body": "\n<div class=\"flow\"><span>Conquests</span><b>+</b><span>More farmland</span><b>+</b><span>Irrigation</span><b>+</b><span>Trade</span><b>+</b><span>Arts</span><b>→</b><span>Golden Age</span></div>\n<p>Egypt gained new territories, increased crop production, expanded trade, and produced important art and architecture.</p>\n", "remember": "Golden age = expansion, stronger farming, trade, and flourishing arts."}, {"title": "Middle Kingdom Conquests & Improvements", "section": "Middle Kingdom", "body": "\n<p>Egypt conquered new territories:</p>\n<ul>\n<li><b>Nubia</b> to the south</li>\n<li>Expanded northeast into present-day <b>Syria</b></li>\n</ul>\n<p>Conquered peoples paid <b>tribute</b>.</p>\n<p>Pharaohs added farmland, built more irrigation dams and channels, and ordered a canal between the <b>Nile River and the Red Sea</b>.</p>\n", "remember": "Conquests brought tribute; irrigation and canals improved farming and trade."}, {"title": "Trade and the Arts Flourish", "section": "Middle Kingdom", "body": "\n<p>The Nile–Red Sea canal helped Egyptian traders sail through the Red Sea and reach ports along Arabia and East Africa.</p>\n<p>Arts and architecture thrived. Painters decorated tombs and temples; sculptors carved hunting, fishing, and battle scenes.</p>\n<p>Pharaohs were no longer buried in pyramids. Their tombs were cut into limestone cliffs west of the Nile in the <b>Valley of the Kings</b>.</p>\n", "remember": "Middle Kingdom trade and art grew, and royal burials moved to the Valley of the Kings."}, {"title": "The Hyksos Take Control", "section": "Hyksos", "body": "\n<p>During the <b>1600s B.C.</b>, nobles challenged the pharaohs. Civil war divided Egypt.</p>\n<p>The <b>Hyksos</b>, invaders from western Asia, entered Egypt and conquered it.</p>\n<p>They used:</p>\n<ul>\n<li>Horse-drawn chariots</li>\n<li>Bronze weapons</li>\n<li>Methods of warfare unknown to Egyptians</li>\n</ul>\n", "remember": "Civil war weakened Egypt; the Hyksos used new military technology."}, {"title": "Egypt Learns from the Hyksos", "section": "Hyksos", "body": "\n<p>Hyksos kings ruled Egypt for more than <b>100 years</b>.</p>\n<p>Egyptians learned how to:</p>\n<div class=\"flow\"><span>Steer horse-drawn chariots</span><b>+</b><span>Use bronze weapons</span><b>→</b><span>Fight back</span></div>\n<p>Around <b>1550 B.C.</b>, an Egyptian prince named <b>Ahmose</b> formed an army and drove the Hyksos out of Egypt.</p>\n", "remember": "Ahmose used lessons learned from the Hyksos to defeat them."}, {"title": "The New Kingdom", "section": "New Kingdom", "body": "\n<p>Ahmose founded a new dynasty and began the <b>New Kingdom</b>, lasting from about <b>1550 B.C. to 1070 B.C.</b>.</p>\n<p>Egypt prospered through trade, gained more land through conquest, and reached the height of its power.</p>\n<p>Egypt was no longer isolated and benefited from the spread of goods, ideas, and cultures.</p>\n", "remember": "New Kingdom = about 1550 B.C. to 1070 B.C., a time of great power and wider contact."}, {"title": "Hatshepsut — A Woman Pharaoh", "section": "New Kingdom", "body": "\n<p><b>Hatshepsut</b> came to power about <b>1473 B.C.</b>. After her husband died, she made herself pharaoh and ruled for her young nephew.</p>\n<p>Because pharaoh was usually a male title, Hatshepsut dressed in male pharaoh clothing and even wore the traditional false beard.</p>\n", "remember": "Hatshepsut was one of the few women to rule Egypt as pharaoh."}, {"title": "Hatshepsut Promotes Trade", "section": "Trade", "body": "\n<p>Hatshepsut was more interested in promoting <b>trade</b> than starting wars.</p>\n<p>Egyptian traders exchanged beads, metal tools, and weapons for:</p>\n<ul>\n<li>Gold</li>\n<li>Ivory</li>\n<li>Ebony wood</li>\n<li><b>Incense</b></li>\n</ul>\n<div class=\"term\"><b>incense</b><span>a material that produces a pleasant smell when burned</span></div>\n", "remember": "Hatshepsut strengthened Egypt mainly through trade."}, {"title": "Phoenicians, Trade, and Ideas", "section": "Trade", "body": "\n<p>Egypt needed wood because the Nile valley had few trees. Egyptian traders visited the east coast of the Mediterranean Sea, including present-day Lebanon.</p>\n<p>The <b>Phoenicians</b> in that region were called “Phoenicians.” Their alphabet and writing system influenced others.</p>\n<p>Trade routes helped spread both <b>goods and ideas</b>.</p>\n", "remember": "Trade carried ideas as well as products."}, {"title": "Envoys and Political Ties", "section": "Trade & Politics", "body": "\n<p>New Kingdom pharaohs built political ties with nearby kingdoms through treaties and marriage.</p>\n<div class=\"term\"><b>envoy</b><span>a government representative to another country</span></div>\n<p>Pharaohs and other rulers exchanged envoys. The lesson says this marked the first time in history that a group of nations tried working together to reach common goals.</p>\n", "remember": "Envoy = government representative to another country."}, {"title": "Thutmose III Expands Egypt", "section": "Expansion", "body": "\n<p>After Hatshepsut died, her nephew <b>Thutmose III</b> became pharaoh.</p>\n<ul>\n<li>Expanded north to the <b>Euphrates River</b></li>\n<li>Moved south and conquered <b>Nubia</b></li>\n<li>Egyptian armies captured nearly <b>350 cities</b></li>\n</ul>\n<p>Egypt gained gold, copper, ivory, and other valuable goods from conquered peoples.</p>\n", "remember": "Thutmose III greatly expanded the Egyptian Empire."}, {"title": "Slavery During Expansion", "section": "Expansion", "body": "\n<p>As Egypt conquered more areas, slavery became more common.</p>\n<p>Many prisoners of war were captured and enslaved.</p>\n<p>The lesson says enslaved people had some rights, including the right to:</p>\n<ul>\n<li>Own land</li>\n<li>Marry</li>\n<li>Eventually gain freedom</li>\n</ul>\n", "remember": "Expansion brought wealth, but also increased slavery."}, {"title": "Akhenaton Changes Religion", "section": "Unusual Pharaohs", "body": "\n<p><b>Amenhotep IV</b> came to power around <b>1370 B.C.</b> and tried to change Egypt’s religion.</p>\n<p>He introduced worship of <b>Aton</b>, a sun god, as Egypt’s only god.</p>\n<p>He removed opposing priests, took their lands, closed temples, changed his name to <b>Akhenaton</b> (“Spirit of Aton”), and moved the capital to <b>Akhetaton</b>.</p>\n", "remember": "Akhenaton tried to replace worship of many gods with worship of Aton only."}, {"title": "Why Akhenaton’s Changes Failed", "section": "Unusual Pharaohs", "body": "\n<p>Most Egyptians rejected Aton and continued to worship many gods.</p>\n<p>Priests resisted losing power. Discontent spread to army leaders.</p>\n<p>The lesson says Akhenaton, devoted to the new religion, neglected his duties as pharaoh. Egypt lost most of its lands in western Asia.</p>\n", "remember": "Religious conflict and weak leadership hurt Egypt’s power."}, {"title": "Tutankhamen — “King Tut”", "section": "Unusual Pharaohs", "body": "\n<p>When Akhenaton died about <b>1360 B.C.</b>, his <b>10-year-old son Tutankhamen</b> became pharaoh.</p>\n<p>With advice from priests and officials, he quickly restored worship of many gods.</p>\n<p>His rule lasted only <b>nine years</b>.</p>\n<p>Howard Carter discovered Tut’s tomb in <b>1922</b>. The tomb contained Tut’s mummy and many treasures, including a gold mask.</p>\n", "remember": "Tutankhamen restored the old religion; his tomb made him famous."}, {"title": "Ramses II and Recovery", "section": "Recovery", "body": "\n<p>During the <b>1200s B.C.</b>, pharaohs tried to restore Egypt’s greatness.</p>\n<p><b>Ramses II</b> ruled from <b>1279 B.C. to 1213 B.C.</b>.</p>\n<ul>\n<li>Conquered the region of <b>Canaan</b></li>\n<li>Moved north into <b>Syria</b></li>\n<li>Fought the <b>Hittites</b></li>\n<li>After many battles, signed a <b>peace treaty</b> with the Hittite king</li>\n</ul>\n", "remember": "Ramses II combined warfare with diplomacy."}, {"title": "Age of Temples", "section": "Recovery", "body": "\n<p>Ramses II ruled for <b>66 years</b> and also focused on peaceful activities.</p>\n<p>He and other New Kingdom rulers built many temples throughout Egypt. One of the most magnificent was <b>Karnak</b> at Thebes.</p>\n<p>Temples were homes of the deities. Priests and priestesses performed daily rituals there.</p>\n<p>Temples were also important to Egypt’s economy: they hired workers, stored valuables, and served as banks.</p>\n", "remember": "Temples were religious centers and economic centers."}, {"title": "Why Did Egypt Decline?", "section": "Decline", "body": "\n<p>After Ramses II died, Egypt declined.</p>\n<div class=\"flow\"><span>Costly wars</span><b>+</b><span>Invasions</span><b>→</b><span>Loss of territory</span><b>→</b><span>Decline</span></div>\n<ul>\n<li>Enemies from the eastern Mediterranean attacked Egypt.</li>\n<li>By <b>1150 B.C.</b>, Egypt controlled only the Nile delta.</li>\n<li>In the <b>900s B.C.</b>, Libyans conquered Egypt.</li>\n<li>Then Kush took power.</li>\n<li>In <b>670 B.C.</b>, Assyrians from Mesopotamia took over Egypt.</li>\n</ul>\n", "remember": "Egypt declined because of costly wars, invasions, and loss of territory."}, {"title": "Vocabulary + Easy-to-Confuse", "section": "Vocabulary", "body": "\n<table class=\"small\">\n<tr><th>Word</th><th>Exact textbook meaning</th><th>Memory tip</th></tr>\n<tr><td><b>incense</b></td><td>a material that produces a pleasant smell when burned</td><td>pleasant-smelling trade good</td></tr>\n<tr><td><b>envoy</b></td><td>a government representative to another country</td><td>official messenger abroad</td></tr>\n<tr><td><b>acquire</b></td><td>to get possession of something</td><td>get something</td></tr>\n<tr><td><b>authority</b></td><td>the right or power to give orders, make decisions, or control people</td><td>power to command</td></tr>\n<tr><td><b>decline</b></td><td>to become weaker</td><td>grow weaker</td></tr>\n</table>\n", "remember": "Teacher words: incense = trade good; envoy = government representative."}, {"title": "Memory Tricks + Exam Focus", "section": "Review", "body": "\n<div class=\"cards\">\n<div class=\"card\"><b>Middle Kingdom</b><br>Golden Age → trade + arts + irrigation + conquest</div>\n<div class=\"card\"><b>Hyksos</b><br>Chariots + bronze → Egyptians learn → Ahmose wins</div>\n<div class=\"card\"><b>New Kingdom</b><br>Hatshepsut = trade<br>Thutmose III = expansion</div>\n<div class=\"card\"><b>Unusual Pharaohs</b><br>Akhenaton = one god<br>Tut = old religion restored</div>\n</div>\n<p><b>Exam Focus:</b> dates, rulers, causes/effects, Middle vs. New Kingdom, Hyksos technology, Hatshepsut trade, Thutmose III conquests, Akhenaton/Tutankhamen, Ramses II, temples, decline.</p>\n", "remember": "Match each ruler with one key idea."}, {"title": "Final 2-Minute Review", "section": "Final Review", "body": "\n<div class=\"reviewgrid\">\n<div><b>MIDDLE KINGDOM</b><br>Golden age; Thebes; trade, arts, irrigation, conquests.</div>\n<div><b>HYKSOS</b><br>Chariots + bronze weapons; Ahmose drove them out.</div>\n<div><b>HATSHEPSUT</b><br>Trade over war; incense and other luxury goods.</div>\n<div><b>THUTMOSE III</b><br>Expanded empire; nearly 350 cities captured.</div>\n<div><b>AKHENATON & TUT</b><br>One-god reform → old religion restored.</div>\n<div><b>RAMSES II & DECLINE</b><br>War + treaty + temples; later invasions weakened Egypt.</div>\n</div>\n<h3>Remember These Before the Test ✓</h3>\n<p class=\"checkline\">☐ Middle Kingdom ☐ Hyksos ☐ Ahmose ☐ New Kingdom ☐ Hatshepsut ☐ incense ☐ envoy ☐ Thutmose III ☐ Akhenaton ☐ Tutankhamen ☐ Ramses II ☐ Karnak ☐ decline</p>\n", "remember": "If you can explain these six boxes, you know the main story."}, {"title": "Lesson Review — Questions 1–4", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\">\n<li><b>Why would someone want to buy incense?</b><br>Because incense is a material that produces a <b>pleasant smell when burned</b>.</li>\n<li><b>What might have been the duties of an ancient Egyptian envoy?</b><br>An envoy was a <b>government representative to another country</b>. The lesson says rulers exchanged envoys as they built political ties and worked toward common goals.</li>\n<li><b>Discuss two reasons why the Middle Kingdom period was a “golden age” for Egypt.</b><br><b>Sample answer:</b> Egypt expanded its territory and increased trade. Pharaohs also improved irrigation and farmland, and arts and architecture flourished.</li>\n<li><b>Why was the New Kingdom a unique period in ancient Egypt’s history?</b><br>Egypt reached the height of its power, expanded through conquest, prospered through trade, and was no longer isolated from goods, ideas, and cultures.</li>\n</ol>\n", "remember": "Review 1–4 = vocabulary + why Middle Kingdom and New Kingdom were important."}, {"title": "Lesson Review — Questions 5–7", "section": "Lesson Review", "body": "\n<ol class=\"reviewqa\" start=\"5\">\n<li><b>Describe the religious changes brought about by Akhenaton and Tutankhamen.</b><br>Akhenaton tried to make <b>Aton</b> Egypt’s only god. Tutankhamen quickly restored the worship of many deities.</li>\n<li><b>In what ways were temples important to Egypt’s economy?</b><br>Temples hired workers, had workshops and granaries, served as banks, and stored valuable goods such as gold jewelry, fragrant oils, and finely woven textiles.</li>\n<li><b>You are a scribe who works for Queen Hatshepsut. Write a brief report explaining why she is a good pharaoh and deserves the support of the people.</b><br><b>Sample source-based answer:</b> Hatshepsut is a good ruler because she restored trade relations, sent traders to Arabia and East Africa, brought valuable goods into Egypt, increased wealth, and used some of that wealth to build monuments.</li>\n</ol>\n", "remember": "For opinion questions, support the answer with facts directly from the lesson."}]; const quiz=[["Easy", "What is incense?", ["A government official", "A bronze weapon", "A type of temple", "A material that produces a pleasant smell when burned"], 3, "Incense produces a pleasant smell when burned.", "Vocabulary: Incense"], ["Easy", "What is an envoy?", ["A government representative to another country", "A military ruler", "A priest", "A trader only"], 0, "An envoy represents a government in another country.", "Vocabulary: Envoy"], ["Easy", "Where was the Middle Kingdom capital moved?", ["Memphis", "Thebes", "Babylon", "Nineveh"], 1, "The new dynasty moved the capital to Thebes.", "Middle Kingdom"], ["Easy", "Who drove the Hyksos out of Egypt around 1550 B.C.?", ["Akhenaton", "Ramses II", "Tutankhamen", "Ahmose"], 3, "Ahmose formed an army and drove out the Hyksos.", "Hyksos"], ["Easy", "Who was a woman pharaoh?", ["Hatshepsut", "Isis", "Nefertiti", "Tutankhamen"], 0, "Hatshepsut was one of the few women to rule Egypt.", "Hatshepsut"], ["Easy", "Who greatly expanded Egypt and captured nearly 350 cities?", ["Thutmose III", "Ahmose", "Ramses II", "Akhenaton"], 0, "Thutmose III greatly expanded Egypt.", "Thutmose III"], ["Easy", "Which pharaoh tried to make Aton Egypt’s only god?", ["Ramses II", "Tutankhamen", "Akhenaton", "Hatshepsut"], 2, "Akhenaton promoted worship of Aton alone.", "Akhenaton"], ["Easy", "Who restored worship of many gods after Akhenaton?", ["Thutmose III", "Tutankhamen", "Ahmose", "Ramses II"], 1, "Tutankhamen restored the old religion.", "Tutankhamen"], ["Easy", "Who signed a peace treaty with the Hittite king?", ["Ramses II", "Ahmose", "Hatshepsut", "Akhenaton"], 0, "Ramses II signed a peace treaty after many battles.", "Ramses II"], ["Easy", "What does decline mean?", ["To become richer", "To build", "To conquer", "To become weaker"], 3, "Decline means to become weaker.", "Vocabulary: Decline"], ["Medium", "Why was the Middle Kingdom called a golden age?", ["Egypt stopped trading", "No new land was conquered", "Trade, farming improvements, conquests, and arts flourished", "Art and farming declined"], 2, "The lesson links the golden age to growth in several areas.", "Golden Age"], ["Medium", "How did the Hyksos gain an advantage over Egyptians?", ["They had no weapons", "They used only ships", "They used chariots and bronze weapons", "They had pyramids"], 2, "The Hyksos used military methods new to Egyptians.", "Hyksos"], ["Medium", "What did Egyptians learn from the Hyksos?", ["How to build ziggurats", "How to write cuneiform", "How to make papyrus", "How to steer chariots and use bronze weapons"], 3, "Egyptians learned chariot and bronze-weapon technology.", "Hyksos"], ["Medium", "Why did Hatshepsut promote trade?", ["To restore trade relations and bring valuable goods into Egypt", "To stop all contact with other lands", "To weaken Egypt", "To replace temples"], 0, "Hatshepsut focused on rebuilding trade relations.", "Hatshepsut"], ["Medium", "What did Egypt trade for wood products and furniture?", ["Only incense", "Only ivory", "Wheat, paper, gold, copper, tin, and tools", "Only slaves"], 2, "The lesson lists those Egyptian trade goods.", "Trade"], ["Medium", "How did Egypt build political ties with other kingdoms?", ["Only wars", "Only taxes", "By closing borders", "Treaties, marriage, and envoys"], 3, "New Kingdom pharaohs used treaties, marriage, and envoys.", "Envoys"], ["Medium", "What happened under Thutmose III?", ["Egypt lost all foreign lands", "Egypt expanded to the Euphrates and south into Nubia", "The Hyksos returned", "Trade ended"], 1, "Thutmose III greatly expanded Egyptian territory.", "Expansion"], ["Medium", "Why did Akhenaton’s changes weaken Egypt?", ["Everyone supported him", "He expanded trade too much", "He built too many canals", "Many Egyptians rejected Aton, priests resisted, and he neglected duties"], 3, "Religious conflict and neglected leadership weakened Egypt.", "Akhenaton"], ["Medium", "Why is Tutankhamen famous today?", ["His tomb was found with his mummy and treasures", "He ruled for 66 years", "He conquered 350 cities", "He founded the Middle Kingdom"], 0, "Howard Carter let mode='lesson',slide=0,q=0,score=0,answered=false,misses={};
function setBar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function renderLesson(){
 mode='lesson';const s=slides[slide];
 document.getElementById('progress').textContent=`Slide ${slide+1} of ${slides.length}`;setBar((slide+1)/slides.length*100);
 document.getElementById('stage').innerHTML=`<div class="section">${s.section}</div><h1>${s.title}</h1><div class="content">${s.body}</div><div class="remember">⭐ Remember: ${s.remember}</div>`;
 document.getElementById('nav').innerHTML=`<button onclick="prevSlide()" ${slide===0?'disabled':''}>← Back</button><button class="next" onclick="nextSlide()">${slide===slides.length-1?'Start 30-Question Quiz →':'Next →'}</button><button class="restart" onclick="restartAll()">↻ Restart</button>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function nextSlide(){if(slide<slides.length-1){slide++;renderLesson();}else startQuiz();}
function prevSlide(){if(slide>0){slide--;renderLesson();}}
function restartAll(){if(confirm('Restart from Slide 1?')){slide=0;q=0;score=0;answered=false;misses={};renderLesson();}}
function startQuiz(){mode='quiz';q=0;score=0;answered=false;misses={};renderQuiz();}
function renderQuiz(){
 answered=false;const x=quiz[q],L=['A','B','C','D'];
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;setBar((q+1)/quiz.length*100);
 document.getElementById('stage').innerHTML=`<div class="quizmeta"><span class="difficulty">${x[0]}</span><span>Question ${q+1} of ${quiz.length}</span></div><div class="question">${x[1]}</div><div class="choices">${x[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})"><b>${L[i]}.</b> ${c}</button>`).join('')}</div><div id="feedback"></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function answer(i){
 if(answered)return;answered=true;const x=quiz[q],c=x[3],L=['A','B','C','D'];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('c'+c).classList.add('correct');
 if(i===c){score++;document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Correct!<span class="explain">${x[4]}</span></div>`;}
 else{document.getElementById('c'+i).classList.add('wrong');misses[x[5]]=(misses[x[5]]||0)+1;document.getElementById('feedback').innerHTML=`<div class="feedback bad">❌ Incorrect. Correct answer: <b>${L[c]}. ${x[2][c]}</b><span class="explain">${x[4]}</span></div>`;}
 document.getElementById('progress').textContent=`Question ${q+1} of ${quiz.length} • Score ${score}`;
 document.getElementById('nav').innerHTML=`<button class="next" onclick="nextQuestion()">${q===quiz.length-1?'See Final Score →':'Next Question →'}</button><button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>`;
}
function nextQuestion(){if(!answered)return;if(q<quiz.length-1){q++;renderQuiz();}else showResult();}
function restartQuiz(){if(confirm('Restart quiz?')){q=0;score=0;answered=false;misses={};renderQuiz();}}
function backToReview(){slide=slides.length-2;renderLesson();}
function showResult(){
 const pct=Math.round(score/quiz.length*100),topics=Object.entries(misses).sort((a,b)=>b[1]-a[1]);
 const review=topics.length?topics.map(x=>`<li><b>${x[0]}</b> — missed ${x[1]}</li>`).join(''):'<li><b>Excellent!</b> No missed topics.</li>';
 document.getElementById('progress').textContent=`Quiz Complete • ${score}/${quiz.length}`;setBar(100);
 document.getElementById('stage').innerHTML=`<div class="result"><div class="section">Quiz Result</div><h1>🎉 Quiz Complete</h1><div class="scorebig">${score} / ${quiz.length}</div><h2>${pct}%</h2><div class="topics"><h3>Topics to Review</h3><ul>${review}</ul></div><div class="remember">⭐ Remember: Review missed topics, then try again.</div></div>`;
 document.getElementById('nav').innerHTML=`<button onclick="backToReview()">← Lesson Review</button><button class="next" onclick="restartQuiz()">Try Quiz Again</button><button class="restart" onclick="restartAll()">↻ Restart All</button>`;
}
renderLesson();
</script></body></html>
