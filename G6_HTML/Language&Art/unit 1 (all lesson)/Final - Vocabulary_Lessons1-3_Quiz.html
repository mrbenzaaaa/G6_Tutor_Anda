let slides=[],index=-1,score=0,attempted=0,responses={};

function build(){
  DATA.p1.forEach((x,i)=>slides.push({...x,section:'Part 1 — Write the Correct Word',number:i+1,total:DATA.p1.length}));
  DATA.p2.forEach((x,i)=>slides.push({...x,section:'Part 2 — Complete the Sentence',number:i+1,total:DATA.p2.length}));
  DATA.p3.forEach((x,i)=>slides.push({...x,section:'Part 3 — Correct Form / Derivative',number:i+1,total:DATA.p3.length}));
  DATA.p4.forEach((x,i)=>slides.push({...x,section:'Part 4 — Challenge',number:i+1,total:DATA.p4.length}));
  slides.push({type:'summary'});
}
function startScreen(){
 document.getElementById('card').innerHTML=`
 <div class="section-badge">Touchscreen Practice</div>
 <div class="question">Lessons 1–3 — 80 Multiple-Choice Questions</div>
 <div class="sub">Parts 1–4 are now all A / B / C / D. Tap one answer at a time.</div>
 <div class="start-grid">
  <div class="start-card"><h3>Part 1</h3><p>30 meaning / definition questions</p></div>
  <div class="start-card"><h3>Part 2</h3><p>20 complete-the-sentence questions</p></div>
  <div class="start-card"><h3>Part 3</h3><p>20 correct-form / derivative questions</p></div>
  <div class="start-card"><h3>Part 4</h3><p>10 challenge / context questions</p></div>
 </div>
 <div class="remember"><b>⭐ Remember:</b> Read all four choices before you tap an answer.</div>
 <button class="big-start" onclick="begin()">START PRACTICE</button>`;
 document.getElementById('progressBar').style.width='0%';
 document.getElementById('progressText').textContent='Ready to start';
 document.getElementById('scoreText').textContent='Score: 0';
}
function begin(){index=0;score=0;attempted=0;responses={};render();}
function render(){
 const s=slides[index];
 document.getElementById('progressBar').style.width=`${Math.round(index/(slides.length-1)*100)}%`;
 document.getElementById('progressText').textContent=`Question ${Math.min(index+1,slides.length-1)} of ${slides.length-1}`;
 document.getElementById('scoreText').textContent=`Score: ${score} / ${attempted}`;
 if(s.type==='summary') return summary();
 const key='q'+index,saved=responses[key];
 const choices=s.choices.map((c,i)=>{
   let cls='choice';
   if(saved){if(i===s.correct)cls+=' correct';else if(i===saved.choice)cls+=' wrong';}
   return `<button class="${cls}" onclick="choose(${i})" ${saved?'disabled':''}><b>${'ABCD'[i]}.</b> ${c}</button>`;
 }).join('');
 document.getElementById('card').innerHTML=`
 <div class="section-badge">${s.section}</div>
 <div class="qno">Question ${s.number} of ${s.total}</div>
 <div class="question">${s.q}</div>
 <div class="choices">${choices}</div>
 <div class="feedback ${saved?(saved.correct?'good':'bad'):''}">${saved?(saved.correct?('✅ Correct! '+s.exp):('❌ Incorrect.<br><br><b>Why your answer is wrong:</b> '+((s.wrong_exps&&s.wrong_exps[saved.choice])?s.wrong_exps[saved.choice]:'This choice does not match the meaning or grammar needed here.')+'<br><br><b>Why the correct answer is right:</b> '+s.exp)):''}</div>
 <div class="remember"><b>⭐ Remember:</b> Use the meaning, sentence clue, and grammar form together.</div>
 <div class="controls">
  <button class="nav secondary" onclick="prev()">← Back</button>
  <button class="nav primary" onclick="next()">Next →</button>
  <button class="nav restart" onclick="restart()">Restart</button>
 </div>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function choose(i){
 const s=slides[index],key='q'+index;
 if(responses[key])return;
 const ok=i===s.correct;
 responses[key]={choice:i,correct:ok};
 attempted++;if(ok)score++;
 render();
}
function next(){if(index<slides.length-1){index++;render();}}
function prev(){if(index>0){index--;render();}}
function restart(){if(confirm('Restart the whole practice?')){index=-1;score=0;attempted=0;responses={};startScreen();}}
function summary(){
 const pct=attempted?Math.round(score/attempted*100):0;
 document.getElementById('card').innerHTML=`
 <div class="section-badge">Results</div>
 <div class="question">Practice Complete 🎉</div>

  <div class="scorebox"><div class="num">${score}</div><div>Correct</div></div>

}
