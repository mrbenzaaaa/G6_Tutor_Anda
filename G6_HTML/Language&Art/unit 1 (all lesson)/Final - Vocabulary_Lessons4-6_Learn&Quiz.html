<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vocabulary Lessons 4-6 - Slide Tutor and Quiz</title>
  <style>
    :root {
      --navy: #173766;
      --ink: #17233a;
      --muted: #5f6c82;
      --paper: #ffffff;
      --bg: #edf4ff;
      --blue: #1877d2;
      --blue-soft: #e9f4ff;
      --teal: #07988b;
      --teal-soft: #e7f8f4;
      --purple: #7a3dcb;
      --purple-soft: #f2eaff;
      --gold: #f5b82e;
      --good: #147a51;
      --good-soft: #e4f7ee;
      --bad: #bd3434;
      --bad-soft: #fff0f0;
      --shadow: 0 18px 50px rgba(23, 55, 102, .14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(24,119,210,.15), transparent 26%),
        radial-gradient(circle at 92% 84%, rgba(122,61,203,.14), transparent 28%),
        var(--bg);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      min-height: 64px;
      padding: 10px max(16px, env(safe-area-inset-left));
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid rgba(23,55,102,.12);
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(130px, 2fr) auto;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 5;
    }

    .brand { font-weight: 900; color: var(--navy); letter-spacing: .01em; }
    .brand small { display: block; color: var(--muted); font-weight: 700; font-size: .72rem; margin-top: 2px; }

    .progress-track {
      height: 11px;
      background: #dce6f5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--teal), var(--purple));
      transition: width .25s ease;
    }

    .counter {
      color: var(--navy);
      font-weight: 850;
      min-width: 78px;
      text-align: right;
    }

    main {
      min-height: 0;
      padding: clamp(12px, 2vw, 24px);
      overflow: hidden;
    }

    .slide {
      display: none;
      height: 100%;
      max-width: 1180px;
      margin: 0 auto;
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(23,55,102,.1);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      animation: appear .25s ease both;
    }

    .slide.active { display: block; }
    .slide-inner { padding: clamp(22px, 4vw, 48px); min-height: 100%; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--navy);
      background: #e7effd;
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(2.15rem, 6vw, 4.8rem); line-height: .98; color: var(--navy); margin: 22px 0 18px; }
    h2 { font-size: clamp(1.75rem, 4vw, 3rem); line-height: 1.08; color: var(--navy); margin-bottom: 12px; }
    h3 { font-size: 1.15rem; }
    .lead { font-size: clamp(1.05rem, 2.1vw, 1.4rem); line-height: 1.55; color: #44526a; max-width: 820px; }

    .hero {
      min-height: 100%;
      display: grid;
      align-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "ABC";
      position: absolute;
      right: -18px;
      bottom: -28px;
      font-weight: 950;
      font-size: clamp(7rem, 20vw, 15rem);
      color: rgba(24,119,210,.07);
      letter-spacing: -.08em;
      pointer-events: none;
    }

    .lesson-ribbon {
      border-left: 8px solid var(--accent);
      background: var(--soft);
      padding: 16px 18px;
      border-radius: 0 16px 16px 0;
      margin: 20px 0 24px;
      color: var(--navy);
    }

    .lesson-ribbon strong { display: block; font-size: 1.18rem; }
    .lesson-ribbon span { color: var(--muted); }

    .table-wrap { overflow-x: auto; border-radius: 18px; border: 1px solid #dfe7f2; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; background: white; }
    th {
      color: white;
      background: var(--accent);
      text-align: left;
      padding: 14px 16px;
      font-size: .86rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    td { padding: 13px 16px; border-bottom: 1px solid #e8edf4; vertical-align: top; line-height: 1.42; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: var(--soft); }
    .word { font-size: 1.1rem; font-weight: 900; color: var(--accent); }
    .meanings div + div, .examples div + div { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccd7e5; }
    .examples { color: #435067; }

    .remember {
      margin-top: 18px;
      padding: 16px 18px;
      border: 2px solid #f3cf6c;
      background: #fff9df;
      border-radius: 16px;
      color: #5c4912;
      font-weight: 760;
      line-height: 1.5;
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    .review-card { border-radius: 18px; padding: 18px; background: var(--soft); border-top: 6px solid var(--accent); }
    .review-card h3 { color: var(--accent); margin-bottom: 13px; }
    .review-line { display: grid; grid-template-columns: 105px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(23,55,102,.1); }
    .review-line:last-child { border-bottom: 0; }
    .review-line b { color: var(--accent); }
    .review-line span { color: #44526a; }

    .quiz-intro {
      min-height: 100%;
      display: grid;
      align-content: center;
      text-align: center;
      justify-items: center;
    }
    .quiz-badge { font-size: 3.6rem; margin-bottom: 10px; }
    .quiz-intro .lead { max-width: 700px; }
    .mini-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
    .mini-stats span { background: #edf3fb; color: var(--navy); padding: 10px 14px; border-radius: 12px; font-weight: 850; }

    .question-wrap { max-width: 870px; margin: 0 auto; }
    .question-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; color: var(--muted); font-weight: 800; }
    .question-text { font-size: clamp(1.45rem, 3vw, 2.25rem); line-height: 1.25; color: var(--navy); margin-bottom: 24px; }
    .answers { display: grid; gap: 12px; }
    .answer {
      width: 100%;
      border: 2px solid #dbe4f1;
      background: #fff;
      border-radius: 16px;
      padding: 15px 17px;
      text-align: left;
      color: var(--ink);
      font-weight: 760;
      line-height: 1.35;
      cursor: pointer;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      align-items: center;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      touch-action: manipulation;
    }
    .answer:hover { transform: translateY(-1px); border-color: #9ab9e4; }
    .answer:disabled { cursor: default; transform: none; opacity: 1; }
    .choice-letter { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #edf3fb; color: var(--navy); font-weight: 950; }
    .answer.correct { border-color: var(--good); background: var(--good-soft); color: #0c6040; }
    .answer.correct .choice-letter { background: var(--good); color: white; }
    .answer.wrong { border-color: var(--bad); background: var(--bad-soft); color: #8d2222; }
    .answer.wrong .choice-letter { background: var(--bad); color: white; }

    .feedback { display: none; margin-top: 18px; padding: 16px 18px; border-radius: 16px; line-height: 1.5; font-weight: 700; }
    .feedback.show { display: block; }
    .feedback.good { color: #0c6040; background: var(--good-soft); border-left: 6px solid var(--good); }
    .feedback.bad { color: #842626; background: var(--bad-soft); border-left: 6px solid var(--bad); }

    .result { min-height: 100%; display: grid; align-content: center; justify-items: center; text-align: center; }
    .score-ring {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--teal) var(--score-angle, 0deg), #dfe8f3 0);
      margin: 16px 0 24px;
      position: relative;
    }
    .score-ring::after { content: ""; position: absolute; inset: 15px; background: white; border-radius: 50%; }
    .score-number { position: relative; z-index: 1; font-size: 2.8rem; font-weight: 950; color: var(--navy); }
    .score-number small { font-size: 1rem; color: var(--muted); display: block; }
    .result-breakdown { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 8px 0 18px; }
    .result-breakdown span { padding: 9px 12px; border-radius: 10px; background: #eef3fa; color: var(--navy); font-weight: 800; }

    .action {
      border: 0;
      border-radius: 14px;
      background: var(--navy);
      color: white;
      padding: 13px 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(23,55,102,.18);
      touch-action: manipulation;
    }
    .action.secondary { background: white; color: var(--navy); border: 2px solid #cad7e9; box-shadow: none; }

    footer {
      min-height: 76px;
      padding: 10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.95);
      border-top: 1px solid rgba(23,55,102,.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .nav-group { display: flex; gap: 10px; }
    .nav-btn {
      min-width: 112px;
      min-height: 48px;
      border: 2px solid #cbd8e9;
      border-radius: 14px;
      background: white;
      color: var(--navy);
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    .nav-btn.primary { background: var(--navy); color: white; border-color: var(--navy); }
    .nav-btn:disabled { opacity: .42; cursor: default; }
    .score-pill { background: #e7f7f2; color: #0b715d; border-radius: 999px; padding: 10px 14px; font-weight: 900; }

    .lesson4 { --accent: var(--blue); --soft: var(--blue-soft); }
    .lesson5 { --accent: var(--teal); --soft: var(--teal-soft); }
    .lesson6 { --accent: var(--purple); --soft: var(--purple-soft); }

    @media (max-width: 820px) {
      .topbar { grid-template-columns: 1fr auto; }
      .progress-track { grid-column: 1 / -1; grid-row: 2; }
      .review-grid { grid-template-columns: 1fr; }
      .slide-inner { padding: 22px 18px; }
      main { padding: 10px; }
      .review-line { grid-template-columns: 100px 1fr; }
    }

    @media (max-width: 560px) {
      .brand small { display: none; }
      .topbar { min-height: 70px; gap: 8px; }
      footer { min-height: 70px; }
      .nav-btn { min-width: 88px; padding: 10px 12px; }
      .score-pill { font-size: .85rem; padding: 8px 10px; }
      .question-meta { font-size: .85rem; }
      .slide { border-radius: 18px; }
      h1 { font-size: 2.35rem; }
    }

    @media print {
      body { overflow: visible; background: white; }
      .app { display: block; }
      .topbar, footer { display: none; }
      main { padding: 0; overflow: visible; }
      .slide { display: block !important; height: auto; min-height: 100vh; box-shadow: none; border: 0; border-radius: 0; page-break-after: always; overflow: visible; }
      .answer { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Vocabulary for Achievement<small>Lessons 4-6 | English Slide Tutor</small></div>
      <div class="progress-track" aria-label="Lesson progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="counter" id="counter">1 / 37</div>
    </header>

    <main id="deck" aria-live="polite"></main>

    <footer>
      <div class="nav-group">
        <button class="nav-btn" id="backBtn" type="button">&#8592; Back</button>
        <button class="nav-btn primary" id="nextBtn" type="button">Next &#8594;</button>
      </div>
      <div class="score-pill" id="scorePill">Score: 0 / 0</div>
      <button class="nav-btn" id="restartBtn" type="button">Restart</button>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var lessons = [
        {
          number: 4,
          className: "lesson4",
          subtitle: "Honesty, Fairness, and Openness",
          remember: "Think about truth and fairness: frank and genuine are honest; impartial is fair; reliable can be trusted; plagiarize and fabricate are dishonest actions.",
          words: [
            { word: "bluff", meanings: ["To fool or deceive; to mislead", "To try to frighten with false threats"], examples: ["Posing as a general, the man bluffed his way past the security guard.", "Amy knew her dad was bluffing when he threatened to \"lock her in the dungeon\" for not doing the dishes."] },
            { word: "fabricate", meanings: ["To invent in order to deceive", "To make or manufacture"], examples: ["I watched in horror as my friend fabricated a story about why we were late.", "Steel is fabricated from iron and carbon."] },
            { word: "frank", meanings: ["Completely honest"], examples: ["It can be hard for parents and children to have frank discussions."] },
            { word: "genuine", meanings: ["Real; not copied or fake", "Sincere; honest"], examples: ["Hidden among the junk in the attic was a genuine Picasso painting.", "Her request that we stay for dinner seemed genuine, so we accepted."] },
            { word: "impartial", meanings: ["Fair; not favoring one side over another"], examples: ["The jury was instructed to weigh the facts in an impartial manner."] },
            { word: "integrity", meanings: ["Strong moral character; the state of sticking strictly to one's morals", "Wholeness; soundness"], examples: ["A person of integrity does not cheat on exams.", "Luckily, the hurricane had not damaged the integrity of the house."] },
            { word: "obvious", meanings: ["Easy to see; clear; apparent"], examples: ["The frown on Melinda's face made it obvious that she was not happy."] },
            { word: "plagiarize", meanings: ["To copy the words or ideas of another person and claim they are your own"], examples: ["Don't plagiarize by copying whole paragraphs from a book or an article."] },
            { word: "reliable", meanings: ["Dependable; able to be trusted"], examples: ["My e-mail server is not always reliable, so I sometimes miss messages."] },
            { word: "suppress", meanings: ["To prevent something from being published or known", "To end by force or effort"], examples: ["The books of Boris Pasternak were suppressed in the Soviet Union, but published in the United States.", "Raisa wanted to look interested, so she suppressed her urge to yawn."] }
          ]
        },
        {
          number: 5,
          className: "lesson5",
          subtitle: "Amounts, Large and Small",
          remember: "Sort the words by amount: ample means plenty; meager means less than enough; sparse means far apart; extensive is large; comprehensive includes everything important.",
          words: [
            { word: "accumulate", meanings: ["To pile up or collect"], examples: ["For years, my grandmother accumulated old newspapers in the attic."] },
            { word: "ample", meanings: ["More than enough; plenty"], examples: ["\"These shoes have ample room for growth,\" said the clerk."] },
            { word: "barren", meanings: ["Not capable of producing plants or crops; unproductive", "Empty"], examples: ["The barren desert land had no trees or shrubs.", "The proposals were barren of any new ideas."] },
            { word: "comprehensive", meanings: ["Complete; including everything or the most important things", "Showing extensive or thorough understanding"], examples: ["The principal made one comprehensive list of all the students in the school.", "After many years of study, his knowledge of the Civil War was comprehensive."] },
            { word: "extensive", meanings: ["Large; far-reaching"], examples: ["The museum had an extensive collection of ancient pottery."] },
            { word: "meager", meanings: ["Less than enough; a small amount"], examples: ["The library's low budget resulted in a meager supply of books."] },
            { word: "pervasive", meanings: ["Found throughout; present all around"], examples: ["A pervasive odor of bread told us that Mom was baking."] },
            { word: "sparse", meanings: ["Occurring or growing far apart; not thick or dense; scattered"], examples: ["In some deserts, plant life is very sparse."] },
            { word: "surpass", meanings: ["To be better than expected"], examples: ["This year's wheat crop surpassed last year's by two million bushels."] },
            { word: "trifle", meanings: ["Something of little importance", "A very small amount", "To talk or act jokingly; to play around with"], examples: ["Please don't thank me for that gift - it's just a trifle!", "Just a trifle of spice upsets my stomach.", "A rattlesnake is not something to trifle with."] }
          ]
        },
        {
          number: 6,
          className: "lesson6",
          subtitle: "Agreement and Disagreement",
          remember: "Agreement words include accord, consent, pact, and rapport. Disagreement can create friction or a rift. People negotiate to reach agreement and corroborate to confirm with evidence.",
          words: [
            { word: "accord", meanings: ["To give or grant", "Agreement; harmony", "A formal agreement or settlement"], examples: ["Citizens are accorded certain rights by the Constitution.", "His ideas are in accord with mine.", "The strikers and their employers reached an accord."] },
            { word: "consent", meanings: ["Agreement, acceptance, or permission given", "To agree to; to go along with"], examples: ["Most schools require written consent from a parent or guardian before they allow students to go on a field trip.", "I consented to having my picture appear in the paper."] },
            { word: "contrary", meanings: ["Opposite or opposed to; completely different", "Behaving stubbornly and in opposition to others"], examples: ["Contrary to their reputation, most bats are gentle creatures.", "Three-year-olds often become contrary when it is time to take a nap."] },
            { word: "corroborate", meanings: ["To support with new facts or evidence; to confirm"], examples: ["Five additional experiments corroborated the original finding."] },
            { word: "friction", meanings: ["Conflict or tension caused by a disagreement or clash"], examples: ["Unkind remarks can cause friction between even the best of friends."] },
            { word: "insolent", meanings: ["Rude; disrespectfully bold; insulting"], examples: ["In an insolent gesture, the rebel refused to bow to the Emperor."] },
            { word: "negotiate", meanings: ["To discuss something in an attempt to reach agreement", "To accomplish successfully"], examples: ["The United States helped negotiate a peace treaty in the Middle East.", "The driver negotiated a difficult turn on the racetrack."] },
            { word: "pact", meanings: ["A formal agreement; treaty"], examples: ["The pact between the two countries has been in effect for five years."] },
            { word: "rapport", meanings: ["A relationship of shared trust and understanding"], examples: ["As the semester progressed, students developed a warm rapport with their teacher."] },
            { word: "rift", meanings: ["A break in friendly relations; a disagreement"], examples: ["In the 1800s, the issue of slavery caused a rift between the northern and southern states."] }
          ]
        }
      ];

      var questions = [
        { lesson: 4, q: "Which word means 'to fool or deceive; to mislead'?", options: ["bluff", "frank", "reliable", "obvious"], answer: 0, explain: "Bluff means to fool or deceive, or to mislead." },
        { lesson: 4, q: "Mia invented a false story about why she was late. Which word fits?", options: ["suppress", "fabricate", "plagiarize", "accord"], answer: 1, explain: "Fabricate can mean to invent in order to deceive." },
        { lesson: 4, q: "A completely honest discussion is a _____ discussion.", options: ["contrary", "meager", "frank", "sparse"], answer: 2, explain: "Frank means completely honest." },
        { lesson: 4, q: "Which word means 'real; not copied or fake'?", options: ["impartial", "obvious", "reliable", "genuine"], answer: 3, explain: "Genuine means real, not copied or fake. It can also mean sincere or honest." },
        { lesson: 4, q: "A judge who does not favor either side is _____.", options: ["impartial", "insolent", "pervasive", "barren"], answer: 0, explain: "Impartial means fair and not favoring one side over another." },
        { lesson: 4, q: "Which word describes strong moral character and sticking to one's morals?", options: ["rapport", "integrity", "friction", "consent"], answer: 1, explain: "Integrity means strong moral character and sticking strictly to one's morals." },
        { lesson: 4, q: "The answer was easy to see and clear. It was _____.", options: ["genuine", "reliable", "obvious", "ample"], answer: 2, explain: "Obvious means easy to see, clear, or apparent." },
        { lesson: 4, q: "What does plagiarize mean?", options: ["To end something by force", "To make or manufacture", "To give permission", "To copy another person's words or ideas and claim they are your own"], answer: 3, explain: "Plagiarize means copying another person's words or ideas and claiming they are your own." },
        { lesson: 4, q: "Which word means 'dependable; able to be trusted'?", options: ["reliable", "contrary", "extensive", "frank"], answer: 0, explain: "Reliable means dependable and able to be trusted." },
        { lesson: 4, q: "Raisa held back her urge to yawn. She tried to _____ it.", options: ["surpass", "suppress", "accumulate", "corroborate"], answer: 1, explain: "Suppress can mean to end or hold back something by force or effort." },

        { lesson: 5, q: "For years, the newspapers piled up in the attic. They began to _____.", options: ["negotiate", "consent", "accumulate", "plagiarize"], answer: 2, explain: "Accumulate means to pile up or collect." },
        { lesson: 5, q: "Which word means 'more than enough; plenty'?", options: ["meager", "sparse", "barren", "ample"], answer: 3, explain: "Ample means more than enough or plenty." },
        { lesson: 5, q: "Land that cannot produce plants or crops is _____.", options: ["barren", "genuine", "frank", "reliable"], answer: 0, explain: "Barren means not capable of producing plants or crops; it can also mean empty." },
        { lesson: 5, q: "Which word means 'complete; including everything or the most important things'?", options: ["pervasive", "comprehensive", "contrary", "obvious"], answer: 1, explain: "Comprehensive means complete and including everything or the most important things." },
        { lesson: 5, q: "The museum had a large, far-reaching collection. It was _____.", options: ["impartial", "meager", "extensive", "insolent"], answer: 2, explain: "Extensive means large or far-reaching." },
        { lesson: 5, q: "A supply that is less than enough is _____.", options: ["ample", "pervasive", "comprehensive", "meager"], answer: 3, explain: "Meager means less than enough or a small amount." },
        { lesson: 5, q: "A smell that is present all around is _____.", options: ["pervasive", "sparse", "barren", "frank"], answer: 0, explain: "Pervasive means found throughout or present all around." },
        { lesson: 5, q: "Plants growing far apart and not densely are _____.", options: ["ample", "sparse", "extensive", "genuine"], answer: 1, explain: "Sparse means occurring or growing far apart, not thick or dense, or scattered." },
        { lesson: 5, q: "Which word means 'to be better than expected'?", options: ["trifle", "accumulate", "surpass", "suppress"], answer: 2, explain: "Surpass means to be better than expected." },
        { lesson: 5, q: "Which word can mean 'something of little importance' or 'a very small amount'?", options: ["accord", "rift", "pact", "trifle"], answer: 3, explain: "Trifle can mean something unimportant or a very small amount." },

        { lesson: 6, q: "Which word can mean agreement, harmony, or a formal settlement?", options: ["accord", "friction", "rift", "contrary"], answer: 0, explain: "Accord can mean agreement or harmony, and it can also mean a formal agreement or settlement." },
        { lesson: 6, q: "Written permission from a parent is called _____.", options: ["rapport", "consent", "integrity", "trifle"], answer: 1, explain: "Consent means agreement, acceptance, or permission given." },
        { lesson: 6, q: "Which word means 'opposite or opposed to; completely different'?", options: ["reliable", "impartial", "contrary", "comprehensive"], answer: 2, explain: "Contrary means opposite or opposed to, or completely different." },
        { lesson: 6, q: "New experiments supported and confirmed the first finding. They _____ it.", options: ["suppressed", "fabricated", "surpassed", "corroborated"], answer: 3, explain: "Corroborate means to support with new facts or evidence, or to confirm." },
        { lesson: 6, q: "What word means conflict or tension caused by a disagreement?", options: ["friction", "rapport", "consent", "accord"], answer: 0, explain: "Friction is conflict or tension caused by a disagreement or clash." },
        { lesson: 6, q: "A rude, disrespectfully bold, insulting gesture is _____.", options: ["genuine", "insolent", "obvious", "frank"], answer: 1, explain: "Insolent means rude, disrespectfully bold, or insulting." },
        { lesson: 6, q: "People discuss terms to reach an agreement. They _____.", options: ["plagiarize", "accumulate", "negotiate", "suppress"], answer: 2, explain: "Negotiate means to discuss something in an attempt to reach agreement." },
        { lesson: 6, q: "A formal agreement or treaty is a _____.", options: ["trifle", "rift", "rapport", "pact"], answer: 3, explain: "A pact is a formal agreement or treaty." },
        { lesson: 6, q: "Students and their teacher share trust and understanding. They have good _____.", options: ["rapport", "friction", "consent", "integrity"], answer: 0, explain: "Rapport is a relationship of shared trust and understanding." },
        { lesson: 6, q: "Which word means a break in friendly relations or a disagreement?", options: ["accord", "rift", "consent", "rapport"], answer: 1, explain: "A rift is a break in friendly relations or a disagreement." }
      ];

      var deck = document.getElementById("deck");
      var backBtn = document.getElementById("backBtn");
      var nextBtn = document.getElementById("nextBtn");
      var restartBtn = document.getElementById("restartBtn");
      var counter = document.getElementById("counter");
      var progressFill = document.getElementById("progressFill");
      var scorePill = document.getElementById("scorePill");
      var current = 0;
      var score = 0;
      var answeredCount = 0;
      var answers = [];
      var slideTypes = [];

      function esc(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;");
      }

      function addSlide(html, type) {
        var section = document.createElement("section");
        section.className = "slide";
        section.innerHTML = html;
        deck.appendChild(section);
        slideTypes.push(type || "study");
      }

      function buildIntro() {
        addSlide('<div class="slide-inner hero">' +
          '<span class="eyebrow">Grade 6 English Vocabulary</span>' +
          '<h1>Vocabulary<br>Lessons 4-6</h1>' +
          '<p class="lead">Learn 30 words with their source meanings and examples. Review each lesson, complete the Quick Review, and then take the 30-question quiz.</p>' +
          '<div class="mini-stats"><span>3 lessons</span><span>30 words</span><span>30 quiz questions</span></div>' +
          '<div class="remember">&#11088; Remember: Read the meaning first. Then connect the word to the example.</div>' +
          '</div>', "study");
      }

      function buildLesson(lesson) {
        var rows = "";
        var i;
        for (i = 0; i < lesson.words.length; i += 1) {
          var item = lesson.words[i];
          var meanings = "";
          var examples = "";
          var j;
          for (j = 0; j < item.meanings.length; j += 1) {
            meanings += "<div>" + esc(item.meanings[j]) + "</div>";
          }
          for (j = 0; j < item.examples.length; j += 1) {
            examples += "<div><b>Example:</b> " + esc(item.examples[j]) + "</div>";
          }
          rows += '<tr><td class="word">' + esc(item.word) + '</td><td class="meanings">' + meanings + '</td><td class="examples">' + examples + '</td></tr>';
        }
        addSlide('<div class="slide-inner ' + lesson.className + '">' +
          '<span class="eyebrow">Lesson ' + lesson.number + '</span>' +
          '<h2>Lesson ' + lesson.number + ' - Words About Vocabulary</h2>' +
          '<div class="lesson-ribbon"><strong>' + esc(lesson.subtitle) + '</strong><span>10 words | Meanings and examples from the study material</span></div>' +
          '<div class="table-wrap"><table><thead><tr><th style="width:18%">Word</th><th style="width:36%">Meaning</th><th>Example</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<div class="remember">&#11088; Remember: ' + esc(lesson.remember) + '</div>' +
          '</div>', "study");
      }

      function buildReview() {
        var cards = "";
        var i;
        for (i = 0; i < lessons.length; i += 1) {
          var lesson = lessons[i];
          var lines = "";
          var j;
          for (j = 0; j < lesson.words.length; j += 1) {
            lines += '<div class="review-line"><b>' + esc(lesson.words[j].word) + '</b><span>' + esc(lesson.words[j].meanings[0]) + '</span></div>';
          }
          cards += '<div class="review-card ' + lesson.className + '"><h3>Lesson ' + lesson.number + '</h3>' + lines + '</div>';
        }
        addSlide('<div class="slide-inner"><span class="eyebrow">Study Check</span><h2>Quick Review Before the Quiz</h2><p class="lead">Say each word aloud, then cover the meaning and try to remember it.</p><div class="review-grid">' + cards + '</div><div class="remember">&#11088; Final check: Which words show honesty? Which words compare amounts? Which words show agreement or disagreement?</div></div>', "review");
      }

      function buildQuizIntro() {
        addSlide('<div class="slide-inner quiz-intro"><div class="quiz-badge">&#127919;</div><span class="eyebrow">Ready?</span><h2>30-Question Vocabulary Quiz</h2><p class="lead">Choose A, B, C, or D. You will see the correct answer and a short explanation after every question.</p><div class="mini-stats"><span>10 questions from Lesson 4</span><span>10 from Lesson 5</span><span>10 from Lesson 6</span></div></div>', "quizIntro");
      }

      function buildQuestions() {
        var i;
        for (i = 0; i < questions.length; i += 1) {
          var item = questions[i];
          var options = "";
          var j;
          for (j = 0; j < item.options.length; j += 1) {
            options += '<button class="answer" type="button" data-choice="' + j + '"><span class="choice-letter">' + String.fromCharCode(65 + j) + '</span><span>' + esc(item.options[j]) + '</span></button>';
          }
          addSlide('<div class="slide-inner"><div class="question-wrap"><div class="question-meta"><span>Lesson ' + item.lesson + '</span><span>Question ' + (i + 1) + ' of 30</span></div><h2 class="question-text">' + esc(item.q) + '</h2><div class="answers">' + options + '</div><div class="feedback" id="feedback-' + i + '"></div></div></div>', "question");
        }
      }

      function buildResult() {
        addSlide('<div class="slide-inner result"><span class="eyebrow">Quiz Complete</span><h2>Your Vocabulary Result</h2><div class="score-ring" id="scoreRing"><div class="score-number" id="scoreNumber">0 / 30<small>correct</small></div></div><p class="lead" id="resultMessage">Complete the quiz to see your result.</p><div class="result-breakdown" id="resultBreakdown"></div><button class="action" type="button" id="retryQuizBtn">Try the Quiz Again</button></div>', "result");
      }

      function buildDeck() {
        buildIntro();
        var i;
        for (i = 0; i < lessons.length; i += 1) { buildLesson(lessons[i]); }
        buildReview();
        buildQuizIntro();
        buildQuestions();
        buildResult();
      }

      function questionIndexForSlide(slideIndex) {
        var firstQuestionSlide = 6;
        if (slideIndex >= firstQuestionSlide && slideIndex < firstQuestionSlide + questions.length) {
          return slideIndex - firstQuestionSlide;
        }
        return -1;
      }

      function showSlide(index) {
        var slides = deck.querySelectorAll(".slide");
        if (index < 0 || index >= slides.length) { return; }
        var i;
        for (i = 0; i < slides.length; i += 1) { slides[i].classList.remove("active"); }
        current = index;
        slides[current].classList.add("active");
        slides[current].scrollTop = 0;
        counter.textContent = (current + 1) + " / " + slides.length;
        progressFill.style.width = (((current + 1) / slides.length) * 100) + "%";
        backBtn.disabled = current === 0;

        var qIndex = questionIndexForSlide(current);
        var unanswered = qIndex >= 0 && typeof answers[qIndex] === "undefined";
        nextBtn.disabled = unanswered;
        nextBtn.textContent = current === slides.length - 1 ? "Finished" : "Next \u2192";
        if (slideTypes[current] === "result") { updateResult(); }
      }

      function answerQuestion(questionIndex, choice, button) {
        if (typeof answers[questionIndex] !== "undefined") { return; }
        answers[questionIndex] = choice;
        answeredCount += 1;
        var item = questions[questionIndex];
        var slide = deck.querySelectorAll(".slide")[current];
        var buttons = slide.querySelectorAll(".answer");
        var i;
        for (i = 0; i < buttons.length; i += 1) {
          buttons[i].disabled = true;
          if (i === item.answer) { buttons[i].classList.add("correct"); }
        }
        var feedback = document.getElementById("feedback-" + questionIndex);
        if (choice === item.answer) {
          score += 1;
          button.classList.add("correct");
          feedback.className = "feedback show good";
          feedback.innerHTML = "<strong>&#10004; Correct!</strong> " + esc(item.explain);
        } else {
          button.classList.add("wrong");
          feedback.className = "feedback show bad";
          feedback.innerHTML = "<strong>&#10006; Not quite.</strong> The correct answer is <strong>" + String.fromCharCode(65 + item.answer) + ". " + esc(item.options[item.answer]) + "</strong>. " + esc(item.explain);
        }
        scorePill.textContent = "Score: " + score + " / " + answeredCount;
        nextBtn.disabled = false;
      }

      function updateResult() {
        var percent = Math.round((score / questions.length) * 100);
        var message;
        if (percent >= 90) { message = "Excellent work! You have a strong understanding of the vocabulary."; }
        else if (percent >= 75) { message = "Good job! Review the meanings you missed, then try again."; }
        else { message = "Keep practicing. Return to the lesson tables and use the examples to remember each word."; }
        document.getElementById("scoreNumber").innerHTML = score + " / 30<small>correct - " + percent + "%</small>";
        document.getElementById("scoreRing").style.setProperty("--score-angle", (percent * 3.6) + "deg");
        document.getElementById("resultMessage").textContent = message;

        var correctByLesson = { 4: 0, 5: 0, 6: 0 };
        var i;
        for (i = 0; i < questions.length; i += 1) {
          if (answers[i] === questions[i].answer) { correctByLesson[questions[i].lesson] += 1; }
        }
        document.getElementById("resultBreakdown").innerHTML = '<span>Lesson 4: ' + correctByLesson[4] + '/10</span><span>Lesson 5: ' + correctByLesson[5] + '/10</span><span>Lesson 6: ' + correctByLesson[6] + '/10</span>';
      }

      function resetQuiz(startAtQuiz) {
        var buttons = deck.querySelectorAll(".answer");
        var feedbacks = deck.querySelectorAll(".feedback");
        var i;
        score = 0;
        answeredCount = 0;
        answers = [];
        for (i = 0; i < buttons.length; i += 1) {
          buttons[i].disabled = false;
          buttons[i].classList.remove("correct", "wrong");
        }
        for (i = 0; i < feedbacks.length; i += 1) {
          feedbacks[i].className = "feedback";
          feedbacks[i].innerHTML = "";
        }
        scorePill.textContent = "Score: 0 / 0";
        showSlide(startAtQuiz ? 5 : 0);
      }

      buildDeck();

      deck.addEventListener("click", function (event) {
        var target = event.target;
        while (target && target !== deck && !target.classList.contains("answer")) { target = target.parentNode; }
        if (target && target.classList && target.classList.contains("answer")) {
          var qIndex = questionIndexForSlide(current);
          if (qIndex >= 0) { answerQuestion(qIndex, Number(target.getAttribute("data-choice")), target); }
        }
      });

      backBtn.addEventListener("click", function () { showSlide(current - 1); });
      nextBtn.addEventListener("click", function () { if (!nextBtn.disabled) { showSlide(current + 1); } });
      restartBtn.addEventListener("click", function () { resetQuiz(false); });

      document.addEventListener("click", function (event) {
        if (event.target && event.target.id === "retryQuizBtn") { resetQuiz(true); }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft" && !backBtn.disabled) { showSlide(current - 1); }
        if (event.key === "ArrowRight" && !nextBtn.disabled && current < deck.querySelectorAll(".slide").length - 1) { showSlide(current + 1); }
      });

      showSlide(0);
    }());
  </script>
</body>
</html>
