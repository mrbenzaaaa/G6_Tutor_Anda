<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 Nouns — Touchscreen Tutor</title>
<style>
:root {
  --bg1:#eef7ff; --bg2:#fff7e8; --card:#ffffff; --ink:#17324d; --muted:#5c7084;
  --accent:#5b67f1; --accent2:#ff9f43; --green:#16a085; --red:#d64545;
  --line:#dfe9f3; --yellow:#fff5b8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink)}
button{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.brand{font-weight:800;flex:1}
.progress-wrap{width:min(260px,35vw);height:12px;background:#e8eef5;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--green));transition:.3s}
.progress-text{font-size:13px;color:var(--muted);white-space:nowrap}
.stage{width:min(1100px,96vw);margin:18px auto 100px}
.slide{display:none;background:var(--card);border-radius:24px;box-shadow:0 16px 50px rgba(30,60,90,.12);padding:clamp(18px,3vw,34px);min-height:72vh;animation:fade .25s ease}
.slide.active{display:block}
@keyframes fade{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,4vw,46px);margin:0 0 16px;color:#28406b}
h2{font-size:clamp(24px,3vw,36px);margin:8px 0}
h3{margin:12px 0 8px;color:#344f88}
p,li,td,th{font-size:clamp(16px,1.8vw,20px);line-height:1.45}
table{width:100%;border-collapse:collapse;margin:14px 0;background:#fff;border-radius:14px;overflow:hidden}
th,td{border:1px solid var(--line);padding:12px;vertical-align:top}
th{background:#eef2ff;color:#31416d}
mark{background:var(--yellow);padding:2px 5px;border-radius:6px;font-weight:800}
.remember{margin-top:24px;background:linear-gradient(90deg,#fff4b0,#fff9db);border:2px solid #f0d85d;border-radius:16px;padding:14px 18px;font-size:clamp(16px,1.8vw,20px);font-weight:800}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px;display:flex;gap:10px;justify-content:center}
.navbtn,.primary,.secondary,.menu-card,.choice,.qa button{border:0;border-radius:16px;cursor:pointer;transition:.18s}
.navbtn{min-width:120px;padding:14px 18px;background:#eef2f7;color:var(--ink);font-weight:800}
.navbtn.primary{background:var(--accent);color:#fff}
.navbtn:hover,.primary:hover,.menu-card:hover,.choice:hover,.qa button:hover{transform:translateY(-1px)}
.hero{text-align:center;padding:4px 0 14px}
.big-icon{font-size:64px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.menu-card{padding:20px;text-align:left;background:#f7f9ff;border:2px solid #e6e9ff;font-weight:800;font-size:20px;min-height:88px}
.menu-card span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:white;margin-right:10px}
.menu-card.special{background:#fff9df;border-color:#f2dd7c}
.menu-card.quiz-card{background:#eafbf5;border-color:#9fddca}
.must-know,.example-box,.note,.flow{border-radius:16px;padding:16px;margin:14px 0}
.must-know{background:#f3f7ff;border-left:6px solid var(--accent)}
.example-box{background:#f8fbfd;border:1px solid var(--line)}
.note{background:#fff7ed;border-left:6px solid var(--accent2)}
.flow{background:#effaf6;border:1px solid #c8eadf;text-align:center;font-size:clamp(18px,2vw,24px)}
.four-grid,.five-examples,.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.four-grid>div,.five-examples>div,.review-grid>div{padding:16px;border-radius:14px;background:#f6f8fb;border:1px solid var(--line)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.panel{background:#f7f9fc;border:1px solid var(--line);padding:16px;border-radius:14px}
.small{font-size:14px;color:var(--muted)}
.qa{display:grid;gap:10px}
.qa.two-col{grid-template-columns:1fr 1fr}
.qa button{text-align:left;background:#f8fafc;border:1px solid var(--line);padding:14px 16px;color:var(--ink);font-weight:700}
.qa button span{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed #cbd6e2;font-weight:500}
.qa button.open span{display:block}
.instruction{color:var(--muted)}
.checklist{list-style:none;padding:0}
.checklist li{padding:8px 0}
.primary{background:var(--accent);color:white;padding:14px 18px;font-weight:800}
.secondary{background:#edf1f7;color:var(--ink);padding:14px 18px;font-weight:800}
.huge{width:100%;font-size:22px;padding:18px}
.quiz-shell{display:none;background:white;border-radius:24px;box-shadow:0 16px 50px rgba(30,60,90,.12);padding:clamp(18px,3vw,34px);min-height:72vh}
.quiz-shell.active{display:block}
.quiz-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.quiz-head .spacer{flex:1}
.badge{background:#eef2ff;color:#394895;border-radius:999px;padding:8px 12px;font-weight:800}
.question{font-size:clamp(23px,3vw,34px);font-weight:800;margin:24px 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:#f7f9fc;border:2px solid var(--line);padding:18px;text-align:left;font-weight:800;min-height:72px}
.choice.correct{background:#e8f8f1;border-color:#70c9a9}
.choice.wrong{background:#fff0f0;border-color:#e99a9a}
.choice:disabled{pointer-events:none}
.feedback{min-height:76px;margin-top:16px;padding:14px;border-radius:14px;display:none}
.feedback.show{display:block}
.feedback.good{background:#eaf9f2;color:#126747}
.feedback.bad{background:#fff1f1;color:#8c2525}
.quiz-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.score-box{text-align:center;padding:22px}
.score-big{font-size:64px;font-weight:900;color:var(--accent)}
.review-list{max-width:700px;margin:12px auto;text-align:left}
.hidden{display:none!important}
@media(max-width:760px){
  .compare,.choices,.qa.two-col{grid-template-columns:1fr}
  .navbar{justify-content:stretch}
  .navbtn{flex:1;min-width:0}
  .progress-wrap{display:none}
  .stage{width:98vw;margin-top:8px}
  .slide,.quiz-shell{border-radius:16px;min-height:78vh;padding:18px}
  th,td{padding:9px;font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">📘 Grade 6 Nouns Tutor</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <main class="stage" id="stage"></main>

  <div class="navbar" id="navbar">
    <button class="navbtn" onclick="goHome()">🏠 Menu</button>
    <button class="navbtn" id="backBtn" onclick="prevSlide()">← Back</button>
    <button class="navbtn primary" id="nextBtn" onclick="nextSlide()">Next →</button>
    <button class="navbtn" onclick="restartTutor()">↻ Restart</button>
  </div>
</div>

<script>
const slides = [{"id": "home", "lesson": 0, "title": "Grade 6 Nouns — Touchscreen Tutor", "body": "\n        <div class=\"hero\">\n          <div class=\"big-icon\">📘</div>\n          <h2>Choose a lesson to begin</h2>\n          <p>This tutor follows the five noun lessons from your study material.</p>\n        </div>\n        <div class=\"menu-grid\">\n          <button class=\"menu-card\" onclick=\"goToSlide('l1-1')\"><span>1</span>Recognizing Nouns</button>\n          <button class=\"menu-card\" onclick=\"goToSlide('l2-1')\"><span>2</span>Common and Proper Nouns</button>\n          <button class=\"menu-card\" onclick=\"goToSlide('l3-1')\"><span>3</span>Singular and Plural Nouns</button>\n          <button class=\"menu-card\" onclick=\"goToSlide('l4-1')\"><span>4</span>Possessive Nouns</button>\n          <button class=\"menu-card\" onclick=\"goToSlide('l5-1')\"><span>5</span>Plural and Possessive Nouns</button>\n          <button class=\"menu-card special\" onclick=\"goToSlide('review')\"><span>⭐</span>Final Lesson Review</button>\n          <button class=\"menu-card quiz-card\" onclick=\"startFinalQuiz()\"><span>🏁</span>Final 30-Question Quiz</button>\n        </div>\n        ", "remember": "Start with any lesson. You can return to this menu at any time."}, {"id": "l1-1", "lesson": 1, "title": "Lesson 1 — Recognizing Nouns", "body": "\n        <div class=\"must-know\">\n          <h3>What You Must Know</h3>\n          <p><b>A noun is a word that names a person, a place, a thing, or an idea.</b></p>\n          <div class=\"four-grid\">\n            <div><b>Person</b><br>Gina</div>\n            <div><b>Place</b><br>United States</div>\n            <div><b>Thing</b><br>tools</div>\n            <div><b>Idea</b><br>history</div>\n          </div>\n        </div>\n        <p>An idea noun can name something that cannot be touched. The study material gives <b>time</b>, <b>friendship</b>, <b>anger</b>, and <b>summer</b> as examples.</p>\n        <div class=\"flow\"><b>Word</b> → names a person/place/thing/idea → <b>NOUN</b></div>\n        ", "remember": "A noun names a person, place, thing, or idea."}, {"id": "l1-2", "lesson": 1, "title": "Recognizing Nouns — More Than One Word", "body": "\n        <p>A noun can be made up of <b>more than one word</b>.</p>\n        <table>\n          <tr><th>Type</th><th>Examples from the material</th></tr>\n          <tr><td>Person</td><td>baby sitter, Jan Smith, Dr. Jones, President Adams</td></tr>\n          <tr><td>Place</td><td>dining room, Hill School, Pacific Ocean, New Mexico</td></tr>\n          <tr><td>Thing</td><td>fire engine, credit card, look-alike, frying pan</td></tr>\n        </table>\n        <div class=\"example-box\"><b>5 easy examples:</b> baby sitter • Hill School • Pacific Ocean • credit card • frying pan</div>\n        ", "remember": "A noun can be one word or more than one word."}, {"id": "l1-3", "lesson": 1, "title": "Recognizing Nouns — Source Practice 21–26", "body": "\n        <p class=\"instruction\">Find the nouns. Tap each answer to reveal it.</p>\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">21. Inventors have special talents.<span>Answer: <mark>Inventors, talents</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">22. A clever invention can save time for a person.<span>Answer: <mark>invention, time, person</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">23. Many years ago people hunted for food.<span>Answer: <mark>years, people, food</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">24. Then a hunter invented the bow and the arrow.<span>Answer: <mark>hunter, bow, arrow</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">25. Plants from farms soon became a source for food too.<span>Answer: <mark>Plants, farms, source, food</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">26. Families moved to villages and traded goods.<span>Answer: <mark>Families, villages, goods</mark></span></button>\n        </div>\n        ", "remember": "Look for the words that name people, places, things, or ideas."}, {"id": "l1-4", "lesson": 1, "title": "Recognizing Nouns — Source Practice 27–31", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">27. Now a store sells a meal in a can or a box.<span>Answer: <mark>store, meal, can, box</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">28. Inventors are always creating new machines or engines.<span>Answer: <mark>Inventors, machines, engines</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">29. Eli Whitney helped farmers in the United States.<span>Answer: <mark>Eli Whitney, farmers, United States</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">30. His machine removed seeds from cotton.<span>Answer: <mark>machine, seeds, cotton</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">31. The curiosity of the inventor has improved life.<span>Answer: <mark>curiosity, inventor, life</mark></span></button>\n        </div>\n        <div class=\"keyword-table\">\n          <h3>Keyword</h3>\n          <table><tr><th>Word</th><th>Meaning</th><th>Memory Tip</th></tr>\n          <tr><td><b>noun</b></td><td>a word that names a person, place, thing, or idea</td><td>Name = noun</td></tr></table>\n        </div>\n        ", "remember": "Names of ideas such as curiosity and life can also be nouns."}, {"id": "l1-end", "lesson": 1, "title": "Lesson 1 Quick Review", "body": "\n        <ul class=\"checklist\">\n          <li>☐ A noun names a person, place, thing, or idea.</li>\n          <li>☐ An idea can be something that cannot be touched.</li>\n          <li>☐ A noun can have more than one word.</li>\n          <li>☐ You can find nouns by asking, “What words name something?”</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startLessonQuiz(1)\">Start Lesson 1 Quiz — 15 Questions</button>\n        ", "remember": "Person • Place • Thing • Idea"}, {"id": "l2-1", "lesson": 2, "title": "Lesson 2 — Common and Proper Nouns", "body": "\n        <div class=\"compare\">\n          <div class=\"panel\">\n            <h3>Common Noun</h3>\n            <p><b>A common noun names any person, place, thing, or idea.</b></p>\n          </div>\n          <div class=\"panel\">\n            <h3>Proper Noun</h3>\n            <p><b>A proper noun names a particular person, place, thing, or idea.</b></p>\n            <p><b>A proper noun begins with a capital letter.</b></p>\n          </div>\n        </div>\n        <div class=\"flow\">Any one → <b>common</b> &nbsp;&nbsp;|&nbsp;&nbsp; Particular one → <b>proper</b></div>\n        ", "remember": "Common = any one. Proper = a particular one + capital letter."}, {"id": "l2-2", "lesson": 2, "title": "Common vs. Proper — 5 Source Examples", "body": "\n        <table>\n          <tr><th>Common</th><th>Proper</th></tr>\n          <tr><td>city</td><td><b>Boston</b></td></tr>\n          <tr><td>girl</td><td><b>Amy</b></td></tr>\n          <tr><td>ocean</td><td><b>Indian Ocean</b></td></tr>\n          <tr><td>state</td><td><b>New York</b></td></tr>\n          <tr><td>month</td><td><b>July</b></td></tr>\n        </table>\n        <p>If a proper noun has more than one word, capitalize the <b>important words</b>.</p>\n        <div class=\"example-box\">New Jersey • Gulf of Mexico • Statue of Liberty</div>\n        ", "remember": "Proper nouns name particular people, places, things, or ideas."}, {"id": "l2-3", "lesson": 2, "title": "Family Words as Names", "body": "\n        <p>When a family word is used <b>as a name</b>, capitalize it. Otherwise, do not capitalize it.</p>\n        <div class=\"compare\">\n          <div class=\"panel\"><b>Name use</b><br>Dad<br><span class=\"small\">“...is a hero to Dad.”</span></div>\n          <div class=\"panel\"><b>Not a name</b><br>mom<br><span class=\"small\">“My mom took photos...”</span></div>\n        </div>\n        <p>From the source practice:</p>\n        <div class=\"example-box\"><b>Aunt Mattie</b>, <b>Mom</b>, and my <b>grandfather</b> watched his trip on television.</div>\n        ", "remember": "Family word used as a name → capitalize it."}, {"id": "l2-4", "lesson": 2, "title": "Common and Proper — Source Practice", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">1. Edward White was the first American to walk in space.<span>Answer: <mark>Edward White</mark> (proper), <mark>American</mark> (common), <mark>space</mark> (common)</span></button>\n          <button onclick=\"toggleAnswer(this)\">2. The astronaut practiced daily in an airtight room for several hours.<span>Answer: <mark>astronaut, room, hours</mark> (common)</span></button>\n          <button onclick=\"toggleAnswer(this)\">3. Astronaut White walked in space above California.<span>Answer: <mark>White, California</mark> (proper); <mark>space</mark> (common)</span></button>\n          <button onclick=\"toggleAnswer(this)\">4. Could White see the Gulf of Santa Catalina?<span>Answer: <mark>White, Gulf of Santa Catalina</mark> (proper)</span></button>\n          <button onclick=\"toggleAnswer(this)\">5. The astronaut did not want to return to the spacecraft immediately.<span>Answer: <mark>astronaut, spacecraft</mark> (common)</span></button>\n        </div>\n        ", "remember": "Check whether the noun names any one or one particular person/place/thing/idea."}, {"id": "l2-5", "lesson": 2, "title": "Common and Proper — More Source Practice", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">6. His pilot convinced White to come back.<span>Answer: <mark>pilot</mark> (common), <mark>White</mark> (proper)</span></button>\n          <button onclick=\"toggleAnswer(this)\">7. The spacecraft orbited Earth before the flight ended.<span>Answer: <mark>spacecraft, flight</mark> (common), <mark>Earth</mark> (proper)</span></button>\n          <button onclick=\"toggleAnswer(this)\">8. A crew and a ship waited patiently in the Atlantic Ocean.<span>Answer: <mark>crew, ship</mark> (common), <mark>Atlantic Ocean</mark> (proper)</span></button>\n          <button onclick=\"toggleAnswer(this)\">9. Aunt Mattie, Mom, and my grandfather watched his trip on television.<span>Answer: <mark>Aunt Mattie, Mom</mark> (proper); <mark>grandfather, trip, television</mark> (common)</span></button>\n        </div>\n        <div class=\"keyword-table\">\n          <table><tr><th>Word</th><th>Meaning</th><th>Memory Tip</th></tr>\n          <tr><td><b>common noun</b></td><td>names any person, place, thing, or idea</td><td>Common = any one</td></tr>\n          <tr><td><b>proper noun</b></td><td>names a particular person, place, thing, or idea</td><td>Proper = particular + capital</td></tr></table>\n        </div>\n        ", "remember": "Proper noun = particular name + capital letter."}, {"id": "l2-end", "lesson": 2, "title": "Lesson 2 Quick Review", "body": "\n        <ul class=\"checklist\">\n          <li>☐ Common noun = any person, place, thing, or idea.</li>\n          <li>☐ Proper noun = a particular person, place, thing, or idea.</li>\n          <li>☐ Proper nouns begin with capital letters.</li>\n          <li>☐ In a multiword proper noun, capitalize the important words.</li>\n          <li>☐ Family word used as a name → capitalize it.</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startLessonQuiz(2)\">Start Lesson 2 Quiz — 15 Questions</button>\n        ", "remember": "Any = common. Particular = proper."}, {"id": "l3-1", "lesson": 3, "title": "Lesson 3 — Singular and Plural Nouns", "body": "\n        <div class=\"compare\">\n          <div class=\"panel\"><h3>Singular Noun</h3><p>Names <b>one</b> person, place, thing, or idea.</p></div>\n          <div class=\"panel\"><h3>Plural Noun</h3><p>Names <b>more than one</b> person, place, thing, or idea.</p></div>\n        </div>\n        <table>\n          <tr><th>Singular</th><th>Plural</th></tr>\n          <tr><td>truck</td><td>trucks</td></tr>\n          <tr><td>plant</td><td>plants</td></tr>\n          <tr><td>letter</td><td>letters</td></tr>\n          <tr><td>noise</td><td>noises</td></tr>\n          <tr><td>Jane</td><td>Janes</td></tr>\n        </table>\n        ", "remember": "Singular = one. Plural = more than one."}, {"id": "l3-2", "lesson": 3, "title": "Forming Plurals — s and es", "body": "\n        <table>\n          <tr><th>Singular ending</th><th>Plural form</th><th>Source examples</th></tr>\n          <tr><td>s, ss, ch, sh, x, z</td><td>Add <b>-es</b></td><td>Thomas→Thomases, boss→bosses, porch→porches, bush→bushes, fox→foxes, waltz→waltzes</td></tr>\n          <tr><td>consonant + o</td><td>Add <b>-es</b></td><td>potato→potatoes, veto→vetoes, echo→echoes</td></tr>\n          <tr><td>vowel + o</td><td>Add <b>-s</b></td><td>radio→radios, studio→studios</td></tr>\n        </table>\n        <div class=\"note\">The material also shows some consonant + o words that add only <b>-s</b>: Eskimo→Eskimos, solo→solos, piano→pianos, cello→cellos.</div>\n        ", "remember": "Check the ending of the singular noun before making it plural."}, {"id": "l3-3", "lesson": 3, "title": "Forming Plurals — y, f, and fe", "body": "\n        <table>\n          <tr><th>Ending</th><th>Rule</th><th>Source examples</th></tr>\n          <tr><td>consonant + y</td><td>Change <b>y to i</b> and add <b>-es</b></td><td>baby→babies, party→parties, country→countries</td></tr>\n          <tr><td>vowel + y</td><td>Add <b>-s</b></td><td>day→days, turkey→turkeys</td></tr>\n          <tr><td>f or fe</td><td>Sometimes change <b>f to v</b> and add <b>-s or -es</b></td><td>life→lives, half→halves, wolf→wolves; roof→roofs, chef→chefs</td></tr>\n        </table>\n        ", "remember": "Consonant + y → y becomes i + es. Vowel + y → add s."}, {"id": "l3-4", "lesson": 3, "title": "Special Plural Forms", "body": "\n        <h3>Same spelling in singular and plural</h3>\n        <div class=\"example-box\">moose → moose &nbsp; • &nbsp; salmon → salmon &nbsp; • &nbsp; deer → deer</div>\n        <h3>Different spelling in the plural</h3>\n        <table>\n          <tr><td>child → <b>children</b></td><td>woman → <b>women</b></td><td>tooth → <b>teeth</b></td></tr>\n          <tr><td>man → <b>men</b></td><td>goose → <b>geese</b></td><td>mouse → <b>mice</b></td></tr>\n        </table>\n        ", "remember": "Some plurals stay the same; some change spelling completely."}, {"id": "l3-5", "lesson": 3, "title": "Singular and Plural — Source Practice", "body": "\n        <div class=\"qa compact\">\n          <button onclick=\"toggleAnswer(this)\">1. The new (puppies, puppys) have sharp (tooths, teeth).<span>Answer: <mark>puppies, teeth</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">2. The gardener weeded the berry (patchs, patches) and planted (tomatos, tomatoes).<span>Answer: <mark>patches, tomatoes</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">3. Loggers use (axes, axs) to cut (treeses, trees).<span>Answer: <mark>axes, trees</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">4. The (moose, mooses) heard the (echos, echoes) of (wolves, wolfs).<span>Answer: <mark>moose, echoes, wolves</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">5. There are four (Bess, Besses) in the (class, classes).<span>Answer: <mark>Besses, classes</mark></span></button>\n        </div>\n        ", "remember": "Use the spelling of the singular noun to decide the plural form."}, {"id": "l3-6", "lesson": 3, "title": "Plural Forms — Source Answers", "body": "\n        <table class=\"answers-table\">\n          <tr><th>#</th><th>Singular</th><th>Answer</th></tr>\n          <tr><td>6</td><td>apple</td><td><mark>apples</mark></td></tr>\n          <tr><td>7</td><td>policy</td><td><mark>policies</mark></td></tr>\n          <tr><td>8</td><td>hero</td><td><mark>heroes</mark></td></tr>\n          <tr><td>9</td><td>watch</td><td><mark>watches</mark></td></tr>\n          <tr><td>10</td><td>wife</td><td><mark>wives</mark></td></tr>\n          <tr><td>11</td><td>dress</td><td><mark>dresses</mark></td></tr>\n          <tr><td>12</td><td>studio</td><td><mark>studios</mark></td></tr>\n          <tr><td>13</td><td>donkey</td><td><mark>donkeys</mark></td></tr>\n          <tr><td>14</td><td>Ross</td><td><mark>Rosses</mark></td></tr>\n          <tr><td>15</td><td>waltz</td><td><mark>waltzes</mark></td></tr>\n        </table>\n        ", "remember": "Plural spelling depends on the noun ending."}, {"id": "l3-7", "lesson": 3, "title": "Singular, Plural, or Both?", "body": "\n        <table>\n          <tr><th>Noun</th><th>Answer</th><th>Noun</th><th>Answer</th></tr>\n          <tr><td>piano</td><td><mark>singular</mark></td><td>Norrises</td><td><mark>plural</mark></td></tr>\n          <tr><td>moose</td><td><mark>singular and plural</mark></td><td>deer</td><td><mark>singular and plural</mark></td></tr>\n          <tr><td>women</td><td><mark>plural</mark></td><td>lilies</td><td><mark>plural</mark></td></tr>\n          <tr><td>dresses</td><td><mark>plural</mark></td><td>alleys</td><td><mark>plural</mark></td></tr>\n        </table>\n        <div class=\"keyword-table\">\n          <table><tr><th>Word</th><th>Meaning</th><th>Memory Tip</th></tr>\n          <tr><td><b>singular noun</b></td><td>names one person, place, thing, or idea</td><td>Single = one</td></tr>\n          <tr><td><b>plural noun</b></td><td>names more than one person, place, thing, or idea</td><td>Plural = more than one</td></tr></table>\n        </div>\n        ", "remember": "Some nouns, such as moose and deer, can look the same in singular and plural."}, {"id": "l3-end", "lesson": 3, "title": "Lesson 3 Quick Review", "body": "\n        <ul class=\"checklist\">\n          <li>☐ Singular = one.</li>\n          <li>☐ Plural = more than one.</li>\n          <li>☐ Most plurals use -s or -es.</li>\n          <li>☐ Consonant + y → change y to i and add -es.</li>\n          <li>☐ Some nouns have the same singular and plural spelling.</li>\n          <li>☐ Some nouns change spelling in the plural.</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startLessonQuiz(3)\">Start Lesson 3 Quiz — 15 Questions</button>\n        ", "remember": "Use the singular spelling to choose the plural rule."}, {"id": "l4-1", "lesson": 4, "title": "Lesson 4 — Possessive Nouns", "body": "\n        <p><b>You can change the form of a noun to show ownership, or possession.</b></p>\n        <p><b>A possessive noun names who or what owns or has something.</b></p>\n        <div class=\"flow\">Pat → owns a coat → <b>Pat’s coat</b></div>\n        <div class=\"flow\">babies → blocks belong to them → <b>the babies’ blocks</b></div>\n        ", "remember": "Possessive = shows who or what owns or has something."}, {"id": "l4-2", "lesson": 4, "title": "Rules for Forming Possessive Nouns", "body": "\n        <table>\n          <tr><th>Kind of noun</th><th>Rule</th><th>Source examples</th></tr>\n          <tr><td>Singular noun</td><td>Add apostrophe + s (<b>’s</b>)</td><td>a woman’s gloves, Mr. Ross’s hat, the teacher’s question</td></tr>\n          <tr><td>Plural noun ending in s</td><td>Add only an apostrophe (<b>’</b>)</td><td>the students’ papers, the Williamses’ house, the girls’ pens</td></tr>\n          <tr><td>Plural noun not ending in s</td><td>Add apostrophe + s (<b>’s</b>)</td><td>the men’s umbrellas, the geese’s nest, the children’s uniforms</td></tr>\n        </table>\n        ", "remember": "Singular → ’s. Plural ending in s → ’. Plural not ending in s → ’s."}, {"id": "l4-3", "lesson": 4, "title": "Possessive Nouns — 5 Easy Source Examples", "body": "\n        <div class=\"five-examples\">\n          <div><b>Pat’s coat</b><br>the coat owned by Pat</div>\n          <div><b>babies’ blocks</b><br>the blocks belonging to the babies</div>\n          <div><b>woman’s gloves</b></div>\n          <div><b>students’ papers</b></div>\n          <div><b>children’s uniforms</b></div>\n        </div>\n        <div class=\"compare\">\n          <div class=\"panel\"><b>One owner</b><br>teacher’s question</div>\n          <div class=\"panel\"><b>More than one owner ending in s</b><br>girls’ pens</div>\n        </div>\n        ", "remember": "Find the owner first, then choose the apostrophe rule."}, {"id": "l4-4", "lesson": 4, "title": "Possessive Nouns — Source Practice 1–10", "body": "\n        <div class=\"qa compact two-col\">\n          <button onclick=\"toggleAnswer(this)\">1. ___ toys (children)<span><mark>children’s</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">2. the ___ apartment (Ramoses)<span><mark>Ramoses’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">3. the ___ webbed feet (geese)<span><mark>geese’s</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">4. a ___ meeting (parents)<span><mark>parents’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">5. ___ office (Dr. Lewis)<span><mark>Dr. Lewis’s</mark> — singular possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">6. the ___ photocopies (library)<span><mark>library’s</mark> — singular possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">7. the ___ manes (horses)<span><mark>horses’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">8. the ___ themes (stories)<span><mark>stories’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">9. ___ coat (Mrs. Jones)<span><mark>Mrs. Jones’s</mark> — singular possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">10. ___ tails (bunnies)<span><mark>bunnies’</mark> — plural possessive</span></button>\n        </div>\n        ", "remember": "Plural ending in s takes only an apostrophe."}, {"id": "l4-5", "lesson": 4, "title": "Possessive Nouns — Source Practice 11–14", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">11. During her childhood, ___ dream was to become a doctor. (Elizabeth Blackwell)<span>Answer: <mark>Elizabeth Blackwell’s</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">12. ___ applications to medical schools were not welcomed. (Women)<span>Answer: <mark>Women’s</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">13. Her hard work and persistence gained her ___ respect. (professors)<span>Answer: <mark>professors’</mark></span></button>\n          <button onclick=\"toggleAnswer(this)\">14. She helped alter this ___ view of women doctors. (country)<span>Answer: <mark>country’s</mark></span></button>\n        </div>\n        <div class=\"keyword-table\">\n          <table><tr><th>Word</th><th>Meaning</th><th>Memory Tip</th></tr>\n          <tr><td><b>possessive noun</b></td><td>names who or what owns or has something</td><td>Possessive = possession / ownership</td></tr></table>\n        </div>\n        ", "remember": "Ask: Who owns it? Then form the possessive."}, {"id": "l4-end", "lesson": 4, "title": "Lesson 4 Quick Review", "body": "\n        <ul class=\"checklist\">\n          <li>☐ Possessive nouns show ownership or possession.</li>\n          <li>☐ Singular noun → add ’s.</li>\n          <li>☐ Plural noun ending in s → add only ’.</li>\n          <li>☐ Plural noun not ending in s → add ’s.</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startLessonQuiz(4)\">Start Lesson 4 Quiz — 15 Questions</button>\n        ", "remember": "Owner first → apostrophe rule second."}, {"id": "l5-1", "lesson": 5, "title": "Lesson 5 — Plural and Possessive Nouns", "body": "\n        <p><b>Do not confuse possessive nouns with ordinary plural nouns.</b></p>\n        <div class=\"compare\">\n          <div class=\"panel\"><h3>Plural</h3><p>Means <b>more than one</b>.</p><p>Most plural nouns end in <b>s</b>.</p></div>\n          <div class=\"panel\"><h3>Possessive</h3><p>Shows <b>ownership</b>.</p><p>A possessive noun has an <b>apostrophe</b> before or after the s.</p></div>\n        </div>\n        ", "remember": "Plural = how many. Possessive = who owns."}, {"id": "l5-2", "lesson": 5, "title": "Plural vs. Possessive — Source Chart", "body": "\n        <table>\n          <tr><th>Kind of noun</th><th>Ending</th><th>Source example</th></tr>\n          <tr><td>Plural (more than one)</td><td>Add -s or -es</td><td>two <b>boys</b>, the <b>Lewises</b></td></tr>\n          <tr><td>Singular possessive (belongs to one)</td><td>Add <b>’s</b></td><td>a <b>boy’s</b> shoe, Kim <b>Lewis’s</b> key, <b>Jess’s</b> locker</td></tr>\n          <tr><td>Plural possessive, plural ends in s</td><td>Add <b>’</b></td><td>two <b>boys’</b> shoes, the <b>Lewises’</b> key</td></tr>\n          <tr><td>Plural possessive, plural does not end in s</td><td>Add <b>’s</b></td><td>the <b>mice’s</b> teeth, the <b>women’s</b> ideas, the <b>men’s</b> team</td></tr>\n        </table>\n        ", "remember": "Apostrophe = ownership clue."}, {"id": "l5-3", "lesson": 5, "title": "Easy-to-Confuse Forms", "body": "\n        <table>\n          <tr><th>Form</th><th>Meaning from the lesson</th></tr>\n          <tr><td><b>boys</b></td><td>more than one boy</td></tr>\n          <tr><td><b>boy’s</b></td><td>belongs to one boy</td></tr>\n          <tr><td><b>boys’</b></td><td>belongs to more than one boy</td></tr>\n        </table>\n        <div class=\"flow\">No apostrophe → usually <b>plural</b> &nbsp;&nbsp; | &nbsp;&nbsp; Apostrophe → <b>possessive</b></div>\n        ", "remember": "boys = many; boy’s = one owner; boys’ = many owners."}, {"id": "l5-4", "lesson": 5, "title": "Plural & Possessive — Source Practice 11–15", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">11. Balloon ___ have become popular. (race)<span>Answer: <mark>races</mark> — plural</span></button>\n          <button onclick=\"toggleAnswer(this)\">12. Several ___ are supporting this race. (airport)<span>Answer: <mark>airports</mark> — plural</span></button>\n          <button onclick=\"toggleAnswer(this)\">13. An area is reserved for ___. (spectator)<span>Answer: <mark>spectators</mark> — plural</span></button>\n          <button onclick=\"toggleAnswer(this)\">14. One ___ son is in the race. (spectator)<span>Answer: <mark>spectator’s</mark> — singular possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">15. The occasion is a ___ delight. (photographer)<span>Answer: <mark>photographer’s</mark> — singular possessive</span></button>\n        </div>\n        ", "remember": "First decide: more than one, or ownership?"}, {"id": "l5-5", "lesson": 5, "title": "Plural & Possessive — Source Practice 16–20", "body": "\n        <div class=\"qa\">\n          <button onclick=\"toggleAnswer(this)\">16. Will all the ___ please climb aboard? (passenger)<span>Answer: <mark>passengers</mark> — plural</span></button>\n          <button onclick=\"toggleAnswer(this)\">17. Many ___ cameras click rapidly. (photographer)<span>Answer: <mark>photographers’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">18. All the ___ friends wave goodbye to them. (passenger)<span>Answer: <mark>passengers’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">19. Soon they cannot hear their ___ voices. (friend)<span>Answer: <mark>friends’</mark> — plural possessive</span></button>\n          <button onclick=\"toggleAnswer(this)\">20. The balloons soar over one ___ house. (passenger)<span>Answer: <mark>passenger’s</mark> — singular possessive</span></button>\n        </div>\n        ", "remember": "Ownership needs an apostrophe."}, {"id": "l5-end", "lesson": 5, "title": "Lesson 5 Quick Review", "body": "\n        <ul class=\"checklist\">\n          <li>☐ Most plural nouns end in s.</li>\n          <li>☐ Possessive nouns have an apostrophe before or after s.</li>\n          <li>☐ Plural = more than one.</li>\n          <li>☐ Possessive = belongs to one or more owners.</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startLessonQuiz(5)\">Start Lesson 5 Quiz — 15 Questions</button>\n        ", "remember": "Plural tells number. Possessive tells ownership."}, {"id": "review", "lesson": 6, "title": "Lesson Review — Before the Final Quiz", "body": "\n        <div class=\"review-grid\">\n          <div><b>1. Recognizing Nouns</b><br>Noun = person, place, thing, or idea.</div>\n          <div><b>2. Common & Proper</b><br>Common = any; Proper = particular + capital letter.</div>\n          <div><b>3. Singular & Plural</b><br>Singular = one; Plural = more than one.</div>\n          <div><b>4. Possessive Nouns</b><br>Shows who or what owns or has something.</div>\n          <div><b>5. Plural vs. Possessive</b><br>Plural tells number; possessive uses an apostrophe to show ownership.</div>\n        </div>\n        <h3>Remember These Before the Test</h3>\n        <ul class=\"checklist\">\n          <li>☐ Person • Place • Thing • Idea</li>\n          <li>☐ Proper nouns begin with capital letters.</li>\n          <li>☐ Check the noun ending before forming a plural.</li>\n          <li>☐ Singular possessive → ’s</li>\n          <li>☐ Plural ending in s → ’</li>\n          <li>☐ Plural not ending in s → ’s</li>\n          <li>☐ Apostrophe = ownership clue</li>\n        </ul>\n        <button class=\"primary huge\" onclick=\"startFinalQuiz()\">Start Final Quiz — 30 Questions</button>\n        ", "remember": "Noun type first → rule second."}];
const lessonQuizzes = {"1": [{"q": "What does a noun name?", "choices": ["Only a person", "A person, place, thing, or idea", "Only a place", "Only a thing"], "a": 1, "e": "The material defines a noun as a word that names a person, place, thing, or idea.", "tag": "Recognizing nouns"}, {"q": "Which source word is an idea noun?", "choices": ["time", "frying pan", "Dr. Jones", "Pacific Ocean"], "a": 0, "e": "The material lists time as an idea that cannot be touched.", "tag": "Recognizing nouns"}, {"q": "Which source example is a person noun?", "choices": ["New Mexico", "credit card", "President Adams", "summer"], "a": 2, "e": "President Adams names a person.", "tag": "Recognizing nouns"}, {"q": "Which source example is a place noun?", "choices": ["Hill School", "look-alike", "baby sitter", "friendship"], "a": 0, "e": "Hill School names a place.", "tag": "Recognizing nouns"}, {"q": "Which source example is a thing noun?", "choices": ["anger", "Pacific Ocean", "frying pan", "Jan Smith"], "a": 2, "e": "Frying pan names a thing.", "tag": "Recognizing nouns"}, {"q": "Can a noun be made up of more than one word?", "choices": ["Yes", "No", "Only proper nouns", "Only idea nouns"], "a": 0, "e": "The material says a noun can be made up of more than one word.", "tag": "Recognizing nouns"}, {"q": "In “Inventors have special talents,” which are the nouns?", "choices": ["Inventors, talents", "have, special", "special, talents", "Inventors, have"], "a": 0, "e": "Inventors and talents name things or people.", "tag": "Recognizing nouns"}, {"q": "In “A clever invention can save time for a person,” which set has all nouns?", "choices": ["clever, save", "invention, time, person", "can, for", "clever, person"], "a": 1, "e": "Invention, time, and person are nouns.", "tag": "Recognizing nouns"}, {"q": "In “Many years ago people hunted for food,” which set has all nouns?", "choices": ["Many, ago", "years, people, food", "hunted, food", "people, hunted"], "a": 1, "e": "Years, people, and food a let currentSlideIndex = 0;
let currentMode = 'slides';
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizTitle = '';
let wrongTags = {};

const stage = document.getElementById('stage');
const progressText = document.getElementById('progressText');
const progressBar = document.getElementById('progressBar');
const navbar = document.getElementById('navbar');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function renderSlides() {
  stage.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('section');
    div.className = 'slide' + (i===currentSlideIndex ? ' active' : '');
    div.id = 'slide-' + s.id;
    div.innerHTML = `<h1>${s.title}</h1>${s.body}<div class="remember">⭐ Remember: ${s.remember}</div>`;
    stage.appendChild(div);
  });
  currentMode='slides';
  navbar.classList.remove('hidden');
  updateSlideUI();
}

function getLessonSlideIndices(lesson) {
  return slides.map((s,i)=>s.lesson===lesson?i:-1).filter(i=>i>=0);
}

function updateSlideUI() {
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active', i===currentSlideIndex));
  const s = slides[currentSlideIndex];
  if (s.id === 'home') {
    progressText.textContent = 'Main Menu';
    progressBar.style.width = '0%';
    backBtn.disabled = true;
    nextBtn.disabled = false;
    return;
  }
  const list = getLessonSlideIndices(s.lesson);
  const pos = list.indexOf(currentSlideIndex)+1;
  progressText.textContent = s.lesson===6 ? `Final Review` : `Lesson ${s.lesson} • Slide ${pos} of ${list.length}`;
  progressBar.style.width = `${Math.max(5,(pos/list.length)*100)}%`;
  backBtn.disabled = false;
  nextBtn.disabled = (pos===list.length);
  window.scrollTo({top:0,behavior:'smooth'});
}

function goToSlide(id) {
  const idx = slides.findIndex(s=>s.id===id);
  if(idx>=0) {
    currentSlideIndex=idx;
    if(currentMode!=='slides') renderSlides();
    else updateSlideUI();
  }
}

function goHome() {
  if(currentMode!=='slides') {
    currentSlideIndex=0;
    renderSlides();
  } else {
    currentSlideIndex=0;
    updateSlideUI();
  }
}

function prevSlide() {
  if(currentMode!=='slides') return;
  const s = slides[currentSlideIndex];
  if(s.id==='home') return;
  const list = getLessonSlideIndices(s.lesson);
  const pos = list.indexOf(currentSlideIndex);
  if(pos>0) currentSlideIndex=list[pos-1];
  else currentSlideIndex=0;
  updateSlideUI();
}

function nextSlide() {
  if(currentMode!=='slides') return;
  const s=slides[currentSlideIndex];
  if(s.id==='home') {
    goToSlide('l1-1'); return;
  }
  const list=getLessonSlideIndices(s.lesson);
  const pos=list.indexOf(currentSlideIndex);
  if(pos>=0 && pos<list.length-1) {
    currentSlideIndex=list[pos+1];
    updateSlideUI();
  }
}

function restartTutor() {
  quizQuestions=[]; quizIndex=0; quizScore=0; quizAnswered=false; wrongTags={};
  currentSlideIndex=0;
  renderSlides();
}

function toggleAnswer(btn) {
  btn.classList.toggle('open');
}

function startLessonQuiz(n) {
  startQuiz(lessonQuizzes[n], `Lesson ${n} Quiz — 15 Questions`);
}

function startFinalQuiz() {
  startQuiz(finalQuiz, 'Final Quiz — 30 Questions');
}

function startQuiz(questions, title) {
  currentMode='quiz';
  quizQuestions=questions;
  quizIndex=0;
  quizScore=0;
  quizAnswered=false;
  quizTitle=title;
  wrongTags={};
  navbar.classList.add('hidden');
  renderQuizQuestion();
}

      </div>
      <div class="question">${item.q}</div>
      <div class="choices">

      <div id="feedback" class="feedback"></div>
      <div class="quiz-actions">
        <button id="quizNext" class="primary huge hidden" onclick="nextQuizQuestion()">${quizIndex===total-1?'See Final Score':'Next Question →'}</button>
      </div>
    </section>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function answerQuiz(choice, btn) {
  if(quizAnswered) return;
  quizAnswered=true;
  const item=quizQuestions[quizIndex];
  const buttons=[...document.querySelectorAll('.choice')];
  buttons.forEach(b=>b.classList.add('disabled'));
  buttons[item.a].classList.add('correct');
  const feedback=document.getElementById('feedback');
  if(choice===item.a) {
    quizScore++;
    feedback.className='feedback show good';
    feedback.innerHTML=`✅ <b>Correct!</b><br>${item.e}`;
  } else {
    btn.classList.add('wrong');
    feedback.className='feedback show bad';
    const letters=['A','B','C','D'];
    feedback.innerHTML=`❌ <b>Incorrect.</b> Correct answer: <b>${letters[item.a]}. ${item.choices[item.a]}</b><br>${item.e}`;
    wrongTags[item.tag]=(wrongTags[item.tag]||0)+1;
  }
  document.getElementById('quizNext').classList.remove('hidden');
}

function nextQuizQuestion() {
  if(!quizAnswered) return;
  if(quizIndex < quizQuestions.length-1) {
    quizIndex++;
    quizAnswered=false;
    renderQuizQuestion();
  } else {
    renderQuizResult();
  }
}

function renderQuizResult() {
  const total=quizQuestions.length;
  const percent=Math.round((quizScore/total)*100);
  progressBar.style.width='100%';
  progressText.textContent='Quiz Complete';
  const needsReview=Object.entries(wrongTags).sort((a,b)=>b[1]-a[1]);
  const reviewHtml=needsReview.length
    ? `<div class="review-list"><h3>Topics to Review</h3><ul>${needsReview.map(([t,n])=>`<li><b>${t}</b> — ${n} missed</li>`).join('')}</ul></div>`
    : `<div class="review-list"><h3>Topics to Review</h3><p>No missed topics in this quiz.</p></div>`;
  stage.innerHTML=`
    <section class="quiz-shell active">
      <div class="score-box">
        <h1>🎉 Quiz Complete!</h1>
        <div class="score-big">${quizScore} / ${total}</div>
        <h2>${percent}%</h2>
        ${reviewHtml}
        <div class="quiz-actions">
          <button class="primary huge" onclick="retryQuiz()">Try This Quiz Again</button>
          <button class="secondary huge" onclick="exitQuiz()">Back to Main Menu</button>
        </div>
      </div>
    </section>`;
}

function retryQuiz() {
  startQuiz(quizQuestions, quizTitle);
}

function exitQuiz() {
  currentSlideIndex=0;
  renderSlides();
}

renderSlides();
</script>
</body>
</html>
