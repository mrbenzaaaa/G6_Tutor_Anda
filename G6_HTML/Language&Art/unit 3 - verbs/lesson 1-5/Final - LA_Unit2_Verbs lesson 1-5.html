    .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.btn{min-height:54px;border:0;border-radius:16px;padding:12px 22px;font-weight:900;cursor:pointer;box-shadow:0 7px 15px rgba(42,62,116,.13);transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.03)}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:white}.secondary{background:#fff;color:#33436c;border:2px solid #dce4f4}.gold{background:var(--gold);color:#5b3c00}.controls .next{margin-left:auto}
    .menu-head{text-align:center;margin-bottom:18px}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.menu-card{text-align:left;border:2px solid #e0e6f4;border-radius:20px;background:#fff;padding:20px;min-height:160px;cursor:pointer;box-shadow:0 8px 20px rgba(40,61,103,.08);transition:.18s}.menu-card:hover{transform:translateY(-3px);border-color:#9d90e9}.menu-card .num{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#ece8ff;color:#543aaa;font-weight:900}.menu-card h3{font-size:1.3rem;margin:.65em 0 .35em}.menu-card p{font-size:.98rem;margin:0;color:#5e687f}.wide{grid-column:1/-1;background:linear-gradient(135deg,#eff6ff,#f3edff)}
    .quiz-meta{display:flex;justify-content:space-between;gap:12px;font-weight:900;color:#52617f;margin-bottom:14px}.question{font-size:clamp(1.35rem,3vw,2rem);line-height:1.32;margin:8px 0 20px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{text-align:left;min-height:68px;border:2px solid #dce4f3;background:#fff;border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.05rem;cursor:pointer}.choice:hover:not(:disabled){border-color:#8b7de0;background:#f6f3ff}.choice.correct{background:#e7f9ef;border-color:#4abb7b;color:#0b6738}.choice.wrong{background:#ffebed;border-color:#e36670;color:#8c1f29}.choice:disabled{cursor:default}.letter{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#edf1fb;margin-right:10px;color:#425584}
    .feedback{display:none;margin-top:17px;padding:15px 17px;border-radius:15px;font-size:1.05rem;line-height:1.42}.feedback.show{display:block}.feedback.ok{background:#e8f8ef;color:#096239}.feedback.no{background:#ffeded;color:#8b1f2a}.feedback strong{font-size:1.12rem}
    .result{text-align:center}.score-ring{width:160px;height:160px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:conic-gradient(var(--purple) var(--score),#e8eafa 0);position:relative}.score-ring:after{content:"";position:absolute;inset:13px;border-radius:50%;background:white}.score-ring span{position:relative;z-index:1;font-size:2rem;font-weight:900;color:#34468f}.review-list{max-width:720px;margin:18px auto;text-align:left}.checklist{list-style:none;padding:0}.checklist li{padding:8px 0 8px 34px;position:relative}.checklist li:before{content:"✓";position:absolute;left:0;top:7px;color:var(--good);font-weight:900;font-size:1.2rem}
    .hidden{display:none!important}.small{font-size:.94rem;color:#60708a}.term{color:#4d35a9;font-weight:900}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eaf0ff;color:#3150a1;font-size:.85rem;font-weight:900;margin:2px}

<script>
"use strict";
const lessons=[
{
 id:"action",number:"3.1",title:"Action Verbs",summary:"Find visible and invisible actions.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">A <span class="term">verb</span> is the main word in the predicate of a sentence. An <span class="term">action verb</span> tells what the subject does or did.</p><div class="flow"><span>Find the subject</span><b>→</b><span>Ask what it does or did</span><b>→</b><span>Find the action verb</span></div><div class="grid"><div class="card good"><h3>Visible action</h3><p>You can see the action.</p></div><div class="card purple"><h3>Invisible action</h3><p>You cannot see the action.</p></div></div>`,remember:"An action verb tells what the subject does or did."},
  {title:"Visible and Invisible Actions",body:`<div class="grid"><div class="card good"><h3>Visible</h3><p><b>We walked</b> on the beach.</p><p>We <b>ran</b> toward the ocean.</p><p>I <b>touched</b> the pattern on its surface.</p></div><div class="card purple"><h3>Invisible</h3><p>We <b>want</b> seashells.</p><p>I <b>wonder</b> about the tides.</p><p>Artists <b>appreciate</b> the beauty of its five-point star.</p></div></div><p class="lead">An action can happen in the body or in the mind.</p>`,remember:"If you cannot see it, it may still be an action verb."},
  {title:"Source Exercise 1–6",body:`<p>Find the action verb in each sentence. Tap <b>Show Answer</b> when you are ready.</p>${exercise([[1,"I found a sand dollar on the beach.","Action verb: found"],[2,"Dad and I studied the sand dollar carefully.","Action verb: studied"],[3,"I touched the pattern on its surface.","Action verb: touched"],[4,"I brought the sand dollar into the house.","Action verb: brought"],[5,"It fits in the palm of my hand.","Action verb: fits"],[6,"Dad placed it on the windowsill in the sunlight.","Action verb: placed"]])}`,remember:"Find the word that tells what the subject did."},
  {title:"Source Exercise 7–13",body:`<p>Find the action verb. Then label the action visible or invisible.</p>${exercise([[7,"I collect seashells and sand dollars.","collect — visible"],[8,"Feel the slots and notches all over this sand dollar.","Feel — visible"],[9,"Sand moves through these notches.","moves — visible"],[10,"The sand dollar eats shellfish and plants.","eats — visible"],[11,"Artists appreciate the beauty of its five-point star.","appreciate — invisible"],[12,"They paint pictures of sand dollars and other sea creatures.","paint — visible"],[13,"I love paintings of the ocean.","love — invisible"]])}`,remember:"Visible can be seen; invisible cannot be seen."},
  {title:"Exam Focus and Memory Tricks",body:`<div class="grid"><div class="card"><h3>Keyword</h3><p><b>action verb</b> → tells what the subject does or did</p></div><div class="card warn"><h3>Easy to confuse</h3><p>Do not look only for movement. <b>want</b>, <b>wonder</b>, <b>appreciate</b>, and <b>love</b> are invisible actions in the source.</p></div></div><ul class="checklist"><li>Find the subject.</li><li>Ask what the subject does or did.</li><li>Decide whether the action is visible or invisible.</li></ul>`,remember:"Action = what the subject does or did."}
 ],
 quiz:[
  q("What does an action verb tell?",["What the subject does or did","Where the subject is","How many subjects there are","Which noun is proper"],0,"Action Verbs","It tells what the subject does or did."),
  q("What is the main word in the predicate of a sentence?",["A noun","A verb","A pronoun","A direct object"],1,"Action Verbs","The source says a verb is the main word in the predicate."),
  q("Which action verb is in “We walked on the beach”?",["We","beach","walked","on"],2,"Action Verbs","Walked tells what we did."),
  q("Which action verb is in “We ran toward the ocean”?",["ocean","toward","We","ran"],3,"Action Verbs","Ran tells what we did."),
  q("Which word is the action verb in “We want seashells”?",["want","We","seashells","none"],0,"Invisible Actions","Want is an action that cannot be seen."),
  q("Which word is the action verb in “I wonder about the tides”?",["tides","wonder","about","I"],1,"Invisible Actions","Wonder is the invisible action."),
  q("Which action is visible?",["love","appreciate","paint","want"],2,"Visible Actions","Paint is shown as a visible action."),
  q("Which action is invisible?",["moves","eats","collect","love"],3,"Invisible Actions","Love is labeled invisible in the source."),
  q("Find the action verb: “I found a sand dollar on the beach.”",["found","dollar","beach","sand"],0,"Action Verbs","Found tells what I did."),
  q("Find the action verb: “Dad and I studied the sand dollar carefully.”",["Dad","studied","dollar","carefully"],1,"Action Verbs","Studied tells what Dad and I did."),
  q("Find the action verb: “It fits in the palm of my hand.”",["palm","hand","fits","It"],2,"Action Verbs","Fits tells what it does."),
  q("Find the action verb: “Dad placed it on the windowsill.”",["Dad","it","windowsill","placed"],3,"Action Verbs","Placed tells what Dad did."),
  q("How is “appreciate” labeled in the source practice?",["invisible","visible","helping","linking"],0,"Invisible Actions","Appreciate is labeled invisible."),
  q("How is “eats” labeled in the source practice?",["invisible","visible","helping","being"],1,"Visible Actions","Eats is labeled visible."),
  q("Which statement is correct?",["Only visible actions are verbs","Every action verb can be seen","Some action verbs tell actions you cannot see","Action verbs name people"],2,"Action Verbs","Some action verbs tell actions that cannot be seen.")
 ]
},
{
 id:"mainhelp",number:"3.2",title:"Main Verbs and Helping Verbs",summary:"Build and identify verb phrases.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">Every sentence has a verb in the predicate. The verb can be one word or several words.</p><div class="grid"><div class="card"><h3>One word</h3><p>Kenneth <b>walked</b> home.</p></div><div class="card purple"><h3>Several words</h3><p>I <b>will be going</b> home soon too.</p></div></div><p>A verb made of more than one word is a <span class="term">verb phrase</span>.</p>`,remember:"A verb can be one word or several words."},
  {title:"Main Verb + Helping Verb",body:`<div class="flow"><span>Helping verb or verbs</span><b>+</b><span>Main verb</span><b>=</b><span>Verb phrase</span></div><div class="grid"><div class="card good"><h3>Main verb</h3><p>Expresses action or being.</p></div><div class="card warn"><h3>Helping verb</h3><p>Works with the main verb but does not show action.</p></div></div><p>Bill Moore <b>has arrived</b> home. The door <b>has been locked</b>.</p>`,remember:"A verb phrase has one or more helping verbs and a main verb."},
  {title:"Common Helping Verbs",body:`<table><thead><tr><th colspan="6">Common Helping Verbs from the Source</th></tr></thead><tbody><tr><td>am</td><td>were</td><td>do</td><td>has</td><td>must</td><td>might</td></tr><tr><td>is</td><td>be</td><td>does</td><td>had</td><td>will</td><td>would</td></tr><tr><td>are</td><td>being</td><td>did</td><td>can</td><td>shall</td><td>should</td></tr><tr><td>was</td><td>been</td><td>have</td><td>may</td><td>could</td><td></td></tr></tbody></table><div class="grid"><div class="card"><p><b>I did</b> my homework.<br><span class="small">did = main verb</span></p></div><div class="card"><p>I <b>did wait</b> for you.<br><span class="small">did = helping; wait = main</span></p></div><div class="card"><p>Bob <b>has</b> it.<br><span class="small">has = main verb</span></p></div><div class="card"><p>Bob <b>has taken</b> it.<br><span class="small">has = helping; taken = main</span></p></div></div>`,remember:"Read the whole sentence; the same word can have different jobs."},
  {title:"Source Exercise 1–5",body:`<p>Find the verb phrase, helping verb, and main verb.</p>${exercise([[1,"In 1803 land between the Missouri River and the Rocky Mountains was sold.","Verb phrase: was sold; helping: was; main: sold"],[2,"The land was bought by the United States.","Verb phrase: was bought; helping: was; main: bought"],[3,"Would anyone explore the land?","Verb phrase: Would explore; helping: Would; main: explore"],[4,"Meriwether Lewis and William Clark were chosen by President Thomas Jefferson.","Verb phrase: were chosen; helping: were; main: chosen"],[5,"They had lived in the wilderness.","Verb phrase: had lived; helping: had; main: lived"]])}`,remember:"The main verb carries the action or being."},
  {title:"Source Exercise 6–15",body:`<p>Find the verb phrase, helping verb or verbs, and main verb.</p>${exercise([[6,"Sacajawea was born in Idaho around 1787.","Verb phrase: was born; helping: was; main: born"],[7,"She had been kidnapped from her tribe.","Verb phrase: had been kidnapped; helping: had been; main: kidnapped"],[8,"In 1805 her husband was hired as a guide for Lewis and Clark.","Verb phrase: was hired; helping: was; main: hired"],[9,"Would Sacajawea go with them?","Verb phrase: Would go; helping: Would; main: go"],[10,"Could they cross the Rocky Mountains on foot?","Verb phrase: Could cross; helping: Could; main: cross"],[11,"Horses would be needed for that part of the trip.","Verb phrase: would be needed; helping: would be; main: needed"],[12,"The woman must have helped the explorers.","Verb phrase: must have helped; helping: must have; main: helped"],[13,"She did know the land along their route.","Verb phrase: did know; helping: did; main: know"],[14,"She could act as interpreter too.","Verb phrase: could act; helping: could; main: act"],[15,"Without her, the expedition might have failed.","Verb phrase: might have failed; helping: might have; main: failed"]])}`,remember:"A verb phrase may have more than one helping verb."},
  {title:"Exam Focus and Easy-to-Confuse Points",body:`<table><thead><tr><th>Term</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>Main verb</b></td><td>Expresses action or being.</td><td>Main = carries the meaning.</td></tr><tr><td><b>Helping verb</b></td><td>Works with the main verb.</td><td>Helper stands beside the main verb.</td></tr><tr><td><b>Verb phrase</b></td><td>One or more helping verbs and a main verb.</td><td>Several verb words work together.</td></tr></tbody></table>`,remember:"Helping verb(s) + main verb = verb phrase."}
 ],
 quiz:[
  q("A verb made up of more than one word is called a ____.",["direct object","verb phrase","predicate noun","action noun"],1,"Verb Phrases","A verb phrase is made up of more than one word."),
  q("What does the main verb express?",["Only place","Only a person","Action or being","A direct object"],2,"Main Verbs","The main verb expresses action or being."),
  q("What does a helping verb do?",["Names a place","Receives action","Renames the subject","Works with the main verb"],3,"Helping Verbs","It works with the main verb."),
  q("Which is the verb phrase in “I will be going home”?",["will be going","I","home","going home"],0,"Verb Phrases","Will be going is the complete verb phrase."),
  q("In “Bill Moore has arrived home,” which word is the main verb?",["has","arrived","home","Bill"],1,"Main Verbs","Arrived carries the action."),
  q("In “Bill Moore has arrived home,” which word is helping?",["Bill","arrived","has","home"],2,"Helping Verbs","Has works with arrived."),
  q("Which set contains only helping verbs from the source list?",["walked, ran","noun, pronoun","arrived, locked","must, might, should"],3,"Helping Verbs","Must, might, and should are on the source list."),
  q("In “I did my homework,” how is did used?",["main verb","helping verb","direct object","linking word"],0,"Main Verbs","Here did is the main verb."),
  q("In “I did wait for you,” how is did used?",["main verb","helping verb","direct object","predicate noun"],1,"Helping Verbs","Did helps the main verb wait."),
  q("What is the main verb in “The land was bought”?",["land","was","bought","the"],2,"Main Verbs","Bought is the main verb."),
  q("What is the helping verb in “Would anyone explore the land”?",["anyone","explore","land","Would"],3,"Helping Verbs","Would helps explore."),
  q("Which is the complete verb phrase in “She had been kidnapped”?",["had been kidnapped","been kidnapped","kidnapped","had been"],0,"Verb Phrases","All three words form the verb phrase."),
  q("Which are the helping verbs in “Horses would be needed”?",["needed","would be","Horses","be needed"],1,"Helping Verbs","Would and be help the main verb needed."),
  q("Which is the main verb in “The woman must have helped”?",["must","have","helped","must have"],2,"Main Verbs","Helped is the main verb."),
  q("Why must you read the whole sentence?",["Every verb is a noun","Helping verbs are always first","Verb phrases never change","A helping verb in one sentence may be a main verb in another"],3,"Main and Helping Verbs","The same word can have different jobs.")
 ]
},
{
 id:"direct",number:"3.3",title:"Direct Objects",summary:"Ask who or what receives the action.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">An action verb is often followed by a noun or a pronoun that tells who or what receives the action.</p><p>The word that receives the action is called the <span class="term">direct object</span>. A direct object can be a noun or a pronoun.</p><div class="flow"><span>Find the action verb</span><b>→</b><span>Ask “whom?” or “what?”</span><b>→</b><span>Find the direct object</span></div>`,remember:"Direct object = noun or pronoun that receives the action."},
  {title:"How to Find a Direct Object",body:`<div class="practice"><div class="qa">The guide <b>helped</b> <mark>Maria</mark>.<br><span class="small">Helped whom?</span></div><div class="qa">The skeleton <b>amazed</b> <mark>everyone</mark>.<br><span class="small">Amazed whom?</span></div><div class="qa">Luke had <b>studied</b> <mark>fossils</mark>.<br><span class="small">Studied what?</span></div><div class="qa">Please <b>notice</b> <mark>them</mark>.<br><span class="small">Notice what?</span></div></div>`,remember:"Ask whom or what after the action verb."},
  {title:"Compound Direct Objects",body:`<p>Some sentences have more than one direct object. This is a <span class="term">compound direct object</span>.</p><div class="practice"><div class="qa">This display <b>featured</b> <mark>plants and animals</mark>.</div><div class="qa">Visitors <b>enjoyed</b> the <mark>computers and rockets</mark>.</div><div class="qa">Some people <b>bought</b> <mark>cards and books</mark>.</div></div>`,remember:"One action verb can send action to two or more direct objects."},
  {title:"Source Exercise 1–8",body:`<p>Find the verb and the direct object. The direct object may be compound.</p>${exercise([[1,"We attended a show on electricity at the science museum.","Verb: attended; direct object: show"],[2,"A huge generator produced light and energy.","Verb: produced; direct object: light and energy"],[3,"Then we saw a model of an Apollo spacecraft.","Verb: saw; direct object: model"],[4,"We examined it closely.","Verb: examined; direct object: it"],[5,"Lauren and Rodrigo watched a film about rockets.","Verb: watched; direct object: film"],[6,"Later we visited the exhibit on natural history.","Verb: visited; direct object: exhibit"],[7,"I like the stuffed giraffes and elephants best.","Verb: like; direct object: giraffes and elephants"],[8,"My friends preferred the dinosaurs and other prehistoric animals.","Verb: preferred; direct object: dinosaurs and other prehistoric animals"]])}`,remember:"The direct object may be one word or compound."},
  {title:"Source Exercise 9–18",body:`<p>Write the action verb and the direct object in each sentence.</p>${exercise([[9,"The Queen of England encouraged Drake in 1577.","Verb: encouraged; direct object: Drake"],[10,"Sir Francis treated the members of his crew well.","Verb: treated; direct object: members"],[11,"He won their respect and loyalty.","Verb: won; direct object: respect and loyalty"],[12,"Drake commanded five ships at once.","Verb: commanded; direct object: ships"],[13,"Two smaller ships carried supplies.","Verb: carried; direct object: supplies"],[14,"They visited many ports in South America.","Verb: visited; direct object: ports"],[15,"Drake’s great voyage benefited England.","Verb: benefited; direct object: England"],[16,"The British people greeted the weary sailors.","Verb: greeted; direct object: sailors"],[17,"The Queen knighted Sir Francis Drake.","Verb: knighted; direct object: Sir Francis Drake"],[18,"She praised him and the entire crew.","Verb: praised; direct object: him and the entire crew"]])}`,remember:"First find the action verb; then ask whom or what."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Term</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>direct object</b></td><td>A noun or pronoun that receives the action of an action verb.</td><td>Action goes directly to it.</td></tr><tr><td><b>compound direct object</b></td><td>More than one direct object receives the action.</td><td>Compound = more than one.</td></tr></tbody></table><ul class="checklist"><li>Find the action verb.</li><li>Ask whom or what receives the action.</li><li>Check whether the answer is a noun or pronoun.</li></ul>`,remember:"Verb + whom or what? = direct object."}

{
 id:"transitive",number:"3.4",title:"Transitive and Intransitive Verbs",summary:"Decide whether an action verb has a direct object.",
 slides:[
  {title:"What You Must Know",body:`<div class="grid"><div class="card good"><h3>Transitive verb</h3><p>An action verb that sends its action to a noun or pronoun in the predicate. The receiver is the direct object.</p></div><div class="card purple"><h3>Intransitive verb</h3><p>An action verb that has no direct object.</p></div></div><p class="lead">The same verb can be transitive in one sentence and intransitive in another.</p>`,remember:"Transitive has a direct object; intransitive does not."},
  {title:"Compare the Same Verb",body:`<table><thead><tr><th>Verb</th><th>Transitive</th><th>Intransitive</th></tr></thead><tbody><tr><td>speak</td><td>The students speak <b>French</b>.</td><td>They speak well.</td></tr><tr><td>study</td><td>We study <b>grammar</b>.</td><td>We study hard.</td></tr></tbody></table><p>Some action verbs are always intransitive. They never have direct objects.</p><p><b>Her eyes twinkled.</b> &nbsp; <b>Carla will listen to her carefully.</b></p>`,remember:"Do not decide by the verb alone; check for a direct object."},
  {title:"Source Exercise 1–10",body:`<p>Find the verb or verb phrase. Label it transitive or intransitive. If transitive, find the direct object.</p>${exercise([[1,"Ann’s family bought her birthday present.","bought — transitive; direct object: present"],[2,"They chose a watch with an orange band.","chose — transitive; direct object: watch"],[3,"Ann wore her new watch to school.","wore — transitive; direct object: watch"],[4,"Now she will know the correct time.","will know — transitive; direct object: time"],[5,"She talks about her present all the time.","talks — intransitive"],[6,"The second hand sweeps around the numbers.","sweeps — intransitive"],[7,"The watch’s colorful face gleams brightly.","gleams — intransitive"],[8,"Ann keeps the watch in its case at night.","keeps — transitive; direct object: watch"],[9,"The numbers glow in the dark.","glow — intransitive"],[10,"Can Ann tell the time without a light?","Can tell — transitive; direct object: time"]])}`,remember:"If the verb has a direct object, it is transitive."},
  {title:"Source Exercise 11–22",body:`<p>Write the verb or verb phrase. Label it transitive or intransitive. Give the direct object when there is one.</p>${exercise([[11,"We laughed at the joke about the flea.","laughed — intransitive"],[12,"Maria explained the joke to them.","explained — transitive; direct object: joke"],[13,"Berto introduced a new riddle to us.","introduced — transitive; direct object: riddle"],[14,"Will his sisters remember the rhyme?","Will remember — transitive; direct object: rhyme"],[15,"Mrs. Garcia chuckled very softly.","chuckled — intransitive"],[16,"She smiled at us.","smiled — intransitive"],[17,"We delighted the Garcias with Granddad’s funny story.","delighted — transitive; direct object: Garcias"],[18,"A good clown can tell jokes without any words.","can tell — transitive; direct object: jokes"],[19,"Maria played the guitar after dinner.","played — transitive; direct object: guitar"],[20,"Everyone listened to the beautiful music.","listened — intransitive"],[21,"The applause surprised Maria.","surprised — transitive; direct object: Maria"],[22,"Then Mr. Garcia also played.","played — intransitive"]])}`,remember:"A phrase after the verb is not always a direct object."},
  {title:"Exam Focus and Easy-to-Confuse Points",body:`<div class="flow"><span>Find the verb or verb phrase</span><b>→</b><span>Look for a direct object</span><b>→</b><span>Has one = transitive<br>No direct object = intransitive</span></div><div class="card warn"><h3>Watch carefully</h3><p><b>Maria played the guitar</b> is transitive because guitar receives the action. <b>Then Mr. Garcia also played</b> is intransitive because no direct object is named.</p></div>`,remember:"T = transfers action to a direct object."}
 ],

{
 id:"linking",number:"3.5",title:"Being Verbs and Linking Verbs",summary:"Link the subject to a noun or adjective.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">Some verbs do not show action. They show what the subject is or is like. Verbs called <span class="term">being verbs</span> show a state of being.</p><p>A being verb is often a <span class="term">linking verb</span>. It links the subject with a word in the predicate that tells more about it.</p><div class="practice"><div class="qa">Mr. Wong <b>became</b> our principal.</div><div class="qa">He <b>seems</b> kind.</div><div class="qa">Mr. Wong <b>feels</b> happy.</div><div class="qa">He <b>had been</b> a teacher for twenty years.</div></div>`,remember:"A linking verb connects the subject to information about it."},
  {title:"Common Being and Linking Verbs",body:`<table><thead><tr><th colspan="6">Common Being Verbs and Linking Verbs</th></tr></thead><tbody><tr><td>am</td><td>are</td><td>were</td><td>be</td><td>been</td><td>look</td></tr><tr><td>feel</td><td>smell</td><td>is</td><td>was</td><td>seem</td><td>being</td></tr><tr><td>become</td><td>appear</td><td>taste</td><td></td><td></td><td></td></tr></tbody></table><p class="small">The source notes that linking verbs never have direct objects.</p>`,remember:"Linking verbs do not send action to a direct object."},
  {title:"Predicate Noun or Predicate Adjective?",body:`<div class="grid"><div class="card good"><h3>Predicate noun</h3><p>Renames the subject.</p><p>Ms. Ide <b>is our coach</b>.<br><span class="small">Ms. Ide = coach</span></p><p>She <b>has become my friend</b>.<br><span class="small">She = friend</span></p></div><div class="card purple"><h3>Predicate adjective</h3><p>Describes the subject.</p><p>Mr. Hill <b>was friendly</b>.</p><p>He <b>appeared shy</b> to strangers.</p></div></div>`,remember:"Noun renames; adjective describes."},
  {title:"Action Verb or Linking Verb?",body:`<p>Some verbs can be either linking verbs or action verbs.</p><table><thead><tr><th>Job</th><th>Example</th><th>What happens?</th></tr></thead><tbody><tr><td><b>Action</b></td><td>Mr. Hill <b>looked at</b> the student murals.</td><td>Looked shows action.</td></tr><tr><td><b>Linking</b></td><td>The designs <b>looked</b> colorful and creative.</td><td>Looked links designs to words that describe them.</td></tr></tbody></table>`,remember:"Read the whole sentence to decide the verb’s job."},
  {title:"Source Exercise 1–7",body:`<p>Find the linking verb and the predicate noun or predicate adjective.</p>${exercise([[1,"The Black Hills are really mountains.","Linking verb: are; mountains — predicate noun"],[2,"Thunderhead Mountain is part of the Black Hills.","Linking verb: is; part — predicate noun"],[3,"Someday the mountaintop will become a huge statue.","Linking verb: will become; statue — predicate noun"],[4,"The statue will be a profile of Chief Crazy Horse.","Linking verb: will be; profile — predicate noun"],[5,"Chief Crazy Horse was a Sioux Indian chief.","Linking verb: was; chief — predicate noun"],[6,"The statue is rough now.","Linking verb: is; rough — predicate adjective"],[7,"The work on it seems slow.","Linking verb: seems; slow — predicate adjective"]])}`,remember:"Ask: does the word rename or describe the subject?"},
  {title:"Source Exercise 8–19",body:`<p>Find the linking verb and the predicate noun or predicate adjective.</p>${exercise([[8,"Six groups eventually became part of the Iroquois nation.","Linking verb: became; part — predicate noun"],[9,"One group was the Mohawks.","Linking verb: was; Mohawks — predicate noun"],[10,"The Mohawks were enemies of another Iroquois group.","Linking verb: were; enemies — predicate noun"],[11,"Hiawatha was a powerful chief of the Mohawks.","Linking verb: was; chief — predicate noun"],[12,"Hiawatha appears heroic in a poem by Longfellow.","Linking verb: appears; heroic — predicate adjective"],[13,"This poem is The Song of Hiawatha.","Linking verb: is; The Song of Hiawatha — predicate noun"],[14,"Hiawatha felt unhappy because of the wars.","Linking verb: felt; unhappy — predicate adjective"],[15,"The chances for peace looked hopeless.","Linking verb: looked; hopeless — predicate adjective"],[16,"Hiawatha became a peacemaker.","Linking verb: became; peacemaker — predicate noun"],[17,"The Iroquois were powerful around 1570.","Linking verb: were; powerful — predicate adjective"],[18,"Their power was great for more than one hundred years.","Linking verb: was; great — predicate adjective"],[19,"Their constitution became a model for other governments.","Linking verb: became; model — predicate noun"]])}`,remember:"Predicate noun renames; predicate adjective describes."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Term</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>being verb</b></td><td>Shows a state of being.</td><td>Shows what the subject is or is like.</td></tr><tr><td><b>linking verb</b></td><td>Links the subject to a word that tells more about it.</td><td>Link = connect.</td></tr><tr><td><b>predicate noun</b></td><td>Renames the subject.</td><td>Noun = new name.</td></tr><tr><td><b>predicate adjective</b></td><td>Describes the subject.</td><td>Adjective = description.</td></tr></tbody></table>`,remember:"Linking verb → predicate noun or predicate adjective."}
 ],

function q(text,choices,answer,topic,explanation){return{text,choices,answer,topic,explanation}}
function shuffleArray(values){const copy=[...values];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function randomizeQuiz(bank){
  let answerSlots=shuffleArray(bank.map((_,i)=>i%4));
  if(answerSlots.every((slot,i)=>slot===i%4)) answerSlots=answerSlots.slice(1).concat(answerSlots[0]);
  return bank.map((item,i)=>{
    const correctChoice=item.choices[item.answer];
    const distractors=shuffleArray(item.choices.filter((_,choiceIndex)=>choiceIndex!==item.answer));
    const choices=[...distractors];
    choices.splice(answerSlots[i],0,correctChoice);
    return {...item,choices,answer:answerSlots[i]};
  });
}
function safe(text){return String(text).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function exercise(items){return `<div class="practice">${items.map(([n,prompt,answer])=>`<div class="qa"><div class="ex-question">${n}. ${safe(prompt)}</div><button class="reveal-btn" type="button" aria-expanded="false">Show Answer</button><div class="ex-answer"><b>Answer:</b> ${safe(answer)}</div></div>`).join("")}</div>`}
function bindReveals(){screen.querySelectorAll(".reveal-btn").forEach(btn=>btn.onclick=()=>{const answer=btn.nextElementSibling,show=!answer.classList.contains("show");answer.classList.toggle("show",show);btn.textContent=show?"Hide Answer":"Show Answer";btn.setAttribute("aria-expanded",String(show))})}

const screen=document.getElementById("screen"),controls=document.getElementById("controls"),counter=document.getElementById("counter"),progressBar=document.getElementById("progressBar");
let mode="menu",lessonIndex=0,slideIndex=0,quizIndex=0,score=0,answered=false,currentQuiz=[],currentQuizSource=[],quizWasFinal=false,mistakes={};

function setProgress(label,percent){counter.textContent=label;progressBar.style.width=Math.max(0,Math.min(100,percent))+"%"}
function button(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.onclick=fn;return b}
function setControls(items){controls.innerHTML="";items.forEach(x=>controls.appendChild(x))}
function renderMenu(){mode="menu";setProgress("Main Menu",0);screen.innerHTML=`<div class="menu-head"><span class="eyebrow">Animated Touchscreen Tutor</span><h1>Unit 3 Verbs</h1><p class="lead">Choose any lesson. Each lesson has a short review and a 15-question quiz.</p></div><div class="menu-grid">${lessons.map((l,i)=>`<button class="menu-card" data-i="${i}"><span class="num">${l.number}</span><h3>${l.title}</h3><p>${l.summary}</p></button>`).join("")}<button class="menu-card wide" id="finalBtn"><span class="num">★</span><h3>Final Lesson Review + 30-Question Quiz</h3><p>Review all five lessons, then check what you remember.</p></button></div>`;screen.querySelectorAll(".menu-card[data-i]").forEach(b=>b.onclick=()=>startLesson(Number(b.dataset.i)));document.getElementById("finalBtn").onclick=startFinalReview;setControls([button("Restart", "secondary", renderMenu)]);window.scrollTo(0,0)}
function startLesson(i){lessonIndex=i;slideIndex=0;mode="lesson";renderSlide()}
function renderSlide(){const l=lessons[lessonIndex],s=l.slides[slideIndex],n=l.slides.length;setProgress(`Slide ${slideIndex+1} of ${n}`,((slideIndex+1)/n)*100);screen.innerHTML=`<span class="eyebrow">Lesson ${l.number} • ${l.title}</span><h2>${s.title}</h2>${s.body}<div class="remember"><b>⭐ Remember:</b> ${s.remember}</div>`;bindReveals();const items=[button("Main Menu","secondary",renderMenu),button("Restart Lesson","secondary",()=>{slideIndex=0;renderSlide()})];if(slideIndex>0)items.push(button("← Back","secondary",()=>{slideIndex--;renderSlide()}));items.push(button(slideIndex===n-1?"Start 15-Question Quiz":"Next →","primary next",()=>{if(slideIndex<n-1){slideIndex++;renderSlide()}else startQuiz(l.quiz)}));setControls(items);window.scrollTo(0,0)}
function startQuiz(bank,isFinal=false){mode=isFinal?"finalQuiz":"lessonQuiz";currentQuizSource=bank;quizWasFinal=isFinal;currentQuiz=randomizeQuiz(bank);quizIndex=0;score=0;answered=false;mistakes={};renderQuestion()}
function renderQuestion(){const item=currentQuiz[quizIndex];setProgress(`Question ${quizIndex+1} of ${currentQuiz.length}`,((quizIndex+1)/currentQuiz.length)*100);screen.innerHTML=`<div class="quiz-meta"><span>${mode==="finalQuiz"?"Final Quiz":lessons[lessonIndex].title+" Quiz"}</span><span>Score: ${score}</span></div><h2 class="question">${item.text}</h2><div class="choices">${item.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="letter">${"ABCD"[i]}</span>${c}</button>`).join("")}</div><div class="feedback" id="feedback"></div>`;screen.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));setControls([button("Main Menu","secondary",renderMenu),button("Restart Quiz","secondary",()=>startQuiz(currentQuizSource,quizWasFinal))]);window.scrollTo(0,0)}
function answer(chosen){if(answered)return;answered=true;const item=currentQuiz[quizIndex],buttons=[...screen.querySelectorAll(".choice")],correct=chosen===item.answer;buttons.forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add("correct");if(i===chosen&&!correct)b.classList.add("wrong")});if(correct)score++;else mistakes[item.topic]=(mistakes[item.topic]||0)+1;const f=document.getElementById("feedback");f.className="feedback show "+(correct?"ok":"no");f.innerHTML=`<strong>${correct?"✅ Correct!":"❌ Incorrect."}</strong><br>${correct?"":`Correct answer: <b>${"ABCD"[item.answer]}. ${item.choices[item.answer]}</b><br>`}${item.explanation}`;setControls([button("Main Menu","secondary",renderMenu),button(quizIndex===currentQuiz.length-1?"See Results":"Next Question →","primary next",()=>{quizIndex++;answered=false;if(quizIndex<currentQuiz.length)renderQuestion();else renderResults()})])}
function renderResults(){mode="result";const pct=Math.round(score/currentQuiz.length*100),review=Object.entries(mistakes).sort((a,b)=>b[1]-a[1]);setProgress("Quiz Complete",100);screen.innerHTML=`<div class="result"><span class="eyebrow">Quiz Complete</span><h1>${pct>=80?"Great work!":pct>=60?"Good effort!":"Keep reviewing!"}</h1><div class="score-ring" style="--score:${pct*3.6}deg"><span>${score}/${currentQuiz.length}</span></div><p class="lead">You scored ${pct}%.</p></div><div class="review-list"><h3>Topics to Review</h3>${review.length?`<ul>${review.map(x=>`<li><b>${x[0]}</b> — ${x[1]} missed</li>`).join("")}</ul>`:`<p>Excellent! No review topic was identified.</p>`}</div>`;const items=[button("Main Menu","secondary",renderMenu),button("Try Again","gold",()=>startQuiz(currentQuizSource,quizWasFinal))];if(!quizWasFinal)items.push(button("Final Review","primary next",startFinalReview));setControls(items);window.scrollTo(0,0)}
function startFinalReview(){mode="finalReview";slideIndex=0;renderFinalReview()}
const reviewSlides=[
 {title:"Lesson Review — The Five Big Ideas",body:`<div class="grid"><div class="card"><h3>Action verb</h3><p>Tells what the subject does or did. The action may be visible or invisible.</p></div><div class="card"><h3>Verb phrase</h3><p>One or more helping verbs plus a main verb.</p></div><div class="card"><h3>Direct object</h3><p>A noun or pronoun that receives the action.</p></div><div class="card"><h3>Transitive / Intransitive</h3><p>Has a direct object / has no direct object.</p></div><div class="card wide"><h3>Being and Linking Verbs</h3><p>Show a state of being or link the subject to a predicate noun or predicate adjective.</p></div></div>`,remember:"First identify the verb; then decide what job it does."},
 {title:"Easy-to-Confuse Points",body:`<table><thead><tr><th>Do not mix up</th><th>Difference</th></tr></thead><tbody><tr><td>Visible vs invisible action</td><td>Both can be action verbs.</td></tr><tr><td>Main vs helping verb</td><td>The main verb expresses action or being; the helper works with it.</td></tr><tr><td>Transitive vs intransitive</td><td>Only a transitive verb has a direct object.</td></tr><tr><td>Predicate noun vs predicate adjective</td><td>A noun renames; an adjective describes.</td></tr><tr><td>Action vs linking verb</td><td>Read the whole sentence because the same verb may do either job.</td></tr></tbody></table>`,remember:"Look at the verb’s job in the whole sentence."},
 {title:"Final 4-Minute Review",body:`<h3>Remember These Before the Test</h3><ul class="checklist"><li>An action verb tells what the subject does or did.</li><li>A verb phrase has helping verb(s) and a main verb.</li><li>To find a direct object, ask whom or what after the action verb.</li><li>Transitive = has a direct object; intransitive = no direct object.</li><li>A linking verb connects the subject to information about it.</li><li>A predicate noun renames the subject.</li><li>A predicate adjective describes the subject.</li></ul>`,remember:"Verb → job → receiver or subject information."}
];
function renderFinalReview(){const s=reviewSlides[slideIndex],n=reviewSlides.length;setProgress(`Final Review ${slideIndex+1} of ${n}`,((slideIndex+1)/n)*100);screen.innerHTML=`<span class="eyebrow">All Lessons</span><h2>${s.title}</h2>${s.body}<div class="remember"><b>⭐ Remember:</b> ${s.remember}</div>`;const items=[button("Main Menu","secondary",renderMenu)];if(slideIndex>0)items.push(button("← Back","secondary",()=>{slideIndex--;renderFinalReview()}));items.push(button(slideIndex===n-1?"Start Final Quiz":"Next →","primary next",()=>{if(slideIndex<n-1){slideIndex++;renderFinalReview()}else startQuiz(finalQuestions,true)}));setControls(items);window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(mode==="lesson"&&e.key==="ArrowRight"&&slideIndex<lessons[lessonIndex].slides.length-1){slideIndex++;renderSlide()}else if(mode==="lesson"&&e.key==="ArrowLeft"&&slideIndex>0){slideIndex--;renderSlide()}});
renderMenu();
</script>
</body>
</html>
