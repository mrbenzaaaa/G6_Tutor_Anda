function q(text,choices,answer,topic,explanation){return{text,choices,answer,topic,explanation}}
function ex(n,prompt,answer){return[n,prompt,answer]}
function esc(v){return String(v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function exercise(items,intro){return `<p>${intro}</p><div class="exercise-grid">${items.map(([n,p,a])=>`<div class="exercise-card"><div class="exercise-q">${n}. ${esc(p)}</div><button class="reveal" type="button" aria-expanded="false">Show Answer</button><div class="answer-box"><b>Answer:</b> <mark>${esc(a)}</mark></div></div>`).join("")}</div>`}
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomizeQuiz(bank){let slots=shuffle(bank.map((_,i)=>i%4));if(slots.every((x,i)=>x===i%4))slots=slots.slice(1).concat(slots[0]);return bank.map((item,i)=>{const correct=item.choices[item.answer],others=shuffle(item.choices.filter((_,j)=>j!==item.answer)),choices=[...others];choices.splice(slots[i],0,correct);return{...item,choices,answer:slots[i]}})}

const lessons=[
{
 id:"simple",number:"3.6",title:"Simple Verb Tenses",summary:"Present, past, and future tenses.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">The <span class="term">tense</span> of a verb tells when the action or state of being takes place. Present, past, and future are called <span class="term">simple tenses</span>.</p><div class="grid three"><div class="card good"><h3>Present</h3><p>Happening now.</p><p>The dancers <b>perform</b> outdoors.</p></div><div class="card purple"><h3>Past</h3><p>Already happened.</p><p>The audience <b>applauded</b>.</p></div><div class="card warn"><h3>Future</h3><p>Going to happen.</p><p>Gail and Tim <b>will be</b> late.</p></div></div>`,remember:"Verb tense tells when something happens."},
  {title:"Present Tense Rules",body:`<table><thead><tr><th>Situation</th><th>Rule</th><th>Source Example</th></tr></thead><tbody><tr><td>Singular subject</td><td>Add <b>-s</b> to most verbs.</td><td>Luis <b>runs</b>.</td></tr><tr><td>Verb ends in s, x, z, ch, sh</td><td>Add <b>-es</b>.</td><td>He <b>watches</b>.</td></tr><tr><td>Consonant + y</td><td>Change y to i and add <b>-es</b>.</td><td>Aki <b>cries</b>.</td></tr><tr><td>Plural subject</td><td>Do not change the verb.</td><td>They <b>hurry</b>.</td></tr></tbody></table>`,remember:"Singular often changes the verb; plural keeps the basic form."},
  {title:"Past and Future Rules",body:`<table><thead><tr><th>Tense</th><th>Rule</th><th>Source Example</th></tr></thead><tbody><tr><td>Past</td><td>Add -ed to most verbs.</td><td>talk → talked</td></tr><tr><td>Past: short verb ending in consonant</td><td>Double the consonant; add -ed.</td><td>bat → batted</td></tr><tr><td>Past: verb ending in e</td><td>Drop e; add -ed.</td><td>hope → hoped</td></tr><tr><td>Past: consonant + y</td><td>Change y to i; add -ed.</td><td>try → tried</td></tr><tr><td>Future</td><td>Use will or shall + basic verb.</td><td>will hop; shall fly</td></tr></tbody></table>`,remember:"Future = will or shall + the basic verb."},
  {title:"Source Exercise 1–6",body:exercise([ex(1,"The Olympic games started in ancient Greece.","started — past"),ex(2,"Today’s Olympics developed from Greek festivals.","developed — past"),ex(3,"Until the seventy-seventh festival, the games lasted only one day.","lasted — past"),ex(4,"Now they last for two weeks.","last — present"),ex(5,"Olympic athletes become heroes to the public.","become — present"),ex(6,"Thousands of people will attend the next Olympics.","will attend — future")],"Identify the tense of the underlined verb. Tap Show Answer after you decide."),remember:"Present = now; past = already; future = going to happen."},
  {title:"Source Exercise 7–14",body:exercise([ex(7,"plant","past: planted; future: will plant"),ex(8,"subtract","past: subtracted; future: will subtract"),ex(9,"rent","past: rented; future: will rent"),ex(10,"move","past: moved; future: will move"),ex(11,"call","past: called; future: will call"),ex(12,"invite","past: invited; future: will invite"),ex(13,"decide","past: decided; future: will decide"),ex(14,"clean","past: cleaned; future: will clean")],"Write the past tense and future tense of each verb."),remember:"Check the ending before forming the past tense."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Keyword</th><th>Teacher Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>tense</b></td><td>Tells when the action or state of being takes place.</td><td>Tense = time.</td></tr><tr><td><b>present tense</b></td><td>Something is happening now.</td><td>Present = now.</td></tr><tr><td><b>past tense</b></td><td>Something has already happened.</td><td>Past = finished before now.</td></tr><tr><td><b>future tense</b></td><td>Something is going to happen.</td><td>Look for will or shall.</td></tr></tbody></table>`,remember:"Know the meaning and formation of all three simple tenses."}
 ],
 quiz:[
  q("What does the tense of a verb tell?",["When the action or state of being takes place","Who the subject is","Where the action happens","How many nouns appear"],0,"Simple Tenses","Tense tells when the action or state of being takes place."),
  q("Which are the three simple tenses?",["First, second, third","Present, past, future","Singular, plural, compound","Action, being, helping"],1,"Simple Tenses","Present, past, and future are the simple tenses."),
  q("What does present tense tell?",["Something already happened","Something will happen","Something is happening now","Something never happens"],2,"Present Tense","Present tense tells that something is happening now."),
  q("What does past tense tell?",["Something is happening now","Something is going to happen","Something may happen","Something has already happened"],3,"Past Tense","Past tense tells that something has already happened."),
  q("What usually forms the future tense?",["will or shall + basic verb","-ed only","has + past participle","-s with every subject"],0,"Future Tense","The future usually uses will or shall with the basic verb."),
  q("Which verb is in the past tense?",["perform","applauded","will attend","become"],1,"Past Tense","Applauded names an action that already happened."),
  q("Which verb phrase is in the future tense?",["lasted","become","will attend","developed"],2,"Future Tense","Will attend tells what is going to happen."),
  q("For a present-tense verb ending in ch with a singular subject, what is added?",["-ed","-ing","-s","-es"],3,"Present Tense Rules","A verb ending in ch takes -es with a singular subject."),
  q("Choose the correct past tense of hope.",["hoped","hopeed","hoppped","will hope"],0,"Past Tense Rules","Drop the final e and add -ed."),
  q("Choose the correct past tense of try.",["tryed","tried","tries","trying"],1,"Past Tense Rules","Change y to i and add -ed."),
  q("Choose the correct past tense of bat.",["bated","bats","batted","will bat"],2,"Past Tense Rules","Double the final consonant and add -ed."),
  q("Which sentence from the source is present tense?",["The games lasted one day.","Thousands will attend.","The Olympics developed from festivals.","Olympic athletes become heroes."],3,"Present Tense","Become is present tense in that sentence."),
  q("What are the past and future forms of move?",["moved; will move","moveed; shall moved","moves; moved","moving; will moved"],0,"Forming Tenses","Move becomes moved and will move."),
  q("What are the past and future forms of invite?",["invitted; invite","invited; will invite","invites; invited","inviting; shall invited"],1,"Forming Tenses","Invite becomes invited and will invite."),
  q("A plural subject in the present tense usually uses which verb form?",["The form ending in -ed","The form with will","The unchanged basic form","The form ending in -es"],2,"Present Tense Rules","With a plural subject, the form of the verb is not changed."),
  q("Which past form of be agrees with a singular subject?",["are","were","was","be"],2,"Past Tense","The source says the past tense of be is was or were; a singular subject uses was."),
  q("Complete the source sentence: We ___ save the seats for them.",["shall","did","have","are"],0,"Future Tense","Shall with the basic verb save forms the future tense."),
  q("Choose the singular present form of cry for Aki.",["cry","crys","cried","cries"],3,"Present Tense Rules","Change consonant + y to i and add -es."),
  q("What is the past tense of rent?",["rent","rented","rentted","will rent"],1,"Past Tense Rules","For this verb, add -ed to form rented."),
  q("What are the past and future forms of clean?",["cleaned; will clean","clean; cleaned","cleant; shall cleaned","cleaning; will cleaned"],0,"Forming Tenses","Clean becomes cleaned in the past and will clean in the future.")
 ]

{
 id:"perfect",number:"3.7",title:"Perfect Tenses",summary:"Principal parts and present, past, future perfect.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">All verb tenses come from four basic forms called the <span class="term">principal parts</span>.</p><table><thead><tr><th>Verb</th><th>Present Participle</th><th>Past</th><th>Past Participle</th></tr></thead><tbody><tr><td>work</td><td>(is) working</td><td>worked</td><td>(has) worked</td></tr><tr><td>share</td><td>(is) sharing</td><td>shared</td><td>(has) shared</td></tr><tr><td>cry</td><td>(is) crying</td><td>cried</td><td>(has) cried</td></tr><tr><td>hop</td><td>(is) hopping</td><td>hopped</td><td>(has) hopped</td></tr></tbody></table><p>The present participle and past participle are always used with a helping verb.</p>`,remember:"Principal parts: verb, present participle, past, past participle."},
  {title:"How Perfect Tenses Are Formed",body:`<p>Each <span class="term">perfect tense</span> uses a form of <b>have</b> and a <b>past participle</b>. The past participle stays the same; the helping verb changes.</p><div class="flow"><span>form of have</span><b>+</b><span>past participle</span><b>=</b><span>perfect tense</span></div><table><thead><tr><th>Subject</th><th>Forms of have</th></tr></thead><tbody><tr><td>I</td><td>have, had</td></tr><tr><td>you</td><td>have, had</td></tr><tr><td>he, she, it, singular nouns</td><td>has, had</td></tr><tr><td>we, they, plural nouns</td><td>have, had</td></tr></tbody></table>`,remember:"Perfect tense = have + past participle."},
  {title:"Compare the Perfect Tenses",body:`<table><thead><tr><th>Tense</th><th>Use</th><th>Source Example</th></tr></thead><tbody><tr><td><b>Present perfect</b></td><td>Action at an indefinite past time; it may still be going on.</td><td>The band <b>has played</b> two songs.</td></tr><tr><td><b>Past perfect</b></td><td>Past action completed before another past action.</td><td>The band <b>had played</b> before you arrived.</td></tr><tr><td><b>Future perfect</b></td><td>Action completed before another future action.</td><td>The band <b>will have played</b> before the concert ends.</td></tr></tbody></table>`,remember:"has/have = present; had = past; will have = future perfect."},
  {title:"Source Exercise 1–10",body:exercise([ex(1,"Give the present participle, past, and past participle of hike.","hiking; hiked; hiked"),ex(2,"Give the present participle, past, and past participle of wait.","waiting; waited; waited"),ex(3,"Give the present participle, past, and past participle of drop.","dropping; dropped; dropped"),ex(4,"Give the present participle, past, and past participle of ban.","banning; banned; banned"),ex(5,"Give the present participle, past, and past participle of dry.","drying; dried; dried"),ex(6,"Give the present participle, past, and past participle of walk.","walking; walked; walked"),ex(7,"Kate had learned that music before.","had learned — past perfect"),ex(8,"She has practiced it over and over.","has practiced — present perfect"),ex(9,"By the time she performs it, she will have rehearsed it a dozen times.","will have rehearsed — future perfect"),ex(10,"Had you ever listened to the piece before Kate played it?","Had listened — past perfect")],"Answer each principal-parts or perfect-tense question."),remember:"The helping verb shows which perfect tense is used."},
  {title:"Source Exercise 11–18",body:exercise([ex(11,"Give the present perfect, past perfect, and future perfect of climb using he or she.","has climbed; had climbed; will have climbed"),ex(12,"Give the three perfect forms of press.","has pressed; had pressed; will have pressed"),ex(13,"Give the three perfect forms of bury.","has buried; had buried; will have buried"),ex(14,"Give the three perfect forms of stop.","has stopped; had stopped; will have stopped"),ex(15,"Give the three perfect forms of copy.","has copied; had copied; will have copied"),ex(16,"Give the three perfect forms of rub.","has rubbed; had rubbed; will have rubbed"),ex(17,"Give the three perfect forms of reply.","has replied; had replied; will have replied"),ex(18,"Give the three perfect forms of plan.","has planned; had planned; will have planned")],"Use he or she as the subject."),remember:"Keep the past participle; change the form of have."},
  {title:"Source Exercise 19–23",body:exercise([ex(19,"Many types of trumpets ___ appeared since then. (present perfect)","have"),ex(20,"By the Middle Ages, trumpets ___ reached a length of six feet or more. (past perfect)","had"),ex(21,"The trumpet ___ included valves since the 1820s. (present perfect)","has"),ex(22,"Who knows what changes trumpeters ___ invented a few hundred years from now? (future perfect)","will have"),ex(23,"___ music ___ changed drastically by then? (future perfect)","Will; have")],"Write the correct form of have for the tense shown."),remember:"Match have, has, had, or will have to the tense and subject."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Keyword</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>principal parts</b></td><td>The four basic forms of a verb.</td><td>Four forms build all tenses.</td></tr><tr><td><b>present participle</b></td><td>A principal part always used with a helping verb.</td><td>Source examples use is + -ing.</td></tr><tr><td><b>past participle</b></td><td>A principal part always used with a helping verb.</td><td>Perfect tenses use this part.</td></tr><tr><td><b>perfect tenses</b></td><td>A form of have plus the past participle.</td><td>Have + past participle.</td></tr></tbody></table>`,remember:"Know the four principal parts and the three perfect tenses."}

{
 id:"regular",number:"3.8",title:"Regular and Irregular Verbs",summary:"Recognize how past forms are made.",
 slides:[
  {title:"What You Must Know",body:`<div class="grid"><div class="card good"><h3>Regular verb</h3><p>The past and past participle are formed by adding <b>-ed</b>.</p></div><div class="card purple"><h3>Irregular verb</h3><p>The past and past participle are formed in some other way.</p></div></div><p class="lead">Many commonly used verbs are irregular. Their principal parts need to be memorized.</p>`,remember:"-ed pattern = regular; another pattern = irregular."},
  {title:"Regular Verb Spelling",body:`<table><thead><tr><th>Ending</th><th>Rule</th><th>Source Example</th></tr></thead><tbody><tr><td>consonant + y</td><td>Change y to i before -ed.</td><td>cry → cried</td></tr><tr><td>one vowel + one consonant</td><td>Double the consonant before -ed.</td><td>hop → hopped</td></tr><tr><td>final e</td><td>Drop the e before -ed.</td><td>file → filed</td></tr></tbody></table>`,remember:"Check the final letters before adding -ed."},
  {title:"Important Irregular Principal Parts",body:`<table><thead><tr><th>Verb</th><th>Past</th><th>Past Participle</th></tr></thead><tbody><tr><td>be</td><td>was</td><td>been</td></tr><tr><td>do</td><td>did</td><td>done</td></tr><tr><td>drive</td><td>drove</td><td>driven</td></tr><tr><td>fly</td><td>flew</td><td>flown</td></tr><tr><td>ring</td><td>rang</td><td>rung</td></tr><tr><td>see</td><td>saw</td><td>seen</td></tr><tr><td>speak</td><td>spoke</td><td>spoken</td></tr><tr><td>take</td><td>took</td><td>taken</td></tr><tr><td>write</td><td>wrote</td><td>written</td></tr></tbody></table>`,remember:"Do not add -ed to an irregular form unless the source shows it."},
  {title:"Source Exercise 1–6",body:exercise([ex(1,"Give the principal parts of steal. Is it regular or irregular?","steal, stealing, stole, stolen — irregular"),ex(2,"Give the principal parts of ring. Is it regular or irregular?","ring, ringing, rang, rung — irregular"),ex(3,"Give the principal parts of mail. Is it regular or irregular?","mail, mailing, mailed, mailed — regular"),ex(4,"Give the principal parts of tear. Is it regular or irregular?","tear, tearing, tore, torn — irregular"),ex(5,"Give the principal parts of love. Is it regular or irregular?","love, loving, loved, loved — regular"),ex(6,"Give the principal parts of do. Is it regular or irregular?","do, doing, did, done — irregular")],"Give the principal parts and classify each verb."),remember:"The past and past participle reveal whether a verb is regular."},
  {title:"Source Exercise 7–17",body:exercise([ex(7,"Have you (took, taken) art classes?","taken — irregular"),ex(8,"Randy has (study, studied) art since kindergarten.","studied — regular"),ex(9,"My instructor (be, was) a portrait painter for years.","was — irregular"),ex(10,"What (made, make) this work of art better than the others?","made — irregular"),ex(11,"I have (saw, seen) oil paintings and watercolors.","seen — irregular"),ex(12,"I have (wrote, written) about the paintings.","written — irregular"),ex(13,"Our art class has (did, done) good work.","done"),ex(14,"Our teacher (spoke, spoken) to us about our work.","spoke"),ex(15,"Have you (took, taken) art classes?","taken"),ex(16,"I have (wrote, written) captions for my drawings.","written"),ex(17,"Each student has (make, made) a clay sculpture.","made")],"Choose the correct form shown in parentheses."),remember:"After has or have, use the past participle."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Keyword</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>regular verb</b></td><td>Past and past participle are formed by adding -ed.</td><td>Regular follows the -ed pattern.</td></tr><tr><td><b>irregular verb</b></td><td>Past and past participle are formed another way.</td><td>Irregular forms must be learned.</td></tr></tbody></table><p><b>Exam focus:</b> Know when a sentence needs the past form and when it needs the past participle.</p>`,remember:"Helping verbs such as has and have need the past participle."}
 ],

{
 id:"agreement",number:"3.9",title:"Subject-Verb Agreement",summary:"Match singular and plural subjects and verbs.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">A verb and its subject must <span class="term">agree in number</span>. Use a singular verb with a singular subject and a plural verb with a plural subject.</p><div class="grid"><div class="card good"><h3>Singular</h3><p>The boy <b>calls</b>.</p><p>The girl <b>races</b>.</p></div><div class="card purple"><h3>Plural</h3><p>The boys <b>call</b>.</p><p>The boy and the girl <b>race</b>.</p></div></div>`,remember:"Singular matches singular; plural matches plural."},
  {title:"Present Tense Agreement",body:`<ul class="checklist"><li>Singular present-tense verbs usually end in <b>-s</b> or <b>-es</b>.</li><li>With the singular subject <b>I</b> or <b>you</b>, the verb does not end in -s or -es.</li><li>Plural present-tense verbs usually do not end in -s.</li><li>A compound subject joined by <b>and</b> usually takes a plural verb.</li></ul>`,remember:"In present tense, the singular verb often has the final s."},
  {title:"Agreement with the Verb Be",body:`<table><thead><tr><th>Subject</th><th>Present</th><th>Past</th></tr></thead><tbody><tr><td>I</td><td>am</td><td>was</td></tr><tr><td>he, she, it, singular nouns</td><td>is</td><td>was</td></tr><tr><td>we, you, they, plural nouns</td><td>are</td><td>were</td></tr></tbody></table><p>The verb <b>be</b> does not follow the usual rules. Its forms must be memorized.</p>`,remember:"I am/was; he is/was; we and they are/were."},
  {title:"Source Exercise 1–5",body:exercise([ex(1,"Horses and ponies (is, are) important to people.","are"),ex(2,"Often a horse and a rider (become, becomes) good friends.","become"),ex(3,"In many different jobs, a horse (work, works) hard.","works"),ex(4,"Some farmers (plow, plows) their fields with horses.","plow"),ex(5,"Horses (is, are) helpful to ranchers.","are")],"Choose the verb that agrees with the subject."),remember:"A subject joined by and usually takes a plural verb."},
  {title:"Source Exercise 6–14",body:exercise([ex(6,"Horses ___ different in size, color, strength, and speed. (be)","are"),ex(7,"The largest horses ___ six feet tall. (stand)","stand"),ex(8,"A very large horse ___ a weight of up to two thousand pounds. (reach)","reaches"),ex(9,"A pony ___ a horse under fifty-eight inches tall. (be)","is"),ex(10,"The workhorse and the racehorse ___ special abilities. (have)","have"),ex(11,"A workhorse often ___ extremely heavy loads. (pull)","pulls"),ex(12,"A racehorse ___ faster than thirty miles an hour. (run)","runs"),ex(13,"The coats of pintos ___ splashed with color. (appear)","appear"),ex(14,"For this reason, people ___ them ‘paints.’ (call)","call")],"Write the correct present-tense form."),remember:"First find whether the subject is singular or plural."},
  {title:"Source Exercise 15–19",body:exercise([ex(15,"Often police officers ___ horses in their work. (ride)","ride"),ex(16,"Ranchers ___ great distances on horseback. (cover)","cover"),ex(17,"A horse ___ good and bad treatment. (remember)","remembers"),ex(18,"A good rider ___ a horse with patience. (treat)","treats"),ex(19,"These animals ___ people in many ways. (help)","help")],"Complete each sentence with a verb that agrees."),remember:"Ignore nearby nouns; match the verb with its subject."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Point</th><th>Rule</th></tr></thead><tbody><tr><td>Singular subject</td><td>Use a singular verb.</td></tr><tr><td>Plural subject</td><td>Use a plural verb.</td></tr><tr><td>Compound subject with and</td><td>Usually use a plural verb.</td></tr><tr><td>Verb be</td><td>Memorize am/is/are and was/were.</td></tr></tbody></table>`,remember:"Find the subject first, then choose the matching verb."}
 ],

{
 id:"moreagreement",number:"3.10",title:"More Subject-Verb Agreement",summary:"Agreement with or, either, neither, here, and there.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">When <b>or</b>, <b>either...or</b>, or <b>neither...nor</b> joins a compound subject, the verb may be singular or plural.</p><div class="grid"><div class="card"><h3>Both plural</h3><p>Use a plural verb.</p><p>Books or magazines <b>were</b> on the table.</p></div><div class="card"><h3>Both singular</h3><p>Use a singular verb.</p><p>Neither Jim nor Sally <b>is</b> without a book.</p></div></div>`,remember:"Both plural → plural verb; both singular → singular verb."},
  {title:"One Singular and One Plural",body:`<p>If one part is singular and one part is plural, make the verb agree with the subject <span class="term">closer to it</span>.</p><div class="grid"><div class="card good"><p>Neither Ted nor his <b>friends like</b> mystery books.</p></div><div class="card purple"><p>Either the twins or <b>Maria belongs</b> to a book group.</p></div></div>`,remember:"With or/nor, look at the closer subject."},
  {title:"Sentences Beginning with Here or There",body:`<p><b>Here</b> or <b>there</b> is never the subject. First find the real subject; then match the verb.</p><div class="practice"><p>Here <b>is</b> the <b>index</b>.</p><p>Here <b>are</b> the <b>sisters</b>.</p><p>There <b>are</b> <b>Ms. Ryan and Mr. Knox</b>.</p><p>There <b>are</b> the online <b>catalogs</b>.</p></div>`,remember:"Ask: Who or what is here or there?"},
  {title:"Source Exercise 1–6",body:exercise([ex(1,"Either our school library or the city library (is, are) open.","is"),ex(2,"There (is, are) the dictionaries.","are"),ex(3,"Either books or magazines (is, are) excellent references.","are"),ex(4,"Neither the atlas nor the dictionary (is, are) on the shelf.","is"),ex(5,"Here (is, are) an atlas and a map.","are"),ex(6,"Either the librarian or the online catalogs (is, are) available.","are")],"Choose the correct verb."),remember:"Find the real subject or the closer subject before choosing."},
  {title:"Source Exercise 7–17",body:exercise([ex(7,"There (was, were) no cars before the late 1800s.","were"),ex(8,"Either trains or horses (was, were) used to go places.","were"),ex(9,"There (is, are) a model of the first car in this museum.","is"),ex(10,"Here (is, are) an old Model T and a Maxwell.","are"),ex(11,"Either the Model T or the Oakland (was, were) purchased by many.","was"),ex(12,"There (was, were) also Hudsons on the road.","were"),ex(13,"Either steam or electricity (was, were) used for cars.","was"),ex(14,"Neither steam cars nor electric cars (was, were) fast.","were"),ex(15,"There (was, were) no trucks or buses at first.","were"),ex(16,"Neither tolls nor a speed limit (was, were) in use.","was"),ex(17,"Neither cars nor roads today (looks, look) like early ones.","look")],"Choose the verb that agrees with the subject."),remember:"With neither...nor, use the closer subject when the numbers differ."},
  {title:"Source Exercise 18–21",body:exercise([ex(18,"Either my great-grandmother or my great-grandfather (remembers, remember) the Stanley Steamer.","remembers"),ex(19,"Either horse-drawn carriages or buggies (was, were) popular before the invention of the car.","were"),ex(20,"Now cars or buses (is, are) used for most travel.","are"),ex(21,"American cars or foreign cars (is, are) popular today.","are")],"Complete each agreement sentence."),remember:"Check both subject parts and the word nearest the verb."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Pattern</th><th>What to Do</th></tr></thead><tbody><tr><td>and</td><td>Usually use a plural verb.</td></tr><tr><td>or / either...or / neither...nor</td><td>Match the closer subject when the parts differ.</td></tr><tr><td>here / there</td><td>Find the real subject; here or there is not the subject.</td></tr></tbody></table>`,remember:"Agreement depends on the real subject, not the first word."}
 ],

{
 id:"contractions",number:"3.11",title:"Contractions",summary:"Shortened forms, apostrophes, and verb phrases.",
 slides:[
  {title:"What You Must Know",body:`<p class="lead">A <span class="term">contraction</span> is a word formed by combining two words and shortening one of them. An apostrophe takes the place of the letter or letters left out.</p><div class="grid"><div class="card"><p>we’re = we are</p><p>I’ll = I will</p></div><div class="card purple"><p>they’ve = they have</p><p>I’m = I am</p></div></div>`,remember:"Apostrophe = missing letter or letters."},
  {title:"Contractions with Is Has and Not",body:`<p>An apostrophe and s (<b>’s</b>) can mean <b>is</b> or <b>has</b>. Read the whole sentence.</p><p>He’s measuring the water. (<b>He is</b>)<br>It’s been two minutes. (<b>It has</b>)</p><p>In most contractions with <b>not</b>, the apostrophe replaces the o: isn’t, aren’t, wasn’t, weren’t, don’t, didn’t, can’t, couldn’t, shouldn’t, wouldn’t, doesn’t, hasn’t, haven’t. <b>won’t</b> means will not.</p>`,remember:"Read the whole sentence to decide whether ’s means is or has."},
  {title:"Contractions and Verb Phrases",body:`<p>Only the verb part of a contraction belongs to the verb phrase. <b>not</b> and <b>n’t</b> are never part of a verb phrase.</p><div class="grid"><div class="card good"><p>He’ll mix carefully.</p><p>Contraction: <b>he will</b><br>Verb phrase: <b>will mix</b></p></div><div class="card warn"><p>Kenneth shouldn’t add too much acid.</p><p>Contraction: <b>should not</b><br>Verb phrase: <b>should add</b></p></div></div><p class="small">Tip from the source: you’re = you are; your = belonging to you.</p>`,remember:"Leave not and n’t out of the verb phrase."},
  {title:"Source Exercise 1–5",body:exercise([ex(1,"I’m working with a group of scientists.","I’m = I am; verb phrase: am working"),ex(2,"They’re studying the history of the earth.","They’re = They are; verb phrase: are studying"),ex(3,"They’ve already looked at the earth of the present.","They’ve = They have; verb phrase: have looked"),ex(4,"Now they’ll imagine the earth a million years ago.","they’ll = they will; verb phrase: will imagine"),ex(5,"They won’t publish their research for several months.","won’t = will not; verb phrase: will publish")],"Identify the two words in each contraction and the verb phrase."),remember:"The verb phrase uses the verb, not the word not."},
  {title:"Source Exercise 6–14",body:exercise([ex(6,"The scientists haven’t completed their project.","haven’t = have not; verb phrase: have completed"),ex(7,"They’re studying a damaged forest in Washington.","They’re = They are; verb phrase: are studying"),ex(8,"We’ve seen the volcano nearby.","We’ve = We have; verb phrase: have seen"),ex(9,"It’s throwing ash onto the trees of the forest.","It’s = It is; verb phrase: is throwing"),ex(10,"Now the trees aren’t looking very healthy.","aren’t = are not; verb phrase: are looking"),ex(11,"One scientist hasn’t taken samples of the soil yet.","hasn’t = has not; verb phrase: has taken"),ex(12,"Another one can’t finish his research.","can’t = cannot; verb phrase: can finish"),ex(13,"The problems couldn’t be solved easily.","couldn’t = could not; verb phrase: could be solved"),ex(14,"They’ll write a report about the project next year.","They’ll = They will; verb phrase: will write")],"Write the contraction, the words that form it, and the verb phrase."),remember:"Expand the contraction before finding the verb phrase."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Keyword</th><th>Meaning</th><th>Memory Tip</th></tr></thead><tbody><tr><td><b>contraction</b></td><td>A shortened form made by combining two words.</td><td>Apostrophe marks missing letters.</td></tr><tr><td><b>verb phrase</b></td><td>The verb words working together.</td><td>Do not include not or n’t.</td></tr></tbody></table>`,remember:"Expand first; then identify the verb phrase."}
 ],

  q("What can ’s stand for in a contraction?",["was or were","do or did","is or has","will or shall"],2,"Contractions","The source says ’s can stand for is or has."),
  q("Which word is never part of a verb phrase?",["will","have","should","not"],3,"Verb Phrases","Not and n’t are not part of the verb phrase."),
  q("What does I’m mean?",["I am","I will","I have","I was"],0,"Contractions","I’m is the contraction for I am."),
  q("What does they’ve mean?",["they will","they have","they are","they had"],1,"Contractions","They’ve means they have."),
  q("What is the verb phrase in “They won’t publish”?",["won’t publish","not publish","will publish","they will"],2,"Verb Phrases","Not is excluded, leaving will publish."),
  q("What does won’t mean?",["would not","was not","were not","will not"],3,"Contractions","Won’t means will not."),
  q("What is the verb phrase in “I’m working”?",["am working","I am","I’m","working with"],0,"Verb Phrases","Expand I’m to I am; the verb phrase is am working."),
  q("What does they’ll mean?",["they have","they will","they are","they shall not"],1,"Contractions","They’ll means they will."),
  q("What is the verb phrase in “The scientists haven’t completed”?",["haven’t completed","not completed","have completed","scientists completed"],2,"Verb Phrases","N’t is excluded from the verb phrase."),
  q("What is the verb phrase in “The problems couldn’t be solved”?",["couldn’t be","not be solved","be solved","could be solved"],3,"Verb Phrases","Exclude not; the full verb phrase is could be solved."),
  q("In “It’s throwing ash,” what does It’s mean?",["It is","It has","It was","It will"],0,"Contractions","The whole sentence shows that It’s means It is."),
  q("Which pair is explained by the source tip?",["there and their","you’re and your","its and it’s only","were and where"],1,"Contractions","The source contrasts you’re = you are and your = belonging to you."),
  q("Why should you read the whole sentence when you see ’s?",["To find a plural noun","To add punctuation","To decide whether it means is or has","To change the tense"],2,"Contractions","Sentence clues show whether ’s means is or has."),
  q("What is the verb phrase in “The scientists haven’t completed”?",["have completed","haven’t completed","not completed","scientists have"],0,"Verb Phrases","Expand haven’t to have not and leave not out of the verb phrase."),
  q("What is the verb phrase in “We’ve seen the volcano”?",["We have","have seen","We’ve seen","seen the volcano"],1,"Verb Phrases","We’ve means we have, so the verb phrase is have seen."),
  q("In “It’s throwing ash,” which two words form It’s?",["It has","It was","It is","It will"],2,"Contractions","The sentence uses It is throwing."),
  q("What is the verb phrase in “The trees aren’t looking healthy”?",["aren’t looking","not looking","trees are","are looking"],3,"Verb Phrases","N’t is not part of the verb phrase, so the answer is are looking."),
  q("What is the verb phrase in “Another one can’t finish”?",["cannot finish","can finish","not finish","one can"],1,"Verb Phrases","Can’t means cannot, and not is left out of the verb phrase.")
 ]
},
{
 id:"sitset",number:"3.12",title:"sit, set; lie, lay; rise, raise",summary:"Choose among three confusing verb pairs.",
 slides:[
  {title:"What You Must Know",body:`<table><thead><tr><th>Verb</th><th>Meaning</th><th>Source Example</th></tr></thead><tbody><tr><td><b>sit</b></td><td>to rest in an upright position</td><td>I sit in the chair.</td></tr><tr><td><b>set</b></td><td>to put or place an object</td><td>I set the cup down.</td></tr><tr><td><b>lie</b></td><td>to rest or recline</td><td>I lie on the blanket.</td></tr><tr><td><b>lay</b></td><td>to put or place an object</td><td>I lay the book on the shelf.</td></tr></tbody></table>`,remember:"Rest: sit/lie. Put an object: set/lay."},
  {title:"Rise and Raise",body:`<table><thead><tr><th>Verb</th><th>Meaning</th><th>Source Example</th></tr></thead><tbody><tr><td><b>rise</b></td><td>to get up or go up</td><td>We rise early.</td></tr><tr><td><b>raise</b></td><td>to move something up, grow something, or increase something</td><td>They raise their hands. Farmers raise corn. Ed will raise his fee.</td></tr></tbody></table>`,remember:"Ask “Raise what?” If there is an answer, use raise; otherwise use rise."},
  {title:"How to Choose",body:`<div class="flow"><span>Is the subject resting?</span><b>→</b><span>Use sit or lie</span></div><div class="flow"><span>Is the subject putting an object somewhere?</span><b>→</b><span>Use set or lay</span></div><div class="flow"><span>Does “raise what?” have an answer?</span><b>→</b><span>Yes: raise<br>No: rise</span></div>`,remember:"Look for an object after set, lay, or raise."},
  {title:"Source Exercise 1–8",body:exercise([ex(1,"You may (set, sit) next to me.","sit"),ex(2,"He will (lie, lay) that board down here.","lay"),ex(3,"You can’t (lie, lay) on that.","lie"),ex(4,"I (set, sit) the chairs here so that people can (set, sit).","set; sit"),ex(5,"Sarah (rises, raises) hens on a farm in Virginia.","raises"),ex(6,"She (rises, raises) early to feed the chickens.","rises"),ex(7,"The chickens come when Sarah (rises, raises) her hand.","raises"),ex(8,"Next year her family will (rise, raise) their prices.","raise")],"Choose the correct verb."),remember:"An object follows set, lay, and raise."},
  {title:"Source Exercise 9–17",body:exercise([ex(9,"My cat is hurt! It (lies, lays) outside the window.","lies"),ex(10,"Dad can (sit, set) its broken leg in a splint.","set"),ex(11,"I will (lie, lay) my cat on a blanket in a box.","lay"),ex(12,"We can (sit, set) the box in the kitchen.","set"),ex(13,"I will (sit, set) next to it for a while.","sit"),ex(14,"The sun (rises, raises) early in the morning.","rises"),ex(15,"I won’t (rise, raise) the window shade.","raise"),ex(16,"Then maybe my cat will (lie, lay) in its box longer.","lie"),ex(17,"If you (rise, raise) your voice, you might wake it.","raise")],"Choose the verb that correctly completes each sentence."),remember:"Ask what the subject is doing and whether an object receives the action."},
  {title:"Source Exercise 18–21",body:exercise([ex(18,"My brother (rises, raises) early to make breakfast.","rises"),ex(19,"He (sits, sets) a large bowl of hot oatmeal on the table.","sets"),ex(20,"I will quickly (sit, set) down to eat.","sit"),ex(21,"My brother (lies, lays) the morning paper on the kitchen counter.","lays")],"Choose the correct word."),remember:"Resting uses sit/lie; placing an object uses set/lay."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Without an object</th><th>With an object</th></tr></thead><tbody><tr><td>sit — rest upright</td><td>set — put an object</td></tr><tr><td>lie — rest or recline</td><td>lay — put an object</td></tr><tr><td>rise — get or go up</td><td>raise — move/grow/increase something</td></tr></tbody></table>`,remember:"Sit–set, lie–lay, rise–raise: check the meaning and the object."}
 ],
 quiz:[

  q("What does set mean?",["To rest upright","To put or place an object","To get up","To receive instruction"],1,"Sit and Set","Set means to put or place an object."),
  q("What does lie mean?",["To increase something","To place an object","To rest or recline","To grow something"],2,"Lie and Lay","Lie means to rest or recline."),
  q("What does lay mean?",["To rest upright","To go up","To recline","To put or place an object"],3,"Lie and Lay","Lay means to put or place an object."),
  q("Choose: You may ___ next to me.",["sit","set","lay","raise"],0,"Sit and Set","The subject rests upright, so use sit."),
  q("Choose: He will ___ that board down here.",["lie","lay","sit","rise"],1,"Lie and Lay","The board is an object being placed."),
  q("Choose: She ___ early to feed the chickens.",["raises","raise","rises","sets"],2,"Rise and Raise","She gets up, so use rises."),
  q("Choose: Sarah ___ her hand.",["rises","rise","sets","raises"],3,"Rise and Raise","Her hand is the object being moved up."),
  q("Choose: Dad can ___ its broken leg in a splint.",["set","sit","lie","rise"],0,"Sit and Set","The leg is the object being placed."),
  q("Choose: My cat ___ outside the window.",["lays","lies","sets","raises"],1,"Lie and Lay","The cat is resting, so use lies."),
  q("Choose: The sun ___ early.",["raises","raise","rises","lays"],2,"Rise and Raise","The sun goes up; no object follows."),
  q("Choose: I won’t ___ the window shade.",["rise","sit","lie","raise"],3,"Rise and Raise","The shade is the object being moved."),
  q("Which question helps choose between rise and raise?",["Raise what?","Sit where?","Lie when?","Set why?"],0,"Rise and Raise","If Raise what? has an answer, use raise."),
  q("Choose both words: I ___ the chairs so people can ___.",["sit; set","set; sit","lay; lie","raise; rise"],1,"Sit and Set","Set places the chairs; sit describes resting."),
  q("Choose: My brother ___ the morning paper on the counter.",["lies","rises","lays","sits"],2,"Lie and Lay","The paper is the object being placed."),
  q("Choose: You can’t ___ on that.",["lay","lie","set","raise"],1,"Lie and Lay","The subject is resting or reclining, so use lie."),
  q("Choose: I will ___ my cat on a blanket.",["lay","lie","sit","rise"],0,"Lie and Lay","The cat is the object being placed, so use lay."),
  q("Choose: We can ___ the box in the kitchen.",["sit","lie","set","rise"],2,"Sit and Set","The box is an object being placed, so use set."),
  q("Choose: If you ___ your voice, you might wake it.",["rise","raise","sit","lie"],1,"Rise and Raise","Voice is the object being increased, so use raise."),
  q("Choose: He ___ a bowl of oatmeal on the table.",["sits","lies","rises","sets"],3,"Sit and Set","The bowl is an object being placed, so use sets.")
 ]
},
{
 id:"lendborrow",number:"3.13",title:"lend, borrow; let, leave; teach, learn",summary:"Choose among three more confusing pairs.",
 slides:[
  {title:"Lend and Borrow",body:`<div class="grid"><div class="card good"><h3>Lend</h3><p>Means <b>to give temporarily</b>.</p><p>Will you lend me your boots?</p></div><div class="card purple"><h3>Borrow</h3><p>Means <b>to take temporarily</b>.</p><p>May I borrow them for a hike?</p></div></div>`,remember:"Lend = give for a while; borrow = take for a while."},
  {title:"Let and Leave",body:`<table><thead><tr><th>Verb</th><th>Meaning</th><th>Source Example</th></tr></thead><tbody><tr><td><b>let</b></td><td>to permit</td><td>My brothers let me go with them.</td></tr><tr><td><b>leave</b></td><td>to go away or allow to remain in one place</td><td>Tomorrow we leave. I will leave my camera in the tent.</td></tr></tbody></table>`,remember:"Let = permit; leave = go away or remain."},
  {title:"Teach and Learn",body:`<div class="grid"><div class="card good"><h3>Teach</h3><p>Means <b>to give instruction</b>.</p><p>Alice will teach tennis.</p></div><div class="card purple"><h3>Learn</h3><p>Means <b>to get or receive instruction</b>.</p><p>Babies learn very fast.</p></div></div>`,remember:"Teacher gives instruction; learner receives it."},
  {title:"Source Exercise 1–10",body:exercise([ex(1,"Shari can (teach, learn) how to ski this weekend.","learn"),ex(2,"Her uncle will (teach, learn) her.","teach"),ex(3,"Next winter she will (teach, learn) to ski on larger slopes.","learn"),ex(4,"Her uncle will also (teach, learn) her brother.","teach"),ex(5,"Her brother will (teach, learn) the basics.","learn"),ex(6,"Did I (let, leave) my umbrella at your house?","leave"),ex(7,"Please (leave, let) me go outside.","let"),ex(8,"We should (let, leave) before sunset.","leave"),ex(9,"Please (lend, borrow) me your umbrella.","lend"),ex(10,"Please return it if you (lend, borrow) it.","borrow")],"Choose the correct word."),remember:"Ask who gives, takes, permits, leaves, teaches, or learns."},
  {title:"Source Exercise 11–18",body:exercise([ex(11,"I must (teach, learn) myself the library’s new system.","teach"),ex(12,"Do you want me to (teach, learn) you?","teach"),ex(13,"Yes, I don’t think I can (teach, learn) it on my own.","learn"),ex(14,"(Let, Leave) us start at the beginning.","Let"),ex(15,"Will you (let, leave) me ask a question first?","let"),ex(16,"May I (borrow, lend) your instruction manual?","borrow"),ex(17,"Yes, I can (borrow, lend) that to you.","lend"),ex(18,"Thanks. Just (let, leave) it on the table for me.","leave")],"Choose the verb that correctly completes each sentence."),remember:"Borrower takes; lender gives."},
  {title:"Source Exercise 19–22",body:exercise([ex(19,"Then I can (teach, learn) other people what I know.","teach"),ex(20,"Did you remember the flashlight I wanted to (borrow, lend) from you?","borrow"),ex(21,"I was going to (borrow, lend) it to you and (let, leave) you keep it for a week.","lend; let"),ex(22,"I promise not to (let, leave) it out in the rain.","leave")],"Complete the final source exercises."),remember:"Use the direction of the action: give or take, instruct or receive."},
  {title:"Exam Focus and Lesson Review",body:`<table><thead><tr><th>Word</th><th>Meaning</th></tr></thead><tbody><tr><td><b>lend</b></td><td>give temporarily</td></tr><tr><td><b>borrow</b></td><td>take temporarily</td></tr><tr><td><b>let</b></td><td>permit</td></tr><tr><td><b>leave</b></td><td>go away or allow to remain</td></tr><tr><td><b>teach</b></td><td>give instruction</td></tr><tr><td><b>learn</b></td><td>get or receive instruction</td></tr></tbody></table>`,remember:"Three pairs: give/take, permit/go away, give/get instruction."}
 ],
 quiz:[

  q("What does borrow mean?",["To go away","To take temporarily","To give instruction","To allow to remain"],1,"Lend and Borrow","Borrow means to take temporarily."),

const finalQuestions=[...lessons.map(l=>l.quiz[0]),...lessons.map(l=>l.quiz[4]),...lessons.map(l=>l.quiz[8]),...lessons.slice(0,6).map(l=>l.quiz[13])];
const screen=document.getElementById("screen"),controls=document.getElementById("controls"),counter=document.getElementById("counter"),progressBar=document.getElementById("progressBar");
let mode="menu",lessonIndex=0,slideIndex=0,quizIndex=0,score=0,answered=false,currentQuiz=[],currentSource=[],quizWasFinal=false,mistakes={};
function setProgress(label,pct){counter.textContent=label;progressBar.style.width=Math.max(0,Math.min(100,pct))+"%"}
function btn(label,cls,fn){const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.onclick=fn;return b}
function setControls(items){controls.innerHTML="";items.forEach(x=>controls.appendChild(x))}
function bindReveal(){screen.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{const box=b.nextElementSibling,show=!box.classList.contains("show");box.classList.toggle("show",show);b.textContent=show?"Hide Answer":"Show Answer";b.setAttribute("aria-expanded",String(show))})}
function renderMenu(){mode="menu";setProgress("Main Menu",0);screen.innerHTML=`<div class="menu-head"><span class="eyebrow">Animated Touchscreen Tutor</span><h1>Unit 3 Verbs Continued</h1><p class="lead">Choose Lessons 3.6–3.13. Each lesson ends with a randomized 20-question quiz.</p></div><div class="menu-grid">${lessons.map((l,i)=>`<button class="menu-card" data-i="${i}"><span class="num">${l.number}</span><h3>${l.title}</h3><p>${l.summary}</p></button>`).join("")}<button class="menu-card wide" id="final"><span class="num">★</span><h3>Final Lesson Review + 30-Question Quiz</h3><p>Review all eight lessons, then check what you remember.</p></button></div>`;screen.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>startLesson(Number(b.dataset.i)));document.getElementById("final").onclick=startFinalReview;setControls([btn("Restart","secondary",renderMenu)]);window.scrollTo(0,0)}
function startLesson(i){lessonIndex=i;slideIndex=0;mode="lesson";renderSlide()}
function renderSlide(){const l=lessons[lessonIndex],s=l.slides[slideIndex],n=l.slides.length;setProgress(`Slide ${slideIndex+1} of ${n}`,100*(slideIndex+1)/n);screen.innerHTML=`<span class="eyebrow">Lesson ${l.number} • ${l.title}</span><h2>${s.title}</h2>${s.body}<div class="remember"><b>⭐ Remember:</b> ${s.remember}</div>`;bindReveal();const items=[btn("Main Menu","secondary",renderMenu),btn("Restart Lesson","secondary",()=>{slideIndex=0;renderSlide()})];if(slideIndex>0)items.push(btn("← Back","secondary",()=>{slideIndex--;renderSlide()}));items.push(btn(slideIndex===n-1?"Start 20-Question Quiz":"Next →","primary next",()=>{if(slideIndex<n-1){slideIndex++;renderSlide()}else startQuiz(l.quiz,false)}));setControls(items);window.scrollTo(0,0)}
function startQuiz(bank,isFinal){mode=isFinal?"finalQuiz":"lessonQuiz";currentSource=bank;quizWasFinal=isFinal;currentQuiz=randomizeQuiz(bank);quizIndex=0;score=0;answered=false;mistakes={};renderQuestion()}
function renderQuestion(){const item=currentQuiz[quizIndex];setProgress(`Question ${quizIndex+1} of ${currentQuiz.length}`,100*(quizIndex+1)/currentQuiz.length);screen.innerHTML=`<div class="quiz-meta"><span>${quizWasFinal?"Final Quiz":lessons[lessonIndex].number+" "+lessons[lessonIndex].title+" Quiz"}</span><span>Score: ${score}</span></div><h2 class="question">${item.text}</h2><div class="choices">${item.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${"ABCD"[i]}</span>${c}</button>`).join("")}</div><div class="feedback" id="feedback"></div>`;screen.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));setControls([btn("Main Menu","secondary",renderMenu),btn("Restart Quiz","secondary",()=>startQuiz(currentSource,quizWasFinal))]);window.scrollTo(0,0)}
function answer(chosen){if(answered)return;answered=true;const item=currentQuiz[quizIndex],buttons=[...screen.querySelectorAll(".choice")],correct=chosen===item.answer;buttons.forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add("correct");if(i===chosen&&!correct)b.classList.add("wrong")});if(correct)score++;else mistakes[item.topic]=(mistakes[item.topic]||0)+1;const f=document.getElementById("feedback");f.className="feedback show "+(correct?"ok":"no");f.innerHTML=`<b>${correct?"✅ Correct!":"❌ Incorrect."}</b><br>${correct?"":`Correct answer: <b>${"ABCD"[item.answer]}. ${item.choices[item.answer]}</b><br>`}${item.explanation}`;setControls([btn("Main Menu","secondary",renderMenu),btn(quizIndex===currentQuiz.length-1?"See Results":"Next Question →","primary next",()=>{quizIndex++;answered=false;if(quizIndex<currentQuiz.length)renderQuestion();else renderResults()})])}
function renderResults(){mode="result";const pct=Math.round(100*score/currentQuiz.length),review=Object.entries(mistakes).sort((a,b)=>b[1]-a[1]);setProgress("Quiz Complete",100);screen.innerHTML=`<div class="result"><span class="eyebrow">Quiz Complete</span><h1>${pct>=80?"Great work!":pct>=60?"Good effort!":"Keep reviewing!"}</h1><div class="score-ring" style="--score:${pct*3.6}deg"><span>${score}/${currentQuiz.length}</span></div><p class="lead">You scored ${pct}%.</p></div><div class="review-list"><h3>Topics to Review</h3>${review.length?`<ul>${review.map(x=>`<li><b>${x[0]}</b> — ${x[1]} missed</li>`).join("")}</ul>`:`<p>Excellent! No review topic was identified.</p>`}</div>`;const items=[btn("Main Menu","secondary",renderMenu),btn("Try Again","gold",()=>startQuiz(currentSource,quizWasFinal))];if(!quizWasFinal)items.push(btn("Final Review","primary next",startFinalReview));setControls(items);window.scrollTo(0,0)}
const reviews=[
 {title:"Lesson Review — Tenses and Verb Forms",body:`<div class="grid"><div class="card"><h3>Simple Tenses</h3><p>Present = now; past = already; future = going to happen.</p></div><div class="card"><h3>Perfect Tenses</h3><p>Form of have + past participle.</p></div><div class="card"><h3>Regular Verbs</h3><p>Past and past participle use -ed.</p></div><div class="card"><h3>Irregular Verbs</h3><p>Past forms are made another way and must be learned.</p></div></div>`,remember:"Choose the time first; then choose the correct verb form."},
 {title:"Lesson Review — Agreement and Contractions",body:`<div class="grid"><div class="card"><h3>Agreement</h3><p>Singular subject → singular verb. Plural subject → plural verb.</p></div><div class="card"><h3>Or and Nor</h3><p>When numbers differ, match the subject closer to the verb.</p></div><div class="card"><h3>Here and There</h3><p>Find the real subject; here or there is not the subject.</p></div><div class="card"><h3>Contractions</h3><p>An apostrophe replaces missing letters. Do not include not in the verb phrase.</p></div></div>`,remember:"Find the subject and expand contractions before answering."},
 {title:"Final 4-Minute Review",body:`<h3>Remember These Before the Test</h3><ul class="checklist"><li>Simple tense tells present, past, or future time.</li><li>Perfect tense uses have plus a past participle.</li><li>Regular verbs follow the -ed pattern; irregular verbs do not.</li><li>The subject and verb must agree in number.</li><li>With or/nor, check the closer subject.</li><li>Contractions use apostrophes for missing letters.</li><li>Sit/lie/rise do not place an object; set/lay/raise do.</li><li>Lend/teach give; borrow/learn receive.</li></ul>`,remember:"Meaning + sentence clues + subject agreement lead to the answer."}
];
function startFinalReview(){mode="review";slideIndex=0;renderReview()}
function renderReview(){const s=reviews[slideIndex],n=reviews.length;setProgress(`Final Review ${slideIndex+1} of ${n}`,100*(slideIndex+1)/n);screen.innerHTML=`<span class="eyebrow">All Lessons</span><h2>${s.title}</h2>${s.body}<div class="remember"><b>⭐ Remember:</b> ${s.remember}</div>`;const items=[btn("Main Menu","secondary",renderMenu)];if(slideIndex>0)items.push(btn("← Back","secondary",()=>{slideIndex--;renderReview()}));items.push(btn(slideIndex===n-1?"Start Final Quiz":"Next →","primary next",()=>{if(slideIndex<n-1){slideIndex++;renderReview()}else startQuiz(finalQuestions,true)}));setControls(items);window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(mode==="lesson"&&e.key==="ArrowRight"&&slideIndex<lessons[lessonIndex].slides.length-1){slideIndex++;renderSlide()}else if(mode==="lesson"&&e.key==="ArrowLeft"&&slideIndex>0){slideIndex--;renderSlide()}});
renderMenu();
</script>
</body>
