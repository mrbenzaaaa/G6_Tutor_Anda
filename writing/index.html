<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Writing Tutor</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f1ff;
      color:#2f2a3d;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{
      width:min(720px,100%);
      background:#fff;
      border:2px solid #dfd6f3;
      border-radius:24px;
      padding:28px;
      box-shadow:0 10px 30px rgba(47,42,61,.10);
    }
    h1{
      margin:0 0 10px;
      color:#6d4aa2;
      font-size:clamp(30px,6vw,46px);
    }
    p{
      color:#746f82;
      font-size:18px;
      margin:0 0 22px;
    }
    a{
      display:block;
      text-decoration:none;
      background:#f8f5ff;
      border:2px solid #d8c8f2;
      border-radius:18px;
      padding:20px;
      color:#5d3f92;
      font-weight:800;
      font-size:24px;
      -webkit-tap-highlight-color:transparent;
    }
    a:active{transform:scale(.99)}
    .file{
      margin-top:6px;
      font-size:14px;
      font-weight:normal;
      color:#7d748d;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>✍️ Writing Tutor</h1>
    <p>Select a lesson:</p>

    <a href="c1l1.html">
      Chapter 1 · Lesson 1
      <div class="file">c1l1.html</div>
    </a>
  </main>
</body>
</html>
