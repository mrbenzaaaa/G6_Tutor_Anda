<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no">
<title>Geography Touchscreen Tutor</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}html{-webkit-text-size-adjust:100%;}body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-family:Arial,sans-serif;background:#eef7ff;color:#17324d}.app{max-width:1100px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,40px);margin:0;color:#174a87}.sub{color:#617995}
.progress{height:10px;background:#d5e4f5;border-radius:99px;overflow:hidden;margin:14px 0}#bar{height:100%;background:#1f6feb;transition:.25s}
.card{background:white;border:2px solid #cee1f4;border-radius:24px;padding:clamp(18px,3vw,34px);min-height:570px}h2{font-size:clamp(30px,4vw,48px);color:#174a87;margin:0 0 18px}p{font-size:clamp(18px,2vw,24px);line-height:1.5}
.def,.grid>div,.three>div,.twocol>div,.stack>div{background:#f6faff;border:2px solid #d9e8f7;border-radius:16px;padding:16px;font-size:clamp(18px,2vw,23px)}
.grid,.twocol,.three{display:grid;gap:14px;margin-top:16px}.grid,.twocol{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.stack{display:grid;gap:12px}.big{font-size:70px;text-align:center;margin:26px}
.remember{margin-top:20px;background:#fff3bd;border-left:7px solid #f0b400;border-radius:16px;padding:16px;font-size:clamp(20px,2.2vw,27px)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}button{min-height:54px;padding:12px 22px;border-radius:14px;border:2px solid #bad2ec;background:#fff;color:#174a87;font-size:20px;font-weight:bold;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}button.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}button:disabled{opacity:.4}
.status{font-size:18px;color:#637b95;font-weight:bold;margin-bottom:8px}#quiz{display:none}.quiztop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ans{text-align:left;min-height:70px;background:#f8fbff}.ans.correct{background:#e6f7ec;border-color:#5aab72}.ans.wrong{background:#ffe9e9;border-color:#d97070}.feedback{font-size:21px;font-weight:bold;min-height:60px;padding:14px 0}.final{text-align:center}.final .scorebig{font-size:60px;font-weight:bold;color:#174a87}
@media(max-width:700px){.grid,.twocol,.three,.answers{grid-template-columns:1fr}.card{min-height:650px}.big{font-size:52px}.nav button{flex:1;padding:10px}}
</style></head>
<body><div class="app">
<div class="top"><div><h1>Chapter 2 · Lesson 1: Studying Geography</h1><div class="sub">Touchscreen Teaching Slides + 40-Question Quiz</div></div><button id="restart">↻ Restart</button></div>
<div class="progress"><div id="bar"></div></div>
<section id="lesson"><div id="slideStatus" class="status"></div><div id="slide" class="card"></div><div class="nav"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div></section>
<section id="quiz"><div class="quiztop"><div id="qStatus" class="status"></div><div id="score" class="status">Score: 0/0</div></div><div class="card"><h2 id="qText"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="nextQ" class="primary" style="display:none;width:100%">Next Question →</button><div id="final" class="final" style="display:none"></div></div></section>
</div>

<script>
window.onerror=function(message,source,line,column,error){
  try{
    var box=document.createElement('div');
    box.style.cssText='margin:12px;padding:12px;border:2px solid #d97070;background:#fff1f1;border-radius:12px;font-family:Arial,sans-serif;';
    box.innerHTML='<b>Safari script error</b><br>'+String(message)+'<br>Line: '+String(line||'');
    document.body.insertBefore(box,document.body.firstChild);
  }catch(e){}
  return false;
};

var slides=[{"title": "🌎 Welcome to Studying Geography", "body": "<p>Geographers study the Earth, places, people, and how information about them is shown.</p><div class='grid'><div>📍 Identify locations</div><div>🗺️ Show and read maps</div><div>📊 Organize information</div><div>👥 Study population and culture</div></div>", "remember": "Find locations → Show Earth → Read maps → Organize information → Study people"}, {"title": "🌍 Hemisphere", "body": "<div class='def'><b>Teacher definition:</b><br>a “half sphere,” used to refer to one-half of a globe when divided into North and South or East and West</div><p><b>Easy meaning:</b> half of the globe.</p>", "remember": "Hemisphere → half of the globe"}, {"title": "📍 Latitude", "body": "<div class='def'><b>Teacher definition:</b><br>imaginary lines that circle the Earth parallel to the Equator</div><p><b>Latitude measures distance north or south of the Equator.</b></p><p>The Equator is at <b>0° latitude</b>.</p>", "remember": "Latitude → Equator → measure North/South"}, {"title": "🧭 Longitude", "body": "<div class='def'><b>Teacher definition:</b><br>imaginary lines that circle the Earth from Pole to Pole, measuring distance east or west of the Prime Meridian</div><p>The Prime Meridian is at <b>0° longitude</b>.</p>", "remember": "Longitude → Prime Meridian → measure East/West"}, {"title": "⚡ Latitude vs. Longitude", "body": "<div class='twocol'><div><h3>📍 Latitude</h3><p>Parallel to Equator</p><p>Measures North/South</p></div><div><h3>🧭 Longitude</h3><p>Pole to Pole</p><p>Measures East/West of Prime Meridian</p></div></div>", "remember": "Latitude → Equator → North/South | Longitude → Prime Meridian → East/West"}, {"title": "📐 Degrees and Minutes", "body": "<p>Locations can be written using <b>degrees (°)</b> and <b>minutes (′)</b>.</p><p>Minutes are points between degrees.</p><div class='def'><b>Textbook example — Empire State Building:</b><br>Latitude: <b>40° 44′ North</b><br>Longitude: <b>73° 59′ West</b></div>", "remember": "Location = Latitude + Longitude | Degrees = ° | Minutes = ′"}, {"title": "🗺️ Projection", "body": "<div class='def'><b>Teacher definition:</b><br>a way of showing the round Earth on a flat map</div><div class='big'>🌎 → 🗺️</div>", "remember": "Projection → round Earth on a flat map"}, {"title": "⚠️ Distort", "body": "<div class='def'><b>Teacher definition:</b><br>to twist out of shape or change the size of</div><p>Maps distort the size and shape of land masses because they are flat and the Earth is round.</p>", "remember": "Round Earth → Flat Map → Distortion"}, {"title": "🗺️ Types of Maps", "body": "<div class='three'><div><h3>🏞️ Physical Map</h3><p>a map that shows land and water features</p></div><div><h3>🏳️ Political Map</h3><p>a map that shows the names and borders of countries</p></div><div><h3>🎯 Special-purpose Map</h3><p>a map that shows themes or patterns such as climate, natural resources, or population</p></div></div>", "remember": "Physical → land & water | Political → names & borders | Special-purpose → themes or patterns"}, {"title": "📏 Reading Maps", "body": "<p>Maps typically include a scale, compass rose, and map key.</p><div class='three'><div><h3>📏 Scale</h3><p>a measuring line that shows distances on a map</p></div><div><h3>🧭 Compass Rose</h3><p>helps show direction</p></div><div><h3>🔑 Map Key</h3><p>helps explain symbols</p></div></div>", "remember": "Scale → distance | Compass rose → direction | Map key → symbols"}, {"title": "🧭 Cardinal Directions", "body": "<div class='def'><b>Teacher definition:</b><br>north, south, east, and west</div>", "remember": "North, South, East, West"}, {"title": "🔑 Symbol", "body": "<div class='def'><b>Teacher definition:</b><br>a sign or image that stands for something else</div>", "remember": "Symbol → a sign or image that stands for something else"}, {"title": "🎨 Choropleth", "body": "<div class='def'><b>Teacher definition:</b><br>a special purpose map that uses color to show population density</div><div class='big'>🟨 🟧 🟥</div>", "remember": "Choropleth → COLOR → Population Density"}, {"title": "🌎 Six Essential Elements — 1 to 3", "body": "<div class='stack'><div><b>1. World in Spatial Terms</b><p>Geographers look at where a place is located.</p><strong>Where is it? → Location</strong></div><div><b>2. Places and Regions</b><p>Geographers study what a place is like and group places with common characteristics.</p><strong>What is the place like? → Characteristics</strong></div><div><b>3. Physical Systems</b><p>Geographers study physical systems that shape Earth's surface and how living things depend on their surroundings.</p><strong>Nature</strong></div></div>", "remember": "World in Spatial Terms → Location | Places and Regions → Characteristics | Physical Systems → Nature"}, {"title": "🌎 Six Essential Elements — 4 to 6", "body": "<div class='stack'><div><b>4. Human Systems</b><p>Geographers study how people have shaped the world, where people settle, and the movement of people, ideas, and goods.</p></div><div><b>5. Environment and Society</b><p>Geographers study the relationship between people and their natural surroundings.</p></div><div><b>6. The Uses of Geography</b><p>Geography helps us understand relationships among people, places, and environments and can help us in daily life.</p></div></div>", "remember": "Human Systems → People | Environment and Society → People ↔ Environment | Uses of Geography → How geography helps us"}, {"title": "🧠 Six Elements Super Memory", "body": "<div class='stack'><div><b>Where?</b> → World in Spatial Terms</div><div><b>What is it like?</b> → Places and Regions</div><div><b>Nature</b> → Physical Systems</div><div><b>People</b> → Human Systems</div><div><b>People ↔ Environment</b> → Environment and Society</div><div><b>How geography helps us</b> → The Uses of Geography</div></div>", "remember": "Where? → What is it like? → Nature → People → People & Environment → Uses"}, {"title": "📊 Charts, Graphs, and Diagrams", "body": "<p><b>Charts, graphs, and diagrams are all visual ways of organizing information.</b></p><div class='big'>📊 📈 🧩</div>", "remember": "Charts + Graphs + Diagrams → visual ways of organizing information"}, {"title": "👥 Population, Migration, and Culture", "body": "<p>Geographers and historians both study population and culture.</p><div class='twocol'><div><h3>🚶 Migration</h3><p>the movement of people from one place to settle in another place</p></div><div><h3>👥 Culture</h3><p>the set of beliefs, behaviors, and traits shared by a group of people</p></div></div>", "remember": "Migration → people move to settle | Culture → beliefs + behaviors + traits"}, {"title": "🧩 Theme and Awareness", "body": "<div class='twocol'><div><h3>🧩 Theme</h3><p>a topic that is studied or a special quality that connects ideas</p></div><div><h3>💡 Awareness</h3><p>the state of having understanding or knowledge</p></div></div>", "remember": "Theme → topic / connects ideas | Awareness → understanding or knowledge"}, {"title": "✅ Final Review", "body": "<div class='stack'><div>📍 Latitude → Equator → North/South</div><div>🧭 Longitude → Prime Meridian → East/West</div><div>📐 ° = degrees | ′ = minutes</div><div>🗺️ Projection → round Earth on flat map</div><div>⚠️ Distort → change shape or size</div><div>🎨 Choropleth → color + population density</div><div>🚶 Migration → people move to settle</div><div>👥 Culture → beliefs + behaviors + traits</div></div>", "remember": "You are ready for the 40-question quiz!"}];
var questions=[["Which term means one-half of a globe?", ["Hemisphere", "Projection", "Scale", "Theme"], 0, "Hemisphere refers to one-half of a globe."], ["Which lines circle Earth parallel to the Equator?", ["Longitude", "Latitude", "Cardinal directions", "Projection"], 1, "Latitude lines circle Earth parallel to the Equator."], ["Latitude measures distance...", ["east or west of Prime Meridian", "north or south of Equator", "between borders", "between symbols"], 1, "Latitude measures north or south of the Equator."], ["Which lines circle Earth from Pole to Pole?", ["Latitude", "Longitude", "Scale", "Hemisphere"], 1, "Longitude lines circle Earth from Pole to Pole."], ["Longitude measures distance...", ["north or south of Equator", "east or west of Prime Meridian", "between symbols", "between countries"], 1, "Longitude measures east or west of the Prime Meridian."], ["Which pairing is correct?", ["Latitude → Equator", "Latitude → Prime Meridian", "Longitude → Equator", "Scale → Prime Meridian"], 0, "Latitude is connected with the Equator."], ["Which symbol means degrees?", ["°", "′", "N", "W"], 0, "Degrees use the symbol °."], ["Which symbol means minutes?", ["°", "′", "N", "W"], 1, "Minutes use the symbol ′."], ["In 40° 44′ North, the coordinate is...", ["latitude", "longitude", "scale", "symbol"], 0, "North identifies latitude."], ["In 73° 59′ West, the coordinate is...", ["latitude", "longitude", "hemisphere", "scale"], 1, "West identifies longitude."], ["What is a projection?", ["a way of showing the round Earth on a flat map", "a map showing country borders", "a measuring line showing distance", "a sign standing for something else"], 0, "Projection shows the round Earth on a flat map."], ["What does distort mean?", ["to twist out of shape or change the size", "to organize information", "to move to settle", "to show directions"], 0, "Distort means to twist out of shape or change the size."], ["Why do maps distort land masses?", ["Earth is round and maps are flat", "maps include symbols", "maps use directions", "maps have keys"], 0, "Maps can distort because Earth is round and maps are flat."], ["Which map shows land and water features?", ["Physical Map", "Political Map", "Special-purpose Map", "Choropleth"], 0, "A Physical Map shows land and water features."], ["Which map shows the names and borders of countries?", ["Physical Map", "Political Map", "Special-purpose Map", "Choropleth"], 1, "A Political Map shows names and borders of countries."], ["Which map shows themes or patterns such as climate, natural resources, or population?", ["Physical Map", "Political Map", "Special-purpose Map", "Projection"], 2, "A Special-purpose Map shows themes or patterns."], ["Which map-reading feature shows distances?", ["Map key", "Compass rose", "Scale", "Symbol"], 2, "A scale shows distances on a map."], ["Which group contains the cardinal directions?", ["North, South, East, West", "Near, Far, High, Low", "Left, Right, Up, Down", "Land, Water, East, West"], 0, "Cardinal directions are north, south, east, and west."], ["What is a symbol?", ["a sign or image that stands for something else", "a measuring line for distance", "a flat-map method", "half of a globe"], 0, "A symbol is a sign or image that stands for something else."], ["Which map uses color to show population density?", ["Physical Map", "Political Map", "Choropleth", "Projection"], 2, "A choropleth uses color to show population density."], ["Charts, graphs, and diagrams are...", ["visual ways of organizing information", "map projections", "cardinal directions", "country borders"], 0, "They are visual ways of organizing information."], ["What is migration?", ["movement of people to settle in another place", "beliefs and traits of a group", "map distance", "change in shape"], 0, "Migration is movement of people from one place to settle in another."], ["What is culture?", ["beliefs, behaviors, and traits shared by a group", "movement to settle elsewhere", "a map scale", "an east/west line"], 0, "Culture is beliefs, behaviors, and traits shared by a group."], ["What is a theme?", ["a topic studied or a quality connecting ideas", "a map distance line", "population movement", "a country border"], 0, "Theme is a topic studied or a special quality connecting ideas."], ["What is awareness?", ["understanding or knowledge", "movement", "a color map", "half of a globe"], 0, "Awareness is understanding or knowledge."], ["A geographer asks “Where is it?” Which Essential Element fits?", ["World in Spatial Terms", "Places and Regions", "Human Systems", "Environment and Society"], 0, "World in Spatial Terms focuses on location."], ["A geographer asks “What is this place like?” Which Essential Element fits?", ["World in Spatial Terms", "Places and Regions", "Physical Systems", "The Uses of Geography"], 1, "Places and Regions focuses on characteristics."], ["Which Essential Element focuses on nature and systems that shape Earth's surface?", ["Physical Systems", "Human Systems", "Places and Regions", "The Uses of Geography"], 0, "Physical Systems focuses on nature."], ["Which Essential Element studies people, settlement, and movement of people, ideas, and goods?", ["Physical Systems", "Human Systems", "Environment and Society", "World in Spatial Terms"], 1, "Human Systems focuses on people and movement."], ["Which Essential Element studies people and their natural surroundings?", ["Environment and Society", "World in Spatial Terms", "Places and Regions", "Physical Systems"], 0, "Environment and Society studies people and natural surroundings."], ["Which Essential Element asks how geography helps us?", ["The Uses of Geography", "Human Systems", "Physical Systems", "Places and Regions"], 0, "The Uses of Geography focuses on how geography helps us."], ["Which memory pair is correct?", ["Latitude → Equator", "Latitude → Prime Meridian", "Longitude → Equator", "Culture → distance"], 0, "Latitude is paired with the Equator."], ["Which memory pair is correct?", ["Longitude → Prime Meridian", "Longitude → Equator", "Physical Map → borders", "Scale → culture"], 0, "Longitude is paired with the Prime Meridian."], ["Which map-reading tool helps explain symbols?", ["Map key", "Scale", "Compass rose", "Projection"], 0, "A map key helps explain symbols."], ["Which map-reading tool helps with direction?", ["Compass rose", "Scale", "Projection", "Culture"], 0, "A compass rose helps with direction."], ["A map about climate is most likely which type?", ["Special-purpose Map", "Political Map", "Physical Map", "Scale"], 0, "Climate is one of the themes shown by a Special-purpose Map."], ["A map about country borders is most likely which type?", ["Political Map", "Physical Map", "Special-purpose Map", "Latitude"], 0, "Political Maps show names and borders of countries."], ["A map about land and water features is most likely which type?", ["Physical Map", "Political Map", "Choropleth", "Theme"], 0, "Physical Maps show land and water features."], ["Geographers and historians both study which two ideas mentioned in this lesson?", ["Population and culture", "Projection and scale", "Latitude and longitude", "Theme and symbol"], 0, "The lesson says geographers and historians both study population and culture."], ["Which final memory line is correct?", ["Latitude → Equator; Longitude → Prime Meridian", "Latitude → borders; Longitude → culture", "Scale → people; Culture → distance", "Projection → migration"], 0, "Latitude connects with the Equator, while longitude connects with the Prime Meridian."]];

var si=0,qi=0,score=0,locked=false,missed=[];
var lesson=document.getElementById('lesson');
var quiz=document.getElementById('quiz');
var slide=document.getElementById('slide');
var statusEl=document.getElementById('slideStatus');
var bar=document.getElementById('bar');
var back=document.getElementById('back');
var next=document.getElementById('next');
var qStatus=document.getElementById('qStatus');
var qText=document.getElementById('qText');
var answers=document.getElementById('answers');
var feedback=document.getElementById('feedback');
var nextQ=document.getElementById('nextQ');
var scoreEl=document.getElementById('score');
var finalEl=document.getElementById('final');

function scrollTopSafe(){
  try{ window.scrollTo(0,0); }catch(e){}
}

function renderSlide(){
  var s=slides[si];
  slide.innerHTML='<h2>'+s.title+'</h2>'+s.body+
    '<div class="remember"><b>⭐ Remember</b><br><b>'+s.remember+'</b></div>';
  statusEl.textContent='Teaching Slide '+(si+1)+' of '+slides.length;
  bar.style.width=((si+1)/slides.length*100)+'%';
  back.disabled=(si===0);
  next.textContent=(si===slides.length-1)?'Start 40-Question Quiz →':'Next →';
  scrollTopSafe();
}

back.onclick=function(){
  if(si>0){ si--; renderSlide(); }
};

next.onclick=function(){
  if(si<slides.length-1){
    si++;
    renderSlide();
  }else{
    startQuiz();
  }
};

document.getElementById('restart').onclick=function(){
  si=0; qi=0; score=0; missed=[];
  lesson.style.display='block';
  quiz.style.display='none';
  renderSlide();
};

function startQuiz(){
  lesson.style.display='none';
  quiz.style.display='block';
  qi=0; score=0; missed=[];
  renderQ();
  scrollTopSafe();
}

function renderQ(){
  locked=false;
  feedback.textContent='';
  nextQ.style.display='none';
  finalEl.style.display='none';

  var q=questions[qi];
  qStatus.textContent='Question '+(qi+1)+' of 40 · '+(qi<15?'Easy':qi<30?'Medium':'Hard');
  qText.textContent=q[0];
  answers.innerHTML='';
  scoreEl.textContent='Score: '+score+'/'+qi;

  for(var idx=0;idx<q[1].length;idx++){
    addAnswerButton(q,idx);
  }
}

function addAnswerButton(q,idx){
  var b=document.createElement('button');
  b.className='ans';
  b.textContent=String.fromCharCode(65+idx)+'. '+q[1][idx];
  b.onclick=function(){ pick(idx,b); };
  answers.appendChild(b);
}

function pick(idx,btn){
  if(locked){ return; }
  locked=true;

  var q=questions[qi];
  var children=answers.children;
  for(var i=0;i<children.length;i++){
    children[i].disabled=true;
    if(i===q[2]){
      children[i].className+=' correct';
    }
  }

  if(idx===q[2]){
    score++;
    feedback.textContent='✅ Correct — '+q[3];
  }else{
    btn.className+=' wrong';
    missed.push(q[0]);
    feedback.textContent='❌ Incorrect — Correct answer: '+
      String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'. '+q[3];
  }

  scoreEl.textContent='Score: '+score+'/'+(qi+1);
  nextQ.textContent=(qi===39)?'See Final Report':'Next Question →';
  nextQ.style.display='block';
}

nextQ.onclick=function(){
  if(qi<39){
    qi++;
    renderQ();
    scrollTopSafe();
  }else{
    qStatus.textContent='Quiz Complete';
    qText.textContent='Final Report';
    answers.innerHTML='';
    feedback.textContent='';
    nextQ.style.display='none';
    finalEl.style.display='block';

    var pct=Math.round(score/40*100);
    var msg=(score>=36)?'Excellent!':
            (score>=30)?'Good job — review the missed concepts once more.':
                        'Review the Remember boxes and try again.';

    finalEl.innerHTML=
      '<div class="scorebig">'+score+'/40</div>'+
      '<h2>'+pct+'%</h2>'+
      '<p>'+msg+'</p>'+
      '<div class="remember"><b>Final Memory Strip</b><br>'+
      'Latitude → Equator → North/South<br>'+
      'Longitude → Prime Meridian → East/West<br>'+
      'Round Earth → Flat Map → Distortion<br>'+
      'Choropleth → COLOR → Population Density</div>'+
      '<p>Questions missed: <b>'+missed.length+'</b></p>';
  }
};

renderSlide();
</script>
</body></html>
